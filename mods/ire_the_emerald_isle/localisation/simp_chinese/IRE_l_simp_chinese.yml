 POLITICS_IRE_POLLITT_DESC:0 "哈利·波利特（1890-1960），大不列颠共产党总书记。红色的不列颠群岛，如今有了同一位舵手。"
 POLITICS_IRE_MOSLEY_DESC:0 "奥斯瓦尔德·莫斯利（1896-1980），不列颠法西斯联盟的男爵。皇冠与竖琴之下，帝国有了新主人。"
