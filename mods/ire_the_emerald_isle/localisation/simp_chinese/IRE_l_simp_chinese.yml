l_simp_chinese:
 IRE_communism:0 "爱尔兰社会主义共和国"
 IRE_communism_ADJ:0 "爱尔兰"
 IRE_fascism:0 "爱尔兰共和军临时政府"
 IRE_fascism_ADJ:0 "爱尔兰共和军"
 IRE_treatys_scar:0 "条约的伤疤"
 IRE_treatys_scar_desc:0 "1921年英爱条约留下的裂痕未合：自由邦名义上独立，其港口、关税与北方事务仍受伦敦约束。众议院每年就此辩论，议案屡次搁置。"
 IRE_diaspora:0 "大流散"
 IRE_diaspora_desc:0 "1845年大饥荒之后，数百万爱尔兰人远渡重洋，在美洲各口岸落脚，他们的后代散居城乡，仍按月向故乡汇款。侨务司于各领事馆设登记簿，凡愿通消息者皆可列名。"
 IRE_agrarian_poverty:0 "农业穷国"
 IRE_agrarian_poverty_desc:0 "除牧草与土豆之外，这个国家几乎造不出东西。工厂稀少，机器与零件依赖进口，工业品的账目长期逆差。工商部只能先维持现有作坊。"
 IRE_civil_war_embers:0 "内战余烬"
 IRE_civil_war_embers_desc:0 "1922年的兄弟相残结束了，枪声留下的伤口仍在乡间发炎。老兵组织照旧集会，被禁的葬礼照旧出殡，拒绝宣誓的人照旧不肯低头。都柏林每让一步，某个郡就多一场游行。"
 IRE_free_framework:0 "自由的框架"
 IRE_free_framework_desc:0 "英爱条约所设的机构先行运转：总督、行政会议与两院各就其位，关税与防务的条款逐项执行，法律顾问的释义分送各部。政府各部的编制表随之公布。"
 IRE_north_unintegrated:0 "北爱未整合"
 IRE_north_unintegrated_desc:0 "六郡问题仍未解决。贝尔法斯特的工厂、税关与地方议会另成一套，都柏林的政令至此为止，往来文书须经两地衙门转递。两地关税仍各自征收。"
 IRE_sectarian_rift:0 "宗派裂痕"
 IRE_sectarian_rift_desc:0 "以铁腕压下教派分歧，集会与游行须经批准，报纸送审后方可发行。分歧转入地下，联络以口信传递，警备队按区划布防，边境哨所加派岗哨。"
 IRE_rural_electrification:0 "农村电气化"
 IRE_rural_electrification_desc:0 "电线杆沿乡间道路立起，电力供应局的工程队逐村架线。农家接入电网，费用由地方税项分摊，工程进度按县公布。农户按用电量缴费，欠缴者由县议会催收。"
 IRE_anglo_irish_beef:0 "对英牛肉出口"
 IRE_anglo_irish_beef_desc:0 "英国的肉类供应依赖爱尔兰的牲畜与冷藏船，贸易部按长期合同收购。配额与价格由两国委员会逐年议定，出口许可另行列册。"
 IRE_republican_constitution:0 "共和宪法"
 IRE_republican_constitution_desc:0 "1937年宪法确立总统职位，国家在法律上成为共和国。宪法文本经全民公决通过，总统由直接选举产生，总理仍对众议院负责。"
 IRE_free_country:0 "自由的国家"
 IRE_free_country_desc:0 "1949年4月18日，爱尔兰正式脱离英联邦，共和国的名号在外交文书与护照上同时启用。各驻外使团当日换发国书，英联邦内的旧协定按清单废止。"
 IRE_atlantic_bloodline:0 "跨海血脉"
 IRE_atlantic_bloodline_desc:0 "自科克至波士顿，同一面绿旗在诸港口升起。侨民团体以募捐与航运相助，都柏林设侨务处统一接洽。往来函件与捐款清册归档备查。"
 IRE_green_flag_post:0 "绿旗联络站"
 IRE_green_flag_post_desc:0 "侨民社团在美洲各城市设立联络站，登记志愿人员与捐款。外交部领事司核发证明，名册与账目按季度汇总送回都柏林，并由领事馆核阅。"
 IRE_diaspora_fund:0 "流散基金"
 IRE_diaspora_fund_desc:0 "都柏林的账户每月都收到来自海外的汇款，数额逐季上修。款项由财政部侨汇处登记入账，分拨给救济、教育与地方工程三项用途。"
 IRE_saint_patrick_name:0 "圣帕特里克之名"
 IRE_saint_patrick_name_desc:0 "此名本身即为号召，为其而战者不限于爱尔兰。教会已允以圣帕特里克之名授旗，招募站设于都柏林与波士顿，应募者按团队编制入册。"
 IRE_atlantic_bloodline_2:0 "大西洋血脉"
 IRE_atlantic_bloodline_2_desc:0 "大西洋不再是屏障。航线由海运处统一排定，客货与邮袋按期往返，港口检疫与关务同时办理。侨民往来免验手续另定，航次表报工商部备案。"
 IRE_celtic_world:0 "凯尔特世界"
 IRE_celtic_world_desc:0 "爱尔兰裔聚居地分处各地，经侨民事务处联成网络。联络站传递消息与款项，各地代表按年集会，账目由领事馆核阅。遇有要事，由领事转递。"
 IRE_washingtons_friend:0 "华盛顿的朋友"
 IRE_washingtons_friend_desc:0 "国会山上的爱尔兰裔议员按选区组织小组，就爱尔兰事务向国务院递送备忘录，人选与议程由驻华盛顿公使按月呈报。备忘录的副本送交国务院归档。"
 IRE_southern_supply_line:0 "南方补给线"
 IRE_southern_supply_line_desc:0 "自布宜诺斯艾利斯启运的货船绕过半个地球抵达科克，装载谷物、皮革与药品。船期由驻当地领事馆安排，卸货后经铁路分运各地。"
 IRE_transatlantic_supply:0 "跨大西洋补给网"
 IRE_transatlantic_supply_desc:0 "跨大西洋补给线已经设立。各口岸设转运站，船期与仓储由航运局统一编排，运量月报呈海军部，缺额由备用舱位补足，返程按需配载。"
 IRE_final_ascension:0 "新世界的主人"
 IRE_final_ascension_desc:0 "爱尔兰的旗帜在大西洋两岸同时升起。外交部与侨民事务处接办各地庆祝活动的登记，公告在政府公报刊布，各地领事馆负责接待。"
 IRE_emergency_powers:0 "紧急状态"
 IRE_emergency_powers_desc:0 "众议院通过紧急权力法，都柏林依此法管制物价、征用港口与铁路。各部按周向国防会议报告，命令以政府公报公布。违令案件由特别刑事法庭审理。"
 IRE_lookout_post:0 "瞭望哨"
 IRE_lookout_post_desc:0 "海岸线上的每一处哨所都按班次瞭望，船只、飞机与潜望镜的动向逐条记入值班簿，每日汇总至海军情报处。哨所之间以电话联络，遇浓雾改用信号灯。"
 IRE_moral_neutrality_idea:0 "道义中立"
 IRE_moral_neutrality_idea_desc:0 "政府维持不参战立场，同时按既定渠道向一方提供便利：护航情报、气象通报与劳工输出均照此办理。外交部对各方口径一致。"
 IRE_armed_neutrality_idea:0 "武装中立"
 IRE_armed_neutrality_idea_desc:0 "中立不等于不设防。国防部按海岸段设防，常备军保持戒备，地方防卫队按期集训。军费单列于预算，装备采购经财政部核准后办理。"
 IRE_absolute_neutrality_idea:0 "绝对中立"
 IRE_absolute_neutrality_idea_desc:0 "对谁都做生意，对谁都不表态。贸易部按此办理进出口许可，外交部对交战各方一律以相同措辞复照，来往文书编号存卷，答复期限一律相同。"
 IRE_moral_arbiter:0 "中立的仲裁者"
 IRE_moral_arbiter_desc:0 "战事拖长，交战各国相继请都柏林出面调停。外交部设仲裁事务科，收存各方提案，并按中立惯例安排会谈地点与文书格式。"
 IRE_haaland_wolff:0 "哈兰德与沃尔夫船坞"
 IRE_haaland_wolff_desc:0 "哈兰德与沃尔夫公司的船坞承接爱尔兰的订单，钢板与锅炉由本地工厂供给，交船期限按合同分年排定。技术工人自贝尔法斯特与克莱德河两岸雇募。"
 IRE_reserve_defence:0 "后备国防军"
 IRE_reserve_defence_desc:0 "一支平时务农、应征时持枪的部队，按郡编成营队，每年集中训练两周，点名与操演记录送军区备查。军官由退役军官充任，装备存于各县军械库。"

 IRE_focus_tree:0 "翡翠岛的抉择"
 IRE_border_plebiscite:0 "边境公投"
 IRE_border_plebiscite_desc:0 "政府决定不待条约程序，直接向北方发起公投。此议与1921年协议不符，司法部拟具法律意见，公投令由总理府颁布。各郡选举登记册已着手重编。"
 IRE_consolidate_free_state:0 "自由邦的巩固"
 IRE_consolidate_free_state_desc:0 "政府把工作次序定为先整顿内政：税制、电力与铁路列入首批，国防开支暂按现有规模维持。各部按此编制年度计划。首批工程由公共工程局承建，进度按季考核。"
 IRE_common_galway:0 "戈尔韦船坞"
 IRE_common_galway_desc:0 "西海岸的戈尔韦拥有天然深水良港。港口疏浚与码头扩建列入公共工程，铁路支线同时接驳，起重设备与仓库一并添置。航运与仓储由工商部统筹。"
 IRE_common_rural:0 "农村电气化"
 IRE_common_rural_desc:0 "把电送进每一座农舍。农村电气化由电力供应委员会分区施工，线路、变电站与配给办法一并颁行。电杆与变压器就地征购，进度按郡上报工商部。"
 IRE_common_dublin_uni:0 "圣三一学院的研究"
 IRE_common_dublin_uni_desc:0 "圣三一学院的实验室与书库集中了这个国家的研究力量。教育部增设奖学金与研究补助，设备采购单列，外籍教员另行聘定。成果按年汇编，送工商部备查。"
 IRE_common_tobacco:0 "烟草原产地"
 IRE_common_tobacco_desc:0 "南部的烟草与畜牧产品是换取外汇的主要货物。收购按季定价，检验与仓储由农业部办理，出口配额由工商部核定。单据经海关核销后结汇，账目按月上报。"
 IRE_common_signals:0 "情报与密码"
 IRE_common_signals_desc:0 "小国要在列强之间生存，须先掌握消息。邮电部与陆军通信处合办监听站，密码组自军中抽调，译电与归档另有章程。所得情报按日呈报国防部。"
 IRE_common_arms:0 "军工初创"
 IRE_common_arms_desc:0 "第一批军工厂在都柏林郊外动工。厂址、设备与技工由国防部会同工商部选定，生产线按图纸分厂设置，警卫与仓储另派。投产日期报内阁，产量按月考核。"
 IRE_A_revitalise:0 "翡翠岛重整"
 IRE_A_revitalise_desc:0 "公共工程部已核准乡村重建计划，各地校舍、诊所与排灌工程陆续开工。款项由地方议会先行垫付，年终造册报财政部核销。"
 IRE_A_shannon:0 "香农河水电"
 IRE_A_shannon_desc:0 "香农河水电站于1929年建成，现由电力供应委员会运营。董事会已核准增设机组，并将输电线路的征地清单送财政部审核。"
 IRE_A_reserves:0 "后备国防军"
 IRE_A_reserves_desc:0 "国防部已将地方志愿队编入预备役名册，各县设训练营，每年集中点验一次。名册与武器清册一并送总参谋部归档，点验结果按县计分上报。"
 IRE_A_belfast:0 "贝尔法斯特整合"
 IRE_A_belfast_desc:0 "哈兰德与沃尔夫船坞已改由工业部派员接管，船台排期按海军订单重排。工人名册与钢材配额报部备案，账目另由审计处逐季核讫。"
 IRE_A_emergency:0 "大西洋紧急状态"
 IRE_A_emergency_desc:0 "战争已扩及大西洋。众议院通过紧急权力法，全国进入紧急状态；内阁接管港口、铁路与电报，并向各县下达动员令。法案有效期逐年审议。"
 IRE_A_remittance:0 "侨汇与爱国公债"
 IRE_A_remittance_desc:0 "大萧条之后，美洲爱尔兰裔的汇款成为都柏林最稳定的外汇来源。财政部已发行爱国公债，指定纽约与波士顿的银行办理认购与结算。"
 IRE_A_volunteer_corps:0 "志愿军团"
 IRE_A_volunteer_corps_desc:0 "国防部不再等待征召令，地方军与退役老兵按县编成守备队，分段负责海岸与边境。编制表与哨位图下发各军区，点验结果按月汇总。"
 IRE_A_wartime_economy:0 "战时经济动员"
 IRE_A_wartime_economy_desc:0 "工业部将工厂转入军需生产，农业部按配额收购粮食。物价、运价与工时由经济战时委员会核定，月度报表径送内阁，超额部分另行核价。"
 IRE_A_atlantic_wall:0 "大西洋防线"
 IRE_A_atlantic_wall_desc:0 "从多尼戈尔到科克，海岸炮台、瞭望哨与声呐站按段划归各军区。工程由工兵总监督办，竣工图与火力配系表报国防部备案。"
 IRE_A_ulster_bulwark:0 "厄尔斯特壁垒"
 IRE_A_ulster_bulwark_desc:0 "都柏林已在纽里—邓多克一线构筑工事，反坦克障碍与掩体由工兵分段施工。沿线桥梁列入爆破预案，交北方军区保管，每季演练一次。"
 IRE_A_britain_war_plan:0 "对英战争预案"
 IRE_A_britain_war_plan_desc:0 "总参谋部已就对英作战完成推演：北方军区守厄尔斯特，东部军区迟滞登陆，主力待海外援兵到达后转入反攻。方案编号入档。"
 IRE_A_fortress_ireland:0 "翡翠堡垒"
 IRE_A_fortress_ireland_desc:0 "岛屿要塞化工程已经验收。海岸炮台、机场与弹药库移交各军区管理，防空哨纳入统一警报网，值班表由总参谋部核定，每季校阅。"
 IRE_remittance_economy:0 "侨汇经济"
 IRE_remittance_economy_desc:0 "来自波士顿、纽约与布宜诺斯艾利斯的汇款支撑着都柏林的国库。邮政与银行按季结算，侨汇兑付由财政部担保，账目列入国际收支。"
 IRE_volunteer_corps:0 "志愿军团"
 IRE_volunteer_corps_desc:0 "地方志愿部队整编为预备役，填补正规军空缺。编制表由国防部核定，训练与点验归各军区承办，武器由军械署按册发放，缺额由民兵仓库补足。"
 IRE_wartime_economy:0 "战时经济"
 IRE_wartime_economy_desc:0 "内阁援引紧急状态法接管关键工厂、码头与配给体系，生产计划由经济部统一编制，原料按军需次序分配。各行业工会派代表列席监督委员会。"
 IRE_atlantic_wall:0 "大西洋防线"
 IRE_atlantic_wall_desc:0 "海岸要塞、瞭望哨与反潜巡逻构成环形防御。防区按海岸段划分，观测所与炮台互为支援，夜间值勤另派巡逻艇。值勤日志由海岸管制站汇总上报。"
 IRE_ulster_bulwark:0 "厄尔斯特壁垒"
 IRE_ulster_bulwark_desc:0 "面向不列颠方向的永备工事沿主要港口与桥梁构筑，动员体系按县分区，仓库、集结点与征用名册由国防部统一编定。工事图纸经参谋部核签。"
 IRE_britain_war_plan:0 "对英战争预案"
 IRE_britain_war_plan_desc:0 "针对英国登陆与封锁的作战计划已下发各师参谋部，含海岸守备区划、预备队调拨与港口破坏清单。各师按图演习，结果按月回报。"
 IRE_fortress_ireland:0 "翡翠堡垒"
 IRE_fortress_ireland_desc:0 "全岛按要塞区划设防，海岸与内地渡口列入工事清单。国防部督造掩体与炮位，地方防卫军分区守备，弹药储备前推至各要塞。"
 IRE_A_reconciliation:0 "温和治理"
 IRE_A_reconciliation_desc:0 "六郡事务交由议会、工会与地方自治机构分头办理。都柏林不设特别管制，北方工厂照常开工；政策要点通令各部执行，执行情形按季汇报。可与《重谈条约》并存。"
 IRE_A_firm_integration:0 "强硬统治"
 IRE_A_firm_integration_desc:0 "六郡须无条件接受都柏林的政令。内阁设北方事务专员，接管警务与税收，地方议会改为顾问性质，命令由总督署颁布，按月呈报施政情形。可与《重谈条约》并存。"
 IRE_A_london_note:0 "重谈条约"
 IRE_A_london_note_desc:0 "外交部已向伦敦递交照会，要求就1921年条约重开谈判。谈判底线经内阁核定，代表团名单与授权书送众议院备查，议事日程另行公布。"
 IRE_A_settle_treaty:0 "清算条约"
 IRE_A_settle_treaty_desc:0 "1921年条约遗留的争议条款已由两国换文了结。外交部撤销相关保留，财政部解除对英结算限制，联合政府得以重组，换文副本存于国玺处。"
 IRE_A_treaty_ports:0 "条约港归还"
 IRE_A_treaty_ports_desc:0 "1938年，英国归还三个条约港。海军部随即接收码头与储油设施，设海岸防御司令部，港口移交清单存入外交部档案，防务交接另行点验。"
 IRE_A_atlantic_call:0 "大西洋的呼唤"
 IRE_A_atlantic_call_desc:0 "海洋不是边界，而是通道。海军部已将跨大西洋航线列为国家利益线，护航、气象与通信各设专署，年度报告径送内阁，航线图按季修订。"
 IRE_A_diaspora_legacy:0 "大流散的遗产"
 IRE_A_diaspora_legacy_desc:0 "侨务局已开始编制海外爱尔兰裔名册，按教区与社团分卷登记。名册供外交部与贸易部查考，副本存都柏林档案馆，每五年重编一次。"
 IRE_A_newfoundland:0 "纽芬兰的渔火"
 IRE_A_newfoundland_desc:0 "1934年，纽芬兰因财政破产放弃自治，改由伦敦派总督直接管辖。外交部已设纽芬兰科，收集财政与渔业资料备查，并按月编送简报。"
 IRE_A_nf_plebiscite:0 "自治领公投"
 IRE_A_nf_plebiscite_desc:0 "圣约翰斯的渔民将就归属问题投票。渔业兄弟会的网络已铺到每一处渔村，登记册由兄弟会代管；投票日与计票程序由总督署公告。"
 IRE_nf_support_50:0 "渔民保护联盟"
 IRE_nf_support_50_desc:0 "在纽芬兰的每一处渔村建立联络，沿用威廉·库克当年组织渔民保护联盟的办法。库克去世已二十年，其组织仍在，只是换了名称。"
 IRE_A_nf_province:0 "第三十三郡"
 IRE_A_nf_province_desc:0 "纽芬兰全境并入爱尔兰，列为第三十三个郡。总督署改为郡政厅，渔业与海关人员留任，国会为其分配议席，法案已送参议院。"
 IRE_A_boston:0 "波士顿的绿旗"
 IRE_A_boston_desc:0 "波士顿与纽约的爱尔兰裔家族长期把持地方党务。侨务局已与其中数家建立联系，选情与捐款名册按月报送外交部，来往函件另行归档。"
 IRE_A_lobby:0 "爱尔兰裔游说团"
 IRE_A_lobby_desc:0 "众议院外交委员会已核准在华盛顿设常设办事处，聘用当地律师与报人。经费列入年度预算，工作月报径送外交部，聘约副本存委员会。"
 IRE_A_irish_division:0 "租借的爱尔兰师"
 IRE_A_irish_division_desc:0 "侨务局在美东各州设招募站，登记愿回故乡服役的青年。体检与输送由外交部会同国防部办理，名册分批送交军区，入伍者按正规军发饷。"
 IRE_A_san_patricio:0 "圣帕特里克营"
 IRE_A_san_patricio_desc:0 "1846年，一批爱尔兰裔美军逃兵为墨西哥作战，墨西哥至今奉之为英雄。外交部已就此向墨西哥城致意，并商谈后裔居留事宜。"
 IRE_A_green_legion:0 "绿旗军团"
 IRE_A_green_legion_desc:0 "国防部以圣帕特里克之名组建军团，招募侨民与退役老兵。编制、军饷与驻地已定，团旗由教会祝圣后授予，各营按周操演，名册报总参谋部。"
 IRE_A_buenos_aires:0 "布宜诺斯艾利斯的绿草地"
 IRE_A_buenos_aires_desc:0 "布宜诺斯艾利斯的爱尔兰裔社区是南美最大的一支。贸易部已派商务专员常驻，就牛肉与小麦的采购与当地商行接洽，成交情形按月报部。"
 IRE_A_southern_cone:0 "南锥体补给线"
 IRE_A_southern_cone_desc:0 "从南美绕行的航线已列入海军部航线图。加煤站与淡水补给点由当地领事代办，船期与护航安排按月报部，航路图另附补给清单。"
 IRE_A_supply_web:0 "跨大西洋补给网"
 IRE_A_supply_web_desc:0 "散落各处的支线已由航运局并为一网，总调度室设于科克。船期、仓位与仓储统一编排，各地代办按周上报运量，亏舱另册登记。"
 IRE_A_celtic_commonwealth:0 "凯尔特联邦"
 IRE_A_celtic_commonwealth_desc:0 "从都柏林到圣约翰斯，从波士顿到布宜诺斯艾利斯，各侨团已派代表常驻都柏林。联络处设于外交部，按季开会，议定章程。"
 IRE_A_masters_new_world:0 "新世界的纽带"
 IRE_A_masters_new_world_desc:0 "大西洋两岸的爱尔兰人已归入同一套侨务与航运体系。各口岸设代办，护照、汇款与货运按同一章程办理，年报送内阁，章程修改须经会议。"
 IRE_B_civil_service:0 "公务员制度改革"
 IRE_B_civil_service_desc:0 "文官考选委员会接管各部人事，录用以公开考试为准，任免记录一并归档。各部奉命统一公文格式与编号，年度报告按期送交财政部核阅。"
 IRE_B_quell_embers:0 "平息内战余烬"
 IRE_B_quell_embers_desc:0 "1922年内战留下的裂痕仍记在内政部档案里。政府按县份登记损失，抚恤金由地方委员会核定发放，前敌对双方人员编入同一份复员名册，交由民政部门归档。"
 IRE_B_outlaw_ira:0 "取缔IRA"
 IRE_B_outlaw_ira_desc:0 "1936年，德·瓦莱拉政府依宪法程序宣布IRA为非法组织，内政部据此查封其出版物与集会场所，特别刑事法庭受理相关案件，判决书存入司法部档案。"
 IRE_B_tolerate_ira:0 "容忍IRA"
 IRE_B_tolerate_ira_desc:0 "内政部对IRA的活动维持监视而不加取缔。警务报告按月送交部长，涉案人员名单另立卷宗，由特别分局保管，不列入公开记录。"
 IRE_B_economic_war_end:0 "经济战争的终结"
 IRE_B_economic_war_end_desc:0 "1932年至1938年的英爱关税战使两国贸易大幅缩减。财政部与英国商务部就牲畜、煤炭与制成品的税率重开谈判，协定草案已送交众议院审议。"
 IRE_B_trade_agreement:0 "英爱贸易协定"
 IRE_B_trade_agreement_desc:0 "1938年协定在伦敦签署，爱尔兰农产品获得英国市场准入，工业品关税相应下调。工商部奉命编制出口配额表，协定文本送交众议院批准。"
 IRE_B_land_annuities:0 "土地年金清算"
 IRE_B_land_annuities_desc:0 "土地年金争端以一次性付款了结，财政部据此停止向伦敦移交年度款项。结算清单由主计长核验，相关账目并入国家债务册，各郡的征收册随之注销。"
 IRE_B_treaty_ports:0 "条约港的归还"
 IRE_B_treaty_ports_desc:0 "1938年，英国将科克港、贝雷哈文与斯威利湾三处条约港移交爱尔兰。国防部接管码头与要塞，海军服务处派驻守备队，移交清单在都柏林与伦敦同时归档。"
 IRE_B_constitution_1937:0 "1937年宪法"
 IRE_B_constitution_1937_desc:0 "1937年宪法经全民公投通过，设立总统职位与总理府，废除总督职权。众议院表决后，条文刊布于政府公报，各郡法院据此更换宣誓格式。"
 IRE_B_president_mace:0 "总统的权杖"
 IRE_B_president_mace_desc:0 "总统府依宪法设立，礼仪职能之外，总统在议会僵局时行使咨询与任命权。典礼局拟定的仪注送交内阁核准，年度日程排入政府公报。"
 IRE_B_emergency:0 "紧急状态宣言"
 IRE_B_emergency_desc:0 "1939年9月，众议院通过紧急权力法，国家进入紧急状态。内阁获授权管制物价、征用运输与港口，各部按周向国防会议提交报告。"
 IRE_B_coastal:0 "海岸防卫"
 IRE_B_coastal_desc:0 "海岸监视哨沿西部与南部海岸设立，地方防卫军担任瞭望与报信。国防部划定警戒区，船只通行须经港务当局许可，信号规程下发各哨所。"
 IRE_B_ldf:0 "地方防卫军"
 IRE_B_ldf_desc:0 "地方防卫军按郡组建，志愿者在本地受训，装备由国防部仓库配发。名册交税务所保管，动员令下达时按册征召，训练日程排入季度报告。"
 IRE_B_plan_w:0 "W计划"
 IRE_B_plan_w_desc:0 "英爱两军参谋在伦敦与都柏林之间交换防务计划，约定德军登陆时的联络程序与兵力调配。文件由G2与帝国总参谋部各存一份，不作公开。"
 IRE_B_moral_neutrality:0 "道义中立"
 IRE_B_moral_neutrality_desc:0 "政府维持中立的法律地位，同时在广播与报纸上表明立场。外交部准许盟军飞行员过境，德军人员一律拘留，宣传司按月编印对外简报。"
 IRE_B_absolute_neutrality:0 "严格中立"
 IRE_B_absolute_neutrality_desc:0 "都柏林对交战国一视同仁地发放贸易许可，进出口由供给部统一登记。德瓦莱拉在众议院称此项政策为严格中立，外交部照会各国使馆。"
 IRE_B_armed_neutrality:0 "武装中立"
 IRE_B_armed_neutrality_desc:0 "国防部扩充常备军与预备役，海岸与机场列入设防清单。参谋部拟定敌军登陆时的应对方案，军械署按季度盘点弹药储备，各军区据此调整编制。"
 IRE_B_shannon_wayfarers:0 "香农机场的过客"
 IRE_B_shannon_wayfarers_desc:0 "香农机场的迫降人员由航空管制站登记，盟军飞行员经北爱尔兰边境移交，德军人员送入拘留营。福因斯的飞艇码头设旅客接待处，滞留者由红十字会照料。"
 IRE_B_dublin_choice:0 "都柏林的抉择"
 IRE_B_dublin_choice_desc:0 "德军进入低地国家后，内阁连续三日开会。外交部备妥三份照会稿，分别对应参战、中立与结盟，总理定稿后送交众议院，议题列入当周议程。"
 IRE_B_berlin_overture:0 "柏林的试探"
 IRE_B_berlin_overture_desc:0 "德国情报机构经IRA转来联络请求，外交部与G2同时收到副本。内阁设立小组评估风险，答复由总理府拟定，交驻柏林代办转达。"
 IRE_B_famine_echo:0 "饥饿的回声"
 IRE_B_famine_echo_desc:0 "1945年后，美国援款经红十字会与教会渠道进入爱尔兰，用于乡村住房与救济。财政部设专账登记，年度支出报告送交众议院审查。"
 IRE_B_republic_1949:0 "1949年共和国法案"
 IRE_B_republic_1949_desc:0 "1949年4月18日，爱尔兰共和国法生效，爱尔兰脱离英联邦。外交部更换驻外使馆的国书格式，联邦关系司并入欧洲司，档案移交国家档案馆。"
 IRE_B_moral_authority:0 "道义的权威"
 IRE_B_moral_authority_desc:0 "战后，都柏林以未参战国身份参加欧洲重建会议，主持救济与难民事务的分组。外交部接办各国委托的调停请求，会议记录在公报上刊布。"
 IRE_B_final_unification:0 "最后的统一"
 IRE_B_final_unification_desc:0 "北方以公投与议会决议的方式并入爱尔兰，边界委员会完成勘定。都柏林接管各郡行政，警备与税务按分区依次交接，文书存入国家档案。"

 ire.1.t:0 "北方六郡的公投"
 ire.1.d:0 "贝尔法斯特街头人潮不散。投票箱在一座废弃纺织厂内开启，计票员的手不住发抖。三十年来第一次，北方六郡的居民被问及归属。\n\n入夜前，首批票箱送入市政厅。窗外雨未停，人群亦未散，警力沿街布防至天明。"
 ire.1.a:0 "接纳六郡归入共和国"
 ire.1.b:0 "宣布公投无效，暂缓处理"
 ire.2.t:0 "白厅的抗议照会"
 ire.2.d:0 "白厅的反应比预想的快。一份措辞严厉的照会送到都柏林，称此次公投严重违反1921年条约的精神。外交部已复文，声明公投出于民意；照会与复文一并送众议院备查，白厅尚未召回公使，双方均称谈判之门未闭。"
 ire.2.a:0 "拒绝接受英方抗议"
 ire.10.t:0 "圣约翰斯的选择"
 ire.10.d:0 "纽芬兰的渔民代表在圣约翰斯港集合，公投请愿书已按选区造册，交渔业兄弟会的联络人保管。都柏林收到的报告称，伦敦正专注于战事，对岛上事务的处置有所松弛。请愿书递送日期未定，外交部请示如何答复。"
 ire.10.a:0 "递交公投请愿"
 ire.10.b:0 "以国运为押注"
 ire.10.a_tt:0 "英国已参战，或支持度高于 79——公投必将通过，纽芬兰将和平并入。"
 ire.20.t:0 "一位飞行员的遣返"
 ire.20.d:0 "一架英国战斗机迫降在香农河畔的草地上，飞行员被带至当地警局，做了笔录，饮茶后留宿一夜。次日清晨，他被人引至边境一侧，未办移交手续。警局原始记录已按例上报，当地报纸未获准采访，外交部亦未发布通报。"
 ire.20.a:0 "称无记录可查"
 ire.30.t:0 "北方六郡的移交"
 ire.30.d:0 "没有枪声，也没有最后通牒。一支爱尔兰军队在贝尔法斯特郊外停下，按事先议定的程序等待移交仪式。六郡的行政、警政与税务在数日内完成交接，英国驻军依约登船撤离，都柏林派出的接收官员随军入城。"
 ire.30.a:0 "追认移交结果"
 ire.40.t:0 "流散侨民的回应"
 ire.40.d:0 "美洲的爱尔兰裔社区开始自发募捐，一批批物资正运往都柏林。教会、工会与县会各设委员会劝募，款项经银行汇入财政部专户，物资由海关验放后交红十字会分配。捐款清册已在都柏林公布，分配由教会代表会同监理。"
 ire.40.a:0 "接受侨民捐助。"
 ire.50.t:0 "圣帕特里克日"
 ire.50.d:0 "3月17日。都柏林的教堂鸣钟，各教区按旧例举行游行，政府机关放假一日。海外侨社同日集会，电报与贺函陆续送到总理府。外交部按年例向各驻外使团发出通函，嘱其照料当地爱尔兰人的庆典。都柏林城堡当晚设宴，各部部长按例出席。"
 ire.50.a:0 "为圣帕特里克干杯。"

 IRE_unity_campaign_cat:0 "统一宣传运动"
 IRE_unity_campaign:0 "发起统一宣传"
 IRE_unity_campaign_desc:0 "在北方与海外组织集会、募捐与宣传。各郡设委员会承办，讲稿与传单由宣传处统稿，旅费与场地费另列预算。活动日程报内务部备案。"
 IRE_diaspora_cat:0 "海外网络"
 IRE_overseas_promotion:0 "海外宣传"
 IRE_overseas_promotion_desc:0 "外交部与侨务司在美洲爱尔兰裔社区开展宣传，刊物、广播与巡回演讲并行，各地侨社按月报送活动与舆情。刊物的稿件须经外交部审阅。"
 IRE_newfoundland_cat:0 "纽芬兰事务"
 IRE_fisher_brotherhood:0 "渔民兄弟会"
 IRE_fisher_brotherhood_desc:0 "在纽芬兰的渔村设立联络点，以渔业兄弟会的名义登记船员与网具，顺带传递消息。各港指定一名联系人，名册由都柏林保管。"
 IRE_neutral_cat:0 "中立事务"
 IRE_moral_appeal:0 "道义呼吁"
 IRE_moral_appeal_desc:0 "政府通过驻外使馆与广播向各国议会、教会与报界发出呼吁，说明爱尔兰的立场。文本译成数种文字，由新闻处统一散发。各国报馆的评论由使馆汇编回报。"
 IRE_weather_forecast:0 "天气预报共享"
 IRE_weather_forecast_desc:0 "把大西洋的气象数据悄悄交给伦敦。观测站按日编报，报文经外交部信使转交，双方约定不作公开。这不算参战，往来亦不列入战报。"
 IRE_smuggling:0 "走私贸易"
 IRE_smuggling_desc:0 "向交战双方同时出口物资。货物经偏僻码头转运，单据另做一套。财政部与海关对此不加追问，收入记入特别账目，风险由承运人自负。"
 IRE_convoy_cat:0 "大西洋航线"
 IRE_atlantic_convoy:0 "跨大西洋护航"
 IRE_atlantic_convoy_desc:0 "组织船团护航，保障跨洋航线。船团按航速编组，护航舰分段交接，遇袭时按预定信号集中。航次与损耗由海运处登记后上报海军参谋处。"

 IRE_agrarian_poverty_lite:0 "农业穷国（缓和）"
 IRE_agrarian_poverty_lite_desc:0 "关税战结束后，牧草之外总算有了别的生意，工厂却依然稀少。出口仍以牲畜与农产品为主，工业品多半靠进口，工商部按季核对贸易账目。"
 IRE_settled_treaty:0 "清算的条约"
 IRE_settled_treaty_desc:0 "1921年留下的账已经算清。财政部解除对英结算限制，外交部撤销保留条款，都柏林得以从容调度，条约文本重印分发各部。"
 IRE_british_sanctions:0 "英国贸易制裁"
 IRE_british_sanctions_desc:0 "白厅的报复比预想的精准，爱尔兰出口被卡在港口。贸易部已改由科克与戈尔韦装船，损失清单送财政部核销，改道费用另列专款。"
 IRE_san_patricio_elite:0 "圣帕特里克营"
 IRE_san_patricio_elite_desc:0 "这支部队以1846年墨西哥战场上的圣帕特里克营命名，编制、操典与旗号沿其旧制，兵员自各旅挑选，训练在库里奇营地集中办理。"
 IRE_newfoundland_fisheries:0 "纽芬兰渔场"
 IRE_newfoundland_fisheries_desc:0 "圣约翰斯外海的鳕鱼场由渔业兄弟会组织捕捞，渔获经冷藏船运回本土并部分出口。配额与船数由都柏林核定，税项按年征收。"
 IRE_fisher_brotherhood_idea:0 "渔民兄弟会"
 IRE_fisher_brotherhood_idea_desc:0 "自戈尔韦至圣约翰斯，各渔村均设联络人，以渔汛与收购为名往来，信件经渔船转递。名单不落文字，仅以口传，都柏林按季核对，缺员即补。"
 IRE_south_american_trade:0 "南美农产品贸易"
 IRE_south_american_trade_desc:0 "潘帕斯的牛肉与小麦经布宜诺斯艾利斯装船，换回都柏林所需的机器与原料，合同由商务部与阿根廷出口商按季签订，结算走英镑。"
 IRE_joint_defence_idea:0 "联合防务协调"
 IRE_joint_defence_idea_desc:0 "英爱两军参谋在地图上标绘同一条防线。联络官常驻对方司令部，演习计划由双方会同拟定，文件不作公开，防备方向以西部海岸为主。"
 IRE_emergency_powers_2:0 "紧急状态（二级）"
 IRE_emergency_powers_2_desc:0 "海上动静日近，都柏林将警戒线推至沙滩。海岸监视哨增设岗哨，港务当局奉令登记进出船只，地方防卫军进入待命。港务当局按班期核对进出船只。"
 IRE_emergency_powers_3:0 "紧急状态（三级）"
 IRE_emergency_powers_3_desc:0 "战火已及门户，政府将人力与物资统一调配。供给部接管库存，工厂转产军需，各部按国防会议的配额执行，征用清单逐项登记。"

 IRE_overseas_recruit:0 "海外募兵"
 IRE_overseas_recruit_desc:0 "在波士顿、芝加哥与布宜诺斯艾利斯的爱尔兰裔社区设点募兵，登记、体检与船票由领事馆代办，愿回来的人远比预想为多，名册分批送回都柏林。"
 IRE_overseas_fundraising:0 "海外募捐"
 IRE_overseas_fundraising_desc:0 "侨民的汇款比侨民本人来得更快，财政部侨汇处逐月登记，汇款单积成卷宗，都柏林的预算有一半靠它周转。侨社按季报送募款清单。"
 IRE_interfaith_dialogue:0 "跨教派对话"
 IRE_interfaith_dialogue_desc:0 "天主教与新教的代表在同一张桌前会商。宗教事务处安排议程，会谈记录分送两方教会，下次会期已经排定。会场由宗教事务处布置，双方各派书记一人记录。"
 IRE_dublin_order:0 "都柏林的秩序"
 IRE_dublin_order_desc:0 "宪兵队开进贝尔法斯特的街道，按搜查令逐户检查，逮捕名单由军事法庭签发。宵禁自黄昏起执行，各区设岗盘查。各区专员每周向参谋部报送拘押与搜查数目。"
 IRE_south_america_purchase:0 "南美采购"
 IRE_south_america_purchase_desc:0 "商务部以牛肉合同换取阿根廷仓库中的一批美式步枪，枪械经海关查验后移交国防部，随枪的弹药与备件另列清单。价款以牛肉分期折抵。"
 IRE_transatlantic_expedition:0 "跨大西洋远征"
 IRE_transatlantic_expedition_desc:0 "把军队投送到大西洋彼岸的爱尔兰裔聚居地。国防部已订定输送梯次与集结港口，远征军司令部设于科克，通信与医疗另设专署。"
 IRE_joint_defence:0 "联合防务协调"
 IRE_joint_defence_desc:0 "英爱两军参谋开始在地图上标绘同一条防线。双方未缔结同盟，联络官以观察员名义往来，作战预案分存两处，任何一方均可随时中止。"
 IRE_emergency_drill:0 "紧急动员演习"
 IRE_emergency_drill_desc:0 "全岛举行防空演习，警报在都柏林上空鸣响整个下午。民防处按区疏散居民，消防与救护队在各指定点集合，结果报送国防部。"
 IRE_cross_border_ops:0 "跨境行动"
 IRE_cross_border_ops_desc:0 "边界两侧的行动交由 IRA 人员办理，军队不出面。经费经民间团体转付，事后由情报处核对名单与结果。边界两侧的警署对此均不知情，公文另立卷宗。"
 IRE_mediator:0 "调停者"
 IRE_mediator_desc:0 "向交战双方同时递出橄榄枝。一个从未参战的小国，有时反而是唯一被双方同时接受的中间人。外交部设调停专员，往返于各使馆之间。"

 IRE_mobilisation_drive:0 "动员令"
 IRE_mobilisation_drive_desc:0 "非常时期行非常之政。全国适龄男性开始登记造册，名册由各县征兵处保管，体检与分配按军区次序办理，免征者另立名册。"
 IRE_ldf_expansion:0 "地方防务队扩编"
 IRE_ldf_expansion_desc:0 "地方防卫队在各沿海村镇增设棚屋与弹药柜，新到的步枪按名册发放，操练排在渔汛之后的晚间，教官由国防部派驻。弹药柜每季清点一次。"

 # ==================== 经济区域 ====================
 IRE_E_shannon_hub:0 "香农河水利枢纽"
 IRE_E_shannon_hub_desc:0 "电力供应局接管香农河的水坝工程，测量组与施工队同时进驻利默里克。机组安装列入年度计划，发电优先供给新设工厂与农村电网。"
 IRE_E_peat_fuel:0 "泥炭发电"
 IRE_E_peat_fuel_desc:0 "泥炭开发局在中部沼泽划定采掘区，窄轨铁路把泥炭直接送进发电站。燃料采购改由本地结算，进口煤炭的份额逐年减少，采掘进度按月报送工商部。"
 IRE_E_cork_port:0 "科克港扩建"
 IRE_E_cork_port_desc:0 "港务局扩建科克深水码头，疏浚航道并增设远洋泊位。海关与移民检查站一并设立，货运班轮按新的时刻表直航美洲。港务局按季公布吞吐与泊位使用情况。"
 IRE_E_agri_modern:0 "农业现代化"
 IRE_E_agri_modern_desc:0 "农业部推广拖拉机与良种，各郡合作社统一收购和运输。农会接管了原先由中间商经手的仓储，农村现金往来转入信用合作社。"
 IRE_E_industrial_park:0 "福因斯飞艇港"
 IRE_E_industrial_park_desc:0 "泛美快船在福因斯水面起降，跨大西洋旅客与邮件在此转运。码头旁的维修厂、旅馆与仓库陆续开业，海关与气象站同时派驻。"
 IRE_E_merchant_marine:0 "商船队"
 IRE_E_merchant_marine_desc:0 "商船队以绿旗注册，货轮定期往返于都柏林与纽约之间。设备与零件随船进口，牛肉与乳品装舱出口，船员由海运学校补充。"
 IRE_E_export_hub:0 "出口枢纽"
 IRE_E_export_hub_desc:0 "贸易委员会把出口对象从单一市场转向大西洋沿岸各国，在纽约、波士顿与蒙特利尔设立商务代办。长期供货合同由部际小组审定。"
 IRE_E_financial_centre:0 "爱尔兰中央银行"
 IRE_E_financial_centre_desc:0 "1943年，中央银行在都柏林成立，发行货币并管理外汇储备；商业银行与保险公司按新章程登记。国库券与信贷额度由董事会核定。"
 IRE_E_atlantic_economy:0 "大西洋经济圈"
 IRE_E_atlantic_economy_desc:0 "香农与波士顿之间固定开行班轮，资本、货物与技术人员沿同一航线往来。两国商会互设办事处，货运单据由联合委员会统一格式。"

 IRE_shannon_grid:0 "香农电网"
 IRE_shannon_grid_desc:0 "全国性输电网络把水电与工厂连在一起。电杆线路按县架设，电价与调度由电力供应委员会核定，农村用户按优待办法接入。"
 IRE_peat_energy:0 "泥炭能源"
 IRE_peat_energy_desc:0 "本土泥炭替代进口煤炭，沼泽地划为采掘区，由半国营公司统一收购。发电站与民用燃料改烧泥炭砖，配给按户造册，界址由地方委员会划定。"
 IRE_modern_agriculture:0 "现代农业"
 IRE_modern_agriculture_desc:0 "机械化与合作社提高了土地产出，农村的贫困状况有所缓解。农业部推广良种与农机，合作社在郡一级登记，技术指导由县农艺师担任。"
 IRE_merchant_marine:0 "商船队"
 IRE_merchant_marine_desc:0 "以绿旗注册的商船队开辟都柏林至美洲的定期航线，货运与客运合并经营。船舶由海运局调度，船员在都柏林与科克受训。船舶在战时按海军部要求改装，船员登记入册。"
 IRE_export_economy:0 "出口经济"
 IRE_export_economy_desc:0 "工厂为出口而建，港口为出口而忙。工商部按订单排产，检验与包装另设标准，出口信贷由财政部担保。货运单据经海关核销后结汇。"
 IRE_dublin_finance:0 "都柏林金融"
 IRE_dublin_finance_desc:0 "利菲河畔的银行街集中了本国的商业银行、保险公司与证券交易所，由财政部与中央银行共同监理。信贷与外汇业务按章程办理。"
 IRE_atlantic_economy:0 "大西洋经济圈"
 IRE_atlantic_economy_desc:0 "资本、货物与人才沿同一条航线流动。工商部设专员接洽侨资，码头与仓储统一调配，航运保险由国营公司承保。进出口单据按月汇总归档。"

 # ==================== 军事区域 ====================
 IRE_M_war_cabinet:0 "战时内阁"
 IRE_M_war_cabinet_desc:0 "战争已推进至大西洋。内阁据此改组为战时内阁，国防部、财政部与外交部的常任次官列席，每周例会审议动员进度与物资分配。会议记录由内阁秘书处编号归档，命令经陆军总部下达各军区。"
 IRE_M_army_expansion:0 "陆军扩充"
 IRE_M_army_expansion_desc:0 "1940年，正规军自原有编制扩编，地方防卫军与地方安全队同时在各地设站募兵。兵员按郡编组，训练由陆军总部统一排定，装备自国防部仓库调拨。名册与编成表送内阁备案。"
 IRE_M_officer_corps:0 "军官团与参谋部"
 IRE_M_officer_corps_desc:0 "军官团以军校毕业生与流亡军官为骨干组建。资历由人事处核定，战术课程按现代战例重编，参谋作业与通信勤务同时开课。任命名单经国防部核准后公布。"
 IRE_M_armour:0 "装甲化尝试"
 IRE_M_armour_desc:0 "首批坦克自英国与美国运抵，编入新设的装甲部队。车组在柯拉军营受训，维修与油料由技术处另行筹办。编制表与训练大纲送陆军总部审阅。"
 IRE_M_coastal_fortress:0 "海岸要塞"
 IRE_M_coastal_fortress_desc:0 "科克港、贝雷哈文与斯威利湾的岸防炮台重新启用，混凝土掩体沿可能的登陆滩头构筑。工事由工兵分区发包，火力配系与观测所同时设置。工程进度按月报国防部。"
 IRE_M_naval_expansion:0 "海军扩建"
 IRE_M_naval_expansion_desc:0 "1939年成立的海上部队扩编，鱼雷艇与护卫舰开始例行巡逻。舰艇由海军参谋处编成支队，基地设在科克港与贝雷哈文。巡航日志每日送交国防部。"
 IRE_M_submarine_war:0 "大西洋破交战"
 IRE_M_submarine_war_desc:0 "潜艇支队自戈尔韦与贝雷哈文出航，在西部海域设伏。艇长按海军参谋处下发的航路图行动，战果与损耗逐日汇总上报。作战命令经国防部副署后生效。"
 IRE_M_escort:0 "护航体系"
 IRE_M_escort_desc:0 "商船按船团编组，由护航舰分段掩护横渡大洋。航次表由海运处排定，装卸与补给在都柏林与科克两港办理。船团报告归入海军档案。"
 IRE_M_air_corps:0 "爱尔兰航空队"
 IRE_M_air_corps_desc:0 "巴尔多内尔机场扩建，跑道与机库一并施工。战斗机与侦察机编成中队，飞行员自军校与海外招募中选拔。编制与训练计划报空军参谋处核准。"
 IRE_M_maritime_patrol:0 "海上巡逻机"
 IRE_M_maritime_patrol_desc:0 "巡逻机按扇区在西部海域往复搜索，机组分段轮值。发现潜艇即以规定信号报告海岸管制站，再由管制站转报海军参谋处。飞行日志归档备查。"
 IRE_M_g2:0 "G2 情报处"
 IRE_M_g2_desc:0 "利亚姆·阿彻上校把陆军情报处（G2）扩编为独立机构，下设密码、监听与反间谍三科。人员自军中甄选，经费单列。各处报告经主任核定后送国防部。"
 IRE_M_total_defence:0 "总体防御"
 IRE_M_total_defence_desc:0 "陆、海、空与情报各系统合为一体，统由国防会议调度。作战计划、动员名册与海岸警戒分区同时颁行。各项命令经总参谋长副署，副本存国防部档案。"

 IRE_war_cabinet:0 "战时内阁"
 IRE_war_cabinet_desc:0 "全国转入战时体制。内阁、军队与工业按同一张时间表运转，各部每日呈报进度，由战时内阁统一裁决，议事记录当日归档。"
 IRE_army_expansion:0 "陆军扩充"
 IRE_army_expansion_desc:0 "后备役与志愿兵按名册编入正规军，营连建制重新划定，装备与给养由国防部按新编制核发，入伍体检在各军区办理。新编部队的番号另行公布。"
 IRE_officer_corps:0 "军官团"
 IRE_officer_corps_desc:0 "一支受过现代训练的军官团，按参谋学院课程培训，轮流赴外军见习。小国军队因此可执行合成作战与两栖登陆等复杂任务。"
 IRE_coastal_fortress:0 "海岸要塞"
 IRE_coastal_fortress_desc:0 "混凝土工事与火炮沿海岸线配置，入侵者须先突破滩头。工兵署督造，海军服务处标定射界，守备部队按区轮换。工事按区分期验收，炮兵每年实弹演训一次。"
 IRE_submarine_war:0 "大西洋破交"
 IRE_submarine_war_desc:0 "潜艇支队以大西洋港口为基地，鱼雷与燃料由海军船坞补给。作战区按季度划定，出航与归航时间另行密令。艇员由海军学校挑选，出航前集中封闭训练。"
 IRE_convoy_escort:0 "护航体系"
 IRE_convoy_escort_desc:0 "护航舰与商船编队使跨洋航线不再任人宰割。船团按航速编组，护航分段交接，落水者由就近舰艇救起。航次与损失由海运处登记。"

 # ==================== A 线外交 ====================
 IRE_A_wild_geese:0 "野鹅归巢"
 IRE_A_wild_geese_desc:0 "野鹅是爱尔兰流散军人的旧称，曾为西班牙、法国与奥地利作战。国防部已在都柏林设招募站，退役老兵携行李返乡应募，登记后编入外籍团队。"
 IRE_A_donegal_corridor:0 "多尼戈尔走廊"
 IRE_A_donegal_corridor_desc:0 "1941年，爱尔兰与英国达成默契，盟军飞机可经多尼戈尔上空出海巡逻。都柏林对外仍称中立，雷达站与瞭望哨已按协定为皇家空军指示航向。"
 IRE_A_unity_for_ports:0 "港口换统一"
 IRE_A_unity_for_ports_desc:0 "1940年6月，伦敦递来提议：爱尔兰参战并开放港口，英国即着手兑现统一的爱尔兰。内阁已开会议决，答复由外交部起草，经众议院认可后送出。"

 # ==================== 经济区域：战后与战前 ====================
 IRE_E_hospital_sweepstake:0 "医院彩票"
 IRE_E_hospital_sweepstake_desc:0 "1930年，医院信托彩票经众议院批准发行，由专门委员会管理，售票网络遍及英美。所得款项按法定比例拨给医院建设与国库。"
 IRE_E_public_health:0 "公共卫生服务"
 IRE_E_public_health_desc:0 "彩票收入按年度预算划给郡立医院、母婴诊所与结核病疗养院。卫生部分片派员巡查，病床与药品由中央统一采购。各郡报表按季汇总，报卫生部备查。"
 IRE_E_medical_schools:0 "医学院与护士学校"
 IRE_E_medical_schools_desc:0 "都柏林大学、科克大学与志愿医院合办临床学院，护士学校按统一课程招生。学位由两校联合授予，实习名额分配到各郡医院。"
 IRE_E_national_health:0 "国民健康体系"
 IRE_E_national_health_desc:0 "郡立医院、乡村诊所与巡回医务人员构成全岛卫生网，由卫生部统一调度。防疫、母婴保健与结核病治疗分列预算科目。全岛按同一套病历与统计口径登记。"
 IRE_E_shannon_free_zone:0 "香农自由区"
 IRE_E_shannon_free_zone_desc:0 "1959年，政府在香农机场旁划定免税工业区，仓储与加工厂按特许状入驻。跨大西洋航班在此加油，外资企业由工业发展局接洽。"

 # ==================== 军事区域：历史补充 ====================
 IRE_M_coast_watch:0 "海岸瞭望队"
 IRE_M_coast_watch_desc:0 "1939年起，沿海灯塔与渔村编成瞭望网。值班渔民按册记录上浮潜艇与过境飞机，报告经海岸管制站转送G2。各站以暗号联络，记录本每月汇缴。"
 IRE_M_armoured_cars:0 "装甲车"
 IRE_M_armoured_cars_desc:0 "爱尔兰陆军自内战年代起保有一批劳斯莱斯装甲车。1940年，地方国防军以卡车底盘加焊钢板，编成装甲车队。车辆登记与乘员训练由技术处办理。"

 # ==================== 新增精神 ====================
 IRE_donegal_corridor:0 "多尼戈尔走廊"
 IRE_donegal_corridor_desc:0 "盟军飞机获准经过爱尔兰西北上空。都柏林的雷达与瞭望哨据此延伸监视范围，飞行通报由空军部逐日收存，越界事件另案处理。"
 IRE_wild_geese:0 "野鹅"
 IRE_wild_geese_desc:0 "散居各国的爱尔兰军人陆续回国，携带服役记录与推荐函。国防部于都柏林设登记处，按其原属兵种编入教导队，充任教官与参谋。"
 IRE_unity_for_ports:0 "用港口换来的统一"
 IRE_unity_for_ports_desc:0 "六郡并入都柏林治下的代价，是开放条约港并站到伦敦一边。外交部已把换文草案与港务协定并列，条文送众议院审议，反对意见另行记录。"
 IRE_hospital_sweepstake:0 "医院彩票"
 IRE_hospital_sweepstake_desc:0 "医院彩票的收入划入信托基金，由董事会按季核账，款项专供医院修缮与设备购置，财政部派员列席监督。彩票的章程须经众议院核准。"
 IRE_public_health:0 "公共卫生服务"
 IRE_public_health_desc:0 "郡立医院、母婴诊所与结核病疗养院纳入统一预算，由卫生部按郡拨款。婴儿死亡率开始下降，入伍体检的合格人数随之增加。"
 IRE_medical_schools:0 "医学院与护士学校"
 IRE_medical_schools_desc:0 "本土医学院与护士学校成批培养医护人员，医学研究不再完全依赖伦敦。卫生部核定课程与实习名额，毕业生分配到各郡医院。"
 IRE_national_health:0 "国民健康体系"
 IRE_national_health_desc:0 "卫生部按郡设立卫生局，统一医院、母婴保健与传染病报告制度。医学院扩招，乡村诊疗所由地方政府出资维持，年度卫生报告提交众议院。"
 IRE_shannon_free_zone:0 "香农自由区"
 IRE_shannon_free_zone_desc:0 "免税区与跨大西洋航线把外资、货物与技术一并带入爱尔兰。海关在香农设特别关署，注册与检验另立簿册，保税仓由港务局管理。"
 IRE_coast_watch:0 "海岸瞭望队"
 IRE_coast_watch_desc:0 "沿海瞭望哨与渔村值班员编成一道海防线，潜艇与飞机的动向逐条记录。报告经海岸电台转海军情报处，遇急情另发信号。值班员由渔业部发给津贴，装备由海军调拨。"
 IRE_armoured_cars:0 "装甲车队"
 IRE_armoured_cars_desc:0 "劳斯莱斯装甲车与卡车改装的装甲车，让步兵有了可机动的铁皮掩护。车辆按中队编成，乘员在柯拉受训，维修由技术处承办。"

 # ==================== 历史事件 ire.60 - ire.65 ====================
 ire.60.t:0 "伦敦开出的条件"
 ire.60.d:0 "1940年6月，巴黎陷落，伦敦处境艰难。密使把一份文件送到德瓦莱拉的桌上：都柏林若开放科克、贝雷哈文与多尼戈尔的港口，并加入对德战争，英国将立即着手交还北爱尔兰。文件末尾没有签名，外交部判定出自丘吉尔之手。"
 ire.60.a:0 "接受统一条件"
 ire.60.a_tt:0 "北爱尔兰将并入爱尔兰，爱尔兰将加入英国所在的阵营；稳定度 −5%，战争支持度 +10%。"
 ire.60.b:0 "拒绝以战争换统一"
 ire.61.t:0 "贝尔法斯特在燃烧"
 ire.61.d:0 "1941年4月，德国轰炸机掠过贝尔法斯特湾，防空火力稀疏，码头与工厂起火。伦敦请求都柏林派消防队北上。民政部已清点都柏林与邓多克的消防车辆、水泵与人员，车队编组与边境通行手续一并办妥，待内阁下令出发。"
 ire.61.a:0 "派都柏林消防车北上。"
 ire.61.b:0 "只能表示哀悼。"
 ire.62.t:0 "北斯特兰德空袭"
 ire.62.d:0 "1941年5月31日深夜，三枚炸弹落在都柏林北斯特兰德街，二十八人丧生，九十余人受伤，约三百栋房屋被毁。消防队与地方防卫队通宵清理，死伤名册次日公布。德国广播随后声称这是导航失误。外交部已收到柏林的说明，街头议论未息。"
 ire.62.a:0 "向柏林提出正式抗议。"
 ire.62.b:0 "接受赔偿，保持沉默。"
 ire.63.t:0 "空降的德国人"
 ire.63.d:0 "1940年5月，一名德国人携降落伞落于韦斯特米斯的田野。此人自称赫尔曼·戈茨，身上带有写给爱尔兰共和军联络人的名单。G2人员先抵现场，将其带往都柏林讯问，卷宗送交国防部。拘留令由司法部签发，讯问笔录逐日呈报。"
 ire.63.a:0 "拘押并严守中立"
 ire.63.b:0 "先听取其供述"
 ire.64.t:0 "来自华盛顿的照会"
 ire.64.d:0 "1944年4月，美国大使递来措辞强硬的照会，要求爱尔兰关闭德国与意大利使馆，并停止轴心国电台的广播。华盛顿声明此非请求。外交部已将照会译呈内阁，答复文本尚未定稿；众议院外交委员会已排定质询。"
 ire.64.a:0 "照办，以保全美国友谊"
 ire.64.b:0 "拒绝照会，维持中立"
 ire.65.t:0 "一个时代的结束"
 ire.65.d:0 "1945年5月，柏林陷落的消息传到都柏林。德国公使亨佩尔前往外交部，在吊唁簿上署名。数日后，丘吉尔在下院逐一点名战时保持中立的国家。都柏林广播电台当晚播出德瓦拉拉的答辩全文，外交部将文本归档。"
 ire.65.a:0 "向亨佩尔致哀"
 ire.65.b:0 "只与过去告别"
 IRE_maritime_patrol:0 "海上巡逻"
 IRE_maritime_patrol_desc:0 "巡逻机与瞭望哨共同构成反潜网。海域分段指派，发现记录逐时上报，协同程序由海军部颁行，救护与打捞另设专责，遇难船员由渔业局接济。"
 IRE_g2_intelligence:0 "G2 情报处"
 IRE_g2_intelligence_desc:0 "G2 在都柏林堡设密码组与反间谍科，截收、破译与归档分科办理，与特别分局按周交换名单，成果径送国防部长。译电员由军方自行招募。"
 IRE_total_defence:0 "总体防御"
 IRE_total_defence_desc:0 "陆、海、空与情报合为一体，中立不再等于毫无防备。防务由国防会议统一调度，各军区按海岸段设防，动员名册每年修订一次。"

 IRE_B_crush_terror:0 "消灭恐怖分子"
 IRE_B_crush_terror_desc:0 "司法部签发搜查令，军队协助封锁道路，特别刑事法庭受理案件。被取缔的IRA的军火库与安全屋逐处清点，征募名册交特别分局核对归档。"
 IRE_B_russell_death:0 "拉塞尔之死"
 IRE_B_russell_death_desc:0 "1940年8月，IRA总参谋长肖恩·拉塞尔在搭乘U-65潜艇返回爱尔兰途中病死，海葬于大西洋。G2记录其死讯，柏林与本土IRA之间的联络随之中断。"
 IRE_B_noose_tightens:0 "绞索收紧"
 IRE_B_noose_tightens_desc:0 "蒙特乔伊监狱依特别刑事法庭的判决执行死刑，被处决者名单在政府公报上刊布。残余人员转入地下，警务报告按月汇总，治安由国防会议统管。"
 IRE_internment_camps:0 "拘留营"
 IRE_internment_camps_desc:0 "未经审判的拘留在库里哈拉营地展开，营区由宪兵队管理，被拘者按案卷编号登记。治安好转，报纸的质疑与家属的申诉一并送交内政部。"
 IRE_noose_years:0 "绞索岁月"
 IRE_noose_years_desc:0 "战争最艰难的年份里，政府以严刑维持秩序。特别刑事法庭的判例已经确立，涉案者按此处置，卷宗存入司法部，判决按期公布。"
 ire.66.t:0 "大西洋上的葬礼"
 ire.66.d:0 "U-65 号潜艇的值更官在日志里只写了一行字：『总参谋长于今晨病故，已海葬。』肖恩·拉塞尔，IRA 的 chief of staff，到死也没能再踏上爱尔兰的土地。柏林与都柏林地下组织之间最后的无线电静默了。"
 ire.66.a:0 "公开通报全国。"
 ire.66.a_tt:0 "政治点数 +50，稳定度 +5%。"
 ire.66.b:0 "不予置评。"
 ire.67.t:0 "蒙特乔伊的绞索"
 ire.67.d:0 "清晨六点，蒙特乔伊监狱的钟声之后是脚步声。被判处死刑的 IRA 成员拒绝赦免——『我是战俘，不是罪犯。』报纸只登了一小块角落，但整个都柏林都在低声谈论它。"
 ire.67.a:0 "依法行刑，一个不留。"
 ire.67.a_tt:0 "战争支持度 +5%。"
 ire.67.b:0 "改判苦役吧。"

 # ================= IRA 内战线：国策 =================
 IRE_ira_council:0 "参谋部重组"
 IRE_ira_council_desc:0 "1936 年冬，拉塞尔解散了瘫痪的军事委员会，重设总参谋部。凤凰公园的老兵们重新拿到花名册——这一次，他们要的不是恐吓，而是国家。"
 IRE_ira_arms_web:0 "军械转运网"
 IRE_ira_arms_web_desc:0 "利物浦的码头工人、卡车的暗格、渔船的压舱石——一条横跨爱尔兰海的军火动脉在夜里流动。"
 IRE_ira_camps:0 "训练营与列兵册"
 IRE_ira_camps_desc:0 "威克洛的山谷里，前自由邦士兵在教年轻人拆装步枪。列兵册一页页写满：教师、码头工、邮差。"
 IRE_ira_infiltrate:0 "渗透与串联"
 IRE_ira_infiltrate_desc:0 "G2 的档案柜里有我们的名字，军队的俱乐部里有我们的朋友。谁也不知道哨兵下一班为谁站岗。"
 IRE_ira_coup:0 "政变之夜"
 IRE_ira_coup_desc:0 "没有回到谈判桌的选项了。四个军营、邮局总局、广播电台——同一个夜里，同时动手。"
 IRE_ira_power:0 "都柏林易帜"
 IRE_ira_power_desc:0 "炮声停了。广播里不再放国歌，而是一位参谋的声明：共和军临时政府即刻接管爱尔兰的一切权力。"
 IRE_R_red_turn:0 "康诺利的旗帜"
 IRE_R_red_turn_desc:0 "詹姆斯·康诺利 1916 年绑在担架上枪决——他的旗帜还压在共和军的箱底。现在，左翼共和派把它重新展开：这个共和国该属于工人。"
 IRE_R_connolly_column:0 "康诺利纵队"
 IRE_R_connolly_column_desc:0 "三百二十人越过比利牛斯山，以康诺利之名编入国际纵队。现在，活着回来的老兵带着哈拉马的战术走上讲台，共和国向每一个愿意为革命而战的人敞开志愿兵的大门。"
 IRE_R_republican_congress:0 "共和国大会"
 IRE_R_republican_congress_desc:0 "1934 年被两党与教会联手绞杀的共和国大会复活了——这一次，军政府为它敞开大门。工人读报班在每一个教区礼堂亮起灯。"
 IRE_R_split_1941:0 "战争的大分裂"
 IRE_R_split_1941_desc:0 "1941 年 6 月，巴巴罗萨的炮声把左翼撕成两半：苏联是盟友还是帮凶？都柏林和贝尔法斯特的支部给出了不同的答案。"
 IRE_R_neutral_labor:0 "中立工运"
 IRE_R_neutral_labor_desc:0 "都柏林支部选择解散自己、退回车间：主义可以等，工友的饭碗不能等。本土的工运反而因此扎得更深。"
 IRE_R_volunteer_line:0 "反法西斯征兵"
 IRE_R_volunteer_line_desc:0 "贝尔法斯特支部主张站到战争一边：先打败法西斯，再谈其他的。征兵处的爱尔兰名字越排越长。"
 IRE_R_nationalize:0 "国有化法案"
 IRE_R_nationalize_desc:0 "银行、码头、铁路——账本交到工人委员会手里。资本在夜里收拾细软，但工厂的烟囱还要冒烟。"
 IRE_R_belfast_strike:0 "北爱大罢工"
 IRE_R_belfast_strike_desc:0 "1932 年，瀑布区的天主教徒和香基尔路的新教徒曾并肩拉过罢工纠察线。现在，让那条线再一次横贯贝尔法斯特——直到边界消失。"
 IRE_R_workers_republic:0 "工人共和国"
 IRE_R_workers_republic_desc:0 "不是都柏林征服了北方，而是贝尔法斯特的工人自己接管了自己。三色旗与红旗并排升起——统一在工人的手里完成。"
 IRE_X_shadow_arsenal:0 "影子军械库"
 IRE_X_shadow_arsenal_desc:0 "军政府把所有地下的枪都编入了影子军械库：不在军部的账上，却在参谋部的口袋里。"
 IRE_X_christmas_raid:0 "圣诞劫案"
 IRE_X_christmas_raid_desc:0 "1938 年 12 月 23 日，凤凰公园 Magazine Fort 的哨兵被百万人听到的那阵爆炸声骗了过去——十万余发弹药连夜出城。史实： IRA 对英战争自此打响。"
 IRE_X_s_plan:0 "S计划"
 IRE_X_s_plan_desc:0 "1939 年 1 月，一封宣战通牒送进了英国外交部。考文垂的爆炸、伯明翰的绞架——S计划让英国的城市第一次闻到了战争的味道。"
 IRE_X_abwehr_guests:0 "德国贵客"
 IRE_X_abwehr_guests_desc:0 "柏林的潜艇在深夜靠上了戈尔韦的海岸。普福斯带来了电台，格茨带来了德方的承诺——借刀者终于见到了刀。"
 IRE_X_green_action:0 "绿色行动"
 IRE_X_green_action_desc:0 "不用再等柏林的施舍：德军参谋部接受了都柏林的条件。绿色行动不再是纸上的箭头——两国将正式结盟，爱尔兰海对岸的目标只有一个：伦敦。"
 # ================= 精神 =================
 IRE_military_govt:0 "军政府"
 IRE_military_govt_desc:0 "参谋部接管行政，议会休会。宵禁、军事法庭与新闻检查同时施行，各郡设军事专员，民政公文须经其副署。各郡法院暂停民事审理，案件移交军事法庭。"
 IRE_flying_columns:0 "飞行纵队"
 IRE_flying_columns_desc:0 "来自山地与沼泽的轻装分队不需要补给线，整个国家就是他们的补给线。分队按县编组，就地取粮，行动命令由军区直接下达。"
 IRE_connolly_road:0 "康诺利之路"
 IRE_connolly_road_desc:0 "1916年的口号重新出现在墙上。工人俱乐部逐周增设，红旗在工业区升起。工会联合会登记新会员，集会须向警署报备。"
 POLITICS_FRANK_RYAN_DESC:0 "弗兰克·瑞安，康诺利纵队的指挥官。他在哈拉马的战壕里学会了怎样用一小群坚定的人拖住一支军队——现在，他把这些教给整个共和国。"
 POLITICS_SEAN_RUSSELL_DESC:0 "肖恩·拉塞尔，共和军参谋长。沉默、精确、不苟言笑——柏林的走廊里没人比他更熟悉爱尔兰需要什么。"
 IRE_shadow_arsenal_idea:0 "影子兵工厂"
 IRE_shadow_arsenal_idea_desc:0 "谷仓之下的步枪作坊、农用拖拉机之后的伪装炮架，从不列入正式的产能统计。军械署另设暗册，按县登记产量与去向，查验不预告。"
 IRE_veterans_network:0 "老兵网络"
 IRE_veterans_network_desc:0 "1922年把枪藏进沼泽的人仍在各地，山道、农舍与渡口他们比谁都熟。共和军按旧关系网联络这些人，名册不落纸面，只记在县里几个可靠的姓名之下。"
 IRE_nation_in_arms:0 "全民武装"
 IRE_nation_in_arms_desc:0 "共和国向每一个愿意持枪的人发放步枪，并附一份效忠宣誓书。领取者按教区造册，武器登记后交本人保管，每季点验一次。"
 IRE_pariah_republic:0 "孤立的共和国"
 IRE_pariah_republic_desc:0 "伦敦断交，华盛顿观望，国联不再来电。政变成立的共和国独自面对欧洲报界。外交部仅余少数使馆维持往来，照会由代办转递。"
 IRE_workers_militia:0 "工人赤卫队"
 IRE_workers_militia_desc:0 "各工厂设武器库，步枪登记造册，钥匙由工会纠察队保管。工人按车间编组受训，点名与领枪均记入簿册。武器由工厂基金购置，弹药存于厂区地窖。"
 IRE_collective_farms:0 "集体农庄"
 IRE_collective_farms_desc:0 "土地委员会丈量了每一英亩田地。过去交给地主的地租，如今交进公共粮仓。分配办法由委员会拟定，收成清册报农业部备案。"
 IRE_capital_flight:0 "资本外逃"
 IRE_capital_flight_desc:0 "货船连夜驶出都柏林港，舱内所载并非货物，而是账册。财政部已与承运商约定交接程序，单据另存一式，押运人员由特别分局派定。"
 IRE_abwehr_links:0 "柏林的客人"
 IRE_abwehr_links_desc:0 "阿勃维尔的名册里添了一个中立国的名字，编号与代号另立一册。作为回报，德国教官到基尔代尔的靶场授课，课程表由国防部核定。"
 IRE_smuggling_fleet:0 "走私船队"
 IRE_smuggling_fleet_desc:0 "挂巴拿马旗的旧货轮在夜里靠上偏僻码头，卸下的货单上写着「机械零件」。船长与报关行按约定分成，海关只查封条，不问箱内。"
 IRE_london_sanctions:0 "伦敦的制裁"
 IRE_london_sanctions_desc:0 "威斯敏斯特开出报复清单，自煤炭、保险至航运与信贷逐项加征。都柏林的商号按清单调整货源，改由欧洲大陆转口，损失由出口补贴冲抵。"
 IRE_ira_training_camps:0 "训练营"
 IRE_ira_training_camps_desc:0 "山里的营地在夜里操练。列兵册上的每一个名字，都是半个士兵。"
 IRE_red_militia:0 "工人民兵"
 IRE_red_militia_desc:0 "各车间推选指挥官，工人于下班后编队操练，武器存于工会仓库。都柏林承认其为地方防卫力量，列入国防部编制名册，训练由退伍军官督导。"
 IRE_intl_solidarity:0 "国际团结"
 IRE_intl_solidarity_desc:0 "自哈拉马至格拉斯哥，旗帜与款项在同志之间往来。工会联合会设专人经手，账目按季公布，物资清单分送各地支部。款项进出须经两人签押。"
 IRE_tricolour_red:0 "三色与红旗"
 IRE_tricolour_red_desc:0 "三色旗与红旗并排升起，共和国同时属于爱尔兰与工人。政府各部的职位按党派比例分配，工会代表进入经济委员会。联合政府的纲领以土地、工厂与教育三项为限。"
 IRE_ira_shadow:0 "影子组织"
 IRE_ira_shadow_desc:0 "柏林的电台、海岸的秘密航线、参谋部的暗线——影子比本体更灵活。"
 IRE_martyrs:0 "殉道者"
 IRE_martyrs_desc:0 "绞架没有让他们沉默。每个名字都被印成传单，死后的名声比生前传得更远。纪念委员会按年组织追悼，名单由地方支部保管。"
 # ================= 决议 =================
 IRE_ira_logistics_cat:0 "军械转运"
 IRE_X_ops_cat:0 "运输小组"
 IRE_R_org_cat:0 "工人组织"
 IRE_dock_pickup:0 "码头接货"
 IRE_dock_pickup_desc:0 "渔船靠岸，压舱石换成木箱。海关按渔获申报放行，箱内之物由 G2 派员点收，回单不留副本，接头暗号按期更换，船主姓名不载入簿册。"
 IRE_transport_cells:0 "小队转运"
 IRE_transport_cells_desc:0 "军火拆散装入行李，由运输小组分头带过边境，交接点在乡间的仓房与酒馆，路线与时刻按周更换。每组成员互不相识，只与上线联络。"
 IRE_reading_classes:0 "工人读报班"
 IRE_reading_classes_desc:0 "各教区与工会的阅览室开设夜校，一份报纸、一盏灯、一名义务教师。夜校每周开课三次，识字人数由教育部按郡统计，教材统一印发。"
 # ================= 事件（ire.68-87） =================
 ire.68.t:0 "政变之夜"
 ire.68.d:0 "凌晨两点，四座军营几乎同时易手。邮局总局顶楼的旗降了下来，广播电台的值机员被人从椅子上请开。都柏林的市民在黎明前听到的第一声不是鸡鸣，而是装甲车的引擎。内战，开始了。"
 ire.68.a:0 "全面夺权，一个不留。"
 ire.68.b:0 "先握住港口和电台。"
 ire.69.t:0 "都柏林的新主人"
 ire.69.d:0 "最后一支政府军撤出了基尔代尔郡。广播里传来一份措辞冷静的声明：共和军临时政府即刻接管爱尔兰的一切权力。秘书处的工作人员照常上班——他们换了雇主，仅此而已。"
 ire.69.a:0 "军政府万岁。"
 ire.69.b:0 "和旧官僚们和解吧。"
 ire.90.t:0 "告别军刀"
 ire.90.d:0 "夺权后的第一次全体会议上，桌上摆着两样东西：一份对北方的行动预案，一份工会的请愿书。参谋们吵到深夜——共和军从来既是一支军队，也是一个问题。现在轮到我们回答它。"
 ire.90.a:0 "军刀指向北方。"
 ire.90.b:0 "先听听工人们怎么说。"
 ire.91.t:0 "圣诞劫案"
 ire.91.d:0 "1938 年 12 月 23 日晚，凤凰公园。Magazine Fort 的哨兵听到了他这辈子最大的一声'爆炸'——那是合唱团的排练。等他回过神，十万余发弹药已经装上了三辆卡车。爱尔兰对英战争，从这个夜晚开始。"
 ire.91.a:0 "连夜抢运出城。"
 ire.91.b:0 "张榜宣告：这就是开战。"
 ire.92.t:0 "考文垂的火光"
 ire.92.d:0 "1939 年 8 月，考文垂。一枚自制炸弹在市集炸死了五个人。伦敦的报纸把头版给了'爱尔兰恐怖'，西敏寺的下院里有人摔了文件夹。S计划要的就是这个：让英国人也在报纸上读到战争。"
 ire.92.a:0 "承认这是战争行为。"
 ire.92.b:0 "否认与任何组织有关。"
 ire.93.t:0 "军政府内部的警告"
 ire.93.d:0 "三位老资格的参谋联名递上了一份备忘录：'我们在拿整个共和国的存亡赌一张军火清单。'温和派第一次公开亮出了他们的立场。"
 ire.93.a:0 "收敛行动，暂避风头。"
 ire.93.b:0 "摊牌：清洗温和派。"
 ire.94.t:0 "大西洋上的葬礼"
 ire.94.d:0 "U-65 号潜艇的值更官在日志里只写了一行字：'总参谋长于今晨病故，已海葬。'肖恩·拉塞尔——从凤凰公园到柏林都被称作'chief of staff'的那个人——到死也没能再踏上爱尔兰的土地。裹着帆布沉入大西洋的那一刻，柏林与都柏林之间最后的联络线静默了。"
 ire.94.a:0 "公开通报全国。"
 ire.94.b:0 "不予置评。"
 ire.95.t:0 "兵变危机"
 ire.95.d:0 "曝光过了头：伦敦的情报机构拿到了我们的名单，军中的温和派开始私下串联。情报局长把两份方案摆上桌——要么主动解散地下网络，要么，先动手。"
 ire.95.a:0 "解散地下网络，保全政府。"
 ire.95.b:0 "先发制人，清洗军中异见者。"
 ire.96.t:0 "不速之客"
 ire.96.d:0 "1940 年 5 月的一个清晨，蒂珀雷里的农夫在田埂上发现了一个摔断脚踝的德国人。赫尔曼·格茨——阿贝韦尔的特工，主桅行动的主角——把降落伞藏进了干草垛，可惜藏得不够好。"
 ire.96.a:0 "收留这位'客人'。"
 ire.96.b:0 "递解出境，谁也不得罪。"
 ire.100.t:0 "康诺利的旗帜"
 ire.100.d:0 "军政府大楼的顶楼，有人连夜挂出了一面没人见过的旗：三色的旁边，多了一面红的。教会的报纸连夜发社论，工会的礼堂里却响起了掌声。"
 ire.100.a:0 "让旗帜升起来。"
 ire.100.b:0 "激进可以等，先稳住军心。"
 ire.101.t:0 "告别哈拉马"
 ire.101.d:0 "哈拉马阵亡名单里有基特·康威——她是爱尔兰纵队里第一个倒下的；弗兰克·瑞安被俘，辗转进了战俘营。三百二十人出发，回来的不足一半。都柏林的墙上，出现了新的涂鸦：'他们为所有人而战。'"
 ire.101.a:0 "悼念亡者。"
 ire.101.b:0 "把纵队的经验带回家。"
 ire.102.t:0 "十字架与红旗"
 ire.102.d:0 "1937 年的新宪法草案还没定稿，总主教区的抗议信就堆满了秘书处：'一个敌视教会的共和国不配代表爱尔兰。'教堂外的集会一场接一场。"
 ire.102.a:0 "在宪法面前低头。"
 ire.102.b:0 "教会必须服从国家。"
 ire.103.t:0 "1935 年的教训"
 ire.103.d:0 "罢工纠察线两边打起来了：瀑布区和香基尔路的老伤口被几颗石子重新撕开。1935 年运输罢工就是这么死的——宗派暴乱把跨教派的联合打散。这一次，历史在问我们同样的问题。"
 ire.103.a:0 "组织跨教派联防队。"
 ire.103.b:0 "暂时收缩，等风头过去。"
 ire.104.t:0 "资本外逃"
 ire.104.d:0 "《国有化法案》墨迹未干，港口就排满了准备离境的商船。银行家的保险柜、工厂主的账本、交易所的热线——资本用脚投了票。"
 ire.104.a:0 "实行外汇管制。"
 ire.104.b:0 "走就走吧。"
 ire.105.t:0 "北爱大罢工"
 ire.105.d:0 "信号从贝尔法斯特传来：造船厂的汽笛响了。瀑布区和香基尔路的人流汇向同一个广场——上一次这样并肩，是 1932 年的救济罢工。"
 ire.105.a:0 "全力升级：总罢工！"
 ire.105.b:0 "见好就收，慢慢磨。"
 ire.106.t:0 "工人委员会接管"
 ire.106.d:0 "贝尔法斯特市政厅的顶上换了旗。工人代表委员会宣布接管北方的一切行政权力，并'请求都柏林的同志们接纳北方的工人阶级回家'。伦敦的战时内阁看着电报沉默了很久。"
 ire.106.a:0 "历史站在工人一边。"
 ire.106.b:0 "谨慎巩固，步步为营。"
 ire.107.t:0 "德累斯顿的幽灵"
 ire.107.d:0 "弗兰克·瑞安——哈拉马的战俘、后来辗转去了柏林的复杂人物——死在了德累斯顿。关于他的争论比他的坟还多：理想主义者？叛徒？还是被战争碾碎的普通人？"
 ire.107.a:0 "全党悼念。"
 ire.107.b:0 "继承他的遗志。"

 # ================= 红黑线大胆化补充（v2.3.1） =================
 IRE_connolly_veterans:0 "康诺利纵队老兵"
 IRE_connolly_veterans_desc:0 "自哈拉马归来的人员担任教官，按西班牙战场的经验编订训练科目。国防部承认其资历，训练班在库拉营开办，结业考核由参谋学院主持。"
 IRE_revolution_treasury:0 "革命金库"
 IRE_revolution_treasury_desc:0 "西班牙共和派的黄金在比斯开湾换旗转运，革命政府的金库由此充盈。财政部登记入账，支出须经委员会核可，账册每季封存。"
 ire.108.t:0 "比斯开湾的金库"
 ire.108.d:0 "戈尔韦的渔船带回了一个惊人的消息：一艘挂着共和派旗帜的西班牙货船正在湾内避风，船舱里装满用油布裹好的板条箱——金条。西班牙内战的火已经烧到了我们的海岸，而这笔钱去向何方，由我们决定。"
 ire.108.a:0 "扣押：革命不找任何人借钱。"
 ire.108.b:0 "护送船队去莫斯科：同志的信用比黄金贵。"

