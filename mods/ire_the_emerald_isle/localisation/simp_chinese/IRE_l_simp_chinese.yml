l_simp_chinese:
 IRE_treatys_scar:0 "条约的伤疤"
 IRE_treatys_scar_desc:0 "1921年英爱条约遗留的裂痕，自由邦名义上独立，却仍要向北爱尔兰与伦敦低头。"
 IRE_diaspora:0 "大流散"
 IRE_diaspora_desc:0 "1845年大饥荒之后，数百万爱尔兰人远渡重洋，他们的后代遍布美洲，仍记得这片土地。"
 IRE_agrarian_poverty:0 "农业穷国"
 IRE_agrarian_poverty_desc:0 "除了牧草与土豆，这个国家几乎什么都造不出来，工厂是奢望。"
 IRE_civil_war_embers:0 "内战余烬"
 IRE_civil_war_embers_desc:0 "1922-1923年的爱尔兰内战早已结束，但老兵组织、被禁的葬礼、反条约派的怒火仍在乡间闷烧。这张牌代表的是那段史实遗留的创伤——开局不会再度爆发内战，平息它即可移除。"
 IRE_free_framework:0 "自由的框架"
 IRE_free_framework_desc:0 "条约不是耻辱，而是一副可以借力的骨架，先让它运转起来。"
 IRE_north_unintegrated:0 "北爱未整合"
 IRE_north_unintegrated_desc:0 "六郡已经回归，但人心还没有，贝尔法斯特的工厂在消极怠工。"
 IRE_sectarian_rift:0 "宗派裂痕"
 IRE_sectarian_rift_desc:0 "用铁腕压平分歧，代价是让分歧沉入地下，等待下一次爆发。"
 IRE_rural_electrification:0 "农村电气化"
 IRE_rural_electrification_desc:0 "电线杆一根根插进绿色的原野。"
 IRE_anglo_irish_beef:0 "对英牛肉出口"
 IRE_anglo_irish_beef_desc:0 "伦敦的餐桌离不开爱尔兰的牛，这既是生意，也是筹码。"
 IRE_republican_constitution:0 "共和宪法"
 IRE_republican_constitution_desc:0 "1937年宪法确立了总统职位，这个国家在法律上终于成为共和国。"
 IRE_free_country:0 "自由的国家"
 IRE_free_country_desc:0 "1949年4月18日，爱尔兰正式脱离英联邦，三十年的等待结束了。"
 IRE_atlantic_bloodline:0 "跨海血脉"
 IRE_atlantic_bloodline_desc:0 "从科克到波士顿，同一面绿旗在无数港口升起。"
 IRE_green_flag_post:0 "绿旗联络站"
 IRE_green_flag_post_desc:0 "海外侨民组织的联络站在美洲各大城市落地，志愿者开始回流。"
 IRE_diaspora_fund:0 "流散基金"
 IRE_diaspora_fund_desc:0 "都柏林的账户上每月都多出一笔来自海外的汇款。"
 IRE_saint_patrick_name:0 "圣帕特里克之名"
 IRE_saint_patrick_name_desc:0 "这个名字本身就是号召，为它而战的人，不只在爱尔兰。"
 IRE_atlantic_bloodline_2:0 "大西洋血脉"
 IRE_atlantic_bloodline_2_desc:0 "大西洋不再是屏障，而是我们的大街。"
 IRE_celtic_world:0 "凯尔特世界"
 IRE_celtic_world_desc:0 "所有爱尔兰裔聚居地，都在同一个网络里呼吸。"
 IRE_washingtons_friend:0 "华盛顿的朋友"
 IRE_washingtons_friend_desc:0 "国会山上的爱尔兰裔议员们，从不会忘记故乡。"
 IRE_southern_supply_line:0 "南方补给线"
 IRE_southern_supply_line_desc:0 "从布宜诺斯艾利斯出发的货船，绕过半个地球抵达科克。"
 IRE_transatlantic_supply:0 "跨大西洋补给网"
 IRE_transatlantic_supply_desc:0 "一条横跨大洋的物流动脉已经成形。"
 IRE_final_ascension:0 "新世界的主人"
 IRE_final_ascension_desc:0 "我们的旗帜在大西洋两岸同时飘扬。"
 IRE_emergency_powers:0 "紧急状态"
 IRE_emergency_powers_desc:0 "都柏林从不称它为战争，但每一个人都知道，这是紧急状态。"
 IRE_lookout_post:0 "瞭望哨"
 IRE_lookout_post_desc:0 "海岸线上的每一个哨所都在盯着海面。"
 IRE_moral_neutrality_idea:0 "道义中立"
 IRE_moral_neutrality_idea_desc:0 "我们不参战，但我们的心在哪一边，所有人都清楚。"
 IRE_armed_neutrality_idea:0 "武装中立"
 IRE_armed_neutrality_idea_desc:0 "中立不等于不设防。"
 IRE_absolute_neutrality_idea:0 "绝对中立"
 IRE_absolute_neutrality_idea_desc:0 "对谁都做生意，对谁都不表态。"
 IRE_moral_arbiter:0 "中立的仲裁者"
 IRE_moral_arbiter_desc:0 "当大国打得疲惫不堪，中立者的声音反而最响。"
 IRE_haaland_wolff:0 "哈兰德与沃尔夫船坞"
 IRE_haaland_wolff_desc:0 "建造过泰坦尼克号的船坞，如今为爱尔兰造船。"
 IRE_reserve_defence:0 "后备国防军"
 IRE_reserve_defence_desc:0 "一支平时务农、战时持枪的部队。"
 IRE_border_plebiscite_support_1:0 "公投支持度"

 IRE_focus_tree:0 "翡翠岛的抉择"
 IRE_border_plebiscite:0 "边境公投"
 IRE_border_plebiscite_desc:0 "与其在条约的框架内等待，不如直接向北方发起一场公投。这违背了1921年的协议，但历史从不等待犹豫者。"
 IRE_consolidate_free_state:0 "自由邦的巩固"
 IRE_consolidate_free_state_desc:0 "德·瓦莱拉说过：我们要做的，是先让这个国家真正运转起来。稳住阵脚，再图后计。"
 IRE_common_galway:0 "戈尔韦船坞"
 IRE_common_galway_desc:0 "西海岸的戈尔韦拥有天然的深水良港。从这里，爱尔兰可以望见大西洋。"
 IRE_common_rural:0 "农村电气化"
 IRE_common_rural_desc:0 "把电送进每一座农舍，是这个国家现代化的第一步。"
 IRE_common_dublin_uni:0 "都柏林大学的研究"
 IRE_common_dublin_uni_desc:0 "圣三一学院的书架上，藏着这个小国最聪明的大脑。"
 IRE_common_tobacco:0 "烟草原产地"
 IRE_common_tobacco_desc:0 "南部的烟草与畜牧产品，是换取外汇的硬通货。"
 IRE_common_signals:0 "情报与密码"
 IRE_common_signals_desc:0 "一个小国要在大国之间生存，耳朵必须比别人灵。"
 IRE_common_arms:0 "军工初创"
 IRE_common_arms_desc:0 "第一批像样的军工厂在都柏林郊外破土动工。"
 IRE_A_revitalise:0 "翡翠岛重整"
 IRE_A_revitalise_desc:0 "绿色的原野上，脚手架一天天长高。"
 IRE_A_shannon:0 "香农河水电"
 IRE_A_shannon_desc:0 "1929年建成的香农河水电站，曾是世界上最大的水电工程之一。"
 IRE_A_reserves:0 "后备国防军"
 IRE_A_reserves_desc:0 "每一个爱尔兰农民，都该会开枪。"
 IRE_A_belfast:0 "贝尔法斯特整合"
 IRE_A_belfast_desc:0 "哈兰德与沃尔夫船坞，建造过泰坦尼克号的地方，如今成为爱尔兰工业的心脏。"
 IRE_A_emergency:0 "大西洋紧急状态"
 IRE_A_emergency_desc:0 "战争烧到了大西洋。都柏林不再等待伦敦的许可，宣布全国进入紧急状态。"
 IRE_A_remittance:0 "侨汇与爱国公债"
 IRE_A_remittance_desc:0 "大萧条之后，美洲爱尔兰裔的汇款成了都柏林最稳定的外汇来源。政府把它变成了爱国公债。"
 IRE_A_volunteer_corps:0 "志愿军团"
 IRE_A_volunteer_corps_desc:0 "不等征召令。地方军与退役老兵自发组织起来，守着海岸与边境。"
 IRE_A_wartime_economy:0 "战时经济动员"
 IRE_A_wartime_economy_desc:0 "工厂改产军需，农场按配额交粮，都柏林第一次真正管住了整个岛的经济。"
 IRE_A_atlantic_wall:0 "大西洋防线"
 IRE_A_atlantic_wall_desc:0 "从多尼戈尔到科克，海岸炮台、瞭望哨与声呐站连成一线，盯着德国潜艇。"
 IRE_A_ulster_bulwark:0 "厄尔斯特壁垒"
 IRE_A_ulster_bulwark_desc:0 "如果伦敦翻脸，六郡就是第一道战壕。都柏林在纽里—邓多克一线筑起工事。"
 IRE_A_britain_war_plan:0 "对英战争预案"
 IRE_A_britain_war_plan_desc:0 "参谋部第一次认真推演与英国开战：守住厄尔斯特，拖住登陆，等待大洋彼岸的援手。"
 IRE_A_fortress_ireland:0 "翡翠堡垒"
 IRE_A_fortress_ireland_desc:0 "岛屿要塞化完成。无论来的是德国潜艇还是英国舰队，爱尔兰都不再是软肋。"
 IRE_remittance_economy:0 "侨汇经济"
 IRE_remittance_economy_desc:0 "来自波士顿、纽约与布宜诺斯艾利斯的汇款，支撑着都柏林的国库。"
 IRE_volunteer_corps:0 "志愿军团"
 IRE_volunteer_corps_desc:0 "地方志愿部队整编为预备役，填补正规军的空缺。"
 IRE_wartime_economy:0 "战时经济"
 IRE_wartime_economy_desc:0 "国家接管关键工厂与配给体系，一切生产服从战争需要。"
 IRE_atlantic_wall:0 "大西洋防线"
 IRE_atlantic_wall_desc:0 "海岸要塞、瞭望哨与反潜巡逻构成的环形防御。"
 IRE_ulster_bulwark:0 "厄尔斯特壁垒"
 IRE_ulster_bulwark_desc:0 "面向不列颠方向的永备工事与动员体系。"
 IRE_britain_war_plan:0 "对英战争预案"
 IRE_britain_war_plan_desc:0 "针对英国登陆与封锁的作战计划，已下发至各师参谋部。"
 IRE_fortress_ireland:0 "翡翠堡垒"
 IRE_fortress_ireland_desc:0 "全岛要塞化，任何入侵者都要付出代价。"
 IRE_A_reconciliation:0 "和解政策"
 IRE_A_reconciliation_desc:0 "伦敦在看着。如果新教徒的工厂继续开工，抗议的声音就会小一些。"
 IRE_A_firm_integration:0 "强硬整合"
 IRE_A_firm_integration_desc:0 "不谈判，不安抚。六郡必须无条件服从都柏林。"
 IRE_A_london_note:0 "伦敦的最后通牒"
 IRE_A_london_note_desc:0 "告诉伦敦：条约必须重新谈。"
 IRE_A_settle_treaty:0 "清算条约"
 IRE_A_settle_treaty_desc:0 "把1921年留下的账，一次算清。"
 IRE_A_treaty_ports:0 "条约港归还"
 IRE_A_treaty_ports_desc:0 "1938年，英国归还了三个条约港。这是爱尔兰中立得以成立的物质前提。"
 IRE_A_atlantic_call:0 "大西洋的呼唤"
 IRE_A_atlantic_call_desc:0 "海洋不是边界。海洋是通道。"
 IRE_A_diaspora_legacy:0 "大流散的遗产"
 IRE_A_diaspora_legacy_desc:0 "七千万爱尔兰后裔散落在世界各地，他们从未忘记这片土地。"
 IRE_A_newfoundland:0 "纽芬兰的渔火"
 IRE_A_newfoundland_desc:0 "1934年，纽芬兰因财政破产放弃自治，由伦敦直接管辖。这是回归的窗口。"
 IRE_A_nf_plebiscite:0 "自治领公投"
 IRE_A_nf_plebiscite_desc:0 "圣约翰斯的渔民将要投票，决定自己是爱尔兰人还是英国人。"
 IRE_nf_support_50:0 "渔民保护联盟"
 IRE_nf_support_50_desc:0 "在纽芬兰的每一座渔村建立联络，效仿威廉·库克当年组织渔民保护联盟的办法，等待公投的那一天。"
 IRE_A_nf_province:0 "第三十三郡"
 IRE_A_nf_province_desc:0 "纽芬兰全境并入爱尔兰，成为这个国家的第三十三个郡。"
 IRE_A_boston:0 "波士顿的绿旗"
 IRE_A_boston_desc:0 "肯尼迪家族、柯林斯家族，美国的政治机器里到处都是爱尔兰姓氏。"
 IRE_A_lobby:0 "爱尔兰裔游说团"
 IRE_A_lobby_desc:0 "在华盛顿，有时候一个游说团比一支舰队更有用。"
 IRE_A_irish_division:0 "租借的爱尔兰师"
 IRE_A_irish_division_desc:0 "成千上万的美国爱尔兰裔青年，愿意为故乡而战。"
 IRE_A_san_patricio:0 "圣帕特里克营"
 IRE_A_san_patricio_desc:0 "1846年，一群爱尔兰裔美军逃兵为墨西哥而战，至今仍被墨西哥人奉为英雄。"
 IRE_A_green_legion:0 "绿旗军团"
 IRE_A_green_legion_desc:0 "以圣帕特里克之名，组建一支真正的军团。"
 IRE_A_buenos_aires:0 "布宜诺斯艾利斯的绿草地"
 IRE_A_buenos_aires_desc:0 "阿根廷的爱尔兰裔社区是南美最大的一支，牛肉与小麦正等着出口。"
 IRE_A_southern_cone:0 "南锥体补给线"
 IRE_A_southern_cone_desc:0 "从南美绕过半个地球的航线，将成为我们最长的补给臂。"
 IRE_A_supply_web:0 "跨大西洋补给网"
 IRE_A_supply_web_desc:0 "把散落各处的支线连成一张网。"
 IRE_A_celtic_commonwealth:0 "凯尔特联邦"
 IRE_A_celtic_commonwealth_desc:0 "从都柏林到圣约翰斯，从波士顿到布宜诺斯艾利斯。"
 IRE_A_masters_new_world:0 "新世界的纽带"
 IRE_A_masters_new_world_desc:0 "大西洋两岸的所有爱尔兰人，都将在同一面旗帜下。"
 IRE_B_civil_service:0 "公务员制度改革"
 IRE_B_civil_service_desc:0 "一个国家的效率，取决于它的文书能不能读懂自己写的公文。"
 IRE_B_quell_embers:0 "平息内战余烬"
 IRE_B_quell_embers_desc:0 "1922年的伤口必须愈合，否则它会一直溃烂。"
 IRE_B_outlaw_ira:0 "取缔IRA"
 IRE_B_outlaw_ira_desc:0 "1936年，德·瓦莱拉政府宣布IRA为非法组织。稳定，来自于秩序。"
 IRE_B_tolerate_ira:0 "容忍IRA"
 IRE_B_tolerate_ira_desc:0 "他们是不听话的孩子，但终究是自己的骨肉。"
 IRE_B_economic_war_end:0 "经济战争的终结"
 IRE_B_economic_war_end_desc:0 "1932-38年的英爱关税战，把两国都拖得精疲力尽，该结束了。"
 IRE_B_trade_agreement:0 "英爱贸易协定"
 IRE_B_trade_agreement_desc:0 "1938年协定签署，牛肉换工厂，这是笔公平的交易。"
 IRE_B_land_annuities:0 "土地年金清算"
 IRE_B_land_annuities_desc:0 "一次性支付一千万英镑，了结纠缠二十年的年金争端。"
 IRE_B_treaty_ports:0 "条约港的归还"
 IRE_B_treaty_ports_desc:0 "1938年，英国归还科克港、贝雷哈文与斯威利湾三处条约港。没有它们，爱尔兰的中立就只是一句空话。"
 IRE_B_constitution_1937:0 "1937年宪法"
 IRE_B_constitution_1937_desc:0 "新宪法设立总统职位，确立爱尔兰的事实共和国地位。"
 IRE_B_president_mace:0 "总统的权杖"
 IRE_B_president_mace_desc:0 "总统不只是礼仪性的，他是这个国家道义的声音。"
 IRE_B_emergency:0 "紧急状态宣言"
 IRE_B_emergency_desc:0 "爱尔兰从不称它为战争，他们叫它：紧急状态。"
 IRE_B_coastal:0 "海岸防卫"
 IRE_B_coastal_desc:0 "任何一个从海上来的敌人，都会在沙滩上付出代价。"
 IRE_B_ldf:0 "地方防卫军"
 IRE_B_ldf_desc:0 "紧急状态期间，超过十万人加入了LDF。"
 IRE_B_plan_w:0 "W计划"
 IRE_B_plan_w_desc:0 "英爱之间秘密达成的联合防德入侵计划，连中立国也要准备好最坏的情况。"
 IRE_B_moral_neutrality:0 "道义中立"
 IRE_B_moral_neutrality_desc:0 "我们不参战，但我们的心在哪一边，所有人都清楚。"
 IRE_B_absolute_neutrality:0 "严格中立"
 IRE_B_absolute_neutrality_desc:0 "对谁都做生意，对谁都不表态。德瓦莱拉称这为严格中立，小国最赚钱的活法。"
 IRE_B_armed_neutrality:0 "武装中立"
 IRE_B_armed_neutrality_desc:0 "谁敢动我，我就打谁。"
 IRE_B_shannon_wayfarers:0 "香农机场的过客"
 IRE_B_shannon_wayfarers_desc:0 "迫降在香农的盟军飞行员被悄悄送过边境，德军飞行员则被关进拘留营。福因斯的飞艇码头上，人们用热咖啡接待滞留的旅客。"
 IRE_B_dublin_choice:0 "都柏林的抉择"
 IRE_B_dublin_choice_desc:0 "当德国人的坦克开进低地国家，德·瓦莱拉必须决定：这个国家要站在哪里。"
 IRE_B_berlin_overture:0 "柏林的试探"
 IRE_B_berlin_overture_desc:0 "德国情报机构通过爱尔兰共和军伸出了手，接下它，代价可能是一场战争。"
 IRE_B_famine_echo:0 "饥饿的回声"
 IRE_B_famine_echo_desc:0 "1945年后，来自美国的援助让大饥荒的记忆稍稍平息。"
 IRE_B_republic_1949:0 "1949年共和国法案"
 IRE_B_republic_1949_desc:0 "1949年4月18日，爱尔兰正式脱离英联邦，成立共和国。"
 IRE_B_moral_authority:0 "道义的权威"
 IRE_B_moral_authority_desc:0 "当世界打得筋疲力尽，一个始终不参战的小国反而有了说话的分量。"
 IRE_B_final_unification:0 "最后的统一"
 IRE_B_final_unification_desc:0 "三十年的等待之后，北方终于以和平的方式回到了这个国家的怀里。"

 ire.1.t:0 "北爱的选择"
 ire.1.d:0 "贝尔法斯特的街头挤满了人。投票箱在一座废弃的纺织厂里打开，计票员的手在发抖。三十年来第一次，北方六郡的人民被问了一个问题：你们属于哪里？\n\n（支持度达到 90 且英国深陷大战：伦敦被迫承认，和平移交六郡；70-89 或英国尚且强盛：我们将拿到核心与宣称，但想要土地就必须以战争证成；不足 70：公投失败，一无所获。）"
 ire.1.a:0 "六郡回家了。"
 ire.1.b:0 "承认公投无效——时机尚未成熟。"
 ire.2.t:0 "伦敦的抗议"
 ire.2.d:0 "白厅的反应比预想的快。一份措辞严厉的照会送到都柏林，称这次公投严重违反1921年条约精神。"
 ire.2.a:0 "他们能怎样？"
 ire.10.t:0 "圣约翰斯的选择"
 ire.10.d:0 "纽芬兰的渔民们聚集在港口。公投的请愿书已经拟好——问题是，伦敦会怎么反应？"
 ire.10.a:0 "时机已到。"
 ire.10.b:0 "这是赌上国运的一步。"
 ire.10.a_tt:0 "英国正深陷大战无暇西顾，或支持度已然成熟——公投必将通过，纽芬兰将和平并入。"
 ire.20.t:0 "一位飞行员的遣返"
 ire.20.d:0 "一架英国战斗机迫降在香农河畔的草地上。飞行员被带到当地警局，喝了杯茶，第二天早上就不小心走到了边境。"
 ire.20.a:0 "我们不记得有这回事。"
 ire.30.t:0 "北方的新黎明"
 ire.30.d:0 "没有枪声，没有最后通牒。一支爱尔兰军队在贝尔法斯特郊外停下，等待移交仪式。六郡，和平地回来了。"
 ire.30.a:0 "这条路走了三十年。"
 ire.40.t:0 "流散的回应"
 ire.40.d:0 "美洲的爱尔兰裔社区开始自发募捐，一批批物资正运往都柏林。"
 ire.40.a:0 "血脉从未断过。"
 ire.50.t:0 "圣帕特里克日"
 ire.50.d:0 "3月17日。全世界的爱尔兰人都在这一天想起故乡。"
 ire.50.a:0 "为圣帕特里克干杯。"

 IRE_decisions:0 "翡翠岛事务"
 IRE_unity_campaign_cat:0 "统一宣传运动"
 IRE_unity_campaign:0 "发起统一宣传"
 IRE_unity_campaign_desc:0 "在北方与海外组织集会、募捐与宣传，为公投积累民意基础。"
 IRE_diaspora_cat:0 "海外网络"
 IRE_overseas_promotion:0 "海外宣传"
 IRE_overseas_promotion_desc:0 "在美洲的爱尔兰裔社区中开展宣传，扩大网络影响。"
 IRE_newfoundland_cat:0 "纽芬兰事务"
 IRE_fisher_brotherhood:0 "渔民兄弟会"
 IRE_fisher_brotherhood_desc:0 "在纽芬兰的渔村中建立联络网络，为独立公投做铺垫。"
 IRE_neutral_cat:0 "中立事务"
 IRE_moral_appeal:0 "道义呼吁"
 IRE_moral_appeal_desc:0 "向世界发出爱尔兰的声音，争取道义上的支持。"
 IRE_weather_forecast:0 "天气预报共享"
 IRE_weather_forecast_desc:0 "把大西洋的气象数据悄悄交给伦敦。这不算参战。"
 IRE_smuggling:0 "走私贸易"
 IRE_smuggling_desc:0 "向交战双方同时出口物资。被发现会损害声誉，但利润丰厚。"
 IRE_convoy_cat:0 "大西洋航线"
 IRE_atlantic_convoy:0 "跨大西洋护航"
 IRE_atlantic_convoy_desc:0 "组织船团护航，保障跨洋航线的安全。"

 IRE_agrarian_poverty_lite:0 "农业穷国（缓和）"
 IRE_agrarian_poverty_lite_desc:0 "关税战结束了，牧草之外终于有了别的生意，但工厂依然稀少。"
 IRE_settled_treaty:0 "清算的条约"
 IRE_settled_treaty_desc:0 "1921年留下的账已经算清，都柏林的每一天都能多攒一点筹码。"
 IRE_british_sanctions:0 "英国贸易制裁"
 IRE_british_sanctions_desc:0 "白厅的报复比预想的精准，爱尔兰的出口被卡在了港口。"
 IRE_san_patricio_elite:0 "圣帕特里克营"
 IRE_san_patricio_elite_desc:0 "这支以1846年墨西哥战场上的爱尔兰营命名的部队，攻守兼备，纪律严明。"
 IRE_newfoundland_fisheries:0 "纽芬兰渔场"
 IRE_newfoundland_fisheries_desc:0 "圣约翰斯外海的鳕鱼群，是这片新国土上最不需要花钱的资源。"
 IRE_fisher_brotherhood_idea:0 "渔民兄弟会"
 IRE_fisher_brotherhood_idea_desc:0 "从戈尔韦到圣约翰斯，每一座渔村都有我们的联络人。"
 IRE_south_american_trade:0 "南美农产品贸易"
 IRE_south_american_trade_desc:0 "潘帕斯草原的牛肉与小麦，经由布宜诺斯艾利斯换回都柏林需要的东西。"
 IRE_joint_defence_idea:0 "联合防务协调"
 IRE_joint_defence_idea_desc:0 "英爱两军的参谋在地图上画着同一条防线，虽然谁都不愿承认。"
 IRE_emergency_powers_2:0 "紧急状态（二级）"
 IRE_emergency_powers_2_desc:0 "海面上的动静越来越近，都柏林把警戒线推到了沙滩上。"
 IRE_emergency_powers_3:0 "紧急状态（三级）"
 IRE_emergency_powers_3_desc:0 "战争已经烧到门口，这个国家必须把每一分力气都用上。"

 IRE_overseas_recruit:0 "海外募兵"
 IRE_overseas_recruit_desc:0 "在波士顿、芝加哥、布宜诺斯艾利斯的爱尔兰裔社区设点募兵，愿意回来的人远比想象中多。"
 IRE_overseas_fundraising:0 "海外募捐"
 IRE_overseas_fundraising_desc:0 "侨民的钱比侨民的人来得更快，一张张汇款单撑起了都柏林的预算。"
 IRE_interfaith_dialogue:0 "跨教派对话"
 IRE_interfaith_dialogue_desc:0 "让天主教徒与新教徒坐在同一张桌子前。这不会解决一切，但至少能让人听见对方。"
 IRE_dublin_order:0 "都柏林的秩序"
 IRE_dublin_order_desc:0 "宪兵队开进贝尔法斯特的街道，用枪托和搜查令把抵抗压下去。"
 IRE_south_america_purchase:0 "南美采购"
 IRE_south_america_purchase_desc:0 "从阿根廷的仓库里，用牛肉合同换来一批多余的美式步枪。"
 IRE_transatlantic_expedition:0 "跨大西洋远征"
 IRE_transatlantic_expedition_desc:0 "把军队投送到大西洋彼岸的爱尔兰裔聚居地，这是凯尔特联邦才配享有的特权。"
 IRE_joint_defence:0 "联合防务协调"
 IRE_joint_defence_desc:0 "英爱两军的参谋开始在地图上画同一条防线。这不算结盟，只是心照不宣。"
 IRE_emergency_drill:0 "紧急动员演习"
 IRE_emergency_drill_desc:0 "全民防空演习，警报声在都柏林上空响了整整一个下午。"
 IRE_cross_border_ops:0 "跨境行动"
 IRE_cross_border_ops_desc:0 "让IRA的人替我们处理一些不方便由军队出面的事情。"
 IRE_mediator:0 "调停者"
 IRE_mediator_desc:0 "向交战双方同时递出橄榄枝。一个从未参战的小国，有时反而是唯一被双方同时接受的中间人。"

 IRE_mobilisation_drive:0 "动员令"
 IRE_mobilisation_drive_desc:0 "非常时期需要非常手段，全国的适龄男性开始登记造册。"
 IRE_ldf_expansion:0 "地方防务队扩编"
 IRE_ldf_expansion_desc:0 "沿海村镇的民兵棚屋里，新步枪堆得比渔网还高。"
 ire.10_success_tt:0 "§G公投通过！§!纽芬兰将并入爱尔兰。"
 ire.10_fail_tt:0 "§R公投失败。§!伦敦照会都柏林表示强烈不满（英国好感 -40，稳定度 -3%）。"

 # ==================== 经济区域 ====================
 IRE_E_shannon_hub:0 "香农河水利枢纽"
 IRE_E_shannon_hub_desc:0 "把香农河的水力变成电力，再把电力送进工厂与农舍。爱尔兰的工业化从这里开始。"
 IRE_E_peat_fuel:0 "泥炭发电"
 IRE_E_peat_fuel_desc:0 "中部沼泽的泥炭被一车车运进发电站，能源不必再看伦敦的脸色。"
 IRE_E_cork_port:0 "科克港扩建"
 IRE_E_cork_port_desc:0 "南海岸的深水港扩建成远洋码头，船只从这里直航美洲。"
 IRE_E_agri_modern:0 "农业现代化"
 IRE_E_agri_modern_desc:0 "拖拉机、良种与合作社取代了旧式佃农经济，农村第一次有了余粮与现金。"
 IRE_E_industrial_park:0 "福因斯飞艇港"
 IRE_E_industrial_park_desc:0 "泛美快船在福因斯的水面起降，跨大西洋的旅客与邮件在此中转。码头旁的维修厂、旅馆与仓库跟着兴旺起来。"
 IRE_E_merchant_marine:0 "商船队"
 IRE_E_merchant_marine_desc:0 "悬挂绿旗的货轮往返于都柏林与纽约之间，运回设备，运出牛肉。"
 IRE_E_export_hub:0 "出口枢纽"
 IRE_E_export_hub_desc:0 "爱尔兰不再只是英国的农场，而是大西洋贸易网络上的一个节点。"
 IRE_E_financial_centre:0 "爱尔兰中央银行"
 IRE_E_financial_centre_desc:0 "1943 年，爱尔兰中央银行正式成立。都柏林的银行与保险公司，终于有了自己的货币与信用体系。"
 IRE_E_atlantic_economy:0 "大西洋经济圈"
 IRE_E_atlantic_economy_desc:0 "从香农到波士顿，资本、货物与人才沿着同一条航线流动。"

 IRE_shannon_grid:0 "香农电网"
 IRE_shannon_grid_desc:0 "全国性的输电网络把水电与工厂连在一起。"
 IRE_peat_energy:0 "泥炭能源"
 IRE_peat_energy_desc:0 "本土泥炭替代进口煤炭，能源账单第一次由都柏林自己决定。"
 IRE_modern_agriculture:0 "现代农业"
 IRE_modern_agriculture_desc:0 "机械化与合作社让土地产出翻倍，农村不再只是贫困的代名词。"
 IRE_merchant_marine:0 "商船队"
 IRE_merchant_marine_desc:0 "一支悬挂绿旗的商船队，把爱尔兰与美洲市场直接连起来。"
 IRE_export_economy:0 "出口经济"
 IRE_export_economy_desc:0 "工厂为出口而建，港口为出口而忙。"
 IRE_dublin_finance:0 "都柏林金融"
 IRE_dublin_finance_desc:0 "利菲河畔的银行街，正在成为小国的资本中心。"
 IRE_atlantic_economy:0 "大西洋经济圈"
 IRE_atlantic_economy_desc:0 "资本、货物与人才沿同一条航线流动，爱尔兰终于不再边缘。"

 # ==================== 军事区域 ====================
 IRE_M_war_cabinet:0 "战时内阁"
 IRE_M_war_cabinet_desc:0 "战争已经烧到大西洋，都柏林终于把紧急状态变成了真正的战时体制。"
 IRE_M_army_expansion:0 "陆军扩充"
 IRE_M_army_expansion_desc:0 "1940年，正规军从不足一万人扩编到四万余人，地方防卫军与地方安全队又募集了十多万志愿者。爱尔兰第一次有了成建制的国防力量。"
 IRE_M_officer_corps:0 "军官团与参谋部"
 IRE_M_officer_corps_desc:0 "从军校与流亡军官中挑出骨干，建立一套能打现代战争的指挥体系。"
 IRE_M_armour:0 "装甲化尝试"
 IRE_M_armour_desc:0 "第一批坦克从英国与美国运抵，爱尔兰开始学习如何打一场机械化战争。"
 IRE_M_coastal_fortress:0 "海岸要塞"
 IRE_M_coastal_fortress_desc:0 "科克港、贝雷哈文与斯威利湾的岸防炮台重新启用，混凝土掩体沿着可能的登陆滩头排开。"
 IRE_M_naval_expansion:0 "海军扩建"
 IRE_M_naval_expansion_desc:0 "1939年成立的海上部队（Marine Service）扩编，鱼雷艇与护卫舰开始巡逻，绿旗第一次真正出现在大西洋。"
 IRE_M_submarine_war:0 "大西洋破交战"
 IRE_M_submarine_war_desc:0 "潜艇从戈尔韦与贝雷哈文出发，扼住英国生命线，也把爱尔兰拖入战争。"
 IRE_M_escort:0 "护航体系"
 IRE_M_escort_desc:0 "商船编队在英国护航舰的掩护下横渡大洋，物资才能抵达都柏林。"
 IRE_M_air_corps:0 "爱尔兰航空队"
 IRE_M_air_corps_desc:0 "巴尔多内尔机场扩建，战斗机与侦察机第一次属于爱尔兰。"
 IRE_M_maritime_patrol:0 "海上巡逻机"
 IRE_M_maritime_patrol_desc:0 "巡逻机在西部海域画着同心圆，任何上浮的潜艇都逃不过他们的眼睛。"
 IRE_M_g2:0 "G2 情报处"
 IRE_M_g2_desc:0 "利亚姆·阿彻上校把陆军情报处（G2）扩编为独立机构，密码、监听与反间谍同时铺开。"
 IRE_M_total_defence:0 "总体防御"
 IRE_M_total_defence_desc:0 "陆海空与情报体系合为一体，这个中立小国终于有了自保的牙齿。"

 IRE_war_cabinet:0 "战时内阁"
 IRE_war_cabinet_desc:0 "紧急状态升格为战时体制，内阁、军队与工业开始按同一张时间表运转。"
 IRE_army_expansion:0 "陆军扩充"
 IRE_army_expansion_desc:0 "后备役与志愿兵被编入正规军，爱尔兰的陆军第一次有了规模。"
 IRE_officer_corps:0 "军官团"
 IRE_officer_corps_desc:0 "一支受过现代训练的军官团，让小国军队也能执行复杂作战。"
 IRE_coastal_fortress:0 "海岸要塞"
 IRE_coastal_fortress_desc:0 "混凝土与火炮沿着海岸线排开，入侵者必须先付出血的代价。"
 IRE_submarine_war:0 "大西洋破交"
 IRE_submarine_war_desc:0 "潜艇与鱼雷把爱尔兰的战场延伸到了大西洋深处。"
 IRE_convoy_escort:0 "护航体系"
 IRE_convoy_escort_desc:0 "护航舰与商船编队让跨洋航线不再任人宰割。"

 # ==================== A 线外交 ====================
 IRE_A_wild_geese:0 "野鹅归巢"
 IRE_A_wild_geese_desc:0 "「野鹅」是爱尔兰流散军人的古老称呼。他们曾为西班牙、法国和奥地利而战；这一次，都柏林的招募站前排起长队，许多刚从英军退役的老兵带着行李回到故乡。"
 IRE_A_donegal_corridor:0 "多尼戈尔走廊"
 IRE_A_donegal_corridor_desc:0 "1941年，爱尔兰与英国达成默契：盟军飞机可以经过多尼戈尔上空出海巡逻。都柏林对外仍称中立，雷达站与瞭望哨却已开始为皇家空军指路。"
 IRE_A_unity_for_ports:0 "港口换统一"
 IRE_A_unity_for_ports_desc:0 "1940年6月，伦敦递来一份惊人的提议：如果爱尔兰参战并开放港口，英国将着手兑现一个统一的爱尔兰。德瓦莱拉盯着地图上的贝尔法斯特，久久没有说话。"

 # ==================== 经济区域：战后与战前 ====================
 IRE_E_hospital_sweepstake:0 "医院彩票"
 IRE_E_hospital_sweepstake_desc:0 "1930年，爱尔兰医院信托彩票获准发行。头奖数万英镑，买彩票的人遍及英美；财政部用这笔钱修医院，也顺手填了预算。"
 IRE_E_shannon_free_zone:0 "香农自由区"
 IRE_E_shannon_free_zone_desc:0 "1959年，香农机场旁划出自由区，免税仓储与外资工厂在此落户。跨大西洋航班在这里加油，也把第一批跨国公司带进了爱尔兰。"

 # ==================== 军事区域：历史补充 ====================
 IRE_M_coast_watch:0 "海岸瞭望队"
 IRE_M_coast_watch_desc:0 "1939年起，爱尔兰沿海的灯塔与渔村被编成瞭望网。值班的渔民记下每一艘上浮的潜艇、每一架飞过的飞机，再把情报送到G2。"
 IRE_M_armoured_cars:0 "装甲车"
 IRE_M_armoured_cars_desc:0 "爱尔兰陆军从内战年代就有一批劳斯莱斯装甲车。1940年，地方国防军又用卡车底盘焊上钢板，凑出了自己的第一支装甲车队。"

 # ==================== 新增精神 ====================
 IRE_donegal_corridor:0 "多尼戈尔走廊"
 IRE_donegal_corridor_desc:0 "盟军飞机获准经过爱尔兰西北上空，都柏林的雷达与瞭望哨也因此看得更远。"
 IRE_wild_geese:0 "野鹅"
 IRE_wild_geese_desc:0 "流散在世界各地的爱尔兰军人回到故乡，把实战经验带给了这支年轻军队。"
 IRE_unity_for_ports:0 "用港口换来的统一"
 IRE_unity_for_ports_desc:0 "六郡并入都柏林治下的代价，是开放条约港并站到伦敦一边。统一与中立，终究只能选一个。"
 IRE_hospital_sweepstake:0 "医院彩票"
 IRE_hospital_sweepstake_desc:0 "彩票收入进入医院信托基金，财政第一次有了一笔不靠税金的活钱。"
 IRE_shannon_free_zone:0 "香农自由区"
 IRE_shannon_free_zone_desc:0 "免税区和跨大西洋航线把外资、货物与技术一起带进爱尔兰。"
 IRE_coast_watch:0 "海岸瞭望队"
 IRE_coast_watch_desc:0 "沿海瞭望哨与渔村值班员组成一道看不见的海防线，潜艇与飞机的动向都逃不过他们的记录。"
 IRE_armoured_cars:0 "装甲车队"
 IRE_armoured_cars_desc:0 "劳斯莱斯装甲车与卡车改装的装甲车，让步兵第一次有了可以机动的铁皮掩护。"

 # ==================== 历史事件 ire.60 - ire.65 ====================
 ire.60.t:0 "统一，还是战争？"
 ire.60.d:0 "1940年6月，巴黎陷落，伦敦的处境比任何时候都艰难。一份密使送来的文件摆在德瓦莱拉的桌上：如果都柏林开放科克、贝雷哈文和多尼戈尔的港口，并加入对德战争，英国将立即着手把北爱尔兰交还爱尔兰。文件末尾没有签名，但所有人都知道它来自丘吉尔。"
 ire.60.a:0 "一个岛，一个议会。"
 ire.60.a_tt:0 "北爱尔兰将并入爱尔兰，爱尔兰将加入英国所在的阵营；稳定度 −5%，战争支持度 +10%。"
 ire.60.b:0 "我们不为统一而流血。"
 ire.61.t:0 "贝尔法斯特在燃烧"
 ire.61.d:0 "1941年4月，德国轰炸机掠过贝尔法斯特湾。防空火力稀疏得可怜，码头与工厂在燃烧。伦敦请求都柏林派消防队北上——那些昨天还在边境对峙的人，今天要在同一片火场里救人。"
 ire.61.a:0 "派都柏林的消防车北上。"
 ire.61.b:0 "我们只能表示哀悼。"
 ire.62.t:0 "北斯特兰德"
 ire.62.d:0 "1941年5月31日，深夜。三枚炸弹落在都柏林北斯特兰德街，三十四人死亡。德国的广播声称是导航失误。都柏林人问：下一个误炸会在哪里？"
 ire.62.a:0 "向柏林提出正式抗议。"
 ire.62.b:0 "接受赔偿，保持沉默。"
 ire.63.t:0 "空降的德国人"
 ire.63.d:0 "1940年5月，一名德国人带着降落伞落在韦斯特米斯的田野里。他自称赫尔曼·戈茨，口袋里有一份写给爱尔兰共和军联络人的名单。G2的人先到了现场。"
 ire.63.a:0 "拘押他，严格保持中立。"
 ire.63.b:0 "让我们先听听他知道什么。"
 ire.64.t:0 "来自华盛顿的照会"
 ire.64.d:0 "1944年4月，美国大使递来一份措辞强硬的照会，要求爱尔兰关闭德国和意大利的使馆，并停止轴心国电台的活动。华盛顿说，这不是请求。"
 ire.64.a:0 "照办了。我们需要美国的友谊。"
 ire.64.b:0 "爱尔兰的中立不是给华盛顿看的。"
 ire.65.t:0 "一个时代的结束"
 ire.65.d:0 "1945年5月，柏林陷落的消息传来。德国公使亨佩尔来到都柏林的外交部，签下吊唁簿。几天后，丘吉尔在下院逐一点名那些在战争中保持中立的国家。都柏林的广播电台开始播放德瓦拉拉的答辩。"
 ire.65.a:0 "向亨佩尔表示哀悼。"
 ire.65.b:0 "这一天，我们只与过去告别。"
 IRE_maritime_patrol:0 "海上巡逻"
 IRE_maritime_patrol_desc:0 "巡逻机与瞭望哨共同织起一张反潜网。"
 IRE_g2_intelligence:0 "G2 情报处"
 IRE_g2_intelligence_desc:0 "密码破译与反间谍能力，让都柏林听见别人听不见的声音。"
 IRE_total_defence:0 "总体防御"
 IRE_total_defence_desc:0 "陆海空与情报体系合成一体，中立不再意味着毫无防备。"

 IRE_B_crush_terror:0 "消灭恐怖分子"
 IRE_B_crush_terror_desc:0 "搜查令、军队协防与特别刑事法庭一起上：被取缔的 IRA 不能只停留在纸面上，它的军火库、安全屋和征募网必须被连根拔起。"
 IRE_B_russell_death:0 "拉塞尔之死"
 IRE_B_russell_death_desc:0 "1940 年 8 月，IRA 总参谋长肖恩·拉塞尔在搭乘 U-65 潜艇返爱的途中病死，海葬大西洋。德国与本土 IRA 的联络线随之断绝。"
 IRE_B_noose_tightens:0 "绞索收紧"
 IRE_B_noose_tightens_desc:0 "蒙特乔伊监狱的绞架没有空过。拒绝低头者依法处决，残余分子转入彻底的蛰伏——紧急状态下的爱尔兰，熬过了绳索最紧的岁月。"
 IRE_internment_camps:0 "拘留营"
 IRE_internment_camps_desc:0 "未经审判的拘留在库里哈拉营地铺开。铁丝网后面关着的是威胁，也是民望：秩序回来了，代价是自由。"
 IRE_noose_years:0 "绞索岁月"
 IRE_noose_years_desc:0 "战争最黑暗的年头里，政府用铁腕换来了平静。判例已经立下：动乱者没有第二次机会。"
 ire.66.t:0 "大西洋上的葬礼"
 ire.66.d:0 "U-65 号潜艇的值更官在日志里只写了一行字：『总参谋长于今晨病故，已海葬。』肖恩·拉塞尔，IRA 的 chief of staff，到死也没能再踏上爱尔兰的土地。柏林与都柏林地下组织之间最后的无线电静默了。"
 ire.66.a:0 "公开通报全国。"
 ire.66.a_tt:0 "政治点数 +50，稳定度 +2%。"
 ire.66.b:0 "不予置评。"
 ire.66.b_tt:0 "稳定度 +4%。"
 ire.67.t:0 "蒙特乔伊的绞索"
 ire.67.d:0 "清晨六点，蒙特乔伊监狱的钟声之后是脚步声。被判处死刑的 IRA 成员拒绝赦免——『我是战俘，不是罪犯。』报纸只登了一小块角落，但整个都柏林都在低声谈论它。"
 ire.67.a:0 "依法行刑，一个不留。"
 ire.67.a_tt:0 "战争支持度 +2%。"
 ire.67.b:0 "改判苦役吧。"
 ire.67.b_tt:0 "政治点数 +25。"

 # ================= IRA 内战线：国策 =================
 IRE_ira_council:0 "参谋部重组"
 IRE_ira_council_desc:0 "1936 年冬，拉塞尔解散了瘫痪的军事委员会，重设总参谋部。凤凰公园的老兵们重新拿到花名册——这一次，他们要的不是恐吓，而是国家。"
 IRE_ira_arms_web:0 "军械转运网"
 IRE_ira_arms_web_desc:0 "利物浦的码头工人、卡车的暗格、渔船的压舱石——一条横跨爱尔兰海的军火动脉在夜里流动。"
 IRE_ira_camps:0 "训练营与列兵册"
 IRE_ira_camps_desc:0 "威克洛的山谷里，前自由邦士兵在教年轻人拆装步枪。列兵册一页页写满：教师、码头工、邮差。"
 IRE_ira_infiltrate:0 "渗透与串联"
 IRE_ira_infiltrate_desc:0 "G2 的档案柜里有我们的名字，军队的俱乐部里有我们的朋友。谁也不知道哨兵下一班为谁站岗。"
 IRE_ira_coup:0 "政变之夜"
 IRE_ira_coup_desc:0 "没有回到谈判桌的选项了。四个军营、邮局总局、广播电台——同一个夜里，同时动手。"
 IRE_ira_power:0 "都柏林易帜"
 IRE_ira_power_desc:0 "炮声停了。广播里不再放国歌，而是一位参谋的声明：共和军临时政府即刻接管爱尔兰的一切权力。"
 IRE_R_red_turn:0 "康诺利的旗帜"
 IRE_R_red_turn_desc:0 "詹姆斯·康诺利 1916 年绑在担架上枪决——他的旗帜还压在共和军的箱底。现在，左翼共和派把它重新展开：这个共和国该属于工人。"
 IRE_R_connolly_column:0 "康诺利纵队"
 IRE_R_connolly_column_desc:0 "三百二十人越过比利牛斯山，以康诺利之名编入国际纵队。现在，活着回来的老兵带着哈拉马的战术走上讲台，共和国向每一个愿意为革命而战的人敞开志愿兵的大门。"
 IRE_R_republican_congress:0 "共和国大会"
 IRE_R_republican_congress_desc:0 "1934 年被两党与教会联手绞杀的共和国大会复活了——这一次，军政府为它敞开大门。工人读报班在每一个教区礼堂亮起灯。"
 IRE_R_split_1941:0 "战争的大分裂"
 IRE_R_split_1941_desc:0 "1941 年 6 月，巴巴罗萨的炮声把左翼撕成两半：苏联是盟友还是帮凶？都柏林和贝尔法斯特的支部给出了不同的答案。"
 IRE_R_neutral_labor:0 "中立工运"
 IRE_R_neutral_labor_desc:0 "都柏林支部选择解散自己、退回车间：主义可以等，工友的饭碗不能等。本土的工运反而因此扎得更深。"
 IRE_R_volunteer_line:0 "反法西斯征兵"
 IRE_R_volunteer_line_desc:0 "贝尔法斯特支部主张站到战争一边：先打败法西斯，再谈其他的。征兵处的爱尔兰名字越排越长。"
 IRE_R_nationalize:0 "国有化法案"
 IRE_R_nationalize_desc:0 "银行、码头、铁路——账本交到工人委员会手里。资本在夜里收拾细软，但工厂的烟囱还要冒烟。"
 IRE_R_belfast_strike:0 "北爱大罢工"
 IRE_R_belfast_strike_desc:0 "1932 年，瀑布区的天主教徒和香基尔路的新教徒曾并肩拉过罢工纠察线。现在，让那条线再一次横贯贝尔法斯特——直到边界消失。"
 IRE_R_workers_republic:0 "工人共和国"
 IRE_R_workers_republic_desc:0 "不是都柏林征服了北方，而是贝尔法斯特的工人自己接管了自己。三色旗与红旗并排升起——统一在工人的手里完成。"
 IRE_X_shadow_arsenal:0 "影子军械库"
 IRE_X_shadow_arsenal_desc:0 "军政府把所有地下的枪都编入了影子军械库：不在军部的账上，却在参谋部的口袋里。"
 IRE_X_christmas_raid:0 "圣诞劫案"
 IRE_X_christmas_raid_desc:0 "1938 年 12 月 23 日，凤凰公园 Magazine Fort 的哨兵被百万人听到的那阵爆炸声骗了过去——十万余发弹药连夜出城。史实： IRA 对英战争自此打响。"
 IRE_X_s_plan:0 "S计划"
 IRE_X_s_plan_desc:0 "1939 年 1 月，一封宣战通牒送进了英国外交部。考文垂的爆炸、伯明翰的绞架——S计划让英国的城市第一次闻到了战争的味道。"
 IRE_X_abwehr_guests:0 "阿贝韦尔的客人"
 IRE_X_abwehr_guests_desc:0 "柏林的潜艇在深夜靠上了戈尔韦的海岸。普福斯带来了电台，格茨带来了德方的承诺——借刀者终于见到了刀。"
 IRE_X_green_action:0 "绿色行动"
 IRE_X_green_action_desc:0 "不用再等柏林的施舍：德军参谋部接受了都柏林的条件。绿色行动不再是纸上的箭头——两国将正式结盟，爱尔兰海对岸的目标只有一个：伦敦。"
 IRE_X_rising_gamble:0 "复活节暴动·1941"
 IRE_X_rising_gamble_desc:0 "没有德军上岸也可以孤注一掷：让北方在复活节的枪声里瘫痪。赌赢了，是新的复活节；赌输了，是把刀递给英国。"
 IRE_X_landing_assist:0 "奥兰治登陆之夜"
 IRE_X_landing_assist_desc:0 "灯火管制的海岸线上，只有我们的人知道德军的驳船该在哪里靠岸。这一夜之后，北爱归谁，取决于枪口朝哪一边。"
 IRE_X_black_end:0 "黑爱尔兰"
 IRE_X_black_end_desc:0 "北方的界墙倒了，但账单正在路上：柏林的债务、伦敦的仇恨、都柏林良心的债。借来的刀，总要连本带利地还。"
 # ================= 精神 =================
 IRE_military_govt:0 "军政府"
 IRE_military_govt_desc:0 "参谋部代替了议会。宵禁、军事法庭、新闻检查——秩序回来了，自由靠边站。"
 IRE_ira_training_camps:0 "训练营"
 IRE_ira_training_camps_desc:0 "山里的营地在夜里操练。列兵册上的每一个名字，都是半个士兵。"
 IRE_church_hostility:0 "教会敌视"
 IRE_church_hostility_desc:0 "主教们的讲道台向工人共和国宣战了。每个礼拜日，弥撒都是一场政治课。"
 IRE_red_militia:0 "工人民兵"
 IRE_red_militia_desc:0 "车间选出的指挥官、下班后操练的营队——组织度就是武器。"
 IRE_intl_solidarity:0 "国际团结"
 IRE_intl_solidarity_desc:0 "从哈拉马到格拉斯哥，旗帜和款项在同志之间流通。"
 IRE_tricolour_red:0 "三色与红旗"
 IRE_tricolour_red_desc:0 "两种颜色并排升起。共和国第一次同时属于爱尔兰和工人。"
 IRE_ira_shadow:0 "影子组织"
 IRE_ira_shadow_desc:0 "柏林的电台、海岸的秘密航线、参谋部的暗线——影子比本体更灵活。"
 IRE_martyrs:0 "殉道者"
 IRE_martyrs_desc:0 "绞架没有让他们沉默。每一个名字都被印成传单，比活着时传得更远。"
 IRE_borrowed_knife:0 "借刀者"
 IRE_borrowed_knife_desc:0 "刀已经出鞘，方向却不由持刀人决定。胜利的每一年，都会有人问起那一夜的账。"
 # ================= 决议 =================
 IRE_ira_logistics_cat:0 "军械转运"
 IRE_X_ops_cat:0 "运输小组"
 IRE_R_org_cat:0 "工人组织"
 IRE_dock_pickup:0 "码头接货"
 IRE_dock_pickup_desc:0 "渔船靠岸，压舱石换成木箱。"
 IRE_transport_cells:0 "小队转运"
 IRE_transport_cells_desc:0 "把军火拆成行李，分头运过边境。"
 IRE_reading_classes:0 "工人读报班"
 IRE_reading_classes_desc:0 "一份报纸、一盏灯、一个代课的老师。"
 # ================= 事件（ire.68-87） =================
 ire.68.t:0 "政变之夜"
 ire.68.d:0 "凌晨两点，四座军营几乎同时易手。邮局总局顶楼的旗降了下来，广播电台的值机员被人从椅子上请开。都柏林的市民在黎明前听到的第一声不是鸡鸣，而是装甲车的引擎。内战，开始了。"
 ire.68.a:0 "全面夺权，一个不留。"
 ire.68.b:0 "先握住港口和电台。"
 ire.69.t:0 "都柏林的新主人"
 ire.69.d:0 "最后一支政府军撤出了基尔代尔郡。广播里传来一份措辞冷静的声明：共和军临时政府即刻接管爱尔兰的一切权力。秘书处的工作人员照常上班——他们换了雇主，仅此而已。"
 ire.69.a:0 "军政府万岁。"
 ire.69.b:0 "和旧官僚们和解吧。"
 ire.90.t:0 "告别军刀"
 ire.90.d:0 "夺权后的第一次全体会议上，桌上摆着两样东西：一份对北方的行动预案，一份工会的请愿书。参谋们吵到深夜——共和军从来既是一支军队，也是一个问题。现在轮到我们回答它。"
 ire.90.a:0 "军刀指向北方。"
 ire.90.b:0 "先听听工人们怎么说。"
 ire.91.t:0 "圣诞劫案"
 ire.91.d:0 "1938 年 12 月 23 日晚，凤凰公园。Magazine Fort 的哨兵听到了他这辈子最大的一声'爆炸'——那是合唱团的排练。等他回过神，十万余发弹药已经装上了三辆卡车。爱尔兰对英战争，从这个夜晚开始。"
 ire.91.a:0 "连夜抢运出城。"
 ire.91.b:0 "张榜宣告：这就是开战。"
 ire.92.t:0 "考文垂的火光"
 ire.92.d:0 "1939 年 8 月，考文垂。一枚自制炸弹在市集炸死了五个人。伦敦的报纸把头版给了'爱尔兰恐怖'，西敏寺的下院里有人摔了文件夹。S计划要的就是这个：让英国人也在报纸上读到战争。"
 ire.92.a:0 "承认这是战争行为。"
 ire.92.b:0 "否认与任何组织有关。"
 ire.93.t:0 "军政府内部的警告"
 ire.93.d:0 "三位老资格的参谋联名递上了一份备忘录：'我们在拿整个共和国的存亡赌一张军火清单。'温和派第一次公开亮出了他们的立场。"
 ire.93.a:0 "收敛行动，暂避风头。"
 ire.93.b:0 "摊牌：清洗温和派。"
 ire.94.t:0 "大西洋上的葬礼"
 ire.94.d:0 "U-65 号潜艇的值更官在日志里只写了一行字：'总参谋长于今晨病故，已海葬。'肖恩·拉塞尔——从凤凰公园到柏林都被称作'chief of staff'的那个人——到死也没能再踏上爱尔兰的土地。裹着帆布沉入大西洋的那一刻，柏林与都柏林之间最后的联络线静默了。"
 ire.94.a:0 "公开通报全国。"
 ire.94.b:0 "不予置评。"
 ire.95.t:0 "兵变危机"
 ire.95.d:0 "曝光过了头：伦敦的情报机构拿到了我们的名单，军中的温和派开始私下串联。情报局长把两份方案摆上桌——要么主动解散地下网络，要么，先动手。"
 ire.95.a:0 "解散地下网络，保全政府。"
 ire.95.b:0 "先发制人，清洗军中异见者。"
 ire.96.t:0 "不速之客"
 ire.96.d:0 "1940 年 5 月的一个清晨，蒂珀雷里的农夫在田埂上发现了一个摔断脚踝的德国人。赫尔曼·格茨——阿贝韦尔的特工，主桅行动的主角——把降落伞藏进了干草垛，可惜藏得不够好。"
 ire.96.a:0 "收留这位'客人'。"
 ire.96.b:0 "递解出境，谁也不得罪。"
 ire.97.t:0 "奥兰治登陆之夜"
 ire.97.d:0 "灯火管制的海岸线上，只有我们的人知道德军的驳船该在哪里靠岸。参谋部值夜的电话一刻不停地响——北方，出事了。"
 ire.97.a:0 "请德军把北方移交给我们。"
 ire.97.b:0 "观望：先别趟这滩浑水。"
 ire.98.t:0 "复活节暴动"
 ire.98.d:0 "复活节星期一——和 1916 年同一天。邮局、发电厂、警察局，北爱六郡的要点同时遭到袭击。这一次，暴动者背后站着整个军政府。"
 ire.98.a:0 "得手了——北方陷入瘫痪！"
 ire.98.b:0 "失败了——把损失降到最低。"
 ire.99.t:0 "借刀者的账单"
 ire.99.d:0 "北方的界墙倒了。但柏林武官深夜递来的不只是贺信，还有一份'合作备忘录'；伦敦的报纸在头版写满了'叛徒共和国'。胜利的滋味很复杂——像借来的刀，握得越紧，手心越凉。"
 ire.99.a:0 "接受命运的账单。"
 ire.99.b:0 "焚毁所有与柏林往来的名册。"
 ire.100.t:0 "康诺利的旗帜"
 ire.100.d:0 "军政府大楼的顶楼，有人连夜挂出了一面没人见过的旗：三色的旁边，多了一面红的。教会的报纸连夜发社论，工会的礼堂里却响起了掌声。"
 ire.100.a:0 "让旗帜升起来。"
 ire.100.b:0 "激进可以等，先稳住军心。"
 ire.101.t:0 "告别哈拉马"
 ire.101.d:0 "哈拉马阵亡名单里有基特·康威——她是爱尔兰纵队里第一个倒下的；弗兰克·瑞安被俘，辗转进了战俘营。三百二十人出发，回来的不足一半。都柏林的墙上，出现了新的涂鸦：'他们为所有人而战。'"
 ire.101.a:0 "悼念亡者。"
 ire.101.b:0 "把纵队的经验带回家。"
 ire.102.t:0 "十字架与红旗"
 ire.102.d:0 "1937 年的新宪法草案还没定稿，总主教区的抗议信就堆满了秘书处：'一个敌视教会的共和国不配代表爱尔兰。'教堂外的集会一场接一场。"
 ire.102.a:0 "在宪法面前低头。"
 ire.102.b:0 "教会必须服从国家。"
 ire.103.t:0 "1935 年的教训"
 ire.103.d:0 "罢工纠察线两边打起来了：瀑布区和香基尔路的老伤口被几颗石子重新撕开。1935 年运输罢工就是这么死的——宗派暴乱把跨教派的联合打散。这一次，历史在问我们同样的问题。"
 ire.103.a:0 "组织跨教派联防队。"
 ire.103.b:0 "暂时收缩，等风头过去。"
 ire.104.t:0 "资本外逃"
 ire.104.d:0 "《国有化法案》墨迹未干，港口就排满了准备离境的商船。银行家的保险柜、工厂主的账本、交易所的热线——资本用脚投了票。"
 ire.104.a:0 "实行外汇管制。"
 ire.104.b:0 "走就走吧。"
 ire.105.t:0 "北爱大罢工"
 ire.105.d:0 "信号从贝尔法斯特传来：造船厂的汽笛响了。瀑布区和香基尔路的人流汇向同一个广场——上一次这样并肩，是 1932 年的救济罢工。"
 ire.105.a:0 "全力升级：总罢工！"
 ire.105.b:0 "见好就收，慢慢磨。"
 ire.106.t:0 "工人委员会接管"
 ire.106.d:0 "贝尔法斯特市政厅的顶上换了旗。工人代表委员会宣布接管北方的一切行政权力，并'请求都柏林的同志们接纳北方的工人阶级回家'。伦敦的战时内阁看着电报沉默了很久。"
 ire.106.a:0 "历史站在工人一边。"
 ire.106.b:0 "谨慎巩固，步步为营。"
 ire.107.t:0 "德累斯顿的幽灵"
 ire.107.d:0 "弗兰克·瑞安——哈拉马的战俘、后来辗转去了柏林的复杂人物——死在了德累斯顿。关于他的争论比他的坟还多：理想主义者？叛徒？还是被战争碾碎的普通人？"
 ire.107.a:0 "全党悼念。"
 ire.107.b:0 "继承他的遗志。"

 # ================= 红黑线大胆化补充（v2.3.1） =================
 IRE_X_crown_westminster:0 "三色旗插上唐宁街"
 IRE_X_crown_westminster_desc:0 "伦敦的防线垮了。把三色旗送上唐宁街十号的屋顶——从都柏林到伦敦，一个足以改写地图的国家诞生了。"
 IRE_connolly_veterans:0 "康诺利纵队老兵"
 IRE_connolly_veterans_desc:0 "从哈拉马活着回来的人成了教官：他们知道现代战争该怎么打。"
 IRE_revolution_treasury:0 "革命金库"
 IRE_revolution_treasury_desc:0 "西班牙共和派的黄金在比斯开湾换了一面旗帜。金库充盈，革命的钱袋第一次比敌人的更鼓。"
 ire.108.t:0 "比斯开湾的金库"
 ire.108.d:0 "戈尔韦的渔船带回了一个惊人的消息：一艘挂着共和派旗帜的西班牙货船正在湾内避风，船舱里装满用油布裹好的板条箱——金条。西班牙内战的火已经烧到了我们的海岸，而这笔钱去向何方，由我们决定。"
 ire.108.a:0 "扣押：革命不找任何人借钱。"
 ire.108.b:0 "护送船队去莫斯科：同志的信用比黄金贵。"
 ire.109.t:0 "唐宁街的三色旗"
 ire.109.d:0 "伦敦投降了。皇家卫队放下武器，威斯敏斯特的钟声在雾里显得疲惫。参谋部的军官们走上唐宁街十号的屋顶，把一面三色旗钉上旗杆——七百年了，爱尔兰第一次俯瞰英格兰。"
 ire.109.a:0 "这不是复仇，这是历史。"
 ire.109.b:0 "让全世界看到这一天。"

