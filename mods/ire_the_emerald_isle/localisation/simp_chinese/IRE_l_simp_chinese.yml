 IRE_R_collective_farms_desc:0 "生活消费品需求 -6%"
 ire.122.t:0 "银行国有化风波"
 ire.122.d:0 "军队与工人纠察队包围了都柏林的各大银行。旧银行家们要求「合理补偿」，而激进派则高呼无偿没收。都柏林权衡着两种声音：是彻底砸碎旧金融的锁链，还是用赎买换取平稳过渡？"
 ire.122.a:0 "无偿没收！"
 ire.122.b:0 "按价赎买"
