 IRE_R_econ_arms:0 "战时经济动员"
 IRE_R_econ_arms_desc:0 "把整台国家机器转向军备生产，工人们三班倒地支援前线。"
 IRE_tt_R_econ_arms:0 "获得 1 座民用工厂，360 天内工厂产出 +10%"
 IRE_R_econ_farms:0 "农业集体化"
 IRE_R_econ_farms_desc:0 "合作社取代了零散的小农经济，粮食统一调配，剩余劳动力进入工厂。"
 IRE_tt_R_econ_farms:0 "720 天内生活消费品需求 -6%，获得 5000 人力"
 IRE_R_econ_infra:0 "基建突击"
 IRE_R_econ_infra_desc:0 "铁道、公路与港口的大建设：让革命的车轮跑得更快。"
 IRE_tt_R_econ_infra:0 "随机一块己方控制领土的基础设施 +1"
 IRE_R_war_economy:0 "战时经济动员"
 IRE_R_war_economy_desc:0 "工厂产出 +10%"
