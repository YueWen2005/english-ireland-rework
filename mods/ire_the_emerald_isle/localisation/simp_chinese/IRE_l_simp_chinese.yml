 IRE_ira_neutrality:0 "爱尔兰共和军"
 IRE_ira_neutrality_DEF:0 "爱尔兰共和军"
 IRE_ira_neutrality_ADJ:0 "爱尔兰"
 IRE_free_state_democratic:0 "爱尔兰自由邦"
 IRE_free_state_democratic_DEF:0 "爱尔兰自由邦"
 IRE_free_state_democratic_ADJ:0 "爱尔兰"

 # ===== 修改意见 v2.5.0：工业线 / 黄金追讨 / 新精神 =====
 IRE_R_ind_expropriation:0 "没收与自管"
 IRE_R_ind_expropriation_desc:0 "1913 年大罢工的老兵还记得工厂委员会的样子。资本家连夜出逃，工人接管了车间——开工率反而上去了，尽管有些人再也不会回来上班。"
 IRE_R_ind_peat_shannon:0 "泥炭与香农"
 IRE_R_ind_peat_shannon_desc:0 "Ardnacrusha 水电站的涡轮已经在香农河上转了七年。爱尔兰没有煤，但有的是雨水、泥炭和不肯服输的工程师。"
 IRE_R_ind_shannon_belt:0 "香农工业带"
 IRE_R_ind_shannon_belt_desc:0 "有了电，利默里克河岸开始长出厂房。自由邦唯一成规模的制造业聚集区，就这样沿着河铺开了。"
 IRE_R_ind_rural_electrification:0 "农村电气化"
 IRE_R_ind_rural_electrification_desc:0 "电线杆一根根立进绿色的山谷。每座乡村电站都小得可怜，但加在一起，就是爱尔兰的灯。"
 IRE_R_ind_cooperative:0 "消费合作社"
 IRE_R_ind_cooperative_desc:0 "乳品合作社的账本比政府的还干净。同样的牛奶、同样的黄油，合作起来就不一样。"
 IRE_R_ind_arms_drive:0 "军工动员"
 IRE_R_ind_arms_drive_desc:0 "都柏林的民用车间挂上了军管牌。西班牙人证明了这行得通——现在轮到我们。"
 IRE_R_ind_limerick_yard:0 "利默里克船坞"
 IRE_R_ind_limerick_yard_desc:0 "香农河口的小船坞修过渔船、渡轮和走私船。现在，它们要修点别的。"
 IRE_R_ind_atlantic_trade:0 "大西洋商贸"
 IRE_R_ind_atlantic_trade_desc:0 "福因斯的水上飞机在湾里起落。战火在欧洲大陆燃烧，而爱尔兰守着新大陆的门口。"
 IRE_R_ind_workers_council:0 "工人委员会"
 IRE_R_ind_workers_council_desc:0 "车间的事，工人说了算。这是康诺利没能活着看到的一天——但它终于来了。"
 IRE_X_ind_cottage:0 "分散式工坊"
 IRE_X_ind_cottage_desc:0 "农舍里的车床、地窖里的钻机。每一家都是合法的修理铺——加在一起，是一整条生产线。"
 IRE_X_ind_hidden_cove:0 "海岸隐蔽坞"
 IRE_X_ind_hidden_cove_desc:0 "1916 年，阿斯达号在巴纳斯特兰德搁浅。那些海湾还在，暗号也还在。"
 IRE_X_ind_smuggle_net:0 "走私补给网"
 IRE_X_ind_smuggle_net_desc:0 "边境检查站查得到卡车，查不到认识每一条小路的人。补给从来不是问题，耐心才是。"
 IRE_X_ind_border_route:0 "北方走私线"
 IRE_X_ind_border_route_desc:0 "多尼戈尔的公路修到了边境线上——官方说法是发展农业。卡车夜里跑得更勤了。"
 IRE_X_ind_dundalk_depot:0 "邓多克仓库"
 IRE_X_ind_dundalk_depot_desc:0 "贝尔法斯特到都柏林的铁路正好从这儿过半。一个大仓库，一间装配棚，一群不多问的搬运工。"
 IRE_X_ind_german_tech:0 "德国技术组"
 IRE_X_ind_german_tech_desc:0 "格特茨上校的同事们带着图纸来了。德国人派不来工厂，但派得来让它转起来的人。"
 IRE_X_ind_s_plan_loot:0 "S计划分红"
 IRE_X_ind_s_plan_loot_desc:0 "考文垂的火光照亮了账本。被拆散的小型产线一批批运回爱尔兰，在乡间重新拼装。"
 IRE_X_ind_intel_net:0 "黑色情报网"
 IRE_X_ind_intel_net_desc:0 "都柏林的每一家电台、每一间商行、每一个酒馆都是耳朵。G2 监视着所有人，也被所有人利用。"
 IRE_X_ind_black_market:0 "战时黑市"
 IRE_X_ind_black_market_desc:0 "配给券买不到的东西，货架深处都有。黑市是个粗俗的老师，但它教得很好。"

 IRE_connolly_column_idea:0 "康诺利纵队"
 IRE_connolly_column_idea_desc:0 "以詹姆士·康诺利之名，志愿人员渡海远征。招募由工会联合会承办，名册送交国防部备案，运输与装备另立清单，出征日期由参谋处排定。"
 IRE_belfast_momentum:0 "罢工的干劲"
 IRE_belfast_momentum_desc:0 "罢工以工人方面的条件结束，船厂与纱厂复工。民用工厂的建设按新排期推进，建材由地方政府优先调拨。工会与厂方订立复工协议，争议提交仲裁。"
 IRE_green_arms_speed:0 "绿色行动的产线"
 IRE_green_arms_speed_desc:0 "德国工程人员进入爱尔兰的军工厂，按德方图纸改建生产线。国防部派员监造，设备经港口运入，产量报表按月送交军械署。"
 IRE_R_ind_expropriation_eff:0 "没收与自管"
 IRE_R_ind_expropriation_eff_desc:0 "工厂产出效率 +4.8%，消费品需求 −4%，资源产出 +5%。"
 IRE_R_ind_peat_eff:0 "能源自主"
 IRE_R_ind_peat_eff_desc:0 "资源产出 +15%，燃料容量 +15%，燃料产出 +10%，基建建设速度 +10%。"
 IRE_R_ind_shannon_eff:0 "工业带的节奏"
 IRE_R_ind_shannon_eff_desc:0 "全国工厂建设速度 +12%。"
 IRE_R_ind_rural_eff:0 "乡村的电流"
 IRE_R_ind_rural_eff_desc:0 "工厂产出效率 +3.2%，消费品需求 −3%。"
 IRE_R_ind_cooperative_eff:0 "合作社网络"
 IRE_R_ind_cooperative_eff_desc:0 "消费品需求 −6%，资源产出 +5%。"
 IRE_R_ind_arms_eff:0 "军工动员令"
 IRE_R_ind_arms_eff_desc:0 "工厂产出效率 +6%，稳定度 −3%，消费品需求 +2%。"
 IRE_R_ind_limerick_eff:0 "河口船坞"
 IRE_R_ind_limerick_eff_desc:0 "船坞产出效率 +6%。"
 IRE_R_ind_workers_eff:0 "工人自管"
 IRE_R_ind_workers_eff_desc:0 "工厂产出效率 +6%，消费品需求 −5%，建设速度 +15%，研究速度 +5%。"
 IRE_X_ind_cottage_eff:0 "分散的低效"
 IRE_X_ind_cottage_eff_desc:0 "分散意味着低效。工厂产出效率 −5%。"
 IRE_X_ind_hidden_cove_eff:0 "隐蔽船坞"
 IRE_X_ind_hidden_cove_eff_desc:0 "船坞产出效率 +6%。"
 IRE_X_ind_smuggle_eff:0 "走私网络"
 IRE_X_ind_smuggle_eff_desc:0 "补给消耗 −15%，脱离补给惩罚 −25%，燃料容量 +20%，陆军移动速度 +5%。"
 IRE_X_ind_german_eff:0 "德国设备"
 IRE_X_ind_german_eff_desc:0 "工厂产出效率 +6%。"
 IRE_X_ind_s_loot_eff:0 "缴获产线"
 IRE_X_ind_s_loot_eff_desc:0 "工厂产出效率 +4.8%。"
 IRE_eng_s_plan_damage:0 "S 计划的破坏"
 IRE_eng_s_plan_damage_desc:0 "爱尔兰与德国方面的破坏小组袭扰英国工厂与铁路，停工与检修接连发生。工业部把损失列入季度报告，保险赔付按新费率结算。"
 IRE_X_ind_intel_eff:0 "黑色情报网"
 IRE_X_ind_intel_eff_desc:0 "密码破译速度 +15%，加密效率 +15%。"
 IRE_X_ind_black_market_eff:0 "黑市经济"
 IRE_X_ind_black_market_eff_desc:0 "消费品需求 −6%，工厂产出效率 +4.8%。"

 IRE_R_ind_steel_coop:0 "钢铁合作社"
 IRE_R_ind_steel_coop_desc:0 "工人合作社管理的钢铁联合体，铸铁与钢梁源源输往各个工地。"
 IRE_R_ind_red_arsenal:0 "红色兵工厂"
 IRE_R_ind_red_arsenal_desc:0 "工人共和国自己的兵工厂，步枪与机枪开始成建制地下线。"
 IRE_X_ind_uboat_dock:0 "潜艇补给坞"
 IRE_X_ind_uboat_dock_desc:0 "隐蔽的潜艇补给船坞，为穿越大西洋的舰队提供燃料与鱼雷。"
 IRE_X_ind_assembly:0 "德械组装厂"
 IRE_X_ind_assembly_desc:0 "用德械零件运转的维修与总装车间，边境仓库里的枪械重新焕发生机。"

 ire.108.c:0 "先扣着观望：让黄金睡在都柏林的金库里。"
 ire.110.t:0 "敖德萨的账单"
 ire.110.d:0 "三个月了。一艘苏联货船静静停在都柏林湾，船长带来了莫斯科的口信：那批黄金，该归位了。全世界的左翼报纸都在等我们的回答。"
 ire.110.a:0 "如数奉还——名誉比黄金重。"
 ire.110.b:0 "让它见鬼去吧。爱尔兰不是任何人的账房。"
 ire.110.c:0 "折中：交还一半，剩下的折成军火。"

 # ===== 第五部分：终局剧情线 v2.6.0 =====
 IRE_R_end_trinity:0 "都柏林小组"
 IRE_R_end_trinity_desc:0 "三一学院的后楼梯间里，左翼读书会决定把他们的讨论班搬到利物浦和格拉斯哥去。名字、车票和印刷机都已备好。"
 IRE_R_end_radio:0 "红旗电台"
 IRE_R_end_radio_desc:0 "每天夜里，一段来自都柏林的中波电波越过爱尔兰海。曼彻斯特的夜班工人拧开旋钮，收音机的杂音里有一个可靠的声音。"
 IRE_R_end_birmingham:0 "工厂串联"
 IRE_R_end_birmingham_desc:0 "伯明翰的车间、克莱德河畔的船坞——联络人带着名单和传单走遍了每一个更衣室。"
 IRE_R_end_red_britain:0 "大不列颠红旗"
 IRE_R_end_red_britain_desc:0 "从泰恩河到泰晤士河，红旗在锅炉房的窗口升起。伦敦的警察局长在报告里承认：这已经不是治安问题了。"
 IRE_R_end_spark:0 "边境的火种"
 IRE_R_end_spark_desc:0 "贝尔法斯特的民权游行被水炮驱散，第二天Crowd又回来了。北爱的工人不分教派地并肩站在路障后面。"
 IRE_R_end_ulster:0 "北爱尔兰回归"
 IRE_R_end_ulster_desc:0 "当三十多万人从船坞和纺织厂涌上街头时，威斯敏斯特终于明白：保有北爱的成本已经超过了放手。"
 IRE_R_end_eve:0 "革命前夜"
 IRE_R_end_eve_desc:0 "都柏林和英共中央委员在一间安全屋里彻夜长谈。名单已经拟好，信号已经约定——只差一个口令。"
 IRE_R_end_ignite:0 "点燃革命"
 IRE_R_end_ignite_desc:0 "电话交换台「恰好」瘫痪，皇家装甲兵团按兵不动。当太阳升起时，红旗已经挂在唐宁街上——以及另一些街道上。若伦敦已经由社会主义政府执政，则跳过内战，直接推动英爱合并。"
 IRE_R_end_union:0 "不列颠联盟"
 IRE_R_end_union_desc:0 "同一面旗帜，同一场革命。都柏林的议会为不列颠的代表席留出了位置——从冰岛到法国边境，不列颠爱尔兰社会主义联邦宣告成立。"
 IRE_R_lib_paris:0 "为了巴黎"
 IRE_R_lib_paris_desc:0 "公社的后裔在等待信号。"
 IRE_R_lib_lowlands:0 "低地与莱茵"
 IRE_R_lib_lowlands_desc:0 "港口的吊车工人已经选好了罢工的日子。"
 IRE_R_lib_iberia:0 "伊比利亚之春"
 IRE_R_lib_iberia_desc:0 "国际纵队的老兵回来了，这一次是为了自己家。"
 IRE_R_lib_italy:0 "亚平宁的火"
 IRE_R_lib_italy_desc:0 "都灵的工厂委员会再次接管了车间。"
 IRE_R_lib_danube:0 "多瑙河联邦"
 IRE_R_lib_danube_desc:0 "维也纳、布达佩斯、布拉格——帝国的碎片可以拼成别的东西。"
 IRE_R_lib_balkans:0 "巴尔干黎明"
 IRE_R_lib_balkans_desc:0 "山里的人一直在等。"
 IRE_R_lib_elbe:0 "从易北到维斯瓦"
 IRE_R_lib_elbe_desc:0 "从汉堡到华沙，工厂委员会同时举起了红旗。"
 IRE_R_lib_north:0 "北方的姊妹"
 IRE_R_lib_north_desc:0 "斯德哥尔摩的码头和赫尔辛基的林场接到了同一个信号。"
 IRE_R_lib_india:0 "印度宣言"
 IRE_R_lib_india_desc:0 "孟买与加尔各答的苏维埃宣读了独立宣言。"
 IRE_R_lib_africa:0 "非洲之年"
 IRE_R_lib_africa_desc:0 "从开罗到好望角，殖民者的旗子正在一面面降下。"
 IRE_R_lib_asia:0 "南洋远征"
 IRE_R_lib_asia_desc:0 "橡胶园和种植园的苦力第一次听说了「苏维埃」这个词。"
 IRE_R_lib_mideast:0 "中东的石油"
 IRE_R_lib_mideast_desc:0 "摩苏尔的油井和巴格达的街头，同一个口号。"
 IRE_R_lib_canada:0 "枫叶旗之下"
 IRE_R_lib_canada_desc:0 "多伦多和蒙特利尔的工人在请求加入联邦。"
 IRE_R_lib_wallstreet:0 "华尔街丧钟"
 IRE_R_lib_wallstreet_desc:0 "世界革命的最后一场硬仗。银行家们已经在收拾金条了。"
 IRE_R_lib_latam:0 "拉美回声"
 IRE_R_lib_latam_desc:0 "从墨西哥到阿根廷，回声正在响起。"

 IRE_X_end_planning:0 "共同规划"
 IRE_X_end_planning_desc:0 "柏林的总参谋部会议室里，悬挂着一张标注了利物浦滩头的新地图。爱尔兰参谋们带去了潮汐表和领航员。"
 IRE_X_end_sealion:0 "海狮侧翼"
 IRE_X_end_sealion_desc:0 "海狮计划需要一个跳板。爱尔兰提供机场、港湾和三十个不问来处的补给仓库。"
 IRE_X_end_liverpool:0 "进军利物浦"
 IRE_X_end_liverpool_desc:0 "绿夹克团与德国装甲同时出发——一个渡海，一个过境。伦敦的政府会发现，他们要同时应付两条火线。"
 IRE_X_end_westburg:0 "新秩序的西堡"
 IRE_X_end_westburg_desc:0 "在柏林的条约桌上，爱尔兰的代表微笑着摊开地图。英国本土的处置权归都柏林——这是德方早已默许的。"
 IRE_X_ord_west:0 "巩固西欧"
 IRE_X_ord_west_desc:0 "新秩序从家门口开始整理。"
 IRE_X_ord_lowlands:0 "低地与莱茵"
 IRE_X_ord_lowlands_desc:0 "鹿特丹与安特卫普的港务局即将易主。"
 IRE_X_ord_iberia:0 "伊比利亚秩序"
 IRE_X_ord_iberia_desc:0 "里斯本和毕尔巴鄂的商人们在计算新的关税。"
 IRE_X_ord_italy:0 "亚平宁之鹰"
 IRE_X_ord_italy_desc:0 "罗马的立场需要重新校准。"
 IRE_X_ord_danube:0 "多瑙河臣服"
 IRE_X_ord_danube_desc:0 "维也纳、布达佩斯、布拉格——中欧的城市将学会新的规矩。"
 IRE_X_ord_balkans:0 "巴尔干新秩序"
 IRE_X_ord_balkans_desc:0 "贝尔格莱德和索菲亚的新市长已经拟好了名单。"
 IRE_X_ord_elbe:0 "从易北到维斯瓦"
 IRE_X_ord_elbe_desc:0 "从汉堡到华沙，新秩序的公文格式是统一的。"
 IRE_X_ord_north:0 "北方的臣服"
 IRE_X_ord_north_desc:0 "斯堪的纳维亚的铁矿石将驶向新的方向。"
 IRE_X_ord_india:0 "印度新秩序"
 IRE_X_ord_india_desc:0 "新德里和孟买的总督府正在更换匾额。"
 IRE_X_ord_africa:0 "非洲之年"
 IRE_X_ord_africa_desc:0 "开罗到好望角，旗子该换新的了。"
 IRE_X_ord_asia:0 "南洋新秩序"
 IRE_X_ord_asia_desc:0 "橡胶、锡矿和港口——南洋的账本重新登记。"
 IRE_X_ord_mideast:0 "中东的石油"
 IRE_X_ord_mideast_desc:0 "摩苏尔与阿巴丹的油管通向新的盟友。"
 IRE_X_ord_canada:0 "北美的秩序"
 IRE_X_ord_canada_desc:0 "渥太华的国会山将重新理解「主权」一词。"
 IRE_X_ord_wallstreet:0 "最后的敌人"
 IRE_X_ord_wallstreet_desc:0 "新秩序的最后敌人不与任何人为伍。"
 IRE_X_ord_latam:0 "拉美回声"
 IRE_X_ord_latam_desc:0 "布宜诺斯艾利斯的德国俱乐部订了更多香槟。"

 IRE_ENG_red_radio:0 "面向工人的电波"
 IRE_ENG_red_radio_desc:0 "都柏林的对欧广播每晚定时播出，工人区的屋顶上架起了天线。宣传处按周编排节目，稿件先经审查再送发射台。收听情况由各郡警署按月呈报内政部。"
 IRE_ENG_red_strike:0 "罢工浪潮"
 IRE_ENG_red_strike_desc:0 "伯明翰与克莱德赛德的机器停转，工厂大门外聚集人群。罢工委员会向伦敦递交清单，地方警力按内政部命令布防。厂方拒绝谈判，生产计划改由部分复工维持。"
 IRE_R_intel_network:0 "渗透网络"
 IRE_R_intel_network_desc:0 "从船坞到俱乐部，都柏林的耳目遍布不列颠。破译与加密效率提升。"
 IRE_R_red_volunteers:0 "革命志愿军团"
 IRE_R_red_volunteers_desc:0 "报名处在都柏林邮局门口排起了队。志愿军上限 +2。"
 IRE_world_revolution_hq:0 "世界革命指挥部"
 IRE_world_revolution_hq_desc:0 "从都柏林发出的电报决定各地起事的时刻，联络员、密码本与经费按区分派，宣传与行动的日程由总部统一排定，各支部按月复命。"
 IRE_berlin_partner:0 "柏林的伙伴"
 IRE_berlin_partner_desc:0 "柏林信任我们，因为彼此都需要对方。德方顾问常驻都柏林，军工订货与原料供应另立协定，技术图纸另行交付。往来电报由外交部归档。"
 IRE_atlantic_fortress:0 "大西洋堡垒"
 IRE_atlantic_fortress_desc:0 "自贝尔法斯特至布雷斯特，大西洋沿岸纳入同一防务体系。要塞区按段设司令部，岸炮、雷达与巡逻队统一调度，防务协定经外交部换文生效。"

 ire.111.t:0 "贝尔法斯特的百合花"
 ire.111.d:0 "没有一枪一弹。北爱尔兰的行政权在一个潮湿的星期二上午完成了交接，市政厅上空的旗帜换成了三色旗。伦敦的报纸只登了一小块角落，而贝尔法斯特全城都在放礼炮。"
 ire.111.a:0 "三色旗升上市政厅。"
 ire.111.b:0 "大赦、和解，让过去的过去。"
 ire.111.c:0 "在边境筑起新的哨所。"
 ire.112.t:0 "不列颠的寒冬"
 ire.112.d:0 "红旗在曼彻斯特和格拉斯哥升起了。伦敦宣布全国紧急状态，但皇家海军的三分之一的士兵拒绝登舰。革命已经越过了爱尔兰海——现在的问题只有一个：我们站在哪一边？"
 ire.112.a:0 "命令志愿军即刻渡海。"
 ire.112.b:0 "把军火送上同志们的码头。"
 ire.112.c:0 "静观其变。"
 ire.113.t:0 "红旗与三色旗"
 ire.113.d:0 "两个岛屿，一场革命。不列颠的代表团在都柏林城堡签署了联合声明：从今往后，从科克到阿伯丁，只有一个国家。欧洲的报纸标题只写了两个字：《完了》。"
 ire.113.a:0 "一个国家，一种信念。"
 ire.113.b:0 "皇家海军的锚，现在归我们了。"
 ire.113.c:0 "为新的公民腾出土地与工作。"
 ire.114.t:0 "西堡的分赃"
 ire.114.d:0 "英国已经投降。在柏林的条约桌上，里宾特洛普微笑着请爱尔兰代表先开口——这是德国人提前许诺的份额，也是未来合作的试金石。"
 ire.114.a:0 "爱尔兰要全部本土。"
 ire.114.b:0 "让出英格兰北部，换取柏林的信任。"
 ire.114.c:0 "本土归我，海外归德国。"

 IRE_defend_cat:0 "保卫爱尔兰"
 IRE_defend_ireland_1:0 "保卫爱尔兰（全民警戒）"
 IRE_defend_ireland_1_desc:0 "战争已至国门。海岸瞭望哨、地方防卫队与应募持枪者一并编入国土防线，各郡设征募站，防区按海岸段划分。命令经陆军总部下达，名册报国防部备案。"
 IRE_defend_ireland_2:0 "保卫爱尔兰（焦土动员）"
 IRE_defend_ireland_2_desc:0 "敌军已踏上爱尔兰土地。政府焚毁档案、征用车辆、疏散城市人口，各村按防区编为抵抗据点。行政命令由郡政厅转达，执行情况逐日上报内阁。"
 IRE_defend_ireland_3:0 "保卫爱尔兰（全民抗战）"
 IRE_defend_ireland_3_desc:0 "都柏林流传投降之说，征募站前却仍有人排队。全岛转入动员状态，后勤、工厂与农田一并供前线调用。征用清单与配给办法由内阁核定后颁行。"
 IRE_defend_ireland_4:0 "保卫爱尔兰（最后堡垒）"
 IRE_defend_ireland_4_desc:0 "首都已可闻炮声。正规军、地方防卫队与海外志愿兵在都柏林外围构筑防线，工事按段分配，火力由炮兵统一调度。防御命令经总参谋长签署后下达。"
 IRE_defend_ireland_5:0 "保卫爱尔兰（不屈之岛）"
 IRE_defend_ireland_5_desc:0 "政府拒绝投降，广播电台连续播发公告。自贝尔法斯特至科克，各城镇自行组织抵抗，地方委员会接管治安与物资。各地报告经郡政厅汇总送内阁。"
 IRE_defend_levy_1:0 "动员地方防卫队"
 IRE_defend_levy_1_desc:0 "征召两个地方防卫队民兵连，在都柏林指定营地集结。点名、发枪与补给由军区司令部办理，营房与炊事另行安排。编成表与实到人数报陆军总部备案。"
 IRE_defend_levy_2:0 "征召预备役"
 IRE_defend_levy_2_desc:0 "把预备役人员补入正规军，按册配发库存步枪与弹药。体检与编组在军区办理，班长自现役部队抽调。报到名册经国防部核销后归档，缺额另行补齐。"
 IRE_defend_levy_3:0 "武装每一座村庄"
 IRE_defend_levy_3_desc:0 "向各郡分发武器，按村镇组织自卫队。枪械登记由郡政厅办理，教官自军中派出，训练课目与值勤表一并下发。弹药另设专柜保管，每月点验。"
 IRE_defend_levy_4:0 "都柏林防线"
 IRE_defend_levy_4_desc:0 "在都柏林外围构筑防线，正规军与野鹅志愿兵一并投入。工事分段发包，火力配系由炮兵处排定，部队进入阵地后报总参谋部。"
 IRE_defend_levy_5:0 "全岛总动员"
 IRE_defend_levy_5_desc:0 "全岛总动员。能持枪者按郡编入作战序列，工厂与运输工具一并征用，民政事务移交地方委员会。动员令经内阁签署后由陆军总部逐级下达，名册汇总归档。"
 IRE_defend_last_levy:0 "最后征召"
 IRE_defend_last_levy_desc:0 "持续征召最后一批预备役，按册补入前线缺额。征召令由军区逐批下达，体检与输送同时办理。补充名册报陆军总部备案，未到者由郡政厅催办。"

 IRE_B_bord_na_mona:0 "博德纳莫纳泥炭局"
 IRE_B_bord_na_mona_desc:0 "泥炭开发局在中部沼泽开辟采掘场，泥炭送往新建的电厂与燃料厂。电力供应局架设输电线，工业与家庭用煤的配额由供给部核定。"
 IRE_B_aer_lingus:0 "爱尔兰航空"
 IRE_B_aer_lingus_desc:0 "航空局与航运公司合资组建航空公司，先开都柏林至布里斯托尔航线，再扩展至欧洲大陆。民航处核发营运许可，机场与无线电导航设施由国防部协助建设。"
 IRE_B_ida:0 "工业发展局"
 IRE_B_ida_desc:0 "工业发展局依立法设立，向外资企业提供厂房、贷款与税项减免。工商部审核申请，投资方案连同就业估算一并送交内阁经济委员会。"
 IRE_B_irish_shipping:0 "爱尔兰航运"
 IRE_B_irish_shipping_desc:0 "爱尔兰航运公司以政府担保的贷款购入旧船，挂爱尔兰旗营运。供给部核定进口配额，船长受命在战时航线上维持食品与燃料的运送。"
 IRE_B_national_army:0 "国民军扩建"
 IRE_B_national_army_desc:0 "国防部按正规军编制改组部队，设立军械、通信与运输各兵种。参谋学院开办训练班，军官由各郡征募后集中受训，编制表报众议院核准。"
 IRE_B_diaspora_bonds:0 "侨民战争公债"
 IRE_B_diaspora_bonds_desc:0 "财政部在波士顿、纽约与芝加哥设立公债代售处，由当地爱尔兰社团代为劝募。款项汇回都柏林后折成本国货币，登记入战争公债账册。"
 IRE_bord_na_mona:0 "博德纳莫纳"
 IRE_bord_na_mona_desc:0 "国家泥炭局让沼泽成为能源产地，减少对进口燃料的依赖。开采区按县划界，泥炭交发电站与民用配给，运输由铁路与运河分担。"
 IRE_aer_lingus:0 "爱尔兰航空"
 IRE_aer_lingus_desc:0 "国有航空公司按年开辟欧洲与北大西洋航线，机场、油料与时刻由航空局统筹，客货邮件一并承运。公司董事会由交通部任命，账目公开。"
 IRE_ida:0 "工业发展局"
 IRE_ida_desc:0 "以国家信用为担保的工业投资机构，负责引进外资与技术，向新建工厂提供股本与贷款。董事会由财政部、工业部与商会各派代表组成。"
 IRE_irish_shipping:0 "爱尔兰航运"
 IRE_irish_shipping_desc:0 "挂绿旗的商船队在战时维持岛国的补给线。供给部核定航线与货载，海军服务处提供护航联络，船只进出港按班期登记。遇有损失，由财政部核销。"
 IRE_national_army:0 "国民军"
 IRE_national_army_desc:0 "国防部维持一支按正规编制训练的小型陆军，装备与薪饷列入年度预算。部队轮派驻外任务，参谋部拟定动员计划，编制表送交众议院国防委员会。"
 IRE_B_diaspora_bonds_idea:0 "侨民战争公债"
 IRE_B_diaspora_bonds_idea_desc:0 "侨民汇款与志愿人员经外交部与教会渠道进入爱尔兰。财政部设专账管理，招募站设于侨民社团会所，名册按月送交国防部，账目按季公布。"
 IRE_econ_industry_bonus:0 "工业技术加速"
 IRE_B_air_bonus:0 "航空技术加速"

 IRE_memoir_cat:0 "新世界轶事"
 IRE_nw_guinness_export:0 "吉尼斯出口配额"
 IRE_nw_guinness_export_desc:0 "战争使伦敦的酒馆依赖爱尔兰黑啤，配额由商务部与白厅议定，出口单据经海关核销，外汇折入财政部账目。海关按季核对出口数量与结汇凭证。"
 IRE_nw_irish_coffee:0 "福因斯的爱尔兰咖啡"
 IRE_nw_irish_coffee_desc:0 "1943年，福因斯的厨师把咖啡、威士忌与奶油调在一处，款待滞留的跨大西洋旅客。此后该饮品列入机场招待规程，配方由航空局归档。"
 IRE_nw_shannon_stopover:0 "香农跨大西洋中转"
 IRE_nw_shannon_stopover_desc:0 "战后跨大西洋航线须在中途加油，香农机场据此添建跑道与油库，起降时刻由航空局排定，海关与移民柜台同时设立。机场由航空局直辖，驻场人员列入编制。"
 IRE_nw_quiet_man:0 "好莱坞来到梅奥"
 IRE_nw_quiet_man_desc:0 "1952年，约翰·福特率剧组到梅奥郡拍摄《蓬门今始为君开》，外景场地由旅游局协调，地方警署维持秩序，胶片随后运回好莱坞。"
 IRE_nw_celtic_tiger:0 "凯尔特之虎"
 IRE_nw_celtic_tiger_desc:0 "香农自由区、低税率与年轻劳动力三者并用，外资设厂的申请由工业发展局逐件审理，出口统计逐年上修。出口加工区的批文由财政部核发。"
 IRE_celtic_tiger:0 "凯尔特之虎"
 IRE_celtic_tiger_desc:0 "开放、投资与教育使这个小岛进入欧洲经济的快车道。工业发展局审核外资申请，教育部扩充技术学校，出口统计按季公布。"
 ire_nw.70.t:0 "吉尼斯的琥珀色"
 ire_nw.70.d:0 "伦敦报馆抱怨黑啤供应不足，吉尼斯公司据此请求放宽出口配额，并附上近年的装船记录。财政部注意到这笔外汇，贸易部则顾虑本国配给。两部意见相左，案卷已送内阁经济委员会，委员会定于下周听取双方陈述。"
 ire_nw.70.a:0 "向伦敦出口黑啤"
 ire_nw.70.b:0 "优先供应本国市场"
 ire_nw.71.t:0 "福因斯的第一杯爱尔兰咖啡"
 ire_nw.71.d:0 "一位美国飞行员在福因斯等到天亮，航班因天气取消。厨师谢里登往咖啡里加了威士忌与奶油，问他味道如何。泛美航空的驻地代表把这件事记进值班簿，机场管理处另抄一份送工商部归档，稿样登在机场月报上。"
 ire_nw.71.a:0 "请美国飞行员喝一杯。"
 ire_nw.71.b:0 "严格中立，只卖咖啡。"
 ire_nw.72.t:0 "香农的过境权"
 ire_nw.72.d:0 "跨大西洋航班须在中途加油。华盛顿希望香农成为自由中转站，伦敦希望军用飞机也能在此起降。两份照会先后送到外交部，措辞都很客气。航空局已就跑道与油料设施提出方案，内阁须先定过境的范围。"
 ire_nw.72.a:0 "准盟军飞机过境。"
 ire_nw.72.b:0 "只办民用中转。"
 ire_nw.73.t:0 "好莱坞来到梅奥"
 ire_nw.73.d:0 "约翰·福特拟在梅奥郡拍摄一部关于爱尔兰的影片，剧组带来资金、摄影机与技术人员。新闻局与地方政府就外景地、道路使用与群众演员作出安排，拍摄许可由工商部核发。地方警署负责维持外景地秩序，税务署登记剧组支出。"
 ire_nw.73.a:0 "全力配合拍摄"
 ire_nw.73.b:0 "不予打扰乡野"
 ire_nw.74.t:0 "凯尔特之虎时代"
 ire_nw.74.d:0 "香农自由区的灯火彻夜不熄，外资工厂在都柏林郊外陆续建成。经济学界以一个新词称呼爱尔兰。工业发展局接办新的设厂申请，出口统计按月公布。财政部据此修订税收估算，铁路增开货运班次，港务当局扩建码头。"
 ire_nw.74.a:0 "让凯尔特之虎前行"

