 IRE_R_stage_rally:0 "工会总动员"
 IRE_R_stage_rally_desc:0 "把都柏林的工会大厅重新填满。码头工人、铁路工人、电车司机——每一个还能被组织起来的人，都要进入这张网。"
 IRE_R_stage_militia:0 "工人纠察队整编"
 IRE_R_stage_militia_desc:0 "国有化工厂的纠察队已经不只是守门的了。给他们发枪、发编制、发军饷，让工人自己保卫自己的工厂。"
 IRE_R_stage_radio:0 "对英广播攻势"
 IRE_R_stage_radio_desc:0 "用大功率电台越过爱尔兰海，让利物浦和格拉斯哥的工人在收音机里听到另一种可能。最多进行三次。"
 IRE_R_stage_internationale:0 "召开世界革命大会"
 IRE_R_stage_internationale_desc:0 "英爱已经合为一体。现在把全欧洲的兄弟政党请到都柏林来，让他们看看一个国家真正属于工人时是什么样子。"

 IRE_X_stage_rally:0 "民族主义群众集会"
 IRE_X_stage_rally_desc:0 "把失望的人聚起来，告诉他们贫穷不是命运，而是别人造成的。集会越盛大，街头就越属于我们。"
 IRE_X_stage_smuggle:0 "走私军火入库"
 IRE_X_stage_smuggle_desc:0 "金塞尔湾的夜色里，渔船吃水很深。卸货的人是可靠的，账本只记在心里。"
 IRE_X_stage_tech:0 "德国技术代表团"
 IRE_X_stage_tech_desc:0 "柏林派来的教官不谈政治，只谈战术与装备。他们带来的是欧洲最好的军事科学，代价是让他们看见我们的一切。最多三次。"
 IRE_X_stage_neworder:0 "新秩序宣言"
 IRE_X_stage_neworder_desc:0 "伦敦已经沉默。现在轮到都柏林向大陆宣布：大西洋的这一端，从此有新的主人。"

 IRE_tt_R_stage_rally:0 "战争支持 +3%、稳定度 +2%、红色团结 +5"
 IRE_tt_R_stage_militia:0 "获得 8000 人力、15 陆军经验、战争支持 +2%"
 IRE_tt_R_stage_radio:0 "英国共产主义支持度 +5%、稳定度 +1%（最多 3 次）"
 IRE_tt_X_stage_rally:0 "法西斯主义支持度 +3%、战争支持 +3%、稳定度 +1%"
 IRE_tt_X_stage_smuggle:0 "获得 600 步兵装备、150 支援装备、暴露度 +5"
 IRE_tt_X_stage_tech:0 "获得 1 次陆军学说研究加成 20%、20 陆军经验、暴露度 +5（最多 3 次）"

 ire.120.t:0 "都柏林大会"
 ire.120.d:0 "来自十二个国家的代表坐在都柏林市政厅里。他们中的一些人还带着牢狱的气味，一些人已经在自己的国家里执政。\n\n爱尔兰用二十年证明了一件事：一个贫穷的岛国，只要工人真的掌握了自己的命运，就能把帝国从地图上抹去。现在的问题是，这个经验能否被复制。"
 ire.120.a:0 "向各国兄弟政党提供一切援助"
 ire.120.b:0 "先把爱尔兰建成样板"
 ire.120.c:0 "建军优先，为下一场战争准备"

 ire.121.t:0 "新秩序宣言"
 ire.121.d:0 "舰队停泊在泰晤士河口，伦敦的灯火第一次不是由白厅点亮的。\n\n从大西洋到乌拉尔，旧的秩序正在崩塌，而都柏林必须决定自己在这张新地图上的位置——是继续向大陆进军，还是先把手中的战利品消化干净。"
 ire.121.a:0 "向大陆进军"
 ire.121.b:0 "先固内政"
 ire.121.c:0 "掠夺战利品，充实军械库"

 IRE_R_stage_land:0 "土地再分配"
 IRE_R_stage_land_desc:0 "地主的地契在县政厅的火炉里烧掉。分区委员会把土地分给真正耕种它的人——这是共和国大会给农民的第一张收据。"
 IRE_R_stage_women:0 "妇女劳动动员"
 IRE_R_stage_women_desc:0 "工厂的招工启事第一次对所有女性敞开。托儿所、食堂、夜班轮值表——让一半的人口从厨房走进车间。"
 IRE_R_stage_north:0 "贝尔法斯特工人联合"
 IRE_R_stage_north_desc:0 "把天主教徒和新教徒的工会代表请到同一张桌子前。只要他们还为同一个老板干活，分裂就是老板最好的武器。"

 IRE_X_stage_youth:0 "青年团操练"
 IRE_X_stage_youth_desc:0 "周末的山谷里，青年团在雨里列队。他们学的不只是行军，还有谁该为这个国家的贫困负责。"
 IRE_X_stage_blackmarket:0 "黑市网络经营"
 IRE_X_stage_blackmarket_desc:0 "从科克到德里，走私路线在账本上只是一串渔船编号。只要账目干净，港口就是我们的。"
 IRE_X_stage_police:0 "警察总局改组"
 IRE_X_stage_police_desc:0 "把认为「秩序就是伦敦的秩序」的人从都柏林堡里请出去，换上知道新秩序属于谁的人。"

