 ire.122.t:0 "银行国有化风波"
 ire.122.d:0 "军队与工人纠察队包围了都柏林的各大银行。旧银行家们要求「合理补偿」，而激进派则高呼无偿没收。都柏林权衡着两种声音：是彻底砸碎旧金融的锁链，还是用赎买换取平稳过渡？"
 ire.122.a:0 "无偿没收！"
 ire.122.b:0 "按价赎买"
 POLITICS_IRE_POLLITT_DESC:0 "哈利·波利特（1890-1960），大不列颠共产党总书记。红色的不列颠群岛，如今有了同一位舵手。"
 POLITICS_IRE_MOSLEY_DESC:0 "奥斯瓦尔德·莫斯利（1896-1980），不列颠法西斯联盟的男爵。皇冠与竖琴之下，帝国有了新主人。"

# ---- v2.14.0 开局隐藏机制说明事件（ire.130-136）----
IRE_mech_t1:0 "翡翠岛的说明书"
IRE_mech_p1:0 "你好，总理。\n\n这份 mod 里有几个「看不见的数值」：它们不在界面上直接显示，只通过国策、事件和决议的提示（tooltip）告诉你增减。\n\n接下来几页会用很短的篇幅讲清楚每个数值是什么、怎么涨、有什么用。\n\n随时可以选择「跳过」——之后也可以在 mod 目录的 docs/隐藏机制说明.md 重新查阅。\n\n本说明只在开局出现这一次。"
IRE_mech_t2:0 "红色团结"
IRE_mech_p2:0 "【红色团结】（0–100｜完成《红色转折》后启用）\n\n红色爱尔兰的内部团结度，本身不给任何加成，只决定红线后期能否走通关键步骤。\n\n· 高于 50：解锁国策《贝尔法斯特罢工》\n· 40–70：每月 15% 概率触发一次「宗派危机」事件\n· 完成《中立劳工运动》：上限提升至 110\n\n主要来源：《红色转折》+10、《康诺利纵队》+10、《共和大会》+15、决议《工人读报班》每次 +5（50 政治点，可重复）；对教会妥协等选项会 −10。\n\n提示：团结掉了只能靠读报班慢慢补，红线后期卡门槛会很疼。"
IRE_mech_t3:0 "暴露度"
IRE_mech_p3:0 "【暴露度】（0–100｜IRA 军事委员会内战线上台后启用）\n\nIRA 地下活动被英国情报机关盯上的程度。\n\n· 黑线期间每月固定 +5\n· 走私军火、黑市工厂、技术窃取等决议各 +3～+5\n· 部分谨慎选项可大幅降温（最多 −30）\n\n· 高于 50：触发英国情报警告事件\n· 高于 90：触发「清洗」危机——处理不好会引爆内战\n\n一句话攻略：黑线是在和英国情报赛跑。想要装备和工厂就得吃暴露度，吃多了要在摊牌前主动降温。"
IRE_mech_t4:0 "公投线的暗账"
IRE_mech_p4:0 "【公投支持度】（0–100｜边境公投线）\n决定公投结局：≥90 英国和平移交六郡；70–89 移交但遭制裁；低于 70 公投失败。\n\n【民族主义支持】（0–100｜公投线）\n≥80 时公投必然通过，部分事件选项也会随之改变。"
IRE_mech_t5:0 "跨海与中立"
IRE_mech_p5:0 "【侨民网络】（0–100｜A 线跨海路线）\n20 / 40 / 60 / 80 / 100 五档，逐档解锁「跨海网络」系列精神。\n\n【中立信誉】（0–100｜中立路线）\n影响中立相关事件与外交选项的走向。"
IRE_mech_t6:0 "决议计数器"
IRE_mech_p6:0 "【决议计数器】\n护航次数、渡轮次数、债券认购、德国特使、美国志愿军、加拿大开发、电台攻势、罢工次数……\n\n这些小计数器只用于解锁后续阶段和内容，按正常节奏点决议就行，不需要刻意管理。"
IRE_mech_t7:0 "规则备忘"
IRE_mech_p7:0 "【吞并与殖民】\n· 吞并大英：其核心领土自动成为爱尔兰核心，大英将领全部并入我军\n· 武力吞并时非洲殖民地独立为真实国家——英属为埃及、苏丹、肯尼亚、尼日利亚等，法属为阿尔及利亚、突尼斯、摩洛哥等（法国投降时同理）；若英国在革命前已自行变为社会主义国家并和平合并，其殖民地随联盟保留\n· 解放线对同一国家只授予一次宣战理由\n\n【解放线】（红线·世界革命分支）\n15 个解放国策在不列颠联盟建立后全部并列开放（欧洲 8 项 / 亚非 4 项 / 美洲 3 项分行排列），可任意顺序推进。若某国策的全部目标国都已是社会主义国家（或已灭亡），该国策自动跳过。\n\n祝你好运。Éire go brách！"
IRE_mech_opt_next:0 "下一页"
IRE_mech_opt_skip:0 "跳过说明（不再显示）"
IRE_mech_opt_done:0 "我记住了"
IRE_R_lib_judge_tt:0 "§Y解放或侵略判定§!（红线解放线专用）：当本国策的全部目标国都已完成社会主义革命（共产主义政权）或已灭亡时，本国策将自动跳过并视为已完成；仍存在旧秩序的目标国才会照常推进（获得吞并宣战理由）。黑线的侵略宣战不受此限制。"
 # ---- 柏林-都柏林轴心（黑线联机线）事件与精神 ----
 ire_ger_coop.1.t:0 "都柏林的暗手"
 ire_ger_coop.1.d:0 "爱尔兰的新政权主动向我们伸出了橄榄枝。他们的影子兵工厂藏在谷仓与农舍之下，急需顾问与图纸。阿勃维尔相信，这是把大西洋东岸变成帝国前哨的第一步。"
 ire_ger_coop.1.a:0 "派出顾问团（爱尔兰获得经验与德械，我们获得情报与经验加成）"
 ire_ger_coop.1.b:0 "爱尔兰人的冒险与我们无关"
 ire_ger_coop.2.t:0 "来自爱尔兰的客人"
 ire_ger_coop.2.d:0 "几名操着盖尔语口音的客人抵达柏林。他们自称是来“考察”的——阿勃维尔很清楚，这是都柏林在用间谍换技术。而训练他们，我们的密码部门同样能从他们的实战经验中受益。"
 ire_ger_coop.2.a:0 "全面训练（爱尔兰获得特工位，我们获得密码破译加成）"
 ire_ger_coop.2.b:0 "请他们回去"
 ire_ger_coop.3.t:0 "军火出口订单"
 ire_ger_coop.3.d:0 "都柏林发来一张诱人的订单：整建制师规模的德械制式化采购。陆军司令部保证，这笔出口所得足以让三家兵工厂开足马力。"
 ire_ger_coop.3.a:0 "接下订单（爱尔兰获得德械，我们获得军工生产加成）"
 ire_ger_coop.3.b:0 "婉拒这笔生意"
 IRE_G_dark_hand:0 "都柏林的暗手"
 IRE_G_dark_hand_desc:0 "地下网络在英伦三岛的每座港口设有一名联络员，船员与码头工负责传递。情报汇总至都柏林的专设科，按周报送参谋部。交接以口头为准，不留书面记录。"
 IRE_G_guest_training:0 "爱尔兰客人"
 IRE_G_guest_training_desc:0 "带回实战经验的教官进入我们的训练体系，讲授爆破、跟踪与电台操作。课程由情报处排定，结业人员编入现役小组。训练科目与考核结果逐期上报情报处。"
 IRE_G_export_order:0 "军火出口订单"
 IRE_G_export_order_desc:0 "都柏林签下的整建制订单分派给三家兵工厂，生产线按班次连续运转。验收由军械处派员驻厂，交货期限写入合同。货款按批次结算，余款转入国防预算。"
 IRE_coop_operative_slot:0 "柏林归来的特工"
 IRE_coop_operative_slot_desc:0 "首批爱尔兰特工已自阿勃维尔训练体系毕业，分派各站。人员名册与掩护身份由 G2 保管，经费列入秘密预算，考绩按季呈报，不合格者召回。"
 # ---- 柏林-都柏林轴心 第二批 ----
 ire_ger_coop.4.t:0 "大西洋的燃料库"
 ire_ger_coop.4.d:0 "都柏林提出：把我们的大西洋港口交给你们的潜艇部队使用。港口的位置得天独厚——从这里出击，比斯开湾以西的每一支护航船队都在狼群的猎场之内。海军司令部认为，这将从根本上改变对英海上破交战的效率。"
 ire_ger_coop.4.a:0 "接受港口协议（爱尔兰获得船坞产出与海军经验，我们获得破交加成）"
 ire_ger_coop.4.b:0 "爱尔兰的港口帮不了我们"
 ire_ger_coop.5.t:0 "绿色海岸行动"
 ire_ger_coop.5.d:0 "都柏林的参谋们完成了对英登陆的可行性研究，并主动提出与我国共享全部成果。他们的特工熟悉英伦三岛的每一处海岸——这份情报，正是海狮计划最缺的东西。"
 ire_ger_coop.5.a:0 "共享登陆计划（爱尔兰获得登陆与计划加成，我们获得计划速度加成）"
 ire_ger_coop.5.b:0 "都柏林的纸上谈兵就此打住"
 ire_ger_coop.6.t:0 "柏林-都柏林条约"
 ire_ger_coop.6.d:0 "都柏林正式请求与德意志帝国缔结全面同盟。一个位于英国西侧门户的盟友，一支熟悉英伦海岸的军队，一座永不沉没的大西洋前哨——帝国需要这个伙伴，而都柏林需要帝国的保护伞。"
 ire_ger_coop.6.a:0 "签署条约（爱尔兰加入我方阵营，双方互得永久盟约加成）"
 ire_ger_coop.6.b:0 "爱尔兰人应该先学会独自作战"
 ire_ger_coop.7.t:0 "莱茵兰的进军"
 ire_ger_coop.7.d:0 "德国军队开进了莱茵兰非军事区。都柏林的新政权密切关注着这位未来盟友的每一个动作——柏林的决心值得学习。"
 ire_ger_coop.7.a:0 "研究德军的做法"
 ire_ger_coop.8.t:0 "德国的四年计划"
 ire_ger_coop.8.d:0 "柏林宣布了雄心勃勃的四年计划。都柏林的经济顾问们连夜研读这份文件——一个正在重整军备的大市场，正在向爱尔兰敞开。"
 ire_ger_coop.8.a:0 "跟进德国的经济模式"
 ire_ger_coop.9.t:0 "德奥合并"
 ire_ger_coop.9.d:0 "德意志国防军跨过了奥地利边境，几乎没有流血。都柏林的军官们从中看到了一场教科书式的行动——而德国的兵工厂，也在向未来的盟友敞开大门。"
 ire_ger_coop.9.a:0 "派遣军官团考察"
 ire_ger_coop.10.t:0 "慕尼黑的笔墨"
 ire_ger_coop.10.d:0 "一纸协定，苏台德易手。都柏林的情报部门注意到：柏林的谈判艺术与其军备同样精良。阿勃维尔的朋友愿意向爱尔兰分享其中的经验。"
 ire_ger_coop.10.a:0 "深化情报合作"
 ire_ger_coop.11.t:0 "但泽的战争阴云"
 ire_ger_coop.11.d:0 "柏林向华沙发出了最后通牒。战争已经迫在眉睫——都柏林知道，属于爱尔兰的时刻也快到了。全国上下进入戒备。"
 ire_ger_coop.11.a:0 "进入战备状态"
 ire_ger_coop.12.t:0 "柏林-都柏林轴心（联机推荐）"
 ire_ger_coop.12.d:0 "黑线（武装斗争线）支持双人联机玩法：邀请你的朋友扮演德国（使用史实国策线），你选择爱尔兰黑线，即可触发「柏林-都柏林轴心」联动。\n\n联动规则：\n· 爱尔兰完成影子兵工厂、阿勃维尔的客人、德械标准、潜艇坞、登陆计划、柏林伙伴等黑线国策时，德国玩家会收到联动事件，选择合作或婉拒——合作则双方各得加成；\n· 德国每完成莱茵兰、四年计划、安施鲁斯、苏台德、但泽等史实里程碑，爱尔兰也会收到对应的支援事件；\n· 联动仅在德国由玩家操控且走史实线（法西斯、未选「反对希特勒」）时生效；\n· 德国侧的联动国策在他的国策树最右侧——记得告诉他：把视角一路往右拖到底，§Y右侧空地上的独立一列§!就是，共六环，军火走廊还向右伸出四环工业化支线。\n\n单人模式：德国由 AI 操控时，联动将自动按「合作」结算，黑线单人体验不受影响。祝你们在下一场大战中好运！"
 ire_ger_coop.12.a:0 "都柏林-柏林，一线相连"
 IRE_coop_atlantic_port:0 "大西洋的前哨"
 IRE_coop_atlantic_port_desc:0 "德国潜艇正在我们的大西洋港口补给。船坞昼夜开工，煤、油与鱼雷由海军部军需处调拨，补给记录另册存放，出入港时刻不予公布。"
 IRE_G_wolf_pack:0 "狼群的燃料库"
 IRE_G_wolf_pack_desc:0 "大西洋港口向潜艇部队开放，燃料、鱼雷与修船坞按协议提供。海军作战处统一安排出航与返航时间，港务记录另行封存。港口宪兵负责区界警戒，船员不得登岸。"
 IRE_coop_green_shore:0 "绿色海岸计划"
 IRE_coop_green_shore_desc:0 "与德军共享的对英登陆计划已经就绪。参谋人员按同一张海图作业，船只、潮汐与滩头分配由联合小组核定，计划副本分存两处。"
 IRE_G_sealion_prep:0 "海狮的拼图"
 IRE_G_sealion_prep_desc:0 "特工完成英伦三岛海岸的测绘，潮汐、滩涂与铁路节点编成图册。参谋部据此修订登陆预案，各军种按同一份时间表作业。图册按密级分存三处，取阅须登记。"
 IRE_T_treaty_ally:0 "柏林-都柏林条约"
 IRE_T_treaty_ally_desc:0 "与德意志帝国缔结的同盟条约经双方批准生效。德军联络组进驻都柏林，军需与原料按协定交换，联合演习每年举行。双方外交部按季换文，通报执行情况。"
 IRE_G_dublin_treaty:0 "都柏林盟约"
 IRE_G_dublin_treaty_desc:0 "条约把爱尔兰定为帝国在大西洋东岸的前哨，德国派常驻军事代表。港口使用权、军火供应与情报交换分列条款，换文存于两国外交部。"
 IRE_GM_mil:0 "德意志的启示"
 IRE_GM_mil_desc:0 "莱茵兰进军显示柏林方面的决心，爱尔兰军官团据此修订训练科目。国防部派员赴德观摩演习，报告送交参谋学院作教材。，训练科目按季修订。"
 IRE_GM_ind:0 "四年计划的订单"
 IRE_GM_ind_desc:0 "德国重整军备的订单转向爱尔兰厂商，工商部登记承接合同。工业发展局协助扩建厂房，交货进度按月报部，原料由供给部调拨。"
 IRE_GM_recruit:0 "德奥合并的示范"
 IRE_GM_recruit_desc:0 "爱尔兰军官团研究德军的作战条令与动员办法。国防部据此修订征募章程，各郡征募站按新表登记适龄人员，体检标准同时调整。"
 IRE_GM_intel:0 "慕尼黑的艺术"
 IRE_GM_intel_desc:0 "阿勃维尔向G2提供谈判与情报作业的经验，双方在柏林与都柏林轮流会商。情报交换规程由外交部与国防部会同拟定。首批交换清单已由双方签署。"
 IRE_GM_mobil:0 "但泽的战争阴云"
 IRE_GM_mobil_desc:0 "欧洲局势紧迫，国防会议下令部队进入战备。各军区按动员表集结，港口与机场由宪兵接管，铁路优先运送军需，民防处同时清点储备。"
 IRE_G_ger_dublin_axis:0 "柏林-都柏林轴心"
 # ---- 柏林-都柏林轴心 第三批：德国联动国策（树最右列）----
 GER_IRE_shadow_link:0 "都柏林的影子网络"
 GER_IRE_shadow_link_desc:0 "爱尔兰地下网络愿与阿勃维尔共享英伦三岛的耳目，双方按区域划分责任，情报以统一格式互换。联络官常驻都柏林与柏林。"
 GER_IRE_abwehr_academy:0 "扩大特工培训计划"
 GER_IRE_abwehr_academy_desc:0 "又一批爱尔兰特工即将抵达柏林。密码学院扩大接纳规模，宿舍与教室另行划拨，教员自各军种抽调。他们的实战经验将并入我们的破译部门。"
 GER_IRE_arms_corridor:0 "军火走廊常态化"
 GER_IRE_arms_corridor_desc:0 "都柏林的订单源源不断。将这条军火走廊常态化，使两国兵工厂按同一张订单表开足马力。交货与检验由联合委员会办理，价款按季结算。"
 GER_IRE_atlantic_gateway:0 "大西洋门户协议"
 GER_IRE_atlantic_gateway_desc:0 "爱尔兰的大西洋港口向 U 型舰队开放，泊位、油料与修理由海军后勤处安排，出港航路与接应点另行通报，报告经驻都柏林武官转递。"
 GER_IRE_green_shore_joint:0 "绿色海岸参谋部"
 GER_IRE_green_shore_joint_desc:0 "爱尔兰与德意志的参谋官同处一张地图之前，对英登陆的航道、滩头与后续补给逐项推演。两国各存副本，修订按季互换，译员由武官处指派。"
 GER_IRE_dublin_pact:0 "巩固都柏林条约"
 GER_IRE_dublin_pact_desc:0 "条约不止一纸盟书。柏林与都柏林在政治、经济与军事上加深联系，双方设立常设委员会定期会商，轴心以都柏林为第二支柱。"
 GER_IRE_ind_mission:0 "都柏林工业代表团"
 GER_IRE_ind_mission_desc:0 "德国工业委员会乘邮船抵达邓莱里，与工商部逐厂查看自由邦的车间、磨坊与电站。爱尔兰缺的是设备，不缺的是廉价劳力与未开发的河流；德方企业获准优先开价。"
 GER_IRE_ind_shannon:0 "香农河电气化"
 GER_IRE_ind_shannon_desc:0 "阿尔德纳克鲁沙的香农工程本就是德国工程师所建，至今仍按德国图纸运转。追加一组发电机组，电网向西延伸，余电以二十年固定价格包给德国工业。"
 GER_IRE_ind_peat:0 "泥炭输往帝国"
 GER_IRE_ind_peat_desc:0 "沼泽覆盖全岛六分之一，从未大规模开发。德国挖泥船与压块机运抵，泥炭就地晒干、压块，替代进口煤炭入炉。机器自鲁尔来，泥炭进爱尔兰的炉膛。"
 GER_IRE_ind_barter:0 "清算易货协定"
 GER_IRE_ind_barter_desc:0 "不动一分黄金。爱尔兰的牛、黄油与皮革折算德国机械、发电机与机车车辆，清算账户每季在帝国银行轧差。双方各取所需，谁也不动用硬通货。"
 IRE_G_dublin_link_intel:0 "都柏林纽带·情报"
 IRE_G_dublin_link_intel_desc:0 "爱尔兰地下网络与阿勃维尔合并编组，双方各派联络官，情报按统一格式互换。行动审批权留在都柏林与柏林两处。每月联合例会一次，议定书由双方签署。"
 IRE_G_dublin_link_cipher:0 "都柏林纽带·密码"
 IRE_G_dublin_link_cipher_desc:0 "密码学院接收爱尔兰方面交来的实战材料，据此修订破译程序。教材与密钥由教务处统一管理，成果按月上报。破译所得按来源标注，不得转交第三方。"
 IRE_G_dublin_link_arms:0 "都柏林纽带·军工"
 IRE_G_dublin_link_arms_desc:0 "对爱军火出口转为常年项目，兵工厂按季度排产。军械处驻厂验收，装船清单由海关与外交部各存一份。运输由商船承担，护航与卸货时间另行安排。"
 IRE_G_dublin_link_navy:0 "都柏林纽带·大西洋"
 IRE_G_dublin_link_navy_desc:0 "大西洋门户协议开放港口与船坞，潜艇可在任何时刻进港补给。海军作战处据此调整巡弋区，补给记录由港务局保管。进出港须报港务局与海军作战处各一份。"
 IRE_G_dublin_link_plan:0 "都柏林纽带·参谋部"
 IRE_G_dublin_link_plan_desc:0 "两国参谋部完成联合推演，登陆时序、火力配系与后勤梯次编成统一文件。各军种据此修订作战手册，副本分送两处。推演结论作为年度演习的课目依据。"
 IRE_G_dublin_link_pact:0 "都柏林纽带·政治"
 IRE_G_dublin_link_pact_desc:0 "轴心条约经众议院批准，外交部完成换文。驻柏林代办升格为公使馆，两国政府的政治协商按条约条款定期举行。条约有效期与续约程序载于附款。"
 IRE_G_link_industry:0 "都柏林纽带·工业"
 IRE_G_link_industry_desc:0 "委员会的勘察报告摆在每一个要紧部门的案头。厂址已划，许可先批，德方企业在每一份合同上都握有优先权。文书还没办完，工地已经动工。"
 IRE_G_link_shannon:0 "都柏林纽带·香农电力"
 IRE_G_link_shannon_desc:0 "香农第二台机组并网，西部电网接入。德国工厂按固定价格取用余电，负荷表上柏林的笔迹不比都柏林少。"
 IRE_G_link_peat:0 "都柏林纽带·泥炭工业"
 IRE_G_link_peat_desc:0 "德国挖泥船开挖泥沼，德国压块机压制泥炭，工厂按德国公差运转。爱尔兰的燃料替德国省下煤炭，机器则由鲁尔按常年合同维护。"
 IRE_G_link_barter:0 "都柏林纽带·清算"
 IRE_G_link_barter_desc:0 "牛油东去，机械西来，清算账户轧平，不动一分硬通货。这笔账在预算表上看不见，在仓库里却看得分明。"
 # ---- v2.19.5：德国侧开局联机说明 + 联动国策解锁条件文本 ----
 ire_ger_coop.13.t:0 "柏林-都柏林轴心（联机推荐）"
 ire_ger_coop.13.d:0 "如果本局有玩家选择爱尔兰并走上黑线（武装斗争线），你们将自动进入「柏林-都柏林轴心」联动，规则如下：\n· 爱尔兰每完成一个黑线关键国策（影子军械库、德国贵客、德国技术组、潜艇补给坞、海狮侧翼、新秩序的西堡），你都会收到联动事件——选择合作则两国各得加成，婉拒则对方只拿小额补偿；\n· 每当你完成莱茵兰、四年计划、安施鲁斯、苏台德、但泽等史实里程碑，爱尔兰也会收到对应的支援事件；\n· 联动生效的前提：保持史实线（希特勒执政、不选择「反对希特勒」国策），且不与爱尔兰交战；\n· 每一次成功的合作都会解锁我国国策树里的「柏林-都柏林轴心」联动国策。位置：§Y国策树最右侧的独立一列§!（把视角一路往右拖到底，所有原版分支之外的空地上），自上而下六环：都柏林的影子网络 → 扩大特工培训计划 → 军火走廊常态化 → 大西洋门户协议 → 绿色海岸参谋部 → 巩固都柏林条约；「军火走廊常态化」还向右伸出四环工业化支线：都柏林工业代表团 → 香农河电气化／泥炭输往帝国 → 清算易货协定；\n\n即使爱尔兰由 AI 操控，联动事件也会照常弹出。"
 ire_ger_coop.13.a:0 "柏林与都柏林，一线相连"
 GER_IRE_coop_1_tt:0 "爱尔兰完成「影子军械库」联动，且德方在联动事件中选择合作"
 GER_IRE_coop_2_tt:0 "爱尔兰完成「德国贵客」联动，且德方在联动事件中选择合作"
 GER_IRE_coop_3_tt:0 "爱尔兰完成「德国技术组」联动，且德方在联动事件中选择合作"
 GER_IRE_coop_4_tt:0 "爱尔兰完成「潜艇补给坞」联动，且德方在联动事件中选择合作"
 GER_IRE_coop_5_tt:0 "爱尔兰完成「海狮侧翼」联动，且德方在联动事件中选择合作"
 GER_IRE_coop_6_tt:0 "爱尔兰完成「新秩序的西堡」联动，且德方在联动事件中选择合作"
