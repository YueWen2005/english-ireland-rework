 # ===== 民族联盟：战后重建决议与精神 =====
 IRE_nu_postwar_env_cat:0 "战后重建"
 IRE_nu_postwar_housing:0 "住房与重建"
 IRE_nu_postwar_housing_desc:0 "战后资金按年度拨入住房、道路与公共设施，工程局分区发包，进度与账目按期呈报财政部与内阁。地方当局须按季提交竣工清单。"
 IRE_nu_postwar_housing_tt:0 "稳定度 +5%，获得 365 天“战后重建”：建造速度 +10%、消费品 −5%。"
 IRE_nu_postwar_veterans:0 "退伍军人安置"
 IRE_nu_postwar_veterans_desc:0 "返乡军人按服役记录分配工作、住房与训练名额，安置名册由退伍军人事务处保管，各县按册办理。训练科目由国防部颁行，考核入册。"
 IRE_nu_postwar_veterans_tt:0 "人力 +5000，战争支持 +5%，获得 365 天“退伍军人安置”：征兵 +5%、稳定度 +5%。"
 IRE_nu_postwar_industry:0 "工业转产"
 IRE_nu_postwar_industry_desc:0 "战时工厂按行业次序转向民用生产，设备改装由工业部核定，产出报表逐月上报，原料按新配额调拨。转产企业可申请设备折旧宽限。"
 IRE_nu_postwar_industry_tt:0 "政治点数 +25，获得 365 天“工业转产”：工厂产出 +5%、建造速度 +5%。"
 IRE_nu_postwar_trade:0 "战后贸易使团"
 IRE_nu_postwar_trade_desc:0 "贸易使团分赴欧洲与北美，商务协定按国别签署，条款由外交部与财政部会核，订单陆续回传。使团随员由商务部与外交部共同选派。"
 IRE_nu_postwar_trade_tt:0 "政治点数 +25，获得 365 天“战后贸易”：贸易好感 +10%、消费品 −5%。"
 IRE_nu_postwar_reconstruction_spirit:0 "战后重建"
 IRE_nu_postwar_reconstruction_spirit_desc:0 "住房、道路与公共设施同时开工，建材由供应部统配，工程进度按季核报，竣工项目移交地方当局。征用土地与拆迁补偿由地政署核定。"
 IRE_nu_postwar_veterans_spirit:0 "退伍军人安置"
 IRE_nu_postwar_veterans_spirit_desc:0 "返乡军人得到工作与训练，安置名册由退伍军人事务处保管，住房按县分配，各县按册办理并具报。未及安置者暂编入工程队，按周计酬。"
 IRE_nu_postwar_industry_spirit:0 "工业转产"
 IRE_nu_postwar_industry_spirit_desc:0 "战时工厂转向民用生产，改装清单由工业部核定，产出逐月上报，过剩设备封存待调。工业部派员驻厂核对改装进度，成品须经检验方可出厂。"
 IRE_nu_postwar_trade_spirit:0 "战后贸易"
 IRE_nu_postwar_trade_spirit_desc:0 "贸易使团打开新市场，订单与汇兑由商务部登记，消费品供应随之缓和，配额按季修订。使团按季提交市场报告，商务部据此修订配额。"
 IRE_nu_postwar_neutrality_spirit:0 "武装中立"
 IRE_nu_postwar_neutrality_spirit_desc:0 "爱尔兰以本土防御与全民训练维持中立，训练科目由国防部颁行，各县按册施训，演习结果逐次上报。演习结果由国防部汇编成册。"

 # ===== 民族联盟：战后国内外环境事件 190–199 =====
 ire_nw.190.t:0 "战后欧洲会议"
 ire_nw.190.d_red:0 "柏林倒下后，欧洲的红色伙伴和旧盟友同时把目光投向都柏林。新世界爱尔兰必须决定，在战后欧洲坐哪一张桌子。"
 ire_nw.190.d_new_world:0 "柏林倒下后，华盛顿和伦敦开始安排战后欧洲。都柏林收到邀请，但座位和条件都取决于爱尔兰愿意站在哪一边。"
 ire_nw.190.d_neutral:0 "柏林倒下后，欧洲进入重新洗牌。都柏林既不想加入红色集团，也不想完全跟着华盛顿；第三势力第一次有了真正的舞台。"
 ire_nw.190.d:0 "柏林陷落后，欧洲各国在废墟上重排席位。都柏林尚未选定阵营，会议请柬已送至外交部。部分国家主张由爱尔兰主持和解，另一些则希望维持大国安排，三国大使连日往访总理府，请示内阁拟定立场。外交部已备妥与会代表名单。"
 ire_nw.190.a:0 "主持欧洲和解会议"
 ire_nw.190.a_tt:0 "政治点数 −50，稳定度 +5%；北欧与低地国家好感 +15，美国/苏联/英国好感 +10；确立“和解”基调。"
 ire_nw.190.b:0 "支持大国安排"
 ire_nw.190.b_tt:0 "稳定度 +5%；美国/苏联好感 +20，英国好感 +10，北欧与低地国家好感 −10；确立“大国安排”基调。"
 ire_nw.190.c:0 "爱尔兰利益优先"
 ire_nw.190.c_tt:0 "稳定度 +5%，战争支持 +5%；美国/苏联/英国好感 −10；确立“爱尔兰优先”基调。"

 ire_nw.191.t:0 "德国占领区的分裂"
 ire_nw.191.d_reconciliation:0 "德国被占领后，欧洲的和解派希望尽快恢复秩序；但占领区边界已经把欧洲分成了两半。"
 ire_nw.191.d_greatpowers:0 "德国被占领后，美苏英在占领区问题上各说各话。都柏林必须在两大占领集团之间选一个更有利的位置。"
 ire_nw.191.d_ireland:0 "德国被占领后，都柏林只关心一件事：不要让爱尔兰再次成为大国交易的筹码。"
 ire_nw.191.d:0 "德国已被占领，欧洲的分裂已画在占领区地图上。外交部呈上三案：承认西方占领区，承认苏联占领区，或由爱尔兰维持中立。驻柏林、莫斯科与华盛顿三处使团均待训令行事，未得训令不得对外表态，节略另抄送众议院外交委员会。"
 ire_nw.191.a:0 "支持西方占领区"
 ire_nw.191.a_tt:0 "议会影响力 +4，联合派信心 +3；美国好感 +20，英国好感 +15，苏联好感 −20；确立亲西方立场。"
 ire_nw.191.b:0 "承认苏联占领区"
 ire_nw.191.b_tt:0 "工人影响力 +4，共和军影响力 +3，稳定度 −5%；苏联好感 +20，美国/英国好感 −15；确立亲苏立场。"
 ire_nw.191.c:0 "维持爱尔兰中立"
 ire_nw.191.c_tt:0 "稳定度 +5%，战争支持 +5%；美国/苏联/英国好感 −10；确立中立立场。"

 ire_nw.192.t:0 "美苏之间的裂痕"
 ire_nw.192.d:0 "战事结束未满一年，华盛顿与莫斯科已互致试探性照会，双方在占领区与赔款问题上各持立场。都柏林分别收到两国提出的合作条件。两国的使节均等待复文，外交部认为同时周旋已不可行，请示内阁择定一方。"
 ire_nw.192.a:0 "倾向华盛顿"
 ire_nw.192.a_tt:0 "议会影响力 +4，联合派信心 +3，工人影响力 −3；美国好感 +25，苏联好感 −20。"
 ire_nw.192.b:0 "倾向莫斯科"
 ire_nw.192.b_tt:0 "工人影响力 +5，共和军影响力 +3，教会信心 −3；苏联好感 +25，美国好感 −20。"
 ire_nw.192.c:0 "维持不结盟"
 ire_nw.192.c_tt:0 "稳定度 +5%，战争支持 +5%；美国/苏联好感 −10。"

 ire_nw.193.t:0 "红色阵营的裂痕"
 ire_nw.193.d_red:0 "红色集团在战后第一次出现裂痕：莫斯科要求服从，西欧的红色盟友想要自己的道路。都柏林必须选择站在哪一边。"
 ire_nw.193.d:0 "红色法国与红色英国在战后路线上同莫斯科发生分歧，双方各自召集会议，互致措辞克制的信函。都柏林虽未正式转红，已被要求在两方之间表态。外交部收到两份照会，均请都柏林在近期答复，答复口径由内阁会议确定。"
 ire_nw.193.a:0 "站在莫斯科一方"
 ire_nw.193.a_tt:0 "工人影响力 +4，共和军影响力 +3，稳定度 −5%；苏联好感 +25，红色法国/英国好感 −15。"
 ire_nw.193.b:0 "站在西欧盟友一方"
 ire_nw.193.b_tt:0 "工人影响力 +5，教会信心 −2，稳定度 +5%；红色法国/英国好感 +25，苏联好感 −15。"
 ire_nw.193.c:0 "居间调解"
 ire_nw.193.c_tt:0 "工人影响力 +2，稳定度 +5%，政治点数 −50；苏联与红色法国/英国好感 +10。"

 ire_nw.194.t:0 "马歇尔计划的答复"
 ire_nw.194.d:0 "华盛顿提出一套欧洲重建援助。款项可观，条件也写明：受援国须在政治上与莫斯科保持距离。外交部已把照会与美方所附条件译出，连同财政部估算送内阁，请内阁决定是否具文接受，复文由外交部起草。"
 ire_nw.194.a:0 "接受援助。"
 ire_nw.194.a_tt:0 "议会影响力 +4，联合派信心 +3，工人影响力 −3；美国好感 +30，苏联好感 −15；获得 365 天“美国贷款”。"
 ire_nw.194.b:0 "谈判条件。"
 ire_nw.194.b_tt:0 "议会影响力 +2，稳定度 +5%，政治点数 −25；美国好感 +10。"
 ire_nw.194.c:0 "拒绝该项援助。"
 ire_nw.194.c_tt:0 "工人影响力 +3，稳定度 +5%，战争支持 +5%；美国好感 −25。"

 ire_nw.195.t:0 "旧帝国的解体"
 ire_nw.195.d:0 "战争削弱了旧帝国。伦敦与巴黎的殖民地陆续要求独立，各地代表分赴都柏林与华盛顿陈情。外交部为此拟订两套方案：支持民族自决，或维持旧秩序。内阁须在二者之间作出选择，方案文本已送众议院。"
 ire_nw.195.a:0 "支持殖民地独立。"
 ire_nw.195.a_tt:0 "政治点数 +25，稳定度 +5%；英国/法国好感 −15，美国/苏联好感 +10。"
 ire_nw.195.b:0 "支持欧洲帝国。"
 ire_nw.195.b_tt:0 "政治点数 −25，稳定度 +5%，工人影响力 −3，教会信心 +3；英国/法国好感 +20。"
 ire_nw.195.c:0 "保持贸易中立。"
 ire_nw.195.c_tt:0 "政治点数 +25，稳定度 +5%；获得 365 天“战后贸易”。"

 ire_nw.196.t:0 "退伍军人返乡"
 ire_nw.196.d:0 "战争结束，大批爱尔兰军人返回家乡。住房、工作与训练均不足以应付，退伍军人协会已向国防部递交请愿书。退伍军人事务处拟就安置、就业与紧缩三案，送交内阁会议议决。财政部估计支出，地方政府着手登记住房需求。"
 ire_nw.196.a:0 "从优安置"
 ire_nw.196.a_tt:0 "政治点数 −50，稳定度 +5%，人力 +5000；获得 365 天“退伍军人安置”。"
 ire_nw.196.b:0 "推行就业计划"
 ire_nw.196.b_tt:0 "政治点数 −25，稳定度 +5%，人力 +2500；获得 365 天“工业转产”。"
 ire_nw.196.c:0 "实行紧缩"
 ire_nw.196.c_tt:0 "政治点数 +25，稳定度 −5%，人力 +2500。"

 ire_nw.197.t:0 "战后重建与移民"
 ire_nw.197.d:0 "战后重建需款亦需人。财政部呈上三案：以住房与公共工程为先，鼓励侨民回国定居，或编列紧缩预算以稳财政。三项细则均已编号，送众议院财政委员会备查。财政部请于本月内定夺，以便编制总预算。"
 ire_nw.197.a:0 "兴办住房与重建"
 ire_nw.197.a_tt:0 "政治点数 −50，稳定度 +5%；获得 365 天“战后重建”。"
 ire_nw.197.b:0 "鼓励侨民回国"
 ire_nw.197.b_tt:0 "政治点数 −25，稳定度 +5%，人力 +10000。"
 ire_nw.197.c:0 "编列紧缩预算"
 ire_nw.197.c_tt:0 "政治点数 +25，稳定度 −5%。"

 ire_nw.198.t:0 "第三势力峰会"
 ire_nw.198.d:0 "两大集团同时向都柏林示好，第三势力由此获得实际的召集空间。外交部拟以非结盟国家会议名义邀各国代表来都柏林，议程含贸易、裁军与中立国安全。会期拟于秋季，地点定在都柏林城堡，请内阁核定规格与主持人员。"
 ire_nw.198.a:0 "主办不结盟峰会"
 ire_nw.198.a_tt:0 "政治点数 −50，稳定度 +5%，战争支持 +5%；获得 365 天“第三势力协调”。"
 ire_nw.198.b:0 "推行等距贸易"
 ire_nw.198.b_tt:0 "政治点数 +25，稳定度 +5%；获得 365 天“战后贸易”。"
 ire_nw.198.c:0 "维持武装中立"
 ire_nw.198.c_tt:0 "政治点数 −25，战争支持 +5%，陆军经验 +50；获得 365 天“武装中立”。"

 ire_nw.199.t:0 "战后安全框架"
 ire_nw.199.d:0 "新的安全框架由几个大国草拟，条文涉及势力范围、基地租借与裁军核查。都柏林收到正式邀请，也收到若干中立国的另案提议。外交部拟就加入、独立与欧洲中立区三种方案，送内阁审议，并附各国提案的对照表。"
 ire_nw.199.a:0 "加入新安全框架"
 ire_nw.199.a_tt:0 "政治点数 −25，稳定度 +5%，战争支持 +5%；美国/苏联/英国好感 +10。"
 ire_nw.199.b:0 "保持独立地位"
 ire_nw.199.b_tt:0 "稳定度 +5%，战争支持 +5%；美国/苏联好感 −10。"
 ire_nw.199.c:0 "推动欧洲中立区"
 ire_nw.199.c_tt:0 "政治点数 −50，稳定度 +5%；美国/苏联好感 −5，北欧与低地国家好感 +15。"

 ire_nw.200.t:0 "莫斯科陷落之后"
 ire_nw.200.d:0 "莫斯科已经失守，苏联在欧洲的防线正在崩溃。都柏林伸出橄榄枝：欧洲希望愿意接纳苏联及其卫星国。外交部已把条款草案分送各成员国，莫斯科的答复尚在途中，内阁先将接纳方案列入议程，细节另议。"
 ire_nw.200.a:0 "带所有卫星国加入。"
 ire_nw.200.a_tt:0 "苏联及其卫星国/盟友加入欧洲希望；政治点数 −25，稳定度 +5%，战争支持 +10%；爱尔兰好感 +40。"
