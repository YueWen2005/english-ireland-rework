 ire_nw.198.t:0 "第三势力峰会"
 ire_nw.198.d:0 "两大集团都在拉拢都柏林，但第三势力第一次有了真正的空间。爱尔兰可以主办一次不结盟峰会。"
 ire_nw.198.a:0 "主办不结盟峰会。"
 ire_nw.198.a_tt:0 "政治点数 −50，稳定度 +3%，战争支持 +2%；获得 365 天“第三势力协调”。"
