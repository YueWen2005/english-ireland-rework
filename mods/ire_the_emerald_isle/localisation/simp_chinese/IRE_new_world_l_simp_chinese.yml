 ire_nw.82.t:0 "自由法国的请求"
 ire_nw.82.d:0 "巴黎陷落后，自由法国使团抵达都柏林，请求使用香农机场和爱尔兰港口。柏林和伦敦都在看着都柏林的选择。"
 ire_nw.82.a:0 "接纳自由法国使团"
 ire_nw.82.b:0 "只提供人道援助"
 ire_nw.82.c:0 "关闭国门"
