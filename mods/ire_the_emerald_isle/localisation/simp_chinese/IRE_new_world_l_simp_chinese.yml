 ire_nw.172.t:0 "华盛顿的条件"
 ire_nw.172.d_new_world:0 "华盛顿愿意把爱尔兰正式接回大西洋经济与安全网络，但条件写得很清楚：联合政府必须对左翼工会和共和军保持距离。"
 ire_nw.172.d_war:0 "战争让华盛顿重新计算爱尔兰的价值。贷款、装备和海军合作都摆在桌上，但美国要求都柏林在战后秩序上先表态。"
 ire_nw.172.d:0 "美国代表团带来一套经济与安全框架，贷款条件明白列出：议会与联合派须在联合政府中居主导。财政部与外交部逐条核对文本，总理府将条件分送四派领袖，请示内阁是否接受。四派领袖的意见分别记录在案，众议院本周休会以待答复。"
 ire_nw.172.a:0 "接受贷款条件"
 ire_nw.172.a_tt:0 "议会影响力 +5，联合派信心 +5，工人影响力 −5，共和军影响力 −3；美国好感 +30；获得 365 天“美国贷款”。"
