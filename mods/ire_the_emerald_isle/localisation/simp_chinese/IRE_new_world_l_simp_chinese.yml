 # ===== 民族联盟：动态精神 =====
 IRE_nu_british_funding_spirit:0 "伦敦的支票"
 IRE_nu_british_funding_spirit_desc:0 "伦敦的资金通过旧网络流入联合派与部分议员；政治机器转得更快，但街头的信任在流失。"
 IRE_nu_soviet_advisors_spirit:0 "莫斯科顾问"
 IRE_nu_soviet_advisors_spirit_desc:0 "苏联军事与情报顾问进入爱尔兰；军队和情报网见效，但内阁的政治空间被压缩。"
 IRE_nu_american_loan_spirit:0 "美国贷款"
 IRE_nu_american_loan_spirit_desc:0 "美国贷款和工业品进入爱尔兰；工厂重新开工，消费品压力下降。"
 IRE_nu_german_arms_spirit:0 "柏林军火"
 IRE_nu_german_arms_spirit_desc:0 "德国情报网络送来的武器和训练进入共和军；战斗力提升，但政府随时可能被曝光。"
 IRE_nu_vatican_pressure_spirit:0 "罗马牧函"
 IRE_nu_vatican_pressure_spirit_desc:0 "主教团与罗马的公开支持稳住了部分保守选民，但政府必须付出政治代价。"
 IRE_nu_foreign_volunteers_spirit:0 "国际主义志愿军"
 IRE_nu_foreign_volunteers_spirit_desc:0 "工会和共和军的志愿网络把爱尔兰人送上海外战场；征兵与进攻能力提升，国内不安加剧。"
 IRE_nu_border_campaign_spirit:0 "边境战役"
 IRE_nu_border_campaign_spirit_desc:0 "共和军在边境另一侧展开行动；进攻与防御提升，但外交风险上升。"
 IRE_nu_emergency_powers_spirit:0 "紧急权力"
 IRE_nu_emergency_powers_spirit_desc:0 "特别分局与军队获得紧急权力；秩序恢复，但政治点与消费品付出代价。"
 IRE_nu_political_scandal_spirit:0 "政治丑闻"
 IRE_nu_political_scandal_spirit_desc:0 "秘密行动被曝光，联合政府的信誉受损；政治运转和稳定同时下降。"

 # ===== 民族联盟：外部干涉事件 170–175 =====
 ire_nw.170.t:0 "伦敦的支票"
 ire_nw.170.d_dem:0 "威斯敏斯特的旧网络没有消失。联合派议员、都柏林商人和英国情报人员在同一间会客室里出现；伦敦愿意为“稳定”付钱。"
 ire_nw.170.d_black:0 "黑衫伦敦的密使带着钱和威胁来到都柏林。他们不要求爱尔兰改旗，只要求联合政府里有人替伦敦说话。"
 ire_nw.170.d_red:0 "红色伦敦的工会代表团提出“兄弟般的援助”：资金、报纸和顾问。但接受这笔钱，等于让伦敦在联合政府里拥有一个席位。"
 ire_nw.170.d:0 "英国驻都柏林使馆的旧关系重新活跃起来。资金、报纸和人情同时涌向联合派与部分议员；都柏林必须决定，让不让伦敦的手伸进来。"
 ire_nw.170.a:0 "接受资金。"
 ire_nw.170.a_tt:0 "联合派信心 +8，议会影响力 +4，共和军影响力 −4，稳定度 −2%；英国好感 +20；获得 365 天“伦敦的支票”。"
 ire_nw.170.b:0 "拒绝并公开。"
 ire_nw.170.b_tt:0 "联合派信心 −4；英国好感 −20；稳定度 +3%，政治点数 +25。"
 ire_nw.170.c:0 "秘密调查。"
 ire_nw.170.c_tt:0 "安全影响力 +5，政治点数 −25；调查结果不确定：50% 额外安全 +3，50% 英国好感 −10。"

 ire_nw.171.t:0 "莫斯科的同志"
 ire_nw.171.d_red:0 "莫斯科把爱尔兰视为红色集团在西欧的潜在支点。苏联顾问、工会联络员和情报人员同时抵达都柏林，提出“无私的兄弟援助”。"
 ire_nw.171.d:0 "苏联大使馆的文化参赞带来一批“工会朋友”。他们不谈意识形态，只谈顾问、训练和报纸；都柏林知道这和莫斯科有关。"
 ire_nw.171.a:0 "接受顾问。"
 ire_nw.171.a_tt:0 "工人影响力 +6，共和军影响力 +4，教会信心 −5，联合派信心 −5，稳定度 −2%；苏联好感 +30；获得 365 天“莫斯科顾问”。"
 ire_nw.171.b:0 "限制活动。"
 ire_nw.171.b_tt:0 "工人影响力 +2，稳定度 +2%，政治点数 −25；苏联好感 +10。"
 ire_nw.171.c:0 "驱逐他们。"
 ire_nw.171.c_tt:0 "工人影响力 −5，共和军影响力 −3，稳定度 +3%，战争支持 +3%；苏联好感 −30。"

 ire_nw.172.t:0 "华盛顿的条件"
 ire_nw.172.d_new_world:0 "华盛顿愿意把爱尔兰正式接回大西洋经济与安全网络，但条件写得很清楚：联合政府必须对左翼工会和共和军保持距离。"
 ire_nw.172.d_war:0 "战争让华盛顿重新计算爱尔兰的价值。贷款、装备和海军合作都摆在桌上，但美国要求都柏林在战后秩序上先表态。"
 ire_nw.172.d:0 "美国代表团带来一套经济与安全框架。贷款很慷慨，条件也不含糊：议会和联合派必须在联合政府里占上风。"
 ire_nw.172.a:0 "接受贷款条件。"
 ire_nw.172.a_tt:0 "议会影响力 +5，联合派信心 +5，工人影响力 −5，共和军影响力 −3；美国好感 +30；获得 365 天“美国贷款”。"
 ire_nw.172.b:0 "谈判。"
 ire_nw.172.b_tt:0 "议会影响力 +2，稳定度 +2%，政治点数 −25；美国好感 +10。"
 ire_nw.172.c:0 "拒绝。"
 ire_nw.172.c_tt:0 "议会影响力 −4，稳定度 +2%，战争支持 +2%；美国好感 −25。"

 ire_nw.173.t:0 "柏林的手"
 ire_nw.173.d_black:0 "黑英的胜利让柏林看到了机会。德国情报人员通过中间人接触共和军，提出武器、训练和“共同对付伦敦”的交换。"
 ire_nw.173.d_war:0 "战争让柏林的破坏网络活跃起来。德国情报人员试图把武器送进爱尔兰，把共和军变成对英施压的工具。"
 ire_nw.173.d:0 "德国情报人员在都柏林的码头和酒馆里活动。他们不要求爱尔兰参战，只要求共和军在合适的时候制造麻烦。"
 ire_nw.173.a:0 "利用德国人。"
 ire_nw.173.a_tt:0 "共和军影响力 +5，安全影响力 +3，稳定度 −3%；德国好感 +20，英国与美国好感 −15；获得 365 天“柏林军火”。"
 ire_nw.173.b:0 "清除网络。"
 ire_nw.173.b_tt:0 "安全影响力 +6，共和军影响力 −5，稳定度 +3%，政治点数 −25；德国好感 −20。"
 ire_nw.173.c:0 "公开揭露。"
 ire_nw.173.c_tt:0 "共和军影响力 −3，稳定度 +3%，战争支持 +3%；德国好感 −30，英国与美国好感 +10。"

 ire_nw.174.t:0 "罗马的牧函"
 ire_nw.174.d_low:0 "主教团对联合政府的世俗化政策越来越不安。罗马发来一封措辞克制的牧函，要求都柏林在教育、婚姻和报纸问题上作出保证。"
 ire_nw.174.d_labour:0 "工人派在政府里的影响力让主教团紧张。罗马的牧函公开提醒都柏林：爱尔兰仍然是一个天主教国家。"
 ire_nw.174.d:0 "罗马通过主教团向都柏林施压。牧函不谈政治，却把教育、家庭和公共道德都摆到了联合政府的桌面上。"
 ire_nw.174.a:0 "接受调停。"
 ire_nw.174.a_tt:0 "教会信心 +10，工人影响力 −4，稳定度 +3%，政治点数 −25；获得 365 天“罗马牧函”。"
 ire_nw.174.b:0 "重申世俗。"
 ire_nw.174.b_tt:0 "教会信心 −8，工人影响力 +4，稳定度 −2%，政治点数 +25。"
 ire_nw.174.c:0 "保持平衡。"
 ire_nw.174.c_tt:0 "教会信心 +3，工人影响力 +2，政治点数 −10。"

 ire_nw.175.t:0 "红色兄弟的请求"
 ire_nw.175.d_france:0 "法兰西公社向都柏林求援：志愿军、武器或至少一个公开姿态。巴黎把爱尔兰当作西欧红色阵营的兄弟，而不是中立国。"
 ire_nw.175.d_britain:0 "红色伦敦请求都柏林派出志愿军和物资。伦敦说这是兄弟之间的互助，都柏林知道这会把自己拖进更大的战争。"
 ire_nw.175.d:0 "红色集团向都柏林提出请求：志愿军、武器和公开支持。都柏林可以在兄弟情谊和本国代价之间选择。"
 ire_nw.175.a:0 "派出志愿军。"
 ire_nw.175.a_tt:0 "工人影响力 +8，共和军影响力 +5，战争支持 +3%；红色法国/英国与苏联好感 +20–25，美国与非共产主义英国好感 −15；获得 365 天“国际主义志愿军”。"
 ire_nw.175.b:0 "只送物资。"
 ire_nw.175.b_tt:0 "工人影响力 +4，政治点数 −25；红色法国/英国好感 +15。"
 ire_nw.175.c:0 "拒绝。"
 ire_nw.175.c_tt:0 "工人影响力 −5，教会信心 +3，稳定度 +3%；红色法国/英国好感 −20。"

 # ===== 民族联盟：派系擅自行事事件 180–185 =====
 ire_nw.180.t:0 "未经授权的远征"
 ire_nw.180.d_red:0 "码头工会和共和军的志愿网络已经自行行动：他们绕过内阁，把志愿者和武器送上了开往红色法国/英国的船。"
 ire_nw.180.d_war:0 "战争让工会的码头网络变得大胆。工人们开始绕过内阁，把志愿者和物资送往他们认为“该去的地方”。"
 ire_nw.180.d:0 "工会码头委员会和共和军的志愿网络未经内阁批准，擅自组织了一支远征队。都柏林是从报纸上才知道这件事的。"
 ire_nw.180.a:0 "公开支持。"
 ire_nw.180.a_tt:0 "工人影响力 +8，共和军影响力 +4，战争支持 +3%；红色法国/英国好感 +20，美国与非共产主义英国好感 −15；获得 365 天“国际主义志愿军”。"
 ire_nw.180.b:0 "否认并召回。"
 ire_nw.180.b_tt:0 "工人影响力 −6，稳定度 +3%，政治点数 −25；美国与英国好感 +10。"
 ire_nw.180.c:0 "秘密默许。"
 ire_nw.180.c_tt:0 "工人影响力 +4，共和军影响力 +3，政治点数 −50；90 天后可能爆发丑闻。"

 ire_nw.181.t:0 "边境的枪声"
 ire_nw.181.d_black:0 "共和军的一支小队越过边境，袭击了黑英的一个哨所。伦敦正在等待都柏林的解释，联合政府里没有人事先知道这件事。"
 ire_nw.181.d_war:0 "战争期间，共和军的一支小队擅自越境，袭击了英国军火列车。伦敦要求都柏林给出解释。"
 ire_nw.181.d:0 "共和军的一支小队越过边境，袭击了英国哨所。没有人能说清这是谁下的命令，但伦敦已经把账记在都柏林头上。"
 ire_nw.181.a:0 "追认行动。"
 ire_nw.181.a_tt:0 "共和军影响力 +8，安全影响力 −3，稳定度 −2%，战争支持 +3%；英国好感 −25；获得 365 天“边境战役”。"
 ire_nw.181.b:0 "公开谴责。"
 ire_nw.181.b_tt:0 "共和军影响力 −7，稳定度 +3%，政治点数 +25；英国好感 +15。"
 ire_nw.181.c:0 "内部处分。"
 ire_nw.181.c_tt:0 "安全影响力 +5，共和军影响力 −3，稳定度 +1%，政治点数 −25。"

 ire_nw.182.t:0 "名单"
 ire_nw.182.d_war:0 "特别分局在战争期间扩大了权力。一份名单显示，他们未经内阁批准拘禁了联合派和工人活动家。"
 ire_nw.182.d_confidence:0 "联合派和教会对政府的不信任让特别分局更加大胆。他们开始未经授权地拘禁“不可靠分子”，名单最终落到了报纸手里。"
 ire_nw.182.d:0 "特别分局未经内阁批准拘禁了联合派和工人活动家。名单泄露后，联合政府发现自己无法控制自己的安全部门。"
 ire_nw.182.a:0 "追认紧急权力。"
 ire_nw.182.a_tt:0 "安全影响力 +8，联合派信心 −6，工人影响力 −4，教会信心 −3，稳定度 +3%；获得 365 天“紧急权力”。"
 ire_nw.182.b:0 "惩处越权。"
 ire_nw.182.b_tt:0 "安全影响力 −6，联合派信心 +5，工人影响力 +4，稳定度 +2%，政治点数 −25。"
 ire_nw.182.c:0 "掩盖。"
 ire_nw.182.c_tt:0 "安全影响力 +3，稳定度 −2%，政治点数 −50；90 天后可能爆发丑闻。"

 ire_nw.183.t:0 "走廊里的密信"
 ire_nw.183.d_britain:0 "议会里的一个小组一直在通过伦敦的旧关系传递消息。内阁的争论、军队的调动、联合政府的底线，都出现在英国外交部的桌上。"
 ire_nw.183.d_america:0 "议会里的一个小组把内阁争论泄露给了华盛顿。美国人没有恶意，但他们现在比都柏林更清楚联合政府的底线。"
 ire_nw.183.d:0 "议会里的一个小组在未经授权的情况下与外国使团保持联系，并把内阁争论泄露出去。都柏林必须决定，是堵住这条渠道，还是利用它。"
 ire_nw.183.a:0 "利用这条渠道。"
 ire_nw.183.a_tt:0 "议会影响力 +6，安全影响力 −4，稳定度 −2%；英国与美国好感 +15。"
 ire_nw.183.b:0 "调查泄密。"
 ire_nw.183.b_tt:0 "安全影响力 +5，议会影响力 −5，稳定度 +3%，政治点数 −25。"
 ire_nw.183.c:0 "装聋作哑。"
 ire_nw.183.c_tt:0 "议会影响力 +2，稳定度 −3%，政治点数 +10。"

 ire_nw.184.t:0 "私兵"
 ire_nw.184.d_low:0 "联合派信心跌到危险水平后，贝尔法斯特的准军事组织开始公开操练和囤枪。有人说伦敦在背后提供资金。"
 ire_nw.184.d_parliament:0 "议会派在政府里越来越强势，联合派的准军事组织开始把“自卫”挂在嘴边。武器从港口流入北爱。"
 ire_nw.184.d:0 "联合派的准军事组织在贝尔法斯特公开操练、囤枪。伦敦的影子若隐若现，联合政府必须决定是否收编他们。"
 ire_nw.184.a:0 "收编。"
 ire_nw.184.a_tt:0 "联合派信心 +8，安全影响力 +4，共和军影响力 −5，稳定度 +2%，政治点数 −25。"
 ire_nw.184.b:0 "取缔。"
 ire_nw.184.b_tt:0 "联合派信心 −7，安全影响力 +5，共和军影响力 +3，稳定度 −3%；英国好感 −10。"
 ire_nw.184.c:0 "默许。"
 ire_nw.184.c_tt:0 "联合派信心 +4，共和军影响力 +4，稳定度 −4%；英国好感 +10。"

 ire_nw.185.t:0 "主教的公开信"
 ire_nw.185.d_low:0 "主教团对联合政府的世俗化政策失去耐心。一封公开信从讲坛读到报纸，要求都柏林恢复“爱尔兰的传统价值”。"
 ire_nw.185.d_labour:0 "工人派在政府里的影响力让主教团坐不住了。主教们发表公开信，警告联合政府不要把爱尔兰变成“另一个红色国家”。"
 ire_nw.185.d:0 "主教们发表公开信，谴责联合政府的道德与教育政策。都柏林必须在教会和世俗派之间作出回应。"
 ire_nw.185.a:0 "安抚教会。"
 ire_nw.185.a_tt:0 "教会信心 +8，工人影响力 −4，稳定度 +3%，政治点数 −25。"
 ire_nw.185.b:0 "重申世俗。"
 ire_nw.185.b_tt:0 "教会信心 −8，工人影响力 +4，稳定度 −2%，政治点数 +25。"
 ire_nw.185.c:0 "让时间解决。"
 ire_nw.185.c_tt:0 "教会信心 −3，稳定度 −2%。"

 # ===== 民族联盟：丑闻与内阁重心事件 187–188 =====
 ire_nw.187.t:0 "丑闻曝光"
 ire_nw.187.d_labour:0 "秘密远征被报纸曝光。码头工会、共和军志愿网络和都柏林的沉默同时出现在头版；联合政府无法再假装自己不知情。"
 ire_nw.187.d_security:0 "特别分局的名单被反对派议员公开。未经授权的拘禁、联合派的证词和政府的掩盖同时出现在报纸上。"
 ire_nw.187.d:0 "联合政府的秘密行动被曝光。都柏林必须在承担后果、切割和继续掩盖之间作出选择。"
 ire_nw.187.a:0 "承担后果。"
 ire_nw.187.a_tt:0 "稳定度 −4%，政治点数 −25；获得 365 天“政治丑闻”。工人丑闻：工人影响力 −3，美国与英国好感 −10。安全丑闻：安全影响力 −3，联合派信心 −3，工人影响力 +3。"
 ire_nw.187.b:0 "切割。"
 ire_nw.187.b_tt:0 "政治点数 −50，稳定度 +2%；工人丑闻：工人影响力 −6。安全丑闻：安全影响力 −6。"
 ire_nw.187.c:0 "继续掩盖。"
 ire_nw.187.c_tt:0 "政治点数 −75，稳定度 −2%；50% 彻底压下，50% 再拖 180 天后重新爆发。"

 ire_nw.188.t:0 "内阁重心转移"
 ire_nw.188.d_parliament:0 "议会派已经取代其他派系，成为联合政府里最有分量的一极。文官、程序和选举重新定义了这个国家。"
 ire_nw.188.d_labour:0 "工人派已经取代其他派系，成为联合政府里最有分量的一极。工会、工厂和街头政治开始主导都柏林。"
 ire_nw.188.d_security:0 "安全派已经取代其他派系，成为联合政府里最有分量的一极。特别分局和军队把手伸进了每一个部门。"
 ire_nw.188.d_ira:0 "共和军派已经取代其他派系，成为联合政府里最有分量的一极。老兵、志愿网络和边境行动成了国家的中心。"
 ire_nw.188.d:0 "联合政府的重心正在移动。没有人能确定新的主导者会把这个国家带向哪里。"
 ire_nw.188.a:0 "确认新重心。"
 ire_nw.188.a_tt:0 "主导派影响力 +5，稳定度 +3%，政治点数 +25。"
 ire_nw.188.b:0 "维持旧平衡。"
 ire_nw.188.b_tt:0 "主导派影响力 −5，最低派影响力 +5，政治点数 −25，稳定度 +1%。"
 ire_nw.188.c:0 "重组内阁。"
 ire_nw.188.c_tt:0 "四派影响力各 −3，稳定度 +5%，政治点数 −50，战争支持 +2%。"

