 # ===== A 线外交环境事件 =====
 ire_nw.80.t:0 "国会山上的爱尔兰决议"
 ire_nw.80.d:0 "华盛顿正在辩论租借法案的适用范围。爱尔兰裔议员、教会和工会同时施压：是把爱尔兰纳入美国兵工厂，还是让这个岛继续留在战争之外？"
 ire_nw.80.a:0 "把爱尔兰纳入租借体系"
 ire_nw.80.b:0 "只做侨民游说"
 ire_nw.80.c:0 "公开反对美国参战"
 IRE_tt_env_80a:0 "美国：战争支持 +2%、稳定 -1%，获得「爱尔兰裔游说团」一年；英国好感 +15；德国好感 -20；爱尔兰政治点数 +25。"
