 IRE_nu_status_tt:0 "议会 [?IRE.IRE_nu_parliament|0] / 工人 [?IRE.IRE_nu_labour|0] / 安全 [?IRE.IRE_nu_security|0] / 共和军 [?IRE.IRE_nu_ira|0]\n联合派信心 [?IRE.IRE_nu_unionist|0] / 教会信心 [?IRE.IRE_nu_church|0]\n外部压力：[GetIRENuLastExternal] / 派系动向：[GetIRENuLastInitiative]\n联盟修正（永久）：稳定 +[?IRE.IRE_nu_mod_stability|0]% / 政治点 +[?IRE.IRE_nu_mod_pp|0]% / 战争支持 +[?IRE.IRE_nu_mod_ws|0]% / 消费品 [?IRE.IRE_nu_mod_cg|0]%\n某派 >60 且与最低派差 >30 会触发联盟危机。"
 IRE_nu_status:0 "联盟态势与修正"
 IRE_nu_status_desc:0 "委员会按月汇总四派影响力、联合派与教会信心、外部压力与派系动向，并将现行永久联盟修正列入同一份清单。临时精神不计，报告送交内阁归档。"
 # ===== 爱尔兰民族联盟：准备与成立事件 =====
 ire_nw.142.t:0 "民族团结纲领"
 ire_nw.142.d_civic:0 "北爱回归后，公民共和国的议会、工会与地方议会开始讨论一个更宽的联合。联合派要求保证，工人要求席位，老 IRA 要求名分。都柏林必须决定这场圆桌的调子。"
 ire_nw.142.d_firm:0 "北爱回归后，中央集权共和国把四派叫到国防内阁。安全部门想要秩序，工会想要补偿，共和军想要编制。都柏林必须决定这场联合的调子。"
 ire_nw.142.d:0 "北爱回归之后，都柏林把议会、工会、军队与共和军请到同一张桌子前。四派在团结一事上并无异议，至于如何团结，各有各的章程。会议按议题分组，各组提交书面意见，主席团汇总后再行审议。会期暂定六周，议程由主席团印发。"
 ire_nw.142.a:0 "采纳圆桌妥协"
 ire_nw.142.b:0 "实行强力整合"
 ire_nw.142.c:0 "许共和派入城"
 ire_nw.150.t:0 "民族联盟成立"
 ire_nw.150.d_roundtable:0 "圆桌妥协定下了联盟的基调。四派入阁，联合派和教会得到保证，议会掌握议程。现在都柏林要决定，谁在联合政府里先说话。"
 ire_nw.150.d_firm:0 "强力整合定下了联盟的基调。安全部门掌握秩序，工会和共和军被纳入监督。现在都柏林要决定，谁在联合政府里先说话。"
 ire_nw.150.d_republican:0 "共和派入城定下了联盟的基调。老 IRA 得到名分，联合派和教会保持警惕。现在都柏林要决定，谁在联合政府里先说话。"
 ire_nw.150.d:0 "四派代表在都柏林签署联合议定书，民族联盟据此组成。议定书规定席位分配、议事规则与表决程序，每派各推两名代表进入常设委员会，主席由各派轮任。联合政府首次会议定于下周举行，议程由书记处排定后送各派核阅。"
 ire_nw.150.a:0 "由议会掌握议程"
 ire_nw.150.b:0 "给工会正式席位"
 ire_nw.150.c:0 "由安全部门维持秩序"
 ire_nw.150.e:0 "邀共和军入阁"
 IRE_A_national_union_parliament:0 "议会共识"
 IRE_A_national_union_parliament_desc:0 "议会置于联合政府中枢，程序、预算与选举均归文官主持。联合派与教会取得书面保证，议会章程经四派认可后公布，质询时间另行排定。"
 IRE_A_national_union_labour:0 "工会契约"
 IRE_A_national_union_labour_desc:0 "工会取得正式席位，工资、工时与公共工程列入政府议程。劳工代表入各部委员会，教会对此保持警惕，尚未表态，已请见总理陈述顾虑。"
 IRE_A_national_union_security:0 "公共安全"
 IRE_A_national_union_security_desc:0 "安全部门主持秩序，特别分局、军队忠诚与紧急权力成为联合政府的支柱。共和军活动范围受压缩，其名册已交内务部备查。"
 IRE_A_national_union_ira:0 "共和军整编"
 IRE_A_national_union_ira_desc:0 "共和军被请入国家体制，老兵、志愿网络与跨境行动取得正式名分。联合派对此保持警惕，要求在议会保留质询权，并要求登记其武器。"
 IRE_A_national_union_revival:0 "民族复兴"
 IRE_A_national_union_revival_desc:0 "四派在政府中各占席位，无一派可单独压制他派。部长们发现争执可在会议桌上终了，不必闹到街头。议事规则已印成册，分发各部遵行。"
 IRE_effect_nu_pillar_parliament:0 "议会影响力 +10，联合派信心 +5；政治点数 +50，稳定度 +5%；解锁议会派方法决议。"
 IRE_effect_nu_pillar_labour:0 "工人影响力 +10，教会信心 −3；政治点数 +25，人力 +5000；解锁工人派方法决议。"
 IRE_effect_nu_pillar_security:0 "安全影响力 +10，共和军影响力 −3；战争支持 +5%，陆军经验 +25；解锁安全派方法决议。"
 IRE_effect_nu_pillar_ira:0 "共和军影响力 +10，联合派信心 −3；人力 +5000，陆军经验 +25；解锁共和军派方法决议。"
 IRE_tt_nu_revival_conditions:0 "四派影响力都在 20–60 之间，且联合派与教会信心都不低于 60。"
 IRE_tt_nu_cross_border:0 "黑英已成立，或任一爱尔兰核心州被敌国控制。"
 IRE_nu_parliament_convention:0 "全国大会"
 IRE_nu_parliament_convention_desc:0 "全国代表、工会与地方议会应召前往都柏林，联合政府的议程按次序摆上桌面。各派提交书面意见，会议记录分送四派与内阁归档。"
 IRE_nu_parliament_diaspora:0 "侨民游说"
 IRE_nu_parliament_diaspora_desc:0 "驻外使团与侨民社团接到训令，在贸易、投资与舆论三条线上同时为都柏林说话。商情与舆情由各领事馆按月汇总，交外交部归档。"
 IRE_nu_labour_councils:0 "工人委员会"
 IRE_nu_labour_councils_desc:0 "工厂委员会依法进入联合政府的咨询机构，生产计划、工时与工资议题交由工人代表与厂方共同议定，结果报送劳工部备案。"
 IRE_nu_labour_public_works:0 "公共工程"
 IRE_nu_labour_public_works_desc:0 "道路、港口与住房工程按工会提名分配用工名额，承包合同附带雇佣与工资条款。开工次序由内阁排定，进度逐季核报公共工程局并归卷。"
 IRE_nu_security_special_branch:0 "特别分局"
 IRE_nu_security_special_branch_desc:0 "特别分局的编制与经费由司法部核定，职权扩及极端组织与联合政府内部的异动。监视名单每月更新，行动记录封存于国防部。"
 IRE_nu_security_army_loyalty:0 "军队忠诚"
 IRE_nu_security_army_loyalty_desc:0 "国防部下令全军在驻地公开宣誓，誓词对象为联合政府而非任何一派。宣誓名册由各司令部汇总，报国防部与内阁备案。逾期未誓者另册登记。"
 IRE_nu_ira_volunteer_network:0 "志愿网络"
 IRE_nu_ira_volunteer_network_desc:0 "老 IRA 的志愿网络按地区编入国家动员体系，老兵依服役年限登记造册，名册由国防部与共和军派共同保管。各县按月核对人数，缺额由动员官补报。"
 IRE_nu_ira_cross_border:0 "跨境行动"
 IRE_nu_ira_cross_border_desc:0 "情报与破坏行动在边境另一侧展开，方案由特别分局与共和军参谋共同拟定，经费列入国防部机密款项，报告不入寻常档案。"
 IRE_nu_parliament_spirit:0 "全国大会余温"
 IRE_nu_parliament_spirit_desc:0 "议会派在联合政府中占据多数席位，各委员会按比例重排，议程由秘书处提前印发，内阁的施政因此获得稳定支撑。各派在委员会中的表决按席位计。"
 IRE_nu_diaspora_spirit:0 "侨民网络"
 IRE_nu_diaspora_spirit_desc:0 "海外爱尔兰人的贸易与舆论网络已与都柏林的机构对接，汇款、订单与稿件按月抵达，由外交部侨务司登记入册。领事馆按月核对名册与款项。"
 IRE_nu_labour_spirit:0 "工人委员会"
 IRE_nu_labour_spirit_desc:0 "工厂委员会把生产指标与政治动员并轨，厂方与工人代表按同一份表格填报，劳工部逐月核收并转送内阁。争执不下的条目提交仲裁庭裁定。"
 IRE_nu_works_spirit:0 "公共工程热潮"
 IRE_nu_works_spirit_desc:0 "道路、港口与住房同时开工，工程局按季度核对进度，建材调拨由供应部统一办理，账目年终送审计署。征用土地的补偿由地政署核定。"
 IRE_nu_security_spirit:0 "特别分局"
 IRE_nu_security_spirit_desc:0 "特别分局与军队在联合政府内维持秩序，治安报告每旬送交内阁，紧急案件另附卷宗，由司法部会同复核。拘押名单每旬核对一次。"
 IRE_nu_army_spirit:0 "军队忠诚"
 IRE_nu_army_spirit_desc:0 "全军宣誓效忠联合政府，宣誓名册与部队编制表一并归档于国防部，各司令部按季复核并向内阁具报。新兵入伍时重行宣誓一次。"
 IRE_nu_volunteer_spirit:0 "志愿网络"
 IRE_nu_volunteer_spirit_desc:0 "老 IRA 的志愿网络纳入国家动员，征募名册由各县动员官保管，训练按国防部颁行的科目执行，成绩逐月上报。各县按季校阅一次。"
 IRE_nu_cross_border_spirit:0 "跨境行动"
 IRE_nu_cross_border_spirit_desc:0 "边境另一侧的情报与破坏行动由特别分局统筹，行动报告经专人递送，不入寻常档案，经费另立一本账。行动前须经国防部长书面核准。"
 IRE_national_revival:0 "民族复兴"
 IRE_national_revival_desc:0 "联合政府完成组阁，四派在预算与防务上达成一致。总理府设立联络处处理派系事务，政策纲领经众议院表决通过，各部据此拟定年度计划。"
 ire_nw.151.t:0 "联合政府的危机"
 ire_nw.151.d:0 "四派的争执已由议会扩及街头。其中一派在政府中占压倒优势，其余各派公开表示不满。总理府召集四派领袖会商，提出调解、改组内阁与维持现状三种处置，请示内阁定夺。四派的议会党团已分别集会，各报逐日刊载声明。"
 ire_nw.151.a:0 "出面调解"
 ire_nw.151.b:0 "改组内阁"
 ire_nw.151.c:0 "任其自行争执"
 ire_nw.153.t:0 "联合政府的信心危机"
 ire_nw.153.d:0 "联合派与教会已对联合政府失去耐心。罢工自码头蔓延至矿区，布道与社论同时指向都柏林。总统府收到各方陈情书，均已归档。内务部已备集会禁令与戒严令各一份，随内阁决议取用；各郡警备队奉令待命。"
 ire_nw.153.a:0 "对联合派作出让步"
 ire_nw.153.b:0 "动用特别分局压制"
 ire_nw.153.c:0 "搁置不理，静观其变"
 IRE_A_postwar_red:0 "红色伙伴"
 IRE_A_postwar_red_desc:0 "新世界爱尔兰的对外重心转向红色集团，与莫斯科、法兰西公社及不列颠联盟加深合作。联合政府不改意识形态，只换外部靠山，协议文本由外交部保管。"
 IRE_A_postwar_new_world:0 "新世界民主"
 IRE_A_postwar_new_world_desc:0 "对外重心转回美国与民主阵营，以大西洋经济与安全框架替代旧帝国，国内仍行民族联盟之制。协定草案已由外交部拟就，待内阁核准。"
 IRE_A_postwar_neutral:0 "第三势力"
 IRE_A_postwar_neutral_desc:0 "拒绝两大集团，民族联盟改作独立第三势力。都柏林对华盛顿与莫斯科说同一句话：不加入任何阵营，也不为任何人守门。此路线须四派势均力敌方能维持。"
 IRE_nu_red_partnership:0 "红色伙伴关系"
 IRE_nu_red_partnership_desc:0 "都柏林与红色集团互换使节，贸易与军事协定分册签署，文本存于外交部条约司，副本送国防部与财政部。联合委员会每季核对这些条款的执行。"
 IRE_nu_new_world_partnership:0 "新世界伙伴关系"
 IRE_nu_new_world_partnership_desc:0 "都柏林重新接入美国主导的经济与安全网络，商务与防务协定分别签署，副本送财政部与国防部存查。双方按季核对执行情形并换文确认。"
 IRE_nu_third_force:0 "第三势力"
 IRE_nu_third_force_desc:0 "爱尔兰民族联盟拒绝加入两大集团，外交照会已分送各交战国，中立立场由内阁会议确认，通令各驻外使团。各口岸按此查验过往船只与货物。"
 ire_nw.154.t:0 "红色集团的提议"
 ire_nw.154.d:0 "柏林既倒，红色集团向都柏林伸手。莫斯科、法兰西公社与不列颠联盟均欲知新世界爱尔兰愿走多远。外交部呈上两案：全面接入，或有限合作以留回旋余地。所涉条约文本已由法律顾问逐条核过，备内阁取用。"
 ire_nw.154.a:0 "全面接入红色集团"
 ire_nw.154.b:0 "限定范围，有限合作"
 ire_nw.155.t:0 "新世界民主的道路"
 ire_nw.155.d:0 "华盛顿向都柏林递送新的经济与安全框架，含关税安排、航运配额与联合参谋磋商。美方希望爱尔兰回到大西洋共同体，不再游离于欧洲事务之外。协定草案已由外交部译出，两国参谋人员的磋商定于下月，请内阁核定签署范围。"
 ire_nw.155.a:0 "成为大西洋伙伴"
 ire_nw.155.b:0 "维持新世界独立"
 ire_nw.156.t:0 "独立的第三势力"
 ire_nw.156.d:0 "两大集团同时拉拢都柏林，民族联盟另择第三条路：不加入任何一方，把爱尔兰办成独立的第三势力。四派若仍守均势，联合派与教会若仍有信心，都柏林还可以再进一步。外交部已就武装中立拟出纲要，候内阁裁定。"
 ire_nw.156.a:0 "维持武装中立"
 ire_nw.156.b:0 "组建纯民族联盟"
 IRE_nu_postwar_cat:0 "战后路线"
 IRE_nu_red_economic_mission:0 "红色经济使团"
 IRE_nu_red_economic_mission_desc:0 "贸易、投资与工业合作的议定书与红色集团签署，都柏林仍以民族联盟名义行事，货款与设备经东方港口转运。结算以易货为主，差额记账。"
 IRE_nu_red_military_mission:0 "红色军事使团"
 IRE_nu_red_military_mission_desc:0 "红色集团的军事援助、装备与训练按协定接收，联合政府不换旗，受训军官的名册存于国防部，课程另附纲要。受训人员回国后分派各旅。"
 IRE_nu_atlantic_loan:0 "大西洋贷款"
 IRE_nu_atlantic_loan_desc:0 "美国贷款与工业品按协定拨付，重建工程由财政部与美国银行团共同监督，工厂陆续复工，账目分季结算。美方派员驻财政部核对用途。"
 IRE_nu_atlantic_defence:0 "大西洋防务"
 IRE_nu_atlantic_defence_desc:0 "与美国及民主海军的分训计划已经议定，舰艇技术与航空经验按年度交换，联络官常驻都柏林，报告径送国防部。联合演习每年举行一次。"
 IRE_nu_third_force_summit:0 "第三势力峰会"
 IRE_nu_third_force_summit_desc:0 "不结盟国家的代表应召前往都柏林，会议按议题分设委员会，公报由外交部起草，分送与会各国与驻外使团。下次会议的地点与议题另行商定。"
 IRE_nu_third_force_armed:0 "武装中立"
 IRE_nu_third_force_armed_desc:0 "征兵、训练与本土防御按第三势力的方案推行，各县动员官受命造册，演习计划报国防部核准后施行。教官由国防部统一选派，成绩入册。"
 IRE_nu_red_cooperation:0 "红色合作"
 IRE_nu_red_cooperation_desc:0 "都柏林与红色集团的经济与军事合作按议定书推进，联合委员会每季开会，纪要分送双方主管部门存查。双方按季交换货物清单与到货凭证。"
 IRE_nu_atlantic_cooperation:0 "大西洋合作"
 IRE_nu_atlantic_cooperation_desc:0 "都柏林重新接入美国主导的经济与防务网络，联络处已设于华盛顿，商务与军务报告分途呈报内阁。联络处的编制与经费由外交部核定。"
 IRE_nu_third_force_cooperation:0 "第三势力协调"
 IRE_nu_third_force_cooperation_desc:0 "都柏林在不结盟国家之间协调立场，交涉由驻外使团分头进行，结果汇总于外交部，按月具报内阁。每逢表决，各代表团按共同立场行事。"
 IRE_A_nu_charter_parliament:0 "议会宪章"
 IRE_A_nu_charter_parliament_desc:0 "议会的程序、预算与选举权写入联合政府根本法。联合派与教会取得正式保证，议会派自此居国家机器中枢，法案已付印分发。"
 IRE_A_nu_charter_labour:0 "工会宪章"
 IRE_A_nu_charter_labour_desc:0 "工会关于工资、工时与公共工程的权利写入宪章。工人派取得制度化席位，教会开始担忧，已向内阁递送备忘录，要求保留教产条款。"
 IRE_A_nu_charter_security:0 "国家安全法"
 IRE_A_nu_charter_security_desc:0 "特别分局、军队忠诚与紧急权力写入国家安全法。安全派取得合法工具，共和军再受压缩，其编制表由内务部重新核定，按季点验。"
 IRE_A_nu_charter_ira:0 "共和军法"
 IRE_A_nu_charter_ira_desc:0 "旧爱尔兰共和军的志愿网络、老兵与跨境行动取得正式法律地位。共和军派自此进入国家，联合派保持警惕，要求在议会设监督委员会。"
 IRE_effect_nu_charter_parliament:0 "政治点数 +100，稳定度 +5%；触发议会宪章环境事件。"
 IRE_effect_nu_charter_labour:0 "人力 +10000，政治点数 +50；触发工会宪章环境事件。"
 IRE_effect_nu_charter_security:0 "战争支持 +5%，陆军经验 +50；触发国家安全法环境事件。"
 IRE_effect_nu_charter_ira:0 "人力 +10000，陆军经验 +50；触发共和军法环境事件。"
 ire_nw.160.t:0 "议会宪章的落地"
 ire_nw.160.d:0 "议会宪章公布后，联合派、教会与海外报界同时注视都柏林的执行办法。宪章将议事程序、预算与选举事务交文官掌管，联合派要求把地方自治条款写入正文，教会则反对世俗议会扩权。内阁须在本会期内定出施行次序，请即示下。"
 ire_nw.160.a:0 "安抚联合派"
 ire_nw.160.b:0 "推进议会改革"
 ire_nw.160.c:0 "协调红色盟友"
 ire_nw.161.t:0 "工会宪章的签署"
 ire_nw.161.d:0 "工会宪章把工资、工时与公共工程写入法律，由劳工部与财政部会同执行。工人派在联合政府中取得常设席位，各行业工会按章程派出代表。教会与联合派分别递交备忘录，要求说明宪章与教产、地方自治的关系。"
 ire_nw.161.a:0 "优先兴办公共工程"
 ire_nw.161.b:0 "向教会作出让步"
 ire_nw.161.c:0 "订立战时劳动协定"
 ire_nw.162.t:0 "国家安全法议案"
 ire_nw.162.d:0 "国家安全法扩大了特别分局与军队的权力。安全派称之为秩序，共和军称之为针对自己的武器，联合派要求文官监督。内务部已把三方陈情与条文草案编成册，送众议院议程，由内阁先定口径，再交党团会议。"
 ire_nw.162.a:0 "恢复秩序。"
 ire_nw.162.b:0 "设文官监督。"
 ire_nw.162.c:0 "对黑英强硬。"
 ire_nw.163.t:0 "共和军法表决"
 ire_nw.163.d:0 "共和军法给老 IRA 的志愿网络、老兵与跨境行动一个正式名分。共和军派据此进入国家机构，联合派保持警惕，伦敦与华盛顿也在注视。法案文本已送众议院，各派提出的修正案须逐条表决，二读排在下周。"
 ire_nw.163.a:0 "整编入伍。"
 ire_nw.163.b:0 "安抚联合派。"
 ire_nw.163.c:0 "准其跨境行动。"
 ire_nw.164.t:0 "民族联盟的世界回响"
 ire_nw.164.d:0 "都柏林成立民族联盟的消息传至华盛顿、莫斯科与伦敦。由四派共同执政的爱尔兰既非旧自由邦，也不依附任何大国。三国的使馆先后请求会晤，外交部拟就三份说帖，请示总理先行答复何方。三国使馆的武官同时提出会晤请求。"
 ire_nw.164.a:0 "向华盛顿作出保证"
 ire_nw.164.b:0 "向莫斯科打开大门"
 ire_nw.164.c:0 "都柏林利益优先"
 IRE_national_revival_fragile:0 "脆弱复兴"
 IRE_national_revival_fragile_desc:0 "四派的合作限于内阁层面，地方组织仍各自行动。总理府按月召集协调会议，纲领执行情况由各部次长汇报，分歧提交仲裁委员会。"
 IRE_nu_repair_revival:0 "修补民族复兴"
 IRE_nu_repair_revival_desc:0 "四派影响力重新拉平之后，脆弱复兴按程序升格为完整复兴，内阁决议与修正清单同时生效，副本送各派。各派的承诺书一并存于内阁秘书处。"
 IRE_effect_nu_repair_revival:0 "移除脆弱复兴，获得完整民族复兴；稳定度 +5%。"
 ire_nw.165.t:0 "民族联盟的裂痕"
 ire_nw.165.d:0 "北爱尔兰已不在共和国控制之下。联合政府四派同问：失了六郡的民族联盟，是否还算民族联盟。都柏林可重申联盟、暂停联盟，或筹备收复。外交与国防两部各具节略一份，随决议归档；众议院本周排有议程。"
 ire_nw.165.a:0 "重申民族联盟"
 ire_nw.165.b:0 "暂停联盟运作"
 ire_nw.165.c:0 "筹备收复北方"
 ire_nw.166.t:0 "联盟与新政体"
 ire_nw.166.d:0 "都柏林改制之后，联合政府内四派分别递交意见书：一派主张维持联合内阁至任期届满，一派要求即日解散并重新组阁，另一派提议将联盟并入新政体的机构序列。内阁秘书处已排定磋商次序，请示如何定夺。"
 ire_nw.166.a:0 "保留联合政府"
 ire_nw.166.b:0 "解散联盟"
 ire_nw.166.c:0 "改造联盟"
 ire_nw.168.t:0 "脆弱的民族复兴"
 ire_nw.168.d:0 "四派在宪章上签字，民族复兴的精神随之出现，但平衡尚未真正成立。各派在席位、教育与警政上的分歧仍留在议定书附注里。都柏林可以照现状接受这份安排，也可以动用政治资源逐条修补，修补方案由书记处拟具。"
 ire_nw.168.a:0 "接受既有平衡"
 ire_nw.168.b:0 "动用政治资源修补"
 ire_nw.168.c:0 "将分歧留待时日"

