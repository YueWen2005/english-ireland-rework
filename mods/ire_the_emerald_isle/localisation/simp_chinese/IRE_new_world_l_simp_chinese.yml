 # ===== 爱尔兰民族联盟：准备与成立事件 =====
 ire_nw.142.t:0 "民族团结纲领"
 ire_nw.142.d_civic:0 "北爱回归后，公民共和国的议会、工会与地方议会开始讨论一个更宽的联合。联合派要求保证，工人要求席位，老 IRA 要求名分。都柏林必须决定这场圆桌的调子。"
 ire_nw.142.d_firm:0 "北爱回归后，中央集权共和国把四派叫到国防内阁。安全部门想要秩序，工会想要补偿，共和军想要编制。都柏林必须决定这场联合的调子。"
 ire_nw.142.d:0 "北爱回归后，都柏林把议会、工会、军队和共和军请到同一张桌子前。四派都同意一件事：爱尔兰必须团结；至于怎么团结，他们准备吵上几个月。"
 ire_nw.142.a:0 "圆桌妥协"
 ire_nw.142.b:0 "强力整合"
 ire_nw.142.c:0 "共和派入城"
 ire_nw.150.t:0 "民族联盟成立"
 ire_nw.150.d_roundtable:0 "圆桌妥协定下了联盟的基调。四派入阁，联合派和教会得到保证，议会掌握议程。现在都柏林要决定，谁在联合政府里先说话。"
 ire_nw.150.d_firm:0 "强力整合定下了联盟的基调。安全部门掌握秩序，工会和共和军被纳入监督。现在都柏林要决定，谁在联合政府里先说话。"
 ire_nw.150.d_republican:0 "共和派入城定下了联盟的基调。老 IRA 得到名分，联合派和教会保持警惕。现在都柏林要决定，谁在联合政府里先说话。"
 ire_nw.150.d:0 "四派在都柏林达成了一项不情愿的联合。没有人完全满意，但所有人都知道，分裂比争吵更危险。现在都柏林要决定，谁在联合政府里先说话。"
 ire_nw.150.a:0 "让议会掌握议程。"
 ire_nw.150.b:0 "给工会一个真正的席位。"
 ire_nw.150.c:0 "让安全部门守住秩序。"
 ire_nw.150.e:0 "把共和军请进政府。"
 IRE_A_national_union_parliament:0 "议会共识"
 IRE_A_national_union_parliament_desc:0 "把议会放在联合政府的中心：程序、预算和选举都归文官。联合派和教会得到保证。"
 IRE_A_national_union_labour:0 "工会契约"
 IRE_A_national_union_labour_desc:0 "给工会一个真正的席位：工资、工时和公共工程进入政府议程。教会保持警惕。"
 IRE_A_national_union_security:0 "公共安全"
 IRE_A_national_union_security_desc:0 "让安全部门守住秩序：特别分局、军队忠诚和紧急权力成为联合政府的支柱。共和军被压缩。"
 IRE_A_national_union_ira:0 "共和军整编"
 IRE_A_national_union_ira_desc:0 "把共和军请进国家：老兵、志愿网络和跨境行动获得正式名分。联合派保持警惕。"
 IRE_A_national_union_revival:0 "民族复兴"
 IRE_A_national_union_revival_desc:0 "四派都在政府里有位置，没有人能单独压倒别人。都柏林终于可以把“团结”写进国家精神。"
 IRE_effect_nu_pillar_parliament:0 "议会影响力 +10，联合派信心 +5；政治点数 +50，稳定度 +3%；解锁议会派方法决议。"
 IRE_effect_nu_pillar_labour:0 "工人影响力 +10，教会信心 −3；政治点数 +25，人力 +5000；解锁工人派方法决议。"
 IRE_effect_nu_pillar_security:0 "安全影响力 +10，共和军影响力 −3；战争支持 +3%，陆军经验 +25；解锁安全派方法决议。"
 IRE_effect_nu_pillar_ira:0 "共和军影响力 +10，联合派信心 −3；人力 +5000，陆军经验 +25；解锁共和军派方法决议。"
 IRE_tt_nu_revival_conditions:0 "四派影响力都在 20–60 之间，且联合派与教会信心都不低于 60。"
 IRE_tt_nu_cross_border:0 "黑英已成立，或任一爱尔兰核心州被敌国控制。"
 IRE_nu_parliament_convention:0 "全国大会"
 IRE_nu_parliament_convention_desc:0 "召集全国代表、工会和地方议会，把联合政府的议程摆到桌面上。"
 IRE_nu_parliament_diaspora:0 "侨民游说"
 IRE_nu_parliament_diaspora_desc:0 "让海外爱尔兰人替都柏林说话：贸易、投资和舆论一起进场。"
 IRE_nu_labour_councils:0 "工人委员会"
 IRE_nu_labour_councils_desc:0 "把工厂委员会纳入联合政府，让工人直接参与生产决策。"
 IRE_nu_labour_public_works:0 "公共工程"
 IRE_nu_labour_public_works_desc:0 "用道路、港口和住房换工会的支持；就业是最好的政治货币。"
 IRE_nu_security_special_branch:0 "特别分局"
 IRE_nu_security_special_branch_desc:0 "扩大特别分局的权力，盯住极端组织，也盯住联合政府里的对手。"
 IRE_nu_security_army_loyalty:0 "军队忠诚"
 IRE_nu_security_army_loyalty_desc:0 "让军队公开宣誓效忠联合政府，而不是某个派系。"
 IRE_nu_ira_volunteer_network:0 "志愿网络"
 IRE_nu_ira_volunteer_network_desc:0 "把老 IRA 的志愿网络并入国家动员体系，给老兵一个正式名分。"
 IRE_nu_ira_cross_border:0 "跨境行动"
 IRE_nu_ira_cross_border_desc:0 "在边境另一侧展开情报与破坏行动；只有在黑英成立或本土受威胁时才可用。"
 IRE_nu_parliament_spirit:0 "全国大会余温"
 IRE_nu_parliament_spirit_desc:0 "议会派在联合政府里占上风：稳定度与政治点数小幅提升。"
 IRE_nu_diaspora_spirit:0 "侨民网络"
 IRE_nu_diaspora_spirit_desc:0 "海外爱尔兰人的贸易与舆论网络开始回报都柏林。"
 IRE_nu_labour_spirit:0 "工人委员会"
 IRE_nu_labour_spirit_desc:0 "工厂委员会把生产效率和政治动员绑在一起。"
 IRE_nu_works_spirit:0 "公共工程热潮"
 IRE_nu_works_spirit_desc:0 "道路、港口和住房同时开工，建筑速度与消费品压力改善。"
 IRE_nu_security_spirit:0 "特别分局"
 IRE_nu_security_spirit_desc:0 "安全部门在联合政府里掌握秩序；稳定度与战争支持小幅提升。"
 IRE_nu_army_spirit:0 "军队忠诚"
 IRE_nu_army_spirit_desc:0 "军队宣誓效忠联合政府，防御与战争支持小幅提升。"
 IRE_nu_volunteer_spirit:0 "志愿网络"
 IRE_nu_volunteer_spirit_desc:0 "老 IRA 的志愿网络被纳入国家动员，征兵与进攻能力小幅提升。"
 IRE_nu_cross_border_spirit:0 "跨境行动"
 IRE_nu_cross_border_spirit_desc:0 "边境另一侧的情报与破坏行动开始见效。"
 IRE_national_revival:0 "民族复兴"
 IRE_national_revival_desc:0 "四派在联合政府里找到了平衡。都柏林终于可以宣称：爱尔兰人不再为旧账互相消耗。"
 ire_nw.151.t:0 "联盟危机"
 ire_nw.151.d:0 "四派的争吵已经从议会蔓延到街头。一个派系在政府里压倒性地占上风，其他派系开始公开抱怨。都柏林必须决定，是调解、改组内阁，还是让联合政府自己耗下去。"
 ire_nw.151.a:0 "调解。"
 ire_nw.151.b:0 "改组内阁。"
 ire_nw.151.c:0 "让它们自己吵。"
 ire_nw.153.t:0 "信心危机"
 ire_nw.153.d:0 "联合派或教会对联合政府失去耐心。罢工、布道和报纸社论同时指向都柏林。政府必须回应，否则联盟的合法性会继续流失。"
 ire_nw.153.a:0 "让步。"
 ire_nw.153.b:0 "压制。"
 ire_nw.153.c:0 "无视。"
 IRE_A_postwar_red:0 "红色伙伴"
 IRE_A_postwar_red_desc:0 "把新世界爱尔兰的对外重心转向红色集团：与莫斯科、法兰西公社和不列颠联盟建立更深的合作。联盟政府不换意识形态，只换外部靠山。"
 IRE_A_postwar_new_world:0 "新世界民主"
 IRE_A_postwar_new_world_desc:0 "把对外重心转回美国与民主阵营：用大西洋经济和安全框架替代旧帝国，同时保留民族联盟的国内框架。"
 IRE_A_postwar_neutral:0 "第三势力"
 IRE_A_postwar_neutral_desc:0 "拒绝两大集团，把爱尔兰民族联盟变成独立的第三势力；四派均衡时，可以走纯民族联盟的高阶结局。"
 IRE_nu_red_partnership:0 "红色伙伴关系"
 IRE_nu_red_partnership_desc:0 "都柏林与红色集团建立正式伙伴关系；稳定度、政治点数与战争支持小幅提升。"
 IRE_nu_new_world_partnership:0 "新世界伙伴关系"
 IRE_nu_new_world_partnership_desc:0 "都柏林重新接入美国主导的经济与安全网络；消费品、工厂产出与贸易好感改善。"
 IRE_nu_third_force:0 "第三势力"
 IRE_nu_third_force_desc:0 "爱尔兰民族联盟拒绝加入两大集团；稳定度、战争支持与防御小幅提升。"
 ire_nw.154.t:0 "红色伙伴"
 ire_nw.154.d:0 "柏林倒下后，红色集团向都柏林伸出手。莫斯科、法兰西公社和不列颠联盟都想知道：新世界爱尔兰愿意走多远？都柏林可以全面接入红色集团，也可以只做有限合作，保留自己的回旋空间。"
 ire_nw.154.a:0 "全面合作。"
 ire_nw.154.b:0 "有限合作。"
 ire_nw.155.t:0 "新世界民主"
 ire_nw.155.d:0 "华盛顿向都柏林递来新的经济与安全框架。美国希望爱尔兰回到大西洋共同体，而不是继续做一个不确定的欧洲孤儿。都柏林可以选择全面接入，也可以保留新世界爱尔兰的独立空间。"
 ire_nw.155.a:0 "大西洋伙伴。"
 ire_nw.155.b:0 "新世界独立。"
 ire_nw.156.t:0 "第三势力"
 ire_nw.156.d:0 "两大集团都在拉拢都柏林，但民族联盟可以选择第三条路：不加入任何一方，把爱尔兰变成独立的第三势力。如果四派仍然均衡、联合派与教会仍有信心，都柏林还可以走得更远——一个真正的纯民族联盟。"
 ire_nw.156.a:0 "武装中立。"
 ire_nw.156.b:0 "纯民族联盟。"
 IRE_nu_postwar_cat:0 "战后路线"
 IRE_nu_red_economic_mission:0 "红色经济使团"
 IRE_nu_red_economic_mission_desc:0 "把贸易、投资和工业合作接到红色集团；都柏林仍然是民族联盟，但钱和机器开始向东走。"
 IRE_nu_red_military_mission:0 "红色军事使团"
 IRE_nu_red_military_mission_desc:0 "接受红色集团的军事援助、装备和训练；联合政府不换旗，但军队开始说同一种语言。"
 IRE_nu_atlantic_loan:0 "大西洋贷款"
 IRE_nu_atlantic_loan_desc:0 "用美国贷款和工业品重建新世界爱尔兰；消费品压力下降，工厂重新开工。"
 IRE_nu_atlantic_defence:0 "大西洋防务"
 IRE_nu_atlantic_defence_desc:0 "与美国和民主海军合作，换取训练、舰艇技术和空军经验。"
 IRE_nu_third_force_summit:0 "第三势力峰会"
 IRE_nu_third_force_summit_desc:0 "把不结盟国家请到都柏林，建立一个不属于两大集团的外交网络。"
 IRE_nu_third_force_armed:0 "武装中立"
 IRE_nu_third_force_armed_desc:0 "用征兵、训练和本土防御把第三势力变成一支谁都不敢轻易碰的力量。"
 IRE_nu_red_cooperation:0 "红色合作"
 IRE_nu_red_cooperation_desc:0 "都柏林与红色集团的经济和军事合作正在加深。"
 IRE_nu_atlantic_cooperation:0 "大西洋合作"
 IRE_nu_atlantic_cooperation_desc:0 "都柏林重新接入美国主导的经济与防务网络。"
 IRE_nu_third_force_cooperation:0 "第三势力协调"
 IRE_nu_third_force_cooperation_desc:0 "都柏林在不结盟国家之间协调立场，强化第三势力的独立空间。"
 IRE_A_nu_charter_parliament:0 "议会宪章"
 IRE_A_nu_charter_parliament_desc:0 "把议会的程序、预算和选举权写进联合政府的根本法。联合派和教会得到正式保证，但议会派从此在国家机器里占据中心。"
 IRE_A_nu_charter_labour:0 "工会宪章"
 IRE_A_nu_charter_labour_desc:0 "把工会的工资、工时和公共工程权利写进宪章。工人派得到制度化的席位，教会开始担心。"
 IRE_A_nu_charter_security:0 "国家安全法"
 IRE_A_nu_charter_security_desc:0 "把特别分局、军队忠诚和紧急权力写进国家安全法。安全派得到合法工具，共和军被进一步压缩。"
 IRE_A_nu_charter_ira:0 "共和军法"
 IRE_A_nu_charter_ira_desc:0 "给老 IRA 的志愿网络、老兵和跨境行动一个正式的法律地位。共和军派终于进入国家，联合派保持警惕。"
 IRE_effect_nu_charter_parliament:0 "政治点数 +100，稳定度 +5%；触发议会宪章环境事件。"
 IRE_effect_nu_charter_labour:0 "人力 +10000，政治点数 +50；触发工会宪章环境事件。"
 IRE_effect_nu_charter_security:0 "战争支持 +5%，陆军经验 +50；触发国家安全法环境事件。"
 IRE_effect_nu_charter_ira:0 "人力 +10000，陆军经验 +50；触发共和军法环境事件。"
 ire_nw.160.t:0 "议会宪章"
 ire_nw.160.d:0 "议会宪章公布后，联合派、教会和海外媒体都在看都柏林。宪章把程序、预算和选举权交给文官，但联合派担心自己只是被写进序言，教会担心世俗议会进一步扩张。都柏林必须决定，如何让这份宪章落地。"
 ire_nw.160.a:0 "安抚联合派。"
 ire_nw.160.b:0 "推进议会改革。"
 ire_nw.160.c:0 "与红色盟友协调。"
 ire_nw.161.t:0 "工会宪章"
 ire_nw.161.d:0 "工会宪章把工资、工时和公共工程写进法律。工人派终于拿到制度化的席位，但教会和联合派开始担心：联合政府会不会变成工会政府？"
 ire_nw.161.a:0 "公共工程优先。"
 ire_nw.161.b:0 "安抚教会。"
 ire_nw.161.c:0 "战时工会。"
 ire_nw.162.t:0 "国家安全法"
 ire_nw.162.d:0 "国家安全法扩大了特别分局和军队的权力。安全派说这是秩序，共和军说这是针对自己，联合派要求文官监督。都柏林必须决定，谁来定义“安全”。"
 ire_nw.162.a:0 "恢复秩序。"
 ire_nw.162.b:0 "文官监督。"
 ire_nw.162.c:0 "对黑英强硬。"
 ire_nw.163.t:0 "共和军法"
 ire_nw.163.d:0 "共和军法给老 IRA 的志愿网络、老兵和跨境行动一个正式名分。共和军派终于进入国家，联合派保持警惕，伦敦和华盛顿也在看。"
 ire_nw.163.a:0 "整编入伍。"
 ire_nw.163.b:0 "安抚联合派。"
 ire_nw.163.c:0 "跨境行动。"
 ire_nw.164.t:0 "民族联盟的世界回响"
 ire_nw.164.d:0 "都柏林成立民族联盟的消息传到华盛顿、莫斯科和伦敦。一个由四派共同执政的爱尔兰，既不是旧自由邦，也不是任何大国的附庸。三大国都在等都柏林先开口。"
 ire_nw.164.a:0 "向华盛顿保证。"
 ire_nw.164.b:0 "向莫斯科打开大门。"
 ire_nw.164.c:0 "都柏林优先。"
 IRE_national_revival_fragile:0 "脆弱复兴"
 IRE_national_revival_fragile_desc:0 "四派只是勉强维持平衡；稳定度、政治点数与战争支持小幅提升，但消费品压力仍在。"
 IRE_nu_repair_revival:0 "修补民族复兴"
 IRE_nu_repair_revival_desc:0 "重新拉平四派后，把脆弱复兴升级为完整复兴。"
 IRE_effect_nu_repair_revival:0 "移除脆弱复兴，获得完整民族复兴；稳定度 +3%。"
 ire_nw.165.t:0 "联盟的裂痕"
 ire_nw.165.d:0 "北爱尔兰已经不在共和国控制之下。联合政府里的四派都在问：一个丢失了六郡的民族联盟，还算不算民族联盟？都柏林可以选择重申联盟、暂停联盟，或者准备收复。"
 ire_nw.165.a:0 "重申联盟。"
 ire_nw.165.b:0 "暂停联盟。"
 ire_nw.165.c:0 "准备收复。"
 ire_nw.166.t:0 "联盟与新政体"
 ire_nw.166.d:0 "都柏林换了政体，联合政府里的四派开始怀疑这份联盟还算不算数。有人要求保留联合政府，有人要求解散，也有人想把它改造成新政体的一部分。"
 ire_nw.166.a:0 "保留联合政府。"
 ire_nw.166.b:0 "解散联盟。"
 ire_nw.166.c:0 "改造联盟。"
 ire_nw.168.t:0 "脆弱的复兴"
 ire_nw.168.d:0 "四派在宪章上签了字，但平衡并没有真正成立。民族复兴的精神已经出现，却带着明显的裂缝。都柏林可以接受这份脆弱平衡，也可以花政治点数把它修补成真正的复兴。"
 ire_nw.168.a:0 "接受脆弱平衡。"
 ire_nw.168.b:0 "花政治点数修补。"
 ire_nw.168.c:0 "把矛盾交给时间。"

