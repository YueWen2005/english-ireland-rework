 ire_nw.173.t:0 "德国情报人员的活动"
 ire_nw.173.d_black:0 "黑英的胜利让柏林看到了机会。德国情报人员通过中间人接触共和军，提出武器、训练和“共同对付伦敦”的交换。"
 ire_nw.173.d_war:0 "战争让柏林的破坏网络活跃起来。德国情报人员试图把武器送进爱尔兰，把共和军变成对英施压的工具。"
 ire_nw.173.d:0 "德国情报人员在都柏林的码头与酒馆活动。他们不要求爱尔兰参战，只要求共和军在适当时机制造事端。G2 已将涉事人员列册，内务部主张收网；外交部请暂缓，以免断绝渠道。海军部另请封锁相关码头。"
 ire_nw.173.a:0 "利用德国人的渠道"
 ire_nw.173.a_tt:0 "共和军影响力 +5，安全影响力 +3，稳定度 −5%；德国好感 +20，英国与美国好感 −15；获得 365 天“柏林军火”。"
