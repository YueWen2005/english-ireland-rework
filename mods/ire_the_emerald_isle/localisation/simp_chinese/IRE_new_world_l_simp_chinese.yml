 IRE_tt_env_82c:0 "法国好感 -15；英国好感 -10；德国好感 +15；爱尔兰稳定 +2%。"

 ire_nw.83.t:0 "东线来信"
 ire_nw.83.d:0 "德国入侵苏联后，莫斯科通过中立渠道询问爱尔兰是否愿意派出医疗队和志愿人员。柏林警告都柏林不要越过红线。"
 ire_nw.83.a:0 "组织医疗队与志愿兵"
 ire_nw.83.b:0 "只送医疗物资"
 ire_nw.83.c:0 "严守中立"
 IRE_tt_env_83a:0 "苏联好感 +30、战争支持 +2%、人力 +5000；德国好感 -20；爱尔兰陆军经验 +25。"
 IRE_tt_env_83b:0 "苏联好感 +10；德国好感 -5；爱尔兰稳定 +1%。"
 IRE_tt_env_83c:0 "苏联好感 -10；德国好感 +5；爱尔兰稳定 +2%。"

 ire_nw.84.t:0 "白宫的红线"
 ire_nw.84.d:0 "美国参战后，白宫希望爱尔兰至少接受美国的安全保障；伦敦则希望都柏林更进一步。都柏林必须决定，是否让星条旗为爱尔兰背书？"
 ire_nw.84.a:0 "接受美国的安全保障"
 ire_nw.84.b:0 "以中立换取援助"
 ire_nw.84.c:0 "拒绝被拖入大国战争"
 IRE_tt_env_84a:0 "美国好感 +20，并向爱尔兰提供安全保证；英国若为民主政府好感 +15，若已黑英化则 -15；德国好感 -20；爱尔兰稳定 +3%。"
 IRE_tt_env_84b:0 "美国好感 +15、稳定 +1%；爱尔兰政治点数 +25、稳定 +1%；不加入任何阵营。"
 IRE_tt_env_84c:0 "美国好感 -15；英国好感 -10；德国好感 +10；爱尔兰稳定 +2%、战争支持 +2%。"

 ire_nw.85.t:0 "战后的欧洲地图"
 ire_nw.85.d:0 "欧洲的战争结束时，都柏林收到三份邀请：一份来自华盛顿和伦敦，一份来自北欧与低地国家，还有一份来自莫斯科。新世界爱尔兰要决定自己在战后秩序中的位置。"
 ire_nw.85.a:0 "推动凯尔特联邦与欧洲和解"
 ire_nw.85.b:0 "加入大西洋阵营"
 ire_nw.85.c:0 "保持武装中立"
 IRE_tt_env_85a:0 "北欧与低地国家好感 +15；美国好感 +10；英国若为民主政府好感 +10，若已黑英化则 -10；爱尔兰稳定 +3%。"
 IRE_tt_env_85b:0 "美国好感 +20，并向爱尔兰提供安全保证；英国若为民主政府好感 +20，若已黑英化则 -20；德国好感 -10；爱尔兰稳定 +2%。"
 IRE_tt_env_85c:0 "美国、英国、苏联好感 -5；爱尔兰战争支持 +3%、稳定 +2%。"
 ire.10_success_tt:0 "§G公投通过！§!纽芬兰将并入爱尔兰。"
 ire.10_fail_tt:0 "§R公投失败。§!伦敦照会都柏林表示强烈不满（英国好感 -40，稳定度 -3%）。"
 IRE_european_hope:0 "欧洲希望"
 IRE_european_hope_desc:0 "不列颠沉入黑旗之后，爱尔兰成为西欧最后的民主灯塔。都柏林把流亡者、自治领与抵抗者聚在一起，用效率、科研与外交把希望变成战力。"
 IRE_european_hope_us:0 "美国与欧洲希望"
 IRE_european_hope_us_desc:0 "华盛顿把爱尔兰视为大西洋上最可靠的民主伙伴，工业标准、燃料与建造技术随之而来。"
 IRE_european_hope_france:0 "法兰西公社与欧洲希望"
 IRE_european_hope_france_desc:0 "法兰西公社没有加入共产国际，而是选择与都柏林并肩；法国军队与情报机构为联盟提供另一条战线。"
 IRE_european_hope_dominions:0 "英联邦的残片"
 IRE_european_hope_dominions_desc:0 "加拿大、澳大利亚、新西兰、南非与印度从黑英的帝国中脱离，转而与爱尔兰合作。"
 IRE_european_hope_nordics:0 "北欧的伙伴"
 IRE_european_hope_nordics_desc:0 "北欧国家在黑暗的欧洲保留了一条中立而务实的合作渠道。"
 IRE_us_lend_lease:0 "美国租借"
 IRE_us_lend_lease_desc:0 "美国的机器、燃料与贷款进入爱尔兰港口，帮助这个岛国把有限工厂用得更有效率。"
 IRE_british_spy_network_idea:0 "不列颠内部网络"
 IRE_british_spy_network_idea_desc:0 "G2 与流亡的情报人员在伦敦、利物浦与格拉斯哥重建联络网，为登陆与起义提供眼睛。"
 IRE_royal_navy_defection_idea:0 "皇家海军的选择"
 IRE_royal_navy_defection_idea_desc:0 "不愿为黑英作战的皇家海军舰艇中，约四分之一挂上爱尔兰旗，加入都柏林的联合舰队。"
 IRE_raf_defection_idea:0 "皇家空军的倒戈"
 IRE_raf_defection_idea_desc:0 "约四分之一的皇家空军中队拒绝执行黑英的命令，带着飞机与经验飞往爱尔兰。"
 IRE_red_britain_uprising:0 "不列颠联盟起义"
 IRE_red_britain_uprising_desc:0 "法兰西公社与爱尔兰情报机构在不列颠境内点燃起义，黑英被迫在自己的岛上开辟第二战场。"
 IRE_ENG_navy_purge:0 "皇家海军清洗"
 IRE_ENG_navy_purge_desc:0 "黑英对皇家海军的不信任导致大批军官与水兵被清洗，舰队协同与登陆准备严重受损。"
 IRE_ENG_air_purge:0 "皇家空军清洗"
 IRE_ENG_air_purge_desc:0 "皇家空军中的保皇派与民主派被整肃，黑英的防空与空战能力下降。"
 IRE_ENG_spy_chaos:0 "不列颠情报混乱"
 IRE_ENG_spy_chaos_desc:0 "黑英的情报机构被渗透与清洗，稳定、战争支持与反间谍能力同时受损。"
 IRE_ENG_britain_crisis:0 "不列颠的裂痕"
 IRE_ENG_britain_crisis_desc:0 "罢工、街头冲突与议会僵局正在撕裂英国。帝国的威信每况愈下，伦敦已经无力维持秩序。"
 IRE_european_hope_cat:0 "欧洲希望"
 IRE_invite_usa:0 "邀请美国加入欧洲希望"
 IRE_invite_usa_desc:0 "华盛顿已经准备支持都柏林。邀请美国加入爱尔兰主导的联盟，把大西洋两岸的工业与海军合为一体。"
 IRE_invite_dominions:0 "邀请英联邦残片"
 IRE_invite_dominions_desc:0 "加拿大、澳大利亚、新西兰、南非与印度从黑英的帝国中脱离后，可以加入都柏林的联盟。"
 IRE_invite_nordics:0 "邀请北欧国家"
 IRE_invite_nordics_desc:0 "北欧国家在黑暗中保持中立；都柏林可以邀请他们加入欧洲希望，换取资源、燃料与北方航线。"
 IRE_british_spy_network:0 "建立不列颠内部网络"
 IRE_british_spy_network_desc:0 "G2 把流亡者、码头工人与不满的黑英军官组织起来，建立覆盖不列颠的情报网。"
 IRE_royal_navy_defection:0 "策动皇家海军叛离"
 IRE_royal_navy_defection_desc:0 "利用海军内部的不满，让约四分之一的舰艇挂上爱尔兰旗。"
 IRE_raf_defection:0 "策动皇家空军倒戈"
 IRE_raf_defection_desc:0 "说服约四分之一的皇家空军中队带着飞机与经验飞往爱尔兰，削弱黑英的防空。"
 IRE_red_london_uprising:0 "在伦敦点燃起义"
 IRE_red_london_uprising_desc:0 "法兰西公社与爱尔兰情报机构准备在不列颠本土引爆起义，让黑英在自己的首都面对第二个战场。需要法兰西公社真正加入欧洲希望，德国已对爱尔兰宣战，且爱尔兰本土受到威胁。"
 IRE_red_sabotage:0 "不列颠红色破坏"
 IRE_red_sabotage_desc:0 "在英国境内持续破坏铁路、港口与军工厂，为登陆创造窗口。"
 IRE_tt_usa_joined:0 "美国加入爱尔兰主导的欧洲希望联盟，并获得美国工业/海军合作精神。"
 IRE_tt_invite_red_france:0 "法兰西公社退出原有阵营，加入爱尔兰主导的欧洲希望联盟，并获得法兰西公社合作精神。"
 IRE_tt_dominions_joined:0 "符合条件的英联邦国家加入联盟，并获得英联邦残片精神。"
 IRE_tt_nordics_joined:0 "符合条件的北欧国家加入联盟，并获得北欧伙伴精神。"
 IRE_tt_spy_network:0 "获得不列颠内部网络精神；黑英稳定/战争支持下降。"
 IRE_tt_navy_defection:0 "皇家海军约四分之一的舰艇转交爱尔兰；黑英海军协同与登陆准备下降。"
 IRE_tt_raf_defection:0 "获得皇家空军约四分之一的飞机与经验；黑英防空/空战能力下降。"
 IRE_tt_red_uprising:0 "在不列颠触发共产主义起义/内战，黑英被迫两线作战。"
 IRE_tt_red_sabotage:0 "黑英稳定、战争支持下降，不列颠各地抵抗上升。"
 ENG_black_britain:0 "法西斯不列颠"
 ENG_black_britain_DEF:0 "法西斯不列颠"
 ENG_black_britain_ADJ:0 "不列颠法西斯"
 POLITICS_ENG_BLACK_BRITAIN_MOSLEY_DESC:0 "奥斯瓦尔德·莫斯利，黑衫军的领袖，在伦敦的废墟上宣布不列颠的新秩序。"
 IRE_european_hope_alliance:0 "欧洲希望联盟"
 ire_nw.86.t:0 "帝国的裂缝"
 ire_nw.86.d:0 "北爱回归后不久，伦敦的罢工从码头蔓延到矿区。议会里有人公开谈论“难以治理”，而黑衫军的传单已经出现在东区。唐宁街仍在否认一切。"
 ire_nw.86.a:0 "公开表达关切。"
 ire_nw.86.b:0 "这是伦敦自己的事。"
 ire_nw.87.t:0 "黑衫军向伦敦进军"
 ire_nw.87.d:0 "莫斯利的追随者从各地向伦敦集结，警察在街垒前犹豫不决。保守党内部有人开始讨论“需要一个强人”。都柏林必须决定是否下注。"
 ire_nw.87.a:0 "秘密资助伦敦政府。"
 ire_nw.87.b:0 "让黑衫军消耗英国。"
 ire_nw.88.t:0 "唐宁街的沉默"
 ire_nw.88.d:0 "内阁连续三周没有发表声明。国王取消了公开行程，陆军将领拒绝表态。帝国的神经正在一根根绷断。"
 ire_nw.88.a:0 "准备撤离侨民。"
 ire_nw.88.b:0 "静观其变。"
 ire_nw.89.t:0 "最后的警告"
 ire_nw.89.d:0 "伦敦警察厅传来消息：法西斯民兵已经拿到武器，政变只是时间问题。都柏林能做的只剩等待第一声枪响。"
 ire_nw.89.a:0 "等待伦敦的结局。"
 ire_nw.90.t:0 "不列颠的十字路口"
 ire_nw.90.d:0 "数月的罢工、黑衫军游行与内阁瘫痪之后，伦敦的威信终于崩溃。法西斯民兵与保皇派在街头对峙，唐宁街请求都柏林表态，而黑衫军正在等待信号。伦敦的旧盟友被排除在这场内战之外，而德国的志愿兵可能随时出现在黑衫军一侧。"
 ire_nw.90.a:0 "保持距离，让帝国自己解决。"
 ire_nw.90.b:0 "秘密支援伦敦政府，赌它赢。"
 ire_nw.91.t:0 "欧洲希望"
 ire_nw.91.d:0 "黑英的旗帜在伦敦升起，同盟国名存实亡。欧洲的民主政府、流亡者与自治领把目光投向都柏林。爱尔兰成为西欧最后的灯塔。"
 ire_nw.91.a:0 "扛起欧洲的希望。"
 ire_nw.91.b:0 "先整顿内部。"
 ire_nw.91.c:0 "把希望变成工业与科研。"
 ire_nw.92.t:0 "罗斯福的来信"
 ire_nw.92.d:0 "华盛顿不再等待伦敦。罗斯福写来一封长信：美国准备把工业、燃料与海军借给都柏林，只要爱尔兰愿意成为大西洋的支点。"
 ire_nw.92.a:0 "把美国工业纳入大西洋体系。"
 ire_nw.92.b:0 "接受美军顾问。"
 ire_nw.92.c:0 "先谈条件。"
 ire_nw.93.t:0 "法兰西公社的诞生"
 ire_nw.93.d:0 "黑英上台后，巴黎的左右联盟彻底破裂。人民阵线在工厂区起义，法兰西公社宣告成立，法国内战爆发。都柏林必须决定如何面对这场席卷法国的革命。"
 ire_nw.93.a:0 "公开支持法国人民阵线。"
 ire_nw.93.b:0 "秘密运送武器。"
 ire_nw.93.c:0 "保持距离。"
 ire_nw.94.t:0 "伦敦的暗火"
 ire_nw.94.d:0 "不列颠内部网络发出信号：伦敦码头、苏格兰工厂与威尔士矿井同时停工。红色起义在黑英的心脏爆发。"
 ire_nw.94.a:0 "把起义变成第二战场。"
 ire_nw.94.b:0 "派志愿者。"
 ire_nw.94.c:0 "保持低调。"
 ire_nw.95.t:0 "皇家海军的选择"
 ire_nw.95.d:0 "一支不愿为黑英作战的舰队离开斯卡帕湾，挂上爱尔兰旗驶向科克。皇家海军不再是黑英的私产。"
 ire_nw.95.a:0 "接收舰队。"
 ire_nw.95.b:0 "接收船队与补给。"
 ire_nw.95.c:0 "让水兵自己选择。"
 ire_nw.96.t:0 "雾中的网络"
 ire_nw.96.d:0 "G2 的联络员在伦敦、利物浦与格拉斯哥建立据点。黑英的警察发现，他们抓到的每一个人都认识另外十个人。"
 ire_nw.96.a:0 "扩大网络。"
 ire_nw.96.b:0 "把情报送到华盛顿。"
 ire_nw.96.c:0 "保持静默。"
 ire_nw.97.t:0 "法兰西公社加入欧洲希望"
 ire_nw.97.d:0 "法兰西公社派出代表团来到都柏林。欧洲希望第一次成为一个跨越意识形态的联盟。"
 ire_nw.97.a:0 "让巴黎坐到桌边。"
 ire_nw.97.b:0 "先谈军事合作。"
 ire_nw.97.c:0 "把联盟写进宪章。"
 ire_nw.98.t:0 "鹰的倒戈"
 ire_nw.98.d:0 "皇家空军的中队从林肯郡起飞，没有拦截德国轰炸机，而是转向西方。黑英的天空出现了一个缺口。"
 ire_nw.98.a:0 "接纳飞行员。"
 ire_nw.98.b:0 "接收飞机。"
 ire_nw.98.c:0 "让他们自己选。"
 IRE_tt_red_uprising_conditions:0 "法兰西公社必须真正加入欧洲希望，德国已对爱尔兰宣战，且爱尔兰本土受到威胁（黑英对爱尔兰宣战，或本土核心州被占领）。"
 IRE_european_hope_britain:0 "不列颠联盟的友谊"
 IRE_european_hope_britain_desc:0 "不列颠联盟把皇家海军的残余、码头工会与情报网络交给欧洲希望。"
 ire_nw.99.t:0 "不列颠联盟加入欧洲希望"
 ire_nw.99.d:0 "不列颠联盟赢得内战后，伦敦的罢工委员会向都柏林派出代表团。欧洲希望第一次同时拥有巴黎与伦敦，海峡不再是边界，而是一条共同的防线。"
 ire_nw.99.a:0 "让皇家海军换旗"
 ire_nw.99.b:0 "把联盟写进宪章"
 ire_nw.99.c:0 "先稳住伦敦"
 IRE_tt_european_major_war:0 "需欧洲大国之间爆发战争（不要求爱尔兰参战）。"
 IRE_wartime_laws_cat:0 "战时法案"
 IRE_wartime_war_economy:0 "转入战时经济"
 IRE_wartime_war_economy_desc:0 "以战时联合政府的名义强行通过战时经济法案。民主政体通常要等战争支持度过半，现在不必再等。"
 IRE_wartime_total_economy:0 "全面经济动员"
 IRE_wartime_total_economy_desc:0 "把全国工业纳入战争轨道。需要先实行战时经济。"
 IRE_wartime_service:0 "实行义务兵役"
 IRE_wartime_service_desc:0 "在议会通过义务兵役法。民主政体通常要等战争支持度过半，现在不必再等。"
 IRE_wartime_all_adults:0 "全民服役"
 IRE_wartime_all_adults_desc:0 "把征召范围扩大到全部成年人口。需要先实行义务兵役。"
 IRE_wartime_scraping:0 "刮桶底"
 IRE_wartime_scraping_desc:0 "把最后的人力投入战争。需要先实行全民服役。"
 ire_nw.130.t:0 "阿勃维尔的爱尔兰之门"
 ire_nw.130.d:0 "一位中立国外交官送来柏林的口信：德国情报机关想和爱尔兰谈谈。信使在利菲河畔的旅馆里等着，桌上放着一张从不多见的航线图。"
 ire_nw.130.a:0 "听听他怎么说。"
 ire_nw.130.b:0 "逮捕他，然后通知伦敦。"
 ire_nw.130.c:0 "把他交给 G2。"
 ire_nw.131.t:0 "凯瑟琳计划"
 ire_nw.131.d:0 "阿勃维尔的计划很直接：利用爱尔兰的港口与旧部，把爱尔兰当作进攻英国的后门。信使要港口、无线电操作员和沉默。"
 ire_nw.131.a:0 "我们要这些武器。"
 ire_nw.131.b:0 "这不是我们的战争。"
 ire_nw.131.c:0 "收下武器，然后出卖他们。"
 ire_nw.132.t:0 "网络暴露"
 ire_nw.132.d:0 "阿勃维尔在爱尔兰的网络被伦敦和华盛顿同时盯上。报纸开始追问都柏林的沉默，唐宁街要求一个解释。"
 ire_nw.132.a:0 "否认一切。"
 ire_nw.132.b:0 "承认并道歉。"
 ire_nw.133.t:0 "无声的谅解"
 ire_nw.133.d:0 "都柏林把阿勃维尔的信使和计划交了出去。伦敦和华盛顿没有公开道谢，但情报渠道从此对爱尔兰打开了一条缝。"
 ire_nw.133.a:0 "保持沉默。"
 ire_nw.133.b:0 "把情报分享给华盛顿。"
 ire_nw.133.c:0 "向伦敦要点回报。"
 IRE_abwher_network:0 "阿勃维尔的爱尔兰网络"
 IRE_abwher_network_desc:0 "德国情报机关在爱尔兰的联络网：电台、信使和一批愿意冒险的旧部。它不会永远存在。"
 IRE_abwher_exposed:0 "阿勃维尔丑闻"
 IRE_abwher_exposed_desc:0 "德国网络被曝光，都柏林的沉默成了伦敦和华盛顿的把柄。"
 IRE_covert_cat:0 "秘密行动"
 IRE_abwher_arms_run:0 "接收阿勃维尔的军火"
 IRE_abwher_arms_run_desc:0 "从德国网络接收一批步兵武器和火炮，并让 G2 记录下每一条航线。每次行动都会增加暴露风险；暴露过高时网络会被伦敦发现，三次之后无论结果如何都会收手。"
 IRE_invite_red_france:0 "邀请法兰西公社加入"
 IRE_invite_red_france_desc:0 "邀请法兰西公社加入欧洲希望。若法兰西公社仍在内战，可能需要等它获胜后再试；成功后法兰西公社加入阵营并触发事件。"
 ire_nw.134.t:0 "自由国家响应都柏林"
 ire_nw.134.d:0 "随着德国的战争蔓延，一批受威胁的政府开始把目光转向都柏林。欧洲希望不再只是一个爱尔兰的联盟。"
 ire_nw.134.a:0 "欢迎他们。"
 ire_nw.134.b:0 "先谈军事合作。"
 IRE_german_last_stand:0 "德国的最后动员"
 IRE_german_last_stand_desc:0 "德国在四面受敌时进行的全面动员。此精神不显示在界面上。"
 ire_nw.135.t:0 "华盛顿与黑旗"
 ire_nw.135.d:0 "黑英上台后，华盛顿一时不知道该把伦敦当成敌人还是对手。白宫通过非正式渠道询问都柏林：爱尔兰准备站在哪一边？"
 ire_nw.135.a:0 "向华盛顿靠拢。"
 ire_nw.135.b:0 "承认伦敦的新政府。"
 ire_nw.135.c:0 "暂时不表态。"
 ire_nw.136.t:0 "自治领的选择"
 ire_nw.136.d:0 "加拿大、澳大利亚、新西兰、南非和印度都在看着伦敦的新政府。对一些国家来说，都柏林比伦敦更像一个可以合作的民主伙伴。"
 ire_nw.136.a:0 "向自治领敞开都柏林的大门。"
 ire_nw.136.b:0 "让它们自己决定。"
 ire_nw.136.c:0 "施压，要求它们与伦敦决裂。"
 ire_nw.137.t:0 "自由法国与法兰西公社"
 ire_nw.137.d:0 "法兰西公社加入欧洲希望后，自由法国和华盛顿都在观察都柏林。承认公社，还是保留与自由法国的渠道？"
 ire_nw.137.a:0 "承认法兰西公社。"
 ire_nw.137.b:0 "保留与自由法国的渠道。"
 ire_nw.137.c:0 "让法国人自己解决。"
 ire_nw.138.t:0 "莫斯科的目光"
 ire_nw.138.d:0 "不列颠联盟加入欧洲希望后，莫斯科第一次认真看待都柏林。苏联既是德国的敌人，也是西方民主国家的对手。"
 ire_nw.138.a:0 "与莫斯科打开务实渠道。"
 ire_nw.138.b:0 "与莫斯科保持距离。"
 ire_nw.138.c:0 "邀请苏联观察员。"
 ire_nw.139.t:0 "联合派的疑虑"
 ire_nw.139.d:0 "北爱回归后，联合派领袖和地方工会没有走上街头，但他们在观望。都柏林准备给他们一个位置，还是用行政命令压过去？"
 ire_nw.139.a:0 "给联合派一个位置。"
 ire_nw.139.b:0 "用行政命令压过去。"
 ire_nw.139.c:0 "让 IRA 去处理。"
 ire_nw.140.t:0 "老 IRA"
 ire_nw.140.d:0 "IRA 的老兵不接受都柏林和伦敦的妥协。他们要求在新国家里有一个位置，否则就自己动手。"
 ire_nw.140.a:0 "把他们编入国家军。"
 ire_nw.140.b:0 "特别法庭和拘禁。"
 ire_nw.140.c:0 "让他们去对付黑英。"
 ire_nw.140.e:0 "暂时不管他们。"
 ire_nw.141.t:0 "主教与红色盟友"
 ire_nw.141.d:0 "法兰西公社和不列颠联盟加入欧洲希望后，主教团和爱尔兰裔美国报纸公开表示不安。都柏林必须回答：共和国与红色盟友的关系到底是什么？"
 ire_nw.141.a:0 "安抚教会。"
 ire_nw.141.b:0 "共和国是世俗的。"
 ire_nw.141.c:0 "两边都不得罪。"

