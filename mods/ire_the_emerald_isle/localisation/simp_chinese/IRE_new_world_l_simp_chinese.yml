 ire_nw.181.d_black:0 "共和军的一支小队越过边境，袭击了黑英的一个哨所。伦敦正在等待都柏林的解释，联合政府里没有人事先知道这件事。"
 ire_nw.181.d_war:0 "战争期间，共和军的一支小队擅自越境，袭击了英国军火列车。伦敦要求都柏林给出解释。"
 ire_nw.181.d:0 "共和军的一支小队越过边境，袭击了英国哨所。没有人能说清命令出自何处，伦敦已把账记在都柏林头上。外交部收到英方照会，措辞强硬；国防部要求该部提交行动报告，列明带队军官与出发时刻。英方在照会中要求赔偿。"
