 ire_nw.81.t:0 "英联邦的裂痕"
 ire_nw.81.d:0 "加拿大并入新世界爱尔兰后，渥太华易帜的消息传遍自治领。澳大利亚、新西兰、南非和印度都在问：伦敦还能代表他们吗？"
 ire_nw.81.a:0 "邀请自治领承认新世界"
 ire_nw.81.b:0 "用贸易协定安抚伦敦"
