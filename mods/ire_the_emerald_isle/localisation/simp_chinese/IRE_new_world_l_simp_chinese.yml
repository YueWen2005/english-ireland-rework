 # ===== 民族联盟：丑闻与内阁重心事件 187–188 =====
 ire_nw.187.t:0 "联合政府的丑闻"
 ire_nw.187.d_labour:0 "秘密远征被报纸曝光。码头工会、共和军志愿网络和都柏林的沉默同时出现在头版；联合政府无法再假装自己不知情。"
 ire_nw.187.d_security:0 "特别分局的名单被反对派议员公开。未经授权的拘禁、联合派的证词和政府的掩盖同时出现在报纸上。"
 ire_nw.187.d:0 "联合政府的秘密行动被报纸揭露，反对党已在众议院提出质询。内阁须在承担后果、切割与继续掩盖之间选择。总理府已备好三份声明稿，连同相关卷宗送内阁会议，由内阁择定，质询答复期限另行排定。"
 ire_nw.187.a:0 "承担后果。"
 ire_nw.187.a_tt:0 "稳定度 −5%，政治点数 −25；获得 365 天“政治丑闻”。工人丑闻：工人影响力 −3，美国与英国好感 −10。安全丑闻：安全影响力 −3，联合派信心 −3，工人影响力 +3。"
 ire_nw.187.b:0 "与行动切割。"
 ire_nw.187.b_tt:0 "政治点数 −50，稳定度 +5%；工人丑闻：工人影响力 −6。安全丑闻：安全影响力 −6。"
 ire_nw.187.c:0 "继续掩盖。"
 ire_nw.187.c_tt:0 "政治点数 −75，稳定度 −5%；50% 彻底压下，50% 再拖 180 天后重新爆发。"

 ire_nw.188.t:0 "内阁重心转移"
 ire_nw.188.d_parliament:0 "议会派已经取代其他派系，成为联合政府里最有分量的一极。文官、程序和选举重新定义了这个国家。"
 ire_nw.188.d_labour:0 "工人派已经取代其他派系，成为联合政府里最有分量的一极。工会、工厂和街头政治开始主导都柏林。"
 ire_nw.188.d_security:0 "安全派已经取代其他派系，成为联合政府里最有分量的一极。特别分局和军队把手伸进了每一个部门。"
 ire_nw.188.d_ira:0 "共和军派已经取代其他派系，成为联合政府里最有分量的一极。老兵、志愿网络和边境行动成了国家的中心。"
 ire_nw.188.d:0 "联合政府的重心正在移动。各派在议席与委员会中的位置随之调整，新的主导者尚未定型。内阁秘书处按旧例重排名单，各派提交的人选与履历已送秘书处，争议的席位留待下次会议核定。各派领袖已分别具函陈明立场。"
 ire_nw.188.a:0 "确认新的重心。"
 ire_nw.188.a_tt:0 "主导派影响力 +5，稳定度 +5%，政治点数 +25。"
 ire_nw.188.b:0 "维持旧有平衡。"
 ire_nw.188.b_tt:0 "主导派影响力 −5，最低派影响力 +5，政治点数 −25，稳定度 +5%。"
 ire_nw.188.c:0 "改组内阁名单。"
 ire_nw.188.c_tt:0 "四派影响力各 −3，稳定度 +5%，政治点数 −50，战争支持 +5%。"

