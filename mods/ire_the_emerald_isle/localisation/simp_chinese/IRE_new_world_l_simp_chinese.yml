 ire_nw.175.t:0 "红色兄弟的请求"
 ire_nw.175.d_france:0 "法兰西公社向都柏林求援：志愿军、武器或至少一个公开姿态。巴黎把爱尔兰当作西欧红色阵营的兄弟，而不是中立国。"
 ire_nw.175.d_britain:0 "红色伦敦请求都柏林派出志愿军和物资。伦敦说这是兄弟之间的互助，都柏林知道这会把自己拖进更大的战争。"
 ire_nw.175.d:0 "红色集团通过其驻都柏林代表提出请求：志愿军、武器与公开支持。代表称西欧战场人手不足，并附上一份物资清单。外交部与国防部已就派遣规模、运输安排与对外口径出具意见，候内阁决定，副本送参谋部。"
 ire_nw.175.a:0 "派出志愿军"
 ire_nw.175.a_tt:0 "工人影响力 +8，共和军影响力 +5，战争支持 +5%；红色法国/英国与苏联好感 +20–25，美国与非共产主义英国好感 −15；获得 365 天“国际主义志愿军”。"
