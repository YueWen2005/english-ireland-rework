 # ===== 民族联盟：战后国内外环境事件 190–199 =====
 ire_nw.190.t:0 "战后欧洲会议"
 ire_nw.190.d_red:0 "柏林倒下后，欧洲的红色伙伴和旧盟友同时把目光投向都柏林。新世界爱尔兰必须决定，在战后欧洲坐哪一张桌子。"
 ire_nw.190.d_new_world:0 "柏林倒下后，华盛顿和伦敦开始安排战后欧洲。都柏林收到邀请，但座位和条件都取决于爱尔兰愿意站在哪一边。"
 ire_nw.190.d_neutral:0 "柏林倒下后，欧洲进入重新洗牌。都柏林既不想加入红色集团，也不想完全跟着华盛顿；第三势力第一次有了真正的舞台。"
 ire_nw.190.d:0 "柏林倒下后，欧洲各国在废墟上重新排队。都柏林还没有选定阵营，但战后会议不会等爱尔兰。"
 ire_nw.190.a:0 "主持欧洲和解会议。"
 ire_nw.190.a_tt:0 "政治点数 −50，稳定度 +3%；北欧与低地国家好感 +15，美国/苏联/英国好感 +10；确立“和解”基调。"
 ire_nw.190.b:0 "支持大国安排。"
 ire_nw.190.b_tt:0 "稳定度 +1%；美国/苏联好感 +20，英国好感 +10，北欧与低地国家好感 −10；确立“大国安排”基调。"
 ire_nw.190.c:0 "爱尔兰优先。"
 ire_nw.190.c_tt:0 "稳定度 +3%，战争支持 +3%；美国/苏联/英国好感 −10；确立“爱尔兰优先”基调。"

 ire_nw.191.t:0 "德国占领与分裂"
 ire_nw.191.d_reconciliation:0 "德国被占领后，欧洲的和解派希望尽快恢复秩序；但占领区边界已经把欧洲分成了两半。"
 ire_nw.191.d_greatpowers:0 "德国被占领后，美苏英在占领区问题上各说各话。都柏林必须在两大占领集团之间选一个更有利的位置。"
 ire_nw.191.d_ireland:0 "德国被占领后，都柏林只关心一件事：不要让爱尔兰再次成为大国交易的筹码。"
 ire_nw.191.d:0 "德国被占领后，欧洲的分裂已经写在占领区地图上。都柏林必须决定如何面对新的德国问题。"
 ire_nw.191.a:0 "支持西方占领区。"
 ire_nw.191.a_tt:0 "议会影响力 +4，联合派信心 +3；美国好感 +20，英国好感 +15，苏联好感 −20；确立亲西方立场。"
 ire_nw.191.b:0 "承认苏联占领区。"
 ire_nw.191.b_tt:0 "工人影响力 +4，共和军影响力 +3，稳定度 −2%；苏联好感 +20，美国/英国好感 −15；确立亲苏立场。"
 ire_nw.191.c:0 "爱尔兰保持中立。"
 ire_nw.191.c_tt:0 "稳定度 +3%，战争支持 +2%；美国/苏联/英国好感 −10；确立中立立场。"

 ire_nw.192.t:0 "美苏裂痕"
 ire_nw.192.d:0 "战争结束不到一年，华盛顿和莫斯科已经开始互相试探。都柏林不能再假装自己可以同时讨好两边。"
 ire_nw.192.a:0 "倒向华盛顿。"
 ire_nw.192.a_tt:0 "议会影响力 +4，联合派信心 +3，工人影响力 −3；美国好感 +25，苏联好感 −20。"
 ire_nw.192.b:0 "倒向莫斯科。"
 ire_nw.192.b_tt:0 "工人影响力 +5，共和军影响力 +3，教会信心 −3；苏联好感 +25，美国好感 −20。"
 ire_nw.192.c:0 "不结盟。"
 ire_nw.192.c_tt:0 "稳定度 +3%，战争支持 +2%；美国/苏联好感 −10。"

 ire_nw.193.t:0 "红色阵营的裂痕"
 ire_nw.193.d_red:0 "红色集团在战后第一次出现裂痕：莫斯科要求服从，西欧的红色盟友想要自己的道路。都柏林必须选择站在哪一边。"
 ire_nw.193.d:0 "红色法国/英国与莫斯科在战后路线上发生分歧。都柏林虽然还没有正式转红，但已经被要求表态。"
 ire_nw.193.a:0 "站在莫斯科一边。"
 ire_nw.193.a_tt:0 "工人影响力 +4，共和军影响力 +3，稳定度 −2%；苏联好感 +25，红色法国/英国好感 −15。"
 ire_nw.193.b:0 "站在西欧红色盟友一边。"
 ire_nw.193.b_tt:0 "工人影响力 +5，教会信心 −2，稳定度 +1%；红色法国/英国好感 +25，苏联好感 −15。"
 ire_nw.193.c:0 "调解。"
 ire_nw.193.c_tt:0 "工人影响力 +2，稳定度 +3%，政治点数 −50；苏联与红色法国/英国好感 +10。"

 ire_nw.194.t:0 "马歇尔计划"
 ire_nw.194.d:0 "华盛顿提出一套欧洲重建援助。钱很多，条件也很清楚：受援国必须在政治上与莫斯科保持距离。"
 ire_nw.194.a:0 "接受援助。"
 ire_nw.194.a_tt:0 "议会影响力 +4，联合派信心 +3，工人影响力 −3；美国好感 +30，苏联好感 −15；获得 365 天“美国贷款”。"
 ire_nw.194.b:0 "谈判条件。"
 ire_nw.194.b_tt:0 "议会影响力 +2，稳定度 +2%，政治点数 −25；美国好感 +10。"
 ire_nw.194.c:0 "拒绝。"
 ire_nw.194.c_tt:0 "工人影响力 +3，稳定度 +2%，战争支持 +2%；美国好感 −25。"

 ire_nw.195.t:0 "帝国解体"
 ire_nw.195.d:0 "战争削弱了旧帝国。伦敦和巴黎的殖民地开始要求独立，都柏林必须决定，是支持民族自决，还是维护旧秩序。"
 ire_nw.195.a:0 "支持殖民地独立。"
 ire_nw.195.a_tt:0 "政治点数 +25，稳定度 +2%；英国/法国好感 −15，美国/苏联好感 +10。"
 ire_nw.195.b:0 "支持欧洲帝国。"
 ire_nw.195.b_tt:0 "政治点数 −25，稳定度 +2%，工人影响力 −3，教会信心 +3；英国/法国好感 +20。"
 ire_nw.195.c:0 "贸易中立。"
 ire_nw.195.c_tt:0 "政治点数 +25，稳定度 +1%；获得 365 天“战后贸易”。"

 ire_nw.196.t:0 "退伍军人返乡"
 ire_nw.196.d:0 "战争结束，成千上万的爱尔兰军人回到家乡。住房、工作和训练都跟不上，退伍军人的耐心正在耗尽。"
 ire_nw.196.a:0 "慷慨安置。"
 ire_nw.196.a_tt:0 "政治点数 −50，稳定度 +3%，人力 +5000；获得 365 天“退伍军人安置”。"
 ire_nw.196.b:0 "就业计划。"
 ire_nw.196.b_tt:0 "政治点数 −25，稳定度 +2%，人力 +2500；获得 365 天“工业转产”。"
 ire_nw.196.c:0 "紧缩。"
 ire_nw.196.c_tt:0 "政治点数 +25，稳定度 −2%，人力 +2500。"

 ire_nw.197.t:0 "重建与移民"
 ire_nw.197.d:0 "战后重建需要钱，也需要人。都柏林可以在住房、移民回流和紧缩预算之间选择。"
