 IRE_dev_ulster:0 "开发北爱尔兰"
 IRE_dev_ulster_desc:0 "贝尔法斯特的船厂、港口与铁路重新接入国家建设计划。工程分段移交，设备与技工由工商部统筹，原有技工优先留用。进度按季报内阁。"
 IRE_tt_national_mining_repeat:0 "可重复进行：每次增加本土各州资源，180 天后可再次执行。"
 IRE_A_civic_republic:0 "公民共和国"
 IRE_A_civic_republic_desc:0 "新世界爱尔兰以和解立国，由公民、侨民与地方议会共同支撑。都柏林不模仿旧式帝国，改以宪章、预算与选举维持国家，宪法草案已交制宪会议。"
 IRE_A_centralised_republic:0 "中央集权共和国"
 IRE_A_centralised_republic_desc:0 "内阁集中掌管人力、工业与安全事务，各部按统一指令行事。地方议会权限收归部会，政令由特别分局监督执行，年度考成径报总理。"
 IRE_A_national_accord:0 "民族团结纲领"
 IRE_A_national_accord_desc:0 "北爱已归共和国。都柏林邀议会、工会、军队与共和军同席，议定联合政府章程。四派各派代表，席位与议程由筹备处排定。"
 IRE_A_national_union_convene:0 "召集民族联盟"
 IRE_A_national_union_convene_desc:0 "此举不改意识形态，只将四派绑在同一政府之内：内部照旧争执，对外只作一个爱尔兰发言。联合政府章程已由四派代表签署。"
 IRE_tt_national_union_north:0 "北爱尔兰必须已经回归共和国"
 IRE_national_union:0 "爱尔兰民族联盟"
 IRE_civic_republic:0 "公民共和国"
 IRE_civic_republic_desc:0 "地方议会、侨民代表与公民团体共同参与国家治理。议事规则由内政部颁行，代表按界别推选，任期与罢免另有规定。议案须经众议院复核。"
 IRE_centralised_republic:0 "中央集权共和国"
 IRE_centralised_republic_desc:0 "都柏林集中调配人力、工业与安全事务，国家机器运转更快。各部权限收归内阁，地方政令由特派员监督执行，考成按季呈报总理。"
 IRE_civic_research_bonus:0 "公民科技加速"
 # ===== 加拿大归并后的开发计划 =====
 IRE_canada_cat:0 "加拿大开发"
 IRE_canada_development_plan:0 "加拿大国土开发计划"
 IRE_canada_development_plan_desc:0 "多伦多、蒙特利尔、温尼伯到温哥华的铁路、港口与市政公用事业纳入都柏林的发展计划，工程分三期推进，每期同时覆盖加拿大各可开发省份。旧帝国只修通往港口的那几条线。"
 IRE_canada_resource_plan:0 "加拿大资源勘探计划"
 IRE_canada_resource_plan_desc:0 "地质队进入新斯科舍的煤田、艾伯塔的油砂、魁北克与努纳武特的铝矿带，以及安大略北部的钢铁与铬矿。矿脉不算富，足够让都柏林的工厂不再仰赖他人。三期工程，一期比一期深入。"
 IRE_canada_smelting_plan:0 "加拿大工业冶炼计划"
 IRE_canada_smelting_plan_desc:0 "安大略与魁北克建立特种钢、铝材与铬铁合金联合企业，把矿石、电力与港口变成火炮、飞机与装甲钢。第一期投产时，圣劳伦斯河沿岸的烟囱已多过都柏林全城。"
 IRE_canada_smelting:0 "加拿大冶炼工业"
 IRE_canada_smelting_desc:0 "安大略与魁北克的特种钢、铝材与铬铁合金联合企业按合同供货，加拿大的矿石与电力在此变成爱尔兰战争机器的精密部件，交货单经国防部验收。"
 IRE_tt_canada_development:0 "加拿大全部 19 个可开发省份：各 +1 建筑格、+1 基础设施；随机 1 省 +1 民用工厂。"
 IRE_tt_canada_development_offsite:0 "地图外 +1 民用工厂；人力 +10000；稳定度 +5%。"
 IRE_tt_canada_development_final:0 "第三期完成：额外地图外 +1 军用工厂，人力 +15000。"
 IRE_tt_canada_resources:0 "按省份增加煤 +6、钢 +7、铝 +7、石油 +5、钨 +1、铬 +2；政治点数 +20。"
 IRE_tt_canada_resources_final:0 "第三期完成：额外地图外 +1 民用工厂。"
 IRE_tt_canada_smelting:0 "铬 +3、钢 +4、铝 +4；地图外 +1 军用工厂；政治点数 +15。"
 IRE_tt_canada_smelting_idea:0 "解锁国家精神「加拿大冶炼工业」：工厂产出 +10%、军工生产速度 +10%、民用工业生产速度 +5%、消费品 -5%。"
 IRE_tt_canada_smelting_final:0 "第三期完成：额外地图外 +1 民用工厂。"
 # ===== 四州钢铝开发计划 =====
 IRE_mining_leinster:0 "伦斯特钢铝铬开发计划"
 IRE_mining_leinster_desc:0 "沿都柏林—德罗赫达—韦克斯福德一线扩建轧钢、铝材加工、铬铁合金与配套电力设施。工商部核发许可，工程分段招标，进度按季报部。"
 IRE_mining_munster:0 "蒙斯特钢铝铬开发计划"
 IRE_mining_munster_desc:0 "科克港与香农河口进口铝土，氧化铝精炼、轧铝、轧钢与铬铁合金各厂相继扩建。港口吞吐由港务当局调度，电力由香农工程供给。"
 IRE_mining_connaught:0 "康诺特钢铝铬开发计划"
 IRE_mining_connaught_desc:0 "以香农河水电为依托，发展合金钢、铝材加工与铬铁合金，钨矿继续开采。工程由电力供应局与工商部会同办理，矿区按区段登记。"
 IRE_mining_ulster:0 "阿尔斯特钢铝铬开发计划"
 IRE_mining_ulster_desc:0 "贝尔法斯特的船厂、钢厂、铝材加工、铬铁合金与煤矿重新编入开发计划。北爱各郡工业登记造册，铁路与港口按计划扩建。"
 IRE_tt_state_mining_repeat:0 "可重复实施：增加本州钢、铝、铬等资源，150 天后可再次执行。"
 # ===== 爱尔兰团结与工业效率 =====
 IRE_eff_cat:0 "工业效率"
 IRE_unity_plan:0 "爱尔兰团结计划"
 IRE_unity_plan_desc:0 "在本土开发之外，都柏林把侨民资本与公共投资转向海外工业。每期交付一批民用与军用工厂，工程由工商部发包，可续期施行。"
 IRE_tt_unity_plan_repeat:0 "可重复实施：每次获得 3 座地图外民用工厂与 3 座地图外军用工厂，240 天后可再次执行。"
 IRE_eff_standardisation:0 "工业标准化"
 IRE_eff_standardisation_desc:0 "统一全国工厂的机床规格、工时与质量标准，由工业部设标准委员会逐厂核定，各厂按册改造设备与工装，检验结果按季上报。"
 IRE_eff_assembly_line:0 "流水线革新"
 IRE_eff_assembly_line_desc:0 "在都柏林、科克与贝尔法斯特推行流水线与专业化分工，工序按节拍拆分，工人分岗培训，车间设传送装置与检验台。工业部派员驻厂核算产能。"
 IRE_eff_total_mobilisation:0 "全国工业动员"
 IRE_eff_total_mobilisation_desc:0 "民用工业、港口与铁路一并纳入战时生产计划，船坞改修军用船只，货运按军需次序排班。经济部与国防部联合设调度处，逐周核对产能。"
 IRE_industrial_standardisation:0 "工业标准化"
 IRE_industrial_standardisation_desc:0 "机床规格与质量标准由工业部统一颁行，各厂按同一套图纸加工，检验员驻厂抽验，合格件加盖统一印记。不合规格的批次退回重做。"
 IRE_assembly_line:0 "流水线革新"
 IRE_assembly_line_desc:0 "流水线与专业化分工使各厂较快达到额定产能，工序衔接由工业部核定，工时与工资随工序另订，缺件按周补齐。新厂投产后按同一标准验收。"
 IRE_total_industrial_mobilisation:0 "全国工业动员"
 IRE_total_industrial_mobilisation_desc:0 "全国工业转入战时轨道。工厂按军工订货排产，原料由供应部统配，工时与设备检修另定章程。交货进度按月考核，延误由主管部门说明。"
 # ===== 铁路车辆生产 =====
 IRE_train_production:0 "铁路车辆生产计划"
 IRE_train_production_desc:0 "都柏林、科克与贝尔法斯特的机车厂与车厢厂转入战时生产。铁路局派员监造，钢材由供给部调拨，车辆交付后编入军用列车表。"
 IRE_tt_train_production_repeat:0 "可重复实施：每次交付 15 列火车，120 天后可再次执行。"
