 # ===== A 线外交环境事件 =====
 ire_nw.80.t:0 "国会山上的爱尔兰决议"
 ire_nw.80.d:0 "华盛顿就租借法案的适用范围展开辩论，爱尔兰是否列入受援名单成为争点。爱尔兰裔议员联合教会与工会向议员团递交请愿书，主张将爱尔兰纳入美国兵工厂；孤立派要求维持原案。众议院议长已将表决排入议程，请内阁示下。"
 ire_nw.80.a:0 "纳入租借体系"
 ire_nw.80.b:0 "维持侨民游说"
 ire_nw.80.c:0 "公开反对参战"
 IRE_tt_env_80a:0 "美国：战争支持 +5%、稳定 -5%，获得「爱尔兰裔游说团」一年；英国好感 +15；德国好感 -20；爱尔兰政治点数 +25。"
 IRE_tt_env_80b:0 "美国好感 +15、稳定 +5%；英国好感 +5；爱尔兰稳定 +5%。"
 IRE_tt_env_80c:0 "美国好感 -15、战争支持 -5%；德国好感 +15；爱尔兰稳定 +5%。"

 ire_nw.81.t:0 "英联邦的裂痕"
 ire_nw.81.d:0 "加拿大并入新世界爱尔兰后，渥太华易帜的消息传遍各自治领。澳大利亚、新西兰、南非与印度的议会相继要求伦敦说明其代表权依据，自治领事务部尚未作答。各地报馆把条约条文逐条刊出，总督府按惯例将文本转呈各邦。"
 ire_nw.81.a:0 "邀自治领承认新世界"
 ire_nw.81.b:0 "以贸易协定安抚伦敦"
 ire_nw.81.c:0 "资助自治领反殖民力量"
 IRE_tt_env_81a:0 "澳大利亚、新西兰、南非、印度好感 +20；英国若为民主政府好感 -15、稳定 -5%，若已黑英化则好感 -30、稳定 -5%；爱尔兰政治点数 +25。"
 IRE_tt_env_81b:0 "英国若为民主政府好感 +20；若已黑英化则好感 -20、稳定 -5%；自治领好感 +5；爱尔兰稳定 +5%。"
 IRE_tt_env_81c:0 "自治领好感 +30；英国若为民主政府好感 -30、稳定 -5%，若已黑英化则好感 -40、稳定 -5%；爱尔兰战争支持 +5%。"

 ire_nw.82.t:0 "自由法国的请求"
 ire_nw.82.d:0 "巴黎陷落后，自由法国使团抵达都柏林，请求使用香农机场与爱尔兰港口。柏林与伦敦都在注视都柏林的选择。外交部已将照会与使用条件列为节略，连同空军与港务两处的评估送交内阁，请内阁核定后示下。"
 ire_nw.82.a:0 "接纳自由法国使团"
 ire_nw.82.b:0 "只提供人道援助"
 ire_nw.82.c:0 "关闭国门"
 IRE_tt_env_82a:0 "法国好感 +30、战争支持 +5%，获得「法国的爱尔兰热」一年；英国若为民主政府好感 +10，若已黑英化则 -10；德国好感 -20；爱尔兰稳定 -5%。"
 IRE_tt_env_82b:0 "法国好感 +10；德国好感 +5；爱尔兰稳定 +5%。"
 IRE_tt_env_82c:0 "法国好感 -15；英国好感 -10；德国好感 +15；爱尔兰稳定 +5%。"

 ire_nw.83.t:0 "东线来信与柏林警告"
 ire_nw.83.d:0 "德国入侵苏联之后，莫斯科经中立渠道询问都柏林是否愿意派出医疗队与志愿人员。外交部把询问记录在案，暂未答复。柏林随即照会都柏林，警告不要越过界限，并称此举将影响两国间的谅解。内阁定于本周议及此事，两封照会一并列入议程。"
 ire_nw.83.a:0 "组织医疗队与志愿兵"
 ire_nw.83.b:0 "只送医疗物资"
 ire_nw.83.c:0 "严守中立立场"
 IRE_tt_env_83a:0 "苏联好感 +30、战争支持 +5%、人力 +5000；德国好感 -20；爱尔兰陆军经验 +25。"
 IRE_tt_env_83b:0 "苏联好感 +10；德国好感 -5；爱尔兰稳定 +5%。"
 IRE_tt_env_83c:0 "苏联好感 -10；德国好感 +5；爱尔兰稳定 +5%。"

 ire_nw.84.t:0 "白宫划定的红线"
 ire_nw.84.d:0 "美国参战后，白宫向都柏林递交照会，要求爱尔兰接受美国的安全保障；伦敦方面则敦促都柏林再进一步。外交部将两份照会并呈内阁，总理府拟就三份答复稿，议题已排入本周众议院议程，请示内阁择定，副本抄送驻华盛顿与驻伦敦代办。"
 ire_nw.84.a:0 "接受美国的安全保障"
 ire_nw.84.b:0 "以中立换取援助"
 ire_nw.84.c:0 "拒绝卷入大国战争"
 IRE_tt_env_84a:0 "美国好感 +20，并向爱尔兰提供安全保证；英国若为民主政府好感 +15，若已黑英化则 -15；德国好感 -20；爱尔兰稳定 +5%。"
 IRE_tt_env_84b:0 "美国好感 +15、稳定 +5%；爱尔兰政治点数 +25、稳定 +5%；不加入任何阵营。"
 IRE_tt_env_84c:0 "美国好感 -15；英国好感 -10；德国好感 +10；爱尔兰稳定 +5%、战争支持 +5%。"

 ire_nw.85.t:0 "战后的欧洲地图"
 ire_nw.85.d:0 "欧洲战事结束后，都柏林先后收到三份邀请：华盛顿与伦敦请爱尔兰加入大西洋安排，北欧与低地国家提议区域协作，莫斯科则提出互派使团。外交部将三份文书并列呈送内阁，请择一作答，答复期限定于本月底。"
 ire_nw.85.a:0 "推动凯尔特联邦"
 ire_nw.85.b:0 "加入大西洋阵营"
 ire_nw.85.c:0 "保持武装中立"
 IRE_tt_env_85a:0 "北欧与低地国家好感 +15；美国好感 +10；英国若为民主政府好感 +10，若已黑英化则 -10；爱尔兰稳定 +5%。"
 IRE_tt_env_85b:0 "美国好感 +20，并向爱尔兰提供安全保证；英国若为民主政府好感 +20，若已黑英化则 -20；德国好感 -10；爱尔兰稳定 +5%。"
 IRE_tt_env_85c:0 "美国、英国、苏联好感 -5；爱尔兰战争支持 +5%、稳定 +5%。"
 ire.10_success_tt:0 "§G公投通过！§!纽芬兰将并入爱尔兰。"
 ire.10_fail_tt:0 "§R公投失败。§!伦敦照会都柏林表示强烈不满（英国好感 -40，稳定度 -5%）。"
 IRE_european_hope:0 "欧洲希望"
 IRE_european_hope_desc:0 "不列颠沦陷后，都柏林收容各国流亡政府与抵抗组织代表，设立联合参谋处。工业、科研与外交资源按协议合并调配，盟国联络官常驻都柏林。"
 IRE_european_hope_us:0 "美国与欧洲希望"
 IRE_european_hope_us_desc:0 "华盛顿与都柏林签订合作协定，美方派技术团常驻，协助改建工厂与港口。燃料与设备经大西洋航线运入，工业标准按美方规范统一。"
 IRE_european_hope_france:0 "法兰西公社与欧洲希望"
 IRE_european_hope_france_desc:0 "法兰西公社拒绝加入共产国际，转而与都柏林订立合作条款。法军参谋与情报人员进驻联合参谋处，另一条战线由双方共同规划。"
 IRE_european_hope_dominions:0 "英联邦的残片"
 IRE_european_hope_dominions_desc:0 "加拿大、澳大利亚、新西兰、南非与印度先后脱离黑英的帝国体系，向都柏林派出使节。外交团在都柏林设常设办事处，合作条款分别签署。"
 IRE_european_hope_nordics:0 "北欧的伙伴"
 IRE_european_hope_nordics_desc:0 "北欧各国与都柏林维持外交与贸易渠道，不加入军事条款。外交部设北方事务科处理往来照会，商务代表按季会商，关税与航运事宜另立附件。"
 IRE_us_lend_lease:0 "美国租借"
 IRE_us_lend_lease_desc:0 "美国的机器、燃料与贷款经爱尔兰港口入境，由财政部登记分配。工厂按新设备重排工序，技术人员往来另立名册。还款与利息按协定条款逐年结算。"
 IRE_british_spy_network_idea:0 "不列颠内部网络"
 IRE_british_spy_network_idea_desc:0 "G2 与流亡情报人员在伦敦、利物浦与格拉斯哥重建联络网，为登陆与起事提供耳目。各站以商号为掩护，电台呼号按月更换。"
 IRE_royal_navy_defection_idea:0 "皇家海军的选择"
 IRE_royal_navy_defection_idea_desc:0 "不愿为黑英作战的皇家海军舰艇陆续挂上爱尔兰旗，驶入都柏林与科克的港口，编入联合舰队。舰员按原建制留用，军官重新宣誓。"
 IRE_raf_defection_idea:0 "皇家空军的倒戈"
 IRE_raf_defection_idea_desc:0 "皇家空军部分中队拒绝执行黑英的命令，携飞机与经验飞抵爱尔兰。人员由空军部登记，机体编入本土防空序列，识别标志另行涂改。"
 IRE_red_britain_uprising:0 "不列颠联盟起义"
 IRE_red_britain_uprising_desc:0 "法兰西公社与爱尔兰情报机关在不列颠境内策动起事，铁路与码头同时受阻。黑英被迫抽调本土守备部队镇压，其正面兵力因此减少。"
 IRE_ENG_navy_purge:0 "皇家海军清洗"
 IRE_ENG_navy_purge_desc:0 "黑英对皇家海军心存疑虑，大批军官与水兵被解职审查。舰队协同与登陆准备因此受损，港口的出航计划一再改动。新任舰长多由岸勤军官调任，交接仓促。"
 IRE_ENG_air_purge:0 "皇家空军清洗"
 IRE_ENG_air_purge_desc:0 "皇家空军中的保皇派与民主派被逐一整肃，中队指挥官频繁更换。防空值班与截击协同出现空档，机场警戒改由地方部队担任。"
 IRE_ENG_spy_chaos:0 "不列颠情报混乱"
 IRE_ENG_spy_chaos_desc:0 "黑英的情报机构遭渗透与清洗，档案被调走，联络员失踪。稳定、战争支持与反间谍工作同时受损，各站按新规程重新编组。"
 IRE_ENG_britain_crisis:0 "不列颠的裂痕"
 IRE_ENG_britain_crisis_desc:0 "罢工、街头冲突与议会僵局同时作用于英国。内阁失去议会多数，伦敦对各郡的控制减弱，与自治领的公文往来趋于停顿。财政部暂停部分地方拨款，铁路按军用时刻表运行。"
 IRE_european_hope_cat:0 "欧洲希望"
 IRE_invite_usa:0 "邀请美国加入欧洲希望"
 IRE_invite_usa_desc:0 "华盛顿准备支持都柏林。外交部提议把大西洋两岸的工业与海军编入同一联盟，条款交两国参谋部会商。两国海军将领已就指挥关系与基地使用交换意见。"
 IRE_invite_dominions:0 "邀请英联邦残片"
 IRE_invite_dominions_desc:0 "加拿大、澳大利亚、新西兰、南非与印度脱离黑英的帝国后，可加入都柏林的联盟。外交部已备妥入盟文本，候各国议会批准。"
 IRE_invite_nordics:0 "邀请北欧国家"
 IRE_invite_nordics_desc:0 "北欧国家在战争中保持中立。都柏林邀请其加入欧洲希望，换取资源、燃料与北方航线的通行安排，文本由外交部递交。各国议会批准后生效，文本存入外交部档案。"
 IRE_british_spy_network:0 "建立不列颠内部网络"
 IRE_british_spy_network_desc:0 "G2 将流亡者、码头工人与不满的黑英军官组织起来，建立覆盖不列颠的情报网。各站名单分卷保管，接头程序由副局长核定。"
 IRE_royal_navy_defection:0 "策动皇家海军叛离"
 IRE_royal_navy_defection_desc:0 "利用海军内部对黑英的不满，策动舰艇脱离英国编制，转挂爱尔兰旗。联络经海员工会与退役军官进行，接应港口事先安排。"
 IRE_raf_defection:0 "策动皇家空军倒戈"
 IRE_raf_defection_desc:0 "说服皇家空军中队携飞机与经验飞赴爱尔兰，以削弱黑英的防空。联络由 G2 经办，降落场与识别信号已预先约定，接应人员分驻各场。"
 IRE_red_london_uprising:0 "在伦敦点燃起义"
 IRE_red_london_uprising_desc:0 "法兰西公社与爱尔兰情报机关在不列颠本土策动起事，目标指向伦敦的要害部门。计划由两国参谋人员共同拟定，联络经第三方港口中转，起事后由本地委员会接管市政。"
 IRE_red_sabotage:0 "不列颠红色破坏"
 IRE_red_sabotage_desc:0 "铁路、港口与军工厂持续遭到破坏，运输时刻表反复被打乱。破坏小组由本地工人指引，器材经渔船运送，行动记录按月汇送都柏林。"
 IRE_tt_usa_joined:0 "美国被直接拉入爱尔兰主导的欧洲希望联盟，并获得美国工业/海军合作精神。"
 IRE_tt_invite_red_france:0 "法兰西公社退出原有阵营，加入爱尔兰主导的欧洲希望联盟，并获得法兰西公社合作精神。"
 IRE_tt_dominions_joined:0 "符合条件的英联邦国家加入联盟，并获得英联邦残片精神。"
 IRE_tt_nordics_joined:0 "符合条件的北欧国家加入联盟，并获得北欧伙伴精神。"
 IRE_tt_spy_network:0 "获得不列颠内部网络精神；黑英稳定/战争支持下降。"
 IRE_tt_navy_defection:0 "皇家海军约四分之一的舰艇转交爱尔兰；黑英海军协同与登陆准备下降。"
 IRE_tt_raf_defection:0 "获得皇家空军约四分之一的飞机与经验；黑英防空/空战能力下降。"
 IRE_tt_red_uprising:0 "在不列颠触发共产主义起义/内战，黑英被迫两线作战。"
 IRE_tt_red_sabotage:0 "黑英稳定、战争支持下降，不列颠各地抵抗上升。"
 ENG_black_britain:0 "法西斯不列颠"
 ENG_black_britain_DEF:0 "法西斯不列颠"
 ENG_black_britain_ADJ:0 "不列颠法西斯"
 POLITICS_ENG_BLACK_BRITAIN_MOSLEY_DESC:0 "奥斯瓦尔德·莫斯利，黑衫军的领袖，在伦敦的废墟上宣布不列颠的新秩序。"
 IRE_european_hope_alliance:0 "欧洲希望联盟"
 ire_nw.86.t:0 "帝国出现的裂缝"
 ire_nw.86.d:0 "北爱回归未久，伦敦的罢工自码头蔓延至矿区。议会中有人公开谈论难以治理，黑衫军传单已见于东区。唐宁街一概否认。外交部已将每日简报编册，驻伦敦代办奉命不作评论，只按周呈报罢工、集会与传单情形。"
 ire_nw.86.a:0 "公开表达关切"
 ire_nw.86.b:0 "视为伦敦内政"
 ire_nw.87.t:0 "黑衫军向伦敦进军"
 ire_nw.87.d:0 "莫斯利的追随者自各地向伦敦集中，警方在街垒前未采取行动。保守党内部分议员开始谈论应由强人主政，伦敦警察厅请求授权调动后备警力。内政部已拟维持秩序与接管要害部门的预案，请内阁裁定是否介入。"
 ire_nw.87.a:0 "秘密资助伦敦"
 ire_nw.87.b:0 "任其消耗英国"
 ire_nw.88.t:0 "唐宁街的沉默"
 ire_nw.88.d:0 "内阁连续三周未发表声明，国王取消公开行程，陆军将领拒绝接受采访。议会质询堆积在议程上，与自治领的电报往来亦见稀疏。驻伦敦代办报告，唐宁街各部的公文往返已明显放缓，各部次官多称等候上级指示，公开活动一律推迟。"
 ire_nw.88.a:0 "准备撤离侨民"
 ire_nw.88.b:0 "静观伦敦动向"
 ire_nw.89.t:0 "伦敦来的最后警告"
 ire_nw.89.d:0 "伦敦警察厅通报，法西斯民兵已取得武器，政变只在时日之间。都柏林能做的只剩等待第一声枪响，各部门按预案留守，档案封存，邮电与广播待命，驻伦敦的商务代表已接到留守通知。内政部请求授权与英方交换情报，请内阁示下。"
 ire_nw.89.a:0 "等待伦敦结局"
 ire_nw.90.t:0 "不列颠的十字路口"
 ire_nw.90.d:0 "数月的罢工、黑衫军游行与内阁瘫痪之后，伦敦的威信崩溃。法西斯民兵与保皇派在街头对峙，唐宁街请都柏林表态，黑衫军正等信号。伦敦的旧盟友被排除在这场内战之外，德国的志愿兵可能出现在黑衫军一侧。各项求援与边境报告已归档。"
 ire_nw.90.a:0 "保持距离，让帝国自行解决。"
 ire_nw.90.b:0 "秘密支援伦敦政府。"
 ire_nw.91.t:0 "都柏林的欧洲希望"
 ire_nw.91.d:0 "黑英的旗帜在伦敦升起，同盟国名存实亡。欧洲的民主政府、流亡人士与各自治领先后向都柏林派出代表，询问可否在此设立常驻机构。外交部已腾出两处馆舍接待，并着手拟定一份共同声明，文本交由各国代表传阅。"
 ire_nw.91.a:0 "出面领导欧洲"
 ire_nw.91.b:0 "先行整顿内部"
 ire_nw.91.c:0 "转投工业与科研"
 ire_nw.92.t:0 "罗斯福的来信"
 ire_nw.92.d:0 "华盛顿不再等待伦敦。罗斯福写来一封长信：美国准备把工业、燃料与海军借给都柏林，只要爱尔兰愿意成为大西洋的支点。外交部已将信件译本分发内阁，美方条件另附节略，请内阁审议后核定并即行答复。"
 ire_nw.92.a:0 "把美国工业纳入大西洋体系。"
 ire_nw.92.b:0 "接受美军顾问。"
 ire_nw.92.c:0 "先谈条件。"
 ire_nw.93.t:0 "法兰西公社的诞生"
 ire_nw.93.d:0 "黑英上台之后，巴黎的左右联盟彻底破裂。人民阵线在工厂区起事，法兰西公社宣告成立，法国内战由此爆发。都柏林收到驻巴黎公使的急电，内阁当晚开会，外交部另备一份各派兵力的备忘录，会议记录列为密件。"
 ire_nw.93.a:0 "公开支持法国人民阵线。"
 ire_nw.93.b:0 "秘密运送武器。"
 ire_nw.93.c:0 "与巴黎保持距离。"
 ire_nw.94.t:0 "伦敦城内的暗火"
 ire_nw.94.d:0 "不列颠内部网络发来信号：伦敦码头、苏格兰工厂与威尔士矿井同时停工，红色起义在黑英的心脏爆发。都柏林收到报告后召集联合参谋处会议，各港口进入戒备，情报按小时送交外交部。各军区保持戒备，铁路按军运时刻表调度，驻伦敦代办暂不公开表态。"
 ire_nw.94.a:0 "把起义变成第二战场"
 ire_nw.94.b:0 "派遣志愿人员"
 ire_nw.94.c:0 "保持低调"
 ire_nw.95.t:0 "皇家海军的选择"
 ire_nw.95.d:0 "一支不愿为黑英作战的分舰队驶离斯卡帕湾，在海上改挂爱尔兰旗，由爱尔兰引水员接引至科克。舰上军官联名递交声明，请求都柏林收容。伤病员已送科克医院，舰员名册一并报送海军部，泊位与补给均已备妥，请示内阁如何答复。"
 ire_nw.95.a:0 "接收舰队"
 ire_nw.95.b:0 "接收船队补给"
 ire_nw.95.c:0 "由水兵自择去留"
 ire_nw.96.t:0 "雾中的情报网络"
 ire_nw.96.d:0 "G2 的联络员在伦敦、利物浦与格拉斯哥建立据点，以船务代理与货运公司作掩护。黑英警察几次收网，抓到的人彼此相识，供词却指向同一批中间人。各站按周更换住址与呼号，名单只由都柏林的一处科组保管。"
 ire_nw.96.a:0 "扩大联络网络"
 ire_nw.96.b:0 "把情报送华盛顿"
 ire_nw.96.c:0 "保持静默待命"
 ire_nw.97.t:0 "法兰西公社加入欧洲希望"
 ire_nw.97.d:0 "法兰西公社派出代表团来到都柏林，欧洲希望由此成为跨越意识形态的联盟。代表团递交的议定书列明军事与经济合作条款，外交部已将其编入议程，另附各成员国意见与法律顾问签注，请内阁核定接纳方式。"
 ire_nw.97.a:0 "让巴黎坐到桌边。"
 ire_nw.97.b:0 "先谈军事合作。"
 ire_nw.97.c:0 "把联盟写进宪章。"
 ire_nw.98.t:0 "皇家空军的倒戈"
 ire_nw.98.d:0 "皇家空军的中队从林肯郡起飞，未去拦截德国轰炸机，而是转向西方。雷达站的值班员先报了航向，随后报了失踪。都柏林与伦敦同时收到消息，双方都在核对机号。海岸瞭望哨按规程上报，飞行员的姓名与番号须逐一登记。"
 ire_nw.98.a:0 "接纳来投的飞行员。"
 ire_nw.98.b:0 "接收所携飞机。"
 ire_nw.98.c:0 "由飞行员自行选择。"
 IRE_tt_red_uprising_conditions:0 "法兰西公社必须真正加入欧洲希望，德国已对爱尔兰宣战，且爱尔兰本土受到威胁（黑英对爱尔兰宣战，或本土核心州被占领）。"
 IRE_european_hope_britain:0 "不列颠联盟的友谊"
 IRE_european_hope_britain_desc:0 "不列颠联盟将皇家海军残余舰只、码头工会与情报网移交欧洲希望。联合参谋处接管舰艇编队，港口使用与情报交换另立协定。"
 ire_nw.99.t:0 "不列颠联盟加入欧洲希望"
 ire_nw.99.d:0 "不列颠联盟赢得内战后，伦敦的罢工委员会向都柏林派出代表团。欧洲希望同时拥有巴黎与伦敦，海峡由边界改为共同防线。外交部安排代表团与联合参谋处会谈，海军编制与港口使用另立附件，协定草案送交众议院审议。"
 ire_nw.99.a:0 "让皇家海军换旗"
 ire_nw.99.b:0 "把联盟写进宪章"
 ire_nw.99.c:0 "先行稳住伦敦"
 IRE_tt_european_major_war:0 "需欧洲大国之间爆发战争（不要求爱尔兰参战）。"
 IRE_wartime_laws_cat:0 "战时法案"
 IRE_wartime_war_economy:0 "转入战时经济"
 IRE_wartime_war_economy_desc:0 "战时联合政府以紧急立法程序将战时经济法案提交众议院，免去通常的战争支持度审议。法案授权内阁征用产能、管制物价、调拨原料，财政部执行细则同日下发。"
 IRE_wartime_total_economy:0 "全面经济动员"
 IRE_wartime_total_economy_desc:0 "全国工业按军需次序重排，民用生产压缩至维持水平，铁路、港口与船坞由国防部统一调度。军需官驻厂核算产出，报表按周汇总。"
 IRE_wartime_service:0 "实行义务兵役"
 IRE_wartime_service_desc:0 "众议院通过义务兵役法，适龄男子依户籍造册征召，缓征与免除由地方委员会审定。征兵事务交国防部新设的兵役局办理，名册分送各军区。"
 IRE_wartime_all_adults:0 "全民服役"
 IRE_wartime_all_adults_desc:0 "征召范围扩至全部成年人口，男女均须登记服役，岗位依军需与民需次序分派。兵役局在各地增设登记处，拒登者的处理办法另行公布。"
 IRE_wartime_scraping:0 "刮桶底"
 IRE_wartime_scraping_desc:0 "最后的人力投入战争：凡未列入缓征名册者一律征召，劳役与军工岗位同步扩编。兵役局停办自愿报名，改按户籍逐户征发。"
 ire_nw.130.t:0 "阿勃维尔的爱尔兰之门"
 ire_nw.130.d:0 "一名中立国外交官将柏林的口信带到都柏林：德国情报机关希望就海运情报与爱尔兰方面接触。信使在利菲河畔的旅馆等候，随身带一张标注航线的海图。口信已抄录归档，内政部与G2各存副本一份，请内阁示下。"
 ire_nw.130.a:0 "听取来意"
 ire_nw.130.b:0 "逮捕并通知伦敦"
 ire_nw.130.c:0 "移交G2处置"
 ire_nw.131.t:0 "凯瑟琳计划案"
 ire_nw.131.d:0 "阿勃维尔的计划十分直接：借用爱尔兰的港口与旧部，为进攻英国开一处后门。信使在都柏林递交清单，要求港口使用权、无线电操作员与不问来路的沉默。外交部与国防部各留一份副本，答复期限由信使口头指定。"
 ire_nw.131.a:0 "接受这批武器"
 ire_nw.131.b:0 "不介入这场战争"
 ire_nw.131.c:0 "收下武器后举报"
 ire_nw.132.t:0 "阿勃维尔网络暴露"
 ire_nw.132.d:0 "阿勃维尔在爱尔兰的网络被伦敦与华盛顿同时盯上。报纸开始追问都柏林的沉默，唐宁街要求一个解释。外交部与特别分局各自备好一份说明，两份文件口径不一，内阁须先裁定对外答复。涉事人员已被传唤问话。"
 ire_nw.132.a:0 "否认一切。"
 ire_nw.132.b:0 "承认并道歉。"
 ire_nw.133.t:0 "一场无声的谅解"
 ire_nw.133.d:0 "都柏林把阿勃维尔的信使与计划交了出去。伦敦与华盛顿没有公开道谢，情报渠道却已对爱尔兰开了一条缝。G2 已把交接经过与对方回执编成卷宗，副本存外交部，原本留情报处备查，另抄一份送总理府。"
 ire_nw.133.a:0 "保持沉默。"
 ire_nw.133.b:0 "把情报分享给华盛顿。"
 ire_nw.133.c:0 "向伦敦要点回报。"
 IRE_abwher_network:0 "阿勃维尔的爱尔兰网络"
 IRE_abwher_network_desc:0 "德国情报机关在爱尔兰的联络网由电台、信使与一批旧部组成，由阿勃维尔派驻人员掌握。经费与器材按季度拨付，名单不入档案。"
 IRE_abwher_exposed:0 "阿勃维尔丑闻"
 IRE_abwher_exposed_desc:0 "德国网络被曝光，报馆刊出电台位置与人员姓名。都柏林的沉默成了伦敦与华盛顿质询的题目，外交部须逐条答复。涉案人员的处置由宪兵队与法院分别办理。"
 IRE_covert_cat:0 "秘密行动"
 IRE_abwher_arms_run:0 "接收阿勃维尔的军火"
 IRE_abwher_arms_run_desc:0 "海军与 G2 协同接收德国网络运来的步兵武器与火炮，航线逐段记录，卸货由宪兵队警戒。每次接运都增加暴露的机会，参谋部按风险排定次序。"
 IRE_invite_red_france:0 "邀请法兰西公社加入"
 IRE_invite_red_france_desc:0 "都柏林向法兰西公社发出加入欧洲希望的邀请，附港口使用与军需互助条款。外交部经中立国代办递送文本，等候巴黎答复。"
 ire_nw.134.t:0 "自由国家响应都柏林"
 ire_nw.134.d:0 "德国的战事向外蔓延，一批受到威胁的政府将目光转向都柏林。欧洲希望不再只是爱尔兰一国的联盟。外交部收到多份照会，联合参谋处着手编列各国兵力与物资清单，请示内阁如何接纳。外交部按国别编列照会次序。"
 ire_nw.134.a:0 "予以接纳"
 ire_nw.134.b:0 "先议军事合作"
 IRE_german_last_stand:0 "德国的最后动员"
 IRE_german_last_stand_desc:0 "德国在四面受敌时进行全国动员。后备军按军区征召，工厂转产军械，运输与配给统由战时经济处调度，民用生产按清单压缩。"
 ire_nw.135.t:0 "华盛顿与黑旗"
 ire_nw.135.d:0 "黑英上台之后，华盛顿一时难以断定伦敦究竟是敌是友。白宫经非正式渠道向都柏林询问爱尔兰的立场，问话由驻华盛顿公使带回。外交部拟就数份答复稿，均未发出。内阁尚未定夺，稿本存于条约司。稿本另抄一份送总理府。"
 ire_nw.135.a:0 "向华盛顿靠拢。"
 ire_nw.135.b:0 "承认伦敦新政府。"
 ire_nw.135.c:0 "暂不表明立场。"
 ire_nw.136.t:0 "自治领的选择"
 ire_nw.136.d:0 "加拿大、澳大利亚、新西兰、南非与印度均在观察伦敦的新政府。对其中数国而言，都柏林比伦敦更适合作民主伙伴。外交部向各自治领发出照会，邀请派代表来都柏林商谈，答复由总督转呈伦敦。外交部另备说帖一份，供内阁参阅。"
 ire_nw.136.a:0 "向自治领敞开大门"
 ire_nw.136.b:0 "由它们自行决定"
 ire_nw.136.c:0 "施压要求与伦敦决裂"
 ire_nw.137.t:0 "法兰西公社与自由法国"
 ire_nw.137.d:0 "法兰西公社加入欧洲希望后，自由法国与华盛顿都在注视都柏林。外交部已将两份承认文本并陈内阁：一份致巴黎的公社政府，一份仍循自由法国渠道。答复一经议定，即由驻巴黎与驻华盛顿两处使团分头送达，副本送众议院外交委员会。"
 ire_nw.137.a:0 "承认法兰西公社"
 ire_nw.137.b:0 "保留自由法国渠道"
 ire_nw.137.c:0 "暂缓表态，听其自决"
 ire_nw.138.t:0 "莫斯科的目光"
 ire_nw.138.d:0 "不列颠联盟加入欧洲希望后，莫斯科首次向都柏林正式接触。苏联既是德国的交战方，也与西方民主国家存有分歧，照会由驻伦敦使馆代为传递。外交部建议先设非正式渠道，请示内阁核定口径，苏方要求答复以书面送达。"
 ire_nw.138.a:0 "开通务实渠道"
 ire_nw.138.b:0 "保持距离"
 ire_nw.138.c:0 "邀请苏联观察员"
 ire_nw.139.t:0 "联合派的疑虑"
 ire_nw.139.d:0 "北爱回归后，联合派领袖与地方工会未上街头，只在各自会所集会，并派代表探询新政府的席位安排。都柏林尚未给出答复。内阁已把地方行政、警政与教育三项议题列入日程，答复稿由总理府起草，候内阁决定。"
 ire_nw.139.a:0 "给联合派席位"
 ire_nw.139.b:0 "以行政命令推行"
 ire_nw.139.c:0 "交由 IRA 处理"
 ire_nw.140.t:0 "老 IRA 的去向"
 ire_nw.140.d:0 "IRA 的老兵不接受都柏林与伦敦的妥协。他们要求在新国家中取得位置，否则将自行行动。内务部已把各地支部的集会与武器清点情况列成清单，连同特别分局的意见送交内阁，请内阁裁定处置办法。"
 ire_nw.140.a:0 "把他们编入国家军。"
 ire_nw.140.b:0 "设特别法庭并拘禁。"
 ire_nw.140.c:0 "派他们对付黑英。"
 ire_nw.140.e:0 "暂不处置他们。"
 ire_nw.141.t:0 "主教与红色盟友"
 ire_nw.141.d:0 "法兰西公社与不列颠联盟加入欧洲希望后，主教团与爱尔兰裔美国报纸公开表示不安。都柏林须答复：共和国与红色盟友的关系究竟如何。外交部与宣传处已分别拟好声明稿，送内阁择定口径，声明于众议院复会后发布。"
 ire_nw.141.a:0 "安抚教会。"
 ire_nw.141.b:0 "宣布共和国世俗。"
 ire_nw.141.c:0 "两边都不得罪。"

 # ===== 爱尔兰民族联盟：联合政府 =====
 IRE_national_union_cat:0 "民族团结政府"
 IRE_national_union_government:0 "民族团结政府"
 IRE_national_union_government_desc:0 "四派依协议组成联合政府，各部席位按党派比例分配。内阁设常设委员会协调分歧，对外政策由总理府统一发布，议会党团按周会商。"
 IRE_nu_ui_header:0 "民族团结政府 · 四派平衡"
 IRE_nu_ui_parliament:0 "议会派"
 IRE_nu_ui_labour:0 "工人派"
