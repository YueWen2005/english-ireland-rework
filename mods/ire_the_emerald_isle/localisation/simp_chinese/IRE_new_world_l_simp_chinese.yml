 # ===== 民族联盟：动态精神 =====
 IRE_nu_british_funding_spirit:0 "伦敦的支票"
 IRE_nu_british_funding_spirit_desc:0 "伦敦的资金经旧网络流入联合派与部分议员，账目由特别分局掌握，街头的信任则无从挽回，报告列为密件。财政部按季核对汇入款项。"
 IRE_nu_soviet_advisors_spirit:0 "莫斯科顾问"
 IRE_nu_soviet_advisors_spirit_desc:0 "苏联军事与情报顾问进驻爱尔兰，训练与情报工作随即展开，内阁的政治空间相应收窄，往来文件另立专卷。顾问的住所与行程由特别分局掌握。"
 IRE_nu_american_loan_spirit:0 "美国贷款"
 IRE_nu_american_loan_spirit_desc:0 "美国贷款与工业品陆续到港，工厂重新开工，消费品供应由供应部统一调配，配给名册按月修订。贷款用途由财政部逐项登记，按季报内阁。"
 IRE_nu_german_arms_spirit:0 "柏林军火"
 IRE_nu_german_arms_spirit_desc:0 "德国情报网络送来的武器与训练进入共和军，交接由专人办理，曝光之虞始终未除，名册分处存放。交接地点每次更换，由特别分局安排。"
 IRE_nu_vatican_pressure_spirit:0 "罗马牧函"
 IRE_nu_vatican_pressure_spirit_desc:0 "主教团与罗马的公开支持稳住了部分保守选民，政府为此付出的政治代价记在账上，教区通讯逐周汇总。主教团的声明文本存于外交部。"
 IRE_nu_foreign_volunteers_spirit:0 "国际主义志愿军"
 IRE_nu_foreign_volunteers_spirit_desc:0 "工会与共和军的志愿网络把爱尔兰人送上海外战场，名册由动员官保管，国内的不安随之加剧，报告送内阁。出发名册由动员官封存。"
 IRE_nu_border_campaign_spirit:0 "边境战役"
 IRE_nu_border_campaign_spirit_desc:0 "共和军在边境另一侧展开行动，战报经特别分局转呈国防部，外交上的风险一并计入，照会往来另册登记。每次行动之后须补交书面报告。"
 IRE_nu_emergency_powers_spirit:0 "紧急权力"
 IRE_nu_emergency_powers_spirit_desc:0 "特别分局与军队依紧急权力法行事，拘押与搜查事后补办手续，秩序恢复的代价由财政部承担，卷宗封存。紧急权力按季提请众议院续期。"
 IRE_nu_political_scandal_spirit:0 "政治丑闻"
 IRE_nu_political_scandal_spirit_desc:0 "秘密行动被报纸揭露，联合政府的信誉受损，质询与调查同时压向内阁，涉事人员先行停职听候处理。调查委员会的名单由众议院议长提名。"

 # ===== 民族联盟：外部干涉事件 170–175 =====
 ire_nw.170.t:0 "伦敦开出的支票"
 ire_nw.170.d_dem:0 "威斯敏斯特的旧网络没有消失。联合派议员、都柏林商人和英国情报人员在同一间会客室里出现；伦敦愿意为“稳定”付钱。"
 ire_nw.170.d_black:0 "黑衫伦敦的密使带着钱和威胁来到都柏林。他们不要求爱尔兰改旗，只要求联合政府里有人替伦敦说话。"
 ire_nw.170.d_red:0 "红色伦敦的工会代表团提出“兄弟般的援助”：资金、报纸和顾问。但接受这笔钱，等于让伦敦在联合政府里拥有一个席位。"
 ire_nw.170.d:0 "英国驻都柏林使馆的旧关系重新活跃。资金、报纸与人情同时涌向联合派与部分议员。特别分局已把往来账目与经手人列成清单，连同使馆人员的活动记录送内阁，请内阁裁定是否放行，逾期即按默认处理。"
 ire_nw.170.a:0 "接受资金。"
 ire_nw.170.a_tt:0 "联合派信心 +8，议会影响力 +4，共和军影响力 −4，稳定度 −5%；英国好感 +20；获得 365 天“伦敦的支票”。"
 ire_nw.170.b:0 "拒绝并公开。"
 ire_nw.170.b_tt:0 "联合派信心 −4；英国好感 −20；稳定度 +5%，政治点数 +25。"
 ire_nw.170.c:0 "秘密调查。"
 ire_nw.170.c_tt:0 "安全影响力 +5，政治点数 −25；调查结果不确定：50% 额外安全 +3，50% 英国好感 −10。"

 ire_nw.171.t:0 "莫斯科的同志"
 ire_nw.171.d_red:0 "莫斯科把爱尔兰视为红色集团在西欧的潜在支点。苏联顾问、工会联络员和情报人员同时抵达都柏林，提出“无私的兄弟援助”。"
 ire_nw.171.d:0 "苏联大使馆的文化参赞带来一批工会朋友。他们不谈意识形态，只谈顾问、训练与报纸。外交部礼宾司按惯例接待，特别分局把来访者的姓名与住址逐一登记。都柏林知道这与莫斯科有关，内阁尚未接见。"
 ire_nw.171.a:0 "接受苏联顾问。"
 ire_nw.171.a_tt:0 "工人影响力 +6，共和军影响力 +4，教会信心 −5，联合派信心 −5，稳定度 −5%；苏联好感 +30；获得 365 天“莫斯科顾问”。"
 ire_nw.171.b:0 "限制其活动。"
