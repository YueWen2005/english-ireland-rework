l_simp_chinese:
 # ===== A 线新世界爱尔兰：国策 =====
 IRE_A_home_development:0 "国土开发委员会"
 IRE_A_home_development_desc:0 "香农河的水力、中部的泥炭与南部的深水港原分属各部。内阁已设全国开发委员会，统一勘察、发电与输电，工程分段发包，进度月报呈都柏林。"
 IRE_A_mineral_survey:0 "全国矿产勘探"
 IRE_A_mineral_survey_desc:0 "地质调查所已派队进入康诺特与蒙斯特，钻探煤、铁与钨矿。岩芯与储量估算编入报告，采矿权按县登记，交工业部核发，租约年限另定。"
 IRE_A_infrastructure_programme:0 "全国基础设施计划"
 IRE_A_infrastructure_programme_desc:0 "公路、铁路、电站与香农机场同时开工，由公共工程部总揽。路段与工期分县排定，承包商名册与验收标准一并公布，进度按月呈报。"
 IRE_A_world_congress:0 "世界爱尔兰大会"
 IRE_A_world_congress_desc:0 "从波士顿到布宜诺斯艾利斯，从利物浦到巴黎，爱尔兰裔代表首次同席。议程只有一项：是否设常设机构，统一处置侨汇、宣传与选举。会议记录已送外交部归档。"
 IRE_A_green_dollar:0 "绿色美元"
 IRE_A_green_dollar_desc:0 "侨汇已不只是汇款单。财政部与纽约、波士顿的银行谈妥清算安排，此款可直接投于工厂、码头与债券。出资人现要求派代表列席监事会。"
 IRE_A_wild_geese_legion:0 "野鹅军团"
 IRE_A_wild_geese_legion_desc:0 "野鹅的后代带着军事经验返乡，其中不少曾在西班牙、法国及他国内战中服役。国防部已将他们编成远征部队，按正规军标准发饷配装。"
 IRE_A_spanish_volunteers:0 "野鹅远征军"
 IRE_A_spanish_volunteers_desc:0 "佛朗哥的起事把西班牙撕成两半。内阁决定不派正规军，仅由外交部发放护照、租定舱位，野鹅后代以志愿者名义渡海。归国者由总参谋部逐人登录。"
 IRE_A_canada_independence:0 "策动加拿大独立"
 IRE_A_canada_independence_desc:0 "威斯敏斯特法案给了自治领纸面上的主权，伦敦宣战则加拿大仍自动参战。都柏林驻渥太华代办频繁出入国会山，所谈为一份把加拿大带出帝国战场的法案。"
 IRE_A_atlantic_fleet:0 "大西洋舰队"
 IRE_A_atlantic_fleet_desc:0 "从纽芬兰到科克，一支小型舰队开始为大西洋航线护航。舰只不多，但港口、船期与航线均由海军部自定，不再经伦敦海军部核准。"
 IRE_A_air_bridge:0 "跨大西洋空桥"
 IRE_A_air_bridge_desc:0 "香农机场已定为跨大西洋航线的中继站。战斗机、巡逻机与邮件同场起降，加油与检修由机场管理局承办，航班表报航空部备案。"
 IRE_A_irish_question:0 "爱尔兰问题"
 IRE_A_irish_question_desc:0 "利物浦、格拉斯哥与伦敦的爱尔兰人已使威斯敏斯特难以安枕。选区、工会与报纸同问一事：帝国对爱尔兰的安排还要维持多久。外交部已收集剪报编为专卷。"
 IRE_A_tammany_hall:0 "坦慕尼协会"
 IRE_A_tammany_hall_desc:0 "波士顿与纽约的爱尔兰裔政治机器首次为旧大陆的故乡运转。他们能动员选票、影响拨款，也能使华盛顿在爱尔兰问题上多所措意。外交部已与之互通消息。"
 IRE_A_wild_geese_paris:0 "巴黎的野鹅"
 IRE_A_wild_geese_paris_desc:0 "法国未忘为其作战的爱尔兰人。巴黎的沙龙里又提起野鹅之名。外交部已派参赞常驻，与旧部后裔及退役军官往来，登记愿赴爱尔兰服务者。"
 IRE_A_green_international:0 "绿色国际"
 IRE_A_green_international_desc:0 "散居各大国的爱尔兰人已有统一的政治声音。该机构不设主席，只设轮值书记处；它不指挥任何人，各国政府却已开始留意其公告。章程抄本存外交部。"
 IRE_A_atlantic_charter:0 "大西洋宪章"
 IRE_A_atlantic_charter_desc:0 "此非帝国，而为联邦：大西洋两岸的爱尔兰人以一部宪章相联结。签字国互不侵犯，一方受攻时不予坐视。华盛顿与巴黎均在观望其能否兑现。"
 IRE_A_new_world_expedition:0 "新世界远征"
 IRE_A_new_world_expedition_desc:0 "内阁已核准远征方案：部队在大西洋两岸集结，舰队于科克加煤。作战目标与登陆序列由总参谋部拟定，命令已下达各军区。"
 IRE_A_canada_annex:0 "归并加拿大"
 IRE_A_canada_annex_desc:0 "渥太华已脱离伦敦，尚未归入都柏林。众议院将通过法案，军队向北开进，英属北美遂为新世界爱尔兰的西半部。此后两岸海岸均由海军部设防。"
 IRE_A_new_world_ireland:0 "新世界爱尔兰"
 IRE_A_new_world_ireland_desc:0 "加拿大各省不作殖民地，而为民族疆域的一部。自纽芬兰至不列颠哥伦比亚，各省在众议院各有席位，亦各有陈情。都柏林此后须同时应付两个大陆的政务。"
 IRE_A_nordic_bridge:0 "北方桥梁"
 IRE_A_nordic_bridge_desc:0 "北欧小国眼看列强分割欧洲。都柏林可予伦敦与柏林所不能予者：一个在波罗的海并无领土野心的伙伴。斯德哥尔摩先派观察员，奥斯陆与哥本哈根随后。"
 IRE_A_nordic_alliance:0 "新世界联盟"
 IRE_A_nordic_alliance_desc:0 "都柏林发起北方小国联盟，盟约由各国外交部换文生效。友好国家即时入盟，其余国家先取得爱尔兰的安全保证，待条件成熟再议。"

 # ===== 新世界爱尔兰：精神 =====
 IRE_home_development:0 "国家开发委员会"
 IRE_home_development_desc:0 "国家主导的工业化计划分作三路：建筑队修路建厂，地质队勘测泥炭与矿产，电力工程师架设输电网。进度由经济委员会按月核对。"
 IRE_diaspora_bond_drive:0 "侨民公债"
 IRE_diaspora_bond_drive_desc:0 "海外爱尔兰裔认购的公债已进入财政部账目，募得款项按工程次序拨付，工厂与港口的合同据此签订，债券存根由发行处保管。"
 IRE_world_congress:0 "世界爱尔兰大会"
 IRE_world_congress_desc:0 "海外代表按年聚会于都柏林，宣传、募捐与志愿兵三项分设委员会，议定事项由外交部与侨务司分头执行。会议记录分送各支部与驻外使团。"
 IRE_green_dollar:0 "绿色美元"
 IRE_green_dollar_desc:0 "侨汇经银行与邮政汇兑进入爱尔兰，财政部设专户登记。投资款项由工业发展局接洽，贸易结算通过伦敦与纽约的代理行办理。"
 IRE_wild_geese_legion:0 "野鹅军团"
 IRE_wild_geese_legion_desc:0 "流散军人的后代回国入伍，随身带来父辈的勋章、战地笔记与旧部名册。国防部将他们编为独立营，由归国军官统带，另设档案室保存证件。"
 IRE_spanish_volunteers:0 "野鹅志愿军"
 IRE_spanish_volunteers_desc:0 "来自爱尔兰与美洲的野鹅后裔在西班牙并肩作战。都柏林可把更多志愿师派往海外，招募与输送由国防部办理，名册按月汇送。"
 IRE_british_north_america:0 "英属北美归并"
 IRE_british_north_america_desc:0 "加拿大自治领并入新世界爱尔兰。圣劳伦斯河与五大湖的工厂和人力转而为都柏林服务，各省产业报表并入内阁统计，税则一体适用。"
 IRE_atlantic_fleet:0 "大西洋舰队"
 IRE_atlantic_fleet_desc:0 "一支以护航与破交为核心的小型海军。舰艇按支队编成，基地分设科克与戈尔韦，岸台与油料库同时修建。巡航与训练计划由海军参谋处排定。"
 IRE_air_bridge:0 "跨大西洋空桥"
 IRE_air_bridge_desc:0 "香农—纽芬兰—波士顿的空中走廊。航班、加油与检修由航空部统一编排，中转旅客与邮件同场办理，备降场与气象通报另册列明。"
 IRE_green_international:0 "绿色国际"
 IRE_green_international_desc:0 "爱尔兰裔政治团体在英国、美国与自治领设立分支，由外交部与侨民事务处联络。各地代表按年集会，决议送交都柏林备案。"
 IRE_atlantic_charter:0 "大西洋宪章"
 IRE_atlantic_charter_desc:0 "大西洋两岸的爱尔兰人共同签署政治宪章。签署仪式在都柏林举行，文本分送各侨民团体，签署人名单另行刊布。批准书由外交部归档，副本送众议院。"
 IRE_atlantic_emergency:0 "大西洋防卫体制"
 IRE_atlantic_emergency_desc:0 "战争烧到大西洋后，都柏林把本土防卫、海岸警戒与全国动员纳入同一套紧急体制。紧急状态令经众议院通过，各郡设执行委员会，进度按月上报内阁。"
 IRE_new_world_expedition:0 "新世界远征"
 IRE_new_world_expedition_desc:0 "爱尔兰的远征部队按新编制组建，海运与补给由海军统筹，集结港口设在科布与戈尔韦，出发日期待内阁核定。海运舱位由海军部按航次分配。"
 IRE_eng_irish_question:0 "爱尔兰问题"
 IRE_eng_irish_question_desc:0 "英国政府发现，爱尔兰裔工人与选民已不再沉默。工党议员在选区会议上提出自治问题，地方报纸把演说全文登出。选区协会开始登记爱尔兰裔选民的名册。"
 IRE_eng_dock_strike:0 "议会与工会的联合施压"
 IRE_eng_dock_strike_desc:0 "工党议员、工会代表团与地方报纸协同行动，以质询、请愿与头条消耗唐宁街的政治资本。码头工会按分会布置纠察。船东公会向劳工部提出仲裁请求，未获答复。"
 IRE_eng_ira_campaign:0 "工党与自由派的联合阵线"
 IRE_eng_ira_campaign_desc:0 "工党、自由派与工会媒体结成统一阵线，在议会与选区持续质询伦敦的战争说法。各报以文件与证词对照官方公报，逐条列出出入。"
 IRE_usa_irish_lobby:0 "爱尔兰裔游说团"
 IRE_usa_irish_lobby_desc:0 "在华盛顿的走廊与委员会听证室里，爱尔兰裔议员为旧大陆陈情，教会与工会分头游说，经费由侨界自筹。捐款与名册经波士顿转交都柏林。"
 IRE_fra_irish_sympathy:0 "法国的爱尔兰热"
 IRE_fra_irish_sympathy_desc:0 "巴黎报界连篇报道爱尔兰的处境。外交部收集剪报送交新闻局，驻法使馆按周报告舆情，法方议员亦在议会提出询问。新闻局据此编印对外简报。"

 # ===== 新世界爱尔兰：决议分类 =====
 IRE_home_cat:0 "本土开发"
 IRE_congress_cat:0 "世界爱尔兰大会"
 IRE_interference_cat:0 "海外民主联络"
 IRE_nordic_cat:0 "北方事务"

 # ===== 本土开发决议 =====
 IRE_dev_leinster:0 "开发伦斯特工业带"
 IRE_dev_leinster_desc:0 "都柏林、韦克斯福德与塔拉莫尔的工厂与铁路一并铺设。工程分段发包，选址由工商部会同郡政厅核定，征地与拆迁同时办理。进度按季报内阁。"
 IRE_dev_munster:0 "开发蒙斯特与科克港"
 IRE_dev_munster_desc:0 "科克港的船坞与铁路把南方的农产品运出。疏浚、仓储与支线同时施工，招标章程由工商部颁行，承包合同经财政部复核。工程进度按季上报。"
 IRE_dev_connaught:0 "开发康诺特与香农"
 IRE_dev_connaught_desc:0 "香农河的水电、机场与工业园同时开办。电站由电力供应委员会承建，园区地块划拨与厂房设计经工商部核准，道路与供水一并敷设。进度按季报内阁。"
 IRE_national_mining:0 "全国矿脉勘察"
 IRE_national_mining_desc:0 "地质调查所完成全国矿藏测绘，煤、铁与钨的分布写入报告。采矿许可由工商部核发，勘探队按区域轮换作业，成果存于地质档案。"
 IRE_national_research:0 "国立研究院"
 IRE_national_research_desc:0 "教育部向都柏林大学与香农实验室增拨经费，国立研究院扩充编制。研究计划由学术委员会审定，设备采购经财政部核准，成果年报公开刊行。"

 # ===== 海外大会决议 =====
 IRE_diaspora_bonds:0 "发行侨民公债"
 IRE_diaspora_bonds_desc:0 "财政部向波士顿、纽约与布宜诺斯艾利斯的爱尔兰裔社区发行公债，承销由当地侨社代理，认购名册与款项一并报回都柏林。"
 IRE_call_wild_geese:0 "征召野鹅"
 IRE_call_wild_geese_desc:0 "在美洲的爱尔兰裔社区设点募兵，由教会与侨团协助登记。应募者按年龄与经历分类，旅费由募集款项支付，抵爱后编入训练营。"
 IRE_request_us_surplus:0 "美国剩余物资"
 IRE_request_us_surplus_desc:0 "华盛顿愿意把多余的装备卖给都柏林。清单由美方开出，价格与交付期另议，验收在港口办理，不合格者退回。付款经财政部核准后汇出。"
 IRE_atlantic_escort:0 "大西洋护航"
 IRE_atlantic_escort_desc:0 "为跨大西洋航线增派运输船与护航舰。船团编组由海运处办理，护航交接按航段排定，落水船员由就近舰艇救捞。舰员补充与检修报海军参谋处。"
 IRE_ferry_command:0 "渡运司令部"
 IRE_ferry_command_desc:0 "香农机场的跨大西洋渡运中队。机体与机组由空军部调派，渡运路线与备降场已列入航行通告，损耗与补充按月呈报，机组轮换另行造册。"
 IRE_green_international_congress:0 "召开绿色国际大会"
 IRE_green_international_congress_desc:0 "英、美、法的爱尔兰裔代表应邀到都柏林开会，通过共同声明。会务由侨民事务处承办，代表名单事先经内阁核准，会后按国别设立常设联络人。"

 # ===== 干涉决议 =====
 IRE_liverpool_strike:0 "议会与工会施压"
 IRE_liverpool_strike_desc:0 "工党议员在众议院提出质询，工会代表团赴唐宁街递送请愿书，地方报纸连日刊出社论。三路并进，唐宁街收到的函件逐日增多。"
 IRE_ira_infiltration:0 "英国民主派联络"
 IRE_ira_infiltration_desc:0 "爱尔兰外交官与 G2 在英国工党、自由派和工会圈子里建立安静的联络渠道。"
 IRE_american_volunteers:0 "美国志愿兵"
 IRE_american_volunteers_desc:0 "波士顿与芝加哥的爱尔兰裔青年报名赴爱尔兰服役，由当地社团组织体检与航运，路费先行垫付，抵埠后编入训练营，名单送国防部。"
 IRE_green_vote:0 "绿色选票"
 IRE_green_vote_desc:0 "侨民社团在美国选举中动员爱尔兰裔选民，向两党候选人递交备忘录。外交部不公开介入，领事馆按惯例报告各地舆情。，侨民事务处汇总备查。"
 IRE_french_arms:0 "法国军援"
 IRE_french_arms_desc:0 "巴黎的军火库向都柏林开放。国防部派员验收装备，运输经海路办理，交货清单存入军械署，货款以出口信贷冲抵。验收报告由军械署归档。"
 IRE_irish_brigade:0 "爱尔兰旅"
 IRE_irish_brigade_desc:0 "以野鹅之名，在法国组建一支爱尔兰志愿旅。招募站设于巴黎与都柏林，名册由两地分别保管，装备由法方供给，训练在法国境内进行。"

 # ===== 事件 ire.70 =====
 ire.70.t:0 "绿色国际的成立"
 ire.70.d:0 "都柏林城堡大厅内，利物浦、波士顿、纽约、巴黎与布宜诺斯艾利斯的代表首次同席。无王冠，无帝国，只有一纸文书，其上写着同一句话：爱尔兰不再是一岛之事。章程已由各团签署，书记处暂设都柏林。"
 ire.70.a:0 "在各大洲设立分会"

