 # ===== 北欧决议 =====
 IRE_nordic_aid:0 "北欧援助包"
 IRE_nordic_aid_desc:0 "向北欧各民主国运送粮食、煤炭与医疗物资，由外交部与红十字会共同经手。船期按季度排定，受援国的答谢文电存于档案。"
 IRE_invite_sweden:0 "邀请瑞典"
 IRE_invite_sweden_desc:0 "瑞典不愿卷入列强战争，但由都柏林领导的北方联盟另当别论。外交部备妥一份备忘录，列明共同防务与贸易安排。文本由驻斯德哥尔摩公使馆递交，答复期限另议。"
 IRE_invite_norway:0 "邀请挪威"
 IRE_invite_norway_desc:0 "挪威的商船队与漫长的大西洋海岸，可使联盟的航程远远超出波罗的海。外交部拟具邀请文本，附港口互助条款。文本由驻奥斯陆公使馆递交，条款可分批议定。"
 IRE_invite_denmark:0 "邀请丹麦"
 IRE_invite_denmark_desc:0 "哥本哈根掌握波罗的海的门户。外交部备妥邀请文件，附共同航行与海峡通行的谅解条款，候丹麦答复。文本由驻哥本哈根公使馆递交，海峡通行另附议定书。"
 IRE_invite_finland:0 "邀请芬兰"
 IRE_invite_finland_desc:0 "赫尔辛基对东方局势自有判断。爱尔兰提出安全保证，条件由外交部与国防部共同拟定，文本送交芬兰公使馆。保证范围限于领土与领空，期限另议。"
 # ==================== A 线事件包（ire_nw） ====================
 ire_nw.1.t:0 "阿斯隆的广播演说"
 ire_nw.1.d:0 "阿斯隆新发射台的脚手架尚未拆尽，德瓦莱拉已立于麦克风前。他未提战争，未提英国，亦未提边界。所讲者为三十二郡共享一个经济体、一种语言与一个未来。台下尽皆领会，掌声持续良久，讲稿由新闻局归档。"
 ire_nw.1.a:0 "向全国广播演说"
 ire_nw.1.b:0 "只交地方报纸刊载"
 ire_nw.2.t:0 "七月十二日的游行"
 ire_nw.2.d:0 "橙色会所宣布了例行的七月游行路线，天主教街区已开始钉窗。都柏林的内阁在等一个答复：新政府能否维持秩序，又不显得像伦敦的警察。警政总监的部署方案与各区治安报告已送内阁，请内阁核定游行处置办法。"
 ire_nw.2.a:0 "禁止游行。"
 ire_nw.2.b:0 "允许游行并加派警力。"
 ire_nw.2.c:0 "以反游行回应。"
 ire_nw.3.t:0 "波士顿的电汇"
 ire_nw.3.d:0 "波士顿的爱尔兰裔商人委员会向都柏林汇来款项，指定用于民族事业，附一份用途说明与候选人名单，并要求派人监管支出。财政部已收讫，众议院财政委员会要求说明所接受的条件，款项用途的稽核由审计署办理，请内阁示下。"
 ire_nw.3.a:0 "收下并投入宣传"
 ire_nw.3.b:0 "存入国家基金"
 ire_nw.4.t:0 "与伦敦的经济战"
 ire_nw.4.d:0 "与伦敦的关税战已进入第五年。西部牧场主亏本出售牲畜，农业部的收购站按最低价接货；都柏林坚持不交土地年金，财政部把这项收入单列。双方均未提出新的条件，谈判仍停在技术层面，下一轮会谈的日期尚未确定。"
 ire_nw.4.a:0 "维持强硬立场"
 ire_nw.4.b:0 "寻求关税和解"
 ire_nw.5.t:0 "船厂工人的请愿"
 ire_nw.5.d:0 "贝尔法斯特船厂的工人代表团来到都柏林。他们是新教徒，是工会会员，只问一件事：统一之后，船厂还有活干吗。工商部已把船厂订单、雇工名册与工会诉求列成节略，送内阁会议审议，工会代表留都柏林候复。"
 ire_nw.5.a:0 "保证船厂不减产。"
 ire_nw.5.b:0 "优先录用天主教工人。"
 ire_nw.6.t:0 "盖尔语复兴运动"
 ire_nw.6.d:0 "盖尔语联盟报告称，自由邦里每五个孩子中，能流利使用爱尔兰语者不足一人。教育部据此拟定方案，把语言课列入师范与小学的必修科目。联盟的干事则在西部各县巡回演讲，募集教材与教师。教材由教育部统一印发。"
 ire_nw.6.a:0 "资助盖尔语学校。"
 ire_nw.6.b:0 "交由民间志愿者。"
 ire_nw.7.t:0 "都柏林全国大会"
 ire_nw.7.d:0 "政府首次将各方请入同一会场：工会、教会、反对派，以及来自波士顿与格拉斯哥的代表。会务由总理府直辖，议程与代表名单经内阁核准，联合派的工人与教士另发请柬。会场由宪兵守卫，会议记录整理后送交各部参阅。"
 ire_nw.7.a:0 "邀请联合派与教会"
 ire_nw.7.b:0 "仅办民族主义集会"
 ire_nw.8.t:0 "贝尔法斯特的答复"
 ire_nw.8.d:0 "都柏林大会闭幕三十日后，贝尔法斯特给出答复。其性质取决于当日坐在大厅里的是谁：或为和解之议，或为对抗之举。总督署已将全文抄送都柏林，照片底片一并封存。都柏林方面已将全文分送四派，列入下周议程。"
 ire_nw.8.a:0 "公布现场照片"
 ire_nw.8.b:0 "不予理会"
 ire_nw.9.t:0 "伦敦发来的照会"
 ire_nw.9.d:0 "自治领事务部送来一份措辞谨慎的照会，声明联合王国不承认北爱尔兰的任何单方面公投，并要求都柏林在答复前先行说明立场。文件由驻渥太华代办转交，副本送外交部与内阁。照会未附期限，末尾只写明等候复文。"
 ire_nw.9.a:0 "公布照会全文"
 ire_nw.9.b:0 "将照会锁进抽屉"
 ire_nw.9.c:0 "公布并公开驳斥"
 ire_nw.9.e:0 "接受伦敦观察员"
 ire_nw.10.t:0 "第五大道的绿旗"
 ire_nw.10.d:0 "圣帕特里克日游行在第五大道举行，沿途观礼者拥挤。检阅台上就座的是都柏林派出的代表，坦慕尼协会的政客未获安排；捐款桶标注「为了北方」。代表团募捐清册已送回外交部，款项尚待核对，差旅费用由外交部列支。"
 ire_nw.10.a:0 "转为政治资本"
 ire_nw.10.b:0 "设立文化基金"
 ire_nw.11.t:0 "芝加哥的机器"
 ire_nw.11.d:0 "库克县的政治机器通过爱尔兰裔社团递来一项安排：直通白宫的联络渠道，代价是都柏林在此时公开靠向华盛顿。外交部评估了中立声明可能受到的影响，并把备忘录送交德瓦莱拉本人，另抄送驻华盛顿代办。"
 ire_nw.11.a:0 "接受库克县安排"
 ire_nw.11.b:0 "保持适当距离"
 ire_nw.12.t:0 "世界爱尔兰大会"
 ire_nw.12.d:0 "来自四大洲的代表坐满大厅：梅奥的农夫、波士顿的警察、布宜诺斯艾利斯的护士，还有几个在西班牙打过仗的人。会期一周，议程分侨务、航运与宣传三组，决议草案由秘书处汇总后交外交部，闭会后刊印成册。"
 ire_nw.12.a:0 "通过《都柏林宣言》。"
 ire_nw.12.b:0 "只谈务实条款。"
 ire_nw.19.t:0 "纽芬兰渔业兄弟会"
 ire_nw.19.d:0 "威廉·柯克的名字仍挂在纽芬兰每一个小港的渔业保护联盟会所里。都柏林派组织者带着钱、收音机与一句话北上：鱼价由伦敦定，未来不必。圣约翰斯的会所已腾出房间，供来人住宿与议事。汇款与器材经圣约翰斯转运。"
 ire_nw.19.a:0 "重建兄弟会。"
 ire_nw.19.b:0 "资助圣约翰斯电台。"
 ire_nw.20.t:0 "鱼市上的集会"
 ire_nw.20.d:0 "晒鱼架的阴影下，渔民聚集听都柏林来的官员说明补贴、冷库与保底收购价。一位老船长问由谁出资。随行人员记录问题，答复稿由农业部与财政部会同拟具，送交内阁。农业部同时核对各港口的冷库容量与收购账目。"
 ire_nw.20.a:0 "承诺渔业补贴"
 ire_nw.20.b:0 "仅发表声明"
 ire_nw.21.t:0 "天主教徒与橙带党"
 ire_nw.21.d:0 "公投运动唤起旧怨。圣约翰斯同一码头劳作数代的渔民，忽然计较起自己在哪一家会所饮酒。教会已分头劝解，工会则按教派分设支部，名单送市政厅备查。警务专员已加派巡逻，防止各会所门前聚斗伤人。"
 ire_nw.21.a:0 "请教会出面调停"
 ire_nw.21.b:0 "支持天主教工会"
 ire_nw.22.t:0 "伦敦方面的阻挠"
 ire_nw.22.d:0 "圣约翰斯总督府发表声明，称纽芬兰的前途属联合王国事务，与都柏林的政府无关。声明由总督署名发布，措辞与伦敦方面的口径一致。文本已由法律顾问校阅，总督府未说明是否事前请示伦敦，外交部请示应对方式。"
 ire_nw.22.a:0 "公开提出抗议"
 ire_nw.22.b:0 "私下进行交涉"
 ire_nw.23.t:0 "纽芬兰的请愿船队"
 ire_nw.23.d:0 "一支渔船队驶入圣约翰斯港，桅杆上挂着绿旗与请愿书，船员要求在码头宣读文本。港务长请示总督府，警察在岸边列队未加干预。请愿书副本已由渔业部收存，纽芬兰方面尚未正式答复，总督府要求先查明船队的组织者。"
 ire_nw.23.a:0 "派海军护航"
 ire_nw.23.b:0 "致电表示慰问"
 ire_nw.24.t:0 "纽芬兰的电台之争"
 ire_nw.24.d:0 "冬季只有广播能抵达外港。BBC 的纽芬兰频道讲帝国，圣约翰斯一家新电台想讲这座岛。两家都向都柏林要钱。邮电部已把两家电台的功率、覆盖与报价列成对照表，连同岛上政务官的呈文一并送内阁。"
 ire_nw.24.a:0 "资助岛上电台。"
 ire_nw.24.b:0 "让 BBC 继续垄断。"
 ire_nw.25.t:0 "纽芬兰公投前夜"
 ire_nw.25.d:0 "投票箱已经堆放在法院的走廊里，最后一次广播也已播完。外港的家庭守着收音机，先听天气预报，再等计票结果；教会与渔业联盟的干事分头走访各码头。竞选只剩最后一个晚上，各派的车队仍在雪路上往返，印刷所连夜赶印传单。"
 ire_nw.25.a:0 "请柯克旧部回岛助选。"
 ire_nw.25.b:0 "承诺渔业专款。"
 ire_nw.25.c:0 "交由岛民自行决定。"
 ire_nw.30.t:0 "渥太华的午夜"
 ire_nw.30.d:0 "总督签完最后一份文件，午夜过后几分钟，联合旗从国会山降下。渥太华的街道很安静，卫兵按程序撤去旗绳。都柏林的报纸已在印号外，外交部拟就一份致渥太华的照会稿，待内阁核定。总督府的通告定于次晨发布。"
 ire_nw.30.a:0 "向渥太华派出特使。"
 ire_nw.30.b:0 "在都柏林公开庆祝。"
 ire_nw.31.t:0 "魁北克的声音"
 ire_nw.31.d:0 "魁北克的主教与省长提出一项要求：加拿大若脱离帝国，法裔加拿大不能只是更换一个遥远的政府。外交部经驻渥太华代办征询意见，答复文本由内阁核定后送交魁北克。驻渥太华代办受命随时报告加拿大议会的动向。"
 ire_nw.31.a:0 "保障法语与教权"
 ire_nw.31.b:0 "建立中央集权"
 ire_nw.32.t:0 "华盛顿的警告"
 ire_nw.32.d:0 "国务院召见爱尔兰公使。话很短：美国不容加拿大边境出现敌对强国，亦不容一个新帝国。华盛顿并非询问，而是通知。外交部已将谈话记录呈内阁，并令驻美公使原地待命，众议院已要求外交部就此提出说明。"
 ire_nw.32.a:0 "向华盛顿作出保证"
 ire_nw.32.b:0 "置若罔闻"
 ire_nw.33.t:0 "归并之后的加拿大"
 ire_nw.33.d:0 "末任总督离开总督府，渥太华的国会大厦升起爱尔兰旗，议会已停止开会。加拿大九个省与两个地区的事务，现由都柏林派出的专员接管。各省省长已联名提出权限清单，要求明确自治范围，内阁须裁定治理方式。"
 ire_nw.33.a:0 "保留自治议会"
 ire_nw.33.b:0 "由都柏林直辖"
 ire_nw.34.t:0 "新世界宣言的宣读"
 ire_nw.34.d:0 "宣言在都柏林城堡的台阶上以爱尔兰语、英语与法语宣读，全文未提帝国，也未宣称王冠，只载明爱尔兰民族自大西洋各省延伸至五大湖，首都为都柏林。文本由总理府归档，副本分送各自治领与驻外使馆。"
 ire_nw.34.a:0 "召开大西洋议会"
 ire_nw.34.b:0 "在凤凰公园阅兵"
 ire_nw.40.t:0 "斯德哥尔摩的犹豫"
 ire_nw.40.d:0 "瑞典外相礼貌、谨慎、寸步不让。瑞典花了一个世纪避开列强战争；由都柏林领导的联盟，在他看来不过是人口更少的另一个列强。他问：爱尔兰能提供什么中立提供不了的东西。问答记录已归档，答复要点另拟。"
 ire_nw.40.a:0 "提供低息贷款。"
 ire_nw.40.b:0 "让时间证明。"
 ire_nw.41.t:0 "挪威商船队的买卖"
 ire_nw.41.d:0 "挪威商船队规模居世界第四，战争爆发时有一半漂在大西洋上。奥斯陆宁可卖船也不愿失去它们，都柏林宁可买船也不愿造船。谈判在斯德哥尔摩进行，船龄、吨位与船员留用条款逐条议定。船员多愿随船留任。"
 ire_nw.41.a:0 "买下整支商船队。"
 ire_nw.41.b:0 "请求租借船只。"
 ire_nw.42.t:0 "芬兰战线的求援"
 ire_nw.42.d:0 "芬兰再度陷入战争，各国均在注视。赫尔辛基询问新世界联盟的保证是否只停留在纸面。外交部将芬方照会转呈内阁，随附参谋处的兵力评估，请示是否派出志愿人员。财政部同时核算运输与装备的费用，众议院等候答复。"
 ire_nw.42.a:0 "派遣野鹅志愿军"
 ire_nw.42.b:0 "仅送药品物资"
 ire_nw.43.t:0 "北方的联合演习"
 ire_nw.43.d:0 "爱尔兰、瑞典、挪威与丹麦的军官首次围于同一张地图前。演习规模甚小：数艘驱逐舰、数个中队。海军部已将演习海域、通信频率与港口礼遇通告各国，观察员报告于演习结束后一月内提交各国海军参谋部。"
 ire_nw.43.a:0 "举行联合演习"
 ire_nw.43.b:0 "缩小规模，保持低调"
 ire_nw.50.t:0 "哈拉马的第一面绿旗"
 ire_nw.50.d:0 "爱尔兰志愿军在最冷的冬季抵达哈拉马河谷，装备由各方凑集，步枪口径不一，国际纵队已在阵地上等候多日。带队军官向纵队司令部报到并请领防区，都柏林要求将编成与伤亡逐周报回，伤员后送由纵队卫生队统一办理。"
 ire_nw.50.a:0 "投入前线"
 ire_nw.50.b:0 "留驻后方整训"
 ire_nw.51.t:0 "战俘营的来信"
 ire_nw.51.d:0 "一捆信从民族主义者的战俘营送到都柏林，写信人索要香烟与消息，并要求保证家属不致断粮。审查官逐封读过，删去营内地址与人名。战俘事务处把信件分类登记，家属名单转交地方救济委员会，回信由该处统一拟稿。"
 ire_nw.51.a:0 "通过红十字会交涉"
 ire_nw.51.b:0 "将其宣传为烈士"
 ire_nw.52.t:0 "野鹅自波尔多归来"
 ire_nw.52.d:0 "幸存的志愿兵搭一艘从波尔多出发的货船回国。他们更瘦、更沉默，也比出发时更像士兵。军队想要他们，政府不确定养不养得起。国防部已把名册、军阶与欠饷数目列出，送财政部会同核定，安置办法另行公布。"
 ire_nw.52.a:0 "编入常备军。"
 ire_nw.52.b:0 "遣散并发放抚恤。"
 ire_nw.60.t:0 "大西洋护航危机"
 ire_nw.60.d:0 "一支开往科克的船队被 U 艇打散，护航舰只未能合围。海军部要求都柏林派出护航舰，内阁则问海军还剩下什么。海军参谋部连夜清点可用舰艇，清单送交国防部；余下的航次须据此重排。生还者已由渔船接回科克。"
 ire_nw.60.a:0 "全力护航。"
 ire_nw.60.b:0 "把舰队留港。"
 ire_nw.61.t:0 "驱逐舰交换条件"
 ire_nw.61.d:0 "华盛顿提议将中立巡逻扩至爱尔兰海域，并在香农驻扎飞机。条件优厚，代价是大西洋航线与美国绑在一起。外交部与国防部会同审议，海军服务处提出港口使用意见，请示内阁答复。港务当局已就香农水域的使用提出意见。"
 ire_nw.61.a:0 "接受美国巡逻"
 ire_nw.61.b:0 "予以拒绝"

