l_simp_chinese:
 # ===== A 线新世界爱尔兰：国策 =====
 IRE_A_home_development:0 "国土开发委员会"
 IRE_A_home_development_desc:0 "把香农河的水、泥炭和港口连成一张全国开发网。都柏林第一次认真规划整个岛。"
 IRE_A_mineral_survey:0 "全国矿产勘探"
 IRE_A_mineral_survey_desc:0 "地质学家带着钻机走进康诺特和蒙斯特。煤、铁、钨的储量不大，但足够让工厂转起来。"
 IRE_A_infrastructure_programme:0 "全国基础设施计划"
 IRE_A_infrastructure_programme_desc:0 "公路、铁路、电站和香农机场同时动工。爱尔兰不再只是大西洋边的一块农田。"
 IRE_A_world_congress:0 "世界爱尔兰大会"
 IRE_A_world_congress_desc:0 "从波士顿到布宜诺斯艾利斯，从利物浦到巴黎，爱尔兰裔的代表第一次坐在同一张桌子前。需凯尔特后裔网络达到 60，且时间在 1940 年 6 月之后。"
 IRE_A_green_dollar:0 "绿色美元"
 IRE_A_green_dollar_desc:0 "侨汇不再只是汇款单，而是都柏林可以支配的资本。"
 IRE_A_wild_geese_legion:0 "野鹅军团"
 IRE_A_wild_geese_legion_desc:0 "野鹅的后代带着军事经验回到故乡，组成一支真正的远征军。"
 IRE_A_spanish_volunteers:0 "野鹅远征军"
 IRE_A_spanish_volunteers_desc:0 "佛朗哥的叛乱撕裂了西班牙。都柏林以野鹅远征军的名义，把野鹅的后代送进伊比利亚半岛——这不是国家战争，却能为爱尔兰换来一支真正的远征军。无论西班牙战局如何，志愿军的名号都能为爱尔兰所用。"
 IRE_A_canada_independence:0 "策动加拿大独立"
 IRE_A_canada_independence_desc:0 "渥太华与伦敦之间的纽带正在松动。需加拿大存在且未投降，英国也未与我国交战。加拿大将退出任何阵营；若仍是英国自治领则直接获得独立，并被禁止再次加入阵营。"
 IRE_A_atlantic_fleet:0 "大西洋舰队"
 IRE_A_atlantic_fleet_desc:0 "从纽芬兰到科克，一支小而精的舰队开始为大西洋航线护航。"
 IRE_A_air_bridge:0 "跨大西洋空桥"
 IRE_A_air_bridge_desc:0 "香农机场成为跨大西洋航线的中继站，战斗机、巡逻机和邮件一起降落。"
 IRE_A_irish_question:0 "爱尔兰问题"
 IRE_A_irish_question_desc:0 "利物浦、格拉斯哥、伦敦的爱尔兰人开始让威斯敏斯特睡不着觉。"
 IRE_A_tammany_hall:0 "坦慕尼协会"
 IRE_A_tammany_hall_desc:0 "波士顿和纽约的爱尔兰裔政治机器，第一次为旧大陆的故乡运转。"
 IRE_A_wild_geese_paris:0 "巴黎的野鹅"
 IRE_A_wild_geese_paris_desc:0 "法国从未忘记为它作战的爱尔兰人。巴黎的沙龙里，重新响起野鹅的名字。"
 IRE_A_green_international:0 "绿色国际"
 IRE_A_green_international_desc:0 "分散在各大国的爱尔兰人，终于有了同一个政治声音。"
 IRE_A_atlantic_charter:0 "大西洋宪章"
 IRE_A_atlantic_charter_desc:0 "不是帝国，而是联邦：大西洋两岸的爱尔兰人用宪章而不是枪炮联合起来。"
 IRE_A_new_world_expedition:0 "新世界远征"
 IRE_A_new_world_expedition_desc:0 "如果伦敦不放，那就自己去拿。需先归并加拿大；野鹅军团和大西洋舰队将把旗帜插到该插的地方。"
 IRE_A_canada_annex:0 "归并加拿大"
 IRE_A_canada_annex_desc:0 "渥太华已经脱离伦敦，却还没有回到都柏林。只要议会通过一纸法案、军队向北开进，英属北美就会成为新世界爱尔兰的西半部。需加拿大存在、独立且未与我国交战。"
 IRE_A_new_world_ireland:0 "新世界爱尔兰"
 IRE_A_new_world_ireland_desc:0 "加拿大各省不是殖民地，而是爱尔兰民族的核心疆域。从纽芬兰到不列颠哥伦比亚，每个州都在议会中获得完整代表权。需已完成英属北美归并。"
 IRE_A_nordic_bridge:0 "北方桥梁"
 IRE_A_nordic_bridge_desc:0 "北欧的小国看着列强瓜分欧洲。都柏林能给他们的，是伦敦和柏林都给不了的东西：一个在波罗的海没有任何领土野心的伙伴。需瑞典、挪威、丹麦或芬兰至少一国存在。"
 IRE_A_nordic_alliance:0 "新世界联盟"
 IRE_A_nordic_alliance_desc:0 "一个由都柏林领导的北方小国联盟。友好的北欧国家立即入盟，其余国家先获得爱尔兰的安全保证。"

 # ===== 新世界爱尔兰：精神 =====
 IRE_home_development:0 "国家开发委员会"
 IRE_home_development_desc:0 "一整套国家主导的工业化计划。建筑队、地质队和电力工程师同时上路。"
 IRE_diaspora_bond_drive:0 "侨民公债"
 IRE_diaspora_bond_drive_desc:0 "海外爱尔兰裔认购的公债正在为工厂和港口融资。"
 IRE_world_congress:0 "世界爱尔兰大会"
 IRE_world_congress_desc:0 "海外代表定期聚会，协调宣传、募捐和志愿兵。"
 IRE_green_dollar:0 "绿色美元"
 IRE_green_dollar_desc:0 "侨汇、投资和贸易正在把大西洋变成一条绿色的资本航道。"
 IRE_wild_geese_legion:0 "野鹅军团"
 IRE_wild_geese_legion_desc:0 "流散军人的后代回到爱尔兰，带着经验、勋章和复仇的念头。"
 IRE_spanish_volunteers:0 "野鹅志愿军"
 IRE_spanish_volunteers_desc:0 "来自爱尔兰和美洲的野鹅后裔在西班牙并肩作战。都柏林可以把更多志愿师派往海外，并且不再受现役师数量门槛限制。"
 IRE_british_north_america:0 "英属北美归并"
 IRE_british_north_america_desc:0 "加拿大自治领并入新世界爱尔兰，圣劳伦斯河与五大湖的工厂和人力转而为都柏林服务。"
 IRE_atlantic_fleet:0 "大西洋舰队"
 IRE_atlantic_fleet_desc:0 "一支以护航和破交为核心的小型海军。"
 IRE_air_bridge:0 "跨大西洋空桥"
 IRE_air_bridge_desc:0 "香农—纽芬兰—波士顿的空中走廊。"
 IRE_green_international:0 "绿色国际"
 IRE_green_international_desc:0 "一个横跨英美的爱尔兰裔政治网络。"
 IRE_atlantic_charter:0 "大西洋宪章"
 IRE_atlantic_charter_desc:0 "大西洋两岸的爱尔兰人共同签署的政治宪章。"
 IRE_atlantic_emergency:0 "大西洋防卫体制"
 IRE_atlantic_emergency_desc:0 "战争烧到大西洋后，都柏林把本土防卫、海岸警戒与全国动员纳入同一套紧急体制。"
 IRE_new_world_expedition:0 "新世界远征"
 IRE_new_world_expedition_desc:0 "爱尔兰不再满足于防守。"
 IRE_eng_irish_question:0 "爱尔兰问题"
 IRE_eng_irish_question_desc:0 "英国政府发现，爱尔兰裔工人和选民不再沉默。"
 IRE_eng_dock_strike:0 "码头罢工"
 IRE_eng_dock_strike_desc:0 "利物浦和格拉斯哥的码头停摆，战争物资堆积在仓库里。"
 IRE_eng_ira_campaign:0 "IRA 战役"
 IRE_eng_ira_campaign_desc:0 "爆炸、纵火和暗杀让伦敦的战争机器分心。"
 IRE_usa_irish_lobby:0 "爱尔兰裔游说团"
 IRE_usa_irish_lobby_desc:0 "华盛顿的走廊里，爱尔兰裔议员正在为旧大陆说话。"
 IRE_fra_irish_sympathy:0 "法国的爱尔兰热"
 IRE_fra_irish_sympathy_desc:0 "巴黎的报纸开始连篇累牍地报道爱尔兰的处境。"

 # ===== 新世界爱尔兰：决议分类 =====
 IRE_home_cat:0 "本土开发"
 IRE_congress_cat:0 "世界爱尔兰大会"
 IRE_interference_cat:0 "海外干涉"
 IRE_nordic_cat:0 "北方事务"

 # ===== 本土开发决议 =====
 IRE_dev_leinster:0 "开发伦斯特工业带"
 IRE_dev_leinster_desc:0 "都柏林—韦克斯福德—塔拉莫尔，工厂和铁路一起铺开。最多 7 期（约 25 建筑格）。"
 IRE_dev_munster:0 "开发蒙斯特与科克港"
 IRE_dev_munster_desc:0 "科克港的船坞和铁路，把南方的农产品送出去。最多 7 期（约 25 建筑格）。"
 IRE_dev_connaught:0 "开发康诺特与香农"
 IRE_dev_connaught_desc:0 "香农河的水电、机场和工业园。最多 7 期（约 25 建筑格）。"
 IRE_national_mining:0 "全国矿脉勘察"
 IRE_national_mining_desc:0 "煤、铁、钨的储量被写进地质报告；每 180 天可再次勘察。"
 IRE_national_research:0 "国立研究院"
 IRE_national_research_desc:0 "都柏林大学和香农实验室获得新的经费，国立研究院增设两个研究槽。"

 # ===== 海外大会决议 =====
 IRE_diaspora_bonds:0 "发行侨民公债"
 IRE_diaspora_bonds_desc:0 "向波士顿、纽约、布宜诺斯艾利斯的爱尔兰裔社区发行公债。"
 IRE_call_wild_geese:0 "征召野鹅"
 IRE_call_wild_geese_desc:0 "在美洲的爱尔兰裔社区设点募兵。"
 IRE_request_us_surplus:0 "美国剩余物资"
 IRE_request_us_surplus_desc:0 "华盛顿愿意把多余的装备卖给都柏林。"
 IRE_atlantic_escort:0 "大西洋护航"
 IRE_atlantic_escort_desc:0 "为跨大西洋航线增派运输船和护航舰。"
 IRE_ferry_command:0 "渡运司令部"
 IRE_ferry_command_desc:0 "香农机场的跨大西洋渡运中队。"
 IRE_green_international_congress:0 "召开绿色国际大会"
 IRE_green_international_congress_desc:0 "让英、美、法的爱尔兰裔代表公开站队。"

 # ===== 干涉决议 =====
 IRE_liverpool_strike:0 "利物浦码头罢工"
 IRE_liverpool_strike_desc:0 "码头工人放下吊钩，战争物资停在码头。"
 IRE_ira_infiltration:0 "IRA 渗透"
 IRE_ira_infiltration_desc:0 "把枪和传单一起送进英国的城市。"
 IRE_american_volunteers:0 "美国志愿兵"
 IRE_american_volunteers_desc:0 "波士顿和芝加哥的爱尔兰裔青年报名去爱尔兰。"
 IRE_green_vote:0 "绿色选票"
 IRE_green_vote_desc:0 "让爱尔兰问题进入美国选举。"
 IRE_french_arms:0 "法国军援"
 IRE_french_arms_desc:0 "巴黎的军火库向都柏林打开。"
 IRE_irish_brigade:0 "爱尔兰旅"
 IRE_irish_brigade_desc:0 "以野鹅之名，在法国组建一支爱尔兰志愿旅。"

 # ===== 事件 ire.70 =====
 ire.70.t:0 "绿色国际"
 ire.70.d:0 "都柏林城堡的大厅里，来自利物浦、波士顿、纽约、巴黎和布宜诺斯艾利斯的代表第一次坐在一起。没有王冠，没有帝国，只有一张张写着同一句话的纸：爱尔兰不再是一个岛的问题。"
 ire.70.a:0 "让绿旗在各大洲同时升起。"

