 ire_nw.174.t:0 "罗马教廷的牧函"
 ire_nw.174.d_low:0 "主教团对联合政府的世俗化政策越来越不安。罗马发来一封措辞克制的牧函，要求都柏林在教育、婚姻和报纸问题上作出保证。"
 ire_nw.174.d_labour:0 "工人派在政府里的影响力让主教团紧张。罗马的牧函公开提醒都柏林：爱尔兰仍然是一个天主教国家。"
 ire_nw.174.d:0 "罗马经由主教团向都柏林递送牧函，未涉政体，却就教育、家庭与公共道德提出具体主张，要求列入联合政府的施政纲领。主教团请求本会期内得到答复，教育部与卫生部已拟出对应办法，内阁须先行核定立场。"
 ire_nw.174.a:0 "接受教廷调停"
 ire_nw.174.a_tt:0 "教会信心 +10，工人影响力 −4，稳定度 +5%，政治点数 −25；获得 365 天“罗马牧函”。"
