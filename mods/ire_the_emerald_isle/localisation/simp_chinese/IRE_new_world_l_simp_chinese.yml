 IRE_dev_ulster:0 "开发北爱尔兰"
 IRE_dev_ulster_desc:0 "贝尔法斯特的船厂、港口与铁路重新接入国家建设计划。最多 7 期（约 25 建筑格）。"
 IRE_tt_national_mining_repeat:0 "可重复进行：每次增加本土各州资源，180 天后可再次执行。"
 IRE_A_civic_republic:0 "公民共和国"
 IRE_A_civic_republic_desc:0 "以和解为基础，把新世界爱尔兰建成一个由公民、侨民与地方议会共同支撑的民主共和国。"
 IRE_A_centralised_republic:0 "中央集权共和国"
 IRE_A_centralised_republic_desc:0 "以强政府与强力部门维持秩序，把岛国拧成一台高效的战争机器。"
 IRE_civic_republic:0 "公民共和国"
 IRE_civic_republic_desc:0 "地方议会、侨民代表与公民团体共同参与国家治理。"
 IRE_centralised_republic:0 "中央集权共和国"
 IRE_centralised_republic_desc:0 "都柏林集中调配人力、工业与安全事务，国家机器运转得更快，也更冷酷。"
 IRE_civic_research_bonus:0 "公民科技加速"
 # ===== 加拿大归并后的开发计划 =====
 IRE_canada_cat:0 "加拿大开发"
 IRE_canada_development_plan:0 "加拿大国土开发计划"
 IRE_canada_development_plan_desc:0 "把多伦多、蒙特利尔、温尼伯到温哥华的铁路、港口与城市公用事业纳入都柏林的发展计划。每一期同时覆盖加拿大全部 19 个可开发省份：各 +1 建筑格与 +1 基础设施，随机 1 省 +1 民用工厂，地图外 +1 民用工厂，并获得 1 万人力。最多实施 3 期；第三期额外获得 1 座地图外军用工厂与 1.5 万人力。单州共享建筑格上限为 25，超出部分以地图外工厂体现。"
 IRE_canada_resource_plan:0 "加拿大资源勘探计划"
 IRE_canada_resource_plan_desc:0 "地质队进入新斯科舍煤田、艾伯塔油砂、魁北克与努纳武特铝矿区以及安大略北部钢铁带和铬矿。每期按省份增加煤 +6、钢 +7、铝 +7、石油 +5、钨 +1、铬 +2，并 +20 政治点数；最多实施 3 期，第三期额外获得 1 座地图外民用工厂。"
 IRE_canada_smelting_plan:0 "加拿大工业冶炼计划"
 IRE_canada_smelting_plan_desc:0 "在安大略与魁北克建立特种钢、铝材与铬铁合金联合企业，把矿石、电力与港口变成火炮、飞机和装甲钢。每期获得铬 +3、钢 +4、铝 +4、地图外 +1 军用工厂与 15 政治点数；首期解锁「加拿大冶炼工业」精神。最多实施 3 期；第三期额外获得 1 座地图外民用工厂。"
 IRE_canada_smelting:0 "加拿大冶炼工业"
 IRE_canada_smelting_desc:0 "安大略与魁北克的特种钢、铝材与铬铁合金联合企业，把加拿大的矿石与电力变成爱尔兰战争机器的精密部件。"
 IRE_tt_canada_development:0 "加拿大全部 19 个可开发省份：各 +1 建筑格、+1 基础设施；随机 1 省 +1 民用工厂。"
 IRE_tt_canada_development_offsite:0 "地图外 +1 民用工厂；人力 +10000；稳定度 +2%。"
 IRE_tt_canada_development_final:0 "第三期完成：额外地图外 +1 军用工厂，人力 +15000。"
 IRE_tt_canada_resources:0 "按省份增加煤 +6、钢 +7、铝 +7、石油 +5、钨 +1、铬 +2；政治点数 +20。"
 IRE_tt_canada_resources_final:0 "第三期完成：额外地图外 +1 民用工厂。"
 IRE_tt_canada_smelting:0 "铬 +3、钢 +4、铝 +4；地图外 +1 军用工厂；政治点数 +15。"
 IRE_tt_canada_smelting_idea:0 "解锁国家精神「加拿大冶炼工业」：工厂产出 +5%、军工生产速度 +10%、民用工业生产速度 +5%、消费品 -2%。"
 IRE_tt_canada_smelting_final:0 "第三期完成：额外地图外 +1 民用工厂。"
 # ===== 四州钢铝开发计划 =====
 IRE_mining_leinster:0 "伦斯特钢铝铬开发计划"
 IRE_mining_leinster_desc:0 "在都柏林—德罗赫达—韦克斯福德一线扩建轧钢、铝材加工、铬铁合金与配套电力；每 150 天可再次实施。"
 IRE_mining_munster:0 "蒙斯特钢铝铬开发计划"
 IRE_mining_munster_desc:0 "利用科克港与香农河口的进口铝土和电力，扩建氧化铝精炼、轧铝、轧钢与铬铁合金；每 150 天可再次实施。"
 IRE_mining_connaught:0 "康诺特钢铝铬开发计划"
 IRE_mining_connaught_desc:0 "以香农河水电为依托发展合金钢、铝材加工与铬铁合金，并继续开采钨矿；每 150 天可再次实施。"
 IRE_mining_ulster:0 "阿尔斯特钢铝铬开发计划"
 IRE_mining_ulster_desc:0 "把贝尔法斯特的船厂、钢厂、铝材加工、铬铁合金与煤矿重新编入开发计划；每 150 天可再次实施。"
 IRE_tt_state_mining_repeat:0 "可重复实施：增加本州钢、铝、铬等资源，150 天后可再次执行。"
 # ===== 爱尔兰团结与工业效率 =====
 IRE_eff_cat:0 "工业效率"
 IRE_unity_plan:0 "爱尔兰团结计划"
 IRE_unity_plan_desc:0 "在本土开发的基础上，都柏林把侨民资本与公共投资转向地图外工业：每期建成 3 座民用工厂与 2 座军用工厂。可重复实施，240 天后可再次执行。"
 IRE_tt_unity_plan_repeat:0 "可重复实施：每次获得 3 座地图外民用工厂与 2 座地图外军用工厂，240 天后可再次执行。"
 IRE_eff_standardisation:0 "工业标准化"
 IRE_eff_standardisation_desc:0 "统一全国工厂的机床规格、工时与质量标准，为后续流水线改造打底。完成后解锁「工业标准化」精神。"
 IRE_eff_assembly_line:0 "流水线革新"
 IRE_eff_assembly_line_desc:0 "在都柏林、科克与贝尔法斯特推行流水线与专业化分工，提高生产线效率上限与爬升速度。需先完成工业标准化。"
 IRE_eff_total_mobilisation:0 "全国工业动员"
 IRE_eff_total_mobilisation_desc:0 "把民用工业、港口与铁路全部纳入战时生产计划，压榨出最后一分产能。需先完成流水线革新。"
 IRE_industrial_standardisation:0 "工业标准化"
 IRE_industrial_standardisation_desc:0 "统一机床规格与质量标准，工厂产出、生产效率上限与爬升速度提高。"
 IRE_assembly_line:0 "流水线革新"
 IRE_assembly_line_desc:0 "流水线与专业化分工让工厂更快达到最高效率。"
 IRE_total_industrial_mobilisation:0 "全国工业动员"
 IRE_total_industrial_mobilisation_desc:0 "全国工业转入战时轨道，工厂产出与效率上限进一步提高。"
 # ===== 铁路车辆生产 =====
 IRE_train_production:0 "铁路车辆生产计划"
 IRE_train_production_desc:0 "都柏林、科克与贝尔法斯特的机车厂和车厢厂转入战时生产，每 120 天交付 10 列火车。需先研究基础火车。"
 IRE_tt_train_production_repeat:0 "可重复实施：每次交付 10 列火车，120 天后可再次执行。"
