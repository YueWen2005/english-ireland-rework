 ire_nw.198.c_tt:0 "政治点数 −25，战争支持 +3%，陆军经验 +50；获得 365 天“武装中立”。"

 ire_nw.199.t:0 "战后安全框架"
 ire_nw.199.d:0 "新的大国安全框架正在成形。都柏林可以选择加入、保持独立，或者推动欧洲中立区。"
 ire_nw.199.a:0 "加入新安全框架。"
