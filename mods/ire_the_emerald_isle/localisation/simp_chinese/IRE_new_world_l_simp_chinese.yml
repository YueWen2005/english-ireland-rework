 IRE_effect_canada_annex:0 "加拿大及其军队整体并入：获得 2 座地图外民用工厂、2 座地图外军用工厂、1 座地图外船坞。英国与美国将记恨我国。"
 IRE_effect_new_world_ireland:0 "加拿大 23 个州全部成为爱尔兰核心，并获得 3 座地图外民用工厂；国名改为新世界爱尔兰。"
 IRE_effect_nordic_bridge:0 "所有独立的北欧国家好感 +40。"
