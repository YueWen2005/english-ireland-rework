 # ===== 新国策效果提示 =====
 IRE_effect_canada_annex:0 "加拿大及其军队整体并入：获得 2 座地图外民用工厂、2 座地图外军用工厂、1 座地图外船坞。英国与美国将记恨我国。"
 IRE_effect_new_world_ireland:0 "加拿大 23 个州全部成为爱尔兰核心，并获得 3 座地图外民用工厂；国名改为新世界爱尔兰。"
 IRE_effect_nordic_bridge:0 "所有独立的北欧国家好感 +40。"
 IRE_effect_nordic_alliance:0 "成立新世界爱尔兰联盟（若爱尔兰已是阵营领袖，则直接使用现有阵营）：友好的北欧国家立即入盟，其余获得爱尔兰的安全保证。"

 # ===== 北欧决议 =====
 IRE_nordic_aid:0 "北欧援助包"
 IRE_nordic_aid_desc:0 "向北欧诸民主国运送粮食、煤炭和医疗物资。所有独立的北欧国家对爱尔兰好感 +15。"
 IRE_invite_sweden:0 "邀请瑞典"
 IRE_invite_sweden_desc:0 "瑞典不愿卷入列强战争，但一个由都柏林领导的北方联盟是另一回事。需瑞典好感高于 49，且瑞典不在任何阵营中。"
 IRE_invite_norway:0 "邀请挪威"
 IRE_invite_norway_desc:0 "挪威的商船队和漫长的大西洋海岸，能让联盟的触角远远超出波罗的海。需挪威好感高于 49，且挪威不在任何阵营中。"
 IRE_invite_denmark:0 "邀请丹麦"
 IRE_invite_denmark_desc:0 "哥本哈根掌握着波罗的海的门户。需丹麦好感高于 49，且丹麦不在任何阵营中。"
 IRE_invite_finland:0 "邀请芬兰"
 IRE_invite_finland_desc:0 "赫尔辛基有充分理由警惕东方。爱尔兰的安全保证总比没有好。需芬兰好感高于 49，且芬兰不在任何阵营中。"
 # ==================== A 线事件包（ire_nw） ====================
 ire_nw.1.t:0 "阿斯隆的演讲"
 ire_nw.1.d:0 "阿斯隆新发射台的脚手架还没拆完，德瓦莱拉已经站到了麦克风前。他没有提战争，没有提英国，也没有提边界。他讲的是三十二个郡将共享一个经济体、一种语言、一个未来。台下的人完全听懂了。"
 ire_nw.1.a:0 "向全国广播。"
 ire_nw.1.b:0 "只让地方报纸报道。"
 ire_nw.2.t:0 "七月十二日"
 ire_nw.2.d:0 "橙色会所宣布了例行的七月游行路线。天主教街区已经开始钉窗户。都柏林的内阁在等一个答案：新政府能不能维持秩序，又不显得像伦敦的警察。"
 ire_nw.2.a:0 "禁止游行。"
 ire_nw.2.b:0 "允许游行，增派双倍警力。"
 ire_nw.2.c:0 "用一场反游行回应。"
 ire_nw.3.t:0 "波士顿的电汇"
 ire_nw.3.d:0 "波士顿的爱尔兰裔商人委员会给都柏林汇来一笔巨款，用于「民族事业」。钱是好东西；附带的条件——由谁来决定用途，以及一份候选人名单——就不那么好了。"
 ire_nw.3.a:0 "收下钱，全部投入宣传。"
 ire_nw.3.b:0 "存入国家基金，不接受附加条件。"
 ire_nw.4.t:0 "经济战"
 ire_nw.4.d:0 "与伦敦的关税战已经进入第五年。西部的牧场主在亏本卖牛，而都柏林坚持不交年金。总有一方要先松口。"
 ire_nw.4.a:0 "继续强硬。"
 ire_nw.4.b:0 "寻求和解。"
 ire_nw.5.t:0 "工人的请愿"
 ire_nw.5.d:0 "贝尔法斯特船厂的工人代表团来到都柏林。他们是新教徒，是工会会员，只问一个问题：统一之后，船厂还有活干吗？这个答案将决定边界是地图上的一条线，还是人心中的一堵墙。"
 ire_nw.5.a:0 "保证船厂不减产。"
 ire_nw.5.b:0 "优先把岗位给天主教工人。"
 ire_nw.6.t:0 "盖尔语复兴"
 ire_nw.6.d:0 "盖尔语联盟报告说，自由邦里每五个孩子中，能流利使用爱尔兰语的不到一个。一种语言不能只靠演讲来拯救。"
 ire_nw.6.a:0 "资助盖尔语学校。"
 ire_nw.6.b:0 "交给民间志愿者。"
 ire_nw.7.t:0 "都柏林大会"
 ire_nw.7.d:0 "政府第一次把所有人请进同一个大厅：工会、教会、反对派，以及来自波士顿和格拉斯哥的代表。问题不是爱尔兰想不想要北方，而是北方能不能看见一个自己愿意生活的爱尔兰。"
 ire_nw.7.a:0 "邀请联合派工人和教会代表。"
 ire_nw.7.b:0 "只办一场民族主义集会。"
 ire_nw.8.t:0 "贝尔法斯特的回答"
 ire_nw.8.d:0 "都柏林大会召开三十天后，贝尔法斯特给出了回答。它究竟是橄榄枝还是篝火，取决于那天坐在大厅里的是谁。"
 ire_nw.8.a:0 "让照片自己说话。"
 ire_nw.8.b:0 "不予理会。"
 ire_nw.9.t:0 "伦敦的照会"
 ire_nw.9.d:0 "自治领事务部发来一份措辞谨慎的照会：联合王国不承认北爱尔兰的任何单方面公投。措辞很客气，含义并不客气。"
 ire_nw.9.a:0 "公布照会，让全国看看。"
 ire_nw.9.b:0 "把它锁进抽屉。"
 ire_nw.9.c:0 "公布照会，并公开回击。"
 ire_nw.9.e:0 "接受伦敦派观察员。"
 ire_nw.10.t:0 "第五大道的绿旗"
 ire_nw.10.d:0 "圣帕特里克日游行，五十万人挤满第五大道。检阅台上第一次不是坦慕尼政客，而是来自都柏林的代表；募捐桶上写着「为了北方」。"
 ire_nw.10.a:0 "把捐款变成政治资本。"
 ire_nw.10.b:0 "设立文化基金。"
 ire_nw.11.t:0 "芝加哥的机器"
 ire_nw.11.d:0 "库克县的政治机器开出了一个都柏林政府从未有过的价码：直通白宫的电话。代价是在爱尔兰中立最脆弱的时刻公开拥抱华盛顿。"
 ire_nw.11.a:0 "接受机器的拥抱。"
 ire_nw.11.b:0 "保持距离。"
 ire_nw.12.t:0 "世界爱尔兰大会"
 ire_nw.12.d:0 "来自四大洲的代表坐满了大厅：梅奥的农夫、波士顿的警察、布宜诺斯艾利斯的护士，还有几个在西班牙打过仗的人。有一个星期，爱尔兰不再只是欧洲边缘的一座小岛。"
 ire_nw.12.a:0 "通过《都柏林宣言》。"
 ire_nw.12.b:0 "务实一点。"
 ire_nw.19.t:0 "渔业兄弟会"
 ire_nw.19.d:0 "威廉·柯克的名字，仍挂在纽芬兰每一个小港的渔业保护联盟会所里。都柏林派组织者带着钱、收音机和一句话北上：鱼价由伦敦定，但未来不必。"
 ire_nw.19.a:0 "重建兄弟会。"
 ire_nw.19.b:0 "资助圣约翰斯电台。"
 ire_nw.20.t:0 "鱼市集会"
 ire_nw.20.d:0 "在晒鱼架的阴影下，一群渔民听都柏林来的人许诺补贴、冷库和保底收购价。一位老船长问了唯一重要的问题：谁出钱？"
 ire_nw.20.a:0 "承诺渔业补贴。"
 ire_nw.20.b:0 "只发表一份声明。"
 ire_nw.21.t:0 "天主教与橙带党"
 ire_nw.21.d:0 "公投运动唤醒了旧的仇怨。在圣约翰斯，几代人在同一片码头干活的渔民，突然开始在意自己进哪一家会所喝酒。"
 ire_nw.21.a:0 "让教会出面调停。"
 ire_nw.21.b:0 "支持天主教工会。"
 ire_nw.22.t:0 "伦敦的阻挠"
 ire_nw.22.d:0 "圣约翰斯的总督府发表声明：纽芬兰的未来是联合王国的事，不是都柏林某个外国政府的事。措辞是伦敦的，墨水是总督的。"
 ire_nw.22.a:0 "公开抗议。"
 ire_nw.22.b:0 "私下交涉。"
 ire_nw.23.t:0 "请愿船队"
 ire_nw.23.d:0 "一支渔船队驶入圣约翰斯港，桅杆上挂着绿旗和请愿书。港务长不知道该敬礼，还是该叫警察。"
 ire_nw.23.a:0 "派海军护航。"
 ire_nw.23.b:0 "发一封慰问电。"
 ire_nw.24.t:0 "电台之争"
 ire_nw.24.d:0 "冬天，只有广播能抵达外港。BBC 的纽芬兰频道在讲帝国；圣约翰斯一家新电台想讲这座岛。两家都需要都柏林的钱。"
 ire_nw.24.a:0 "资助岛上电台。"
 ire_nw.24.b:0 "让 BBC 继续垄断。"
 ire_nw.25.t:0 "公投前夜"
 ire_nw.25.d:0 "投票箱已经堆在法院里，最后一次广播也播完了。外港的家庭一边听天气预报，一边等结果。竞选只剩最后一个晚上。"
 ire_nw.25.a:0 "请柯克的旧部回岛站台。"
 ire_nw.25.b:0 "承诺一笔渔业专款。"
 ire_nw.25.c:0 "让岛民自己决定。"
 ire_nw.30.t:0 "渥太华的午夜"
 ire_nw.30.d:0 "总督签完最后一份文件。午夜刚过几分钟，联合旗从国会山降下。渥太华的街道很安静；都柏林的报纸已经在印号外。"
 ire_nw.30.a:0 "向渥太华派出特使。"
 ire_nw.30.b:0 "在都柏林公开庆祝。"
 ire_nw.31.t:0 "魁北克的声音"
 ire_nw.31.d:0 "魁北克的主教和省长只有一个要求：如果加拿大要脱离帝国，法裔加拿大不能只是换一个遥远的政府。答案将决定魁北克是伙伴，还是问题。"
 ire_nw.31.a:0 "保证法语与天主教权利。"
 ire_nw.31.b:0 "建立中央集权。"
 ire_nw.32.t:0 "华盛顿的警告"
 ire_nw.32.d:0 "国务院召见爱尔兰公使。话很短：美国不会容忍加拿大边境上出现一个敌对强国——或者一个新帝国。华盛顿不是在问，而是在通知。"
 ire_nw.32.a:0 "向华盛顿作出保证。"
 ire_nw.32.b:0 "不予理会。"
 ire_nw.33.t:0 "归并之后"
 ire_nw.33.d:0 "最后一任总督离开了总督府。渥太华的国会大厦上飘着爱尔兰旗，但议会已经不再开会。九个省和两个地区，现在必须由都柏林治理——或者被告知自己治理。"
 ire_nw.33.a:0 "保留加拿大自治议会。"
 ire_nw.33.b:0 "由都柏林直接治理。"
 ire_nw.34.t:0 "新世界宣言"
 ire_nw.34.d:0 "在都柏林城堡的台阶上，宣言用爱尔兰语、英语和法语宣读。它没有提到帝国，也没有宣称王冠。它只是说：爱尔兰民族现在从大西洋省份延伸到五大湖，首都是都柏林。"
 ire_nw.34.a:0 "召开大西洋议会。"
 ire_nw.34.b:0 "在凤凰公园阅兵。"
 ire_nw.40.t:0 "斯德哥尔摩的犹豫"
 ire_nw.40.d:0 "瑞典外相礼貌、谨慎、寸步不让。瑞典花了一个世纪避开列强战争；一个由都柏林领导的联盟，看起来不过是人口更少的另一个列强。他问：爱尔兰能提供什么中立提供不了的东西？"
 ire_nw.40.a:0 "提供低息贷款。"
 ire_nw.40.b:0 "让时间证明。"
 ire_nw.41.t:0 "挪威商船"
 ire_nw.41.d:0 "挪威商船队规模居世界第四，战争爆发时有一半漂在大西洋上。奥斯陆宁可卖船也不愿失去它们，都柏林宁可买船也不愿造船。"
 ire_nw.41.a:0 "买下商船。"
 ire_nw.41.b:0 "请求租借。"
 ire_nw.42.t:0 "芬兰前线"
 ire_nw.42.d:0 "芬兰再次陷入战争，全世界都在看。赫尔辛基想知道，新世界联盟的保证除了纸面之外还意味着什么。都柏林要回答的是：一座小岛付得起这个代价吗？"
 ire_nw.42.a:0 "派遣野鹅志愿军。"
 ire_nw.42.b:0 "只送药品和物资。"
 ire_nw.43.t:0 "北方演习"
 ire_nw.43.d:0 "爱尔兰、瑞典、挪威和丹麦的军官第一次围在同一张地图前。演习规模很小——几艘驱逐舰、几个中队——但信号不小。"
 ire_nw.43.a:0 "举行联合演习。"
 ire_nw.43.b:0 "保持低调。"
 ire_nw.50.t:0 "哈拉马的第一面绿旗"
 ire_nw.50.d:0 "爱尔兰志愿军在最冷的冬天抵达哈拉马河谷。他们的军装不统一，步枪比拿枪的人还老，国际纵队已经等了一个星期。"
 ire_nw.50.a:0 "把他们投入前线。"
 ire_nw.50.b:0 "让他们留在后方。"
 ire_nw.51.t:0 "战俘营的来信"
 ire_nw.51.d:0 "一捆信从民族主义者的战俘营送到都柏林。写信的人要香烟、要消息，还要一个保证：家里人不会挨饿。审查官已经读过了每一个字。"
 ire_nw.51.a:0 "通过红十字会交涉。"
 ire_nw.51.b:0 "把他们写成烈士。"
 ire_nw.52.t:0 "归来的野鹅"
 ire_nw.52.d:0 "幸存的志愿军搭一艘从波尔多出发的货船回国。他们更瘦、更沉默，也比出发时更像士兵。军队想要他们，政府不确定养不养得起。"
 ire_nw.52.a:0 "编入常备军。"
 ire_nw.52.b:0 "遣散并发放抚恤。"
 ire_nw.60.t:0 "护航危机"
 ire_nw.60.d:0 "一支开往科克的船队被 U 艇打散。海军部要都柏林派护航舰；内阁问海军还剩下什么。这个答案将决定战争余下岁月里的大西洋航线。"
 ire_nw.60.a:0 "全力护航。"
 ire_nw.60.b:0 "把舰队留在港内。"
 ire_nw.61.t:0 "驱逐舰交易"
 ire_nw.61.d:0 "华盛顿提出把中立巡逻扩展到爱尔兰海域，并在香农驻扎飞机。条件很优厚，也会把都柏林的大西洋航线绑在美国身上。它同时会终结爱尔兰中立的幌子。"
 ire_nw.61.a:0 "接受美国巡逻。"
 ire_nw.61.b:0 "拒绝。"

