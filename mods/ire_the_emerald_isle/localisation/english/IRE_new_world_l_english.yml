 # ===== Trigger tooltips =====
 IRE_tt_nf_support_50:0 "Newfoundland support above 49 (the Fishermen's Brotherhood decision adds +8 each time)"
 IRE_tt_nf_plebiscite_odds:0 "If Britain is at war or Newfoundland support is above 79, the referendum passes automatically; otherwise it is a 50% chance."
 IRE_tt_diaspora_60:0 "Celtic diaspora network above 59"
 IRE_tt_diaspora_100:0 "Celtic diaspora network above 99"
 IRE_tt_canada_annexed:0 "British North America has been annexed"
 IRE_tt_green_dollar_partner:0 "Requires the Boston or Buenos Aires branch"
 IRE_tt_wild_geese_source:0 "Requires the Wild Geese, Irish Division or Green Legion branch"
 IRE_tt_atlantic_fleet_ports:0 "Requires Newfoundland or the Treaty Ports"
 IRE_tt_air_bridge_partner:0 "Requires Newfoundland or the Boston branch"
 IRE_tt_tammany_partner:0 "Requires the Boston branch"
 IRE_tt_tammany_usa_invite:0 "After this focus, the decision 'Invite the United States' becomes available once the Hope of Europe exists and the date is after 1 January 1941; it also becomes available if world tension reaches 100%."

 # ===== New focus effect tooltips =====
 IRE_effect_canada_annex:0 "Canada is annexed together with its army: 2 off-map civilian factories, 2 off-map military factories and 1 off-map dockyard. Britain and the USA are angered."
 IRE_effect_new_world_ireland:0 "All 23 Canadian states become cores of Ireland, plus 3 off-map civilian factories. The country is renamed New World Ireland."
 IRE_effect_nordic_bridge:0 "+40 opinion with every independent Nordic state."
 IRE_effect_nordic_alliance:0 "Founds the New World Alliance with open membership rules (or, if Ireland already leads a faction, uses it). Friendly Nordic states join immediately; the rest receive an Irish guarantee."

 # ===== Nordic decisions =====
 IRE_nordic_aid:0 "Nordic Aid Package"
 IRE_nordic_aid_desc:0 "Grain, coal and medical supplies are shipped to the northern democracies, handled jointly by the foreign ministry and the Red Cross. Sailings are arranged by quarter, and the acknowledgements of the receiving states are kept on file."
 IRE_invite_sweden:0 "Invite Sweden"
 IRE_invite_sweden_desc:0 "Sweden keeps out of great-power wars, but a northern league led from Dublin is another matter. The foreign ministry prepares a memorandum setting out the joint defence and trade arrangements. The text is delivered by the legation in Stockholm, and the time for reply is left open."
 IRE_invite_norway:0 "Invite Norway"
 IRE_invite_norway_desc:0 "Norway's merchant fleet and long Atlantic coast would carry the alliance far beyond the Baltic. The foreign ministry drafts the invitation, with articles on port assistance attached. The text is delivered by the legation in Oslo, and the articles may be settled in stages."
 IRE_invite_denmark:0 "Invite Denmark"
 IRE_invite_denmark_desc:0 "Copenhagen holds the gates of the Baltic. The foreign ministry prepares the invitation with understandings on joint navigation and passage through the straits, and awaits the Danish reply. The text is delivered by the legation in Copenhagen, with a separate protocol on passage through the straits."
 IRE_invite_finland:0 "Invite Finland"
 IRE_invite_finland_desc:0 "Helsinki forms its own judgement of the east. Ireland offers a guarantee, the terms drawn up jointly by the foreign and defence ministries and delivered to the Finnish legation. The guarantee covers territory and airspace, its term to be settled separately."
 # ==================== A-line event pack (ire_nw) ====================
 ire_nw.1.t:0 "The Address at Athlone"
 ire_nw.1.d:0 "The scaffolding about the new transmitter at Athlone was hardly down when de Valera stood before the microphone. He did not speak of the war, of Britain, or of the Border, but of thirty-two counties sharing one economy, one language and one future. The hall understood him; the script is kept by the government information bureau."
 ire_nw.1.a:0 "Broadcast the address nationwide"
 ire_nw.1.b:0 "Give it only to the local press"
 ire_nw.2.t:0 "The Twelfth of July"
 ire_nw.2.d:0 "The Orange lodges have announced their usual July routes, and Catholic districts are already boarding up windows. The cabinet in Dublin awaits an answer: whether the new government can keep order without looking like London's policeman. The Commissioner's deployment plan and the district reports are before the cabinet, which is asked to rule on the marches."
 ire_nw.2.a:0 "Ban the marches."
 ire_nw.2.b:0 "Permit them and double the police."
 ire_nw.2.c:0 "Answer with a counter-march."
 ire_nw.3.t:0 "A Wire from Boston"
 ire_nw.3.d:0 "A committee of Boston Irish businessmen has remitted a sum to Dublin for the national cause, with a memorandum on its use and a list of preferred candidates, and asks to appoint a supervisor of expenditure. The Treasury has received the money. The finance committee of the Dail requires a statement of the terms accepted, and the cabinet is asked for its direction."
 ire_nw.3.a:0 "Take it and fund the campaign"
 ire_nw.3.b:0 "Place it in a national fund"
 ire_nw.4.t:0 "The Economic War"
 ire_nw.4.d:0 "The tariff war with London is in its fifth year. Cattle farmers in the west sell at a loss, and the department's purchasing stations take the stock at the floor price; Dublin refuses the land annuities, and the Treasury keeps that revenue on a separate line. Neither side has offered new terms, the talks remain technical, and no date is set for the next round."
 ire_nw.4.a:0 "Hold the line."
 ire_nw.4.b:0 "Seek a settlement."
 ire_nw.5.t:0 "The Workers' Petition"
 ire_nw.5.d:0 "A delegation from the Belfast shipyards has come to Dublin. They are Protestants and trade unionists, and they ask one thing: after unification, will the yards still have work. Industry and Commerce has minuted the order books, the employment rolls and the union's representations for the cabinet, and the delegates remain in Dublin for a reply."
 ire_nw.5.a:0 "Guarantee the yards' output."
 ire_nw.5.b:0 "Give Catholic workers the jobs first."
 ire_nw.6.t:0 "The Gaelic Revival"
 ire_nw.6.d:0 "The Gaelic League reports that fewer than one child in five in the Free State can hold a conversation in Irish. The Department of Education drafts a scheme placing the language in the required courses of the training colleges and the national schools. League officers tour the western counties, collecting books and teachers. The primers are printed by the Department of Education."
 ire_nw.6.a:0 "Fund the Gaelic schools."
 ire_nw.6.b:0 "Leave it to the volunteers."
 ire_nw.7.t:0 "The Dublin Convention"
 ire_nw.7.d:0 "For the first time the government has brought all parties into one hall: the trades unions, the churches, the opposition, and delegates from Boston and Glasgow. The organising office answers to the Department of the Taoiseach, the agenda and the list of delegates were cleared by the cabinet, and separate invitations go to unionist workers and clergy."
 ire_nw.7.a:0 "Invite unionists and clergy"
 ire_nw.7.b:0 "Hold a nationalist rally only"
 ire_nw.8.t:0 "Belfast's Answer"
 ire_nw.8.d:0 "Thirty days after the Dublin Convention closed, Belfast gave its answer. What it amounts to depends on who sat in the hall that day: a proposal of settlement, or a declaration of resistance. The Governor's office has sent the full text to Dublin, sealed with the negatives. The four blocs have it before them."
 ire_nw.8.a:0 "Publish the photographs"
 ire_nw.8.b:0 "Take no notice"
 ire_nw.9.t:0 "A Note from London"
 ire_nw.9.d:0 "The Dominions Office sends a carefully worded note: the United Kingdom does not recognise any unilateral plebiscite in Northern Ireland, and Dublin is asked to state its position before replying. The text comes through the legation at Ottawa, with copies to the foreign ministry and the cabinet. The note sets no deadline; it closes by awaiting a reply."
 ire_nw.9.a:0 "Publish the note in full."
 ire_nw.9.b:0 "Lock the note in a drawer."
 ire_nw.9.c:0 "Publish it and answer it in public."
 ire_nw.9.e:0 "Accept London's observers."
 ire_nw.10.t:0 "The Green Flag on Fifth Avenue"
 ire_nw.10.d:0 "The St Patrick's Day parade has been held on Fifth Avenue, with the pavements crowded along the route. The reviewing stand was occupied by delegates from Dublin, no place having been found for the Tammany politicians, and the collection buckets were marked For the North. The delegation's collection book has been returned to the Foreign Ministry, the sums still to be checked."
 ire_nw.10.a:0 "Turn it into political capital"
 ire_nw.10.b:0 "Endow a cultural fund"
 ire_nw.11.t:0 "The Chicago Machine"
 ire_nw.11.d:0 "The Cook County machine sends word through the Irish societies of an arrangement: a direct channel to the White House, at the price of Dublin publicly turning to Washington now. The foreign ministry weighs the effect on its declaration of neutrality and sends the memorandum to De Valera himself, with a copy to the legation in Washington."
 ire_nw.11.a:0 "Accept the machine's embrace."
 ire_nw.11.b:0 "Keep your distance."
 ire_nw.12.t:0 "The World Congress of the Irish"
 ire_nw.12.d:0 "Delegates from four continents fill the hall: farmers from Mayo, policemen from Boston, nurses from Buenos Aires, and a few men who fought in Spain. The session runs a week, with emigrant affairs, shipping and publicity as its committees; the drafts go to External Affairs and are printed after the close."
 ire_nw.12.a:0 "Adopt the Dublin Declaration."
 ire_nw.12.b:0 "Keep to practical clauses."
 ire_nw.19.t:0 "The Fishermen's Brotherhood"
 ire_nw.19.d:0 "William Coaker's name still hangs in the Fishermen's Protective Union hall of every outport in Newfoundland. Dublin sends organisers north with money, wireless sets and one sentence: the price of fish is set in London, the future need not be. The hall at St John's has cleared rooms for lodging and business. Money and equipment are forwarded through St John's."
 ire_nw.19.a:0 "Rebuild the Brotherhood."
 ire_nw.19.b:0 "Fund the St John's radio station."
 ire_nw.20.t:0 "The Meeting at the Fish Market"
 ire_nw.20.d:0 "In the shade of the drying flakes the fishermen heard the official from Dublin set out subsidies, cold storage and a guaranteed price. An old skipper asked who would pay. The party noted the question, and a reply is being drafted by the Department of Agriculture with the Department of Finance for the cabinet."
 ire_nw.20.a:0 "Promise the fishery subsidy"
 ire_nw.20.b:0 "Issue a statement only"
 ire_nw.21.t:0 "Catholic and Orange"
 ire_nw.21.d:0 "The referendum has revived old quarrels. In St John's, fishermen who have worked the same wharves for generations now mind which hall they drink in. The churches mediate, the unions have split their branches by denomination and sent the lists to the city hall, and the commissioner has doubled the patrols before the halls."
 ire_nw.21.a:0 "Ask the churches to mediate"
 ire_nw.21.b:0 "Back the Catholic unions"
 ire_nw.22.t:0 "London Objects"
 ire_nw.22.d:0 "The Governor's office at St John's has issued a statement that the future of Newfoundland is a matter for the United Kingdom and not for the government in Dublin. It was issued over the Governor's signature in wording identical to that used in London. The text has been examined by the law officers, and the Foreign Ministry asks how it should be answered."
 ire_nw.22.a:0 "Protest in public"
 ire_nw.22.b:0 "Negotiate in private"
 ire_nw.23.t:0 "The Petition Fleet"
 ire_nw.23.d:0 "A flotilla of fishing boats enters St John's harbour with green flags and petitions lashed to the masts, the crews asking to read the text at the quay. The harbourmaster refers the matter to Government House, and the police form up ashore without interfering. Copies of the petition are filed with the fisheries department, no formal answer has come from Newfoundland, and Government House has asked first for the names of the organisers."
 ire_nw.23.a:0 "Send a naval escort."
 ire_nw.23.b:0 "Send a message of support."
 ire_nw.24.t:0 "The Radio War"
 ire_nw.24.d:0 "In winter only radio reaches the outports. The BBC's Newfoundland service speaks of the Empire; a new station at St John's wants to speak of the island. Both want Dublin's money. Posts and Telegraphs has tabulated power, coverage and rates, and the governor's despatch goes to the cabinet with them."
 ire_nw.24.a:0 "Fund the island station."
 ire_nw.24.b:0 "Let the BBC keep the airwaves."
 ire_nw.25.t:0 "The Eve of the Newfoundland Referendum"
 ire_nw.25.d:0 "The ballot boxes are stacked in the courthouse corridor and the last broadcast has gone out. In the outports families sit by the wireless, taking the weather first and the count afterwards, while Church and Fishermen's League officers work the wharves. One night of campaigning remains; the caravans are still on the snow roads and the printers are running off handbills."
 ire_nw.25.a:0 "Bring Coaker's old organisers back to the island."
 ire_nw.25.b:0 "Promise a fisheries fund."
 ire_nw.25.c:0 "Leave the decision to the islanders."
 ire_nw.30.t:0 "Midnight in Ottawa"
 ire_nw.30.d:0 "The Governor General signs the last paper, and a few minutes after midnight the Union Jack comes down over Parliament Hill. Ottawa's streets are quiet; the guard removes the halyards by the book. In Dublin the newspapers are printing special editions, and External Affairs has drafted a note to Ottawa for the cabinet's approval. Government House will issue its notice the following morning."
 ire_nw.30.a:0 "Send an envoy to Ottawa."
 ire_nw.30.b:0 "Celebrate in Dublin."
 ire_nw.31.t:0 "The Voice of Quebec"
 ire_nw.31.d:0 "The bishops and the provincial premier of Quebec have made one demand: if Canada leaves the Empire, French Canada must not merely exchange one distant government for another. The Department of External Affairs has taken advice through the charge in Ottawa, and the reply, settled by the cabinet, goes to Quebec."
 ire_nw.31.a:0 "Guarantee French and Catholic rights"
 ire_nw.31.b:0 "Build a centralised state"
 ire_nw.32.t:0 "A Warning from Washington"
 ire_nw.32.d:0 "The State Department summoned the Irish minister. The words were few: the United States will not tolerate a hostile power on Canada's border, nor a new empire. Washington was not asking but informing. The record has gone to the cabinet, the minister is told to remain at his post, and the Dail has asked for an account."
 ire_nw.32.a:0 "Give Washington assurances"
 ire_nw.32.b:0 "Disregard the warning"
 ire_nw.33.t:0 "After the Annexation"
 ire_nw.33.d:0 "The last Governor General has left Government House, the Irish flag flies over the parliament buildings at Ottawa, and the parliament no longer sits. The affairs of the nine provinces and two territories are now in the hands of commissioners sent from Dublin. The provinces ask that their powers be defined, and the cabinet must rule on how they are to be governed."
 ire_nw.33.a:0 "Keep a Canadian assembly"
 ire_nw.33.b:0 "Govern directly from Dublin"
 ire_nw.34.t:0 "The New World Proclamation"
 ire_nw.34.d:0 "The proclamation is read from the steps of Dublin Castle in Irish, English and French. It names no empire and claims no crown; it states only that the Irish nation now runs from the Atlantic provinces to the Great Lakes, and that its capital is Dublin. The text is filed by the prime minister's office, and copies go to the dominions and the missions abroad."
 ire_nw.34.a:0 "Convene an Atlantic parliament."
 ire_nw.34.b:0 "Review the army in Phoenix Park."
 ire_nw.40.t:0 "Stockholm Hesitates"
 ire_nw.40.d:0 "The Swedish foreign minister is polite, cautious and immovable. Sweden has spent a century avoiding great-power wars, and a league led from Dublin looks to him like another great power with a smaller population. He asked what Ireland could offer that neutrality could not; the exchange is minuted and points of reply are being drafted."
 ire_nw.40.a:0 "Offer cheap credit."
 ire_nw.40.b:0 "Let time prove the case."
 ire_nw.41.t:0 "The Norwegian Merchant Fleet"
 ire_nw.41.d:0 "Norway's merchant fleet is the fourth largest in the world, and half of it is in the Atlantic when the war begins. Oslo would rather sell than lose the ships; Dublin would rather buy than build. The talks are held in Stockholm, and age, tonnage and the retention of crews are settled clause by clause. Most of the crews are willing to stay with the ships."
 ire_nw.41.a:0 "Buy the ships outright."
 ire_nw.41.b:0 "Ask for a lease."
 ire_nw.42.t:0 "The Finnish Front"
 ire_nw.42.d:0 "Finland is at war again and every government is watching. Helsinki asks whether the guarantees of the New World Alliance mean more than paper. The Department of External Affairs has passed the Finnish note to the cabinet with the staff's estimate of forces, and the cabinet is asked whether volunteers are to be sent."
 ire_nw.42.a:0 "Send the Wild Geese"
 ire_nw.42.b:0 "Send medicine and supplies only"
 ire_nw.43.t:0 "The Northern Exercise"
 ire_nw.43.d:0 "For the first time Irish, Swedish, Norwegian and Danish officers have stood about one map. The exercise is small: a few destroyers, a few squadrons. The Naval Service has notified the waters, wireless frequencies and port courtesies, and the observers' reports are due within a month of the close."
 ire_nw.43.a:0 "Hold the joint exercise"
 ire_nw.43.b:0 "Keep the exercise quiet"
 ire_nw.50.t:0 "The Green Flag at Jarama"
 ire_nw.50.d:0 "The Irish volunteers reached the Jarama valley in the hardest winter, their clothing gathered from several sources and their rifles of mismatched patterns, while the International Brigades had waited on the position for days. Their officers reported to brigade headquarters and asked for a sector, and Dublin requires the order of battle and the casualties returned weekly."
 ire_nw.50.a:0 "Send them into the line"
 ire_nw.50.b:0 "Keep them in reserve"
 ire_nw.51.t:0 "Letters from the Prison Camp"
 ire_nw.51.d:0 "A bundle of letters reaches Dublin from a Nationalist prison camp. The writers ask for cigarettes and news, and for a guarantee that their families will not go hungry. The censor has read each one and struck out the camp addresses and names. The prisoners' branch registers the letters by class, passes the list of families to the local relief committees, and drafts the replies itself."
 ire_nw.51.a:0 "Work through the Red Cross."
 ire_nw.51.b:0 "Print them as martyrs."
 ire_nw.52.t:0 "The Wild Geese Return"
 ire_nw.52.d:0 "The surviving volunteers have come home on a freighter from Bordeaux. They are thinner, quieter and better soldiers than when they left. The army wants them; the government is not sure it can afford them. Defence has listed names, ranks and arrears for settlement with Finance, and terms of resettlement are to be published."
 ire_nw.52.a:0 "Integrate them into the regular army."
 ire_nw.52.b:0 "Demobilise and pension them."
 ire_nw.60.t:0 "The Atlantic Convoy Crisis"
 ire_nw.60.d:0 "A convoy bound for Cork is scattered by U-boats and the escorts fail to close the ring. The Admiralty asks Dublin for escorts; the cabinet asks what is left of the navy. The naval staff counts the serviceable ships overnight and sends the list to Defence; the remaining sailings must be reordered on it. The survivors have been brought into Cork by trawlers."
 ire_nw.60.a:0 "Escort it with everything."
 ire_nw.60.b:0 "Keep the fleet in port."
 ire_nw.61.t:0 "The Destroyer Terms"
 ire_nw.61.d:0 "Washington proposes to extend its neutrality patrol into Irish waters and to station aircraft at Shannon. The terms are generous, and they would tie the Atlantic route to the United States. The Department of External Affairs and the Department of Defence are considering them together, the Naval Service has reported on port use, and the cabinet is asked for an answer."
 ire_nw.61.a:0 "Accept the American patrol"
 ire_nw.61.b:0 "Decline"

