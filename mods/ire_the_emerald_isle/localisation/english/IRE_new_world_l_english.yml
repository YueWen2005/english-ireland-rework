 # ===== National Union: postwar domestic and international environment 190-199 =====
 ire_nw.190.t:0 "The Postwar European Conference"
 ire_nw.190.d_red:0 "With Berlin fallen, Europe's red partners and old allies both look to Dublin. New World Ireland must decide which table it sits at in postwar Europe."
 ire_nw.190.d_new_world:0 "With Berlin fallen, Washington and London begin arranging postwar Europe. Dublin receives an invitation, but the seat and the terms depend on which side Ireland is willing to stand with."
 ire_nw.190.d_neutral:0 "With Berlin fallen, Europe is reshuffled. Dublin wants neither the red bloc nor complete alignment with Washington; for the first time, the third force has a real stage."
 ire_nw.190.d:0 "With Berlin fallen, the nations of Europe line up again among the ruins. Dublin has not chosen a camp, but the postwar conference will not wait for Ireland."
 ire_nw.190.a:0 "Host a European reconciliation conference."
 ire_nw.190.a_tt:0 "Political power -50, stability +5%; Nordic and Low Countries opinion +15, US/Soviet/British opinion +10; establish the 'reconciliation' tone."
 ire_nw.190.b:0 "Back the great-power settlement."
 ire_nw.190.b_tt:0 "Stability +5%; US/Soviet opinion +20, British opinion +10, Nordic and Low Countries opinion -10; establish the 'great-power settlement' tone."
 ire_nw.190.c:0 "Ireland first."
 ire_nw.190.c_tt:0 "Stability +5%, war support +5%; US/Soviet/British opinion -10; establish the 'Ireland first' tone."

 ire_nw.191.t:0 "The Occupation and Division of Germany"
 ire_nw.191.d_reconciliation:0 "With Germany occupied, Europe's reconciliation camp wants order restored quickly; but the occupation zones have already cut Europe in two."
 ire_nw.191.d_greatpowers:0 "With Germany occupied, Washington, Moscow and London disagree over the zones. Dublin must choose the more useful position between the two occupation blocs."
 ire_nw.191.d_ireland:0 "With Germany occupied, Dublin cares about one thing only: Ireland must not become a bargaining chip in a great-power deal again."
 ire_nw.191.d:0 "With Germany occupied, Europe's division is already drawn on the occupation map. Dublin must decide how to face the new German question."
 ire_nw.191.a:0 "Support the Western zones."
 ire_nw.191.a_tt:0 "Parliament influence +4, unionist confidence +3; US opinion +20, British opinion +15, Soviet opinion -20; establish a pro-Western position."
 ire_nw.191.b:0 "Recognise the Soviet zone."
 ire_nw.191.b_tt:0 "Labour influence +4, IRA influence +3, stability -5%; Soviet opinion +20, US/British opinion -15; establish a pro-Soviet position."
 ire_nw.191.c:0 "Ireland stays neutral."
 ire_nw.191.c_tt:0 "Stability +5%, war support +5%; US/Soviet/British opinion -10; establish a neutral position."

 ire_nw.192.t:0 "The US-Soviet Split"
 ire_nw.192.d:0 "Less than a year after the war, Washington and Moscow are already testing each other. Dublin can no longer pretend it can court both."
 ire_nw.192.a:0 "Lean toward Washington."
 ire_nw.192.a_tt:0 "Parliament influence +4, unionist confidence +3, labour influence -3; US opinion +25, Soviet opinion -20."
 ire_nw.192.b:0 "Lean toward Moscow."
 ire_nw.192.b_tt:0 "Labour influence +5, IRA influence +3, Church confidence -3; Soviet opinion +25, US opinion -20."
 ire_nw.192.c:0 "Non-aligned."
 ire_nw.192.c_tt:0 "Stability +5%, war support +5%; US/Soviet opinion -10."

 ire_nw.193.t:0 "The Red Bloc Splits"
 ire_nw.193.d_red:0 "The red bloc splits for the first time after the war: Moscow demands obedience, while the Western red allies want their own road. Dublin must choose a side."
 ire_nw.193.d:0 "Red France/Britain and Moscow disagree over the postwar road. Dublin has not turned red officially, but it is already being asked to take a position."
 ire_nw.193.a:0 "Stand with Moscow."
 ire_nw.193.a_tt:0 "Labour influence +4, IRA influence +3, stability -5%; Soviet opinion +25, red France/Britain opinion -15."
 ire_nw.193.b:0 "Stand with the Western red allies."
 ire_nw.193.b_tt:0 "Labour influence +5, Church confidence -2, stability +5%; red France/Britain opinion +25, Soviet opinion -15."
 ire_nw.193.c:0 "Mediate."
 ire_nw.193.c_tt:0 "Labour influence +2, stability +5%, political power -50; Soviet and red France/Britain opinion +10."

 ire_nw.194.t:0 "The Marshall Plan"
 ire_nw.194.d:0 "Washington proposes a European reconstruction programme. The money is generous, and the condition is clear: recipients must keep Moscow at a political distance."
 ire_nw.194.a:0 "Accept the aid."
 ire_nw.194.a_tt:0 "Parliament influence +4, unionist confidence +3, labour influence -3; US opinion +30, Soviet opinion -15; gain 'American Loan' for 365 days."
 ire_nw.194.b:0 "Negotiate the terms."
 ire_nw.194.b_tt:0 "Parliament influence +2, stability +5%, political power -25; US opinion +10."
 ire_nw.194.c:0 "Refuse."
 ire_nw.194.c_tt:0 "Labour influence +3, stability +5%, war support +5%; US opinion -25."

 ire_nw.195.t:0 "The Empires Crumble"
 ire_nw.195.d:0 "The war has weakened the old empires. London's and Paris's colonies begin to demand independence, and Dublin must decide whether to support self-determination or the old order."
 ire_nw.195.a:0 "Support colonial independence."
 ire_nw.195.a_tt:0 "Political power +25, stability +5%; British/French opinion -15, US/Soviet opinion +10."
 ire_nw.195.b:0 "Support the European empires."
 ire_nw.195.b_tt:0 "Political power -25, stability +5%, labour influence -3, Church confidence +3; British/French opinion +20."
 ire_nw.195.c:0 "Trade neutrality."
 ire_nw.195.c_tt:0 "Political power +25, stability +5%; gain 'Postwar Trade' for 365 days."

 ire_nw.196.t:0 "The Veterans Return"
 ire_nw.196.d:0 "The war is over, and tens of thousands of Irish soldiers return home. Housing, work and training lag behind, and the veterans' patience is running out."
 ire_nw.196.a:0 "Generous resettlement."
 ire_nw.196.a_tt:0 "Political power -50, stability +5%, manpower +5000; gain 'Veteran Resettlement' for 365 days."
 ire_nw.196.b:0 "Employment programme."
 ire_nw.196.b_tt:0 "Political power -25, stability +5%, manpower +2500; gain 'Industrial Conversion' for 365 days."
 ire_nw.196.c:0 "Austerity."
 ire_nw.196.c_tt:0 "Political power +25, stability -5%, manpower +2500."

 ire_nw.197.t:0 "Reconstruction and Emigration"
 ire_nw.197.d:0 "Postwar reconstruction needs money and people. Dublin can choose housing, return migration or an austerity budget."
 ire_nw.197.a:0 "Housing and reconstruction."
 ire_nw.197.a_tt:0 "Political power -50, stability +5%; gain 'Postwar Reconstruction' for 365 days."
 ire_nw.197.b:0 "Encourage return migration."
 ire_nw.197.b_tt:0 "Political power -25, stability +5%, manpower +10000."
 ire_nw.197.c:0 "Austerity budget."
 ire_nw.197.c_tt:0 "Political power +25, stability -5%."

 ire_nw.198.t:0 "The Third Force Summit"
 ire_nw.198.d:0 "Both blocs court Dublin, but the third force now has real room. Ireland can host a non-aligned summit."
 ire_nw.198.a:0 "Host a non-aligned summit."
 ire_nw.198.a_tt:0 "Political power -50, stability +5%, war support +5%; gain 'Third Force Coordination' for 365 days."
 ire_nw.198.b:0 "Equidistant trade."
 ire_nw.198.b_tt:0 "Political power +25, stability +5%; gain 'Postwar Trade' for 365 days."
 ire_nw.198.c:0 "Armed neutrality."
 ire_nw.198.c_tt:0 "Political power -25, war support +5%, army experience +50; gain 'Armed Neutrality' for 365 days."

 ire_nw.199.t:0 "The Postwar Security Framework"
 ire_nw.199.d:0 "A new great-power security framework is taking shape. Dublin can join it, stay independent, or promote a European neutral zone."
 ire_nw.199.a:0 "Join the new security framework."
 ire_nw.199.a_tt:0 "Political power -25, stability +5%, war support +5%; US/Soviet/British opinion +10."
 ire_nw.199.b:0 "Stay independent."
 ire_nw.199.b_tt:0 "Stability +5%, war support +5%; US/Soviet opinion -10."
 ire_nw.199.c:0 "Promote a European neutral zone."
 ire_nw.199.c_tt:0 "Political power -50, stability +5%; US/Soviet opinion -5, Nordic and Low Countries opinion +15."

 ire_nw.200.t:0 "The Fall of Moscow"
 ire_nw.200.d:0 "Moscow has fallen, and the Soviet line in Europe is collapsing. Dublin extends an offer: the European Hope will take in the Soviet Union and its satellites."
 ire_nw.200.a:0 "Join the European Hope with all our satellites."
 ire_nw.200.a_tt:0 "The Soviet Union, its satellites and allies join the European Hope; political power -25, stability +5%, war support +10%; Irish opinion +40."
 ire_nw.200.b:0 "Only the Soviet Union joins."
 ire_nw.200.b_tt:0 "Only the Soviet Union joins the European Hope; stability +5%, war support +5%; Irish opinion +25."
 ire_nw.200.c:0 "Refuse and fight on alone."
 ire_nw.200.c_tt:0 "Stability +5%, war support +5%; Irish opinion -20."

 ire_nw.201.t:0 "The Next Step for National Unity"
 ire_nw.201.d:0 "The National Unity Programme is complete, but the National Unity Government has not yet convened. The four factions are still waiting for Dublin's invitation; you can convene it directly here."
 ire_nw.201.a:0 "Convene the National Unity Government now."
 ire_nw.201.a_tt:0 "Complete the focus 'Convene the National Unity Government', form the National Union, and trigger its formation event."
 ire_nw.201.b:0 "Discuss it later."
 ire_nw.201.b_tt:0 "Do not form it immediately; the focus can still be completed manually."
