 IRE_new_world_alliance:0 "New World Alliance"

 # ===== Trigger tooltips =====
 IRE_tt_nf_support_50:0 "Newfoundland support above 49 (the Fishermen's Brotherhood decision adds +8 each time)"
 IRE_tt_diaspora_60:0 "Celtic diaspora network above 59"
 IRE_tt_diaspora_100:0 "Celtic diaspora network above 99"
 IRE_tt_canada_annexed:0 "British North America has been annexed"
 IRE_tt_green_dollar_partner:0 "Requires the Boston or Buenos Aires branch"
 IRE_tt_wild_geese_source:0 "Requires the Wild Geese, Irish Division or Green Legion branch"
 IRE_tt_atlantic_fleet_ports:0 "Requires Newfoundland or the Treaty Ports"
 IRE_tt_air_bridge_partner:0 "Requires Newfoundland or the Boston branch"
 IRE_tt_tammany_partner:0 "Requires the Boston branch"

 # ===== New focus effect tooltips =====
 IRE_effect_canada_annex:0 "Canada is annexed together with its army: 2 off-map civilian factories, 2 off-map military factories and 1 off-map dockyard. Britain and the USA are angered."
 IRE_effect_new_world_ireland:0 "All 23 Canadian states become cores of Ireland, plus 3 off-map civilian factories. The country is renamed New World Ireland."
 IRE_effect_nordic_bridge:0 "+40 opinion with every independent Nordic state."
 IRE_effect_nordic_alliance:0 "Founds the New World Alliance with open membership rules (or, if Ireland already leads a faction, uses it). Friendly Nordic states join immediately; the rest receive an Irish guarantee."

 # ===== Nordic decisions =====
 IRE_nordic_aid:0 "Nordic Aid Package"
 IRE_nordic_aid_desc:0 "Ship grain, coal and medical supplies to the northern democracies. Every independent Nordic state gains +15 opinion of Ireland."
 IRE_invite_sweden:0 "Invite Sweden"
 IRE_invite_sweden_desc:0 "Sweden keeps out of great-power wars, but a northern league led from Dublin is another matter. Requires Swedish opinion above 49 and Sweden to be outside any faction."
 IRE_invite_norway:0 "Invite Norway"
 IRE_invite_norway_desc:0 "Norway's merchant fleet and its Atlantic coast would give the alliance reach far beyond the Baltic. Requires Norwegian opinion above 49 and Norway to be outside any faction."
 IRE_invite_denmark:0 "Invite Denmark"
 IRE_invite_denmark_desc:0 "Copenhagen controls the gates of the Baltic. Requires Danish opinion above 49 and Denmark to be outside any faction."
 IRE_invite_finland:0 "Invite Finland"
 IRE_invite_finland_desc:0 "Helsinki looks east with justified suspicion. An Irish guarantee is better than none. Requires Finnish opinion above 49 and Finland to be outside any faction."
 # ==================== A-line event pack (ire_nw) ====================
 ire_nw.1.t:0 "The Speech at Athlone"
 ire_nw.1.d:0 "The new transmitter at Athlone is barely finished when de Valera stands before the microphones. He does not mention war, or Britain, or the Border. He speaks of thirty-two counties as one economy, one language, one future. The crowd understands him perfectly."
 ire_nw.1.a:0 "Broadcast it nationwide."
 ire_nw.1.b:0 "Let the local papers carry it."
 ire_nw.2.t:0 "The Twelfth"
 ire_nw.2.d:0 "The Orange lodges announce their usual July marches through Belfast. Catholic districts are already boarding up windows. In Dublin, the cabinet waits to see whether the new government can keep the peace without looking like London's policeman."
 ire_nw.2.a:0 "Ban the marches."
 ire_nw.2.b:0 "Permit them, and double the police."
 ire_nw.2.c:0 "Answer with a counter-march."
 ire_nw.3.t:0 "A Wire from Boston"
 ire_nw.3.d:0 "A committee of Boston Irish businessmen offers Dublin a substantial sum for the national cause. The money is welcome. The strings attached - a say in how it is spent, and a list of preferred candidates - are less so."
 ire_nw.3.a:0 "Take the money and spend it on the campaign."
 ire_nw.3.b:0 "Put it into a national fund, with no strings."
 ire_nw.4.t:0 "The Economic War"
 ire_nw.4.d:0 "The tariff war with London is in its fifth year. Cattle farmers in the west are selling at a loss while Dublin insists it will not surrender the annuities. Something has to give."
 ire_nw.4.a:0 "Hold the line."
 ire_nw.4.b:0 "Seek a settlement."
 ire_nw.5.t:0 "The Workers' Petition"
 ire_nw.5.d:0 "A delegation from the Belfast shipyards arrives in Dublin. They are Protestants, union men, and they have one question: after unification, will their yards still have work? The answer will decide whether the Border is a line on a map or a wall in people's minds."
 ire_nw.5.a:0 "Guarantee the yards."
 ire_nw.5.b:0 "Promise the jobs to Catholic workers first."
 ire_nw.6.t:0 "The Gaelic Revival"
 ire_nw.6.d:0 "The Gaelic League reports that fewer than one child in five in the Free State can hold a conversation in Irish. A language is not saved by speeches alone."
 ire_nw.6.a:0 "Fund the Gaelic schools."
 ire_nw.6.b:0 "Leave it to the volunteers."
 ire_nw.7.t:0 "The Dublin Convention"
 ire_nw.7.d:0 "For the first time, the government invites everyone into the same hall: trades unions, the Church, the opposition, and delegates from Boston and Glasgow. The question is not whether Ireland wants the North, but whether the North is allowed to see an Ireland it could live in."
 ire_nw.7.a:0 "Invite unionist workers and churchmen."
 ire_nw.7.b:0 "Hold a nationalist rally only."
 ire_nw.8.t:0 "Belfast Answers"
 ire_nw.8.d:0 "Thirty days after the Dublin Convention, Belfast gives its answer. Whether it comes as an olive branch or a bonfire depends on who was in the hall."
 ire_nw.8.a:0 "Let the photographs do the work."
 ire_nw.8.b:0 "Ignore it."
 ire_nw.9.t:0 "A Note from London"
 ire_nw.9.d:0 "The Dominions Office sends a careful note: the United Kingdom does not recognise any unilateral plebiscite in Northern Ireland. The wording is polite. The implication is not."
 ire_nw.9.a:0 "Publish the note and let the country see it."
 ire_nw.9.b:0 "Lock it in a drawer."
 ire_nw.9.c:0 "Publish it and answer it."
 ire_nw.9.e:0 "Offer London observers."
 ire_nw.10.t:0 "The Green Flag on Fifth Avenue"
 ire_nw.10.d:0 "Half a million people line Fifth Avenue for the St Patrick's Day parade. For the first time the reviewing stand is filled not with Tammany politicians but with delegates from Dublin, and the collection buckets are marked For the North."
 ire_nw.10.a:0 "Turn the collection into political capital."
 ire_nw.10.b:0 "Endow a cultural fund."
 ire_nw.11.t:0 "The Chicago Machine"
 ire_nw.11.d:0 "The Cook County machine offers something no Dublin government has ever had: a direct line to the White House. The price is a public embrace at the worst possible moment for Irish neutrality."
 ire_nw.11.a:0 "Accept the machine's embrace."
 ire_nw.11.b:0 "Keep your distance."
 ire_nw.12.t:0 "The World Congress of the Irish"
 ire_nw.12.d:0 "Delegates from four continents fill the hall: farmers from Mayo, policemen from Boston, nurses from Buenos Aires, and a handful of men who fought in Spain. For one week, Ireland is not a small island on the edge of Europe."
 ire_nw.12.a:0 "Adopt the Dublin Declaration."
 ire_nw.12.b:0 "Keep it practical."
 ire_nw.19.t:0 "The Fishermen's Brotherhood"
 ire_nw.19.d:0 "William Coaker's name still hangs over a Fishermen's Protective Union hall in every outport of Newfoundland. Dublin sends organisers north with money, radios and a simple message: the price of fish is set in London, but the future need not be."
 ire_nw.19.a:0 "Rebuild the Brotherhood."
 ire_nw.19.b:0 "Fund the St John's radio station."
 ire_nw.20.t:0 "The Fish Market Meeting"
 ire_nw.20.d:0 "In the shadow of the drying flakes, a crowd of fishermen listens to a Dublin man promise subsidies, cold storage and a guaranteed price. An old skipper asks the only question that matters: and who pays?"
 ire_nw.20.a:0 "Promise the subsidy."
 ire_nw.20.b:0 "Issue a statement."
 ire_nw.21.t:0 "Catholic and Orange"
 ire_nw.21.d:0 "The referendum campaign has awakened old quarrels. In St John's, Catholic and Protestant fishermen who have shared the same wharves for generations are suddenly careful about which hall they drink in."
 ire_nw.21.a:0 "Let the churches mediate."
 ire_nw.21.b:0 "Back the Catholic unions."
 ire_nw.22.t:0 "London Objects"
 ire_nw.22.d:0 "The Governor's office in St John's issues a statement: the future of Newfoundland is a matter for the United Kingdom, not for a foreign government in Dublin. The wording is London's, but the ink is the Governor's."
 ire_nw.22.a:0 "Protest publicly."
 ire_nw.22.b:0 "Negotiate quietly."
 ire_nw.23.t:0 "The Petition Fleet"
 ire_nw.23.d:0 "A flotilla of fishing boats sails into St John's harbour flying green flags, petitions lashed to their masts. The harbourmaster does not know whether to salute or to call the police."
 ire_nw.23.a:0 "Send a naval escort."
 ire_nw.23.b:0 "Send a message of support."
 ire_nw.24.t:0 "The Radio War"
 ire_nw.24.d:0 "Radio is the only thing that reaches the outports in winter. The BBC's Newfoundland service speaks of the Empire; a new station in St John's wants to speak of the island. Both need Dublin's money."
 ire_nw.24.a:0 "Fund the island station."
 ire_nw.24.b:0 "Let the BBC keep the airwaves."
 ire_nw.25.t:0 "The Eve of the Referendum"
 ire_nw.25.d:0 "The ballot boxes are stacked in the courthouse and the last broadcast has been made. In the outports, families are listening for the weather and for the result. The campaign has one night left."
 ire_nw.25.a:0 "Bring Coaker's old organisers back to the island."
 ire_nw.25.b:0 "Promise a fisheries fund."
 ire_nw.25.c:0 "Let the island decide."
 ire_nw.30.t:0 "Midnight in Ottawa"
 ire_nw.30.d:0 "The Governor General signs the last paper, and the Union Jack comes down over Parliament Hill a few minutes after midnight. In Ottawa the streets are quiet. In Dublin, the newspapers are already printing special editions."
 ire_nw.30.a:0 "Send an envoy to Ottawa."
 ire_nw.30.b:0 "Celebrate in Dublin."
 ire_nw.31.t:0 "The Voice of Quebec"
 ire_nw.31.d:0 "The Quebec bishops and the provincial premier have one demand: if Canada is to leave the Empire, French Canada must not simply exchange one distant government for another. The answer will decide whether Quebec is a partner or a problem."
 ire_nw.31.a:0 "Guarantee French and Catholic rights."
 ire_nw.31.b:0 "Build a centralised state."
 ire_nw.32.t:0 "A Warning from Washington"
 ire_nw.32.d:0 "The State Department summons the Irish minister. The message is short: the United States will not tolerate a hostile power - or a new empire - on Canada's border. Washington is not asking. It is telling."
 ire_nw.32.a:0 "Reassure Washington."
 ire_nw.32.b:0 "Ignore it."
 ire_nw.33.t:0 "After the Annexation"
 ire_nw.33.d:0 "The last Governor General has left Rideau Hall. In Ottawa, the Irish flag flies over a parliament that no longer meets. The nine provinces and two territories must now be governed from Dublin - or told to govern themselves."
 ire_nw.33.a:0 "Keep a Canadian assembly."
 ire_nw.33.b:0 "Govern directly from Dublin."
 ire_nw.34.t:0 "The New World Proclamation"
 ire_nw.34.d:0 "From the steps of Dublin Castle, the proclamation is read in Irish, English and French. It names no empire and claims no crown. It simply states that the Irish nation now stretches from the Atlantic provinces to the Great Lakes, and that its capital is Dublin."
 ire_nw.34.a:0 "Convene an Atlantic parliament."
 ire_nw.34.b:0 "Review the army in Phoenix Park."
 ire_nw.40.t:0 "Stockholm Hesitates"
 ire_nw.40.d:0 "The Swedish foreign minister is polite, cautious and immovable. Sweden has spent a century avoiding great-power wars; a league led from Dublin looks like another great power with a smaller population. He asks what Ireland can offer that neutrality cannot."
 ire_nw.40.a:0 "Offer cheap credit."
 ire_nw.40.b:0 "Let time prove the case."
 ire_nw.41.t:0 "The Norwegian Merchant Fleet"
 ire_nw.41.d:0 "Norway's merchant fleet is the fourth largest in the world, and half of it is in the Atlantic when the war begins. Oslo would rather sell than lose it, and Dublin would rather buy than build."
 ire_nw.41.a:0 "Buy the ships."
 ire_nw.41.b:0 "Ask for a lease."
 ire_nw.42.t:0 "The Finnish Front"
 ire_nw.42.d:0 "Finland is at war again, and the world is watching. Helsinki asks whether the New World Alliance's guarantees mean anything beyond paper. In Dublin, the question is whether a small island can afford to answer."
 ire_nw.42.a:0 "Send the Wild Geese."
 ire_nw.42.b:0 "Send medicine and supplies."
 ire_nw.43.t:0 "Northern Exercises"
 ire_nw.43.d:0 "For the first time, Irish, Swedish, Norwegian and Danish officers stand around the same map. The exercise is small - a few destroyers, a few squadrons - but the signal is not."
 ire_nw.43.a:0 "Hold the exercise."
 ire_nw.43.b:0 "Keep it quiet."
 ire_nw.50.t:0 "The Green Flag at Jarama"
 ire_nw.50.d:0 "The Irish volunteers reach the Jarama valley in the worst winter in memory. Their uniforms do not match, their rifles are older than most of the men carrying them, and the International Brigades have already been waiting for them for a week."
 ire_nw.50.a:0 "Send them into the line."
 ire_nw.50.b:0 "Keep them behind the line."
 ire_nw.51.t:0 "Letters from the Prison Camp"
 ire_nw.51.d:0 "A bundle of letters reaches Dublin from a Nationalist prison camp. The men ask for cigarettes, news, and a guarantee that their families will not starve. The censor has already read every word."
 ire_nw.51.a:0 "Work through the Red Cross."
 ire_nw.51.b:0 "Print them as martyrs."
 ire_nw.52.t:0 "The Wild Geese Return"
 ire_nw.52.d:0 "The surviving volunteers come home on a freighter from Bordeaux. They are thinner, quieter, and better soldiers than when they left. The army wants them. The government is not sure it can afford them."
 ire_nw.52.a:0 "Integrate them into the regular army."
 ire_nw.52.b:0 "Demobilise and pension them."
 ire_nw.60.t:0 "Convoy Crisis"
 ire_nw.60.d:0 "A convoy bound for Cork has been scattered by U-boats. The Admiralty asks Dublin for escorts; the cabinet asks what is left of the navy. The answer will shape the Atlantic route for the rest of the war."
 ire_nw.60.a:0 "Escort it with everything."
 ire_nw.60.b:0 "Keep the fleet in port."
 ire_nw.61.t:0 "The Destroyers Deal"
 ire_nw.61.d:0 "Washington offers to extend its neutrality patrol into Irish waters and to station aircraft at Shannon. The offer is generous, and it would tie Dublin's Atlantic route to the United States. It would also end the fiction of Irish neutrality."
 ire_nw.61.a:0 "Accept the patrol."
 ire_nw.61.b:0 "Decline."

