 # ===== A-line diplomatic environment events =====
 ire_nw.80.t:0 "The Irish Resolution on Capitol Hill"
 ire_nw.80.d:0 "Washington is debating how far Lend-Lease should reach, and whether Ireland is to be named among the recipients. Irish-American members, with the churches and the unions, have laid petitions before Congress: bring Ireland into the American arsenal. The isolationists press for the original bill. The Speaker has entered the vote on the order paper. The cabinet is asked for its instruction."
 ire_nw.80.a:0 "Bring Ireland into Lend-Lease"
 ire_nw.80.b:0 "Keep to diaspora lobbying"
 ire_nw.80.c:0 "Oppose American entry openly"
 IRE_tt_env_80a:0 "USA: war support +5%, stability -5%, gains Irish-American Lobby for one year; UK opinion +15; Germany opinion -20; Ireland political power +25."
 IRE_tt_env_80b:0 "USA opinion +15, stability +5%; UK opinion +5; Ireland stability +5%."
 IRE_tt_env_80c:0 "USA opinion -15, war support -5%; Germany opinion +15; Ireland stability +5%."

 ire_nw.81.t:0 "The Cracks in the Commonwealth"
 ire_nw.81.d:0 "After Canada is folded into New World Ireland, word of the flag changing at Ottawa passes through the dominions. The parliaments of Australia, New Zealand, South Africa and India ask London one after another to state the ground of its representative authority, and the Dominions Office has not answered. The newspapers print the treaty article by article, and the governors-general transmit the text to their states in the usual form."
 ire_nw.81.a:0 "Invite the dominions to recognise the New World."
 ire_nw.81.b:0 "Reassure London with a trade agreement."
 ire_nw.81.c:0 "Fund anti-colonial forces in the dominions."
 IRE_tt_env_81a:0 "Australia, New Zealand, South Africa, and India opinion +20; UK opinion -15 and stability -5% if democratic, -30 and -5% if Black Britain; Ireland political power +25."
 IRE_tt_env_81b:0 "UK opinion +20 if democratic; -20 and stability -5% if Black Britain; dominion opinion +5; Ireland stability +5%."
 IRE_tt_env_81c:0 "Dominion opinion +30; UK opinion -30 and stability -5% if democratic, -40 and -5% if Black Britain; Ireland war support +5%."

 ire_nw.82.t:0 "The Free French Request"
 ire_nw.82.d:0 "After the fall of Paris a Free French mission reached Dublin and asked for Shannon Airport and Irish ports. Berlin and London are both watching. External Affairs has minuted the note and its conditions, with assessments from the air corps and the harbour board, and laid them before the cabinet for a ruling."
 ire_nw.82.a:0 "Receive the Free French mission"
 ire_nw.82.b:0 "Offer humanitarian aid only"
 ire_nw.82.c:0 "Close the door"
 IRE_tt_env_82a:0 "France opinion +30, war support +5%, gains French Irish Sympathy for one year; UK opinion +10 if democratic, -10 if Black Britain; Germany opinion -20; Ireland stability -5%."
 IRE_tt_env_82b:0 "France opinion +10; Germany opinion +5; Ireland stability +5%."
 IRE_tt_env_82c:0 "France opinion -15; UK opinion -10; Germany opinion +15; Ireland stability +5%."

 ire_nw.83.t:0 "Letters from the Eastern Front, and a Warning from Berlin"
 ire_nw.83.d:0 "After the German invasion of the Soviet Union, Moscow asks through neutral channels whether Dublin will send medical teams and volunteers. External Affairs records the inquiry and makes no reply. Berlin then sends a note warning Dublin not to cross the line, and states that the matter will affect the understanding between the two countries. The cabinet takes both notes at its meeting this week."
 ire_nw.83.a:0 "Organise medical teams and volunteers"
 ire_nw.83.b:0 "Send medical supplies only"
 ire_nw.83.c:0 "Keep to strict neutrality"
 IRE_tt_env_83a:0 "Soviet opinion +30, war support +5%, manpower +5,000; Germany opinion -20; Ireland army experience +25."
 IRE_tt_env_83b:0 "Soviet opinion +10; Germany opinion -5; Ireland stability +5%."
 IRE_tt_env_83c:0 "Soviet opinion -10; Germany opinion +5; Ireland stability +5%."

 ire_nw.84.t:0 "The Line at the White House"
 ire_nw.84.d:0 "With America at war, Washington has delivered a note asking Ireland to accept an American security guarantee, while London presses Dublin to go further. The Department of External Affairs laid both notes before the cabinet, three drafts of a reply were prepared, and the matter stands on this week's order paper for the cabinet to settle, with copies to the legations in Washington and London."
 ire_nw.84.a:0 "Accept the American guarantee"
 ire_nw.84.b:0 "Trade neutrality for aid"
 ire_nw.84.c:0 "Refuse a great-power war"
 IRE_tt_env_84a:0 "USA opinion +20 and guarantees Ireland; UK opinion +15 if democratic, -15 if Black Britain; Germany opinion -20; Ireland stability +5%."
 IRE_tt_env_84b:0 "USA opinion +15, stability +5%; Ireland political power +25, stability +5%; no faction alignment."
 IRE_tt_env_84c:0 "USA opinion -15; UK opinion -10; Germany opinion +10; Ireland stability +5%, war support +5%."

 ire_nw.85.t:0 "The Map of Postwar Europe"
 ire_nw.85.d:0 "With the war in Europe over, three invitations have reached Dublin in succession: Washington and London propose an Atlantic arrangement, the Nordic and Low Countries a regional association, and Moscow an exchange of missions. The Foreign Ministry has laid the three instruments side by side before the cabinet and asks which is to be answered."
 ire_nw.85.a:0 "Press for a Celtic commonwealth"
 ire_nw.85.b:0 "Join the Atlantic camp"
 ire_nw.85.c:0 "Remain armed and neutral"
 IRE_tt_env_85a:0 "Nordic and Low Countries opinion +15; USA opinion +10; UK opinion +10 if democratic, -10 if Black Britain; Ireland stability +5%."
 IRE_tt_env_85b:0 "USA opinion +20 and guarantees Ireland; UK opinion +20 if democratic, -20 if Black Britain; Germany opinion -10; Ireland stability +5%."
 IRE_tt_env_85c:0 "USA, UK, and Soviet opinion -5; Ireland war support +5%, stability +5%."
 IRE_european_hope:0 "Hope of Europe"
 IRE_european_hope_desc:0 "After the fall of Britain, Dublin receives the representatives of exiled governments and resistance organisations and establishes a combined staff. Industrial, scientific and diplomatic resources are pooled under agreement, and liaison officers are accredited to Dublin."
 IRE_european_hope_us:0 "America and the Hope of Europe"
 IRE_european_hope_us_desc:0 "Washington and Dublin conclude a cooperation agreement, and an American technical mission is stationed in Ireland to convert plants and ports. Fuel and equipment arrive by the Atlantic route, and industrial standards are brought into line with American practice."
 IRE_european_hope_france:0 "The French Commune and the Hope of Europe"
 IRE_european_hope_france_desc:0 "The French Commune declines to join the Comintern and concludes terms with Dublin instead. French staff officers and intelligence officers join the combined staff, and a further front is planned by both parties together."
 IRE_european_hope_dominions:0 "Remnants of the Commonwealth"
 IRE_european_hope_dominions_desc:0 "Canada, Australia, New Zealand, South Africa and India leave Black Britain's imperial system one after another and send envoys to Dublin. The missions open permanent offices in the capital, and terms of cooperation are signed with each separately."
 IRE_european_hope_nordics:0 "Nordic Partners"
 IRE_european_hope_nordics_desc:0 "The northern states keep diplomatic and commercial channels open with Dublin without entering the military clauses. A northern department of the Department of External Affairs handles the notes, trade representatives confer quarterly, and tariffs and shipping are set out in a separate annex."
 IRE_us_lend_lease:0 "American Lend-Lease"
 IRE_us_lend_lease_desc:0 "American machines, fuel and loans enter through Irish ports, registered and allotted by the Treasury. Factories rearrange their processes around the new equipment, and the movement of technicians is kept in a separate register. Repayment and interest are settled yearly under the terms of the agreement."
 IRE_british_spy_network_idea:0 "British Internal Network"
 IRE_british_spy_network_idea_desc:0 "G2 and exiled intelligence officers have rebuilt their nets in London, Liverpool and Glasgow to give eyes for landings and risings. The stations work behind trading names, the wireless calls are changed monthly, and the pay is drawn from a secret vote."
 IRE_royal_navy_defection_idea:0 "The Royal Navy Chooses"
 IRE_royal_navy_defection_idea_desc:0 "Royal Navy ships unwilling to fight for Black Britain raise the Irish flag one after another, enter Dublin and Cork, and are taken into the combined fleet. Their crews are kept in their existing organisation, and the officers take a new oath."
 IRE_raf_defection_idea:0 "The RAF Defects"
 IRE_raf_defection_idea_desc:0 "Squadrons of the Royal Air Force have refused the orders of Black Britain and flown to Ireland with their aircraft and experience. The Air Department enrols the men, the machines join the home defence establishment, and the markings are repainted."
 IRE_red_britain_uprising:0 "The Union of Britain Rises"
 IRE_red_britain_uprising_desc:0 "The French Commune and Irish intelligence have raised an insurrection inside Britain, obstructing the railways and the docks at once. Black Britain has been forced to draw off its home garrison to suppress it, and its front-line strength is reduced accordingly."
 IRE_ENG_navy_purge:0 "Royal Navy Purge"
 IRE_ENG_navy_purge_desc:0 "Black Britain distrusts the Royal Navy, and officers and ratings are dismissed and screened in numbers. Fleet coordination and invasion preparation suffer, and sailing schedules are repeatedly revised. Most new captains are transferred from shore appointments, and the handovers are hurried."
 IRE_ENG_air_purge:0 "RAF Purge"
 IRE_ENG_air_purge_desc:0 "Royalist and democratic elements in the RAF are purged one by one, and squadron commanders are changed repeatedly. Gaps appear in air defence and interception, and local troops take over the aerodrome guards."
 IRE_ENG_spy_chaos:0 "British Intelligence Chaos"
 IRE_ENG_spy_chaos_desc:0 "Black Britain's intelligence services are penetrated and purged; files are removed and contacts disappear. Stability, war support and counter-intelligence all suffer, and the stations are reorganised under new standing orders."
 IRE_ENG_britain_crisis:0 "The British Fracture"
 IRE_ENG_britain_crisis_desc:0 "Strikes, street clashes and parliamentary deadlock act on Britain at once. The cabinet loses its majority, London's hold on the counties weakens, and correspondence with the dominions falls into abeyance. The Treasury suspends part of the local grants, and the railways run to a military timetable."
 IRE_european_hope_cat:0 "Hope of Europe"
 IRE_invite_usa:0 "Invite the United States"
 IRE_invite_usa_desc:0 "Washington is ready to back Dublin. The foreign ministry proposes to place the industries and navies of both shores in one alliance, with the terms referred to the two general staffs. The two naval staffs have exchanged views on command and on the use of bases."
 IRE_invite_dominions:0 "Invite the Commonwealth Remnants"
 IRE_invite_dominions_desc:0 "Once Canada, Australia, New Zealand, South Africa and India break from Black Britain's empire, they may join Dublin's alliance. The foreign ministry has the instruments ready for their parliaments."
 IRE_invite_nordics:0 "Invite the Nordic States"
 IRE_invite_nordics_desc:0 "The Nordic states remain neutral in the war. Dublin invites them into the Hope of Europe in exchange for resources, fuel and passage on the northern sea lanes, the text delivered by the foreign ministry. It takes effect on approval by each parliament, and the text is filed with the foreign ministry."
 IRE_british_spy_network:0 "Build a British Internal Network"
 IRE_british_spy_network_desc:0 "G2 has organised exiles, dockworkers and discontented officers of Black Britain into a network across the island. The rolls are kept in separate volumes, the procedure for meeting is fixed by the deputy director, and the couriers are changed without notice."
 IRE_royal_navy_defection:0 "Turn the Royal Navy"
 IRE_royal_navy_defection_desc:0 "Discontent in the navy is turned to account, and ships are brought out of the British establishment to the Irish flag. Contact runs through the seamen's union and retired officers, with the reception ports arranged beforehand."
 IRE_raf_defection:0 "Turn the RAF"
 IRE_raf_defection_desc:0 "Royal Air Force squadrons are to be persuaded to fly to Ireland with their aircraft and experience, weakening the air defence of Black Britain. G2 handles the contacts, the landing grounds and recognition signals are already agreed, and parties stand by at each field."
 IRE_red_london_uprising:0 "Ignite an Uprising in London"
 IRE_red_london_uprising_desc:0 "The French Commune and Irish intelligence prepare an insurrection in Britain itself, aimed at the essential services of London. The plan is drawn by staff officers of both countries, the liaison passing through a third-country port, and the municipality to be taken over by local committees once it begins."
 IRE_red_sabotage:0 "Red Sabotage in Britain"
 IRE_red_sabotage_desc:0 "Railways, ports and armament works are kept under attack, and the timetables are thrown into disorder. The parties are guided by local workers, their material carried by fishing boats, and their reports sent to Dublin monthly."
 IRE_tt_usa_joined:0 "The United States is brought directly into the Irish-led Hope of Europe and grants American industry/naval cooperation."
 IRE_tt_invite_red_france:0 "The French Commune leaves its current faction, joins the Irish-led Hope of Europe, and grants the French Commune cooperation spirit."
 IRE_tt_dominions_joined:0 "Eligible Commonwealth nations join the alliance and grant the Commonwealth Remnants spirit."
 IRE_tt_nordics_joined:0 "Eligible Nordic states join the alliance and grant the Nordic Partners spirit."
 IRE_tt_spy_network:0 "Gain the British Internal Network spirit; Black Britain's stability and war support fall."
 IRE_tt_navy_defection:0 "About a quarter of the Royal Navy transfers to Ireland; Black Britain's naval coordination and invasion preparation fall."
 IRE_tt_raf_defection:0 "Gain about a quarter of the RAF's aircraft and experience; Black Britain's air defence and air combat fall."
 IRE_tt_red_uprising:0 "Triggers a communist uprising/civil war in Britain, forcing Black Britain to fight on two fronts."
 IRE_tt_red_sabotage:0 "Black Britain's stability and war support fall; resistance rises across Britain."
 ENG_black_britain:0 "Fascist Britain"
 ENG_black_britain_DEF:0 "Fascist Britain"
 ENG_black_britain_ADJ:0 "British Fascist"
 POLITICS_ENG_BLACK_BRITAIN_MOSLEY_DESC:0 "Oswald Mosley, leader of the Blackshirts, proclaims a new order for Britain amid the ruins of London."
 IRE_european_hope_alliance:0 "European Hope Alliance"
 ire_nw.86.t:0 "Cracks in the Empire"
 ire_nw.86.d:0 "Not long after the return of Northern Ireland, strikes in London spread from the docks to the coalfields. Some in Parliament speak of a country that cannot be governed, and Blackshirt leaflets appear in the East End. Downing Street denies it all. The daily summaries are bound, and the legation reports weekly without comment."
 ire_nw.86.a:0 "Express public concern"
 ire_nw.86.b:0 "Treat it as London's own affair"
 ire_nw.87.t:0 "Blackshirts March on London"
 ire_nw.87.d:0 "Mosley's followers are gathering on London from every district, and the police have not acted at the barricades. Some Conservative members have begun to speak of the need for a strong man. The Home Office has drafted plans for keeping order and taking over the essential services, and the cabinet is asked to rule whether it will intervene."
 ire_nw.87.a:0 "Fund London in secret"
 ire_nw.87.b:0 "Let them exhaust Britain"
 ire_nw.88.t:0 "Silence in Downing Street"
 ire_nw.88.d:0 "The cabinet has issued no statement for three weeks. The King cancels public engagements, and Army commanders decline interviews. Questions pile up on the order paper, and the telegraph traffic with the dominions grows thin. The legation in London reports that correspondence between the departments has plainly slowed, that the under-secretaries plead superior instructions, and that public engagements are put off."
 ire_nw.88.a:0 "Prepare to evacuate our citizens."
 ire_nw.88.b:0 "Wait and see."
 ire_nw.89.t:0 "The Last Warning"
 ire_nw.89.d:0 "Scotland Yard reports that the fascist militia have received their weapons and that a coup is a matter of days. All Dublin can do is wait for the first shot, the departments keeping their posts under the standing plans. The Home Office asks authority to exchange intelligence with London and awaits the cabinet's direction."
 ire_nw.89.a:0 "Wait for London's outcome"
 ire_nw.90.t:0 "Britain at the Crossroads"
 ire_nw.90.d:0 "After months of strikes, Blackshirt marches and a paralysed cabinet, London's authority has collapsed. Fascist militia and royalists face each other in the streets, Downing Street asks Dublin to take a stand, and the Blackshirts wait for a signal. London's old allies are shut out of the civil war, and German volunteers may appear on the Blackshirt side. The requests and border reports are on file."
 ire_nw.90.a:0 "Keep our distance and let the empire settle it."
 ire_nw.90.b:0 "Secretly back the London government."
 ire_nw.91.t:0 "The Hope of Europe, Kept in Dublin"
 ire_nw.91.d:0 "The black flag rises over London, and the Allies exist in name only. Europe's democratic governments, the exile bodies and the dominions send representatives to Dublin in turn, asking whether they may keep a permanent office there. The foreign ministry has opened two buildings to receive them and has begun drafting a common declaration for circulation among the delegates."
 ire_nw.91.a:0 "Carry the leadership of Europe."
 ire_nw.91.b:0 "Put our own house in order first."
 ire_nw.91.c:0 "Turn to industry and research."
 ire_nw.92.t:0 "A Letter from Roosevelt"
 ire_nw.92.d:0 "Washington will no longer wait for London. Roosevelt has written a long letter: America is ready to lend Dublin its industry, fuel and navy, if Ireland will become the Atlantic anchor. A translation has been circulated, the American terms are annexed, and the matter awaits the cabinet's decision and reply."
 ire_nw.92.a:0 "Bring American industry into the Atlantic system."
 ire_nw.92.b:0 "Accept American military advisers."
 ire_nw.92.c:0 "Discuss terms first."
 ire_nw.93.t:0 "The Birth of the French Commune"
 ire_nw.93.d:0 "After Black Britain takes power the left-right coalition in Paris breaks apart. The Popular Front rises in the factory districts, the French Commune is proclaimed, and civil war follows. Dublin receives an urgent despatch from the legation in Paris; the cabinet meets that evening, External Affairs tables a memorandum on the strength of each party, and the minutes are classified."
 ire_nw.93.a:0 "Openly back the French Popular Front."
 ire_nw.93.b:0 "Ship weapons in secret."
 ire_nw.93.c:0 "Keep Paris at a distance."
 ire_nw.94.t:0 "The Dark Fire in London"
 ire_nw.94.d:0 "The British internal network has signalled: London docks, Scottish factories and Welsh mines have stopped at once, and a red rising has broken out in the heart of Black Britain. On receipt of the report Dublin called the combined staff, the ports went to alert, and intelligence is sent to the Department of External Affairs by the hour."
 ire_nw.94.a:0 "Turn the rising into a second front"
 ire_nw.94.b:0 "Send volunteers"
 ire_nw.94.c:0 "Keep a low profile"
 ire_nw.95.t:0 "The Royal Navy Chooses"
 ire_nw.95.d:0 "A squadron unwilling to fight for Black Britain has left Scapa Flow, hoisted the Irish flag at sea, and been brought into Cork by Irish pilots. Its officers have submitted a joint declaration asking Dublin for shelter. The naval service has prepared berths and stores and asks the cabinet for its answer."
 ire_nw.95.a:0 "Receive the fleet"
 ire_nw.95.b:0 "Receive the convoys and stores"
 ire_nw.95.c:0 "Let the sailors choose"
 ire_nw.96.t:0 "A Network in the Fog"
 ire_nw.96.d:0 "G2 agents establish posts in London, Liverpool and Glasgow behind shipping agencies and freight firms. Black Britain's police close the net more than once; those taken know one another, yet their statements point to the same handful of middlemen. Addresses and call signs change weekly, and the list is held by a single section in Dublin."
 ire_nw.96.a:0 "Expand the network."
 ire_nw.96.b:0 "Send the material to Washington."
 ire_nw.96.c:0 "Stay silent and stand by."
 ire_nw.97.t:0 "The French Commune Joins the Hope of Europe"
 ire_nw.97.d:0 "The French Commune has sent a delegation to Dublin, and the Hope of Europe thereby becomes a coalition across ideologies. The protocol sets out military and economic clauses; External Affairs has entered it on the agenda, with the views of the member states and the law officers' notes, and asks the cabinet to settle the form of accession."
 ire_nw.97.a:0 "Give Paris a seat at the table."
 ire_nw.97.b:0 "Discuss military cooperation first."
 ire_nw.97.c:0 "Write the alliance into a charter."
 ire_nw.98.t:0 "The Defection of the RAF"
 ire_nw.98.d:0 "RAF squadrons take off from Lincolnshire, not to meet the German bombers but to turn west. The watchkeeper at the radar station reports the heading first and the loss afterwards. Dublin and London receive word at the same hour and both check the serials. The coastwatchers report as laid down, and every pilot's name and number must be entered."
 ire_nw.98.a:0 "Take in the pilots."
 ire_nw.98.b:0 "Receive their aircraft."
 ire_nw.98.c:0 "Let the pilots choose."
 IRE_tt_red_uprising_conditions:0 "The French Commune must have actually joined European Hope, Germany must be at war with Ireland, and the Irish homeland must be threatened (Black Britain at war with Ireland, or a core state occupied)."
 IRE_european_hope_britain:0 "The Friendship of the Union of Britain"
 IRE_european_hope_britain_desc:0 "The Union of Britain transfers the remaining ships of the Royal Navy, the dock unions and its intelligence network to European Hope. The combined staff takes over the flotillas, and port access and the exchange of intelligence are set out in a separate agreement."
 ire_nw.99.t:0 "The Union of Britain Joins European Hope"
 ire_nw.99.d:0 "After the Union of Britain won its civil war, the London strike committee sent a delegation to Dublin. European Hope now holds both Paris and London, and the Channel has changed from a border into a common line of defence. The Department of External Affairs arranged talks with the combined staff; naval establishment and port access form a separate annex, and the draft goes to the Dail."
 ire_nw.99.a:0 "Re-flag the Royal Navy"
 ire_nw.99.b:0 "Write the alliance into a charter"
 ire_nw.99.c:0 "Secure London first"
 IRE_tt_european_major_war:0 "Requires a war between major European powers (Ireland does not need to be at war)."
 IRE_wartime_laws_cat:0 "Wartime Legislation"
 IRE_wartime_war_economy:0 "Move to War Economy"
 IRE_wartime_war_economy_desc:0 "The wartime coalition has laid the war economy bill before the Dail under emergency procedure, dispensing with the usual test of public support. The bill empowers the cabinet to requisition capacity, control prices and allocate raw materials; the Treasury's regulations issue the same day."
 IRE_wartime_total_economy:0 "Total Economic Mobilisation"
 IRE_wartime_total_economy_desc:0 "National industry is reordered by military priority and civil production compressed to maintenance levels. The railways, ports and shipyards pass to the direction of the Department of Defence, with officers posted to each works to audit output and returns compiled weekly."
 IRE_wartime_service:0 "Introduce Conscription"
 IRE_wartime_service_desc:0 "The Dail has passed the conscription act. Men of military age are enrolled by household and called up, deferments and exemptions being heard by local boards. The new conscription office within the Department of Defence keeps the registers, with copies to each military district."
 IRE_wartime_all_adults:0 "All Adults Serve"
 IRE_wartime_all_adults_desc:0 "The call-up is extended to the whole adult population, men and women alike, with postings assigned by military and civil priority. The conscription office opens additional registry offices in the counties, and separate regulations govern those who fail to register."
 IRE_wartime_scraping:0 "Scraping the Barrel"
 IRE_wartime_scraping_desc:0 "The last manpower is committed: all persons not on the deferment register are called up, and labour as well as munitions establishments are expanded. Voluntary enlistment is closed and requisition proceeds household by household."
 ire_nw.130.t:0 "The Abwehr's Irish Door"
 ire_nw.130.d:0 "A diplomat of a neutral power has carried a message from Berlin to Dublin: German intelligence wishes to make contact on shipping intelligence. The courier waits at a hotel by the Liffey with a chart of routes in his keeping. The message has been copied into the file, and the cabinet is asked for its instruction."
 ire_nw.130.a:0 "Hear what he has to say"
 ire_nw.130.b:0 "Arrest him and inform London"
 ire_nw.130.c:0 "Hand him over to G2"
 ire_nw.131.t:0 "Plan Kathleen"
 ire_nw.131.d:0 "The Abwehr's plan is plain: use Ireland's ports and old contacts to open a back door into Britain. The courier hands over his list in Dublin and asks for port rights, radio operators and silence that asks no questions. Copies are kept by the foreign and defence ministries, and the courier names his deadline by word of mouth."
 ire_nw.131.a:0 "We will take the arms."
 ire_nw.131.b:0 "This is not our war."
 ire_nw.131.c:0 "Take the arms, then inform on them."
 ire_nw.132.t:0 "The Abwehr Network Is Blown"
 ire_nw.132.d:0 "The Abwehr network in Ireland is marked by London and Washington at once. The newspapers begin to press Dublin's silence, and Downing Street asks for an explanation. External Affairs and the Special Branch each prepare a statement, the two do not agree, and the cabinet must first settle the reply. Those concerned have been summoned for questioning."
 ire_nw.132.a:0 "Deny everything."
 ire_nw.132.b:0 "Admit it and apologize."
 ire_nw.133.t:0 "The Quiet Understanding"
 ire_nw.133.d:0 "Dublin handed over the Abwehr courier and his plan. London and Washington offered no public thanks, but a channel of intelligence has opened to Ireland. G2 has bound the record of the transfer and the receipts into a file, a copy to External Affairs, the original retained, and a third to the Taoiseach's office."
 ire_nw.133.a:0 "Keep it quiet."
 ire_nw.133.b:0 "Share the intelligence with Washington."
 ire_nw.133.c:0 "Ask London for something in return."
 IRE_abwher_network:0 "The Abwehr's Irish Network"
 IRE_abwher_network_desc:0 "German intelligence's network in Ireland consists of radios, couriers and a body of old hands, run by an officer posted from the Abwehr. Funds and equipment are issued quarterly, and no list is kept on file."
 IRE_abwher_exposed:0 "The Abwehr Scandal"
 IRE_abwher_exposed_desc:0 "The German network is exposed, and the papers print the radio locations and the names. Dublin's silence becomes the subject of questions from London and Washington, and the foreign ministry must answer them one by one. Those implicated are dealt with by the military police and the courts separately."
 IRE_covert_cat:0 "Covert Operations"
 IRE_abwher_arms_run:0 "Receive the Abwehr Arms"
 IRE_abwher_arms_run_desc:0 "The navy and G2 receive infantry weapons and artillery from the German network, charting each leg of the route and guarding the landings with military police. Every run adds to the risk of exposure, and the staff fixes the order accordingly."
 IRE_invite_red_france:0 "Invite the French Commune"
 IRE_invite_red_france_desc:0 "Dublin sends the French Commune an invitation to join the Hope of Europe, with articles on port use and supply assistance. The foreign ministry forwards the text through a neutral legation and awaits Paris."
 ire_nw.134.t:0 "The Free Nations Answer Dublin"
 ire_nw.134.d:0 "As the German war spreads, a number of threatened governments are turning to Dublin. European Hope is no longer an Irish alliance alone. Notes have reached the Department of External Affairs, the combined staff is listing the forces and supplies of each state, and the cabinet is asked how they are to be received."
 ire_nw.134.a:0 "Receive them"
 ire_nw.134.b:0 "Take military cooperation first"
 IRE_german_last_stand:0 "Germany's Last Mobilisation"
 IRE_german_last_stand_desc:0 "Germany mobilises completely while ringed by enemies. Reserves are called by military district, factories convert to armament, transport and rationing are directed by the war economy office, and civilian production is cut to schedule."
 ire_nw.135.t:0 "Washington and the Black Flag"
 ire_nw.135.d:0 "After Black Britain takes power Washington cannot at once say whether London is an enemy or a rival. The White House puts the question of Ireland's position through informal channels, and the minister in Washington carries it home. External Affairs drafts several replies and sends none. The cabinet has not decided; the drafts rest with the treaty division. A copy of each draft goes to the President's office."
 ire_nw.135.a:0 "Lean toward Washington."
 ire_nw.135.b:0 "Recognise London's new government."
 ire_nw.135.c:0 "Withhold our position."
 ire_nw.136.t:0 "The Dominions Choose"
 ire_nw.136.d:0 "Canada, Australia, New Zealand, South Africa and India are watching the new government in London. For several of them Dublin is the more suitable democratic partner. The Department of External Affairs has sent notes inviting representatives to Dublin, and replies come through the governors-general to London."
 ire_nw.136.a:0 "Open Dublin's door to them"
 ire_nw.136.b:0 "Let them decide for themselves"
 ire_nw.136.c:0 "Press them to break with London"
 ire_nw.137.t:0 "The French Commune and Free France"
 ire_nw.137.d:0 "With the French Commune admitted to European Hope, Free France and Washington are both watching Dublin. The Department of External Affairs has laid two instruments of recognition before the cabinet: one addressed to the Commune in Paris, the other keeping the channel to Free France. The reply, once settled, is to be delivered by both missions."
 ire_nw.137.a:0 "Recognise the French Commune"
 ire_nw.137.b:0 "Keep the Free French channel"
 ire_nw.137.c:0 "Leave the French to settle it"
 ire_nw.138.t:0 "Moscow's Gaze"
 ire_nw.138.d:0 "Since the Union of Britain joined European Hope, Moscow has made its first formal approach to Dublin. The Soviet Union is at war with Germany and at odds with the western democracies; its embassy in London carries the notes. The Foreign Ministry proposes an informal channel and asks the cabinet to settle the terms of the reply."
 ire_nw.138.a:0 "Open a working channel"
 ire_nw.138.b:0 "Keep Moscow at a distance"
 ire_nw.138.c:0 "Invite Soviet observers"
 ire_nw.139.t:0 "The Unionist Question"
 ire_nw.139.d:0 "After the North returns, unionist leaders and the local unions stay off the streets, meeting in their own halls and sending delegates to enquire about seats in the new government. Dublin has not yet answered. The cabinet has entered local administration, policing and education on its order paper, and the prime minister's office has drafted a reply for its decision."
 ire_nw.139.a:0 "Give the unionists a place at the table."
 ire_nw.139.b:0 "Rule by decree."
 ire_nw.139.c:0 "Let the IRA handle it."
 ire_nw.140.t:0 "The Old IRA's Place"
 ire_nw.140.d:0 "The IRA's old guard does not accept Dublin's compromise with London. They demand a place in the new state, or they will act on their own. The Department of Justice has listed branch meetings and arms returns county by county and sent them, with the Special Branch's opinion, to the cabinet for a ruling."
 ire_nw.140.a:0 "Bring them into the National Army."
 ire_nw.140.b:0 "Set up special courts and internment."
 ire_nw.140.c:0 "Turn them against Black Britain."
 ire_nw.140.e:0 "Leave them unhandled for now."
 ire_nw.141.t:0 "The Bishops and the Red Allies"
 ire_nw.141.d:0 "After the French Commune and the Union of Britain joined the Hope of Europe, the bishops and the Irish-American press voiced their unease. Dublin must answer what the Republic's relationship with its red allies is. External Affairs and the publicity branch have each drafted a statement, and the cabinet is to choose the line before the Dail resumes."
 ire_nw.141.a:0 "Reassure the Church."
 ire_nw.141.b:0 "Declare the Republic secular."
 ire_nw.141.c:0 "Offend neither side."

 # ===== Irish National Union: coalition government =====
 IRE_national_union_cat:0 "National Unity Government"
 IRE_national_union_government:0 "National Unity Government"
 IRE_national_union_government_desc:0 "The four blocs have formed a coalition under agreement, with portfolios distributed in proportion. A standing cabinet committee reconciles differences, foreign policy is issued from the Department of the Taoiseach, and the parliamentary parties confer weekly."
 IRE_nu_ui_header:0 "National Unity Government · Four-Bloc Balance"
 IRE_nu_ui_parliament:0 "Parliament"
 IRE_nu_ui_labour:0 "Labour"
