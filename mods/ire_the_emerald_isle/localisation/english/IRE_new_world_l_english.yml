 IRE_effect_diaspora_network_10:0 "Celtic diaspora network +10 (spirits unlock at 20/40/60/80/100)"
 IRE_effect_green_international_tag:0 "Changes the country name to New World Ireland; de Valera retires and John Costello becomes President."

 IRE_dev_ulster:0 "Develop Northern Ireland"
 IRE_dev_ulster_desc:0 "The shipyards, ports and railways of Belfast are reconnected to the national development plan. Works are handed over by stage, equipment and skilled labour are allocated by Industry and Commerce, and existing hands are retained in preference. Progress is reported quarterly."
 IRE_tt_national_mining_repeat:0 "Repeatable: adds resources to the home states; available again after 180 days."
 IRE_A_civic_republic:0 "Civic Republic"
 IRE_A_civic_republic_desc:0 "New World Ireland is founded on reconciliation and upheld by its citizens, its diaspora and its local assemblies. Dublin does not imitate the old empires but holds the state together by charter, budget and election. The draft constitution is before the convention."
 IRE_A_centralised_republic:0 "Centralised Republic"
 IRE_A_centralised_republic_desc:0 "The cabinet holds manpower, industry and security in its own hands, and the departments act on one set of instructions. The powers of the local councils pass to the ministries, the Special Branch supervises execution, and the annual returns go to the President of the Executive Council."
 IRE_A_national_accord:0 "National Accord"
 IRE_A_national_accord_desc:0 "Northern Ireland is back in the Republic. Dublin has brought parliament, the unions, the army and the Republican Army to one table to settle the articles of a coalition. Each of the four nominates its delegates, and the seats and agenda are fixed by the preparatory office."
 IRE_A_national_union_convene:0 "Convene the National Union"
 IRE_A_national_union_convene_desc:0 "This is no change of ideology but a government that binds the four blocs together: they go on arguing at home and speak as one Ireland abroad. The articles of the coalition have been signed by the delegates of all four."
 IRE_tt_national_union_north:0 "Northern Ireland must have returned to the Republic"
 IRE_national_union:0 "Irish National Union"
 IRE_civic_republic:0 "Civic Republic"
 IRE_civic_republic_desc:0 "Local assemblies, emigrant representatives and civic bodies take part in governing the state. Rules of procedure are issued by Home Affairs, delegates are chosen by interest, and terms and recall are separately provided. Measures are reviewed by the Dail."
 IRE_centralised_republic:0 "Centralised Republic"
 IRE_centralised_republic_desc:0 "Dublin concentrates the direction of manpower, industry and security, and the machine of state moves faster. The powers of the departments pass to the cabinet, commissioners supervise orders in the counties, and the quarterly records go to the President."
 IRE_civic_research_bonus:0 "Civic technology boost"
 # ===== Canadian development after annexation =====
 IRE_canada_cat:0 "Canadian Development"
 IRE_canada_development_plan:0 "Canadian Land Development Plan"
 IRE_canada_development_plan_desc:0 "Railways, ports and municipal utilities from Toronto and Montreal to Winnipeg and Vancouver are folded into Dublin's plan, the work proceeding in three stages, each covering every developable province at once. The old empire built only the lines that ran to a port."
 IRE_canada_resource_plan:0 "Canadian Resource Survey"
 IRE_canada_resource_plan_desc:0 "Survey parties enter the Nova Scotia coalfields, the Alberta oil sands, the Quebec and Nunavut aluminium belt and the iron and chromite range of northern Ontario. The seams are not rich, but they free Dublin's factories from other men's goodwill. Three stages, each deeper than the last."
 IRE_canada_smelting_plan:0 "Canadian Industrial Smelting Plan"
 IRE_canada_smelting_plan_desc:0 "Special steel, aluminium and ferrochrome combines are raised in Ontario and Quebec, turning ore, power and harbour into artillery, aircraft and armour plate. By the end of the first stage the St. Lawrence carries more smokestacks than Dublin has in the whole city."
 IRE_canada_smelting:0 "Canadian Smelting Industry"
 IRE_canada_smelting_desc:0 "The special steel, aluminium and ferrochrome combines of Ontario and Quebec deliver under contract, turning Canadian ore and power into precision parts for Ireland's war machine; delivery notes are accepted by the Department of Defence."
 IRE_tt_canada_development:0 "All 19 developable Canadian states: +1 building slot and +1 infrastructure each; +1 civilian factory in a random state."
 IRE_tt_canada_development_offsite:0 "Off-map civilian factory +1; manpower +10,000; stability +5%."
 IRE_tt_canada_development_final:0 "Third stage completed: additional off-map military factory +1; manpower +15,000."
 IRE_tt_canada_resources:0 "Province-based gains: coal +6, steel +7, aluminium +7, oil +5, tungsten +1, chromium +2; political power +20."
 IRE_tt_canada_resources_final:0 "Third stage completed: additional off-map civilian factory +1."
 IRE_tt_canada_smelting:0 "Chromium +3, steel +4, aluminium +4; off-map military factory +1; political power +15."
 IRE_tt_canada_smelting_idea:0 "Unlocks the national spirit Canadian Smelting Industry: factory output +10%, military production speed +10%, civilian industrial production speed +5%, consumer goods -5%."
 IRE_tt_canada_smelting_final:0 "Third stage completed: additional off-map civilian factory +1."
 # ===== Per-state steel and aluminium plans =====
 IRE_mining_leinster:0 "Leinster Steel, Aluminium and Chromium Plan"
 IRE_mining_leinster_desc:0 "Steel rolling, aluminium working, ferrochrome plant and supporting power are extended along the Dublin-Drogheda-Wexford line. The Department of Industry and Commerce issues the licences, the works are let in sections, and progress is reported quarterly."
 IRE_mining_munster:0 "Munster Steel, Aluminium and Chromium Plan"
 IRE_mining_munster_desc:0 "Cork Harbour and the Shannon estuary take imported bauxite, and alumina refining, aluminium rolling, steel rolling and ferrochrome works are extended. The harbour authority regulates throughput, and the Shannon works supply the power."
 IRE_mining_connaught:0 "Connacht Steel, Aluminium and Chromium Plan"
 IRE_mining_connaught_desc:0 "On the strength of Shannon hydro-electric power, alloy steel, aluminium working and ferrochrome production are developed, and tungsten mining continues. The Electricity Supply Board and the Department of Industry and Commerce administer the works, and the mines are registered by district."
 IRE_mining_ulster:0 "Ulster Steel, Aluminium and Chromium Plan"
 IRE_mining_ulster_desc:0 "The shipyards, steelworks, aluminium plants, ferrochrome works and coalfields of Belfast are entered again in the development plan. Industrial plant in the northern counties is scheduled, and rail and port extensions follow the plan."
 IRE_tt_state_mining_repeat:0 "Repeatable: adds steel, aluminium, chromium, and other resources to this state; available again after 150 days."
 # ===== Irish unity and industrial efficiency =====
 IRE_eff_cat:0 "Industrial Efficiency"
 IRE_unity_plan:0 "Irish Unity Plan"
 IRE_unity_plan_desc:0 "Beyond the home programme, Dublin turns emigrant capital and public investment to industry overseas. Each stage delivers a batch of civilian and military factories, works are let by Industry and Commerce, and further stages may follow."
 IRE_tt_unity_plan_repeat:0 "Repeatable: +3 off-map civilian factories and +3 off-map military factories; available again after 240 days."
 IRE_eff_standardisation:0 "Industrial Standardisation"
 IRE_eff_standardisation_desc:0 "Machine tools, hours and quality standards are made uniform throughout the country. A standards committee of the Ministry of Industry examines each works, every plant refits its equipment to the schedule, and inspection returns are made quarterly."
 IRE_eff_assembly_line:0 "Assembly-Line Reform"
 IRE_eff_assembly_line_desc:0 "Assembly lines and specialised labour are introduced at Dublin, Cork and Belfast: processes divided by cycle, workers trained to single stations, conveyors and inspection benches installed. Officers of the Ministry of Industry are posted to the works to check output."
 IRE_eff_total_mobilisation:0 "Total Industrial Mobilisation"
 IRE_eff_total_mobilisation_desc:0 "Civil industry, ports and railways are folded into the war production programme, the shipyards turning to service craft and freight scheduled by military priority. A joint dispatch office of the Ministries of Economics and Defence reconciles capacity week by week."
 IRE_industrial_standardisation:0 "Industrial Standardisation"
 IRE_industrial_standardisation_desc:0 "Machine-tool specifications and quality standards are issued by the Department of Industry; works machine to a single set of drawings, inspectors are stationed in the plants, and passed parts carry the common stamp. Batches below specification are returned for reworking."
 IRE_assembly_line:0 "Assembly-Line Reform"
 IRE_assembly_line_desc:0 "Assembly lines and specialised labour bring the works to their rated output sooner, the Ministry of Industry approving each sequence and shortages made good week by week. New plant is accepted to the same standard."
 IRE_total_industrial_mobilisation:0 "Total Industrial Mobilisation"
 IRE_total_industrial_mobilisation_desc:0 "Industry is placed on a war footing. Factories work to defence orders, materials are allocated by the supply branch, and hours and maintenance are set by regulation. Deliveries are checked monthly, and delays are explained by the responsible department."
 # ===== Railway rolling stock =====
 IRE_train_production:0 "Railway Rolling Stock Programme"
 IRE_train_production_desc:0 "The locomotive and carriage works of Dublin, Cork and Belfast have gone over to wartime production. Railway inspectors supervise, steel is allocated by the Department of Supplies, and completed vehicles are entered in the military timetable."
 IRE_tt_train_production_repeat:0 "Repeatable: delivers 15 trains; available again after 120 days."
 # ===== Complete Canadian annexation check =====
 IRE_tt_canada_fully_owned:0 "Requires the complete annexation of Canada: all 23 starting states owned by Ireland."
