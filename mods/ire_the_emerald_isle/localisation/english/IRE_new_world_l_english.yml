 IRE_effect_green_international_tag:0 "Changes the country name to New World Ireland; de Valera retires and John Costello becomes President."

 IRE_dev_ulster:0 "Develop Northern Ireland"
 IRE_dev_ulster_desc:0 "Belfast's shipyards, ports, and railways are reconnected to the national development plan. Up to 7 stages (about 25 building slots)."
 IRE_tt_national_mining_repeat:0 "Repeatable: adds resources to the home states; available again after 180 days."
 IRE_A_civic_republic:0 "Civic Republic"
 IRE_A_civic_republic_desc:0 "Built on reconciliation, the New World Ireland becomes a democratic republic sustained by citizens, the diaspora, and local assemblies."
 IRE_A_centralised_republic:0 "Centralised Republic"
 IRE_A_centralised_republic_desc:0 "A strong government and security apparatus hold the island together and turn it into an efficient war machine."
 IRE_A_national_accord:0 "National Accord"
 IRE_A_national_accord_desc:0 "Northern Ireland is back in the Republic. Dublin brings parliament, labour, the army and the Republican Army to one table to prepare a larger union."
 IRE_A_national_union_convene:0 "Convene the National Union"
 IRE_A_national_union_convene_desc:0 "Not a change of ideology, but a government that binds the four blocs together: they keep arguing at home, and speak as one Ireland abroad."
 IRE_tt_national_union_north:0 "Northern Ireland must have returned to the Republic"
 IRE_national_union:0 "Irish National Union"
 IRE_civic_republic:0 "Civic Republic"
 IRE_civic_republic_desc:0 "Local assemblies, diaspora representatives, and civic groups share in governing the state."
 IRE_centralised_republic:0 "Centralised Republic"
 IRE_centralised_republic_desc:0 "Dublin concentrates manpower, industry, and security policy; the state moves faster, and colder."
 IRE_civic_research_bonus:0 "Civic technology boost"
 # ===== Canadian development after annexation =====
 IRE_canada_cat:0 "Canadian Development"
 IRE_canada_development_plan:0 "Canadian Land Development Plan"
 IRE_canada_development_plan_desc:0 "Railways, ports, and public utilities from Toronto and Montreal to Winnipeg and Vancouver are folded into Dublin's development plan. Each stage covers all 19 developable Canadian states: +1 building slot and +1 infrastructure in each, +1 civilian factory in a random state, +1 off-map civilian factory, and 10,000 manpower. Up to 3 stages; the third stage also grants 1 off-map military factory and 15,000 manpower. A state can have at most 25 shared building slots; excess industry is represented by off-map factories."
 IRE_canada_resource_plan:0 "Canadian Resource Survey"
 IRE_canada_resource_plan_desc:0 "Survey teams enter the Nova Scotia coalfields, the Alberta oil sands, the Quebec and Nunavut aluminium belts, and the Northern Ontario steel and chromite range. Each stage adds coal +6, steel +7, aluminium +7, oil +5, tungsten +1, and chromium +2 across the provinces, plus 20 political power. Up to 3 stages; the third stage also grants 1 off-map civilian factory."
 IRE_canada_smelting_plan:0 "Canadian Industrial Smelting Plan"
 IRE_canada_smelting_plan_desc:0 "Special steel, aluminium, and ferrochrome combines are built in Ontario and Quebec, turning ore, power, and ports into artillery, aircraft, and armour steel. Each stage grants chromium +3, steel +4, aluminium +4, 1 off-map military factory, and 15 political power. The first stage unlocks the Canadian Smelting Industry spirit. Up to 3 stages; the third stage also grants 1 off-map civilian factory."
 IRE_canada_smelting:0 "Canadian Smelting Industry"
 IRE_canada_smelting_desc:0 "The special steel, aluminium, and ferrochrome combines of Ontario and Quebec turn Canadian ore and power into precision components for Ireland's war machine."
 IRE_tt_canada_development:0 "All 19 developable Canadian states: +1 building slot and +1 infrastructure each; +1 civilian factory in a random state."
 IRE_tt_canada_development_offsite:0 "Off-map civilian factory +1; manpower +10,000; stability +5%."
 IRE_tt_canada_development_final:0 "Third stage completed: additional off-map military factory +1; manpower +15,000."
 IRE_tt_canada_resources:0 "Province-based gains: coal +6, steel +7, aluminium +7, oil +5, tungsten +1, chromium +2; political power +20."
 IRE_tt_canada_resources_final:0 "Third stage completed: additional off-map civilian factory +1."
 IRE_tt_canada_smelting:0 "Chromium +3, steel +4, aluminium +4; off-map military factory +1; political power +15."
 IRE_tt_canada_smelting_idea:0 "Unlocks the national spirit Canadian Smelting Industry: factory output +10%, military production speed +10%, civilian industrial production speed +5%, consumer goods -5%."
 IRE_tt_canada_smelting_final:0 "Third stage completed: additional off-map civilian factory +1."
 # ===== Per-state steel and aluminium plans =====
 IRE_mining_leinster:0 "Leinster Steel, Aluminium and Chromium Plan"
 IRE_mining_leinster_desc:0 "Expand steel rolling, aluminium processing, ferrochrome production, and supporting power across the Dublin-Drogheda-Wexford corridor. Repeatable every 150 days."
 IRE_mining_munster:0 "Munster Steel, Aluminium and Chromium Plan"
 IRE_mining_munster_desc:0 "Cork Harbour and the Shannon estuary import bauxite and power alumina refining, aluminium rolling, steel rolling, and ferrochrome production. Repeatable every 150 days."
 IRE_mining_connaught:0 "Connacht Steel, Aluminium and Chromium Plan"
 IRE_mining_connaught_desc:0 "Shannon hydro power supports alloy steel, aluminium processing, and ferrochrome production, while tungsten mining continues. Repeatable every 150 days."
 IRE_mining_ulster:0 "Ulster Steel, Aluminium and Chromium Plan"
 IRE_mining_ulster_desc:0 "Belfast's shipyards, steelworks, aluminium processing, ferrochrome plants, and coalfields are folded back into the development plan. Repeatable every 150 days."
 IRE_tt_state_mining_repeat:0 "Repeatable: adds steel, aluminium, chromium, and other resources to this state; available again after 150 days."
 # ===== Irish unity and industrial efficiency =====
 IRE_eff_cat:0 "Industrial Efficiency"
 IRE_unity_plan:0 "Irish Unity Plan"
 IRE_unity_plan_desc:0 "Building on the home development programme, Dublin channels diaspora capital and public investment into off-map industry: each stage completes 3 civilian factories and 3 military factories. Repeatable every 240 days."
 IRE_tt_unity_plan_repeat:0 "Repeatable: +3 off-map civilian factories and +3 off-map military factories; available again after 240 days."
 IRE_eff_standardisation:0 "Industrial Standardisation"
 IRE_eff_standardisation_desc:0 "Standardise machine tools, working hours, and quality standards across the country as the foundation for later assembly-line reforms. Unlocks the Industrial Standardisation spirit."
 IRE_eff_assembly_line:0 "Assembly-Line Reform"
 IRE_eff_assembly_line_desc:0 "Introduce assembly lines and specialised labour in Dublin, Cork, and Belfast to raise the efficiency cap and ramp-up speed. Requires Industrial Standardisation."
 IRE_eff_total_mobilisation:0 "Total Industrial Mobilisation"
 IRE_eff_total_mobilisation_desc:0 "Fold civilian industry, ports, and railways into the war production plan and squeeze out the last measure of capacity. Requires Assembly-Line Reform."
 IRE_industrial_standardisation:0 "Industrial Standardisation"
 IRE_industrial_standardisation_desc:0 "Unified machine-tool standards and quality control raise factory output, the production efficiency cap, and efficiency gain."
 IRE_assembly_line:0 "Assembly-Line Reform"
 IRE_assembly_line_desc:0 "Assembly lines and specialised labour let factories reach their maximum efficiency faster."
 IRE_total_industrial_mobilisation:0 "Total Industrial Mobilisation"
 IRE_total_industrial_mobilisation_desc:0 "The entire national industry is placed on a war footing, further raising factory output and the efficiency cap."
 # ===== Railway rolling stock =====
 IRE_train_production:0 "Railway Rolling Stock Programme"
 IRE_train_production_desc:0 "The locomotive and carriage works of Dublin, Cork, and Belfast move to war production, delivering 15 trains every 120 days. Requires Basic Train technology."
 IRE_tt_train_production_repeat:0 "Repeatable: delivers 15 trains; available again after 120 days."
 # ===== Complete Canadian annexation check =====
 IRE_tt_canada_fully_owned:0 "Requires the complete annexation of Canada: all 23 starting states owned by Ireland."
