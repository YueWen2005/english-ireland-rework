 IRE_nu_status_tt:0 "Parliament [?IRE.IRE_nu_parliament|0] / Labour [?IRE.IRE_nu_labour|0] / Security [?IRE.IRE_nu_security|0] / IRA [?IRE.IRE_nu_ira|0]\nUnionist confidence [?IRE.IRE_nu_unionist|0] / Church confidence [?IRE.IRE_nu_church|0]\nExternal pressure: [GetIRENuLastExternal] / Faction activity: [GetIRENuLastInitiative]\nPermanent union modifiers: stability +[?IRE.IRE_nu_mod_stability|0]% / political power +[?IRE.IRE_nu_mod_pp|0]% / war support +[?IRE.IRE_nu_mod_ws|0]% / consumer goods [?IRE.IRE_nu_mod_cg|0]%\nA bloc above 60 with a 30-point gap to the lowest triggers a coalition crisis."
 IRE_nu_status:0 "Coalition Balance & Modifiers"
 IRE_nu_status_desc:0 "The committee compiles the four blocs' standing, unionist and Church confidence, external pressure and faction activity month by month, and enters the current permanent union modifiers on the same schedule. Timed spirits are excluded; the return is filed with the cabinet."
 # ===== Irish National Union: preparation and formation events =====
 ire_nw.142.t:0 "The National Accord"
 ire_nw.142.d_civic:0 "With Northern Ireland back in the Republic, the parliament, unions and local assemblies of the Civic Republic begin to discuss a wider union. Unionists demand guarantees, labour demands seats, and the old IRA demands recognition. Dublin must set the tone of the round table."
 ire_nw.142.d_firm:0 "With Northern Ireland back in the Republic, the Centralised Republic summons the four blocs to a defence cabinet. The security services want order, the unions want compensation, and the Republican Army wants a place in the order of battle. Dublin must set the tone of the union."
 ire_nw.142.d:0 "With Northern Ireland back in the Republic, Dublin brings parliament, the unions, the army and the Republican Army to one table. The four blocs do not dispute that Ireland must be united; on how to unite it each has its own standing orders. The conference sits in groups by subject, each submits written observations, and the chair collects them for consideration. The session is provisionally set for six weeks, and the chair circulates the agenda."
 ire_nw.142.a:0 "Take the round-table compromise."
 ire_nw.142.b:0 "Impose firm integration."
 ire_nw.142.c:0 "Let the republican wing march in."
 ire_nw.150.t:0 "The National Union Is Constituted"
 ire_nw.150.d_roundtable:0 "The round-table compromise sets the tone of the union. The four blocs enter the cabinet, unionists and the Church receive guarantees, and parliament controls the agenda. Dublin must now decide who speaks first in the coalition."
 ire_nw.150.d_firm:0 "Firm integration sets the tone of the union. The security services hold order, while labour and the Republican Army are brought under supervision. Dublin must now decide who speaks first in the coalition."
 ire_nw.150.d_republican:0 "The republican entry sets the tone of the union. The old IRA receives recognition, while unionists and the Church remain wary. Dublin must now decide who speaks first in the coalition."
 ire_nw.150.d:0 "Delegates of the four blocs sign a joint protocol in Dublin, and the National Union is constituted on that instrument. It fixes the allocation of seats, the rules of order and the voting procedure; each bloc names two members to the standing committee, and the chair rotates. The first meeting of the coalition is set for next week, the agenda to be circulated by the secretariat beforehand."
 ire_nw.150.a:0 "Let parliament control the agenda."
 ire_nw.150.b:0 "Give labour a seat in the cabinet."
 ire_nw.150.c:0 "Let the security services keep order."
 ire_nw.150.e:0 "Bring the Republican Army into the government."
 IRE_A_national_union_parliament:0 "Parliamentary Consensus"
 IRE_A_national_union_parliament_desc:0 "Parliament is placed at the centre of the coalition: procedure, budget and elections belong to the civil authority. Unionists and the Church hold written guarantees, the standing orders are published once the four blocs agree, and question time is fixed separately."
 IRE_A_national_union_labour:0 "Labour Compact"
 IRE_A_national_union_labour_desc:0 "The unions have taken a seat in their own right, and wages, hours and public works are entered on the government's agenda. Labour delegates sit on the departmental boards; the Church keeps its reserve, has not yet spoken, and has asked to see the President of the Executive Council."
 IRE_A_national_union_security:0 "Public Security"
 IRE_A_national_union_security_desc:0 "The security services hold the order: the Special Branch, the loyalty of the army and the emergency powers are the pillars of the coalition. The Republican Army's room is narrowed, and its rolls have been handed to the Department of Justice for inspection."
 IRE_A_national_union_ira:0 "Republican Army Integration"
 IRE_A_national_union_ira_desc:0 "The Republican Army has been brought into the state, and its veterans, volunteer network and cross-border work receive formal standing. The unionists keep their guard, asking that the right of question be reserved to them and that the arms be registered."
 IRE_A_national_union_revival:0 "National Revival"
 IRE_A_national_union_revival_desc:0 "All four blocs hold seats and none can override the rest. The ministers find that an argument can be closed at a table rather than in the street. The rules of procedure have been printed and circulated to the departments for observance."
 IRE_effect_nu_pillar_parliament:0 "Parliament influence +10, unionist confidence +5; political power +50, stability +5%; unlocks the parliament method decisions."
 IRE_effect_nu_pillar_labour:0 "Labour influence +10, Church confidence -3; political power +25, manpower +5000; unlocks the labour method decisions."
 IRE_effect_nu_pillar_security:0 "Security influence +10, IRA influence -3; war support +5%, army experience +25; unlocks the security method decisions."
 IRE_effect_nu_pillar_ira:0 "IRA influence +10, unionist confidence -3; manpower +5000, army experience +25; unlocks the IRA method decisions."
 IRE_tt_nu_revival_conditions:0 "All four blocs must be between 20 and 60, and both unionist and Church confidence must be at least 60."
 IRE_tt_nu_cross_border:0 "Black Britain has been formed, or an Irish core state is controlled by an enemy."
 IRE_nu_parliament_convention:0 "National Convention"
 IRE_nu_parliament_convention_desc:0 "National delegates, the unions and the local assemblies are summoned to Dublin, and the coalition's agenda is laid out in order. Each bloc submits written observations; the minutes go to the four blocs and to the cabinet for filing."
 IRE_nu_parliament_diaspora:0 "Diaspora Lobby"
 IRE_nu_parliament_diaspora_desc:0 "Legations and emigrant societies receive instructions to speak for Dublin on trade, investment and opinion at once. Commercial and press returns are compiled monthly by the consulates and filed with the Department of External Affairs."
 IRE_nu_labour_councils:0 "Workers' Councils"
 IRE_nu_labour_councils_desc:0 "Factory councils enter the coalition's consultative bodies under statute; production schedules, hours and wages are settled jointly by worker delegates and management, and the outcome is filed with the Department of Labour."
 IRE_nu_labour_public_works:0 "Public Works"
 IRE_nu_labour_public_works_desc:0 "Road, port and housing works allot their labour quotas on union nomination, and contracts carry employment and wage clauses. The cabinet fixes the order of works; progress is returned quarterly to the Board of Works and filed."
 IRE_nu_security_special_branch:0 "Special Branch"
 IRE_nu_security_special_branch_desc:0 "The strength and vote of the Special Branch are approved by the Department of Justice, and its remit extends to extremists and to unrest inside the coalition. Watch lists are revised monthly; operational records are sealed at the Department of Defence."
 IRE_nu_security_army_loyalty:0 "Army Loyalty"
 IRE_nu_security_army_loyalty_desc:0 "The Department of Defence orders every unit to swear publicly at its station, the oath running to the coalition government and to no single bloc. Nominal rolls are compiled by the commands and returned to the Department and the cabinet. Those who do not swear are entered on a separate list."
 IRE_nu_ira_volunteer_network:0 "Volunteer Network"
 IRE_nu_ira_volunteer_network_desc:0 "The old IRA's volunteer network is entered into the national mobilisation system by district, veterans being registered by length of service, and the rolls are held jointly by the Department of Defence and the republican bloc. The counties check their numbers monthly, and gaps are reported by the mobilisation officers."
 IRE_nu_ira_cross_border:0 "Cross-Border Operations"
 IRE_nu_ira_cross_border_desc:0 "Intelligence and sabotage work is carried out across the border, the plans drawn up jointly by the Special Branch and the Republican staff, the funds entered under a confidential Defence vote, and the reports kept out of the ordinary files."
 IRE_nu_parliament_spirit:0 "National Convention Afterglow"
 IRE_nu_parliament_spirit_desc:0 "The parliamentary bloc holds the majority in the coalition; committees are reallocated in proportion, the order paper is issued in advance by the secretariat, and the cabinet's business rests on a steady footing. Votes in committee are counted by seat."
 IRE_nu_diaspora_spirit:0 "Diaspora Network"
 IRE_nu_diaspora_spirit_desc:0 "The trade and opinion networks of the Irish abroad are now tied to Dublin's offices; remittances, orders and copy arrive monthly and are entered in the register of the emigrant division. The consulates reconcile the register against the payments each month."
 IRE_nu_labour_spirit:0 "Workers' Councils"
 IRE_nu_labour_spirit_desc:0 "Factory councils run production targets and political mobilisation on one track; management and worker delegates fill in the same return, which the Department of Labour collects monthly and forwards to the cabinet. Disputed items go to the arbitration tribunal."
 IRE_nu_works_spirit:0 "Public Works Boom"
 IRE_nu_works_spirit_desc:0 "Roads, ports and housing break ground together; the Board of Works checks progress each quarter, the Department of Supplies handles the allocation of materials, and the accounts go to the Comptroller at the year's end. Compensation for land taken is assessed by the land commission."
 IRE_nu_security_spirit:0 "Special Branch"
 IRE_nu_security_spirit_desc:0 "The Special Branch and the army keep order within the coalition; security returns go to the cabinet every ten days, urgent cases come with their own files, and the Department of Justice reviews them jointly. The detention lists are checked every ten days."
 IRE_nu_army_spirit:0 "Army Loyalty"
 IRE_nu_army_spirit_desc:0 "The army swears loyalty to the coalition; the rolls of oath and the tables of establishment are filed together at the Department of Defence, and the commands review them quarterly and report to the cabinet. Recruits take the oath again on joining."
 IRE_nu_volunteer_spirit:0 "Volunteer Network"
 IRE_nu_volunteer_spirit_desc:0 "The old IRA's volunteer network is taken into national mobilisation; enrolment rolls are kept by the county mobilisation officers, training follows the syllabus issued by Defence, and results are returned monthly. Each county is inspected once a quarter."
 IRE_nu_cross_border_spirit:0 "Cross-Border Operations"
 IRE_nu_cross_border_spirit_desc:0 "Intelligence and sabotage across the border are coordinated by the Special Branch; reports travel by hand, are kept out of the ordinary files, and are charged to a separate account. Each operation requires the Minister's written approval beforehand."
 IRE_national_revival:0 "National Revival"
 IRE_national_revival_desc:0 "The coalition is formed and the four blocs have agreed on the budget and on defence. A liaison office in the Department of the Taoiseach handles inter-party business, the programme was carried in the Dail, and departments are drafting annual plans on that basis."
 ire_nw.151.t:0 "A Coalition in Crisis"
 ire_nw.151.d:0 "The quarrel of the four blocs has spread from the chamber into the streets. One bloc holds the advantage in the government and the others complain openly. The Department of the Taoiseach called the four leaders together and put three courses to them, mediation, a reshuffle, or no action, for the cabinet to decide."
 ire_nw.151.a:0 "Mediate"
 ire_nw.151.b:0 "Reshuffle the cabinet"
 ire_nw.151.c:0 "Let them argue"
 ire_nw.153.t:0 "A Crisis of Confidence"
 ire_nw.153.d:0 "The unionists and the Church have lost patience with the coalition. Strikes have spread from the docks to the coalfields, and sermons and editorials point at Dublin together. Petitions have reached the President's office and are on file. The Department of Justice holds a ban on assemblies and a proclamation of martial law, ready on the cabinet's word."
 ire_nw.153.a:0 "Make concessions to the unionists"
 ire_nw.153.b:0 "Suppress them through the Special Branch"
 ire_nw.153.c:0 "Take no action and wait"
 IRE_A_postwar_red:0 "Red Partnership"
 IRE_A_postwar_red_desc:0 "New World Ireland turns her foreign weight toward the red bloc, deepening cooperation with Moscow, the French Commune and the Union of Britain. The coalition changes no doctrine, only its patron abroad; the texts are kept by the Department of External Affairs."
 IRE_A_postwar_new_world:0 "New World Democracy"
 IRE_A_postwar_new_world_desc:0 "The foreign weight returns to the United States and the democratic camp, with an Atlantic framework of trade and security in place of the old empire, while the national union stands at home. The draft agreement awaits the approval of the cabinet."
 IRE_A_postwar_neutral:0 "Third Force"
 IRE_A_postwar_neutral_desc:0 "Both blocs are refused, and the National Union becomes an independent third force. Dublin says the same words to Washington and to Moscow: Ireland joins no camp and guards no gate. The line can be held only while the four blocs remain balanced."
 IRE_nu_red_partnership:0 "Red Partnership"
 IRE_nu_red_partnership_desc:0 "Dublin and the red bloc exchange envoys; the trade and military agreements are signed in separate instruments, deposited with the treaty division of External Affairs, and copied to Defence and Finance. A joint commission reviews the working of these clauses each quarter."
 IRE_nu_new_world_partnership:0 "New World Partnership"
 IRE_nu_new_world_partnership_desc:0 "Dublin reconnects to the American-led economic and security network; the commercial and defence agreements are signed separately and copied to Finance and Defence for record. Both sides review the working of the agreements quarterly and confirm by exchange of notes."
 IRE_nu_third_force:0 "Third Force"
 IRE_nu_third_force_desc:0 "The Irish National Union declines to join either bloc; notes have gone to the belligerents, the cabinet has confirmed the position of neutrality, and the legations have been instructed accordingly. The ports search passing ships and cargoes on that footing."
 ire_nw.154.t:0 "An Offer from the Red Bloc"
 ire_nw.154.d:0 "With Berlin fallen, the red bloc has reached out to Dublin. Moscow, the French Commune and the Union of Britain all wish to know how far New World Ireland will go. The Department of External Affairs submits two courses: full integration, or limited cooperation that keeps room to manoeuvre. Counsel has checked the texts."
 ire_nw.154.a:0 "Integrate fully with the red bloc"
 ire_nw.154.b:0 "Limit cooperation to specific fields"
 ire_nw.155.t:0 "The New World Democracy"
 ire_nw.155.d:0 "Washington has offered Dublin a new economic and security framework covering tariffs, shipping quotas and joint staff talks. The United States wishes Ireland to return to the Atlantic community rather than stand apart from European affairs. The draft has been translated by the Foreign Ministry, and the cabinet is asked to settle the scope of signature."
 ire_nw.155.a:0 "Become an Atlantic partner"
 ire_nw.155.b:0 "Keep New World independence"
 ire_nw.156.t:0 "An Independent Third Force"
 ire_nw.156.d:0 "Both blocs court Dublin, and the National Union takes a third path: join neither, and make Ireland an independent third force. If the four blocs hold their balance, and unionist and Church confidence holds, Dublin may go further still. The foreign ministry has drafted an outline for armed neutrality, and the cabinet is to rule on it."
 ire_nw.156.a:0 "Armed neutrality."
 ire_nw.156.b:0 "Pure national union."
 IRE_nu_postwar_cat:0 "Postwar Alignment"
 IRE_nu_red_economic_mission:0 "Red Economic Mission"
 IRE_nu_red_economic_mission_desc:0 "Protocols on trade, investment and industrial cooperation are signed with the red bloc; Dublin continues to act in the name of the national union, while payments and plant move through eastern ports. Settlement is chiefly by barter, the balance carried on account."
 IRE_nu_red_military_mission:0 "Red Military Mission"
 IRE_nu_red_military_mission_desc:0 "Military aid, equipment and training from the red bloc are received under agreement; the coalition keeps its flag, the rolls of officers trained are held at Defence, and the courses carry their own syllabus. Those trained are posted to the brigades on return."
 IRE_nu_atlantic_loan:0 "Atlantic Loan"
 IRE_nu_atlantic_loan_desc:0 "American loans and industrial goods are drawn under agreement; reconstruction is supervised jointly by the Treasury and the American banking group, factories reopen in turn, and accounts are settled quarterly. American officers sit at the Treasury to check the use of the funds."
 IRE_nu_atlantic_defence:0 "Atlantic Defence"
 IRE_nu_atlantic_defence_desc:0 "Training programmes with the United States and the democratic navies are agreed; naval technology and air experience are exchanged annually, a liaison officer sits in Dublin, and his reports go direct to Defence. A joint exercise is held once a year."
 IRE_nu_third_force_summit:0 "Third Force Summit"
 IRE_nu_third_force_summit_desc:0 "Delegates of the non-aligned states are summoned to Dublin; the conference sits in committees by subject, and the communiqué is drafted by External Affairs and circulated to the participants and the legations. The place and agenda of the next conference are settled later."
 IRE_nu_third_force_armed:0 "Armed Neutrality"
 IRE_nu_third_force_armed_desc:0 "Conscription, training and home defence proceed on the third force's scheme; county mobilisation officers are ordered to open their rolls, and exercise programmes are carried out once Defence has approved them. Instructors are posted by Defence, and results are entered on the rolls."
 IRE_nu_red_cooperation:0 "Red Cooperation"
 IRE_nu_red_cooperation_desc:0 "Economic and military cooperation with the red bloc proceeds under the protocols; the joint commission meets quarterly and its minutes go to the departments concerned on both sides. The two sides exchange cargo lists and landing certificates quarterly."
 IRE_nu_atlantic_cooperation:0 "Atlantic Cooperation"
 IRE_nu_atlantic_cooperation_desc:0 "Dublin reconnects to the American-led economic and defence network; a liaison office is established in Washington, and commercial and military returns travel to the cabinet by separate routes. The strength and vote of the liaison office are approved by External Affairs."
 IRE_nu_third_force_cooperation:0 "Third Force Coordination"
 IRE_nu_third_force_cooperation_desc:0 "Dublin coordinates positions among the non-aligned states; the legations conduct the business separately, and the results are collected at External Affairs and reported to the cabinet monthly. On divisions the delegations act on the agreed position."
 IRE_A_nu_charter_parliament:0 "Parliamentary Charter"
 IRE_A_nu_charter_parliament_desc:0 "The procedure, budget and electoral authority of parliament are written into the fundamental law of the coalition. Unionists and the Church receive formal guarantees, the parliamentary bloc holds the centre of the machine, and the act has been printed for circulation."
 IRE_A_nu_charter_labour:0 "Labour Charter"
 IRE_A_nu_charter_labour_desc:0 "The rights of the unions over wages, hours and public works are written into the charter. Labour gains an institutional seat; the Church, now uneasy, has sent a memorandum to the cabinet asking that the clauses on church property be kept."
 IRE_A_nu_charter_security:0 "National Security Act"
 IRE_A_nu_charter_security_desc:0 "The Special Branch, the loyalty of the army and the emergency powers are written into a National Security Act. The security bloc gains lawful instruments, the Republican Army is pressed further, and its establishment is revised and mustered quarterly."
 IRE_A_nu_charter_ira:0 "Republican Army Act"
 IRE_A_nu_charter_ira_desc:0 "The volunteer network, veterans and cross-border work of the old IRA are given formal legal standing. The republican bloc enters the state; the unionists keep their guard and ask for a supervisory committee of the Dail."
 IRE_effect_nu_charter_parliament:0 "Political power +100, stability +5%; triggers the parliamentary charter environment event."
 IRE_effect_nu_charter_labour:0 "Manpower +10000, political power +50; triggers the labour charter environment event."
 IRE_effect_nu_charter_security:0 "War support +5%, army experience +50; triggers the National Security Act environment event."
 IRE_effect_nu_charter_ira:0 "Manpower +10000, army experience +50; triggers the Republican Army Act environment event."
 ire_nw.160.t:0 "The Charter Takes Effect"
 ire_nw.160.d:0 "With the parliamentary charter published, the unionists, the bishops and the foreign press are watching how Dublin will carry it out. The charter gives procedure, budgets and elections to the civil service; the unionists want the local government clauses written into the text, and the Church opposes any further extension of a secular parliament. The cabinet must settle the order of implementation within the session and is asked for its direction."
 ire_nw.160.a:0 "Reassure the unionists"
 ire_nw.160.b:0 "Press parliamentary reform"
 ire_nw.160.c:0 "Coordinate with the red allies"
 ire_nw.161.t:0 "The Labour Charter"
 ire_nw.161.d:0 "The labour charter writes wages, hours and public works into law, to be administered by the departments of labour and finance together. Labour takes a standing seat in the coalition, and the trade unions name delegates under their rules. The Church and the unionists each submit a memorandum, asking how the charter stands to Church property and to local self-government."
 ire_nw.161.a:0 "Public works first."
 ire_nw.161.b:0 "Reassure the Church."
 ire_nw.161.c:0 "A wartime labour compact."
 ire_nw.162.t:0 "The National Security Act"
 ire_nw.162.d:0 "The National Security Act has widened the powers of the Special Branch and the army. The security party calls it order, the Republican Army calls it a weapon aimed at them, and the unionists demand civilian oversight. Justice has bound the three petitions with the draft clauses for the Dail, the cabinet to fix its position before the party meeting."
 ire_nw.162.a:0 "Restore order."
 ire_nw.162.b:0 "Establish civilian oversight."
 ire_nw.162.c:0 "Stand firm against Black Britain."
 ire_nw.163.t:0 "The Republican Army Act"
 ire_nw.163.d:0 "The Republican Army Act gives formal standing to the old IRA's volunteer network, its veterans and its cross-border work. The republican bloc enters the institutions of the state on that footing; the unionists remain wary and London and Washington are watching. The bill has gone to the Dail, the amendments of each bloc are taken one by one, and the second reading is set for next week."
 ire_nw.163.a:0 "Integrate them into the army."
 ire_nw.163.b:0 "Reassure the unionists."
 ire_nw.163.c:0 "Authorise cross-border operations."
 ire_nw.164.t:0 "The World Answers the National Union"
 ire_nw.164.d:0 "News of the National Union in Dublin has reached Washington, Moscow and London. An Ireland governed by four blocs is neither the old Free State nor a client of any great power. The three legations have asked for meetings; the Department of External Affairs has prepared three statements, and the cabinet is asked which capital to answer first."
 ire_nw.164.a:0 "Reassure Washington"
 ire_nw.164.b:0 "Open the door to Moscow"
 ire_nw.164.c:0 "Put Dublin first"
 IRE_national_revival_fragile:0 "Fragile Revival"
 IRE_national_revival_fragile_desc:0 "Cooperation between the four blocs is confined to the cabinet, while local organisations act separately. The Department of the Taoiseach convenes a coordination meeting each month, under-secretaries report on the programme, and disputes go to an arbitration committee."
 IRE_nu_repair_revival:0 "Repair the National Revival"
 IRE_nu_repair_revival_desc:0 "With the four blocs brought back into line, the fragile revival is upgraded to a full revival by procedure; the cabinet decision and the schedule of modifiers take effect together and are copied to each bloc. The undertakings of each bloc are filed with the cabinet secretariat."
 IRE_effect_nu_repair_revival:0 "Remove Fragile Revival and gain the full National Revival spirit; stability +5%."
 ire_nw.165.t:0 "A Fracture in the National Union"
 ire_nw.165.d:0 "Northern Ireland is no longer under the control of the Republic. All four blocs ask whether a national union that has lost the six counties is still a national union. Dublin may reaffirm the union, suspend it, or prepare to retake the north. The two departments have each laid a memorandum with the decision."
 ire_nw.165.a:0 "Reaffirm the national union"
 ire_nw.165.b:0 "Suspend the union"
 ire_nw.165.c:0 "Prepare to retake the north"
 ire_nw.166.t:0 "The Coalition and the New Regime"
 ire_nw.166.d:0 "Since Dublin changed its form of government, the four blocs in the coalition have each submitted a memorial: one would keep the coalition to the end of its term, one demands immediate dissolution and a new cabinet, one proposes folding the union into the bodies of the new regime. The cabinet secretariat has set the order of consultation and asks for a ruling."
 ire_nw.166.a:0 "Keep the coalition government"
 ire_nw.166.b:0 "Dissolve the union"
 ire_nw.166.c:0 "Remake the union"
 ire_nw.168.t:0 "A Fragile Revival"
 ire_nw.168.d:0 "The four blocs sign the charters and the spirit of national revival appears, but the balance has not taken hold. Their differences over seats, education and policing remain in the annex to the protocol. Dublin may accept the arrangement as it stands, or spend political capital repairing it clause by clause, on a scheme drawn up by the secretariat."
 ire_nw.168.a:0 "Accept the balance as it stands."
 ire_nw.168.b:0 "Spend political capital on repairs."
 ire_nw.168.c:0 "Let time settle the differences."

