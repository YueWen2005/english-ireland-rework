 # ===== National Union: postwar reconstruction decisions and spirits =====
 IRE_nu_postwar_env_cat:0 "Postwar Reconstruction"
 IRE_nu_postwar_housing:0 "Housing and Reconstruction"
 IRE_nu_postwar_housing_desc:0 "Postwar funds are voted annually for housing, roads and public works; the Board of Works lets contracts by district, and progress and accounts are returned to the Treasury and the cabinet. Local authorities submit their schedules of completion quarterly."
 IRE_nu_postwar_housing_tt:0 "Stability +5%; gain 'Postwar Reconstruction' for 365 days: construction speed +10%, consumer goods -5%."
 IRE_nu_postwar_veterans:0 "Veteran Resettlement"
 IRE_nu_postwar_veterans_desc:0 "Returning soldiers are allotted work, housing and training places by record of service; the resettlement rolls are held by the veterans' office and the counties act upon them. The syllabus is issued by Defence, and results are entered on the rolls."
 IRE_nu_postwar_veterans_tt:0 "Manpower +5000, war support +5%; gain 'Veteran Resettlement' for 365 days: conscription +5%, stability +5%."
 IRE_nu_postwar_industry:0 "Industrial Conversion"
 IRE_nu_postwar_industry_desc:0 "Wartime factories turn to civilian production in order of trade; the Department of Industry approves the conversion of plant, output returns are made monthly, and materials are allotted on the new quotas. Converted firms may apply for relief on the depreciation of plant."
 IRE_nu_postwar_industry_tt:0 "Political power +25; gain 'Industrial Conversion' for 365 days: factory output +5%, construction speed +5%."
 IRE_nu_postwar_trade:0 "Postwar Trade Mission"
 IRE_nu_postwar_trade_desc:0 "Trade missions go out to Europe and North America; commercial agreements are signed country by country, the terms are cleared between External Affairs and Finance, and orders come back in turn. Mission staff are chosen jointly by Commerce and External Affairs."
 IRE_nu_postwar_trade_tt:0 "Political power +25; gain 'Postwar Trade' for 365 days: trade opinion +10%, consumer goods -5%."
 IRE_nu_postwar_reconstruction_spirit:0 "Postwar Reconstruction"
 IRE_nu_postwar_reconstruction_spirit_desc:0 "Housing, roads and public works begin at once; the Department of Supplies allocates materials, progress is returned quarterly, and completed schemes are handed to the local authorities. Compensation for land taken and buildings cleared is assessed by the land commission."
 IRE_nu_postwar_veterans_spirit:0 "Veteran Resettlement"
 IRE_nu_postwar_veterans_spirit_desc:0 "Returning soldiers receive work and training; the resettlement rolls are held by the veterans' office, housing is allotted by county, and the counties act and report accordingly. Those not yet placed are attached to works squads on weekly pay."
 IRE_nu_postwar_industry_spirit:0 "Industrial Conversion"
 IRE_nu_postwar_industry_spirit_desc:0 "Wartime factories turn to civilian production; the conversion schedules are approved by the Department of Industry, output is returned monthly, and surplus plant is sealed pending allotment. Officers of the Department sit in the plants to check conversion, and finished goods are inspected before dispatch."
 IRE_nu_postwar_trade_spirit:0 "Postwar Trade"
 IRE_nu_postwar_trade_spirit_desc:0 "Trade missions open new markets; orders and exchange are registered by the Department of Commerce, consumer supply eases in consequence, and quotas are revised quarterly. The missions return market reports quarterly, and the Department revises quotas on them."
 IRE_nu_postwar_neutrality_spirit:0 "Armed Neutrality"
 IRE_nu_postwar_neutrality_spirit_desc:0 "Ireland keeps her neutrality by home defence and universal training; the syllabus is issued by Defence, the counties train from their rolls, and the results of each exercise are returned. The results of exercises are compiled in a book at Defence."

 # ===== National Union: postwar domestic and international environment 190-199 =====
 ire_nw.190.t:0 "The Postwar European Conference"
 ire_nw.190.d_red:0 "With Berlin fallen, Europe's red partners and old allies both look to Dublin. New World Ireland must decide which table it sits at in postwar Europe."
 ire_nw.190.d_new_world:0 "With Berlin fallen, Washington and London begin arranging postwar Europe. Dublin receives an invitation, but the seat and the terms depend on which side Ireland is willing to stand with."
 ire_nw.190.d_neutral:0 "With Berlin fallen, Europe is reshuffled. Dublin wants neither the red bloc nor complete alignment with Washington; for the first time, the third force has a real stage."
 ire_nw.190.d:0 "With Berlin fallen, the states of Europe are taking their places again among the ruins. Dublin has not chosen a camp, and the invitation is already with the Department of External Affairs. Some governments propose that Ireland chair the settlement and others prefer a great-power arrangement; the ambassadors have called at the Department of the Taoiseach, and the cabinet is asked to fix a position."
 ire_nw.190.a:0 "Chair a European settlement"
 ire_nw.190.a_tt:0 "Political power -50, stability +5%; Nordic and Low Countries opinion +15, US/Soviet/British opinion +10; establish the 'reconciliation' tone."
 ire_nw.190.b:0 "Back the great-power settlement"
 ire_nw.190.b_tt:0 "Stability +5%; US/Soviet opinion +20, British opinion +10, Nordic and Low Countries opinion -10; establish the 'great-power settlement' tone."
 ire_nw.190.c:0 "Put Ireland first"
 ire_nw.190.c_tt:0 "Stability +5%, war support +5%; US/Soviet/British opinion -10; establish the 'Ireland first' tone."

 ire_nw.191.t:0 "The Division of Occupied Germany"
 ire_nw.191.d_reconciliation:0 "With Germany occupied, Europe's reconciliation camp wants order restored quickly; but the occupation zones have already cut Europe in two."
 ire_nw.191.d_greatpowers:0 "With Germany occupied, Washington, Moscow and London disagree over the zones. Dublin must choose the more useful position between the two occupation blocs."
 ire_nw.191.d_ireland:0 "With Germany occupied, Dublin cares about one thing only: Ireland must not become a bargaining chip in a great-power deal again."
 ire_nw.191.d:0 "Germany is occupied, and the division of Europe is drawn upon the map of the zones. The Department of External Affairs submits three courses: recognition of the western zones, of the Soviet zone, or neutrality for Ireland. The missions in Berlin, Moscow and Washington await instructions."
 ire_nw.191.a:0 "Support the western zones"
 ire_nw.191.a_tt:0 "Parliament influence +4, unionist confidence +3; US opinion +20, British opinion +15, Soviet opinion -20; establish a pro-Western position."
 ire_nw.191.b:0 "Recognise the Soviet zone"
 ire_nw.191.b_tt:0 "Labour influence +4, IRA influence +3, stability -5%; Soviet opinion +20, US/British opinion -15; establish a pro-Soviet position."
 ire_nw.191.c:0 "Keep Ireland neutral"
 ire_nw.191.c_tt:0 "Stability +5%, war support +5%; US/Soviet/British opinion -10; establish a neutral position."

 ire_nw.192.t:0 "The Split between Washington and Moscow"
 ire_nw.192.d:0 "Less than a year after the fighting ended, Washington and Moscow have exchanged probing notes, each holding its ground on occupied territory and reparations. Dublin has received terms of cooperation from both. The Foreign Ministry holds that courting both is no longer possible and asks the cabinet to choose."
 ire_nw.192.a:0 "Lean toward Washington"
 ire_nw.192.a_tt:0 "Parliament influence +4, unionist confidence +3, labour influence -3; US opinion +25, Soviet opinion -20."
 ire_nw.192.b:0 "Lean toward Moscow"
 ire_nw.192.b_tt:0 "Labour influence +5, IRA influence +3, Church confidence -3; Soviet opinion +25, US opinion -20."
 ire_nw.192.c:0 "Remain non-aligned"
 ire_nw.192.c_tt:0 "Stability +5%, war support +5%; US/Soviet opinion -10."

 ire_nw.193.t:0 "The Red Bloc Splits"
 ire_nw.193.d_red:0 "The red bloc splits for the first time after the war: Moscow demands obedience, while the Western red allies want their own road. Dublin must choose a side."
 ire_nw.193.d:0 "Red France or Red Britain falls out with Moscow over the postwar road; the two sides convene their own conferences and exchange restrained letters. Dublin has not gone red in form, yet it is asked to take a position between them. The foreign ministry holds two notes, both requesting an answer before long, and the cabinet is to settle the wording."
 ire_nw.193.a:0 "Stand with Moscow."
 ire_nw.193.a_tt:0 "Labour influence +4, IRA influence +3, stability -5%; Soviet opinion +25, red France/Britain opinion -15."
 ire_nw.193.b:0 "Stand with the Western allies."
 ire_nw.193.b_tt:0 "Labour influence +5, Church confidence -2, stability +5%; red France/Britain opinion +25, Soviet opinion -15."
 ire_nw.193.c:0 "Mediate between them."
 ire_nw.193.c_tt:0 "Labour influence +2, stability +5%, political power -50; Soviet and red France/Britain opinion +10."

 ire_nw.194.t:0 "The Marshall Plan"
 ire_nw.194.d:0 "Washington has proposed a European reconstruction programme. The funds are considerable and the condition is stated: recipients must keep Moscow at a political distance. External Affairs has translated the note and the annexed terms, Finance has added its estimate, and the cabinet is to decide on acceptance, the reply to be drafted by External Affairs."
 ire_nw.194.a:0 "Accept the aid."
 ire_nw.194.a_tt:0 "Parliament influence +4, unionist confidence +3, labour influence -3; US opinion +30, Soviet opinion -15; gain 'American Loan' for 365 days."
 ire_nw.194.b:0 "Negotiate the terms."
 ire_nw.194.b_tt:0 "Parliament influence +2, stability +5%, political power -25; US opinion +10."
 ire_nw.194.c:0 "Refuse the aid."
 ire_nw.194.c_tt:0 "Labour influence +3, stability +5%, war support +5%; US opinion -25."

 ire_nw.195.t:0 "The Old Empires Crumble"
 ire_nw.195.d:0 "The war has weakened the old empires. The colonies of London and Paris ask for independence one after another, and their delegates go to Dublin and to Washington to state the case. External Affairs prepares two papers, one for self-determination and one for the old order. The cabinet must choose between them; both have gone to the Dail."
 ire_nw.195.a:0 "Support colonial independence."
 ire_nw.195.a_tt:0 "Political power +25, stability +5%; British/French opinion -15, US/Soviet opinion +10."
 ire_nw.195.b:0 "Support the European empires."
 ire_nw.195.b_tt:0 "Political power -25, stability +5%, labour influence -3, Church confidence +3; British/French opinion +20."
 ire_nw.195.c:0 "Keep trade neutral."
 ire_nw.195.c_tt:0 "Political power +25, stability +5%; gain 'Postwar Trade' for 365 days."

 ire_nw.196.t:0 "The Veterans Return"
 ire_nw.196.d:0 "The war is over and Irish soldiers are returning home in large numbers. Housing, work and training are not enough to meet them, and the veterans' associations have sent petitions to the Department of Defence. The veterans' office has drafted three schemes, for resettlement, employment and retrenchment, and they go to the cabinet."
 ire_nw.196.a:0 "Resettle them generously"
 ire_nw.196.a_tt:0 "Political power -50, stability +5%, manpower +5000; gain 'Veteran Resettlement' for 365 days."
 ire_nw.196.b:0 "An employment programme"
 ire_nw.196.b_tt:0 "Political power -25, stability +5%, manpower +2500; gain 'Industrial Conversion' for 365 days."
 ire_nw.196.c:0 "Retrenchment"
 ire_nw.196.c_tt:0 "Political power +25, stability -5%, manpower +2500."

 ire_nw.197.t:0 "Reconstruction and Emigration"
 ire_nw.197.d:0 "Reconstruction calls for money and for men. The Department of Finance submits three courses: housing and public works first, the return of emigrants to settle, or a budget of retrenchment. The detailed rules for each are numbered and laid before the Dail's finance committee."
 ire_nw.197.a:0 "Build housing and rebuild"
 ire_nw.197.a_tt:0 "Political power -50, stability +5%; gain 'Postwar Reconstruction' for 365 days."
 ire_nw.197.b:0 "Encourage the return of emigrants"
 ire_nw.197.b_tt:0 "Political power -25, stability +5%, manpower +10000."
 ire_nw.197.c:0 "Adopt a budget of retrenchment"
 ire_nw.197.c_tt:0 "Political power +25, stability -5%."

 ire_nw.198.t:0 "The Third Force Summit"
 ire_nw.198.d:0 "Both blocs are courting Dublin, and the third force now has room to convene. The Foreign Ministry proposes to invite delegations to Dublin under the name of a conference of non-aligned states, with trade, disarmament and the security of neutrals on the agenda. The cabinet is asked to settle the standing of the conference and who is to preside."
 ire_nw.198.a:0 "Host a non-aligned summit"
 ire_nw.198.a_tt:0 "Political power -50, stability +5%, war support +5%; gain 'Third Force Coordination' for 365 days."
 ire_nw.198.b:0 "Trade at equal distance"
 ire_nw.198.b_tt:0 "Political power +25, stability +5%; gain 'Postwar Trade' for 365 days."
 ire_nw.198.c:0 "Keep to armed neutrality"
 ire_nw.198.c_tt:0 "Political power -25, war support +5%, army experience +50; gain 'Armed Neutrality' for 365 days."

 ire_nw.199.t:0 "The Postwar Security Framework"
 ire_nw.199.d:0 "The new security framework is drafted by several great powers, its articles covering spheres of influence, base leases and disarmament inspection. Dublin receives a formal invitation, and separate proposals from the neutral states. The foreign ministry sets out three courses, accession, independence and a European neutral zone, and sends them to the cabinet with a comparative table of the proposals."
 ire_nw.199.a:0 "Join the new security framework."
 ire_nw.199.a_tt:0 "Political power -25, stability +5%, war support +5%; US/Soviet/British opinion +10."
 ire_nw.199.b:0 "Stay independent."
 ire_nw.199.b_tt:0 "Stability +5%, war support +5%; US/Soviet opinion -10."
 ire_nw.199.c:0 "Promote a European neutral zone."
 ire_nw.199.c_tt:0 "Political power -50, stability +5%; US/Soviet opinion -5, Nordic and Low Countries opinion +15."

 ire_nw.200.t:0 "The Fall of Moscow"
 ire_nw.200.d:0 "Moscow has fallen and the Soviet line in Europe is collapsing. Dublin has extended an offer: the Hope of Europe will take in the Soviet Union and its satellites. The draft terms have gone to the member states, and Dublin awaits Moscow's answer."
 ire_nw.200.a:0 "Join with all the satellites."
 ire_nw.200.a_tt:0 "The Soviet Union, its satellites and allies join the European Hope; political power -25, stability +5%, war support +10%; Irish opinion +40."
 ire_nw.200.b:0 "Admit the Soviet Union alone."
 ire_nw.200.b_tt:0 "Only the Soviet Union joins the European Hope; stability +5%, war support +5%; Irish opinion +25."
 ire_nw.200.c:0 "Refuse and fight on alone."
 ire_nw.200.c_tt:0 "Stability +5%, war support +5%; Irish opinion -20."

 ire_nw.201.t:0 "The Next Step for National Unity"
 ire_nw.201.d:0 "The National Unity Programme is complete, but the National Unity Government has not yet convened. The four factions are still waiting for Dublin's invitation, and seats and offices are unsettled. The Taoiseach's office has fixed the delegates and the date, and the draft agenda, with the reservations of each faction, is before the cabinet; it may be convened directly here."
 ire_nw.201.a:0 "Convene the National Unity Government now."
 ire_nw.201.a_tt:0 "Complete the focus 'Convene the National Unity Government', form the National Union, and trigger its formation event."
 ire_nw.201.b:0 "Take it up later."
 ire_nw.201.b_tt:0 "Do not form it immediately; the focus can still be completed manually."
