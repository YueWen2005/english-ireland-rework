 # ===== Irish National Union: preparation and formation events =====
 ire_nw.142.t:0 "The National Accord"
 ire_nw.142.d_civic:0 "With Northern Ireland back in the Republic, the parliament, unions and local assemblies of the Civic Republic begin to discuss a wider union. Unionists demand guarantees, labour demands seats, and the old IRA demands recognition. Dublin must set the tone of the round table."
 ire_nw.142.d_firm:0 "With Northern Ireland back in the Republic, the Centralised Republic summons the four blocs to a defence cabinet. The security services want order, the unions want compensation, and the Republican Army wants a place in the order of battle. Dublin must set the tone of the union."
 ire_nw.142.d:0 "With Northern Ireland back in the Republic, Dublin brings parliament, labour, the army and the Republican Army to one table. They agree on one thing: Ireland must be united. How to unite it, they are prepared to argue about for months."
 ire_nw.142.a:0 "A round-table compromise."
 ire_nw.142.b:0 "Firm integration."
 ire_nw.142.c:0 "Let the republican wing march in."
 ire_nw.150.t:0 "The National Union Is Constituted"
 ire_nw.150.d_roundtable:0 "The round-table compromise sets the tone of the union. The four blocs enter the cabinet, unionists and the Church receive guarantees, and parliament controls the agenda. Dublin must now decide who speaks first in the coalition."
 ire_nw.150.d_firm:0 "Firm integration sets the tone of the union. The security services hold order, while labour and the Republican Army are brought under supervision. Dublin must now decide who speaks first in the coalition."
 ire_nw.150.d_republican:0 "The republican entry sets the tone of the union. The old IRA receives recognition, while unionists and the Church remain wary. Dublin must now decide who speaks first in the coalition."
 ire_nw.150.d:0 "The four blocs reach a reluctant union in Dublin. No one is fully satisfied, but everyone knows that division is more dangerous than argument. Dublin must now decide who speaks first in the coalition."
 ire_nw.150.a:0 "Let parliament control the agenda."
 ire_nw.150.b:0 "Give labour a real seat."
 ire_nw.150.c:0 "Let the security services keep order."
 ire_nw.150.e:0 "Bring the Republican Army into the government."
 IRE_A_national_union_parliament:0 "Parliamentary Consensus"
 IRE_A_national_union_parliament_desc:0 "Put parliament at the centre of the coalition: procedure, budgets and elections belong to civilians. Unionists and the Church receive guarantees."
 IRE_A_national_union_labour:0 "Labour Compact"
 IRE_A_national_union_labour_desc:0 "Give the unions a real seat: wages, hours and public works enter the government agenda. The Church remains wary."
 IRE_A_national_union_security:0 "Public Security"
 IRE_A_national_union_security_desc:0 "Let the security services hold order: the Special Branch, army loyalty and emergency powers become pillars of the coalition. The Republican Army is squeezed."
 IRE_A_national_union_ira:0 "Republican Army Integration"
 IRE_A_national_union_ira_desc:0 "Bring the Republican Army into the state: veterans, volunteer networks and cross-border operations receive formal recognition. Unionists remain wary."
 IRE_A_national_union_revival:0 "National Revival"
 IRE_A_national_union_revival_desc:0 "All four blocs have a place in government, and no single bloc can dominate the others. Dublin can finally write 'unity' into the national spirit."
 IRE_effect_nu_pillar_parliament:0 "Parliament influence +10, unionist confidence +5; political power +50, stability +5%; unlocks the parliament method decisions."
 IRE_effect_nu_pillar_labour:0 "Labour influence +10, Church confidence -3; political power +25, manpower +5000; unlocks the labour method decisions."
 IRE_effect_nu_pillar_security:0 "Security influence +10, IRA influence -3; war support +5%, army experience +25; unlocks the security method decisions."
 IRE_effect_nu_pillar_ira:0 "IRA influence +10, unionist confidence -3; manpower +5000, army experience +25; unlocks the IRA method decisions."
 IRE_tt_nu_revival_conditions:0 "All four blocs must be between 20 and 60, and both unionist and Church confidence must be at least 60."
 IRE_tt_nu_cross_border:0 "Black Britain has been formed, or an Irish core state is controlled by an enemy."
 IRE_nu_parliament_convention:0 "National Convention"
 IRE_nu_parliament_convention_desc:0 "Convene national delegates, unions and local assemblies to put the coalition's agenda on the table."
 IRE_nu_parliament_diaspora:0 "Diaspora Lobby"
 IRE_nu_parliament_diaspora_desc:0 "Let the Irish abroad speak for Dublin: trade, investment and public opinion arrive together."
 IRE_nu_labour_councils:0 "Workers' Councils"
 IRE_nu_labour_councils_desc:0 "Bring factory councils into the coalition and let workers take part in production decisions."
 IRE_nu_labour_public_works:0 "Public Works"
 IRE_nu_labour_public_works_desc:0 "Trade roads, ports and housing for union support; employment is the best political currency."
 IRE_nu_security_special_branch:0 "Special Branch"
 IRE_nu_security_special_branch_desc:0 "Expand the Special Branch to watch extremists, and also the coalition's rivals."
 IRE_nu_security_army_loyalty:0 "Army Loyalty"
 IRE_nu_security_army_loyalty_desc:0 "Have the army swear loyalty to the coalition government, not to a single bloc."
 IRE_nu_ira_volunteer_network:0 "Volunteer Network"
 IRE_nu_ira_volunteer_network_desc:0 "Fold the old IRA's volunteer network into the national mobilisation system and give veterans formal standing."
 IRE_nu_ira_cross_border:0 "Cross-Border Operations"
 IRE_nu_ira_cross_border_desc:0 "Run intelligence and sabotage operations across the border; only available when Black Britain exists or the homeland is threatened."
 IRE_nu_parliament_spirit:0 "National Convention Afterglow"
 IRE_nu_parliament_spirit_desc:0 "The parliamentary bloc holds the upper hand in the coalition: a small boost to stability and political power."
 IRE_nu_diaspora_spirit:0 "Diaspora Network"
 IRE_nu_diaspora_spirit_desc:0 "The trade and public-opinion networks of the Irish abroad begin to pay off in Dublin."
 IRE_nu_labour_spirit:0 "Workers' Councils"
 IRE_nu_labour_spirit_desc:0 "Factory councils tie industrial efficiency to political mobilisation."
 IRE_nu_works_spirit:0 "Public Works Boom"
 IRE_nu_works_spirit_desc:0 "Roads, ports and housing break ground together; construction speed and consumer pressure improve."
 IRE_nu_security_spirit:0 "Special Branch"
 IRE_nu_security_spirit_desc:0 "The security services hold order inside the coalition; stability and war support improve slightly."
 IRE_nu_army_spirit:0 "Army Loyalty"
 IRE_nu_army_spirit_desc:0 "The army swears loyalty to the coalition; defence and war support improve slightly."
 IRE_nu_volunteer_spirit:0 "Volunteer Network"
 IRE_nu_volunteer_spirit_desc:0 "The old IRA's volunteer network is folded into national mobilisation; conscription and attack improve slightly."
 IRE_nu_cross_border_spirit:0 "Cross-Border Operations"
 IRE_nu_cross_border_spirit_desc:0 "Intelligence and sabotage operations across the border begin to bear fruit."
 IRE_national_revival:0 "National Revival"
 IRE_national_revival_desc:0 "The four blocs have found a balance inside the coalition. Dublin can finally claim that the Irish no longer consume each other over old scores."
 ire_nw.151.t:0 "Coalition Crisis"
 ire_nw.151.d:0 "The argument between the four blocs has spilled from parliament into the streets. One bloc dominates the government and the others are openly complaining. Dublin must decide whether to mediate, reshuffle the cabinet, or let the coalition exhaust itself."
 ire_nw.151.a:0 "Mediate."
 ire_nw.151.b:0 "Reshuffle the cabinet."
 ire_nw.151.c:0 "Let them argue."
 ire_nw.153.t:0 "Confidence Crisis"
 ire_nw.153.d:0 "Unionists or the Church have lost patience with the coalition. Strikes, sermons and newspaper editorials all point at Dublin. The government must respond, or the coalition's legitimacy will keep draining away."
 ire_nw.153.a:0 "Make concessions."
 ire_nw.153.b:0 "Suppress them."
 ire_nw.153.c:0 "Ignore them."
 IRE_A_postwar_red:0 "Red Partnership"
 IRE_A_postwar_red_desc:0 "Turn New World Ireland's foreign focus toward the red bloc: deeper cooperation with Moscow, the French Commune and the Union of Britain. The coalition does not change ideology, only its external patron."
 IRE_A_postwar_new_world:0 "New World Democracy"
 IRE_A_postwar_new_world_desc:0 "Turn the foreign focus back to the United States and the democratic camp: replace the old empire with an Atlantic economic and security framework while keeping the national union at home."
 IRE_A_postwar_neutral:0 "Third Force"
 IRE_A_postwar_neutral_desc:0 "Refuse both blocs and turn the Irish National Union into an independent third force. With a balanced coalition, Dublin can pursue the higher pure-union ending."
 IRE_nu_red_partnership:0 "Red Partnership"
 IRE_nu_red_partnership_desc:0 "Dublin establishes a formal partnership with the red bloc; stability, political power and war support improve slightly."
 IRE_nu_new_world_partnership:0 "New World Partnership"
 IRE_nu_new_world_partnership_desc:0 "Dublin reconnects to the US-led economic and security network; consumer goods, factory output and trade opinion improve."
 IRE_nu_third_force:0 "Third Force"
 IRE_nu_third_force_desc:0 "The Irish National Union refuses to join either bloc; stability, war support and defence improve slightly."
 ire_nw.154.t:0 "Red Partnership"
 ire_nw.154.d:0 "With Berlin fallen, the red bloc reaches out to Dublin. Moscow, the French Commune and the Union of Britain all want to know how far New World Ireland is willing to go. Dublin can integrate fully with the red bloc, or keep its room for manoeuvre with limited cooperation."
 ire_nw.154.a:0 "Full cooperation."
 ire_nw.154.b:0 "Limited cooperation."
 ire_nw.155.t:0 "New World Democracy"
 ire_nw.155.d:0 "Washington offers Dublin a new economic and security framework. The United States wants Ireland back in the Atlantic community, not lingering as an uncertain European orphan. Dublin can integrate fully, or preserve the independent space of New World Ireland."
 ire_nw.155.a:0 "Atlantic partner."
 ire_nw.155.b:0 "New World independence."
 ire_nw.156.t:0 "Third Force"
 ire_nw.156.d:0 "Both blocs court Dublin, but the National Union can choose a third path: join neither, and turn Ireland into an independent third force. If the four blocs remain balanced and unionist and Church confidence hold, Dublin can go further still: a true pure national union."
 ire_nw.156.a:0 "Armed neutrality."
 ire_nw.156.b:0 "Pure national union."
 IRE_nu_postwar_cat:0 "Postwar Alignment"
 IRE_nu_red_economic_mission:0 "Red Economic Mission"
 IRE_nu_red_economic_mission_desc:0 "Connect trade, investment and industrial cooperation to the red bloc; Dublin remains a national union, but money and machines begin to move east."
 IRE_nu_red_military_mission:0 "Red Military Mission"
 IRE_nu_red_military_mission_desc:0 "Accept military aid, equipment and training from the red bloc; the coalition keeps its flag, but the army begins to speak the same language."
 IRE_nu_atlantic_loan:0 "Atlantic Loan"
 IRE_nu_atlantic_loan_desc:0 "Rebuild New World Ireland with American loans and industrial goods; consumer pressure falls and factories reopen."
 IRE_nu_atlantic_defence:0 "Atlantic Defence"
 IRE_nu_atlantic_defence_desc:0 "Cooperate with the United States and the democratic navies for training, naval technology and air experience."
 IRE_nu_third_force_summit:0 "Third Force Summit"
 IRE_nu_third_force_summit_desc:0 "Invite the non-aligned states to Dublin and build a diplomatic network outside both blocs."
 IRE_nu_third_force_armed:0 "Armed Neutrality"
 IRE_nu_third_force_armed_desc:0 "Use conscription, training and homeland defence to turn the third force into something no one can touch lightly."
 IRE_nu_red_cooperation:0 "Red Cooperation"
 IRE_nu_red_cooperation_desc:0 "Dublin's economic and military cooperation with the red bloc is deepening."
 IRE_nu_atlantic_cooperation:0 "Atlantic Cooperation"
 IRE_nu_atlantic_cooperation_desc:0 "Dublin is reconnecting to the US-led economic and defence network."
 IRE_nu_third_force_cooperation:0 "Third Force Coordination"
 IRE_nu_third_force_cooperation_desc:0 "Dublin coordinates positions among the non-aligned states and strengthens the third force's independent space."
 IRE_A_nu_charter_parliament:0 "Parliamentary Charter"
 IRE_A_nu_charter_parliament_desc:0 "Write parliament's procedure, budget and electoral authority into the coalition's fundamental law. Unionists and the Church receive formal guarantees, but the parliamentary bloc now holds the centre of the state machine."
 IRE_A_nu_charter_labour:0 "Labour Charter"
 IRE_A_nu_charter_labour_desc:0 "Write the unions' rights over wages, hours and public works into the charter. Labour gains an institutional seat, and the Church begins to worry."
 IRE_A_nu_charter_security:0 "National Security Act"
 IRE_A_nu_charter_security_desc:0 "Write the Special Branch, army loyalty and emergency powers into a National Security Act. The security bloc gains legal tools, and the Republican Army is squeezed further."
 IRE_A_nu_charter_ira:0 "Republican Army Act"
 IRE_A_nu_charter_ira_desc:0 "Give the old IRA's volunteer network, veterans and cross-border operations a formal legal status. The republican bloc finally enters the state, while unionists remain wary."
 IRE_effect_nu_charter_parliament:0 "Political power +100, stability +5%; triggers the parliamentary charter environment event."
 IRE_effect_nu_charter_labour:0 "Manpower +10000, political power +50; triggers the labour charter environment event."
 IRE_effect_nu_charter_security:0 "War support +5%, army experience +50; triggers the National Security Act environment event."
 IRE_effect_nu_charter_ira:0 "Manpower +10000, army experience +50; triggers the Republican Army Act environment event."
 ire_nw.160.t:0 "The Parliamentary Charter"
 ire_nw.160.d:0 "With the parliamentary charter published, unionists, the Church and the foreign press all watch Dublin. The charter hands procedure, budgets and elections to civilians, but unionists fear they have only been written into the preamble, and the Church fears a secular parliament will expand further. Dublin must decide how to make the charter real."
 ire_nw.160.a:0 "Reassure the unionists."
 ire_nw.160.b:0 "Push parliamentary reform."
 ire_nw.160.c:0 "Coordinate with the red allies."
 ire_nw.161.t:0 "The Labour Charter"
 ire_nw.161.d:0 "The labour charter writes wages, hours and public works into law. Labour finally has an institutional seat, but the Church and unionists begin to ask whether the coalition is becoming a trade-union government."
 ire_nw.161.a:0 "Public works first."
 ire_nw.161.b:0 "Reassure the Church."
 ire_nw.161.c:0 "A wartime labour compact."
 ire_nw.162.t:0 "The National Security Act"
 ire_nw.162.d:0 "The National Security Act expands the powers of the Special Branch and the army. Security calls it order, the Republican Army calls it a weapon aimed at them, and unionists demand civilian oversight. Dublin must decide who defines 'security'."
 ire_nw.162.a:0 "Restore order."
 ire_nw.162.b:0 "Civilian oversight."
 ire_nw.162.c:0 "Stand firm against Black Britain."
 ire_nw.163.t:0 "The Republican Army Act"
 ire_nw.163.d:0 "The Republican Army Act gives the old IRA's volunteer network, veterans and cross-border operations formal standing. The republican bloc finally enters the state; unionists remain wary, and London and Washington are watching."
 ire_nw.163.a:0 "Integrate them into the army."
 ire_nw.163.b:0 "Reassure the unionists."
 ire_nw.163.c:0 "Cross-border operations."
 ire_nw.164.t:0 "The World Reacts to the National Union"
 ire_nw.164.d:0 "News of the National Union in Dublin reaches Washington, Moscow and London. An Ireland governed by four blocs together is neither the old Free State nor a client of any great power. All three are waiting for Dublin to speak first."
 ire_nw.164.a:0 "Reassure Washington."
 ire_nw.164.b:0 "Open the door to Moscow."
 ire_nw.164.c:0 "Dublin first."
 IRE_national_revival_fragile:0 "Fragile Revival"
 IRE_national_revival_fragile_desc:0 "The four blocs barely hold a balance; stability, political power and war support improve slightly, but consumer pressure remains."
 IRE_nu_repair_revival:0 "Repair the National Revival"
 IRE_nu_repair_revival_desc:0 "After bringing the four blocs back into balance, upgrade the fragile revival into a full revival."
 IRE_effect_nu_repair_revival:0 "Remove Fragile Revival and gain the full National Revival spirit; stability +5%."
 ire_nw.165.t:0 "The Coalition's Fracture"
 ire_nw.165.d:0 "Northern Ireland is no longer under the Republic's control. All four blocs in the coalition ask the same question: is a national union that has lost the six counties still a national union? Dublin can reaffirm the union, suspend it, or prepare to retake the north."
 ire_nw.165.a:0 "Reaffirm the union."
 ire_nw.165.b:0 "Suspend the union."
 ire_nw.165.c:0 "Prepare to retake the north."
 ire_nw.166.t:0 "The Coalition and the New Regime"
 ire_nw.166.d:0 "Dublin has changed its form of government, and the four blocs begin to question whether the coalition still stands. Some demand that the coalition government be kept, some demand its dissolution, and others want it remade as part of the new regime."
 ire_nw.166.a:0 "Keep the coalition government."
 ire_nw.166.b:0 "Dissolve the union."
 ire_nw.166.c:0 "Remake the union."
 ire_nw.168.t:0 "A Fragile Revival"
 ire_nw.168.d:0 "The four blocs have signed the charters, but the balance has not truly taken hold. The spirit of national revival has appeared, yet it is visibly cracked. Dublin can accept this fragile balance, or spend political power to repair it into a true revival."
 ire_nw.168.a:0 "Accept the fragile balance."
 ire_nw.168.b:0 "Spend political power to repair it."
 ire_nw.168.c:0 "Let time settle the contradiction."

