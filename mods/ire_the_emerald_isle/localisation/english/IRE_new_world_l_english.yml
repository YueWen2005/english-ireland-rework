l_english:
 # ===== A-line: New World Ireland focuses =====
 IRE_A_home_development:0 "National Development Board"
 IRE_A_home_development_desc:0 "The Shannon, the bogs and the ports are finally planned as one national grid. For the first time Dublin is thinking about the whole island."
 IRE_A_mineral_survey:0 "National Mineral Survey"
 IRE_A_mineral_survey_desc:0 "Geologists take their drills into Connaught and Munster. The coal, iron and tungsten deposits are modest, but enough to keep the factories turning."
 IRE_A_infrastructure_programme:0 "National Infrastructure Programme"
 IRE_A_infrastructure_programme_desc:0 "Roads, railways, power stations and Shannon Airport break ground together. Ireland is no longer just a farm on the edge of the Atlantic."
 IRE_A_world_congress:0 "World Irish Congress"
 IRE_A_world_congress_desc:0 "From Boston to Buenos Aires, from Liverpool to Paris, Irish delegates sit at one table for the first time. Requires the Celtic diaspora network to reach 60 and the date to be after June 1940."
 IRE_A_green_dollar:0 "Green Dollar"
 IRE_A_green_dollar_desc:0 "Remittances are no longer just money orders. They are capital Dublin can direct."
 IRE_A_wild_geese_legion:0 "Wild Geese Legion"
 IRE_A_wild_geese_legion_desc:0 "The descendants of the Wild Geese come home with military experience and form a real expeditionary army."
 IRE_A_spanish_volunteers:0 "The Wild Geese Expedition"
 IRE_A_spanish_volunteers_desc:0 "Franco's rebellion has torn Spain apart. Dublin sends the descendants of the Wild Geese to Iberia under the banner of a volunteer expedition. It is not a national war, but it will give Ireland a real expeditionary army. Whatever the state of the Spanish war, the name of the Wild Geese can still serve Ireland. After completion, sending volunteers is no longer restricted by world tension."
 IRE_A_canada_independence:0 "Inciting Canadian Independence"
 IRE_A_canada_independence_desc:0 "The link between Ottawa and London is loosening. Requires Canada to exist and not have capitulated, and Britain not to be at war with us. Canada leaves any faction; if still a British dominion it becomes independent and is barred from rejoining."
 IRE_A_atlantic_fleet:0 "Atlantic Fleet"
 IRE_A_atlantic_fleet_desc:0 "From Newfoundland to Cork, a small but sharp fleet begins to escort the Atlantic routes."
 IRE_A_air_bridge:0 "Transatlantic Air Bridge"
 IRE_A_air_bridge_desc:0 "Shannon becomes a staging post for the transatlantic route; fighters, patrol aircraft and mail land together."
 IRE_A_irish_question:0 "The Irish Question"
 IRE_A_irish_question_desc:0 "The Irish of Liverpool, Glasgow and London begin to keep Westminster awake at night."
 IRE_A_tammany_hall:0 "Tammany Hall"
 IRE_A_tammany_hall_desc:0 "The Irish political machines of Boston and New York work for the old country for the first time."
 IRE_A_wild_geese_paris:0 "The Wild Geese of Paris"
 IRE_A_wild_geese_paris_desc:0 "France has not forgotten the Irish who fought for her. In the salons of Paris, the name of the Wild Geese is heard again."
 IRE_A_green_international:0 "Green International"
 IRE_A_green_international_desc:0 "The Irish scattered across the great powers finally have one political voice."
 IRE_A_atlantic_charter:0 "Atlantic Charter"
 IRE_A_atlantic_charter_desc:0 "Not an empire, but a commonwealth: the Irish on both sides of the Atlantic unite by charter instead of cannon. Guarantees the USA, France, Mexico and Argentina if they are not already in European Hope."
 IRE_A_new_world_expedition:0 "New World Expedition"
 IRE_A_new_world_expedition_desc:0 "If London will not let go, take it. Requires Canada to be annexed first; if Britain has not joined European Hope, gain a wargoal for Northern Ireland; the Wild Geese Legion and the Atlantic Fleet will plant the flag where it belongs."
 IRE_A_canada_annex:0 "Annex Canada"
 IRE_A_canada_annex_desc:0 "Canada is free of London, but not yet part of Dublin. One act of the Dáil and the army moves north: British North America becomes the western half of New World Ireland. Requires Canada to exist, be independent and not be at war with us."
 IRE_A_new_world_ireland:0 "New World Ireland"
 IRE_A_new_world_ireland_desc:0 "The Canadian provinces are not a colony but a core of the Irish nation. From Newfoundland to British Columbia, every state receives full representation in the Dáil. Requires British North America to have been annexed."
 IRE_A_nordic_bridge:0 "The Northern Bridge"
 IRE_A_nordic_bridge_desc:0 "The small democratic states of the north watch the great powers carve up Europe. Dublin offers them something London and Berlin cannot: a partner with no territorial claims in the Baltic. Requires at least one of Sweden, Norway, Denmark or Finland to exist."
 IRE_A_nordic_alliance:0 "The New World Alliance"
 IRE_A_nordic_alliance_desc:0 "A northern league of small nations, led from Dublin. Friendly Nordic states join at once; the rest receive an Irish guarantee until they are ready."

 # ===== Ideas =====
 IRE_home_development:0 "National Development Board"
 IRE_home_development_desc:0 "A state-led industrial programme. Construction crews, survey teams and power engineers move out together."
 IRE_diaspora_bond_drive:0 "Diaspora Bonds"
 IRE_diaspora_bond_drive_desc:0 "Bonds bought by the Irish abroad are financing factories and ports."
 IRE_world_congress:0 "World Irish Congress"
 IRE_world_congress_desc:0 "Overseas delegates meet regularly to coordinate propaganda, fundraising and volunteers."
 IRE_green_dollar:0 "Green Dollar"
 IRE_green_dollar_desc:0 "Remittances, investment and trade are turning the Atlantic into a green artery of capital."
 IRE_wild_geese_legion:0 "Wild Geese Legion"
 IRE_wild_geese_legion_desc:0 "The descendants of exiled soldiers return to Ireland with experience, medals and a score to settle."
 IRE_spanish_volunteers:0 "Wild Geese Volunteers"
 IRE_spanish_volunteers_desc:0 "The Wild Geese of Ireland and America fight side by side in Spain. Dublin can send far more volunteer divisions abroad, no longer limited by the size of its standing army or by world tension."
 IRE_british_north_america:0 "British North America Reclaimed"
 IRE_british_north_america_desc:0 "The Dominion of Canada is joined to New World Ireland. The factories and manpower of the St. Lawrence and the Great Lakes now serve Dublin."
 IRE_atlantic_fleet:0 "Atlantic Fleet"
 IRE_atlantic_fleet_desc:0 "A small navy built around escort and convoy raiding."
 IRE_air_bridge:0 "Transatlantic Air Bridge"
 IRE_air_bridge_desc:0 "The Shannon-Newfoundland-Boston air corridor."
 IRE_green_international:0 "Green International"
 IRE_green_international_desc:0 "An Irish political network spanning Britain and America."
 IRE_atlantic_charter:0 "Atlantic Charter"
 IRE_atlantic_charter_desc:0 "A political charter signed by the Irish on both sides of the Atlantic."
 IRE_atlantic_emergency:0 "Atlantic Defence Regime"
 IRE_atlantic_emergency_desc:0 "With war reaching the Atlantic, Dublin folds home defence, coastal watch, and national mobilisation into a single emergency regime."
 IRE_new_world_expedition:0 "New World Expedition"
 IRE_new_world_expedition_desc:0 "Ireland is no longer content to defend."
 IRE_eng_irish_question:0 "The Irish Question"
 IRE_eng_irish_question_desc:0 "The British government finds that Irish workers and voters are no longer silent."
 IRE_eng_dock_strike:0 "Parliamentary and Union Pressure"
 IRE_eng_dock_strike_desc:0 "Labour MPs, union delegations, and local newspapers coordinate their pressure on Downing Street - questions, petitions, and headlines instead of barricades."
 IRE_eng_ira_campaign:0 "Labour-Liberal United Front"
 IRE_eng_ira_campaign_desc:0 "Labour, the Liberals, and union papers form a common front, exposing London's war narrative in Parliament and the constituencies."
 IRE_usa_irish_lobby:0 "Irish-American Lobby"
 IRE_usa_irish_lobby_desc:0 "In the corridors of Washington, Irish-American congressmen speak for the old country."
 IRE_fra_irish_sympathy:0 "French Irish Sympathy"
 IRE_fra_irish_sympathy_desc:0 "The Paris press begins to report at length on Ireland's plight."

 # ===== Decision categories =====
 IRE_home_cat:0 "Homeland Development"
 IRE_congress_cat:0 "World Irish Congress"
 IRE_interference_cat:0 "Overseas Democratic Contacts"
 IRE_nordic_cat:0 "Northern Affairs"

 # ===== Homeland decisions =====
 IRE_dev_leinster:0 "Develop the Leinster Industrial Belt"
 IRE_dev_leinster_desc:0 "Dublin, Wexford and Tullamore: factories and railways spread together. Up to 7 stages (about 25 building slots)."
 IRE_dev_munster:0 "Develop Munster and Cork Harbour"
 IRE_dev_munster_desc:0 "The docks and railways of Cork carry the south's produce abroad. Up to 7 stages (about 25 building slots)."
 IRE_dev_connaught:0 "Develop Connaught and the Shannon"
 IRE_dev_connaught_desc:0 "Hydroelectricity, the airport and an industrial park on the Shannon. Up to 7 stages (about 25 building slots)."
 IRE_national_mining:0 "National Mining Survey"
 IRE_national_mining_desc:0 "Coal, iron and tungsten deposits are written into the geological report; the survey can be repeated every 180 days."
 IRE_national_research:0 "National Research Institute"
 IRE_national_research_desc:0 "University College Dublin and the Shannon laboratories receive new funding. The National Research Institute adds two research slots."

 # ===== Congress decisions =====
 IRE_diaspora_bonds:0 "Issue Diaspora Bonds"
 IRE_diaspora_bonds_desc:0 "Sell bonds to the Irish communities of Boston, New York and Buenos Aires."
 IRE_call_wild_geese:0 "Call the Wild Geese"
 IRE_call_wild_geese_desc:0 "Open recruiting stations in the Irish communities of the Americas."
 IRE_request_us_surplus:0 "American Surplus"
 IRE_request_us_surplus_desc:0 "Washington is willing to sell its surplus equipment to Dublin."
 IRE_atlantic_escort:0 "Atlantic Escort"
 IRE_atlantic_escort_desc:0 "More transports and escorts for the transatlantic route."
 IRE_ferry_command:0 "Ferry Command"
 IRE_ferry_command_desc:0 "A transatlantic ferry squadron at Shannon."
 IRE_green_international_congress:0 "Convene the Green International"
 IRE_green_international_congress_desc:0 "Make the Irish delegates of Britain, America and France take a public stand."

 # ===== Interference decisions =====
 IRE_liverpool_strike:0 "Parliamentary and Union Pressure"
 IRE_liverpool_strike_desc:0 "Labour MPs, union delegations, and local newspapers press Downing Street at once. No barricades - just questions, petitions, and headlines."
 IRE_ira_infiltration:0 "Contacts with British Democrats"
 IRE_ira_infiltration_desc:0 "Irish diplomats and G2 build quiet channels to Labour, Liberal, and union circles in Britain."
 IRE_american_volunteers:0 "American Volunteers"
 IRE_american_volunteers_desc:0 "Irish-American youths from Boston and Chicago sign up for Ireland."
 IRE_green_vote:0 "The Green Vote"
 IRE_green_vote_desc:0 "Put the Irish question into American elections."
 IRE_french_arms:0 "French Arms"
 IRE_french_arms_desc:0 "The Paris arsenal opens to Dublin."
 IRE_irish_brigade:0 "The Irish Brigade"
 IRE_irish_brigade_desc:0 "Raise an Irish volunteer brigade in France under the name of the Wild Geese."

 # ===== Event ire.70 =====
 ire.70.t:0 "The Green International"
 ire.70.d:0 "In the great hall of Dublin Castle, delegates from Liverpool, Boston, New York, Paris and Buenos Aires sit together for the first time. No crown, no empire, only sheets of paper bearing the same sentence: Ireland is no longer a problem of one island."
 ire.70.a:0 "Let the green flag rise on every continent."

 # ===== Newfoundland referendum tooltips =====
 ire.10_success_tt:0 "§GReferendum passed!§! Newfoundland will join Ireland."
 ire.10_fail_tt:0 "§RReferendum failed.§! London protests sharply (UK opinion -40, stability -5%)."

