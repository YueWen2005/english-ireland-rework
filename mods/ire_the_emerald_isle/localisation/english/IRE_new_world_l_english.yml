 # ===== A-line diplomatic environment events =====
 ire_nw.80.t:0 "The Irish Resolution on Capitol Hill"
 ire_nw.80.d:0 "Washington is debating how far Lend-Lease should reach. Irish-American congressmen, churches, and unions are pressing at once: bring Ireland into the American arsenal, or leave the island outside the war?"
 ire_nw.80.a:0 "Bring Ireland into Lend-Lease"
 ire_nw.80.b:0 "Keep it to diaspora lobbying"
 ire_nw.80.c:0 "Publicly oppose American entry"
 IRE_tt_env_80a:0 "USA: war support +5%, stability -5%, gains Irish-American Lobby for one year; UK opinion +15; Germany opinion -20; Ireland political power +25."
 IRE_tt_env_80b:0 "USA opinion +15, stability +5%; UK opinion +5; Ireland stability +5%."
 IRE_tt_env_80c:0 "USA opinion -15, war support -5%; Germany opinion +15; Ireland stability +5%."

 ire_nw.81.t:0 "The Cracks in the Commonwealth"
 ire_nw.81.d:0 "After Canada is folded into New World Ireland, the news of Ottawa changing flags spreads through the dominions. Australia, New Zealand, South Africa, and India all ask: can London still speak for us?"
 ire_nw.81.a:0 "Invite the dominions to recognise New World Ireland"
 ire_nw.81.b:0 "Reassure London with a trade agreement"
 ire_nw.81.c:0 "Fund anti-colonial forces in the dominions"
 IRE_tt_env_81a:0 "Australia, New Zealand, South Africa, and India opinion +20; UK opinion -15 and stability -5% if democratic, -30 and -5% if Black Britain; Ireland political power +25."
 IRE_tt_env_81b:0 "UK opinion +20 if democratic; -20 and stability -5% if Black Britain; dominion opinion +5; Ireland stability +5%."
 IRE_tt_env_81c:0 "Dominion opinion +30; UK opinion -30 and stability -5% if democratic, -40 and -5% if Black Britain; Ireland war support +5%."

 ire_nw.82.t:0 "The Free French Request"
 ire_nw.82.d:0 "After the fall of Paris, a Free French mission reaches Dublin and asks for Shannon Airport and Irish ports. Berlin and London are both watching what Dublin does next."
 ire_nw.82.a:0 "Receive the Free French mission"
 ire_nw.82.b:0 "Offer humanitarian aid only"
 ire_nw.82.c:0 "Close the door"
 IRE_tt_env_82a:0 "France opinion +30, war support +5%, gains French Irish Sympathy for one year; UK opinion +10 if democratic, -10 if Black Britain; Germany opinion -20; Ireland stability -5%."
 IRE_tt_env_82b:0 "France opinion +10; Germany opinion +5; Ireland stability +5%."
 IRE_tt_env_82c:0 "France opinion -15; UK opinion -10; Germany opinion +15; Ireland stability +5%."

 ire_nw.83.t:0 "Letters from the Eastern Front"
 ire_nw.83.d:0 "After Germany invades the Soviet Union, Moscow asks through neutral channels whether Ireland will send medical teams and volunteers. Berlin warns Dublin not to cross the line."
 ire_nw.83.a:0 "Organise medical teams and volunteers"
 ire_nw.83.b:0 "Send medical supplies only"
 ire_nw.83.c:0 "Keep strict neutrality"
 IRE_tt_env_83a:0 "Soviet opinion +30, war support +5%, manpower +5,000; Germany opinion -20; Ireland army experience +25."
 IRE_tt_env_83b:0 "Soviet opinion +10; Germany opinion -5; Ireland stability +5%."
 IRE_tt_env_83c:0 "Soviet opinion -10; Germany opinion +5; Ireland stability +5%."

 ire_nw.84.t:0 "The Red Line at the White House"
 ire_nw.84.d:0 "With America in the war, Washington wants Ireland to accept at least an American security guarantee; London wants Dublin to go further. Ireland must decide whether the Stars and Stripes will stand behind it."
 ire_nw.84.a:0 "Accept the American security guarantee"
 ire_nw.84.b:0 "Trade neutrality for aid"
 ire_nw.84.c:0 "Refuse to be dragged into a great-power war"
 IRE_tt_env_84a:0 "USA opinion +20 and guarantees Ireland; UK opinion +15 if democratic, -15 if Black Britain; Germany opinion -20; Ireland stability +5%."
 IRE_tt_env_84b:0 "USA opinion +15, stability +5%; Ireland political power +25, stability +5%; no faction alignment."
 IRE_tt_env_84c:0 "USA opinion -15; UK opinion -10; Germany opinion +10; Ireland stability +5%, war support +5%."

 ire_nw.85.t:0 "The Map of Postwar Europe"
 ire_nw.85.d:0 "As the war in Europe ends, Dublin receives three invitations: one from Washington and London, one from the Nordic and Low Countries, and one from Moscow. New World Ireland must choose its place in the postwar order."
 ire_nw.85.a:0 "Promote a Celtic commonwealth and European reconciliation"
 ire_nw.85.b:0 "Join the Atlantic camp"
 ire_nw.85.c:0 "Remain armed and neutral"
 IRE_tt_env_85a:0 "Nordic and Low Countries opinion +15; USA opinion +10; UK opinion +10 if democratic, -10 if Black Britain; Ireland stability +5%."
 IRE_tt_env_85b:0 "USA opinion +20 and guarantees Ireland; UK opinion +20 if democratic, -20 if Black Britain; Germany opinion -10; Ireland stability +5%."
 IRE_tt_env_85c:0 "USA, UK, and Soviet opinion -5; Ireland war support +5%, stability +5%."
 IRE_european_hope:0 "Hope of Europe"
 IRE_european_hope_desc:0 "After Britain falls under the black flag, Ireland becomes the last democratic beacon in Western Europe. Dublin gathers exiles, dominions, and resistance networks, turning hope into efficiency, research, and fighting power."
 IRE_european_hope_us:0 "America and the Hope of Europe"
 IRE_european_hope_us_desc:0 "Washington treats Ireland as its most reliable democratic partner in the Atlantic; American industrial standards, fuel, and construction techniques follow."
 IRE_european_hope_france:0 "The French Commune and the Hope of Europe"
 IRE_european_hope_france_desc:0 "The French Commune does not join the Comintern, choosing instead to stand with Dublin; French troops and intelligence open another front for the alliance."
 IRE_european_hope_dominions:0 "Remnants of the Commonwealth"
 IRE_european_hope_dominions_desc:0 "Canada, Australia, New Zealand, South Africa, and India break away from Black Britain's empire and cooperate with Ireland."
 IRE_european_hope_nordics:0 "Nordic Partners"
 IRE_european_hope_nordics_desc:0 "The Nordic states preserve a neutral, pragmatic channel of cooperation in a darkened Europe."
 IRE_us_lend_lease:0 "American Lend-Lease"
 IRE_us_lend_lease_desc:0 "American machines, fuel, and loans enter Irish ports, helping the island get more out of its limited factories."
 IRE_british_spy_network_idea:0 "British Internal Network"
 IRE_british_spy_network_idea_desc:0 "G2 and exiled intelligence officers rebuild networks in London, Liverpool, and Glasgow, providing eyes for landings and uprisings."
 IRE_royal_navy_defection_idea:0 "The Royal Navy Chooses"
 IRE_royal_navy_defection_idea_desc:0 "About a quarter of the Royal Navy ships unwilling to fight for Black Britain raise the Irish flag and join Dublin's combined fleet."
 IRE_raf_defection_idea:0 "The RAF Defects"
 IRE_raf_defection_idea_desc:0 "About a quarter of the RAF squadrons refuse Black Britain's orders and fly to Ireland with their aircraft and experience."
 IRE_red_britain_uprising:0 "The Union of Britain Rises"
 IRE_red_britain_uprising_desc:0 "The French Commune and Irish intelligence ignite an uprising inside Britain, forcing Black Britain to open a second front on its own island."
 IRE_ENG_navy_purge:0 "Royal Navy Purge"
 IRE_ENG_navy_purge_desc:0 "Black Britain's distrust of the Royal Navy leads to mass purges of officers and sailors, crippling coordination and invasion preparation."
 IRE_ENG_air_purge:0 "RAF Purge"
 IRE_ENG_air_purge_desc:0 "Royalist and democratic elements in the RAF are purged, weakening Black Britain's air defence and air combat."
 IRE_ENG_spy_chaos:0 "British Intelligence Chaos"
 IRE_ENG_spy_chaos_desc:0 "Black Britain's intelligence services are infiltrated and purged; stability, war support, and counter-intelligence all suffer."
 IRE_ENG_britain_crisis:0 "The British Fracture"
 IRE_ENG_britain_crisis_desc:0 "Strikes, street clashes, and parliamentary deadlock are tearing Britain apart. Imperial authority is eroding, and London can no longer keep order."
 IRE_european_hope_cat:0 "Hope of Europe"
 IRE_invite_usa:0 "Invite the United States"
 IRE_invite_usa_desc:0 "Washington is ready to back Dublin. Invite the United States into the Irish-led alliance and unite the industries and navies of both sides of the Atlantic."
 IRE_invite_dominions:0 "Invite the Commonwealth Remnants"
 IRE_invite_dominions_desc:0 "Once Canada, Australia, New Zealand, South Africa, and India break from Black Britain's empire, they can join Dublin's alliance."
 IRE_invite_nordics:0 "Invite the Nordic States"
 IRE_invite_nordics_desc:0 "The Nordic states remain neutral in the dark; Dublin can invite them into the Hope of Europe for resources, fuel, and northern sea lanes."
 IRE_british_spy_network:0 "Build a British Internal Network"
 IRE_british_spy_network_desc:0 "G2 organises exiles, dockworkers, and disaffected Black British officers into an intelligence network across Britain."
 IRE_royal_navy_defection:0 "Turn the Royal Navy"
 IRE_royal_navy_defection_desc:0 "Exploit discontent in the navy and bring about a quarter of its ships under the Irish flag."
 IRE_raf_defection:0 "Turn the RAF"
 IRE_raf_defection_desc:0 "Persuade about a quarter of the RAF squadrons to fly to Ireland with their aircraft and experience, weakening Black Britain's air defence."
 IRE_red_london_uprising:0 "Ignite an Uprising in London"
 IRE_red_london_uprising_desc:0 "The French Commune and Irish intelligence prepare to ignite an uprising in Britain itself, forcing Black Britain to fight a second front in its own capital. Requires the French Commune to have actually joined European Hope, Germany to be at war with Ireland, and the Irish homeland to be threatened."
 IRE_red_sabotage:0 "Red Sabotage in Britain"
 IRE_red_sabotage_desc:0 "Keep sabotaging railways, ports, and armament factories across Britain to create windows for a landing."
 IRE_tt_usa_joined:0 "The United States is brought directly into the Irish-led Hope of Europe and grants American industry/naval cooperation."
 IRE_tt_invite_red_france:0 "The French Commune leaves its current faction, joins the Irish-led Hope of Europe, and grants the French Commune cooperation spirit."
 IRE_tt_dominions_joined:0 "Eligible Commonwealth nations join the alliance and grant the Commonwealth Remnants spirit."
 IRE_tt_nordics_joined:0 "Eligible Nordic states join the alliance and grant the Nordic Partners spirit."
 IRE_tt_spy_network:0 "Gain the British Internal Network spirit; Black Britain's stability and war support fall."
 IRE_tt_navy_defection:0 "About a quarter of the Royal Navy transfers to Ireland; Black Britain's naval coordination and invasion preparation fall."
 IRE_tt_raf_defection:0 "Gain about a quarter of the RAF's aircraft and experience; Black Britain's air defence and air combat fall."
 IRE_tt_red_uprising:0 "Triggers a communist uprising/civil war in Britain, forcing Black Britain to fight on two fronts."
 IRE_tt_red_sabotage:0 "Black Britain's stability and war support fall; resistance rises across Britain."
 ENG_black_britain:0 "Fascist Britain"
 ENG_black_britain_DEF:0 "Fascist Britain"
 ENG_black_britain_ADJ:0 "British Fascist"
 POLITICS_ENG_BLACK_BRITAIN_MOSLEY_DESC:0 "Oswald Mosley, leader of the Blackshirts, proclaims a new order for Britain amid the ruins of London."
 IRE_european_hope_alliance:0 "European Hope Alliance"
 ire_nw.86.t:0 "The Cracks in the Empire"
 ire_nw.86.d:0 "In the weeks after Northern Ireland's return, strikes spread from the docks to the coalfields. Some in Parliament speak openly of an 'ungovernable' Britain, while Blackshirt leaflets appear in the East End. Downing Street still denies everything."
 ire_nw.86.a:0 "Express public concern."
 ire_nw.86.b:0 "This is London's own affair."
 ire_nw.87.t:0 "Blackshirts March on London"
 ire_nw.87.d:0 "Mosley's followers converge on London from across the country; police hesitate at the barricades. Some Conservatives begin to speak of 'a strong man.' Dublin must decide whether to place a bet."
 ire_nw.87.a:0 "Secretly fund the London government."
 ire_nw.87.b:0 "Let the Blackshirts exhaust Britain."
 ire_nw.88.t:0 "Silence in Downing Street"
 ire_nw.88.d:0 "The cabinet has issued no statement for three weeks. The King cancels public engagements; Army commanders refuse to comment. The Empire's nerves are snapping one by one."
 ire_nw.88.a:0 "Prepare to evacuate our citizens."
 ire_nw.88.b:0 "Wait and see."
 ire_nw.89.t:0 "The Last Warning"
 ire_nw.89.d:0 "Word from Scotland Yard: fascist militias have received weapons, and a coup is only a matter of time. All Dublin can do now is wait for the first shot."
 ire_nw.89.a:0 "Wait for London's verdict."
 ire_nw.90.t:0 "Britain at the Crossroads"
 ire_nw.90.d:0 "After months of strikes, Blackshirt marches, and cabinet paralysis, London's authority finally collapses. Fascist militias and royalists face each other in the streets; Downing Street asks Dublin to take a stand while the Blackshirts wait for a signal. London's old allies are shut out of this civil war, and German volunteers may soon appear on the Blackshirt side."
 ire_nw.90.a:0 "Keep our distance and let the empire sort itself out."
 ire_nw.90.b:0 "Secretly back London and gamble on the government."
 ire_nw.91.t:0 "The Hope of Europe"
 ire_nw.91.d:0 "The black flag rises over London and the Allies exist in name only. Europe's democratic governments, exiles, and dominions look to Dublin. Ireland becomes the last beacon in Western Europe."
 ire_nw.91.a:0 "Carry the hope of Europe."
 ire_nw.91.b:0 "Put our own house in order first."
 ire_nw.91.c:0 "Turn hope into industry and research."
 ire_nw.92.t:0 "A Letter from Roosevelt"
 ire_nw.92.d:0 "Washington will no longer wait for London. Roosevelt writes a long letter: America is ready to lend Dublin its industry, fuel, and navy, if Ireland will become the Atlantic anchor."
 ire_nw.92.a:0 "Bring American industry into the Atlantic system."
 ire_nw.92.b:0 "Accept American military advisers."
 ire_nw.92.c:0 "Discuss terms first."
 ire_nw.93.t:0 "The Birth of the French Commune"
 ire_nw.93.d:0 "After Black Britain takes power, Paris's left-right coalition collapses. The Popular Front rises in the factory districts; the French Commune is proclaimed; the French civil war begins. Dublin must decide how to face the revolution sweeping France."
 ire_nw.93.a:0 "Openly support the French Popular Front."
 ire_nw.93.b:0 "Secretly ship weapons."
 ire_nw.93.c:0 "Keep our distance."
 ire_nw.94.t:0 "The Dark Fire in London"
 ire_nw.94.d:0 "The British internal network signals: London docks, Scottish factories, and Welsh mines stop at once. A red uprising erupts in the heart of Black Britain."
 ire_nw.94.a:0 "Turn the uprising into a second front."
 ire_nw.94.b:0 "Send volunteers."
 ire_nw.94.c:0 "Keep a low profile."
 ire_nw.95.t:0 "The Royal Navy Chooses"
 ire_nw.95.d:0 "A fleet unwilling to fight for Black Britain leaves Scapa Flow, raises the Irish flag, and sails for Cork. The Royal Navy is no longer Black Britain's private property."
 ire_nw.95.a:0 "Receive the fleet."
 ire_nw.95.b:0 "Receive convoys and supplies."
 ire_nw.95.c:0 "Let the sailors choose."
 ire_nw.96.t:0 "A Network in the Fog"
 ire_nw.96.d:0 "G2 agents establish cells in London, Liverpool, and Glasgow. Black Britain's police find that everyone they arrest knows ten more."
 ire_nw.96.a:0 "Expand the network."
 ire_nw.96.b:0 "Send intelligence to Washington."
 ire_nw.96.c:0 "Stay silent."
 ire_nw.97.t:0 "The French Commune Joins the Hope of Europe"
 ire_nw.97.d:0 "The French Commune sends a delegation to Dublin on its own initiative. For the first time, the Hope of Europe becomes a coalition across ideologies."
 ire_nw.97.a:0 "Give Paris a seat at the table."
 ire_nw.97.b:0 "Discuss military cooperation first."
 ire_nw.97.c:0 "Write the alliance into a charter."
 ire_nw.98.t:0 "The Eagles Defect"
 ire_nw.98.d:0 "RAF squadrons take off from Lincolnshire, not to intercept German bombers, but to turn west. A gap opens in Black Britain's sky."
 ire_nw.98.a:0 "Welcome the pilots."
 ire_nw.98.b:0 "Receive the aircraft."
 ire_nw.98.c:0 "Let them choose."
 IRE_tt_red_uprising_conditions:0 "The French Commune must have actually joined European Hope, Germany must be at war with Ireland, and the Irish homeland must be threatened (Black Britain at war with Ireland, or a core state occupied)."
 IRE_european_hope_britain:0 "The Friendship of the Union of Britain"
 IRE_european_hope_britain_desc:0 "The Union of Britain brings the remnants of the Royal Navy, the dock unions and its intelligence network to European Hope."
 ire_nw.99.t:0 "The Union of Britain Joins European Hope"
 ire_nw.99.d:0 "After the Union of Britain wins its civil war, the London strike committee sends a delegation to Dublin. For the first time European Hope holds both Paris and London; the Channel is no longer a border but a shared line of defence."
 ire_nw.99.a:0 "Re-flag the Royal Navy"
 ire_nw.99.b:0 "Write the alliance into a charter"
 ire_nw.99.c:0 "Secure London first"
 IRE_tt_european_major_war:0 "Requires a war between major European powers (Ireland does not need to be at war)."
 IRE_wartime_laws_cat:0 "Wartime Legislation"
 IRE_wartime_war_economy:0 "Move to War Economy"
 IRE_wartime_war_economy_desc:0 "Push a war economy through Parliament under the authority of a wartime coalition. A democracy would normally wait for war support to pass half; now it does not have to."
 IRE_wartime_total_economy:0 "Total Economic Mobilisation"
 IRE_wartime_total_economy_desc:0 "Place the entire national industry on a war footing. Requires War Economy."
 IRE_wartime_service:0 "Introduce Conscription"
 IRE_wartime_service_desc:0 "Pass conscription through Parliament. A democracy would normally wait for war support to pass half; now it does not have to."
 IRE_wartime_all_adults:0 "All Adults Serve"
 IRE_wartime_all_adults_desc:0 "Extend the call-up to the entire adult population. Requires Service by Requirement."
 IRE_wartime_scraping:0 "Scraping the Barrel"
 IRE_wartime_scraping_desc:0 "Commit the last reserves to the war. Requires All Adults Serve."
 ire_nw.130.t:0 "The Abwehr's Irish Door"
 ire_nw.130.d:0 "A neutral diplomat brings word from Berlin: German intelligence wants to talk to Ireland. The courier waits in a hotel by the Liffey, with a shipping chart on the table."
 ire_nw.130.a:0 "Hear him out."
 ire_nw.130.b:0 "Arrest him and tell London."
 ire_nw.130.c:0 "Hand him to G2."
 ire_nw.131.t:0 "Plan Kathleen"
 ire_nw.131.d:0 "The Abwehr's plan is simple: use Ireland's ports and old contacts to open a back door into Britain. The courier asks for ports, radio operators, and silence."
 ire_nw.131.a:0 "We will take the arms."
 ire_nw.131.b:0 "This is not our war."
 ire_nw.131.c:0 "Take the arms, then betray them."
 ire_nw.132.t:0 "The Network Blows"
 ire_nw.132.d:0 "London and Washington have both seen the Abwehr network in Ireland. The newspapers are asking about Dublin's silence, and Downing Street wants an explanation."
 ire_nw.132.a:0 "Deny everything."
 ire_nw.132.b:0 "Admit it and apologize."
 ire_nw.133.t:0 "The Quiet Understanding"
 ire_nw.133.d:0 "Dublin hands over the Abwehr courier and his plan. London and Washington do not thank Ireland in public, but a channel of intelligence opens between them."
 ire_nw.133.a:0 "Keep it quiet."
 ire_nw.133.b:0 "Share what we know with Washington."
 ire_nw.133.c:0 "Ask London for something in return."
 IRE_abwher_network:0 "The Abwehr's Irish Network"
 IRE_abwher_network_desc:0 "German intelligence's network in Ireland: radios, couriers, and a handful of old hands willing to take the risk. It will not last forever."
 IRE_abwher_exposed:0 "The Abwehr Scandal"
 IRE_abwher_exposed_desc:0 "The German network is exposed, and Dublin's silence becomes a weapon in London and Washington."
 IRE_covert_cat:0 "Covert Operations"
 IRE_abwher_arms_run:0 "Receive the Abwehr Arms"
 IRE_abwher_arms_run_desc:0 "Take a shipment of infantry weapons and artillery from the German network while G2 maps every route. Each run raises exposure; if it gets too high London will find the network, and after three runs the operation ends either way."
 IRE_invite_red_france:0 "Invite the French Commune"
 IRE_invite_red_france_desc:0 "Invite the French Commune into European Hope. If the French Commune is still in its civil war, you may need to wait for it to win; on success the French Commune joins the faction and the event fires."
 ire_nw.134.t:0 "The Free Nations Answer"
 ire_nw.134.d:0 "As Germany's war spreads, threatened governments begin to look to Dublin. European Hope is no longer an Irish alliance alone."
 ire_nw.134.a:0 "Welcome them."
 ire_nw.134.b:0 "Talk military cooperation first."
 IRE_german_last_stand:0 "Germany's Last Mobilisation"
 IRE_german_last_stand_desc:0 "Germany's total mobilisation under encirclement. This spirit is hidden from the interface."
 ire_nw.135.t:0 "Washington and the Black Flag"
 ire_nw.135.d:0 "After Black Britain takes power, Washington is unsure whether London is an enemy or a rival. The White House asks Dublin through informal channels: where does Ireland stand?"
 ire_nw.135.a:0 "Lean toward Washington."
 ire_nw.135.b:0 "Recognize London's new government."
 ire_nw.135.c:0 "Say nothing for now."
 ire_nw.136.t:0 "The Dominions Choose"
 ire_nw.136.d:0 "Canada, Australia, New Zealand, South Africa, and India are watching London's new government. For some, Dublin looks like a more reliable democratic partner than London."
 ire_nw.136.a:0 "Open Dublin's door to the dominions."
 ire_nw.136.b:0 "Let them decide for themselves."
 ire_nw.136.c:0 "Pressure them to break with London."
 ire_nw.137.t:0 "Free France and the French Commune"
 ire_nw.137.d:0 "After the French Commune joins European Hope, Free France and Washington are watching Dublin. Recognize the Commune, or keep a channel to Free France?"
 ire_nw.137.a:0 "Recognize the French Commune."
 ire_nw.137.b:0 "Keep a channel to Free France."
 ire_nw.137.c:0 "Let the French settle it."
 ire_nw.138.t:0 "Moscow's Gaze"
 ire_nw.138.d:0 "After the Union of Britain joins European Hope, Moscow takes Dublin seriously for the first time. The USSR is Germany's enemy, and also a rival of the Western democracies."
 ire_nw.138.a:0 "Open a pragmatic channel to Moscow."
 ire_nw.138.b:0 "Keep Moscow at arm's length."
 ire_nw.138.c:0 "Invite Soviet observers."
 ire_nw.139.t:0 "The Unionist Question"
 ire_nw.139.d:0 "After the North returns, unionist leaders and local unions have not taken to the streets, but they are watching. Will Dublin offer them a place, or rule by decree?"
 ire_nw.139.a:0 "Give the unionists a place at the table."
 ire_nw.139.b:0 "Rule by decree."
 ire_nw.139.c:0 "Let the IRA handle it."
 ire_nw.140.t:0 "The Old IRA"
 ire_nw.140.d:0 "The IRA's old guard does not accept Dublin's compromise with London. They demand a place in the new state, or they will act on their own."
 ire_nw.140.a:0 "Bring them into the National Army."
 ire_nw.140.b:0 "Special courts and internment."
 ire_nw.140.c:0 "Let them go after Black Britain."
 ire_nw.140.e:0 "Leave them alone for now."
 ire_nw.141.t:0 "The Bishops and the Red Allies"
 ire_nw.141.d:0 "After the French Commune and the Union of Britain join European Hope, the bishops and the Irish-American press openly voice their unease. Dublin must answer: what is the Republic's relationship with its red allies?"
 ire_nw.141.a:0 "Reassure the Church."
 ire_nw.141.b:0 "The Republic is secular."
 ire_nw.141.c:0 "Offend neither side."

 # ===== Irish National Union: coalition government =====
 IRE_national_union_cat:0 "National Unity Government"
 IRE_national_union_government:0 "National Unity Government"
 IRE_national_union_government_desc:0 "A contradictory coalition held together by Irish unity. The four blocs argue at home but stand together abroad."
 IRE_nu_ui_header:0 "National Unity Government · Four-Bloc Balance"
