 # ===== A-line: New World Ireland focuses =====
 IRE_A_home_development:0 "National Development Board"
 IRE_A_home_development_desc:0 "The Shannon, the midland bogs and the southern deep-water ports were each in a different department's hands. The cabinet has set up a National Development Board to survey, generate and transmit as one, letting the works by sections and reporting progress monthly."
 IRE_A_mineral_survey:0 "National Mineral Survey"
 IRE_A_mineral_survey_desc:0 "The Geological Survey has sent parties into Connaught and Munster to bore for coal, iron and tungsten. Cores and estimates are compiled in a report, mining rights are entered by county and issued by the Department of Industry, and the leases are for a fixed term."
 IRE_A_infrastructure_programme:0 "National Infrastructure Programme"
 IRE_A_infrastructure_programme_desc:0 "Roads, railways, power stations and Shannon Airport break ground together under the Department of Public Works. Lengths and dates are fixed county by county, the register of contractors is published with the standards of acceptance, and progress is reported monthly."
 IRE_A_world_congress:0 "World Irish Congress"
 IRE_A_world_congress_desc:0 "From Boston to Buenos Aires, from Liverpool to Paris, Irish delegates have sat at one table for the first time. The agenda held a single item: whether to establish a standing body for remittances, publicity and elections. The minutes are filed with the Department of External Affairs."
 IRE_A_green_dollar:0 "Green Dollar"
 IRE_A_green_dollar_desc:0 "Remittances are no longer only money orders. The Department of Finance has agreed clearing arrangements with banks in New York and Boston, so that the money may go directly into factories, docks and bonds. The subscribers now ask for seats on the board of control."
 IRE_A_wild_geese_legion:0 "Wild Geese Legion"
 IRE_A_wild_geese_legion_desc:0 "The descendants of the Wild Geese come home with their military experience, many of them having served in Spain, in France and in other men's civil wars. The Department of Defence has formed them into an expeditionary force, paid and equipped on the regular establishment."
 IRE_A_spanish_volunteers:0 "The Wild Geese Expedition"
 IRE_A_spanish_volunteers_desc:0 "Franco's rising has split Spain in two. The cabinet has decided against sending the regular army: the Department of External Affairs issues passports and charters berths, and the descendants of the Wild Geese cross as volunteers. The General Staff records each man on his return."
 IRE_A_canada_independence:0 "Inciting Canadian Independence"
 IRE_A_canada_independence_desc:0 "Westminster gave the dominions sovereignty on paper, yet Canada marches when London declares war. The Dublin legation on Parliament Hill has become a frequent caller, and what it discusses is a bill to take Canada out of Britain's wars. Ottawa is waiting for the text."
 IRE_A_atlantic_fleet:0 "Atlantic Fleet"
 IRE_A_atlantic_fleet_desc:0 "From Newfoundland to Cork a small fleet has begun to escort the Atlantic routes. The hulls are few, but the ports, the sailings and the courses are settled by our own Naval Service and no longer submitted to the Admiralty in London."
 IRE_A_air_bridge:0 "Transatlantic Air Bridge"
 IRE_A_air_bridge_desc:0 "Shannon has been designated the staging post of the transatlantic route. Fighters, patrol aircraft and mail use the same field; fuelling and overhaul are handled by the airport authority, and the timetable is filed with the Department of Aviation."
 IRE_A_irish_question:0 "The Irish Question"
 IRE_A_irish_question_desc:0 "The Irish of Liverpool, Glasgow and London have begun to cost Westminster its sleep. Constituencies, unions and newspapers put the same question: how much longer is the imperial arrangement for Ireland to stand. The press cuttings are collected in a departmental file."
 IRE_A_tammany_hall:0 "Tammany Hall"
 IRE_A_tammany_hall_desc:0 "The Irish political machines of Boston and New York now work for the old country. They can turn out votes, move appropriations and make Washington look twice at the Irish question. The Department of External Affairs keeps a channel open with them."
 IRE_A_wild_geese_paris:0 "The Wild Geese of Paris"
 IRE_A_wild_geese_paris_desc:0 "France has not forgotten the Irish who fought for her, and in the salons of Paris the name of the Wild Geese is heard again. The Department of External Affairs has posted a counsellor to keep touch with the descendants and retired officers, enrolling those willing to serve in Ireland."
 IRE_A_green_international:0 "Green International"
 IRE_A_green_international_desc:0 "The Irish scattered through the great powers now have one political voice. The body has no chairman, only a rotating secretariat; it commands no one, yet every government has begun to read its bulletins. A copy of the rules is held by the Department of External Affairs."
 IRE_A_atlantic_charter:0 "Atlantic Charter"
 IRE_A_atlantic_charter_desc:0 "This is a commonwealth, not an empire: the Irish of both Atlantic shores are bound by a charter. The signatories forswear aggression among themselves and undertake not to stand aside if one is attacked. Washington and Paris wait to see whether the paper is honoured."
 IRE_A_new_world_expedition:0 "New World Expedition"
 IRE_A_new_world_expedition_desc:0 "The cabinet has approved the expedition. The troops are mustering on both shores of the Atlantic and the fleet has coaled at Cork. The General Staff has drawn the objectives and the order of landing, and the orders have gone out to the commands."
 IRE_A_canada_annex:0 "Annex Canada"
 IRE_A_canada_annex_desc:0 "Ottawa is free of London but not yet joined to Dublin. The Dail will pass the act, the army moves north, and British North America becomes the western half of New World Ireland. Every mile of coast on both shores then falls to the Naval Service to defend."
 IRE_A_new_world_ireland:0 "New World Ireland"
 IRE_A_new_world_ireland_desc:0 "The Canadian provinces are no colony but part of the national territory. From Newfoundland to British Columbia each holds its seats in the Dail and brings its own petitions. Dublin must now answer for two continents at once."
 IRE_A_nordic_bridge:0 "The Northern Bridge"
 IRE_A_nordic_bridge_desc:0 "The small states of the north watch the powers divide Europe. Dublin can offer what neither London nor Berlin can: a partner with no territorial ambition in the Baltic. Stockholm sends an observer first, and Oslo and Copenhagen follow."
 IRE_A_nordic_alliance:0 "The New World Alliance"
 IRE_A_nordic_alliance_desc:0 "Dublin has proposed a league of the northern small states, brought into force by an exchange of notes between the foreign ministries. Friendly states accede at once; the others receive an Irish guarantee of security, with accession left to a later date."

 # ===== Ideas =====
 IRE_home_development:0 "National Development Board"
 IRE_home_development_desc:0 "The state-led industrial programme runs on three lines: construction crews build roads and plants, survey teams map turf and minerals, and power engineers raise the grid. The economic council checks progress monthly."
 IRE_diaspora_bond_drive:0 "Diaspora Bonds"
 IRE_diaspora_bond_drive_desc:0 "Bonds taken up by the Irish abroad are entered in the Treasury's books; the proceeds are paid out in the order of works, contracts for factories and ports are signed against them, and the counterfoils are held by the issuing office."
 IRE_world_congress:0 "World Irish Congress"
 IRE_world_congress_desc:0 "Overseas delegates meet in Dublin each year; committees are set up for propaganda, fundraising and volunteers, and what is agreed is carried out by External Affairs and the emigrant division in their own spheres. The minutes go to every branch and legation."
 IRE_green_dollar:0 "Green Dollar"
 IRE_green_dollar_desc:0 "Remittances reach Ireland through the banks and the Post Office, and the Department of Finance keeps a separate ledger. Investment is handled by the Industrial Development Authority, and trade is settled through agents in London and New York."
 IRE_wild_geese_legion:0 "Wild Geese Legion"
 IRE_wild_geese_legion_desc:0 "The sons of exiled soldiers return to enlist, bringing their fathers' medals, field notebooks and rolls of old comrades. They are formed into separate battalions under returned officers, with an archive kept for their papers."
 IRE_spanish_volunteers:0 "Wild Geese Volunteers"
 IRE_spanish_volunteers_desc:0 "The Wild Geese of Ireland and America fight side by side in Spain. Dublin may send far more volunteer divisions abroad; recruiting and transport are handled by the Department of Defence, and the rolls are returned monthly."
 IRE_british_north_america:0 "British North America Reclaimed"
 IRE_british_north_america_desc:0 "The Dominion of Canada has been joined to New World Ireland. The factories and manpower of the St Lawrence and the Great Lakes now serve Dublin, the provincial returns are merged into the statistics of the cabinet office, and one tariff applies throughout."
 IRE_atlantic_fleet:0 "Atlantic Fleet"
 IRE_atlantic_fleet_desc:0 "A small navy built around escort and convoy raiding. Vessels are formed into flotillas with bases at Cork and Galway, shore stations and fuel depots are built with them, and patrol and training schedules are set by the naval staff."
 IRE_air_bridge:0 "Transatlantic Air Bridge"
 IRE_air_bridge_desc:0 "An air corridor runs Shannon to Newfoundland to Boston. The Air Department arranges flights, fuelling and overhaul, transit passengers and mail are handled on the same field, and the diversion fields and weather reports are listed apart."
 IRE_green_international:0 "Green International"
 IRE_green_international_desc:0 "Irish political societies have opened branches in Britain, the United States and the dominions, with liaison through the Department of External Affairs and the emigrant affairs office. Delegates meet annually, and resolutions are sent to Dublin for record."
 IRE_atlantic_charter:0 "Atlantic Charter"
 IRE_atlantic_charter_desc:0 "A political charter signed by the Irish on both sides of the Atlantic. The signing is held in Dublin, copies go to the emigrant societies, and the names of the signatories are published separately. Instruments of approval are deposited with External Affairs, a copy to the Dail."
 IRE_atlantic_emergency:0 "Atlantic Defence Regime"
 IRE_atlantic_emergency_desc:0 "With the war reaching the Atlantic, Dublin has folded home defence, coastal watch and national mobilisation into a single emergency regime. The emergency order passes the Dail, committees are set up in each county, and progress is reported monthly to the cabinet."
 IRE_new_world_expedition:0 "New World Expedition"
 IRE_new_world_expedition_desc:0 "An expeditionary force is raised on the new establishment; the navy arranges shipping and supply, the ports of assembly are Cobh and Galway, and the date of sailing waits on the cabinet. The Admiralty allots shipping space by sailing."
 IRE_eng_irish_question:0 "The Irish Question"
 IRE_eng_irish_question_desc:0 "The British government finds that Irish workers and voters are no longer silent. Labour members raise the question of self-government at constituency meetings, and the local papers print the speeches in full. Constituency associations begin to register the names of Irish voters."
 IRE_eng_dock_strike:0 "Parliamentary and Union Pressure"
 IRE_eng_dock_strike_desc:0 "Labour members, union delegations and the local press act together, spending Downing Street's political capital on questions, petitions and headlines. The dock unions post pickets by branch. The shipowners' association asks the labour department for arbitration and receives no answer."
 IRE_eng_ira_campaign:0 "Labour-Liberal United Front"
 IRE_eng_ira_campaign_desc:0 "Labour, the Liberals and the union press form a common front, questioning London's account of the war in Parliament and in the constituencies. The papers set documents and testimony against the official communiques, discrepancy by discrepancy."
 IRE_usa_irish_lobby:0 "Irish-American Lobby"
 IRE_usa_irish_lobby_desc:0 "In the corridors and committee rooms of Washington, Irish-American members speak for the old country, the churches and the unions lobbying in their several ways. Subscriptions and lists pass through Boston to Dublin."
 IRE_fra_irish_sympathy:0 "French Irish Sympathy"
 IRE_fra_irish_sympathy_desc:0 "The Paris press is reporting Ireland's position at length. The Department of External Affairs collects the cuttings for the news office, the legation in Paris reports opinion weekly, and French deputies have raised questions in the chamber."

 # ===== Decision categories =====
 IRE_home_cat:0 "Homeland Development"
 IRE_congress_cat:0 "World Irish Congress"
 IRE_interference_cat:0 "Overseas Democratic Contacts"
 IRE_nordic_cat:0 "Northern Affairs"

 # ===== Homeland decisions =====
 IRE_dev_leinster:0 "Develop the Leinster Industrial Belt"
 IRE_dev_leinster_desc:0 "Factories and railways are laid out together at Dublin, Wexford and Tullamore. Works are let by stage, sites are fixed by Industry and Commerce with the county councils, and land is acquired and cleared at the same time. Progress is reported quarterly to the cabinet."
 IRE_dev_munster:0 "Develop Munster and Cork Harbour"
 IRE_dev_munster_desc:0 "The docks and railways of Cork carry the south's produce abroad. Dredging, warehousing and branch lines are built together, conditions of tender are issued by Industry and Commerce, and contracts are reviewed by Finance. Progress is returned quarterly."
 IRE_dev_connaught:0 "Develop Connaught and the Shannon"
 IRE_dev_connaught_desc:0 "Hydroelectric works, the airport and an industrial park are opened together on the Shannon. The station is built by the Electricity Supply Board, site allocation and factory plans are approved by Industry and Commerce, and roads and water mains are laid with them. Progress is reported quarterly."
 IRE_national_mining:0 "National Mining Survey"
 IRE_national_mining_desc:0 "The Geological Survey has completed its survey of the country's minerals, and the distribution of coal, iron and tungsten is entered in the report. Mining licences are issued by the Department of Industry and Commerce, parties work the areas in rotation, and the findings are filed."
 IRE_national_research:0 "National Research Institute"
 IRE_national_research_desc:0 "The Department of Education has increased its grants to University College Dublin and the Shannon laboratories, and the National Research Institute has taken on additional staff. The academic council approves programmes, the Department of Finance sanctions equipment, and the annual report is published."

 # ===== Congress decisions =====
 IRE_diaspora_bonds:0 "Issue Diaspora Bonds"
 IRE_diaspora_bonds_desc:0 "The Treasury issues bonds to the Irish communities of Boston, New York and Buenos Aires; the local societies act as agents, and subscription lists and payments come back to Dublin together."
 IRE_call_wild_geese:0 "Call the Wild Geese"
 IRE_call_wild_geese_desc:0 "Recruiting stations are opened in the Irish communities of the Americas, with the Church and the emigrant societies assisting the register. Volunteers are classed by age and experience, their passage paid from subscription funds, and drafted to training camps on arrival."
 IRE_request_us_surplus:0 "American Surplus"
 IRE_request_us_surplus_desc:0 "Washington is willing to sell its surplus equipment to Dublin. The list is furnished by the American side, price and delivery are settled separately, inspection is held at the port, and rejects are returned. Payment is remitted on Treasury approval."
 IRE_atlantic_escort:0 "Atlantic Escort"
 IRE_atlantic_escort_desc:0 "More transports and escorts are assigned to the transatlantic route. Convoy composition is handled by the marine branch, escort relief is fixed by stage, and survivors are picked up by the nearest vessel. Crew drafts and refits are reported to the naval staff."
 IRE_ferry_command:0 "Ferry Command"
 IRE_ferry_command_desc:0 "A transatlantic ferry squadron is stationed at Shannon. The Air Department assigns machines and crews, the ferry routes and diversion fields are entered in the notices to airmen, and losses and replacements are reported monthly."
 IRE_green_international_congress:0 "Convene the Green International"
 IRE_green_international_congress_desc:0 "Irish delegates from Britain, the United States and France are invited to Dublin and adopt a joint declaration. The emigrant affairs office runs the arrangements, the list of delegates was cleared by the cabinet beforehand, and standing contacts are named by country."

 # ===== Interference decisions =====
 IRE_liverpool_strike:0 "Parliamentary and Union Pressure"
 IRE_liverpool_strike_desc:0 "Labour members put questions in the House, union delegations carry petitions to Downing Street, and the local papers run leaders day after day. The three move together, and the correspondence reaching Downing Street grows by the day."
 IRE_ira_infiltration:0 "Contacts with British Democrats"
 IRE_ira_infiltration_desc:0 "Irish diplomats and G2 build quiet channels to Labour, Liberal, and union circles in Britain."
 IRE_american_volunteers:0 "American Volunteers"
 IRE_american_volunteers_desc:0 "Irish-American youths in Boston and Chicago enlist for service in Ireland, the local societies arranging the medical examination and the passage. On arrival they are posted to the training camps and the roll goes to the Department of Defence."
 IRE_green_vote:0 "The Green Vote"
 IRE_green_vote_desc:0 "Emigrant societies mobilise Irish-American voters in United States elections and put memoranda before candidates of both parties. The Department of External Affairs takes no public part, and consulates report local opinion in the usual way."
 IRE_french_arms:0 "French Arms"
 IRE_french_arms_desc:0 "The Paris arsenal is open to Dublin. The Department of Defence sends officers to inspect the equipment, shipment is arranged by sea, the delivery lists are filed with the Ordnance Corps, and payment is set against export credit."
 IRE_irish_brigade:0 "The Irish Brigade"
 IRE_irish_brigade_desc:0 "An Irish volunteer brigade is raised in France under the name of the Wild Geese. Recruiting offices are opened in Paris and Dublin, the rolls are kept in both places, equipment is supplied by the French, and training is carried out in France."

 # ===== Event ire.70 =====
 ire.70.t:0 "The Green International"
 ire.70.d:0 "In the great hall of Dublin Castle, delegates from Liverpool, Boston, New York, Paris and Buenos Aires sat together for the first time. No crown, no empire, only a document bearing one sentence: Ireland is no longer the affair of a single island. Every society signed, and the secretariat sits in Dublin for the present."
 ire.70.a:0 "Open branches on every continent"

