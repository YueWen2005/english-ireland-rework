 # ===== National Union: dynamic spirits =====
 IRE_nu_british_funding_spirit:0 "London's Cheque"
 IRE_nu_british_funding_spirit_desc:0 "London's money reaches unionist circles and some members through the old networks; the Special Branch holds the accounts, confidence on the streets is not recovered, and the report is classified. The Treasury checks the incoming payments quarterly."
 IRE_nu_soviet_advisors_spirit:0 "Moscow's Advisors"
 IRE_nu_soviet_advisors_spirit_desc:0 "Soviet military and intelligence advisers take up posts in Ireland; training and intelligence work begin at once, the cabinet's political room narrows accordingly, and the correspondence is kept in a separate file. Their lodgings and movements are known to the Special Branch."
 IRE_nu_american_loan_spirit:0 "American Loan"
 IRE_nu_american_loan_spirit_desc:0 "American loans and industrial goods come ashore in turn; factories reopen, the Department of Supplies allocates consumer goods, and the ration books are revised monthly. Each use of the loan is entered by the Treasury and reported to the cabinet quarterly."
 IRE_nu_german_arms_spirit:0 "Berlin's Arms"
 IRE_nu_german_arms_spirit_desc:0 "Weapons and training from German intelligence networks reach the Republican Army; the handovers are handled by named officers, the risk of exposure never leaves, and the rolls are kept in separate places. The handover point is changed each time, on the Branch's arrangement."
 IRE_nu_vatican_pressure_spirit:0 "Roman Pastoral Letter"
 IRE_nu_vatican_pressure_spirit_desc:0 "The open support of the bishops and of Rome steadies part of the conservative electorate; the political price the government pays is entered in the ledger, and parish returns are collected weekly. The bishops' statement is filed at External Affairs."
 IRE_nu_foreign_volunteers_spirit:0 "Internationalist Volunteers"
 IRE_nu_foreign_volunteers_spirit_desc:0 "Union and Republican volunteer networks send Irishmen to foreign fronts; the rolls are kept by the mobilisation officers, unease at home grows, and the returns go to the cabinet. The sailing rolls are sealed by the mobilisation officers."
 IRE_nu_border_campaign_spirit:0 "Border Campaign"
 IRE_nu_border_campaign_spirit_desc:0 "The Republican Army operates across the border; despatches pass through the Special Branch to Defence, diplomatic risk is entered with them, and the exchange of notes is registered separately. A written report follows each operation."
 IRE_nu_emergency_powers_spirit:0 "Emergency Powers"
 IRE_nu_emergency_powers_spirit_desc:0 "The Special Branch and the army act under the emergency powers; arrests and searches are regularised afterwards, the cost of restored order falls on the Treasury, and the files are sealed. The powers are renewed by the Dail each quarter."
 IRE_nu_political_scandal_spirit:0 "Political Scandal"
 IRE_nu_political_scandal_spirit_desc:0 "Secret operations are exposed in the press; the coalition's credit suffers, questions and inquiry press on the cabinet together, and the officers concerned are suspended pending disposal. The committee of inquiry is nominated by the Ceann Comhairle."

 # ===== National Union: external interference 170-175 =====
 ire_nw.170.t:0 "London's Cheque"
 ire_nw.170.d_dem:0 "Westminster's old network has not disappeared. Unionist MPs, Dublin businessmen and British intelligence officers appear in the same drawing room; London is willing to pay for 'stability'."
 ire_nw.170.d_black:0 "An envoy from Black Britain arrives in Dublin with money and threats. He does not demand a new flag, only that someone in the coalition speak for London."
 ire_nw.170.d_red:0 "A trade-union delegation from Red London offers 'fraternal aid': funds, newspapers and advisers. Accepting it would give London a seat in the coalition."
 ire_nw.170.d:0 "Old contacts at the British embassy in Dublin are active again. Money, newspapers and favours are flowing to unionists and to some members. The Special Branch has listed the accounts and the handlers, with a record of embassy movements, and laid the file before the cabinet for a ruling; failing a reply, the matter proceeds by default."
 ire_nw.170.a:0 "Take the money."
 ire_nw.170.a_tt:0 "Unionist confidence +8, parliament influence +4, IRA influence -4, stability -5%; British opinion +20; gain 'London's Cheque' for 365 days."
 ire_nw.170.b:0 "Refuse and expose it."
 ire_nw.170.b_tt:0 "Unionist confidence -4; British opinion -20; stability +5%, political power +25."
 ire_nw.170.c:0 "Investigate quietly."
 ire_nw.170.c_tt:0 "Security influence +5, political power -25; the outcome is uncertain: 50% additional security +3, 50% British opinion -10."

 ire_nw.171.t:0 "Moscow's Comrades"
 ire_nw.171.d_red:0 "Moscow sees Ireland as a potential red foothold in Western Europe. Soviet advisers, union liaisons and intelligence officers arrive in Dublin together, offering 'selfless fraternal aid'."
 ire_nw.171.d:0 "The cultural attache at the Soviet embassy brings a group of union friends. They do not discuss ideology, only advisers, training and newspapers. The protocol division of External Affairs receives them in the usual way, and the Special Branch enters each name and address. Dublin knows Moscow stands behind them; the cabinet has not received them."
 ire_nw.171.a:0 "Accept the Soviet advisers."
 ire_nw.171.a_tt:0 "Labour influence +6, IRA influence +4, Church confidence -5, unionist confidence -5, stability -5%; Soviet opinion +30; gain 'Moscow's Advisors' for 365 days."
 ire_nw.171.b:0 "Restrict their activity."
 ire_nw.171.b_tt:0 "Labour influence +2, stability +5%, political power -25; Soviet opinion +10."
 ire_nw.171.c:0 "Expel them."
 ire_nw.171.c_tt:0 "Labour influence -5, IRA influence -3, stability +5%, war support +5%; Soviet opinion -30."

 ire_nw.172.t:0 "Washington's Conditions"
 ire_nw.172.d_new_world:0 "Washington is ready to bring Ireland formally back into the Atlantic economic and security network, but the conditions are clear: the coalition must keep its distance from the left-wing unions and the Republican Army."
 ire_nw.172.d_war:0 "The war makes Washington recalculate Ireland's value. Loans, equipment and naval cooperation are on the table, but the United States wants Dublin to commit to the postwar order first."
 ire_nw.172.d:0 "The American delegation has brought an economic and security framework, and the loan conditions are stated plainly: the Dail parties and the unionists must hold the lead in the coalition. The Department of Finance and the Department of External Affairs checked the text clause by clause, and the conditions went from the Department of the Taoiseach to the four bloc leaders."
 ire_nw.172.a:0 "Accept the loan conditions"
 ire_nw.172.a_tt:0 "Parliament influence +5, unionist confidence +5, labour influence -5, IRA influence -3; US opinion +30; gain 'American Loan' for 365 days."
 ire_nw.172.b:0 "Negotiate the terms"
 ire_nw.172.b_tt:0 "Parliament influence +2, stability +5%, political power -25; US opinion +10."
 ire_nw.172.c:0 "Refuse"
 ire_nw.172.c_tt:0 "Parliament influence -4, stability +5%, war support +5%; US opinion -25."

 ire_nw.173.t:0 "German Intelligence in Dublin"
 ire_nw.173.d_black:0 "Black Britain's victory has opened an opportunity for Berlin. German intelligence officers approach the Republican Army through intermediaries, offering weapons, training and a common front against London."
 ire_nw.173.d_war:0 "The war has activated Berlin's sabotage networks. German intelligence tries to smuggle weapons into Ireland and turn the Republican Army into a tool of pressure against Britain."
 ire_nw.173.d:0 "German intelligence officers work the docks and public houses of Dublin. They do not ask Ireland to enter the war, only that the Republican Army make trouble at the right moment. G2 has listed the men involved; the Department of Justice urges a sweep, the Department of External Affairs asks delay. The Naval Service asks that the quays be closed."
 ire_nw.173.a:0 "Use the German channel"
 ire_nw.173.a_tt:0 "IRA influence +5, security influence +3, stability -5%; German opinion +20, British and US opinion -15; gain 'Berlin's Arms' for 365 days."
 ire_nw.173.b:0 "Purge the network"
 ire_nw.173.b_tt:0 "Security influence +6, IRA influence -5, stability +5%, political power -25; German opinion -20."
 ire_nw.173.c:0 "Expose the network publicly"
 ire_nw.173.c_tt:0 "IRA influence -3, stability +5%, war support +5%; German opinion -30, British and US opinion +10."

 ire_nw.174.t:0 "The Roman Pastoral Letter"
 ire_nw.174.d_low:0 "The bishops are increasingly uneasy about the coalition's secular policies. Rome sends a carefully worded pastoral letter demanding guarantees on education, marriage and the press."
 ire_nw.174.d_labour:0 "Labour's influence in the government alarms the bishops. Rome's pastoral letter publicly reminds Dublin that Ireland is still a Catholic country."
 ire_nw.174.d:0 "Rome has sent a pastoral letter through the hierarchy. It does not touch the form of government, but it makes specific claims on education, the family and public morality and asks that they be written into the coalition's programme. The bishops ask for an answer within the session, and the cabinet must first settle its position."
 ire_nw.174.a:0 "Accept the mediation"
 ire_nw.174.a_tt:0 "Church confidence +10, labour influence -4, stability +5%, political power -25; gain 'Roman Pastoral Letter' for 365 days."
 ire_nw.174.b:0 "Reaffirm the secular principle"
 ire_nw.174.b_tt:0 "Church confidence -8, labour influence +4, stability -5%, political power +25."
 ire_nw.174.c:0 "Hold the present balance"
 ire_nw.174.c_tt:0 "Church confidence +3, labour influence +2, political power -10."

 ire_nw.175.t:0 "The Red Brothers' Request"
 ire_nw.175.d_france:0 "The French Commune asks Dublin for help: volunteers, weapons, or at least a public gesture. Paris treats Ireland as a brother of the Western European red bloc, not as a neutral."
 ire_nw.175.d_britain:0 "Red London asks Dublin to send volunteers and supplies. London calls it fraternal mutual aid; Dublin knows it would drag Ireland into a larger war."
 ire_nw.175.d:0 "The red bloc asks through its representative in Dublin for volunteers, weapons and public support. The delegate reports a shortage of men on the western front and attaches a list of the stores required. The foreign and defence ministries have given their views on the size of a contingent, the transport and the public line, and the cabinet is to decide."
 ire_nw.175.a:0 "Send volunteers."
 ire_nw.175.a_tt:0 "Labour influence +8, IRA influence +5, war support +5%; red France/Britain and Soviet opinion +20-25, US and non-communist British opinion -15; gain 'Internationalist Volunteers' for 365 days."
 ire_nw.175.b:0 "Send supplies only."
 ire_nw.175.b_tt:0 "Labour influence +4, political power -25; red France/Britain opinion +15."
 ire_nw.175.c:0 "Refuse."
 ire_nw.175.c_tt:0 "Labour influence -5, Church confidence +3, stability +5%; red France/Britain opinion -20."

 # ===== National Union: unauthorised faction actions 180-185 =====
 ire_nw.180.t:0 "The Unauthorised Expedition"
 ire_nw.180.d_red:0 "Dockworkers' unions and the Republican volunteer network have acted on their own: bypassing the cabinet, they put volunteers and weapons on ships bound for red France or Britain."
 ire_nw.180.d_war:0 "The war has made the union dock network bold. Workers begin bypassing the cabinet and sending volunteers and supplies where they believe they should go."
 ire_nw.180.d:0 "The union dock committees and the Republican volunteer network organised an expedition without cabinet approval. Dublin learned of it from the newspapers. Defence has established the vessels, the numbers and the time of sailing, and the report is before the cabinet to be confirmed or disavowed, with the authority for the sailing to be traced."
 ire_nw.180.a:0 "Endorse it publicly."
 ire_nw.180.a_tt:0 "Labour influence +8, IRA influence +4, war support +5%; red France/Britain opinion +20, US and non-communist British opinion -15; gain 'Internationalist Volunteers' for 365 days."
 ire_nw.180.b:0 "Disavow and recall them."
 ire_nw.180.b_tt:0 "Labour influence -6, stability +5%, political power -25; US and British opinion +10."
 ire_nw.180.c:0 "Allow it in secret."
 ire_nw.180.c_tt:0 "Labour influence +4, IRA influence +3, political power -50; a scandal may break after 90 days."

 ire_nw.181.t:0 "Shots at the Border Post"
 ire_nw.181.d_black:0 "A Republican Army squad crossed the border and attacked a Black British outpost. London is waiting for Dublin's explanation; no one in the coalition knew about it in advance."
 ire_nw.181.d_war:0 "During the war, a Republican Army squad crossed the border without orders and attacked a British arms train. London demands an explanation from Dublin."
 ire_nw.181.d:0 "A Republican Army squad crosses the border and attacks a British post. No one can say where the order came from, and London has already entered it against Dublin. External Affairs receives a stiff note from the British government; Defence calls for a report from the unit, naming the officer in command and the hour of departure. The British note asks for compensation."
 ire_nw.181.a:0 "Ratify the action."
 ire_nw.181.a_tt:0 "IRA influence +8, security influence -3, stability -5%, war support +5%; British opinion -25; gain 'Border Campaign' for 365 days."
 ire_nw.181.b:0 "Condemn it publicly."
 ire_nw.181.b_tt:0 "IRA influence -7, stability +5%, political power +25; British opinion +15."
 ire_nw.181.c:0 "Discipline the squad internally."
 ire_nw.181.c_tt:0 "Security influence +5, IRA influence -3, stability +5%, political power -25."

 ire_nw.182.t:0 "The Special Branch List"
 ire_nw.182.d_war:0 "Special Branch expanded its powers during the war. A list shows that it interned unionist and labour activists without cabinet approval."
 ire_nw.182.d_confidence:0 "Unionist and Church distrust has made Special Branch bolder. It begins interning 'unreliable elements' without authorisation, and the list eventually reaches the newspapers."
 ire_nw.182.d:0 "Special Branch interned unionist and labour activists without cabinet approval, and the leak of the list brought questions in the Dail. The Department of Justice called for the files, and the Department of Home Affairs admitted that no prior report had been made. The cabinet met in emergency session and took views on ratifying the powers, punishing the overreach, or suppressing the matter."
 ire_nw.182.a:0 "Ratify the emergency powers"
 ire_nw.182.a_tt:0 "Security influence +8, unionist confidence -6, labour influence -4, Church confidence -3, stability +5%; gain 'Emergency Powers' for 365 days."
 ire_nw.182.b:0 "Punish the overreach"
 ire_nw.182.b_tt:0 "Security influence -6, unionist confidence +5, labour influence +4, stability +5%, political power -25."
 ire_nw.182.c:0 "Suppress the matter"
 ire_nw.182.c_tt:0 "Security influence +3, stability -5%, political power -50; a scandal may break after 90 days."

 ire_nw.183.t:0 "Letters in the Lobby"
 ire_nw.183.d_britain:0 "A group in parliament has been passing messages through old London contacts. Cabinet arguments, troop movements and the coalition's red lines all appear on the desks of the British Foreign Office."
 ire_nw.183.d_america:0 "A group in parliament has leaked cabinet arguments to Washington. The Americans mean no harm, but they now know the coalition's limits better than Dublin does."
 ire_nw.183.d:0 "A group in parliament has kept unauthorised contact with foreign missions and leaked the arguments of the cabinet. The Ceann Comhairle has ordered the papers sealed and the Special Branch has submitted the correspondence. Dublin must decide whether to close the channel or use it, and the Chair asks for a ruling before the recess."
 ire_nw.183.a:0 "Use the channel"
 ire_nw.183.a_tt:0 "Parliament influence +6, security influence -4, stability -5%; British and US opinion +15."
 ire_nw.183.b:0 "Investigate the leak"
 ire_nw.183.b_tt:0 "Security influence +5, parliament influence -5, stability +5%, political power -25."
 ire_nw.183.c:0 "Pretend nothing has happened"
 ire_nw.183.c_tt:0 "Parliament influence +2, stability -5%, political power +10."

 ire_nw.184.t:0 "The Unionist Private Army"
 ire_nw.184.d_low:0 "After unionist confidence fell to a dangerous level, paramilitary groups in Belfast began drilling and stockpiling arms in public. Some say London is funding them."
 ire_nw.184.d_parliament:0 "As parliament grows stronger in the government, unionist paramilitaries begin talking about 'self-defence'. Weapons flow into Northern Ireland through the ports."
 ire_nw.184.d:0 "Unionist paramilitaries drill and buy arms openly in Belfast, and both their funding and their contact with London have been established. The commissioner of police reports that the local force is not sufficient to stop them. The cabinet must choose between absorbing, banning and tolerating them, and is asked for its direction."
 ire_nw.184.a:0 "Absorb them into the army"
 ire_nw.184.a_tt:0 "Unionist confidence +8, security influence +4, IRA influence -5, stability +5%, political power -25."
 ire_nw.184.b:0 "Ban the organisation"
 ire_nw.184.b_tt:0 "Unionist confidence -7, security influence +5, IRA influence +3, stability -5%; British opinion -10."
 ire_nw.184.c:0 "Tolerate them for now"
 ire_nw.184.c_tt:0 "Unionist confidence +4, IRA influence +4, stability -5%; British opinion +10."

 ire_nw.185.t:0 "The Bishop's Open Letter"
 ire_nw.185.d_low:0 "The bishops have lost patience with the coalition's secular policies. An open letter is read from pulpits and printed in newspapers, demanding that Dublin restore 'Ireland's traditional values'."
 ire_nw.185.d_labour:0 "Labour's influence in the government alarms the bishops. They publish an open letter warning the coalition not to turn Ireland into 'another red country'."
 ire_nw.185.d:0 "The bishops publish a joint open letter condemning the coalition's moral and education policies; it is read in the parishes and given to the newspapers. The education and justice departments each prepare a draft reply. The cabinet must state its position on relations between Church and state, and the reply is to be issued by the press office and copied to the hierarchy and the unionist delegates."
 ire_nw.185.a:0 "Conciliate the Church."
 ire_nw.185.a_tt:0 "Church confidence +8, labour influence -4, stability +5%, political power -25."
 ire_nw.185.b:0 "Reaffirm the secular principle."
 ire_nw.185.b_tt:0 "Church confidence -8, labour influence +4, stability -5%, political power +25."
 ire_nw.185.c:0 "Let the matter rest for now."
 ire_nw.185.c_tt:0 "Church confidence -3, stability -5%."

 # ===== National Union: scandal and cabinet shift 187-188 =====
 ire_nw.187.t:0 "The Coalition's Scandal"
 ire_nw.187.d_labour:0 "The secret expedition is exposed in the press. The dock unions, the Republican volunteer network and Dublin's silence all appear on the front page; the coalition can no longer pretend it did not know."
 ire_nw.187.d_security:0 "Opposition MPs publish Special Branch's list. Unauthorised internment, unionist testimony and the government's cover-up all appear in the newspapers."
 ire_nw.187.d:0 "The coalition's secret operation has been exposed in the press, and the opposition has tabled a question in the Dail. The cabinet must choose between owning the consequences, cutting ties and covering it up again. Three draft statements are ready at the Taoiseach's office, with the relevant files, and the date for answering the question is to be fixed."
 ire_nw.187.a:0 "Own the consequences."
 ire_nw.187.a_tt:0 "Stability -5%, political power -25; gain 'Political Scandal' for 365 days. Labour scandal: labour influence -3, US and British opinion -10. Security scandal: security influence -3, unionist confidence -3, labour influence +3."
 ire_nw.187.b:0 "Cut ties with the operation."
 ire_nw.187.b_tt:0 "Political power -50, stability +5%; labour scandal: labour influence -6. Security scandal: security influence -6."
 ire_nw.187.c:0 "Keep covering it up."
 ire_nw.187.c_tt:0 "Political power -75, stability -5%; 50% it is buried for good, 50% it returns after another 180 days."

 ire_nw.188.t:0 "The Cabinet's Centre of Gravity Shifts"
 ire_nw.188.d_parliament:0 "Parliament has replaced the other blocs as the weightiest pole in the coalition. Civil servants, procedure and elections are redefining the state."
 ire_nw.188.d_labour:0 "Labour has replaced the other blocs as the weightiest pole in the coalition. Unions, factories and street politics now set the tone in Dublin."
 ire_nw.188.d_security:0 "Security has replaced the other blocs as the weightiest pole in the coalition. Special Branch and the army have a hand in every department."
 ire_nw.188.d_ira:0 "The Republican Army has replaced the other blocs as the weightiest pole in the coalition. Veterans, volunteer networks and border operations are now the centre of the state."
 ire_nw.188.d:0 "The centre of gravity of the coalition is moving. Seats and committee places shift with it, and the new dominant bloc has not yet taken shape. The cabinet secretariat reorders the lists in the usual way; nominations and records have come in from each bloc, and the disputed seats wait upon the next meeting. Each bloc leader has set out his position in writing."
 ire_nw.188.a:0 "Confirm the new centre."
 ire_nw.188.a_tt:0 "Dominant bloc influence +5, stability +5%, political power +25."
 ire_nw.188.b:0 "Restore the old balance."
 ire_nw.188.b_tt:0 "Dominant bloc influence -5, weakest bloc influence +5, political power -25, stability +5%."
 ire_nw.188.c:0 "Reshuffle the cabinet."
 ire_nw.188.c_tt:0 "All four blocs -3 influence, stability +5%, political power -50, war support +5%."

