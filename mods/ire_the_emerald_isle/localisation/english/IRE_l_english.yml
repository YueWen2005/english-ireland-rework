 IRE_X_ind_intel_eff_desc:0 "Decryption +15%, encryption +15%."
 IRE_X_ind_black_market_eff:0 "Black Market Economy"
 IRE_X_ind_black_market_eff_desc:0 "Consumer goods -6%, factory output +8%."

 IRE_offmap_civ:0 "Off-Map Civilian Industry"
 IRE_offmap_civ_desc:0 "Civilian capacity too dispersed to show on the map - uses no building slots."
 IRE_offmap_mil:0 "Off-Map Military Industry"
 IRE_offmap_mil_desc:0 "Military capacity too dispersed to show on the map - uses no building slots."

 ire.108.c:0 "Keep it in Dublin's vaults a while longer. Watch Moscow."
 ire.110.t:0 "The Odessa Bill"
 ire.110.d:0 "Three months on, a Soviet freighter rides quietly in Dublin Bay. Her captain carries a message from Moscow: the gold should come home. Every left-wing paper in the world awaits our answer."
 ire.110.a:0 "Return it in full - honour outweighs gold."
 ire.110.b:0 "To hell with it. Ireland is nobody's counting-house."
 ire.110.c:0 "Split the difference: return half, convert the rest to arms."
