l_english:
 IRE_treatys_scar:0 "条约的伤疤"
 IRE_treatys_scar_desc:0 "1921年英爱条约遗留的裂痕，自由邦名义上独立，却仍要向北爱尔兰与伦敦低头。"
 IRE_diaspora:0 "大流散"
 IRE_diaspora_desc:0 "1845年大饥荒之后，数百万爱尔兰人远渡重洋，他们的后代遍布美洲，仍记得这片土地。"
 IRE_agrarian_poverty:0 "农业穷国"
 IRE_agrarian_poverty_desc:0 "除了牧草与土豆，这个国家几乎什么都造不出来，工厂是奢望。"
 IRE_civil_war_embers:0 "内战余烬"
 IRE_civil_war_embers_desc:0 "1922年的兄弟相残结束了，但枪声留下的伤口仍在隐隐作痛。"
 IRE_free_framework:0 "自由的框架"
 IRE_free_framework_desc:0 "条约不是耻辱，而是一副可以借力的骨架，先让它运转起来。"
 IRE_north_unintegrated:0 "北爱未整合"
 IRE_north_unintegrated_desc:0 "六郡已经回归，但人心还没有，贝尔法斯特的工厂在消极怠工。"
 IRE_sectarian_rift:0 "宗派裂痕"
 IRE_sectarian_rift_desc:0 "用铁腕压平分歧，代价是让分歧沉入地下，等待下一次爆发。"
 IRE_rural_electrification:0 "农村电气化"
 IRE_rural_electrification_desc:0 "电线杆一根根插进绿色的原野。"
 IRE_anglo_irish_beef:0 "对英牛肉出口"
 IRE_anglo_irish_beef_desc:0 "伦敦的餐桌离不开爱尔兰的牛，这既是生意，也是筹码。"
 IRE_republican_constitution:0 "共和宪法"
 IRE_republican_constitution_desc:0 "1937年宪法确立了总统职位，这个国家在法律上终于成为共和国。"
 IRE_free_country:0 "自由的国家"
 IRE_free_country_desc:0 "1949年4月18日，爱尔兰正式脱离英联邦，三十年的等待结束了。"
 IRE_atlantic_bloodline:0 "跨海血脉"
 IRE_atlantic_bloodline_desc:0 "从科克到波士顿，同一面绿旗在无数港口升起。"
 IRE_green_flag_post:0 "绿旗联络站"
 IRE_green_flag_post_desc:0 "海外侨民组织的联络站在美洲各大城市落地，志愿者开始回流。"
 IRE_diaspora_fund:0 "流散基金"
 IRE_diaspora_fund_desc:0 "都柏林的账户上每月都多出一笔来自海外的汇款。"
 IRE_saint_patrick_name:0 "圣帕特里克之名"
 IRE_saint_patrick_name_desc:0 "这个名字本身就是号召，为它而战的人，不只在爱尔兰。"
 IRE_atlantic_bloodline_2:0 "大西洋血脉"
 IRE_atlantic_bloodline_2_desc:0 "大西洋不再是屏障，而是我们的大街。"
 IRE_celtic_world:0 "凯尔特世界"
 IRE_celtic_world_desc:0 "所有爱尔兰裔聚居地，都在同一个网络里呼吸。"
 IRE_washingtons_friend:0 "华盛顿的朋友"
 IRE_washingtons_friend_desc:0 "国会山上的爱尔兰裔议员们，从不会忘记故乡。"
 IRE_southern_supply_line:0 "南方补给线"
 IRE_southern_supply_line_desc:0 "从布宜诺斯艾利斯出发的货船，绕过半个地球抵达科克。"
 IRE_transatlantic_supply:0 "跨大西洋补给网"
 IRE_transatlantic_supply_desc:0 "一条横跨大洋的物流动脉已经成形。"
 IRE_final_ascension:0 "新世界的主人"
 IRE_final_ascension_desc:0 "我们的旗帜在大西洋两岸同时飘扬。"
 IRE_emergency_powers:0 "紧急状态"
 IRE_emergency_powers_desc:0 "都柏林从不称它为战争，但每一个人都知道，这是紧急状态。"
 IRE_lookout_post:0 "瞭望哨"
 IRE_lookout_post_desc:0 "海岸线上的每一个哨所都在盯着海面。"
 IRE_moral_neutrality_idea:0 "道义中立"
 IRE_moral_neutrality_idea_desc:0 "我们不参战，但我们的心在哪一边，所有人都清楚。"
 IRE_armed_neutrality_idea:0 "武装中立"
 IRE_armed_neutrality_idea_desc:0 "中立不等于不设防。"
 IRE_absolute_neutrality_idea:0 "绝对中立"
 IRE_absolute_neutrality_idea_desc:0 "对谁都做生意，对谁都不表态。"
 IRE_moral_arbiter:0 "中立的仲裁者"
 IRE_moral_arbiter_desc:0 "当大国打得疲惫不堪，中立者的声音反而最响。"
 IRE_haaland_wolff:0 "哈兰德与沃尔夫船坞"
 IRE_haaland_wolff_desc:0 "建造过泰坦尼克号的船坞，如今为爱尔兰造船。"
 IRE_reserve_defence:0 "后备国防军"
 IRE_reserve_defence_desc:0 "一支平时务农、战时持枪的部队。"
 IRE_border_plebiscite_support_1:0 "公投支持度"

 IRE_focus_tree:0 "翡翠岛的抉择"
 IRE_border_plebiscite:0 "边境公投"
 IRE_border_plebiscite_desc:0 "与其在条约的框架内等待，不如直接向北方发起一场公投。这违背了1921年的协议，但历史从不等待犹豫者。"
 IRE_consolidate_free_state:0 "自由邦的巩固"
 IRE_consolidate_free_state_desc:0 "德·瓦莱拉说过：我们要做的，是先让这个国家真正运转起来。稳住阵脚，再图后计。"
 IRE_common_galway:0 "戈尔韦船坞"
 IRE_common_galway_desc:0 "西海岸的戈尔韦拥有天然的深水良港。从这里，爱尔兰可以望见大西洋。"
 IRE_common_rural:0 "农村电气化"
 IRE_common_rural_desc:0 "把电送进每一座农舍，是这个国家现代化的第一步。"
 IRE_common_dublin_uni:0 "都柏林大学的研究"
 IRE_common_dublin_uni_desc:0 "圣三一学院的书架上，藏着这个小国最聪明的大脑。"
 IRE_common_tobacco:0 "烟草原产地"
 IRE_common_tobacco_desc:0 "南部的烟草与畜牧产品，是换取外汇的硬通货。"
 IRE_common_signals:0 "情报与密码"
 IRE_common_signals_desc:0 "一个小国要在大国之间生存，耳朵必须比别人灵。"
 IRE_common_arms:0 "军工初创"
 IRE_common_arms_desc:0 "第一批像样的军工厂在都柏林郊外破土动工。"
 IRE_A_revitalise:0 "翡翠岛重整"
 IRE_A_revitalise_desc:0 "绿色的原野上，脚手架一天天长高。"
 IRE_A_shannon:0 "香农河水电"
 IRE_A_shannon_desc:0 "1929年建成的香农河水电站，曾是世界上最大的水电工程之一。"
 IRE_A_reserves:0 "后备国防军"
 IRE_A_reserves_desc:0 "每一个爱尔兰农民，都该会开枪。"
 IRE_A_belfast:0 "贝尔法斯特整合"
 IRE_A_belfast_desc:0 "哈兰德与沃尔夫船坞，建造过泰坦尼克号的地方，如今成为爱尔兰工业的心脏。"
 IRE_A_emergency:0 "The Atlantic Emergency"
 IRE_A_emergency_desc:0 "War has reached the Atlantic. Dublin no longer waits for London's permission and declares a national emergency."
 IRE_A_remittance:0 "Remittances and Patriot Bonds"
 IRE_A_remittance_desc:0 "After the Great Depression, money from Irish America became Dublin's steadiest source of foreign exchange. The government turned it into patriot bonds."
 IRE_A_volunteer_corps:0 "Volunteer Corps"
 IRE_A_volunteer_corps_desc:0 "No waiting for conscription orders. Local units and veterans organise themselves to guard the coasts and the border."
 IRE_A_wartime_economy:0 "Wartime Economic Mobilisation"
 IRE_A_wartime_economy_desc:0 "Factories switch to war production and farms deliver quotas. For the first time, Dublin truly manages the whole island's economy."
 IRE_A_atlantic_wall:0 "The Atlantic Wall"
 IRE_A_atlantic_wall_desc:0 "From Donegal to Cork, coastal batteries, lookout posts and sonar stations form a single line watching for German U-boats."
 IRE_A_ulster_bulwark:0 "The Ulster Bulwark"
 IRE_A_ulster_bulwark_desc:0 "If London turns hostile, the six counties are the first trench. Dublin builds fortifications along the Newry-Dundalk line."
 IRE_A_britain_war_plan:0 "War Plan against Britain"
 IRE_A_britain_war_plan_desc:0 "For the first time the staff seriously wargames a war with Britain: hold Ulster, delay the landings, wait for help from across the ocean."
 IRE_A_fortress_ireland:0 "Fortress Ireland"
 IRE_A_fortress_ireland_desc:0 "The island is fortified. Whether German submarines or the British fleet come, Ireland is no longer soft."
 IRE_remittance_economy:0 "Remittance Economy"
 IRE_remittance_economy_desc:0 "Money from Boston, New York and Buenos Aires keeps the Dublin treasury afloat."
 IRE_volunteer_corps:0 "Volunteer Corps"
 IRE_volunteer_corps_desc:0 "Local volunteer units are reorganised into reserves to fill gaps in the regular army."
 IRE_wartime_economy:0 "Wartime Economy"
 IRE_wartime_economy_desc:0 "The state takes over key factories and rationing; all production serves the war effort."
 IRE_atlantic_wall:0 "Atlantic Wall"
 IRE_atlantic_wall_desc:0 "A ring of coastal forts, lookout posts and anti-submarine patrols."
 IRE_ulster_bulwark:0 "Ulster Bulwark"
 IRE_ulster_bulwark_desc:0 "Permanent fortifications and a mobilisation system facing Britain."
 IRE_britain_war_plan:0 "War Plan against Britain"
 IRE_britain_war_plan_desc:0 "A plan against British landings and blockade, issued down to every division staff."
 IRE_fortress_ireland:0 "Fortress Ireland"
 IRE_fortress_ireland_desc:0 "The whole island fortified; any invader will pay the price."
 IRE_A_reconciliation:0 "和解政策"
 IRE_A_reconciliation_desc:0 "伦敦在看着。如果新教徒的工厂继续开工，抗议的声音就会小一些。"
 IRE_A_firm_integration:0 "强硬整合"
 IRE_A_firm_integration_desc:0 "不谈判，不安抚。六郡必须无条件服从都柏林。"
 IRE_A_london_note:0 "伦敦的最后通牒"
 IRE_A_london_note_desc:0 "告诉伦敦：条约必须重新谈。"
 IRE_A_settle_treaty:0 "清算条约"
 IRE_A_settle_treaty_desc:0 "把1921年留下的账，一次算清。"
 IRE_A_treaty_ports:0 "条约港归还"
 IRE_A_treaty_ports_desc:0 "1938年，英国归还了三个条约港。这是爱尔兰中立得以成立的物质前提。"
 IRE_A_atlantic_call:0 "大西洋的呼唤"
 IRE_A_atlantic_call_desc:0 "海洋不是边界。海洋是通道。"
 IRE_A_diaspora_legacy:0 "大流散的遗产"
 IRE_A_diaspora_legacy_desc:0 "七千万爱尔兰后裔散落在世界各地，他们从未忘记这片土地。"
 IRE_A_newfoundland:0 "纽芬兰的渔火"
 IRE_A_newfoundland_desc:0 "1934年，纽芬兰因财政破产放弃自治，由伦敦直接管辖。这是回归的窗口。"
 IRE_A_nf_plebiscite:0 "Dominion Plebiscite"
 IRE_A_nf_plebiscite_desc:0 "St. John's votes on whether to remain British or join Ireland. Requires Newfoundland support above 49 (the Fishermen's Brotherhood decision adds +8 each time). If support is above 79, or Britain is already at war, the referendum passes automatically; otherwise it is a coin toss."
 IRE_nf_support_50:0 "Fishermen's Protective Union"
 IRE_nf_support_50_desc:0 "Build contacts in every Newfoundland fishing village, following William Coaker's old union playbook, until support passes 50."
 IRE_A_nf_province:0 "The Thirty-Third County"
 IRE_A_nf_province_desc:0 "Newfoundland is incorporated into Ireland as the country's thirty-third county."
 IRE_A_boston:0 "波士顿的绿旗"
 IRE_A_boston_desc:0 "肯尼迪家族、柯林斯家族，美国的政治机器里到处都是爱尔兰姓氏。"
 IRE_A_lobby:0 "爱尔兰裔游说团"
 IRE_A_lobby_desc:0 "在华盛顿，有时候一个游说团比一支舰队更有用。"
 IRE_A_irish_division:0 "租借的爱尔兰师"
 IRE_A_irish_division_desc:0 "成千上万的美国爱尔兰裔青年，愿意为故乡而战。"
 IRE_A_san_patricio:0 "圣帕特里克营"
 IRE_A_san_patricio_desc:0 "1846年，一群爱尔兰裔美军逃兵为墨西哥而战，至今仍被墨西哥人奉为英雄。"
 IRE_A_green_legion:0 "绿旗军团"
 IRE_A_green_legion_desc:0 "以圣帕特里克之名，组建一支真正的军团。"
 IRE_A_buenos_aires:0 "布宜诺斯艾利斯的绿草地"
 IRE_A_buenos_aires_desc:0 "阿根廷的爱尔兰裔社区是南美最大的一支，牛肉与小麦正等着出口。"
 IRE_A_southern_cone:0 "南锥体补给线"
 IRE_A_southern_cone_desc:0 "从南美绕过半个地球的航线，将成为我们最长的补给臂。"
 IRE_A_supply_web:0 "跨大西洋补给网"
 IRE_A_supply_web_desc:0 "把散落各处的支线连成一张网。"
 IRE_A_celtic_commonwealth:0 "Celtic Commonwealth"
 IRE_A_celtic_commonwealth_desc:0 "From Dublin to St. John's, from Boston to Buenos Aires. Requires the Celtic diaspora network to be above 99."
 IRE_A_masters_new_world:0 "Bonds of the New World"
 IRE_A_masters_new_world_desc:0 "Every Irishman on both sides of the Atlantic will stand under the same flag."
 IRE_B_civil_service:0 "公务员制度改革"
 IRE_B_civil_service_desc:0 "一个国家的效率，取决于它的文书能不能读懂自己写的公文。"
 IRE_B_quell_embers:0 "平息内战余烬"
 IRE_B_quell_embers_desc:0 "1922年的伤口必须愈合，否则它会一直溃烂。"
 IRE_B_outlaw_ira:0 "取缔IRA"
 IRE_B_outlaw_ira_desc:0 "1936年，德·瓦莱拉政府宣布IRA为非法组织。稳定，来自于秩序。"
 IRE_B_tolerate_ira:0 "容忍IRA"
 IRE_B_tolerate_ira_desc:0 "他们是不听话的孩子，但终究是自己的骨肉。"
 IRE_B_economic_war_end:0 "经济战争的终结"
 IRE_B_economic_war_end_desc:0 "1932-38年的英爱关税战，把两国都拖得精疲力尽，该结束了。"
 IRE_B_trade_agreement:0 "英爱贸易协定"
 IRE_B_trade_agreement_desc:0 "1938年协定签署，牛肉换工厂，这是笔公平的交易。"
 IRE_B_land_annuities:0 "土地年金清算"
 IRE_B_land_annuities_desc:0 "一次性支付一千万英镑，了结纠缠二十年的年金争端。"
 IRE_B_treaty_ports:0 "条约港的归还"
 IRE_B_treaty_ports_desc:0 "In 1938 Britain returned the treaty ports of Cobh, Berehaven and Lough Swilly. Without them, Irish neutrality would have been an empty phrase."
 IRE_B_constitution_1937:0 "1937年宪法"
 IRE_B_constitution_1937_desc:0 "新宪法设立总统职位，确立爱尔兰的事实共和国地位。"
 IRE_B_president_mace:0 "总统的权杖"
 IRE_B_president_mace_desc:0 "总统不只是礼仪性的，他是这个国家道义的声音。"
 IRE_B_emergency:0 "紧急状态宣言"
 IRE_B_emergency_desc:0 "爱尔兰从不称它为战争，他们叫它：紧急状态。"
 IRE_B_coastal:0 "海岸防卫"
 IRE_B_coastal_desc:0 "任何一个从海上来的敌人，都会在沙滩上付出代价。"
 IRE_B_ldf:0 "地方防卫军"
 IRE_B_ldf_desc:0 "紧急状态期间，超过十万人加入了LDF。"
 IRE_B_plan_w:0 "W计划"
 IRE_B_plan_w_desc:0 "英爱之间秘密达成的联合防德入侵计划，连中立国也要准备好最坏的情况。"
 IRE_B_moral_neutrality:0 "道义中立"
 IRE_B_moral_neutrality_desc:0 "我们不参战，但我们的心在哪一边，所有人都清楚。"
 IRE_B_absolute_neutrality:0 "Strict Neutrality"
 IRE_B_absolute_neutrality_desc:0 "Trade with everyone, endorse no one. De Valera calls this strict neutrality, the most profitable way for a small nation."
 IRE_B_armed_neutrality:0 "武装中立"
 IRE_B_armed_neutrality_desc:0 "谁敢动我，我就打谁。"
 IRE_B_shannon_wayfarers:0 "Wayfarers at Shannon"
 IRE_B_shannon_wayfarers_desc:0 "Allied pilots who crash-land at Shannon are quietly sent across the border, while German pilots go to internment camps. At Foynes, stranded travellers are warmed with hot coffee."
 IRE_B_dublin_choice:0 "都柏林的抉择"
 IRE_B_dublin_choice_desc:0 "当德国人的坦克开进低地国家，德·瓦莱拉必须决定：这个国家要站在哪里。"
 IRE_B_berlin_overture:0 "柏林的试探"
 IRE_B_berlin_overture_desc:0 "德国情报机构通过爱尔兰共和军伸出了手，接下它，代价可能是一场战争。"
 IRE_B_famine_echo:0 "饥饿的回声"
 IRE_B_famine_echo_desc:0 "1945年后，来自美国的援助让大饥荒的记忆稍稍平息。"
 IRE_B_republic_1949:0 "1949年共和国法案"
 IRE_B_republic_1949_desc:0 "1949年4月18日，爱尔兰正式脱离英联邦，成立共和国。"
 IRE_B_moral_authority:0 "道义的权威"
 IRE_B_moral_authority_desc:0 "当世界打得筋疲力尽，一个始终不参战的小国反而有了说话的分量。"
 IRE_B_final_unification:0 "最后的统一"
 IRE_B_final_unification_desc:0 "三十年的等待之后，北方终于以和平的方式回到了这个国家的怀里。"

 ire.1.t:0 "北爱的选择"
 ire.1.d:0 "贝尔法斯特的街头挤满了人。投票箱在一座废弃的纺织厂里打开，计票员的手在发抖。三十年来第一次，北方六郡的人民被问了一个问题：你们属于哪里？"
 ire.1.a:0 "六郡回家了。"
 ire.1.b:0 "我们知道这一天会来。"
 ire.2.t:0 "伦敦的抗议"
 ire.2.d:0 "白厅的反应比预想的快。一份措辞严厉的照会送到都柏林，称这次公投严重违反1921年条约精神。"
 ire.2.a:0 "他们能怎样？"
 ire.10.t:0 "圣约翰斯的选择"
 ire.10.d:0 "纽芬兰的渔民们聚集在港口。海风里传来消息：伦敦正处于战争之中，无暇西顾。"
 ire.10.a:0 "时机已到。"
 ire.10.b:0 "这是赌上国运的一步。"
 ire.10.a_tt:0 "英国正在战争中，干涉的可能性很低。"
 ire.20.t:0 "一位飞行员的遣返"
 ire.20.d:0 "一架英国战斗机迫降在香农河畔的草地上。飞行员被带到当地警局，喝了杯茶，第二天早上就不小心走到了边境。"
 ire.20.a:0 "我们不记得有这回事。"
 ire.30.t:0 "北方的新黎明"
 ire.30.d:0 "没有枪声，没有最后通牒。一支爱尔兰军队在贝尔法斯特郊外停下，等待移交仪式。六郡，和平地回来了。"
 ire.30.a:0 "这条路走了三十年。"
 ire.40.t:0 "流散的回应"
 ire.40.d:0 "美洲的爱尔兰裔社区开始自发募捐，一批批物资正运往都柏林。"
 ire.40.a:0 "血脉从未断过。"
 ire.50.t:0 "圣帕特里克日"
 ire.50.d:0 "3月17日。全世界的爱尔兰人都在这一天想起故乡。"
 ire.50.a:0 "为圣帕特里克干杯。"

 IRE_decisions:0 "翡翠岛事务"
 IRE_unity_campaign_cat:0 "统一宣传运动"
 IRE_unity_campaign:0 "发起统一宣传"
 IRE_unity_campaign_desc:0 "在北方与海外组织集会、募捐与宣传，为公投积累民意基础。"
 IRE_diaspora_cat:0 "海外网络"
 IRE_overseas_promotion:0 "海外宣传"
 IRE_overseas_promotion_desc:0 "在美洲的爱尔兰裔社区中开展宣传，扩大网络影响。"
 IRE_newfoundland_cat:0 "纽芬兰事务"
 IRE_fisher_brotherhood:0 "渔民兄弟会"
 IRE_fisher_brotherhood_desc:0 "在纽芬兰的渔村中建立联络网络，为独立公投做铺垫。"
 IRE_neutral_cat:0 "中立事务"
 IRE_moral_appeal:0 "道义呼吁"
 IRE_moral_appeal_desc:0 "向世界发出爱尔兰的声音，争取道义上的支持。"
 IRE_weather_forecast:0 "天气预报共享"
 IRE_weather_forecast_desc:0 "把大西洋的气象数据悄悄交给伦敦。这不算参战。"
 IRE_smuggling:0 "走私贸易"
 IRE_smuggling_desc:0 "向交战双方同时出口物资。被发现会损害声誉，但利润丰厚。"
 IRE_convoy_cat:0 "大西洋航线"
 IRE_atlantic_convoy:0 "跨大西洋护航"
 IRE_atlantic_convoy_desc:0 "组织船团护航，保障跨洋航线的安全。"

 IRE_agrarian_poverty_lite:0 "农业穷国（缓和）"
 IRE_agrarian_poverty_lite_desc:0 "关税战结束了，牧草之外终于有了别的生意，但工厂依然稀少。"
 IRE_settled_treaty:0 "清算的条约"
 IRE_settled_treaty_desc:0 "1921年留下的账已经算清，都柏林的每一天都能多攒一点筹码。"
 IRE_british_sanctions:0 "英国贸易制裁"
 IRE_british_sanctions_desc:0 "白厅的报复比预想的精准，爱尔兰的出口被卡在了港口。"
 IRE_san_patricio_elite:0 "圣帕特里克营"
 IRE_san_patricio_elite_desc:0 "这支以1846年墨西哥战场上的爱尔兰营命名的部队，攻守兼备，纪律严明。"
 IRE_newfoundland_fisheries:0 "纽芬兰渔场"
 IRE_newfoundland_fisheries_desc:0 "圣约翰斯外海的鳕鱼群，是这片新国土上最不需要花钱的资源。"
 IRE_fisher_brotherhood_idea:0 "渔民兄弟会"
 IRE_fisher_brotherhood_idea_desc:0 "从戈尔韦到圣约翰斯，每一座渔村都有我们的联络人。"
 IRE_south_american_trade:0 "南美农产品贸易"
 IRE_south_american_trade_desc:0 "潘帕斯草原的牛肉与小麦，经由布宜诺斯艾利斯换回都柏林需要的东西。"
 IRE_joint_defence_idea:0 "联合防务协调"
 IRE_joint_defence_idea_desc:0 "英爱两军的参谋在地图上画着同一条防线，虽然谁都不愿承认。"
 IRE_emergency_powers_2:0 "紧急状态（二级）"
 IRE_emergency_powers_2_desc:0 "海面上的动静越来越近，都柏林把警戒线推到了沙滩上。"
 IRE_emergency_powers_3:0 "紧急状态（三级）"
 IRE_emergency_powers_3_desc:0 "战争已经烧到门口，这个国家必须把每一分力气都用上。"

 IRE_overseas_recruit:0 "海外募兵"
 IRE_overseas_recruit_desc:0 "在波士顿、芝加哥、布宜诺斯艾利斯的爱尔兰裔社区设点募兵，愿意回来的人远比想象中多。"
 IRE_overseas_fundraising:0 "海外募捐"
 IRE_overseas_fundraising_desc:0 "侨民的钱比侨民的人来得更快，一张张汇款单撑起了都柏林的预算。"
 IRE_interfaith_dialogue:0 "跨教派对话"
 IRE_interfaith_dialogue_desc:0 "让天主教徒与新教徒坐在同一张桌子前。这不会解决一切，但至少能让人听见对方。"
 IRE_dublin_order:0 "都柏林的秩序"
 IRE_dublin_order_desc:0 "宪兵队开进贝尔法斯特的街道，用枪托和搜查令把抵抗压下去。"
 IRE_south_america_purchase:0 "南美采购"
 IRE_south_america_purchase_desc:0 "从阿根廷的仓库里，用牛肉合同换来一批多余的美式步枪。"
 IRE_transatlantic_expedition:0 "跨大西洋远征"
 IRE_transatlantic_expedition_desc:0 "把军队投送到大西洋彼岸的爱尔兰裔聚居地，这是凯尔特联邦才配享有的特权。"
 IRE_joint_defence:0 "联合防务协调"
 IRE_joint_defence_desc:0 "英爱两军的参谋开始在地图上画同一条防线。这不算结盟，只是心照不宣。"
 IRE_emergency_drill:0 "紧急动员演习"
 IRE_emergency_drill_desc:0 "全民防空演习，警报声在都柏林上空响了整整一个下午。"
 IRE_cross_border_ops:0 "跨境行动"
 IRE_cross_border_ops_desc:0 "让IRA的人替我们处理一些不方便由军队出面的事情。"
 IRE_mediator:0 "调停者"
 IRE_mediator_desc:0 "向交战双方同时递出橄榄枝。一个从未参战的小国，有时反而是唯一被双方同时接受的中间人。"

 IRE_mobilisation_drive:0 "Mobilisation Drive"
 IRE_mobilisation_drive_desc:0 "Extraordinary times demand extraordinary measures; every able-bodied man is entered on the register."
 IRE_ldf_expansion:0 "Local Defence Force Expansion"
 IRE_ldf_expansion_desc:0 "In the coastal villages, the militia sheds hold more new rifles than fishing nets."

 # ==================== Economy Region ====================
 IRE_E_shannon_hub:0 "The Shannon Scheme"
 IRE_E_shannon_hub_desc:0 "Turning the Shannon's current into power, and that power into factories and farmhouses, is where Irish industrialisation begins."
 IRE_E_peat_fuel:0 "Peat-Fired Power"
 IRE_E_peat_fuel_desc:0 "Turf from the midland bogs is carted into power stations; Dublin no longer takes its energy orders from London."
 IRE_E_cork_port:0 "Cork Harbour Expansion"
 IRE_E_cork_port_desc:0 "The deep-water harbour on the south coast becomes an ocean terminal, with ships sailing straight for America."
 IRE_E_agri_modern:0 "Agricultural Modernisation"
 IRE_E_agri_modern_desc:0 "Tractors, better seed and cooperatives replace the old tenant economy; the countryside has surplus grain and cash for the first time."
 IRE_E_industrial_park:0 "Foynes Flying Boat Base"
 IRE_E_industrial_park_desc:0 "Pan Am clippers land on the water at Foynes, transferring transatlantic passengers and mail. Repair yards, hotels and warehouses grow around the terminal."
 IRE_E_merchant_marine:0 "Merchant Marine"
 IRE_E_merchant_marine_desc:0 "Green-flagged freighters run between Dublin and New York, bringing machinery home and beef abroad."
 IRE_E_export_hub:0 "Export Hub"
 IRE_E_export_hub_desc:0 "Ireland is no longer merely England's farm; it is a node in the Atlantic trading network."
 IRE_E_financial_centre:0 "Central Bank of Ireland"
 IRE_E_financial_centre_desc:0 "Founded in 1943, the Central Bank gives Dublin's banks and insurers their own currency and credit system."
 IRE_E_atlantic_economy:0 "Atlantic Economy"
 IRE_E_atlantic_economy_desc:0 "From Shannon to Boston, capital, goods and people move along the same sea lane."

 IRE_shannon_grid:0 "Shannon Grid"
 IRE_shannon_grid_desc:0 "A national transmission network links hydroelectric power to the factories."
 IRE_peat_energy:0 "Peat Energy"
 IRE_peat_energy_desc:0 "Domestic peat replaces imported coal; for the first time Dublin sets its own energy bill."
 IRE_modern_agriculture:0 "Modern Agriculture"
 IRE_modern_agriculture_desc:0 "Mechanisation and cooperatives double the yield of the land; the countryside is no longer a byword for poverty."
 IRE_merchant_marine:0 "Merchant Marine"
 IRE_merchant_marine_desc:0 "A merchant fleet under the green flag links Ireland directly to American markets."
 IRE_export_economy:0 "Export Economy"
 IRE_export_economy_desc:0 "Factories are built for export, and the ports are busy for export."
 IRE_dublin_finance:0 "Dublin Finance"
 IRE_dublin_finance_desc:0 "The banking street along the Liffey is becoming the capital centre of a small nation."
 IRE_atlantic_economy:0 "Atlantic Economy"
 IRE_atlantic_economy_desc:0 "Capital, goods and people travel the same route; Ireland is no longer on the margins."

 # ==================== Military Region ====================
 IRE_M_war_cabinet:0 "Wartime Cabinet"
 IRE_M_war_cabinet_desc:0 "The war has reached the Atlantic; Dublin finally organizes a real wartime system."
 IRE_M_army_expansion:0 "Army Expansion"
 IRE_M_army_expansion_desc:0 "In 1940 the regular army expands from fewer than 10,000 to over 40,000, while the LDF and LSF recruit more than 100,000 volunteers. Ireland has a formed defence force at last."
 IRE_M_officer_corps:0 "Officer Corps and Staff"
 IRE_M_officer_corps_desc:0 "Cadres are drawn from the military college and exiled officers to build a staff fit for modern war."
 IRE_M_armour:0 "Armoured Experiment"
 IRE_M_armour_desc:0 "The first tanks arrive from Britain and America; Ireland begins to learn mechanised warfare."
 IRE_M_coastal_fortress:0 "Coastal Fortresses"
 IRE_M_coastal_fortress_desc:0 "The coast defences at Cobh, Berehaven and Lough Swilly are reactivated, and concrete emplacements line the likely landing beaches."
 IRE_M_naval_expansion:0 "Naval Expansion"
 IRE_M_naval_expansion_desc:0 "The Marine Service, founded in 1939, expands; torpedo boats and escorts begin patrols, and the green flag appears in the Atlantic in earnest."
 IRE_M_submarine_war:0 "Atlantic Commerce Raiding"
 IRE_M_submarine_war_desc:0 "Submarines sail from Galway and Berehaven to grip Britain's lifeline - and drag Ireland into the war."
 IRE_M_escort:0 "Convoy System"
 IRE_M_escort_desc:0 "Merchantmen cross the ocean under escort; only then does supply reach Dublin."
 IRE_M_air_corps:0 "Irish Air Corps"
 IRE_M_air_corps_desc:0 "Baldonnel is expanded, and fighters and reconnaissance aircraft belong to Ireland for the first time."
 IRE_M_maritime_patrol:0 "Maritime Patrol Aircraft"
 IRE_M_maritime_patrol_desc:0 "Patrol aircraft trace circles over the western approaches; no submarine surfaces unseen."
 IRE_M_g2:0 "G2 Intelligence"
 IRE_M_g2_desc:0 "Colonel Liam Archer builds the army's G2 intelligence branch into an independent service, with code-breaking, signals and counter-espionage."
 IRE_M_total_defence:0 "Total Defence"
 IRE_M_total_defence_desc:0 "Army, navy, air corps and intelligence become one system; the neutral small state finally has teeth."

 IRE_war_cabinet:0 "War Cabinet"
 IRE_war_cabinet_desc:0 "The nation is placed on a wartime footing; cabinet, army and industry work to one timetable."
 IRE_army_expansion:0 "Army Expansion"
 IRE_army_expansion_desc:0 "Reservists and volunteers join the regular army; the Irish Army has scale for the first time."
 IRE_officer_corps:0 "Officer Corps"
 IRE_officer_corps_desc:0 "A modern-trained officer corps lets a small army conduct complex operations."
 IRE_coastal_fortress:0 "Coastal Fortress"
 IRE_coastal_fortress_desc:0 "Concrete and guns line the coast; an invader must pay in blood first."
 IRE_submarine_war:0 "Atlantic Commerce Raiding"
 IRE_submarine_war_desc:0 "Submarines and torpedoes carry Ireland's battlefield deep into the Atlantic."
 IRE_convoy_escort:0 "Convoy Escort System"
 IRE_convoy_escort_desc:0 "Escorts and convoy formations make the ocean crossing no longer a massacre."
 IRE_maritime_patrol:0 "Maritime Patrol"
 IRE_maritime_patrol_desc:0 "Patrol aircraft and lookout posts weave an anti-submarine net together."
 IRE_g2_intelligence:0 "G2 Intelligence"
 IRE_g2_intelligence_desc:0 "Code-breaking and counter-espionage let Dublin hear what others cannot."
 IRE_total_defence:0 "Total Defence"
 IRE_total_defence_desc:0 "Army, navy, air and intelligence fused into one; neutrality no longer means defencelessness."

 # ==================== A-line diplomacy ====================
 IRE_A_wild_geese:0 "The Wild Geese Come Home"
 IRE_A_wild_geese_desc:0 "The Wild Geese are Ireland's oldest soldiers: men who fought for Spain, France and Austria. This time the recruiting offices are in Dublin, and veterans come home with their kit bags."
 IRE_A_donegal_corridor:0 "The Donegal Corridor"
 IRE_A_donegal_corridor_desc:0 "In 1941 Dublin and London reached an understanding: Allied aircraft may overfly Donegal to reach the Atlantic. Ireland is still neutral on paper, but the lookout posts are already guiding the RAF."
 IRE_A_unity_for_ports:0 "Unity for the Ports"
 IRE_A_unity_for_ports_desc:0 "In June 1940 London makes an astonishing offer: if Ireland enters the war and opens her ports, Britain will deliver a united Ireland. De Valera stares at Belfast on the map and says nothing for a long time."

 # ==================== Economy: pre-war and post-war ====================
 IRE_E_hospital_sweepstake:0 "The Hospital Sweepstake"
 IRE_E_hospital_sweepstake_desc:0 "In 1930 the Irish Hospitals' Sweepstake is licensed. Jackpots run to tens of thousands of pounds and tickets sell across Britain and America; the money builds hospitals and quietly fills the Treasury."
 IRE_E_public_health:0 "Public Health Service"
 IRE_E_public_health_desc:0 "Sweepstake money is earmarked for county hospitals, maternal clinics and tuberculosis sanatoria. For the first time Dublin writes 'let people live longer' into the national budget."
 IRE_E_medical_schools:0 "Medical Schools and Nursing Colleges"
 IRE_E_medical_schools_desc:0 "University College Dublin, University College Cork and the voluntary hospitals establish medical schools, while nursing colleges begin to train in numbers. Irish doctors no longer have to study only in London."
 IRE_E_national_health:0 "National Health Service"
 IRE_E_national_health_desc:0 "From county hospitals to rural dispensaries, a public health network spreads across the island. It builds no guns, but it gives the nation an extra generation in wartime."
 IRE_E_shannon_free_zone:0 "The Shannon Free Zone"
 IRE_E_shannon_free_zone_desc:0 "In 1959 a free-trade zone is carved out beside Shannon Airport. Duty-free warehouses and foreign factories take root; transatlantic flights refuel here and bring Ireland its first multinationals."

 # ==================== Military: historical additions ====================
 IRE_M_coast_watch:0 "Coast Watching Service"
 IRE_M_coast_watch_desc:0 "From 1939 the lighthouses and fishing villages of the coast are organised into a lookout network. Fishermen on watch record every surfaced U-boat and every passing aircraft, then send the report to G2."
 IRE_M_armoured_cars:0 "Armoured Cars"
 IRE_M_armoured_cars_desc:0 "The Irish Army has kept a handful of Rolls-Royce armoured cars since the Civil War. In 1940 the Local Defence Force welds steel plate onto truck chassis and improvises its first armoured squadron."

 # ==================== New ideas ====================
 IRE_donegal_corridor:0 "Donegal Corridor"
 IRE_donegal_corridor_desc:0 "Allied aircraft may cross Ireland's north-west; Dublin's radar and lookouts see farther as a result."
 IRE_wild_geese:0 "The Wild Geese"
 IRE_wild_geese_desc:0 "Irish soldiers scattered across the world return home, bringing combat experience to a young army."
 IRE_unity_for_ports:0 "Unity Bought with Ports"
 IRE_unity_for_ports_desc:0 "The Six Counties come under Dublin at the price of opening the treaty ports and standing with London. Unity or neutrality - only one can be chosen."
 IRE_hospital_sweepstake:0 "Hospital Sweepstake"
 IRE_hospital_sweepstake_desc:0 "Sweepstake proceeds flow into the hospitals fund, giving the Treasury a source of money that does not come from taxes."
 IRE_public_health:0 "Public Health Service"
 IRE_public_health_desc:0 "County hospitals, maternal clinics and tuberculosis sanatoria are brought under a single budget. Infant mortality begins to fall, and more healthy young men reach the recruiting offices."
 IRE_medical_schools:0 "Medical Schools and Nursing Colleges"
 IRE_medical_schools_desc:0 "Home-grown medical and nursing schools train doctors and nurses in numbers, and medical research no longer depends entirely on London."
 IRE_national_health:0 "National Health Service"
 IRE_national_health_desc:0 "An island-wide public health network lowers mortality and raises population, giving the recruiting offices more healthy young men."
 IRE_shannon_free_zone:0 "Shannon Free Zone"
 IRE_shannon_free_zone_desc:0 "Duty-free facilities and the transatlantic route bring capital, cargo and technology into Ireland together."
 IRE_coast_watch:0 "Coast Watch"
 IRE_coast_watch_desc:0 "Lookout posts and fishing villages form an invisible sea frontier; no submarine or aircraft passes unrecorded."
 IRE_armoured_cars:0 "Armoured Squadron"
 IRE_armoured_cars_desc:0 "Rolls-Royce armoured cars and truck conversions give the infantry mobile steel cover for the first time."

 # ==================== Historical events ire.60 - ire.65 ====================
 ire.60.t:0 "Unity, or War?"
 ire.60.d:0 "June 1940. Paris has fallen and London stands more alone than ever. A courier brings a document to De Valera's desk: if Dublin opens the ports of Cork, Berehaven and Donegal and joins the war against Germany, Britain will at once begin handing over Northern Ireland. The paper is unsigned, but everyone knows it comes from Churchill."
 ire.60.a:0 "One island, one parliament."
 ire.60.a_tt:0 "Northern Ireland will join Ireland, and Ireland will join Britain's faction; stability -5%, war support +10%."
 ire.60.b:0 "We will not shed blood for unity."
 ire.61.t:0 "Belfast Is Burning"
 ire.61.d:0 "April 1941. German bombers sweep over Belfast Lough. The anti-aircraft defences are pitifully thin, and the docks and factories burn. London asks Dublin to send fire brigades north - the same men who faced each other across the border yesterday must now save lives in the same fire."
 ire.61.a:0 "Send Dublin's fire engines north."
 ire.61.b:0 "We can only offer our condolences."
 ire.62.t:0 "North Strand"
 ire.62.d:0 "Late at night on 31 May 1941, three bombs fall on North Strand in Dublin and thirty-four people die. German radio calls it a navigational error. Dubliners ask where the next error will fall."
 ire.62.a:0 "Make a formal protest to Berlin."
 ire.62.b:0 "Accept compensation and say nothing."
 ire.63.t:0 "The Man Who Fell from the Sky"
 ire.63.d:0 "In May 1940 a German lands by parachute in a Westmeath field. He calls himself Hermann Goertz and carries a list of contacts for the IRA. G2 reaches him first."
 ire.63.a:0 "Intern him and keep strict neutrality."
 ire.63.b:0 "Let us hear what he knows first."
 ire.64.t:0 "A Note from Washington"
 ire.64.d:0 "In April 1944 the American ambassador delivers a blunt note: close the German and Italian legations and silence the Axis radio broadcasts. Washington adds that this is not a request."
 ire.64.a:0 "Comply. We need American friendship."
 ire.64.b:0 "Irish neutrality is not for Washington to judge."
 ire.65.t:0 "The End of an Age"
 ire.65.d:0 "May 1945. Berlin has fallen. The German minister Hempel comes to the Department of External Affairs in Dublin and signs the book of condolence. Days later Churchill names the neutral states one by one in the Commons. Dublin radio begins to broadcast De Valera's reply."
 ire.65.a:0 "Offer condolences to Hempel."
 ire.65.b:0 "Today we only say farewell to the past."

 IRE_B_crush_terror:0 "Crush the Terrorists"
 IRE_B_crush_terror_desc:0 "Search warrants, army support and the Special Criminal Court go together: an outlawed IRA cannot remain outlawed only on paper. Its arms dumps, safe houses and recruiting web must be torn out root and branch."
 IRE_B_russell_death:0 "The Death of Russell"
 IRE_B_russell_death_desc:0 "In August 1940 IRA Chief of Staff Sean Russell died aboard U-65 on his way back to Ireland, and was buried at sea in the Atlantic. The last line between Berlin and the IRA at home went silent."
 IRE_B_noose_tightens:0 "The Noose Tightens"
 IRE_B_noose_tightens_desc:0 "The scaffold at Mountjoy was never idle. Those who refused to bend were hanged under the law; the remainder went deep underground. Under the Emergency, Ireland endured the tightest of years."
 IRE_internment_camps:0 "Internment Camps"
 IRE_internment_camps_desc:0 "Detention without trial spreads across the Curragh. Behind the wire sit threats - and the government's popularity: order has returned, at the price of liberty."
 IRE_noose_years:0 "The Noose Years"
 IRE_noose_years_desc:0 "In the darkest years of the war the government traded iron resolve for quiet. Precedent has been set: there is no second chance for men of violence."
 ire.66.t:0 "A Funeral in the Atlantic"
 ire.66.d:0 "The U-65's watch officer wrote one line in the log: 'The Chief of Staff died this morning. Buried at sea.' Sean Russell, Chief of Staff of the IRA, never set foot on Irish soil again. The last radio link between Berlin and the underground in Dublin fell silent."
 ire.66.a:0 "Announce it to the nation."
 ire.66.a_tt:0 "+50 political power, +2% stability."
 ire.66.b:0 "No comment."
 ire.66.b_tt:0 "+4% stability."
 ire.67.t:0 "The Noose of Mountjoy"
 ire.67.d:0 "Six in the morning: the bell of Mountjoy Prison, then footsteps. The condemned IRA men refused clemency - 'I am a prisoner of war, not a criminal.' The newspapers gave it a corner of one page, but all of Dublin was whispering about it."
 ire.67.a:0 "Carry out the sentence. All of them."
 ire.67.a_tt:0 "+2% war support."
 ire.67.b:0 "Commute to hard labour."
 ire.67.b_tt:0 "+25 political power."

 # ================= IRA Civil War Branch: Focuses =================
 IRE_ira_council:0 "Reorganising the Staff"
 IRE_ira_council_desc:0 "In the winter of 1936 Seán Russell dissolved the paralysed Army Council and rebuilt a General Staff. The old men of Phoenix Park got the rolls back - this time they were after a state, not a scare."
 IRE_ira_arms_web:0 "The Arms Web"
 IRE_ira_arms_web_desc:0 "Dockers in Liverpool, false bottoms in lorries, ballast in fishing boats - an artery of rifles flows across the Irish Sea by night."
 IRE_ira_camps:0 "Camps and the Rolls"
 IRE_ira_camps_desc:0 "In the Wicklow valleys, ex-Free State soldiers teach young men to strip a rifle by touch. The muster roll fills page by page: teachers, dockers, postmen."
 IRE_ira_infiltrate:0 "Infiltration"
 IRE_ira_infiltrate_desc:0 "G2's cabinets hold our names; the army clubs hold our friends. Nobody knows whose side the sentry is on for his next shift."
 IRE_ira_coup:0 "Night of the Coup"
 IRE_ira_coup_desc:0 "There is no road back to the negotiating table. Four barracks, the GPO, the broadcasting house - all in the same night."
 IRE_ira_power:0 "Dublin Changes Flags"
 IRE_ira_power_desc:0 "The guns fall silent. No anthem on the radio now, only a staff officer's statement: the Provisional Republican Government assumes all power in Ireland."
 IRE_R_red_turn:0 "Connolly's Banner"
 IRE_R_red_turn_desc:0 "James Connolly was shot strapped to a chair in 1916 - his banner still lies at the bottom of the Army's trunk. Now the left-republicans unfold it again: this Republic belongs to the workers."
 IRE_R_connolly_column:0 "The Connolly Column"
 IRE_R_connolly_column_desc:0 "Three hundred and twenty men crossed the Pyrenees under Connolly's name for the International Brigades. Now the survivors bring Jarama's tactics to the lecture halls, and the Republic opens the door of the volunteer corps to everyone willing to fight for the revolution."
 IRE_R_republican_congress:0 "The Republican Congress"
 IRE_R_republican_congress_desc:0 "The Congress strangled by both parties and the Church in 1934 rises again - and this time the junta holds the door open. Reading classes light their lamps in every parish hall."
 IRE_R_split_1941:0 "The Great Split"
 IRE_R_split_1941_desc:0 "June 1941: the guns of Barbarossa tear the left in two. Is the Soviet Union ally or accomplice? The Dublin and Belfast branches give different answers."
 IRE_R_neutral_labor:0 "Labour Keeps Its Head Down"
 IRE_R_neutral_labor_desc:0 "The Dublin branch dissolves itself back into the workshops: doctrine can wait, the members' wages cannot. The home labour movement grows deeper roots."
 IRE_R_volunteer_line:0 "Anti-Fascist Enlistment"
 IRE_R_volunteer_line_desc:0 "The Belfast branch stands with the war: beat fascism first, settle everything else after. Irish names queue longer at the recruiting office."
 IRE_R_nationalize:0 "The Nationalisation Act"
 IRE_R_nationalize_desc:0 "Banks, docks, railways - the ledgers pass to workers' committees. Capital packs its bags by night, but the chimneys must still smoke."
 IRE_R_belfast_strike:0 "The Belfast General Strike"
 IRE_R_belfast_strike_desc:0 "In 1932 the Catholics of the Falls and the Protestants of the Shankill manned one picket line together. Now let that line cross Belfast again - until the border disappears."
 IRE_R_workers_republic:0 "The Workers' Republic"
 IRE_R_workers_republic_desc:0 "It was not Dublin that conquered the North - Belfast's workers took over themselves. Tricolour and red flag rise side by side: unity achieved in workers' hands."
 IRE_X_shadow_arsenal:0 "The Shadow Arsenal"
 IRE_X_shadow_arsenal_desc:0 "The junta folds every underground gun into the Shadow Arsenal: off the Ministry's books, in the Staff's pocket."
 IRE_X_christmas_raid:0 "The Christmas Raid"
 IRE_X_christmas_raid_desc:0 "23 December 1938: the sentry of the Magazine Fort in Phoenix Park is fooled by a choir rehearsal - by the time he recovers, over 100,000 rounds are on three lorries. The war against Britain begins."
 IRE_X_s_plan:0 "The S-Plan"
 IRE_X_s_plan_desc:0 "January 1939: an ultimatum of war reaches the Foreign Office. Coventry's explosion, Birmingham's gallows - the S-Plan makes Britain smell the war in its own streets."
 IRE_X_abwehr_guests:0 "Abwehr Guests"
 IRE_X_abwehr_guests_desc:0 "A U-boat touches the Galway coast at night. Pfals brings a radio; Görtz brings Berlin's promises. The borrower finally meets the knife."
 IRE_X_green_action:0 "Operation Green"
 IRE_X_green_action_desc:0 "No more begging in Berlin: the German staff has accepted Dublin's terms. Operation Green is no longer an arrow on paper - the two nations formally ally, and across the Irish Sea there is only one target: London."
 IRE_X_rising_gamble:0 "Easter Rising"
 IRE_X_rising_gamble_desc:0 "If no German sets foot ashore, gamble anyway: paralyse the North with Easter gunfire. Win, and it is a new Easter; lose, and the knife is handed to Britain."
 IRE_X_landing_assist:0 "The Landings"
 IRE_X_landing_assist_desc:0 "On a blackout coast, only our men know where the German barges must come in. After tonight, who owns Ulster depends on which way the muzzles point."
 IRE_X_black_end:0 "The Black Ireland"
 IRE_X_black_end_desc:0 "The border wall has fallen - but the bill is on its way: debts to Berlin, hatred in London, a debt on Dublin's conscience. A borrowed knife must be repaid with interest."
 # ================= Ideas =================
 IRE_military_govt:0 "Military Government"
 IRE_military_govt_desc:0 "The Staff has replaced the parliament. Curfew, courts-martial, censorship - order has returned; liberty stands aside."
 IRE_ira_training_camps:0 "Training Camps"
 IRE_ira_training_camps_desc:0 "The camps drill by night in the hills. Every name on the muster roll is half a soldier."
 IRE_church_hostility:0 "Church Hostility"
 IRE_church_hostility_desc:0 "The bishops have declared war on the workers' republic from their pulpits. Every Sunday, Mass is a political lesson."
 IRE_red_militia:0 "Workers' Militia"
 IRE_red_militia_desc:0 "Officers elected in the shops, companies drilling after hours - organisation is a weapon."
 IRE_intl_solidarity:0 "International Solidarity"
 IRE_intl_solidarity_desc:0 "From Jarama to Glasgow, banners and funds circulate between comrades."
 IRE_tricolour_red:0 "Tricolour and Red Flag"
 IRE_tricolour_red_desc:0 "Two colours rise side by side. For the first time the Republic belongs to Ireland and to the workers at once."
 IRE_ira_shadow:0 "Shadow Organisation"
 IRE_ira_shadow_desc:0 "Berlin's radios, secret coastal lanes, the Staff's own wires - the shadow is nimbler than the body."
 IRE_martyrs:0 "The Martyrs"
 IRE_martyrs_desc:0 "The scaffold has not silenced them. Every name is printed on leaflets, travelling further in death than in life."
 IRE_borrowed_knife:0 "The Borrowed Knife"
 IRE_borrowed_knife_desc:0 "The blade is out, but its direction is not the holder's to choose. Every year of victory, someone will ask about that night's bill."
 # ================= Decisions =================
 IRE_ira_logistics_cat:0 "Arms Logistics"
 IRE_X_ops_cat:0 "Transport Cells"
 IRE_R_org_cat:0 "Workers' Organisation"
 IRE_dock_pickup:0 "Dock Pickup"
 IRE_dock_pickup_desc:0 "The boats come in; ballast is swapped for crates."
 IRE_transport_cells:0 "Cell Transhipment"
 IRE_transport_cells_desc:0 "Break the arms into luggage and walk them across the border, one bag at a time."
 IRE_reading_classes:0 "Workers' Reading Class"
 IRE_reading_classes_desc:0 "One newspaper, one lamp, one volunteer teacher."
 # ================= Events (ire.68-87) =================
 ire.68.t:0 "Night of the Coup"
 ire.68.d:0 "Two in the morning: four barracks change hands almost together. The flag over the GPO comes down; the duty operator at the broadcasting house is politely lifted from his chair. Dublin's first sound before dawn is not birdsong but engines."
 ire.68.a:0 "Take everything. Leave nothing."
 ire.68.b:0 "Hold the ports and the radio first."
 ire.69.t:0 "The New Masters of Dublin"
 ire.69.d:0 "The last government troops withdraw into Kildare. A calm statement on the radio: the Provisional Republican Government assumes all power. The clerks report for work as usual - they have changed employers, nothing more."
 ire.69.a:0 "Long live the military government."
 ire.69.b:0 "Make peace with the old bureaucracy."
 ire.90.t:0 "Farewell to the Sabre"
 ire.90.d:0 "At the first full staff meeting two documents lie on the table: an operational plan for the North, and a petition from the unions. The argument runs to morning - the Army has always been both a force and a question. Now it is ours to answer."
 ire.90.a:0 "Point the sabre north."
 ire.90.b:0 "Hear the workers out first."
 ire.91.t:0 "The Christmas Raid"
 ire.91.d:0 "Phoenix Park, 23 December 1938. The sentry of the Magazine Fort hears the loudest 'explosion' of his life - a choir rehearsal. By the time he recovers, over 100,000 rounds are on three lorries. The war begins this night."
 ire.91.a:0 "Run the lorries out of the city tonight."
 ire.91.b:0 "Post the proclamation: this is war."
 ire.92.t:0 "The Fire in Coventry"
 ire.92.d:0 "Coventry, August 1939. A home-made bomb kills five in the market. London's papers give the front page to 'Irish terror'; somewhere in Westminster a folder hits the desk. The S-Plan wants exactly this."
 ire.92.a:0 "Own it as an act of war."
 ire.92.b:0 "Deny any connection."
 ire.93.t:0 "Warnings Within"
 ire.93.d:0 "Three senior staff officers submit a joint memorandum: 'We are wagering the survival of the Republic on an inventory list.' The moderates have shown their hand for the first time."
 ire.93.a:0 "Pull back. Let the heat die."
 ire.93.b:0 "Showdown: purge the moderates."
 ire.94.t:0 "A Funeral in the Atlantic"
 ire.94.d:0 "The watch officer of U-65 writes one line in the log: 'The Chief of Staff died this morning. Buried at sea.' Sean Russell never set foot on Irish soil again. As the canvas sinks into the Atlantic, the last line between Berlin and Dublin goes silent."
 ire.94.a:0 "Announce it to the nation."
 ire.94.b:0 "No comment."
 ire.95.t:0 "The Mutiny Crisis"
 ire.95.d:0 "The exposure has gone too far: London's intelligence holds our lists, and the moderates in the army have begun to sound each other out. The intelligence chief puts two plans on the table - dissolve the underground network, or strike first."
 ire.95.a:0 "Dissolve the network. Save the government."
 ire.95.b:0 "Strike first. Purge the army."
 ire.96.t:0 "An Uninvited Guest"
 ire.96.d:0 "A Tipperary farmer finds a German with a broken ankle on the field path, May 1940. Hermann Görtz of the Abwehr - the man of Operation Main - hid his parachute in the haystack. Not well enough."
 ire.96.a:0 "Take in the 'guest'."
 ire.96.b:0 "Send him back. Offend no one."
 ire.97.t:0 "Night of the Landings"
 ire.97.d:0 "On a blackout coast only our men know where the barges must come in. The telephone at Staff headquarters never stops ringing. Something has happened in the North."
 ire.97.a:0 "Ask the Germans to hand the North to us."
 ire.97.b:0 "Wait and watch."
 ire.98.t:0 "The Easter Rising"
 ire.98.d:0 "Easter Monday - the same day as 1916. The post office, the power stations, the police barracks: key points across the Six Counties are hit at once. And this time, the whole junta stands behind the risers."
 ire.98.a:0 "It worked - the North is paralysed!"
 ire.98.b:0 "It failed - cut the losses."
 ire.99.t:0 "The Borrower's Bill"
 ire.99.d:0 "The border wall has fallen. But the Berlin attaché's midnight letter brings not only congratulations but a 'memorandum of cooperation'; London's papers are full of 'the Republic of Traitors'. Victory tastes complicated - like a borrowed knife: the tighter you grip it, the colder your palm."
 ire.99.a:0 "Accept fate's bill."
 ire.99.b:0 "Burn every ledger with Berlin."
 ire.100.t:0 "Connolly's Banner"
 ire.100.d:0 "On the roof of the junta's headquarters someone has hoisted a flag nobody ordered: beside the tricolour, a red one. The Church's papers thunder overnight; the union halls applaud."
 ire.100.a:0 "Let the banner rise."
 ire.100.b:0 "Radicalism can wait. Steady the army first."
 ire.101.t:0 "Farewell, Jarama"
 ire.101.d:0 "Among the dead at Jarama is Kit Conway - first of the Irish column to fall. Frank Ryan is taken prisoner and vanishes into a camp. Three hundred and twenty went; less than half return. New graffiti appears on Dublin walls: 'They fought for everyone.'"
 ire.101.a:0 "Mourn the dead."
 ire.101.b:0 "Bring the column's experience home."
 ire.102.t:0 "Cross and Red Flag"
 ire.102.d:0 "The 1937 constitution draft is barely inked when the archdiocese's protest letters pile up in the secretariat: 'A republic hostile to the Church cannot speak for Ireland.' The rallies outside the cathedrals grow by the day."
 ire.102.a:0 "Bow before the constitution."
 ire.102.b:0 "The Church must obey the state."
 ire.103.t:0 "The Lesson of 1935"
 ire.103.d:0 "The picket line erupts: old wounds between the Falls and the Shankill are torn open by a few thrown stones. That is exactly how the 1935 transport strike died. History asks us the same question again."
 ire.103.a:0 "Organise cross-sectarian defence committees."
 ire.103.b:0 "Pull back. Let it blow over."
 ire.104.t:0 "Flight of Capital"
 ire.104.d:0 "The ink on the Nationalisation Act is barely dry and the harbour is full of outbound steamers. Bankers' safes, factory owners' ledgers, the exchange hotlines - capital has voted with its feet."
 ire.104.a:0 "Impose exchange controls."
 ire.104.b:0 "Let them go."
 ire.105.t:0 "The Belfast Strike"
 ire.105.d:0 "The signal comes from Belfast: the shipyard sirens are sounding. The Falls and the Shankill flow into the same square - last side by side in the 1932 relief strike."
 ire.105.a:0 "Escalate! General strike!"
 ire.105.b:0 "Bank the gains. Grind it out slowly."
 ire.106.t:0 "The Committee Takes Over"
 ire.106.d:0 "The flag over Belfast City Hall has changed. A workers' delegate committee assumes all administrative power in the North and 'asks the comrades in Dublin to welcome the workers of the North home'. The war cabinet in London reads the cable in long silence."
 ire.106.a:0 "History sides with the workers."
 ire.106.b:0 "Consolidate carefully, step by step."
 ire.107.t:0 "The Ghost of Dresden"
 ire.107.d:0 "Frank Ryan - Jarama prisoner, later the complicated man in Berlin - has died in Dresden. The arguments about him are bigger than his grave: idealist? Traitor? Just a man crushed by the war?"
 ire.107.a:0 "Mourn him, all of us."
 ire.107.b:0 "Carry his cause on."

 # ================= Red/Black Bold Pass (v2.3.1) =================
 IRE_X_crown_westminster:0 "The Tricolour over Downing Street"
 IRE_X_crown_westminster_desc:0 "London's line has broken. Raise the tricolour over Number Ten - from Dublin to London, a nation that redraws the map is born."
 IRE_connolly_veterans:0 "Connolly Column Veterans"
 IRE_connolly_veterans_desc:0 "The men who came back alive from Jarama became the instructors: they know how modern wars are fought."
 IRE_revolution_treasury:0 "The Revolutionary Treasury"
 IRE_revolution_treasury_desc:0 "Spanish Republican gold changed flags in the Bay of Biscay. The coffers are full, and for once the revolution's purse is heavier than the enemy's."
 ire.108.t:0 "The Vault of Biscay"
 ire.108.d:0 "A Galway fishing boat brings staggering news: a freighter under Republican colours is sheltering in the bay, her hold full of oil-clothed crates - gold bars. Spain's war has reached our coast, and where the money goes is ours to decide."
 ire.108.a:0 "Seize it. The revolution borrows from no one."
 ire.108.b:0 "Escort the convoy to Moscow: comrades' credit outweighs gold."
 ire.109.t:0 "The Tricolour over Downing Street"
 ire.109.d:0 "London has surrendered. The Guards lay down their arms; Westminster's bells sound weary in the fog. Staff officers climb to the roof of Number Ten and nail the tricolour to the flagpole - for the first time in seven hundred years, Ireland looks down on England."
 ire.109.a:0 "This is not revenge. It is history."
 ire.109.b:0 "Let the whole world see this day."

