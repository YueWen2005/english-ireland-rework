 IRE_R_econ_cat:0 "Red Path: Industry & Economy"
 IRE_R_econ_banks:0 "Nationalise the Banks"
 IRE_R_econ_banks_desc:0 "Place Dublin's financial capital into the hands of the people to fund industrialisation. Afterwards, decide the fate of the old bankers."
 IRE_tt_R_econ_banks:0 "Gain 1 civilian factory, triggers the event 'Bank Nationalisation Crisis'"
 IRE_R_econ_arms:0 "War Economy Mobilisation"
 IRE_R_econ_arms_desc:0 "Turn the entire state machinery towards arms production, with workers on triple shifts supporting the front."
 IRE_tt_R_econ_arms:0 "Gain 1 civilian factory; factory output +10% for 360 days"
 IRE_R_econ_farms:0 "Agricultural Collectivisation"
 IRE_R_econ_farms_desc:0 "Cooperatives replace scattered smallholdings; grain is pooled and surplus labour flows into the factories."
 IRE_tt_R_econ_farms:0 "-6% consumer goods for 720 days, gain 5,000 manpower"
 IRE_R_econ_infra:0 "Infrastructure Drive"
 IRE_R_econ_infra_desc:0 "Railways, roads and ports: let the wheels of revolution run faster."
 IRE_tt_R_econ_infra:0 "Infrastructure +1 in a random owned controlled state"
 IRE_R_war_economy:0 "War Economy Mobilisation"
 IRE_R_war_economy_desc:0 "Factory output +10%"
 IRE_R_collective_farms:0 "Agricultural Collectivisation"
 IRE_R_collective_farms_desc:0 "-6% consumer goods"
 ire.122.t:0 "Bank Nationalisation Crisis"
 ire.122.d:0 "Troops and workers' patrols surround the great banks of Dublin. The old bankers demand 'fair compensation' while radicals cry for confiscation without payment. Dublin weighs two voices: smash the chains of the old finance, or buy a smooth transition?"
 ire.122.a:0 "Confiscate without payment!"
 ire.122.b:0 "Buy them out"
 POLITICS_IRE_POLLITT_DESC:0 "Harry Pollitt (1890-1960), General Secretary of the Communist Party of Great Britain. The red isles now share a single helmsman."
 POLITICS_IRE_MOSLEY_DESC:0 "Oswald Mosley (1896-1980), baronet of the British Union of Fascists. Beneath crown and harp, the empire has a new master."

# ---- v2.14.0 Opening mechanics briefing events (ire.130-136) ----
IRE_mech_t1:0 "A Manual for the Emerald Isle"
IRE_mech_p1:0 "Hello, Taoiseach.\n\nThis mod has several hidden counters that never show on the interface directly - you only see them change through focus, event and decision tooltips.\n\nThe next few pages briefly explain what each value is, how it grows, and what it does.\n\nYou may skip at any time; the full manual is also available in the mod folder under docs.\n\nThis briefing only appears once, at the start of the game."
IRE_mech_t2:0 "Red Unity"
IRE_mech_p2:0 "Red Unity (0-100 | enabled after completing The Red Turn)\n\nThe internal solidarity of Red Ireland. It grants no bonus by itself - it gates key steps of the red path.\n\n- Above 50: unlocks the focus Belfast Strike\n- Between 40-70: 15% monthly chance of a one-time Sectarian Crisis event\n- Completing The Neutral Labour Movement raises the cap to 110\n\nMain sources: The Red Turn +10, The Connolly Column +10, Republican Congress +15, the Workers' Reading Classes decision +5 each (50 pp, repeatable); compromising with the church costs -10.\n\nTip: lost unity can only be regained slowly via reading classes - hitting the gates late-game will hurt."
IRE_mech_t3:0 "Exposure"
IRE_mech_p3:0 "Exposure (0-100 | enabled on the IRA Military Committee civil-war path)\n\nHow closely British intelligence is watching the IRA's underground activity.\n\n- Fixed +5 every month while on the black path\n- Arms smuggling, black-market factories, tech theft decisions: +3 to +5 each\n- Some cautious options cool things down a lot (up to -30)\n\n- Above 50: British intelligence warning event\n- Above 90: The Purge crisis - mishandling it sparks a civil war\n\nOne-line strategy: the black path is a race against British intelligence. Gear and factories come bundled with exposure - cool off before the showdown."
IRE_mech_t4:0 "The Plebiscite Ledger"
IRE_mech_p4:0 "Plebiscite Support (0-100 | Border Plebiscite path)\nDecides the outcome: 90+ Britain hands over the six counties peacefully; 70-89 handover but with sanctions; below 70 the plebiscite fails.\n\nNationalist Support (0-100 | plebiscite path)\nAt 80+ the plebiscite is guaranteed to pass, and some event options change accordingly."
IRE_mech_t5:0 "Overseas and Neutral"
IRE_mech_p5:0 "Diaspora Network (0-100 | Path A overseas route)\nFive tiers at 20 / 40 / 60 / 80 / 100, each unlocking a Transatlantic Network spirit.\n\nNeutral Credibility (0-100 | neutrality route)\nShapes neutral-related events and diplomatic options."
IRE_mech_t6:0 "Decision Counters"
IRE_mech_p6:0 "Decision Counters\nEscort runs, ferry crossings, war bonds, the German mission, American volunteers, Canadian development, radio offensives, strike waves...\n\nThese small counters only unlock later stages and content. Just play the decisions normally - no need to micromanage them."
IRE_mech_t7:0 "Rules of the Game"
IRE_mech_p7:0 "Annexation and Colonies\n- Annexing Britain: its core territory automatically becomes Irish core, and all British commanders join your army\n- Upon MILITARY annexation, African colonies become real independent nations - British ones (Egypt, Sudan, Kenya, Nigeria...), French ones (Algeria, Tunisia, Morocco...) when France falls; if Britain already turned socialist and merges peacefully, its colonies remain with the union\n- The liberation chain grants at most one wargoal per country\n\nLiberation Chain (red path, World Revolution branch)\nAll 15 liberation focuses open in parallel once the union is formed (arranged in rows: 8 European / 4 Afro-Asian / 3 American) and may be pursued in any order. If every target country of a focus has already completed the socialist revolution (or no longer exists), that focus is automatically bypassed.\n\nGood luck. Éire go brách!"
IRE_mech_opt_next:0 "Next page"
IRE_mech_opt_skip:0 "Skip (do not show again)"
IRE_mech_opt_done:0 "Got it"
IRE_R_lib_judge_tt:0 "§YLiberation or Invasion Check§! (Red Line liberation tree only): when ALL target countries of this focus have completed the socialist revolution (communist government) or no longer exist, this focus is automatically bypassed and counts as completed; focuses proceed normally (granting annexation war goals) only against targets where the old order remains. The Black Line's invasion war goals are not restricted by this."
 # ---- Berlin-Dublin Axis (black-line co-op) events & ideas ----
 ire_ger_coop.1.t:0 "The Hidden Hand of Dublin"
 ire_ger_coop.1.d:0 "The new regime in Ireland has reached out to us. Their shadow arsenal hides beneath barns and cottages, and it is hungry for instructors and blueprints. The Abwehr believes this is the first step toward turning the eastern Atlantic into a forward outpost of the Reich."
 ire_ger_coop.1.a:0 "Dispatch advisors (Ireland gains experience and German arms; we gain intel and army experience bonuses)"
 ire_ger_coop.1.b:0 "The Irish adventure is not our concern"
 ire_ger_coop.2.t:0 "Guests from Ireland"
 ire_ger_coop.2.d:0 "A handful of visitors with Gaelic accents have arrived in Berlin. They claim to be here to observe — but the Abwehr knows exactly what this is: Dublin trading spies for technology. Training them, our cipher bureau might learn a thing or two from their combat experience."
 ire_ger_coop.2.a:0 "Train them thoroughly (Ireland gains an operative slot; we gain a decryption bonus)"
 ire_ger_coop.2.b:0 "Send them home"
 ire_ger_coop.3.t:0 "Arms Export Order"
 ire_ger_coop.3.d:0 "A tempting order has arrived from Dublin: full division-scale procurement of German standard small arms. The Army command guarantees the export proceeds will keep three arms factories running at full capacity."
 ire_ger_coop.3.a:0 "Take the order (Ireland gains German equipment; we gain a military production bonus)"
 ire_ger_coop.3.b:0 "Decline the business"
 IRE_G_dark_hand:0 "The Hidden Hand of Dublin"
 IRE_G_dark_hand_desc:0 "The underground keeps a contact in every port of the British Isles, with seamen and dockers carrying the traffic. Reports are collected by a special section in Dublin and sent weekly to the general staff. Handovers are given by word of mouth, and no written record is kept."
 IRE_G_guest_training:0 "Irish Guests"
 IRE_G_guest_training_desc:0 "Instructors returned from operations enter our training system, lecturing on demolition, surveillance and radio work. The intelligence branch sets the courses, and graduates are posted to active sections. Subjects and examination results are reported to the intelligence branch by course."
 IRE_G_export_order:0 "Arms Export Order"
 IRE_G_export_order_desc:0 "Division-scale orders from Dublin are allotted to three ordnance factories, whose lines run in continuous shifts. The ordnance branch posts inspectors to the plants, and delivery dates are written into the contracts. Payment is settled by consignment, the balance carried into the defence estimates."
 IRE_coop_operative_slot:0 "Agents Returned from Berlin"
 IRE_coop_operative_slot_desc:0 "The first Irish operatives have completed the Abwehr course and are posted to the stations. Their rolls and cover identities are held by G2, the cost is carried on a secret estimate, and their records are reported quarterly, with the unfit recalled."
 # ---- Berlin-Dublin Axis, batch 2 ----
 ire_ger_coop.4.t:0 "The Fuel Depot of the Atlantic"
 ire_ger_coop.4.d:0 "Dublin proposes handing their Atlantic ports over to our U-boat fleet. The location is superb — operating from here, every convoy west of the Bay of Biscay would sail straight into the wolves' hunting grounds. Naval command believes this would fundamentally change the efficiency of the Battle of the Atlantic."
 ire_ger_coop.4.a:0 "Accept the port agreement (Ireland gains dockyard output and naval experience; we gain a raiding bonus)"
 ire_ger_coop.4.b:0 "Irish ports will not help us"
 ire_ger_coop.5.t:0 "Operation Green Shore"
 ire_ger_coop.5.d:0 "Dublin's staff officers have completed a feasibility study for the invasion of Britain and offer to share it in full. Their operatives know every stretch of coastline on the British Isles — precisely what Sea Lion lacks."
 ire_ger_coop.5.a:0 "Share the invasion plans (Ireland gains invasion and planning bonuses; we gain a planning speed bonus)"
 ire_ger_coop.5.b:0 "Dublin's war-gaming ends here"
 ire_ger_coop.6.t:0 "The Berlin-Dublin Treaty"
 ire_ger_coop.6.d:0 "Dublin formally requests a full alliance with the German Reich. An ally guarding Britain's western gateway, an army familiar with British shores, an unsinkable Atlantic outpost — the Reich needs this partner, and Dublin needs the Reich's umbrella."
 ire_ger_coop.6.a:0 "Sign the treaty (Ireland joins our faction; both gain permanent alliance bonuses)"
 ire_ger_coop.6.b:0 "The Irish must first learn to fight alone"
 ire_ger_coop.7.t:0 "The March into the Rhineland"
 ire_ger_coop.7.d:0 "German troops have marched into the demilitarized Rhineland. Dublin's new regime watches every move of its future ally with keen interest — Berlin's resolve is worth studying."
 ire_ger_coop.7.a:0 "Study the German approach"
 ire_ger_coop.8.t:0 "The German Four Year Plan"
 ire_ger_coop.8.d:0 "Berlin has announced an ambitious Four Year Plan. Dublin's economic advisors are poring over the document overnight — a market gearing up for rearmament is opening its doors to Ireland."
 ire_ger_coop.8.a:0 "Follow the German economic model"
 ire_ger_coop.9.t:0 "The Anschluss"
 ire_ger_coop.9.d:0 "The Wehrmacht has crossed the Austrian border with barely a shot fired. Dublin's officers see a textbook operation — and German arms factories are opening their doors to future allies."
 ire_ger_coop.9.a:0 "Send a military delegation"
 ire_ger_coop.10.t:0 "The Ink of Munich"
 ire_ger_coop.10.d:0 "With a single agreement, the Sudetenland has changed hands. Dublin's intelligence service notes that Berlin's diplomacy is every bit as sharp as its arsenal. Our friends in the Abwehr are willing to share the lessons."
 ire_ger_coop.10.a:0 "Deepen intelligence cooperation"
 ire_ger_coop.11.t:0 "War Clouds over Danzig"
 ire_ger_coop.11.d:0 "Berlin has issued an ultimatum to Warsaw. War is imminent — and Dublin knows that Ireland's hour is approaching. The nation stands on alert."
 ire_ger_coop.11.a:0 "Prepare for war"
 ire_ger_coop.12.t:0 "The Berlin-Dublin Axis (Co-op Recommended)"
 ire_ger_coop.12.d:0 "The Black path (Armed Struggle) supports two-player co-op: invite a friend to play Germany on the historical focus path while you take Ireland's Black path to trigger the Berlin-Dublin Axis.\n\nHow it works:\n· When Ireland completes Black-path focuses such as the Shadow Arsenal, the Abwehr's Guests, German Small Arms, the U-boat Pen, the invasion planning and the Berlin Partner finale, the German player receives co-op events and may choose to cooperate or decline — cooperation grants bonuses to both sides;\n· Each time Germany completes a historical milestone (Rhineland, Four Year Plan, Anschluss, Sudetenland, Danzig), Ireland also receives a corresponding support event;\n· The co-op only activates while Germany is player-controlled on the historical path (fascist, having NOT taken Oppose Hitler);\n· On the German side the chain sits in the middle of the air-force section - tell your German friend: find Aeronautical Research Institute and use the column directly beneath it, six links in all, with four industry focuses branching down-left from the arms corridor.\n\nSingle player: when Germany is AI-controlled, co-op resolves automatically as 'cooperate' — the single-player Black path is unaffected. Good luck in the war to come!"
 ire_ger_coop.12.a:0 "Dublin and Berlin, one line drawn"
 IRE_coop_atlantic_port:0 "Atlantic Outpost"
 IRE_coop_atlantic_port_desc:0 "German submarines are replenishing at our Atlantic ports. The docks work day and night, coal, oil and torpedoes are issued by the supply branch of the Naval Service, the returns are kept in a separate book, and no hour of arrival is published."
 IRE_G_wolf_pack:0 "Fuel Depot of the Wolfpacks"
 IRE_G_wolf_pack_desc:0 "The Atlantic ports are opened to the submarine service, with fuel, torpedoes and dockyard space provided under agreement. The naval operations staff fixes sailing and return times, and harbour records are sealed separately. Port military police guard the perimeter, and crews are not permitted ashore."
 IRE_coop_green_shore:0 "Operation Green Shore"
 IRE_coop_green_shore_desc:0 "The plan for landing in Britain, shared with the German staff, is ready. The staffs work from one chart, a joint section fixes the allotment of shipping, tides and beaches, and copies of the plan are held in two places."
 IRE_G_sealion_prep:0 "Pieces of Sea Lion"
 IRE_G_sealion_prep_desc:0 "Operatives have surveyed the coasts of the British Isles, and the tides, beaches and rail junctions are compiled into a volume. The staff revises its landing plans on that basis, and the services work to a single timetable. The volumes are held at three places by classification, and consultation is entered in a register."
 IRE_T_treaty_ally:0 "Berlin-Dublin Treaty"
 IRE_T_treaty_ally_desc:0 "The treaty of alliance with the German Reich has been ratified by both parties. A German liaison group is stationed in Dublin, supplies and raw materials are exchanged under the agreement, and joint exercises are held each year."
 IRE_G_dublin_treaty:0 "Dublin Covenant"
 IRE_G_dublin_treaty_desc:0 "The treaty makes Ireland the Reich's outpost on the eastern Atlantic, and Germany posts a permanent military representative. Port rights, arms supply and intelligence exchange are separate articles, filed with both foreign ministries."
 IRE_GM_mil:0 "Lessons of the Reich"
 IRE_GM_mil_desc:0 "The march into the Rhineland showed Berlin's resolve, and the Irish officer corps has revised its training syllabus accordingly. Officers are sent to observe German exercises, and their reports serve as instruction at the staff college."
 IRE_GM_ind:0 "Four Year Plan Orders"
 IRE_GM_ind_desc:0 "Orders arising from German rearmament are passing to Irish firms, and the Department of Industry and Commerce registers the contracts. The Industrial Development Authority assists with plant extension, delivery returns are made monthly, and raw material is allocated by the Department of Supplies."
 IRE_GM_recruit:0 "The Anschluss Example"
 IRE_GM_recruit_desc:0 "The Irish officer corps is studying German operational doctrine and mobilisation methods. The Department of Defence has amended the recruiting regulations on that basis, the county offices register men of military age on the new forms, and the medical standard is adjusted with them."
 IRE_GM_intel:0 "The Art of Munich"
 IRE_GM_intel_desc:0 "The Abwehr has given G2 the benefit of its experience in negotiation and intelligence work, and the two meet alternately in Berlin and Dublin. The procedure for exchanging intelligence is drafted jointly by the Department of External Affairs and the Department of Defence."
 IRE_GM_mobil:0 "War Clouds over Danzig"
 IRE_GM_mobil_desc:0 "With the European situation pressing, the Council of Defence has ordered the forces to stand to. Commands concentrate on the mobilisation tables, military police take over the ports and airfields, the railways give priority to military traffic, and civil defence counts its stores."
 IRE_G_ger_dublin_axis:0 "Berlin-Dublin Axis"
 # ---- Berlin-Dublin Axis, batch 3: German co-op focuses (rightmost column) ----
 GER_IRE_shadow_link:0 "Dublin's Shadow Network"
 GER_IRE_shadow_link_desc:0 "The Irish underground is willing to share its eyes on the British Isles with the Abwehr, each side taking defined areas and exchanging material in a common format. Liaison officers are stationed in Dublin and Berlin."
 GER_IRE_abwehr_academy:0 "Expand Operative Training"
 GER_IRE_abwehr_academy_desc:0 "A further class of Irish operatives is due in Berlin. The cipher academy is enlarging its intake, quarters and lecture rooms are allotted separately, and instructors are drawn from the services. Their field experience is to be folded into our decryption department."
 GER_IRE_arms_corridor:0 "Normalize the Arms Corridor"
 GER_IRE_arms_corridor_desc:0 "Orders from Dublin continue without pause. The arms corridor is to be made permanent, so that the arsenals of both countries work to one order book. A joint commission handles delivery and inspection, and payment is settled quarterly."
 GER_IRE_atlantic_gateway:0 "Atlantic Gateway Agreement"
 GER_IRE_atlantic_gateway_desc:0 "Ireland's Atlantic ports are opened to the U-boat fleet; berths, fuel and repairs are arranged by the naval supply office, sailing routes and rendezvous are notified separately, and reports pass through the attache in Dublin."
 GER_IRE_green_shore_joint:0 "Joint Green Shore Staff"
 GER_IRE_green_shore_joint_desc:0 "Irish and German staff officers sit at one map, working through the channels, beaches and follow-on supply of a landing in Britain. Each side keeps a copy and the revisions are exchanged quarterly."
 GER_IRE_dublin_pact:0 "Consolidate the Dublin Treaty"
 GER_IRE_dublin_pact_desc:0 "The treaty is more than a signed page. Berlin and Dublin are deepening their political, economic and military ties through a standing committee that meets at fixed intervals, and the Axis rests on Dublin as its second pillar."
 GER_IRE_ind_mission:0 "Industrial Mission to Dublin"
 GER_IRE_ind_mission_desc:0 "A German industrial commission takes the mail boat to Dun Laoghaire and works through the Free State's factories, mills and power stations with the Department of Industry and Commerce. What Ireland lacks in plant it makes up in cheap labour and untapped rivers, and German firms are invited to name their terms first."
 GER_IRE_ind_shannon:0 "Electrify the Shannon"
 GER_IRE_ind_shannon_desc:0 "The Shannon scheme at Ardnacrusha was built by German engineers and it still runs on German drawings. A second generating set is ordered, the grid is extended west, and the surplus is contracted to German industry at a fixed price for twenty years."
 GER_IRE_ind_peat:0 "Peat for the Reich"
 GER_IRE_ind_peat_desc:0 "The bogs cover a sixth of the island and have never been worked at scale. German dredgers and briquetting presses are shipped over, and the turf is dried, pressed and burned in place of imported coal. Machinery comes from the Ruhr; the cut peat goes into Irish furnaces."
 GER_IRE_ind_barter:0 "Clearance Barter Agreement"
 GER_IRE_ind_barter_desc:0 "No gold changes hands. Irish cattle, butter and hides are booked against German machinery, dynamos and rolling stock, and the clearing account is settled at the Reichsbank each quarter. Both sides get what they cannot buy elsewhere, and neither spends a mark of hard currency."
 IRE_G_dublin_link_intel:0 "Dublin Link: Intelligence"
 IRE_G_dublin_link_intel_desc:0 "The Irish underground and the Abwehr are grouped together, each side posting liaison officers and exchanging material in a common format. Authority to approve operations remains in Dublin and Berlin. A joint meeting is held monthly, and the minutes are signed by both sides."
 IRE_G_dublin_link_cipher:0 "Dublin Link: Ciphers"
 IRE_G_dublin_link_cipher_desc:0 "The cipher academy receives operational material from the Irish side and revises its decryption procedures accordingly. Texts and keys are held by the academic office, and results are reported monthly. Product is marked by source and may not be passed to a third party."
 IRE_G_dublin_link_arms:0 "Dublin Link: Arms"
 IRE_G_dublin_link_arms_desc:0 "Arms exports to Ireland become a standing programme, and the factories schedule by quarter. Ordnance inspectors pass the goods at the works, and shipping manifests are filed with customs and the foreign ministry. Carriage falls to merchant ships, with escort and unloading times arranged separately."
 IRE_G_dublin_link_navy:0 "Dublin Link: Atlantic"
 IRE_G_dublin_link_navy_desc:0 "The Atlantic Gateway agreement opens the ports and dockyards, and submarines may enter for supply at any hour. The naval staff adjusts the patrol areas accordingly, and the harbour authority keeps the supply records. Entry and departure are reported to the harbour authority and the naval staff alike."
 IRE_G_dublin_link_plan:0 "Dublin Link: Staff"
 IRE_G_dublin_link_plan_desc:0 "The two general staffs complete joint war-games, and the landing sequence, fire plan and supply echelons are set out in one document. The services revise their manuals on that basis, with copies sent to both capitals. The conclusions serve as the basis for the annual exercise programme."
 IRE_G_dublin_link_pact:0 "Dublin Link: Politics"
 IRE_G_dublin_link_pact_desc:0 "The Axis treaty is ratified by the Dail and the exchange of notes completed by the foreign ministry. The legation in Berlin is raised in status, and political consultations are held under its articles. Its term and the procedure for renewal are set out in the annexed articles."
 IRE_G_link_industry:0 "Dublin Link: Industry"
 IRE_G_link_industry_desc:0 "The commission's survey is on the desk of every ministry that matters. Sites are marked, licences are pre-cleared and German firms hold the first option on every contract. Building begins before the paperwork is finished."
 IRE_G_link_shannon:0 "Dublin Link: Shannon Power"
 IRE_G_link_shannon_desc:0 "The second Shannon set comes on line and the western grid is tied into it. German works draw on the surplus at a fixed price, and the load is scheduled from Berlin as much as from Dublin."
 IRE_G_link_peat:0 "Dublin Link: Peat Works"
 IRE_G_link_peat_desc:0 "German dredgers cut the bog and German presses briquette the turf, and the works run to German tolerances. Irish fuel frees German coal for the mills, and the machines are serviced from the Ruhr on a standing contract."
 IRE_G_link_barter:0 "Dublin Link: Clearing"
 IRE_G_link_barter_desc:0 "Cattle and butter move east, machinery moves west, and the clearing account balances without a single unit of hard currency. The arrangement is invisible in the budget and very visible in the warehouses."
 # ---- v2.19.5: German-side co-op intro + unlock condition tooltips ----
 ire_ger_coop.13.t:0 "The Berlin-Dublin Axis (Co-op Recommended)"
 ire_ger_coop.13.d:0 "If a player in this session takes Ireland and walks the Black path (Armed Struggle), you automatically enter the Berlin-Dublin Axis co-op:\n· Each time Ireland completes a key Black-path focus (The Shadow Arsenal, Abwehr Guests, German Technical Mission, U-boat Supply Dock, The Sealion Flank, Western Bastion of the New Order), you receive a co-op event - cooperate and both nations gain bonuses; decline and they only get minor compensation;\n· Each time you complete a historical milestone (Rhineland, Four Year Plan, Anschluss, Sudetenland, Danzig), Ireland also receives a corresponding support event;\n· The co-op requires the historical path: Hitler in power, NOT taking Oppose Hitler, and not at war with Ireland;\n· Every successful cooperation unlocks the Berlin-Dublin Axis chain in our focus tree. Where: middle of the air-force section — find Aeronautical Research Institute and take the column directly beneath it (top to bottom: Dublin's Shadow Network, Expand Operative Training, Normalize the Arms Corridor, Atlantic Gateway Agreement, Joint Green Shore Staff, Consolidate the Dublin Treaty). Normalize the Arms Corridor also branches down-left into four industry focuses: Industrial Mission to Dublin, then Electrify the Shannon / Peat for the Reich, merging into Clearance Barter Agreement;\n\nCo-op events fire even when Ireland is AI-controlled."
 ire_ger_coop.13.a:0 "Berlin and Dublin, one line drawn"
 GER_IRE_coop_1_tt:0 "Ireland completed the Shadow Arsenal and Germany accepted the co-op event"
 GER_IRE_coop_2_tt:0 "Ireland completed the Abwehr Guests and Germany accepted the co-op event"
 GER_IRE_coop_3_tt:0 "Ireland completed the German Technical Mission and Germany accepted the co-op event"
 GER_IRE_coop_4_tt:0 "Ireland completed the U-boat Supply Dock and Germany accepted the co-op event"
 GER_IRE_coop_5_tt:0 "Ireland completed the Sealion Flank and Germany accepted the co-op event"
 GER_IRE_coop_6_tt:0 "Ireland completed the Western Bastion of the New Order and Germany accepted the co-op event"
