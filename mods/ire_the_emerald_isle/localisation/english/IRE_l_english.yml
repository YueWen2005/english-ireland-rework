 IRE_X_ind_cottage_eff:0 "Dispersed Inefficiency"
 IRE_X_ind_cottage_eff_desc:0 "Dispersal means inefficiency. Factory output -5%."
 IRE_X_ind_hidden_cove_eff:0 "Hidden Yard"
 IRE_X_ind_hidden_cove_eff_desc:0 "Dockyard output +10%."
 IRE_X_ind_smuggle_eff:0 "Smugglers' Web"
 IRE_X_ind_smuggle_eff_desc:0 "Supply consumption -15%, out-of-supply penalty -25%, fuel capacity +20%, army speed +5%."
 IRE_X_ind_german_eff:0 "German Equipment"
 IRE_X_ind_german_eff_desc:0 "Factory output +10%."
 IRE_X_ind_s_loot_eff:0 "Captured Production Lines"
 IRE_X_ind_s_loot_eff_desc:0 "Factory output +8%."
 IRE_eng_s_plan_damage:0 "S-Plan Sabotage"
 IRE_eng_s_plan_damage_desc:0 "Irish and German sabotage erodes British industry. Factory output -8%."
