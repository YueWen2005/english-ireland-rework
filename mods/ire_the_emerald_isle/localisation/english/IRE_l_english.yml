l_english:
 IRE_communism:0 "Socialist Republic of Ireland"
 IRE_communism_ADJ:0 "Irish"
 IRE_fascism:0 "Provisional Government of the IRA"
 IRE_fascism_ADJ:0 "Irish Republican"
 IRE_treatys_scar:0 "Treaty Scar"
 IRE_treatys_scar_desc:0 "The breach left by the treaty of 1921 has not closed: the Free State is independent in name, while its ports, tariffs and northern affairs remain bound to London. The Dail debates the matter each year and the motions are time and again laid aside."
 IRE_diaspora:0 "The Diaspora"
 IRE_diaspora_desc:0 "After the famine of 1845 millions of Irish crossed the ocean and settled at the ports of the Americas; their descendants, scattered through town and country, still send money home each month. The emigrant division keeps a register at every consulate for those who wish to be listed."
 IRE_agrarian_poverty:0 "Agrarian Poverty"
 IRE_agrarian_poverty_desc:0 "Beyond grass and potatoes the country can make almost nothing. Factories are few, machinery and parts are imported, and the industrial account runs against us. Industry and Commerce can only keep the existing workshops going."
 IRE_civil_war_embers:0 "Embers of Civil War"
 IRE_civil_war_embers_desc:0 "The fratricide of 1922 is over, but the wounds the guns left are still festering in the countryside. Veterans' associations still march, banned funerals still file through the villages, and the men who refused the oath still refuse it. Every concession Dublin makes buys a parade in some county."
 IRE_free_framework:0 "Framework of Freedom"
 IRE_free_framework_desc:0 "The institutions set up by the Anglo-Irish Treaty are put into service first: Governor-General, Executive Council and the two houses take their places, the clauses on customs and defence are carried out item by item, and the law officers' readings go to every department. The establishment tables of the departments are published with them."
 IRE_north_unintegrated:0 "Northern Ireland Unintegrated"
 IRE_north_unintegrated_desc:0 "The question of the six counties remains open. Belfast keeps its own factories, customs and local councils; Dublin's writ stops at the line, and papers pass between the two administrations. Each side still collects its own customs."
 IRE_sectarian_rift:0 "Sectarian Rift"
 IRE_sectarian_rift_desc:0 "Sectarian division is pressed down by main force: meetings require a permit and newspapers are submitted before issue. The division goes underground, word passing by mouth, the constabulary posted by district and the border posts reinforced."
 IRE_rural_electrification:0 "Rural Electrification"
 IRE_rural_electrification_desc:0 "Poles are raised along the country roads and the Board's parties string the lines village by village. Farmsteads are connected, the cost is met from the local rates, and progress is published by county."
 IRE_anglo_irish_beef:0 "Anglo-Irish Beef Trade"
 IRE_anglo_irish_beef_desc:0 "Britain's meat supply depends on Irish cattle and the refrigerated trade, and the board of trade buys under long-term contract. Quotas and prices are settled yearly by a joint committee, and export licences are entered in a separate register."
 IRE_republican_constitution:0 "Republican Constitution"
 IRE_republican_constitution_desc:0 "The constitution of 1937 established the office of President, and the state became a republic in law. The text was approved by plebiscite, the President is directly elected, and the Taoiseach remains answerable to the Dail."
 IRE_free_country:0 "A Free Country"
 IRE_free_country_desc:0 "On 18 April 1949 Ireland leaves the Commonwealth, and the style of the Republic is adopted in diplomatic papers and passports alike. The legations exchange their credentials that day, and the old Commonwealth agreements are repealed by schedule."
 IRE_atlantic_bloodline:0 "Blood Across the Atlantic"
 IRE_atlantic_bloodline_desc:0 "From Cork to Boston the same green flag is raised in a great many ports. Emigrant societies assist with subscriptions and shipping, and a diaspora office in Dublin handles the correspondence. Letters and subscription ledgers are kept on file."
 IRE_green_flag_post:0 "Green Flag Outpost"
 IRE_green_flag_post_desc:0 "Emigrant societies have opened contact offices in the cities of the Americas to register volunteers and subscriptions. The consular branch of the Department of External Affairs issues certificates, and rolls and accounts are returned to Dublin quarterly for review."
 IRE_diaspora_fund:0 "Diaspora Fund"
 IRE_diaspora_fund_desc:0 "Dublin's accounts receive remittances from abroad every month, the totals revised upward each quarter. The exchange division of the Treasury enters them and divides them among relief, education and local works."
 IRE_saint_patrick_name:0 "In the Name of Saint Patrick"
 IRE_saint_patrick_name_desc:0 "The name itself is a summons, and those who fight under it are not all Irish. The Church has consented to the blessing of colours in the name of Saint Patrick, offices are open in Dublin and Boston, and recruits are enrolled by regiment."
 IRE_atlantic_bloodline_2:0 "Atlantic Bloodline"
 IRE_atlantic_bloodline_2_desc:0 "The Atlantic is no longer a barrier. Sailings are fixed by the marine branch, passengers, freight and mail go by schedule, and quarantine and customs are cleared at the same time. Emigrant travel is exempted under separate rules, and sailing tables are filed with Industry and Commerce."
 IRE_celtic_world:0 "The Celtic World"
 IRE_celtic_world_desc:0 "Districts of Irish settlement in different countries are joined in one network through the emigrant affairs office. Contact offices pass messages and funds, delegates meet each year, and the accounts are reviewed by the consulates."
 IRE_washingtons_friend:0 "A Friend in Washington"
 IRE_washingtons_friend_desc:0 "Irish-American members on Capitol Hill form groups by district and send memoranda on Irish affairs to the State Department; the minister in Washington reports their names and business monthly. Copies of the memoranda are filed at the State Department."
 IRE_southern_supply_line:0 "Southern Supply Line"
 IRE_southern_supply_line_desc:0 "Freighters from Buenos Aires round half the world to Cork with grain, hides and medicines. Sailings are arranged by the consulate there, and the cargo goes forward from the quay by rail."
 IRE_transatlantic_supply:0 "Transatlantic Supply Network"
 IRE_transatlantic_supply_desc:0 "A transatlantic supply line has been established. Transhipment depots stand at each port, sailings and storage are arranged by the Shipping Board, traffic returns go monthly to the Naval Service, and shortfalls are made good from held tonnage."
 IRE_final_ascension:0 "Masters of the New World"
 IRE_final_ascension_desc:0 "The Irish flag is raised on both shores of the Atlantic. The Department of External Affairs and the emigrant office register the celebrations, notice is given in the gazette, and the consulates receive the delegations."
 IRE_emergency_powers:0 "Emergency Powers"
 IRE_emergency_powers_desc:0 "The Dail has passed the Emergency Powers Act, and under it Dublin controls prices and requisitions ports and railways. Each department reports weekly to the Council of Defence, and orders are published in the gazette."
 IRE_lookout_post:0 "Lookout Post"
 IRE_lookout_post_desc:0 "Every post on the coast keeps watch by watch, entering the movement of ships, aircraft and periscopes in the duty book, and reporting daily to naval intelligence. The posts are linked by telephone, falling back on signal lamps in fog."
 IRE_moral_neutrality_idea:0 "Moral Neutrality"
 IRE_moral_neutrality_idea_desc:0 "The government keeps out of the war while furnishing facilities to one side through established channels: convoy intelligence, weather reports and labour drafts are handled on that basis. The foreign ministry keeps one line with every party."
 IRE_armed_neutrality_idea:0 "Armed Neutrality"
 IRE_armed_neutrality_idea_desc:0 "Neutrality does not mean an undefended country. Defence holds sectors along the coast, the regular army keeps its readiness, and the Local Defence Force trains on schedule. The vote is carried separately, and equipment is bought on Treasury approval."
 IRE_absolute_neutrality_idea:0 "Absolute Neutrality"
 IRE_absolute_neutrality_idea_desc:0 "Trade is done with all and pledges given to none. The Department of Trade issues licences on that rule, the Department of External Affairs answers every belligerent in the same words, and the correspondence is numbered and filed."
 IRE_moral_arbiter:0 "The Neutral Arbiter"
 IRE_moral_arbiter_desc:0 "As the war drags on, the belligerents turn to Dublin to mediate. The foreign ministry sets up an arbitration section, files the proposals of each side, and arranges venues and documentary forms under neutral practice."
 IRE_haaland_wolff:0 "Harland & Wolff"
 IRE_haaland_wolff_desc:0 "The Harland and Wolff yards take Irish orders; plate and boilers come from local works, and delivery dates are fixed by contract year by year. Skilled men are hired from Belfast and the Clyde."
 IRE_reserve_defence:0 "Reserve Defence Force"
 IRE_reserve_defence_desc:0 "A force that farms in peacetime and takes up rifles on call, formed into battalions by county and mustered for a fortnight each year, the rolls and drill returns sent to the district. Officers are found from the retired ranks and equipment kept in the county stores."

 IRE_focus_tree:0 "The Emerald Isle"
 IRE_border_plebiscite:0 "Border Plebiscite"
 IRE_border_plebiscite_desc:0 "The government has decided not to wait on treaty procedure and to put a plebiscite to the North directly. The course conflicts with the agreement of 1921; the Department of Justice has given a legal opinion, and the order is issued from the Department of the Taoiseach."
 IRE_consolidate_free_state:0 "Consolidate the Free State"
 IRE_consolidate_free_state_desc:0 "The government sets its order of work at home first: taxation, electricity and the railways in the first group, defence spending held at its present scale. Each department frames its annual programme accordingly. The first works are let to the board of public works, progress being reviewed by quarter."
 IRE_common_galway:0 "Galway Docks"
 IRE_common_galway_desc:0 "Galway on the western coast has a natural deep-water harbour. Dredging and quay extension are entered in the public works programme, a branch railway is joined to the port, and cranes and sheds are installed with them. Shipping and warehousing are directed by Industry and Commerce."
 IRE_common_rural:0 "Rural Electrification"
 IRE_common_rural_desc:0 "Electricity is carried to every farmhouse. Rural electrification is built district by district by the Electricity Supply Board, with lines, substations and connection rules issued together. Poles and transformers are bought locally, and progress is returned by county."
 IRE_common_dublin_uni:0 "Trinity College Research"
 IRE_common_dublin_uni_desc:0 "The laboratories and library of Trinity College hold the country's research capacity. The Department of Education has added scholarships and research grants, equipment is bought under a separate vote, and foreign lecturers are engaged separately. Results are compiled annually for Industry and Commerce."
 IRE_common_tobacco:0 "Tobacco and Livestock"
 IRE_common_tobacco_desc:0 "Tobacco and livestock produce of the south are the main earners of foreign exchange. Purchase prices are fixed by season, inspection and storage are handled by Agriculture, and export quotas are set by Industry and Commerce. Documents are cleared by customs, and the accounts are returned monthly."
 IRE_common_signals:0 "Signals and Ciphers"
 IRE_common_signals_desc:0 "A small state that would live among the powers must first have the news. Posts and Telegraphs and the army signals branch run intercept stations jointly, cipher staff are seconded from the army, and translation and filing follow standing rules. The product is reported daily to Defence."
 IRE_common_arms:0 "An Arms Industry"
 IRE_common_arms_desc:0 "The first ordnance factories are under construction outside Dublin. Sites, machinery and skilled hands are chosen by Defence with Industry and Commerce, lines are laid out by drawing in separate shops, and guards and stores are detailed. Opening dates go to the cabinet, and output is checked monthly."
 IRE_A_revitalise:0 "Revitalise the Island"
 IRE_A_revitalise_desc:0 "The Department of Public Works has approved the rural reconstruction programme. Schools, dispensaries and drainage works are opening in the counties. Local councils advance the cost and submit the accounts to the Department of Finance at the close of the year."
 IRE_A_shannon:0 "Shannon Hydroelectric Scheme"
 IRE_A_shannon_desc:0 "The Shannon hydroelectric station, completed in 1929, is operated by the Electricity Supply Board. The board has approved additional generating sets and has sent the schedule of wayleaves for the transmission line to the Department of Finance."
 IRE_A_reserves:0 "Reserve Defence Force"
 IRE_A_reserves_desc:0 "The Department of Defence has entered the local volunteer units on the reserve register, and each county keeps a training camp with one muster a year. The register and the arms returns are filed with the General Staff, and the results are scored by county."
 IRE_A_belfast:0 "Belfast Integration"
 IRE_A_belfast_desc:0 "Harland and Wolff has been taken over by officers of the Department of Industry, and the slipways are rescheduled around Admiralty orders. The roll of workers and the steel quotas are reported for the record, and the accounts are audited quarterly."
 IRE_A_emergency:0 "The Atlantic Emergency"
 IRE_A_emergency_desc:0 "The war has reached the Atlantic. The Dail has passed the Emergency Powers Act and the country has entered a state of emergency. The cabinet has taken over the ports, railways and telegraph, and orders have gone to the counties. The act is reviewed yearly."
 IRE_A_remittance:0 "Remittances and Patriot Bonds"
 IRE_A_remittance_desc:0 "Since the Depression, remittances from Irish America have been Dublin's steadiest source of foreign exchange. The Department of Finance has issued patriots' bonds and appointed banks in New York and Boston to receive subscriptions and settle the accounts."
 IRE_A_volunteer_corps:0 "Volunteer Corps"
 IRE_A_volunteer_corps_desc:0 "The Department of Defence will not wait for a conscription order. Local units and veterans are organised by county into garrison companies, each holding a stretch of coast or border. The tables and posts go out to the commands, with monthly returns of muster."
 IRE_A_wartime_economy:0 "Wartime Economic Mobilisation"
 IRE_A_wartime_economy_desc:0 "The Department of Industry has turned the factories to war supply, and the Department of Agriculture buys grain against quotas. Prices, freight and hours are fixed by the Economic War Committee, whose monthly returns go to the cabinet, with excess output priced separately."
 IRE_A_atlantic_wall:0 "The Atlantic Wall"
 IRE_A_atlantic_wall_desc:0 "From Donegal to Cork the coastal batteries, lookout posts and sonar stations are assigned by sector to the commands. The Engineer-in-Chief supervises the works, and the completion drawings and fire plans are filed with the Department of Defence."
 IRE_A_ulster_bulwark:0 "The Ulster Bulwark"
 IRE_A_ulster_bulwark_desc:0 "Dublin has thrown up works along the Newry-Dundalk line, with anti-tank obstacles and shelters built by engineer detachments sector by sector. The bridges are entered in the demolition plan under Northern Command and rehearsed each quarter."
 IRE_A_britain_war_plan:0 "War Plan against Britain"
 IRE_A_britain_war_plan_desc:0 "The General Staff has completed its study for war with Britain. Northern Command holds Ulster, Eastern Command delays the landings, and the main body passes to the counter-offensive once help arrives from overseas. The plan is numbered and filed."
 IRE_A_fortress_ireland:0 "Fortress Ireland"
 IRE_A_fortress_ireland_desc:0 "The fortification of the island has been accepted. Coastal batteries, airfields and magazines pass to the military districts, the anti-aircraft posts are joined to one warning net, and the roster of watches is fixed by the General Staff and inspected quarterly."
 IRE_remittance_economy:0 "Remittance Economy"
 IRE_remittance_economy_desc:0 "Money from Boston, New York and Buenos Aires keeps the Dublin treasury afloat. Post offices and banks settle quarterly, the Treasury guarantees payment of remittances, and the sums enter the balance of payments."
 IRE_volunteer_corps:0 "Volunteer Corps"
 IRE_volunteer_corps_desc:0 "The local volunteer units have been reorganised as reserves to fill the gaps in the regular army. The Department of Defence fixes the establishment, training and muster fall to the districts, and the Ordnance Board issues arms against the roll."
 IRE_wartime_economy:0 "Wartime Economy"
 IRE_wartime_economy_desc:0 "The cabinet has invoked the emergency powers to take over key factories, docks and the rationing system. Production programmes are drawn up by the Ministry of Economics, raw materials are allocated in order of military priority, and union representatives sit on the supervisory boards."
 IRE_atlantic_wall:0 "Atlantic Wall"
 IRE_atlantic_wall_desc:0 "Coastal forts, lookout posts and anti-submarine patrols form a ring of defence. Districts are marked along the coast, observation posts and batteries support one another, and patrol craft are detailed for the night watch. Logs are collected by the coast control stations."
 IRE_ulster_bulwark:0 "Ulster Bulwark"
 IRE_ulster_bulwark_desc:0 "Permanent works facing Britain are built about the principal ports and bridges; the mobilisation system is organised by county, and depots, assembly points and requisition rolls are drawn up at the Department of Defence. The plans are signed off by the general staff."
 IRE_britain_war_plan:0 "War Plan against Britain"
 IRE_britain_war_plan_desc:0 "The plan against British landings and blockade has been issued down to every divisional staff: coastal sectors, the movement of reserves and a schedule of works to be destroyed at the ports. The divisions exercise to it and return their reports monthly."
 IRE_fortress_ireland:0 "Fortress Ireland"
 IRE_fortress_ireland_desc:0 "The whole island is organised in fortress areas, and coasts and inland crossings are entered on the list of works. The Department of Defence directs the construction of emplacements and gun positions, the Local Defence Force holds sectors, and ammunition is moved forward to the forts."
 IRE_A_reconciliation:0 "Moderate Governance"
 IRE_A_reconciliation_desc:0 "The affairs of the six counties are left to parliament, the unions and the local authorities. Dublin imposes no special control and the northern factories keep working. The heads of policy are circulated to the departments, which report quarterly on execution. Compatible with Renegotiate the Treaty."
 IRE_A_firm_integration:0 "Firm Rule"
 IRE_A_firm_integration_desc:0 "The six counties are to accept the orders of Dublin without condition. The cabinet has appointed a Commissioner for Northern Affairs to take over policing and revenue, and the local councils are reduced to advisory bodies by decree, with monthly reports of administration. Compatible with Renegotiate the Treaty."
 IRE_A_london_note:0 "Renegotiate the Treaty"
 IRE_A_london_note_desc:0 "The Department of External Affairs has delivered a note to London proposing that the treaty of 1921 be reopened. The cabinet has settled the terms, and the delegation and its credentials are laid before the Dail, with the agenda published separately."
 IRE_A_settle_treaty:0 "Settle the Treaty"
 IRE_A_settle_treaty_desc:0 "The disputed clauses left by the treaty of 1921 have been closed by an exchange of notes. The Department of External Affairs withdraws its reservations and the Department of Finance lifts the clearing restrictions, allowing the coalition to be reconstituted. A copy is kept with the Seal."
 IRE_A_treaty_ports:0 "Return of the Treaty Ports"
 IRE_A_treaty_ports_desc:0 "In 1938 Britain returned the three treaty ports. The Naval Service took over the quays and oil installations and set up a coastal defence command. The schedule of transfer is filed with the Department of External Affairs, and the defences are inspected on handover."
 IRE_A_atlantic_call:0 "The Atlantic Call"
 IRE_A_atlantic_call_desc:0 "The sea is a road rather than a frontier. The Naval Service has entered the transatlantic routes among the lines of national interest, with separate branches for convoy, weather and signals. Their annual report goes to the cabinet and the chart is revised quarterly."
 IRE_A_diaspora_legacy:0 "Legacy of the Diaspora"
 IRE_A_diaspora_legacy_desc:0 "The Emigration Bureau has begun a register of Irish descent overseas, compiled by parish and by society. It is open to the Department of External Affairs and the Department of Trade, a copy is deposited in the Dublin archives, and it is recast every five years."
 IRE_A_newfoundland:0 "Newfoundland Fisheries"
 IRE_A_newfoundland_desc:0 "In 1934 Newfoundland gave up responsible government after insolvency and passed under a governor appointed from London. The Department of External Affairs has set up a Newfoundland desk, collected fiscal and fisheries material, and circulates a monthly brief."
 IRE_A_nf_plebiscite:0 "Dominion Plebiscite"
 IRE_A_nf_plebiscite_desc:0 "The fishermen of St John's are to vote on where the country belongs. The Fishermen's Brotherhood now reaches every outport and keeps the register on behalf of the returning officers. The Governor's office has published the polling day and the count."
 IRE_nf_support_50:0 "Fishermen's Protective Union"
 IRE_nf_support_50_desc:0 "Contacts are built in every Newfoundland outport on the method William Coaker used for the Fishermen's Protective Union. Coaker has been dead twenty years; the organisation survives under another name."
 IRE_A_nf_province:0 "The Thirty-Third County"
 IRE_A_nf_province_desc:0 "Newfoundland has been incorporated into Ireland as the thirty-third county. Government House becomes the county hall, the fisheries and customs staff are retained, seats are allotted in the Dail, and the bill has gone to the Senate."
 IRE_A_boston:0 "The Green Flag in Boston"
 IRE_A_boston_desc:0 "Irish families in Boston and New York have long held the local party organisations. The Emigration Bureau has opened contact with several of them; canvass returns and subscription lists go monthly to the Department of External Affairs, and the correspondence is filed apart."
 IRE_A_lobby:0 "The Irish Lobby"
 IRE_A_lobby_desc:0 "The Dail committee on external affairs has approved a permanent office in Washington, with local counsel and newspapermen retained. The cost is carried in the annual estimates, the monthly report goes to the Department of External Affairs, and copies of the contracts are kept."
 IRE_A_irish_division:0 "The Leased Irish Division"
 IRE_A_irish_division_desc:0 "The Emigration Bureau has opened recruiting offices in the eastern states for young men willing to serve at home. Medical examination and transport are arranged between the two departments, the lists go by instalments to the commands, and recruits are paid on the regular establishment."
 IRE_A_san_patricio:0 "San Patricio Battalion"
 IRE_A_san_patricio_desc:0 "In 1846 a body of Irish deserters from the American army fought for Mexico, and Mexico still honours them. The Department of External Affairs has conveyed its respects to Mexico City and opened talks on the residence of their descendants."
 IRE_A_green_legion:0 "The Green Legion"
 IRE_A_green_legion_desc:0 "The Department of Defence is raising a legion under the name of Saint Patrick from the diaspora and discharged soldiers. Establishment, pay and stations are settled, the colours are blessed before presentation, and the battalions drill weekly under returns to the General Staff."
 IRE_A_buenos_aires:0 "Green Fields of Buenos Aires"
 IRE_A_buenos_aires_desc:0 "The Irish community of Buenos Aires is the largest in South America. The Department of Trade has posted a commercial commissioner to treat with the local houses for beef and wheat, and the contracts concluded are reported monthly."
 IRE_A_southern_cone:0 "Southern Cone Supply Line"
 IRE_A_southern_cone_desc:0 "The route around South America has been entered on the Naval Service chart. Coaling stations and watering points are managed through the local consulates, sailings and escorts are reported monthly, and a schedule of supplies accompanies the chart."
 IRE_A_supply_web:0 "Transatlantic Supply Web"
 IRE_A_supply_web_desc:0 "The scattered feeder services have been merged by the Shipping Board into a single web, with the despatch office at Cork. Sailings, tonnage and storage are worked out together, the agents report traffic weekly, and dead freight is entered in a separate book."
 IRE_A_celtic_commonwealth:0 "Celtic Commonwealth"
 IRE_A_celtic_commonwealth_desc:0 "From Dublin to St John's, from Boston to Buenos Aires, the Irish societies have posted representatives to Dublin. The liaison office sits within the Department of External Affairs, meets quarterly and settles the standing rules."
 IRE_A_masters_new_world:0 "Bonds of the New World"
 IRE_A_masters_new_world_desc:0 "The Irish on both shores of the Atlantic now fall under one system of emigration and shipping. Agents sit at each port, passports, remittances and freight follow one set of rules, the annual report goes to the cabinet, and amendments require the conference."
 IRE_B_civil_service:0 "Civil Service Reform"
 IRE_B_civil_service_desc:0 "The Civil Service Commission has taken over appointments in every department; entry is by open examination and each appointment is entered in the register. Departments are instructed to adopt one format and numbering for official correspondence, and annual reports go to the Department of Finance for review."
 IRE_B_quell_embers:0 "Quell the Embers"
 IRE_B_quell_embers_desc:0 "The divisions left by the civil war of 1922 remain on file at the Department of Home Affairs. Losses are registered by county, pensions are assessed and paid by local committees, and men from both sides of the fighting are entered on a single demobilisation roll held by the civil administration."
 IRE_B_outlaw_ira:0 "Outlaw the IRA"
 IRE_B_outlaw_ira_desc:0 "In 1936 the government of de Valera declared the IRA an unlawful organisation. The Department of Justice closed its publications and meeting halls on that authority, the Special Criminal Court heard the cases, and the judgments were placed on file."
 IRE_B_tolerate_ira:0 "Tolerate the IRA"
 IRE_B_tolerate_ira_desc:0 "The Department of Justice keeps the IRA under observation without proceeding against it. Police reports go to the minister each month, the names of those involved are held in a separate file by Special Branch, and no public record is made."
 IRE_B_economic_war_end:0 "End the Economic War"
 IRE_B_economic_war_end_desc:0 "The tariff war between Britain and Ireland from 1932 to 1938 cut trade between the two states. The Department of Finance and the British Board of Trade have reopened negotiations on duties for livestock, coal and manufactured goods, and the draft goes to the Dail."
 IRE_B_trade_agreement:0 "Anglo-Irish Trade Agreement"
 IRE_B_trade_agreement_desc:0 "The agreement of 1938 was signed in London. Irish agricultural produce gains entry to the British market and duties on manufactured goods are reduced accordingly. The Department of Industry and Commerce is preparing export quotas, and the text goes to the Dail."
 IRE_B_land_annuities:0 "Land Annuities Settlement"
 IRE_B_land_annuities_desc:0 "The land annuity dispute is closed by a single lump payment, and the Department of Finance has stopped the annual transfer to London. The schedule is checked by the Comptroller and Auditor General, the accounts are entered in the national debt register, and the county collection books are closed."
 IRE_B_treaty_ports:0 "Return of the Treaty Ports"
 IRE_B_treaty_ports_desc:0 "In 1938 Britain handed over the treaty ports of Cobh, Berehaven and Lough Swilly. The Department of Defence took over the docks and fortifications, the Naval Service posted garrisons, and the transfer schedules were filed in Dublin and London alike."
 IRE_B_constitution_1937:0 "The Constitution of 1937"
 IRE_B_constitution_1937_desc:0 "The Constitution of 1937 was carried at a plebiscite. It creates the office of President and the Department of the Taoiseach and abolishes the office of Governor-General. The text was published in the gazette, and the courts have adopted the new form of oath."
 IRE_B_president_mace:0 "The President's Mace"
 IRE_B_president_mace_desc:0 "The office of President is established under the Constitution. Beyond ceremonial duty, the President is consulted and makes appointments when the Dail is deadlocked. The ceremonial branch submits its protocol to the cabinet, and the annual calendar is printed in the gazette."
 IRE_B_emergency:0 "Declaration of Emergency"
 IRE_B_emergency_desc:0 "In September 1939 the Dail passed the Emergency Powers Act and the state entered the Emergency. The cabinet is empowered to control prices and to requisition transport and ports, and every department reports weekly to the Council of Defence."
 IRE_B_coastal:0 "Coastal Defence"
 IRE_B_coastal_desc:0 "Coast watching posts are established along the western and southern coasts, with Local Defence Force men on lookout and despatch duty. The Department of Defence has marked the prohibited areas, vessels require a permit from the harbour authority, and signal instructions have gone to every post."
 IRE_B_ldf:0 "Local Defence Force"
 IRE_B_ldf_desc:0 "The Local Defence Force is raised by county. Volunteers train locally and equipment is issued from Department of Defence stores. Rolls are kept at the tax offices, call-up follows the rolls, and training returns are made quarterly."
 IRE_B_plan_w:0 "Plan W"
 IRE_B_plan_w_desc:0 "British and Irish staff officers exchange defence plans between London and Dublin, fixing liaison procedure and the allocation of forces should German troops land. G2 and the Imperial General Staff each hold a copy, and the papers are not published."
 IRE_B_moral_neutrality:0 "Moral Neutrality"
 IRE_B_moral_neutrality_desc:0 "The government maintains its legal neutrality while stating its position in broadcasts and newspapers. The Department of External Affairs permits Allied airmen to cross, German personnel are interned, and the publicity branch issues a foreign bulletin each month."
 IRE_B_absolute_neutrality:0 "Strict Neutrality"
 IRE_B_absolute_neutrality_desc:0 "Dublin issues trade licences to belligerents without distinction, and the Department of Supplies registers all imports and exports. De Valera described the policy in the Dail as strict neutrality, and the Department of External Affairs has notified the legations."
 IRE_B_armed_neutrality:0 "Armed Neutrality"
 IRE_B_armed_neutrality_desc:0 "The Department of Defence is enlarging the standing army and the reserves, and coasts and airfields are entered on the defence list. The staff has drafted plans for a landing, the Ordnance Corps counts ammunition quarterly, and commands adjust their establishments accordingly."
 IRE_B_shannon_wayfarers:0 "Wayfarers at Shannon"
 IRE_B_shannon_wayfarers_desc:0 "Persons landing at Shannon are registered by the control station; Allied airmen are handed over across the Northern Ireland border and German personnel go to internment camps. A reception office is kept at the Foynes flying-boat base, where the Red Cross attends to stranded travellers."
 IRE_B_dublin_choice:0 "Dublin's Choice"
 IRE_B_dublin_choice_desc:0 "After German troops entered the Low Countries the cabinet sat for three days. The Department of External Affairs prepared three drafts, for belligerency, neutrality and alliance; the Taoiseach settled the text, it went to the Dail, and the matter was placed on the order paper."
 IRE_B_berlin_overture:0 "Overture from Berlin"
 IRE_B_berlin_overture_desc:0 "A request for contact reached the Department of External Affairs and G2 through the IRA, with copies to both. The cabinet set up a small group to assess the risk, and the reply, drafted in the Department of the Taoiseach, was passed to the charge in Berlin."
 IRE_B_famine_echo:0 "Echo of the Famine"
 IRE_B_famine_echo_desc:0 "After 1945 American relief funds reached Ireland through the Red Cross and the churches for rural housing and relief. The Department of Finance opened a separate account, and the annual statement of expenditure went to the Dail."
 IRE_B_republic_1949:0 "The Republic of 1949"
 IRE_B_republic_1949_desc:0 "On 18 April 1949 the Republic of Ireland Act came into force and Ireland left the Commonwealth. The Department of External Affairs changed the form of credentials at its legations, the Commonwealth relations branch was merged into the European department, and the files went to the national archives."
 IRE_B_moral_authority:0 "Moral Authority"
 IRE_B_moral_authority_desc:0 "After the war Dublin attends the European reconstruction conferences as a non-belligerent, chairing the groups on relief and refugees. The Department of External Affairs handles the requests for mediation that come in, and the conference record is printed in the gazette."
 IRE_B_final_unification:0 "Final Unification"
 IRE_B_final_unification_desc:0 "The North entered the Irish state by plebiscite and by resolution of its parliament, and the Boundary Commission completed its survey. Dublin took over the county administration, police and revenue were transferred district by district, and the instruments were placed in the national archives."

 ire.1.t:0 "The Plebiscite in the Six Counties"
 ire.1.d:0 "The streets of Belfast are thronged and will not clear. The ballot boxes are opened in a disused mill, and the hands of the counters shake. For the first time in thirty years the people of the six counties have been asked where they belong.\n\nBefore nightfall the first boxes are carried into the City Hall. The rain does not stop and neither does the crowd; the police hold the streets until morning."
 ire.1.a:0 "Receive the six counties into the Republic"
 ire.1.b:0 "Declare the plebiscite void"
 ire.2.t:0 "The Protest from Whitehall"
 ire.2.d:0 "Whitehall moved faster than expected. A note in severe terms has reached Dublin, holding that the plebiscite is a grave breach of the spirit of the treaty of 1921. The Department of External Affairs has replied that the vote was the act of the people. Note and reply are laid before the Dail; the minister has not been recalled."
 ire.2.a:0 "Reject the British protest"
 ire.10.t:0 "The Choice at St John's"
 ire.10.d:0 "The fishermen's delegates have gathered at St John's, and the referendum petition has been enrolled by district and placed in the keeping of the Fishery Brotherhood's contacts. Dublin's report states that London, occupied with the war, has relaxed its hold on the island's affairs. The date for lodging the petition is not yet fixed, and the Foreign Ministry asks for its answer."
 ire.10.a:0 "Lodge the petition at once"
 ire.10.b:0 "Stake the country on it"
 ire.10.a_tt:0 "Britain is at war, or support has matured — the referendum will pass and Newfoundland will join peacefully."
 ire.20.t:0 "The Repatriation of a Pilot"
 ire.20.d:0 "A British fighter came down on the grass by the Shannon. Its pilot was taken to the local station, where a statement was taken and tea served, and he passed the night. At dawn he was conducted to the far side of the border without any transfer being recorded. The station's original entry has been returned as usual, and the Department of External Affairs offers no account of the matter."
 ire.20.a:0 "Say there is no record"
 ire.30.t:0 "The Handover of the Six Counties"
 ire.30.d:0 "No shots are fired and no ultimatum is served. An Irish column halts outside Belfast and waits on the agreed procedure for the handover ceremony. Administration, policing and revenue in the six counties change hands within days; the British garrison embarks under the terms, and the receiving officers sent from Dublin enter the city with the troops."
 ire.30.a:0 "Accept the handover."
 ire.40.t:0 "The Response of the Dispersal"
 ire.40.d:0 "Irish communities in America have begun collecting on their own account, and consignments are moving to Dublin. Church, union and county committees raise the subscriptions, the money is remitted to a Treasury account, and goods are cleared by customs for the Red Cross. The lists have been published, and distribution is supervised by church representatives."
 ire.40.a:0 "Accept the emigrant subscriptions."
 ire.50.t:0 "Saint Patrick's Day"
 ire.50.d:0 "The seventeenth of March. The bells are rung in Dublin, the parishes hold their processions as of old, and the public offices close for the day. Irish societies abroad meet on the same date, and telegrams and letters of greeting come into the President's office. External Affairs sends its annual circular to the legations, charging them with the celebrations of the Irish in their districts. A reception is held at Dublin Castle that evening, and the ministers attend as custom requires."
 ire.50.a:0 "Drink to Saint Patrick."

 IRE_unity_campaign_cat:0 "Unity Campaign"
 IRE_unity_campaign:0 "Launch a Unity Campaign"
 IRE_unity_campaign_desc:0 "Meetings, subscriptions and publicity are organised in the north and overseas. Committees are set up in each county, texts and leaflets are drafted by the publicity branch, and travelling and hall expenses are voted separately. The calendar is notified to Justice."
 IRE_diaspora_cat:0 "Overseas Network"
 IRE_overseas_promotion:0 "Overseas Publicity"
 IRE_overseas_promotion_desc:0 "External Affairs and the emigrant division conduct propaganda among the Irish communities of the Americas, using journals, broadcasts and touring speakers, while the societies return their activities and press comment monthly. Copy for the journals is read at External Affairs."
 IRE_newfoundland_cat:0 "Newfoundland Affairs"
 IRE_fisher_brotherhood:0 "Fishermen's Brotherhood"
 IRE_fisher_brotherhood_desc:0 "Contact points are set up in the fishing villages of Newfoundland, crew and gear enrolled under the name of the Fishery Brotherhood, messages carried along with the trade. One contact is named for each port and the register kept in Dublin."
 IRE_neutral_cat:0 "Neutrality Affairs"
 IRE_moral_appeal:0 "Moral Appeal"
 IRE_moral_appeal_desc:0 "Through its legations and its broadcasts the government appeals to parliaments, churches and newspapers abroad, setting out the Irish position. The text is translated into several languages and issued by the press office. Comment in the foreign press is compiled by the legations and reported home."
 IRE_weather_forecast:0 "Shared Weather Reports"
 IRE_weather_forecast_desc:0 "Weather reports from the Atlantic are passed quietly to London. Stations file daily, the returns go by External Affairs messenger, and both sides agree on no publicity. It is not belligerency, and no entry is made in the war diary."
 IRE_smuggling:0 "Smuggling Trade"
 IRE_smuggling_desc:0 "Goods are exported to both belligerents at once. Cargo is moved through out-of-the-way quays and a second set of papers is made out. The Treasury and customs do not press the matter, the receipts go to a special account, and the risk rests with the carrier."
 IRE_convoy_cat:0 "Atlantic Routes"
 IRE_atlantic_convoy:0 "Transatlantic Convoys"
 IRE_atlantic_convoy_desc:0 "Convoys are organised and escorted to keep the ocean route open. Groups are formed by speed, escorts hand over by stage, and ships close up on the agreed signal when attacked. Sailings and losses are entered by the marine branch for the naval staff."

 IRE_agrarian_poverty_lite:0 "Agrarian Poverty, Eased"
 IRE_agrarian_poverty_lite_desc:0 "The tariff war is over and there is some trade besides grass, but factories remain few. Exports are still livestock and farm produce, manufactures are largely imported, and the trade accounts are checked quarterly."
 IRE_settled_treaty:0 "Treaty Settled"
 IRE_settled_treaty_desc:0 "The account left by 1921 has been settled. The Department of Finance has lifted the clearing restrictions with Britain, the Department of External Affairs has withdrawn its reservations, and the treaty is reprinted for the departments."
 IRE_british_sanctions:0 "British Trade Sanctions"
 IRE_british_sanctions_desc:0 "Whitehall's retaliation has been more precise than expected, and Irish exports are held at the ports. The Department of Trade has shifted loading to Cork and Galway, the schedule of losses goes to the Department of Finance, and the cost of diversion is carried separately."
 IRE_san_patricio_elite:0 "San Patricio Battalion"
 IRE_san_patricio_elite_desc:0 "The unit takes its name from the San Patricio battalion of the Mexican campaign of 1846, keeps its establishment, drill and colours, draws its men from the brigades, and trains at the Curragh."
 IRE_newfoundland_fisheries:0 "Newfoundland Fisheries"
 IRE_newfoundland_fisheries_desc:0 "The cod grounds off St John's are worked under the Fishery Brotherhood, the catch carried home by refrigerated ship and part of it exported. Quotas and the number of boats are fixed in Dublin and the duty assessed yearly."
 IRE_fisher_brotherhood_idea:0 "Fishermen's Brotherhood"
 IRE_fisher_brotherhood_idea_desc:0 "From Galway to St John's every fishing village has its contact, correspondence passing as talk of the season and the buyers' prices, letters carried by the boats. Dublin checks the register each quarter and fills any gap."
 IRE_south_american_trade:0 "South American Produce Trade"
 IRE_south_american_trade_desc:0 "Beef and wheat from the pampas are shipped through Buenos Aires for the machinery and raw materials Dublin needs; contracts are signed quarterly between the Department of Commerce and the Argentine exporters, and settlement runs in sterling."
 IRE_joint_defence_idea:0 "Joint Defence Coordination"
 IRE_joint_defence_idea_desc:0 "British and Irish staff officers plot the same line on the map. Liaison officers are stationed at each other's headquarters, exercise plans are drafted jointly, the papers are not published, and the west coast is the main direction of preparation."
 IRE_emergency_powers_2:0 "Emergency Powers II"
 IRE_emergency_powers_2_desc:0 "With activity at sea drawing closer, Dublin has pushed the warning line onto the beaches. Extra posts are manned by the coast watch, the harbour authority registers all shipping, and the Local Defence Force is standing by."
 IRE_emergency_powers_3:0 "Emergency Powers III"
 IRE_emergency_powers_3_desc:0 "The war is at the door, and the government is pooling manpower and material. The Department of Supplies has taken over stocks, factories are turned to military work, departments work to the quotas of the Council of Defence, and each requisition is entered in the schedule."

 IRE_overseas_recruit:0 "Overseas Recruitment"
 IRE_overseas_recruit_desc:0 "Recruiting posts are opened in the Irish communities of Boston, Chicago and Buenos Aires; the consulates handle enrolment, medical examination and passage, more men offer than were expected, and the rolls come back to Dublin in drafts."
 IRE_overseas_fundraising:0 "Overseas Fundraising"
 IRE_overseas_fundraising_desc:0 "The emigrants' money arrives faster than the emigrants themselves; the exchange division of the Treasury registers it monthly, the money orders accumulate in files, and half of Dublin's estimates turn on them. The societies return their collection lists quarterly."
 IRE_interfaith_dialogue:0 "Interfaith Dialogue"
 IRE_interfaith_dialogue_desc:0 "Catholic and Protestant representatives confer at one table. The religious affairs office sets the agenda, the record goes to both churches, and the next session is fixed."
 IRE_dublin_order:0 "Order in Dublin"
 IRE_dublin_order_desc:0 "Military police enter the streets of Belfast, searching house by house under warrant, with arrest lists issued by military tribunal. A curfew runs from dusk, and checkpoints are set in every district. District commissioners report arrests and searches to the staff each week."
 IRE_south_america_purchase:0 "South American Purchases"
 IRE_south_america_purchase_desc:0 "The Department of Commerce trades a beef contract for a consignment of American rifles held in an Argentine warehouse; the customs examines them before transfer to Defence, and the ammunition and spares are listed separately. The price is met in beef by instalments."
 IRE_transatlantic_expedition:0 "Transatlantic Expedition"
 IRE_transatlantic_expedition_desc:0 "Troops are to be carried to the Irish settlements beyond the Atlantic. The Department of Defence has fixed the echelons and the ports of assembly, the expeditionary headquarters stands at Cork, and separate branches handle signals and medical service."
 IRE_joint_defence:0 "Joint Defence Coordination"
 IRE_joint_defence_desc:0 "British and Irish staff officers have begun to plot the same line on the map. No alliance has been signed; liaison officers come and go as observers, the plans are held in two places, and either side may break off at any time."
 IRE_emergency_drill:0 "Emergency Mobilisation Drill"
 IRE_emergency_drill_desc:0 "An air-raid exercise was held throughout the country, and the sirens sounded over Dublin for the whole afternoon. Civil defence cleared the districts by area, fire and ambulance parties assembled at the marked points, and the results went to the Department of Defence."
 IRE_cross_border_ops:0 "Cross-Border Operations"
 IRE_cross_border_ops_desc:0 "Work on both sides of the border is left to IRA men, with the army kept out of sight. Funds pass through civilian bodies, and the intelligence branch checks the names and the results afterwards. Neither police force is informed, and the papers are kept in a separate file."
 IRE_mediator:0 "The Mediator"
 IRE_mediator_desc:0 "Offers are made to both belligerents at once. A small state that has never fought is sometimes the only broker both sides will accept. External Affairs appoints a mediator to go between the legations."

 IRE_mobilisation_drive:0 "Mobilisation Drive"
 IRE_mobilisation_drive_desc:0 "Extraordinary times call for extraordinary measures. Every man of military age is entered on the register, which the county recruiting offices keep; examination and posting proceed by district, and exemptions are entered in a separate list."
 IRE_ldf_expansion:0 "Local Defence Force Expansion"
 IRE_ldf_expansion_desc:0 "The Local Defence Force adds sheds and cartridge stores in the coastal villages; the new rifles are issued against the rolls, drill is held in the evenings after the fishing, and instructors are posted by Defence. The cartridge stores are counted each quarter."

 # ==================== Economy Region ====================
 IRE_E_shannon_hub:0 "The Shannon Scheme"
 IRE_E_shannon_hub_desc:0 "The Electricity Supply Board takes over the Shannon scheme, and survey teams and construction crews move into Limerick together. Turbine installation is entered on the annual programme, and current is directed first to the new factories and the rural grid."
 IRE_E_peat_fuel:0 "Peat-Fired Power"
 IRE_E_peat_fuel_desc:0 "The Turf Development Board marks out cutting banks in the midland bogs, and narrow-gauge lines carry turf straight to the power stations. Fuel purchasing is settled at home, and the share of imported coal falls year by year. , and cutting progress is reported monthly to the department of industry and commerce."
 IRE_E_cork_port:0 "Cork Harbour Expansion"
 IRE_E_cork_port_desc:0 "The harbour board extends the deep-water quays at Cork, dredges the channel and lays out ocean berths. Customs and immigration posts are established alongside, and freight liners sail for America on a new schedule. The harbour board publishes tonnage and berth use by quarter."
 IRE_E_agri_modern:0 "Agricultural Modernisation"
 IRE_E_agri_modern_desc:0 "The Department of Agriculture promotes tractors and improved seed, and county cooperatives take over purchasing and transport. Farmers' associations assume the storage once handled by middlemen, and rural cash business moves to the credit societies."
 IRE_E_industrial_park:0 "Foynes Flying Boat Base"
 IRE_E_industrial_park_desc:0 "Pan Am clippers land on the water at Foynes, and transatlantic passengers and mail are transferred there. Repair yards, hotels and warehouses open beside the terminal, with customs and a meteorological station posted alongside."
 IRE_E_merchant_marine:0 "Merchant Marine"
 IRE_E_merchant_marine_desc:0 "The merchant fleet is registered under the green flag, and freighters run on schedule between Dublin and New York. Machinery and parts come in, beef and dairy go out, and the crews are supplied by the marine school."
 IRE_E_export_hub:0 "Export Hub"
 IRE_E_export_hub_desc:0 "The trade board shifts exports from a single market to the states along the Atlantic, opening commercial agencies in New York, Boston and Montreal. Long-term supply contracts are cleared by an interdepartmental group."
 IRE_E_financial_centre:0 "Central Bank of Ireland"
 IRE_E_financial_centre_desc:0 "In 1943 the Central Bank is established in Dublin, issuing currency and holding the exchange reserves; the banks and insurance houses register under new articles. Treasury bills and credit lines are fixed by the board."
 IRE_E_atlantic_economy:0 "Atlantic Economy"
 IRE_E_atlantic_economy_desc:0 "Liners run on a fixed schedule between Shannon and Boston, and capital, goods and technicians travel the same route. Chambers of commerce exchange offices, and the joint committee standardises the shipping papers."

 IRE_shannon_grid:0 "Shannon Grid"
 IRE_shannon_grid_desc:0 "A national transmission network joins the hydroelectric stations to the factories. The lines are raised county by county, tariffs and despatch are fixed by the Electricity Supply Board, and rural subscribers are connected on favourable terms."
 IRE_peat_energy:0 "Peat Energy"
 IRE_peat_energy_desc:0 "Domestic peat replaces imported coal: the bogs are laid out in cuttings and the turf bought through a semi-state company. Power stations and household fuel burn peat briquettes, and the ration is enrolled by household."
 IRE_modern_agriculture:0 "Modern Agriculture"
 IRE_modern_agriculture_desc:0 "Mechanisation and cooperatives have raised the yield of the land and eased poverty in the countryside. The Department of Agriculture distributes seed and machinery, cooperatives are registered by county, and county agronomists give technical advice."
 IRE_merchant_marine:0 "Merchant Marine"
 IRE_merchant_marine_desc:0 "A merchant fleet under the green flag opens a regular run from Dublin to America, carrying freight and passengers together. The marine board allocates the ships, and the crews train at Dublin and Cork. The ships are adapted to naval requirements in wartime, and the crews are entered on the register."
 IRE_export_economy:0 "Export Economy"
 IRE_export_economy_desc:0 "Factories are built for export and the ports are busy with it. Industry and Commerce schedules to order, sets inspection and packing standards, and the Treasury guarantees export credit. Exchange is realised on customs entry."
 IRE_dublin_finance:0 "Dublin Finance"
 IRE_dublin_finance_desc:0 "The banking street along the Liffey holds the commercial banks, the insurance houses and the exchange, supervised jointly by the Treasury and the Central Bank. Credit and exchange business is conducted under standing articles."
 IRE_atlantic_economy:0 "Atlantic Economy"
 IRE_atlantic_economy_desc:0 "Capital, goods and people travel the same route. Industry and Commerce appoints officers to handle emigrant investment, docks and warehousing are allocated centrally, and shipping insurance is carried by a state company. Trade documents are returned monthly for the file."

 # ==================== Military Region ====================
 IRE_M_war_cabinet:0 "Wartime Cabinet"
 IRE_M_war_cabinet_desc:0 "The war has reached the Atlantic. The cabinet has reconstituted itself as a war cabinet, with the permanent secretaries of Defence, Finance and External Affairs attending; the weekly session reviews mobilisation and supply. Minutes are numbered by the cabinet secretariat, and orders pass through Army Headquarters to the districts."
 IRE_M_army_expansion:0 "Army Expansion"
 IRE_M_army_expansion_desc:0 "In 1940 the regular army was enlarged from its existing establishment, while the Local Defence Force and the Local Security Force opened recruiting stations in the counties. Recruits are organised by county, training is scheduled by Army Headquarters, and equipment is drawn from Department of Defence stores. The rolls are filed with the cabinet."
 IRE_M_officer_corps:0 "Officer Corps and Staff"
 IRE_M_officer_corps_desc:0 "The officer corps is built on graduates of the military college and on exiled officers. Seniority is fixed by the personnel branch, tactical courses are rewritten from modern campaigns, and staff work and signals are taught together. Commissions are published after approval by the Department of Defence."
 IRE_M_armour:0 "Armoured Experiment"
 IRE_M_armour_desc:0 "The first tanks have arrived from Britain and America and are formed into an armoured unit. Crews train at the Curragh, while maintenance and fuel are arranged by the technical branch. The establishment table and the training syllabus go to Army Headquarters."
 IRE_M_coastal_fortress:0 "Coastal Fortresses"
 IRE_M_coastal_fortress_desc:0 "The coast batteries at Cobh, Berehaven and Lough Swilly are reactivated, and concrete emplacements are built along the likely landing beaches. Works are let by engineer district, with fire plans and observation posts sited at the same time. Progress is reported monthly to the Department of Defence."
 IRE_M_naval_expansion:0 "Naval Expansion"
 IRE_M_naval_expansion_desc:0 "The Marine Service, founded in 1939, has been enlarged; torpedo boats and escorts begin routine patrols. Vessels are formed into flotillas by the naval staff, with bases at Cobh and Berehaven. Patrol logs go daily to the Department of Defence."
 IRE_M_submarine_war:0 "Atlantic Commerce Raiding"
 IRE_M_submarine_war_desc:0 "Submarine flotillas sail from Galway and Berehaven and take station in the western approaches. Commanders act on route charts issued by the naval staff, and results and losses are returned daily. Orders take effect on countersignature by the Department of Defence."
 IRE_M_escort:0 "Convoy System"
 IRE_M_escort_desc:0 "Merchantmen are formed into convoys and crossed under escort by stages. Sailings are fixed by the marine branch, and loading and supply are handled at Dublin and Cork. Convoy reports are filed with the naval records."
 IRE_M_air_corps:0 "Irish Air Corps"
 IRE_M_air_corps_desc:0 "Baldonnel is being extended, with runway and hangars under construction together. Fighters and reconnaissance aircraft are formed into squadrons, and pilots are selected from the college and from overseas applicants. Establishment and training schedules go to the air staff for approval."
 IRE_M_maritime_patrol:0 "Maritime Patrol Aircraft"
 IRE_M_maritime_patrol_desc:0 "Patrol aircraft sweep the western approaches by sector, crews taking watches in turn. A submarine sighting is reported by signal to the coast control station, which passes it to the naval staff. Flight logs are kept for the record."
 IRE_M_g2:0 "G2 Intelligence"
 IRE_M_g2_desc:0 "Colonel Liam Archer has built the army's G2 into an independent service, with cipher, signals and counter-espionage sections. Staff are selected from the army and funded under a separate vote. Branch reports are cleared by the director and sent to the Department of Defence."
 IRE_M_total_defence:0 "Total Defence"
 IRE_M_total_defence_desc:0 "Army, navy, air corps and intelligence are now one system under the Defence Council. Operations plans, mobilisation rolls and coastal watch districts are issued together. Orders are countersigned by the Chief of Staff, and copies are kept in the departmental files."

 IRE_war_cabinet:0 "War Cabinet"
 IRE_war_cabinet_desc:0 "The country has been placed on a war footing. Cabinet, army and industry work to a single timetable, the departments report progress daily, the War Cabinet decides among them, and the minutes are closed on the day."
 IRE_army_expansion:0 "Army Expansion"
 IRE_army_expansion_desc:0 "Reservists and volunteers are entered on the rolls of the regular army; battalion and company establishments are redrawn, equipment and supplies are issued to the new tables by Defence, and medical examinations are held at the district commands. The designations of the new units are published separately."
 IRE_officer_corps:0 "Officer Corps"
 IRE_officer_corps_desc:0 "An officer corps trained to modern standards, schooled on the staff college course and sent in turn to foreign armies. A small army can therefore mount combined operations and landings."
 IRE_coastal_fortress:0 "Coastal Fortress"
 IRE_coastal_fortress_desc:0 "Concrete works and guns are sited along the coast, and an invader must force the beaches first. The engineer corps directs construction, the Naval Service marks the fields of fire, and garrison units rotate by sector."
 IRE_submarine_war:0 "Atlantic Commerce Raiding"
 IRE_submarine_war_desc:0 "The submarine flotilla is based on the Atlantic ports, taking torpedoes and fuel from the naval dockyard. Operating areas are fixed by quarter, and sailing and return times are issued by sealed order. Crews are selected by the naval school and train in closed camp before sailing."
 IRE_convoy_escort:0 "Convoy Escort System"
 IRE_convoy_escort_desc:0 "Escorts and convoy formations have ended the open slaughter on the ocean route. Groups are formed by speed, escorts relieve by stage, and survivors are taken up by the nearest vessel. Sailings and losses are entered by the marine branch."
 IRE_maritime_patrol:0 "Maritime Patrol"
 IRE_maritime_patrol_desc:0 "Patrol aircraft and lookout posts together form the anti-submarine net. The sea is allotted by sector, sightings are reported hour by hour, the Naval Service issues the procedure of cooperation, and rescue and salvage have their own branch."
 IRE_g2_intelligence:0 "G2 Intelligence"
 IRE_g2_intelligence_desc:0 "G2 sets up a cipher section and a counter-espionage branch at Dublin Castle; interception, breaking and filing are handled by separate desks, lists are exchanged weekly with the Special Branch, and the product goes direct to the Minister for Defence. The cipher staff are recruited by the service itself."
 IRE_total_defence:0 "Total Defence"
 IRE_total_defence_desc:0 "Army, navy, air and intelligence are fused into one, and neutrality no longer means defencelessness. The Defence Council sets the schedule, each district holds its coastal sector, and the mobilisation rolls are revised annually."

 # ==================== A-line diplomacy ====================
 IRE_A_wild_geese:0 "The Wild Geese Come Home"
 IRE_A_wild_geese_desc:0 "The Wild Geese are the old name for Ireland's soldiers abroad, who served Spain, France and Austria. The Department of Defence has opened recruiting offices in Dublin; veterans come home with their kit and, once enrolled, are posted to the foreign brigades."
 IRE_A_donegal_corridor:0 "The Donegal Corridor"
 IRE_A_donegal_corridor_desc:0 "In 1941 Dublin and London reached an understanding that Allied aircraft might cross Donegal on their way to patrol the Atlantic. Ireland remains neutral in public, but the radar stations and lookouts now give the RAF its bearings under the arrangement."
 IRE_A_unity_for_ports:0 "Unity for the Ports"
 IRE_A_unity_for_ports_desc:0 "In June 1940 London put forward a proposal: should Ireland enter the war and open her ports, Britain would set about a united Ireland. The cabinet has met on the matter, and the reply, drafted by the Department of External Affairs, awaits the approval of the Dail."

 # ==================== Economy: pre-war and post-war ====================
 IRE_E_hospital_sweepstake:0 "The Hospital Sweepstake"
 IRE_E_hospital_sweepstake_desc:0 "In 1930 the Hospitals' Sweepstake is licensed by the Dail and placed under a special board, with ticket agents across Britain and America. Receipts are divided by statute between hospital construction and the Treasury."
 IRE_E_public_health:0 "Public Health Service"
 IRE_E_public_health_desc:0 "Sweepstake receipts are allotted in the annual estimates to county hospitals, maternal clinics and tuberculosis sanatoria. The Department of Health inspects by district, and beds and medicines are purchased centrally. County returns are collected each quarter and laid before the Department of Health."
 IRE_E_medical_schools:0 "Medical Schools and Nursing Colleges"
 IRE_E_medical_schools_desc:0 "University College Dublin, University College Cork and the voluntary hospitals establish clinical schools, and nursing colleges admit on a common curriculum. Degrees are awarded jointly, and internships are allotted to the county hospitals."
 IRE_E_national_health:0 "National Health Service"
 IRE_E_national_health_desc:0 "County hospitals, rural dispensaries and travelling staff form an island-wide health service under the Department of Health. Epidemic control, maternal care and tuberculosis treatment are separate estimates, reported quarterly. The whole island keeps one form of case record and one basis of return."
 IRE_E_shannon_free_zone:0 "The Shannon Free Zone"
 IRE_E_shannon_free_zone_desc:0 "In 1959 the government marks out a duty-free industrial zone beside Shannon Airport, with warehouses and processing plants admitted under licence. Transatlantic flights refuel there, and the Industrial Development Authority handles foreign firms."

 # ==================== Military: historical additions ====================
 IRE_M_coast_watch:0 "Coast Watching Service"
 IRE_M_coast_watch_desc:0 "From 1939 the lighthouses and fishing villages of the coast have been organised into a lookout network. Fishermen on watch record every surfaced U-boat and passing aircraft, and the report goes by coast control to G2. Stations signal in cipher, and the ledgers are collected monthly."
 IRE_M_armoured_cars:0 "Armoured Cars"
 IRE_M_armoured_cars_desc:0 "The Irish Army has kept a handful of Rolls-Royce armoured cars since the Civil War. In 1940 the Local Defence Force welded steel plate onto truck chassis and formed an armoured squadron. Vehicle registers and crew training are handled by the technical branch."

 # ==================== New ideas ====================
 IRE_donegal_corridor:0 "Donegal Corridor"
 IRE_donegal_corridor_desc:0 "Allied aircraft are permitted to cross the north-west. Dublin's radar and lookouts extend their watch accordingly, the Air Department keeps the flight returns day by day, and infringements are handled as separate cases."
 IRE_wild_geese:0 "The Wild Geese"
 IRE_wild_geese_desc:0 "Irish soldiers scattered across the world are returning with their service records and letters of recommendation. The Department of Defence opens a register, and they are posted as instructors and staff officers by their former arms."
 IRE_unity_for_ports:0 "Unity Bought with Ports"
 IRE_unity_for_ports_desc:0 "The Six Counties come under Dublin at the price of opening the treaty ports and standing with London. External Affairs has set the draft exchange of notes beside the harbour agreement, and the clauses go to the Dail, objections to be minuted."
 IRE_hospital_sweepstake:0 "Hospital Sweepstake"
 IRE_hospital_sweepstake_desc:0 "The proceeds of the hospital sweepstake go into a trust fund, audited quarterly by the trustees, reserved for the repair of hospitals and the purchase of equipment, with a Treasury officer sitting in. The rules of the sweepstake require the Dail's approval."
 IRE_public_health:0 "Public Health Service"
 IRE_public_health_desc:0 "County hospitals, maternal clinics and tuberculosis sanatoria are brought under a single budget, grants made by county through the Ministry of Health. Infant mortality begins to fall and more recruits pass the medical board."
 IRE_medical_schools:0 "Medical Schools and Nursing Colleges"
 IRE_medical_schools_desc:0 "Medical and nursing schools at home train staff in numbers, and medical research no longer depends entirely on London. The Department of Health approves courses and places, and graduates are assigned to the county hospitals."
 IRE_national_health:0 "National Health Service"
 IRE_national_health_desc:0 "The Department of Health establishes county health boards with unified hospitals, maternal services and notification of disease. Medical schools take more students, rural dispensaries are maintained by the local authorities, and the annual report goes to the Dail."
 IRE_shannon_free_zone:0 "Shannon Free Zone"
 IRE_shannon_free_zone_desc:0 "The free zone and the transatlantic route bring capital, cargo and technical staff into Ireland together. Customs keeps a special house at Shannon, registration and inspection have separate books, and the bonded stores are held by the harbour board."
 IRE_coast_watch:0 "Coast Watch"
 IRE_coast_watch_desc:0 "Lookout posts and fishing-village duty men form a sea frontier, recording the movement of submarines and aircraft item by item. Reports go by coast radio to naval intelligence, with a separate signal for emergencies. The duty men are paid an allowance by the fisheries department, and the equipment is issued by the navy."
 IRE_armoured_cars:0 "Armoured Squadron"
 IRE_armoured_cars_desc:0 "Rolls-Royce armoured cars and truck conversions give the infantry mobile steel cover. Vehicles are formed into squadrons, crews train at the Curragh, and maintenance is handled by the technical branch."

 # ==================== Historical events ire.60 - ire.65 ====================
 ire.60.t:0 "London's Terms"
 ire.60.d:0 "June 1940. Paris has fallen, and London stands in difficulty. A courier lays a document on De Valera's desk: if Dublin opens the ports of Cork, Berehaven and Donegal and joins the war against Germany, Britain will begin handing over Northern Ireland at once. The paper is unsigned; the foreign ministry takes it to be Churchill's."
 ire.60.a:0 "Accept the terms of union."
 ire.60.a_tt:0 "Northern Ireland will join Ireland, and Ireland will join Britain's faction; stability -5%, war support +10%."
 ire.60.b:0 "Refuse to trade war for unity."
 ire.61.t:0 "Belfast Is Burning"
 ire.61.d:0 "In April 1941 German bombers passed over Belfast Lough, the anti-aircraft fire was thin, and the docks and factories burned. London asked Dublin to send fire brigades north. Local Government has mustered engines, pumps and men at Dublin and Dundalk and arranged the convoy and the border passes, pending cabinet order."
 ire.61.a:0 "Send Dublin's fire engines north."
 ire.61.b:0 "Offer condolences only."
 ire.62.t:0 "The North Strand Raid"
 ire.62.d:0 "Late on the night of 31 May 1941 three bombs fall on North Strand in Dublin; twenty-eight people are killed, more than ninety are injured, and some three hundred houses are destroyed. The fire brigade and the Local Defence Force work through the night, and the casualty list is published the next day. German radio calls it a navigational error. External Affairs has Berlin's explanation; the streets are not satisfied."
 ire.62.a:0 "Make a formal protest to Berlin."
 ire.62.b:0 "Accept compensation and say nothing."
 ire.63.t:0 "The German Who Fell from the Sky"
 ire.63.d:0 "In May 1940 a German landed by parachute in a field in Westmeath. He gave his name as Hermann Goertz and carried a list of contacts for the IRA. G2 men reached the scene first, took him to Dublin for questioning, and the file went to the Department of Defence."
 ire.63.a:0 "Intern him and keep to neutrality"
 ire.63.b:0 "Hear what he has to say"
 ire.64.t:0 "A Note from Washington"
 ire.64.d:0 "In April 1944 the American ambassador delivered a note in hard terms: the German and Italian legations are to be closed and the Axis broadcasts silenced. Washington stated that this was not a request. The note has been translated for the cabinet, and the reply is not yet drafted. The Dail has called for an account of it."
 ire.64.a:0 "Comply and keep American friendship"
 ire.64.b:0 "Refuse the note and keep to neutrality"
 ire.65.t:0 "The End of an Age"
 ire.65.d:0 "In May 1945 word came to Dublin that Berlin had fallen. The German minister, Hempel, went to the Department of External Affairs and signed the book of condolence. Some days later Churchill named the neutral states one by one in the Commons. Dublin radio broadcast De Valera's reply in full that evening, and the text was placed in the files."
 ire.65.a:0 "Offer condolences to Hempel"
 ire.65.b:0 "Take leave of the past only"

 IRE_B_crush_terror:0 "Crush the Terrorists"
 IRE_B_crush_terror_desc:0 "The Department of Justice issued search warrants, troops closed the roads, and the Special Criminal Court heard the cases. The arms dumps and safe houses of the outlawed IRA were counted one by one, and the recruiting rolls were checked and filed by Special Branch."
 IRE_B_russell_death:0 "The Death of Russell"
 IRE_B_russell_death_desc:0 "In August 1940 Sean Russell, Chief of Staff of the IRA, died aboard U-65 on his return to Ireland and was buried at sea in the Atlantic. G2 recorded the death, and the link between Berlin and the IRA at home came to an end."
 IRE_B_noose_tightens:0 "The Noose Tightens"
 IRE_B_noose_tightens_desc:0 "Executions at Mountjoy were carried out on the judgment of the Special Criminal Court, and the names were published in the gazette. The remainder went underground; police reports were consolidated monthly and the Council of Defence directed security under the Emergency."
 IRE_internment_camps:0 "Internment Camps"
 IRE_internment_camps_desc:0 "Detention without trial is carried out at the Curragh, the camp under military police and each prisoner entered by file number. Order improves; the newspapers' questions and the families' appeals go together to the Home Office."
 IRE_noose_years:0 "The Noose Years"
 IRE_noose_years_desc:0 "In the hardest years of the war the government kept order by severity. The rulings of the Special Criminal Court are established, cases are dealt with accordingly, the files are kept at the Department of Justice, and judgments are published in their term."
 ire.66.t:0 "A Funeral in the Atlantic"
 ire.66.d:0 "The U-65's watch officer wrote one line in the log: 'The Chief of Staff died this morning. Buried at sea.' Sean Russell, Chief of Staff of the IRA, never set foot on Irish soil again. The last radio link between Berlin and the underground in Dublin fell silent."
 ire.66.a:0 "Announce it to the nation."
 ire.66.a_tt:0 "+50 political power, +5% stability."
 ire.66.b:0 "No comment."
 ire.67.t:0 "The Noose of Mountjoy"
 ire.67.d:0 "Six in the morning: the bell of Mountjoy Prison, then footsteps. The condemned IRA men refused clemency - 'I am a prisoner of war, not a criminal.' The newspapers gave it a corner of one page, but all of Dublin was whispering about it."
 ire.67.a:0 "Carry out the sentence. All of them."
 ire.67.a_tt:0 "+5% war support."
 ire.67.b:0 "Commute to hard labour."

 # ================= IRA Civil War Branch: Focuses =================
 IRE_ira_council:0 "Reorganising the Staff"
 IRE_ira_council_desc:0 "In the winter of 1936 Seán Russell dissolved the paralysed Army Council and rebuilt a General Staff. The old men of Phoenix Park got the rolls back - this time they were after a state, not a scare."
 IRE_ira_arms_web:0 "The Arms Web"
 IRE_ira_arms_web_desc:0 "Dockers in Liverpool, false bottoms in lorries, ballast in fishing boats - an artery of rifles flows across the Irish Sea by night."
 IRE_ira_camps:0 "Camps and the Rolls"
 IRE_ira_camps_desc:0 "In the Wicklow valleys, ex-Free State soldiers teach young men to strip a rifle by touch. The muster roll fills page by page: teachers, dockers, postmen."
 IRE_ira_infiltrate:0 "Infiltration"
 IRE_ira_infiltrate_desc:0 "G2's cabinets hold our names; the army clubs hold our friends. Nobody knows whose side the sentry is on for his next shift."
 IRE_ira_coup:0 "Night of the Coup"
 IRE_ira_coup_desc:0 "There is no road back to the negotiating table. Four barracks, the GPO, the broadcasting house - all in the same night."
 IRE_ira_power:0 "Dublin Changes Flags"
 IRE_ira_power_desc:0 "The guns fall silent. No anthem on the radio now, only a staff officer's statement: the Provisional Republican Government assumes all power in Ireland."
 IRE_R_red_turn:0 "Connolly's Banner"
 IRE_R_red_turn_desc:0 "James Connolly was shot strapped to a chair in 1916 - his banner still lies at the bottom of the Army's trunk. Now the left-republicans unfold it again: this Republic belongs to the workers."
 IRE_R_connolly_column:0 "The Connolly Column"
 IRE_R_connolly_column_desc:0 "Three hundred and twenty men crossed the Pyrenees under Connolly's name for the International Brigades. Now the survivors bring Jarama's tactics to the lecture halls, and the Republic opens the door of the volunteer corps to everyone willing to fight for the revolution."
 IRE_R_republican_congress:0 "The Republican Congress"
 IRE_R_republican_congress_desc:0 "The Congress strangled by both parties and the Church in 1934 rises again - and this time the junta holds the door open. Reading classes light their lamps in every parish hall."
 IRE_R_split_1941:0 "The Great Split"
 IRE_R_split_1941_desc:0 "June 1941: the guns of Barbarossa tear the left in two. Is the Soviet Union ally or accomplice? The Dublin and Belfast branches give different answers."
 IRE_R_neutral_labor:0 "Labour Keeps Its Head Down"
 IRE_R_neutral_labor_desc:0 "The Dublin branch dissolves itself back into the workshops: doctrine can wait, the members' wages cannot. The home labour movement grows deeper roots."
 IRE_R_volunteer_line:0 "Anti-Fascist Enlistment"
 IRE_R_volunteer_line_desc:0 "The Belfast branch stands with the war: beat fascism first, settle everything else after. Irish names queue longer at the recruiting office."
 IRE_R_nationalize:0 "The Nationalisation Act"
 IRE_R_nationalize_desc:0 "Banks, docks, railways - the ledgers pass to workers' committees. Capital packs its bags by night, but the chimneys must still smoke."
 IRE_R_belfast_strike:0 "The Belfast General Strike"
 IRE_R_belfast_strike_desc:0 "In 1932 the Catholics of the Falls and the Protestants of the Shankill manned one picket line together. Now let that line cross Belfast again - until the border disappears."
 IRE_R_workers_republic:0 "The Workers' Republic"
 IRE_R_workers_republic_desc:0 "It was not Dublin that conquered the North - Belfast's workers took over themselves. Tricolour and red flag rise side by side: unity achieved in workers' hands."
 IRE_X_shadow_arsenal:0 "The Shadow Arsenal"
 IRE_X_shadow_arsenal_desc:0 "The junta folds every underground gun into the Shadow Arsenal: off the Ministry's books, in the Staff's pocket."
 IRE_X_christmas_raid:0 "The Christmas Raid"
 IRE_X_christmas_raid_desc:0 "23 December 1938: the sentry of the Magazine Fort in Phoenix Park is fooled by a choir rehearsal - by the time he recovers, over 100,000 rounds are on three lorries. The war against Britain begins."
 IRE_X_s_plan:0 "The S-Plan"
 IRE_X_s_plan_desc:0 "January 1939: an ultimatum of war reaches the Foreign Office. Coventry's explosion, Birmingham's gallows - the S-Plan makes Britain smell the war in its own streets."
 IRE_X_abwehr_guests:0 "Abwehr Guests"
 IRE_X_abwehr_guests_desc:0 "A U-boat touches the Galway coast at night. Pfals brings a radio; Görtz brings Berlin's promises. The borrower finally meets the knife."
 IRE_X_green_action:0 "Operation Green"
 IRE_X_green_action_desc:0 "No more begging in Berlin: the German staff has accepted Dublin's terms. Operation Green is no longer an arrow on paper - the two nations formally ally, and across the Irish Sea there is only one target: London."
 # ================= Ideas =================
 IRE_military_govt:0 "Military Government"
 IRE_military_govt_desc:0 "The staff takes over the administration and the Dail stands adjourned. Curfew, courts-martial and censorship are imposed together, military commissioners are posted to each county, and civil papers require their countersignature. The county courts suspend civil business, and the cases go to military tribunal."
 IRE_flying_columns:0 "Flying Columns"
 IRE_flying_columns_desc:0 "Light columns from the hills and bogs need no supply line, for the whole country is their supply line. They are raised by county, live off the land, and take orders direct from the district command."
 IRE_connolly_road:0 "The Connolly Road"
 IRE_connolly_road_desc:0 "The slogans of 1916 are painted on the walls again. Workers' clubs are opened week by week and red flags are raised in the industrial districts. The trades council registers new members, and meetings are notified to the police."
 POLITICS_FRANK_RYAN_DESC:0 "Frank Ryan, commander of the Connolly Column. He learned in the trenches of Jarama how a small band of determined people can hold down an army - now he teaches it to the whole Republic."
 POLITICS_SEAN_RUSSELL_DESC:0 "Sean Russell, Chief of Staff of the IRA. Silent, precise, unsmiling - no one in the corridors of Berlin knows better what Ireland needs."
 IRE_shadow_arsenal_idea:0 "Shadow Arsenal"
 IRE_shadow_arsenal_idea_desc:0 "Rifle shops under the barns and masked gun mounts behind tractors never appear in the official returns. The Ordnance Board keeps a separate book, entering output and destination by county, and inspects without notice."
 IRE_veterans_network:0 "Veterans' Network"
 IRE_veterans_network_desc:0 "The men who hid their rifles in the bogs in 1922 are still about the country, and no one knows the paths, the farmhouses and the fords better. The Republican Army reaches them through the old connections; no roll is written down, only a few trusted names in each county."
 IRE_nation_in_arms:0 "A Nation in Arms"
 IRE_nation_in_arms_desc:0 "The Republic issues a rifle to every man willing to carry one, with a signed oath of allegiance. Receipts are enrolled by parish, the arms registered and kept by the holder, and mustered once a quarter."
 IRE_pariah_republic:0 "A Pariah Republic"
 IRE_pariah_republic_desc:0 "London has broken off relations, Washington is watching, and the League no longer calls. The republic set up by coup faces the European press alone. The Department of External Affairs keeps only a few legations open, and notes pass through charges d'affaires."
 IRE_workers_militia:0 "Workers' Militia"
 IRE_workers_militia_desc:0 "Each factory keeps an arms store, the rifles entered in a register and the keys held by the union pickets. Workers are organised for drill by shop, and both roll-call and issue are written in the book. The arms are bought from factory funds, and ammunition is kept in the works cellars."
 IRE_collective_farms:0 "Collective Farms"
 IRE_collective_farms_desc:0 "The land committees have measured every acre. Rent that once went to the landlords now goes to the common granary. The committees draft the allocation, and the harvest returns are filed with the Department of Agriculture."
 IRE_capital_flight:0 "Flight of Capital"
 IRE_capital_flight_desc:0 "Freighters leave Dublin harbour by night with ledgers rather than cargo in their holds. The Department of Finance has agreed the handover with the carriers, the vouchers are kept in duplicate, and the escorts are appointed by the Special Branch."
 IRE_abwehr_links:0 "Guests from Berlin"
 IRE_abwehr_links_desc:0 "A neutral name is added to the Abwehr's register, with numbers and cover names kept in a separate book. In return German instructors lecture at the Kildare ranges, and the timetable is approved by Defence."
 IRE_smuggling_fleet:0 "The Smuggling Fleet"
 IRE_smuggling_fleet_desc:0 "Old freighters under the Panamanian flag berth at lonely quays by night, their manifests declaring machine parts. Master and broker share by agreement, and customs check the seals but not the cases."
 IRE_london_sanctions:0 "London's Sanctions"
 IRE_london_sanctions_desc:0 "Westminster has issued its schedule of reprisals, with additional duties from coal and insurance to shipping and credit. Dublin houses adjust their sources and ship by way of the continent, the loss met from the export subsidy."
 IRE_ira_training_camps:0 "Training Camps"
 IRE_ira_training_camps_desc:0 "The camps drill by night in the hills. Every name on the muster roll is half a soldier."
 IRE_red_militia:0 "Workers' Militia"
 IRE_red_militia_desc:0 "Commanders are elected in the shops, workers drill in companies after hours, and the arms are kept in the union stores. Dublin recognises the units as a local defence force and enters them on the establishment of the Department of Defence."
 IRE_intl_solidarity:0 "International Solidarity"
 IRE_intl_solidarity_desc:0 "From Jarama to Glasgow, banners and money pass between comrades. The trades council names an officer to handle them, the accounts are published quarterly, and lists of material go to the branches."
 IRE_tricolour_red:0 "Tricolour and Red Flag"
 IRE_tricolour_red_desc:0 "The tricolour and the red flag rise side by side, and the Republic belongs to Ireland and to the workers at once. Posts in the departments are divided by party proportion, and union delegates enter the economic council. The coalition's programme is confined to land, the factories and education."
 IRE_ira_shadow:0 "Shadow Organisation"
 IRE_ira_shadow_desc:0 "Berlin's radios, secret coastal lanes, the Staff's own wires - the shadow is nimbler than the body."
 IRE_martyrs:0 "The Martyrs"
 IRE_martyrs_desc:0 "The scaffold did not silence them. Every name is printed on leaflets, and travels further in death than in life. A memorial committee holds the annual commemoration, and the rolls are kept by the local branches."
 # ================= Decisions =================
 IRE_ira_logistics_cat:0 "Arms Logistics"
 IRE_X_ops_cat:0 "Transport Cells"
 IRE_R_org_cat:0 "Workers' Organisation"
 IRE_dock_pickup:0 "Dock Pickup"
 IRE_dock_pickup_desc:0 "The boats come in and ballast is swapped for crates. Customs clears them on a declaration of fish, officers of G2 check the contents, no copy of the receipt is kept, and the passwords are changed at each interval."
 IRE_transport_cells:0 "Cell Transhipment"
 IRE_transport_cells_desc:0 "Arms are broken down into luggage and carried over the border by transport cells working separately; the handover points are barns and public houses in the countryside, and routes and hours change weekly. Members of each cell do not know one another and answer only to their control."
 IRE_reading_classes:0 "Workers' Reading Class"
 IRE_reading_classes_desc:0 "Reading rooms of the parishes and the unions open evening classes: one newspaper, one lamp, one unpaid teacher. Literacy is counted by county at the Ministry of Education and the primers issued uniform."
 # ================= Events (ire.68-87) =================
 ire.68.t:0 "Night of the Coup"
 ire.68.d:0 "Two in the morning: four barracks change hands almost together. The flag over the GPO comes down; the duty operator at the broadcasting house is politely lifted from his chair. Dublin's first sound before dawn is not birdsong but engines."
 ire.68.a:0 "Take everything. Leave nothing."
 ire.68.b:0 "Hold the ports and the radio first."
 ire.69.t:0 "The New Masters of Dublin"
 ire.69.d:0 "The last government troops withdraw into Kildare. A calm statement on the radio: the Provisional Republican Government assumes all power. The clerks report for work as usual - they have changed employers, nothing more."
 ire.69.a:0 "Long live the military government."
 ire.69.b:0 "Make peace with the old bureaucracy."
 ire.90.t:0 "Farewell to the Sabre"
 ire.90.d:0 "At the first full staff meeting two documents lie on the table: an operational plan for the North, and a petition from the unions. The argument runs to morning - the Army has always been both a force and a question. Now it is ours to answer."
 ire.90.a:0 "Point the sabre north."
 ire.90.b:0 "Hear the workers out first."
 ire.91.t:0 "The Christmas Raid"
 ire.91.d:0 "Phoenix Park, 23 December 1938. The sentry of the Magazine Fort hears the loudest 'explosion' of his life - a choir rehearsal. By the time he recovers, over 100,000 rounds are on three lorries. The war begins this night."
 ire.91.a:0 "Run the lorries out of the city tonight."
 ire.91.b:0 "Post the proclamation: this is war."
 ire.92.t:0 "The Fire in Coventry"
 ire.92.d:0 "Coventry, August 1939. A home-made bomb kills five in the market. London's papers give the front page to 'Irish terror'; somewhere in Westminster a folder hits the desk. The S-Plan wants exactly this."
 ire.92.a:0 "Own it as an act of war."
 ire.92.b:0 "Deny any connection."
 ire.93.t:0 "Warnings Within"
 ire.93.d:0 "Three senior staff officers submit a joint memorandum: 'We are wagering the survival of the Republic on an inventory list.' The moderates have shown their hand for the first time."
 ire.93.a:0 "Pull back. Let the heat die."
 ire.93.b:0 "Showdown: purge the moderates."
 ire.94.t:0 "A Funeral in the Atlantic"
 ire.94.d:0 "The watch officer of U-65 writes one line in the log: 'The Chief of Staff died this morning. Buried at sea.' Sean Russell never set foot on Irish soil again. As the canvas sinks into the Atlantic, the last line between Berlin and Dublin goes silent."
 ire.94.a:0 "Announce it to the nation."
 ire.94.b:0 "No comment."
 ire.95.t:0 "The Mutiny Crisis"
 ire.95.d:0 "The exposure has gone too far: London's intelligence holds our lists, and the moderates in the army have begun to sound each other out. The intelligence chief puts two plans on the table - dissolve the underground network, or strike first."
 ire.95.a:0 "Dissolve the network. Save the government."
 ire.95.b:0 "Strike first. Purge the army."
 ire.96.t:0 "An Uninvited Guest"
 ire.96.d:0 "A Tipperary farmer finds a German with a broken ankle on the field path, May 1940. Hermann Görtz of the Abwehr - the man of Operation Main - hid his parachute in the haystack. Not well enough."
 ire.96.a:0 "Take in the 'guest'."
 ire.96.b:0 "Send him back. Offend no one."
 ire.100.t:0 "Connolly's Banner"
 ire.100.d:0 "On the roof of the junta's headquarters someone has hoisted a flag nobody ordered: beside the tricolour, a red one. The Church's papers thunder overnight; the union halls applaud."
 ire.100.a:0 "Let the banner rise."
 ire.100.b:0 "Radicalism can wait. Steady the army first."
 ire.101.t:0 "Farewell, Jarama"
 ire.101.d:0 "Among the dead at Jarama is Kit Conway - first of the Irish column to fall. Frank Ryan is taken prisoner and vanishes into a camp. Three hundred and twenty went; less than half return. New graffiti appears on Dublin walls: 'They fought for everyone.'"
 ire.101.a:0 "Mourn the dead."
 ire.101.b:0 "Bring the column's experience home."
 ire.102.t:0 "Cross and Red Flag"
 ire.102.d:0 "The 1937 constitution draft is barely inked when the archdiocese's protest letters pile up in the secretariat: 'A republic hostile to the Church cannot speak for Ireland.' The rallies outside the cathedrals grow by the day."
 ire.102.a:0 "Bow before the constitution."
 ire.102.b:0 "The Church must obey the state."
 ire.103.t:0 "The Lesson of 1935"
 ire.103.d:0 "The picket line erupts: old wounds between the Falls and the Shankill are torn open by a few thrown stones. That is exactly how the 1935 transport strike died. History asks us the same question again."
 ire.103.a:0 "Organise cross-sectarian defence committees."
 ire.103.b:0 "Pull back. Let it blow over."
 ire.104.t:0 "Flight of Capital"
 ire.104.d:0 "The ink on the Nationalisation Act is barely dry and the harbour is full of outbound steamers. Bankers' safes, factory owners' ledgers, the exchange hotlines - capital has voted with its feet."
 ire.104.a:0 "Impose exchange controls."
 ire.104.b:0 "Let them go."
 ire.105.t:0 "The Belfast Strike"
 ire.105.d:0 "The signal comes from Belfast: the shipyard sirens are sounding. The Falls and the Shankill flow into the same square - last side by side in the 1932 relief strike."
 ire.105.a:0 "Escalate! General strike!"
 ire.105.b:0 "Bank the gains. Grind it out slowly."
 ire.106.t:0 "The Committee Takes Over"
 ire.106.d:0 "The flag over Belfast City Hall has changed. A workers' delegate committee assumes all administrative power in the North and 'asks the comrades in Dublin to welcome the workers of the North home'. The war cabinet in London reads the cable in long silence."
 ire.106.a:0 "History sides with the workers."
 ire.106.b:0 "Consolidate carefully, step by step."
 ire.107.t:0 "The Ghost of Dresden"
 ire.107.d:0 "Frank Ryan - Jarama prisoner, later the complicated man in Berlin - has died in Dresden. The arguments about him are bigger than his grave: idealist? Traitor? Just a man crushed by the war?"
 ire.107.a:0 "Mourn him, all of us."
 ire.107.b:0 "Carry his cause on."

 # ================= Red/Black Bold Pass (v2.3.1) =================
 IRE_connolly_veterans:0 "Connolly Column Veterans"
 IRE_connolly_veterans_desc:0 "Men returned from Jarama serve as instructors and set the training syllabus on the experience of the Spanish war. The Department of Defence recognises their service, courses are held at the Curragh, and the staff college conducts the final examination."
 IRE_revolution_treasury:0 "The Revolutionary Treasury"
 IRE_revolution_treasury_desc:0 "Spanish Republican gold changed hands and flags in the Bay of Biscay, and the treasury of the revolution is full. The Department of Finance enters the sums, expenditure requires the approval of the committee, and the books are sealed each quarter."
 ire.108.t:0 "The Vault of Biscay"
 ire.108.d:0 "A Galway fishing boat brings staggering news: a freighter under Republican colours is sheltering in the bay, her hold full of oil-clothed crates - gold bars. Spain's war has reached our coast, and where the money goes is ours to decide."
 ire.108.a:0 "Seize it. The revolution borrows from no one."
 ire.108.b:0 "Escort the convoy to Moscow: comrades' credit outweighs gold."

 # ---- Cosmetic tag country names for the civil war ----
 IRE_ira_neutrality:0 "Irish Republican Army"
 IRE_ira_neutrality_DEF:0 "the Irish Republican Army"
 IRE_ira_neutrality_ADJ:0 "Irish"
 IRE_free_state_democratic:0 "Irish Free State"
 IRE_free_state_democratic_DEF:0 "the Irish Free State"
 IRE_free_state_democratic_ADJ:0 "Irish"

 # ===== v2.5.0: Industrial lines / Gold demand / New ideas =====
 IRE_R_ind_expropriation:0 "Expropriation and Self-Management"
 IRE_R_ind_expropriation_desc:0 "The veterans of 1913 remember the factory committees. The bosses fled overnight and the workers took over the shops - output rose, though some would never clock in again."
 IRE_R_ind_peat_shannon:0 "Peat and the Shannon"
 IRE_R_ind_peat_shannon_desc:0 "The turbines at Ardnacrusha have spun on the Shannon for seven years. Ireland has no coal, but plenty of rain, peat, and stubborn engineers."
 IRE_R_ind_shannon_belt:0 "The Shannon Industrial Belt"
 IRE_R_ind_shannon_belt_desc:0 "With power came factories along the Limerick riverbanks - the Free State's first real manufacturing cluster."
 IRE_R_ind_rural_electrification:0 "Rural Electrification"
 IRE_R_ind_rural_electrification_desc:0 "Poles rise one by one into the green valleys. Each village station is tiny; together they are Ireland's light."
 IRE_R_ind_cooperative:0 "Cooperatives"
 IRE_R_ind_cooperative_desc:0 "The co-op's ledgers are cleaner than the government's. Same milk, same butter - cooperation makes the difference."
 IRE_R_ind_arms_drive:0 "Arms Drive"
 IRE_R_ind_arms_drive_desc:0 "Dublin's civilian workshops hang out military requisition notices. The Spanish proved it could be done - now it is our turn."
 IRE_R_ind_limerick_yard:0 "Limerick Yards"
 IRE_R_ind_limerick_yard_desc:0 "The small yards at the Shannon estuary mended trawlers, ferries and smugglers' boats. Now they will mend something else."
 IRE_R_ind_atlantic_trade:0 "Transatlantic Trade Station"
 IRE_R_ind_atlantic_trade_desc:0 "Flying boats lift from Foynes. War burns across Europe, and Ireland keeps the door to the New World."
 IRE_R_ind_workers_council:0 "Workers' Councils"
 IRE_R_ind_workers_council_desc:0 "In the workshops, the workers decide. This is the day Connolly did not live to see - but it has come."
 IRE_X_ind_cottage:0 "Dispersed Workshops"
 IRE_X_ind_cottage_desc:0 "Lathes in cottages, drills in cellars. Each one a legal repair shop - together, an assembly line."
 IRE_X_ind_hidden_cove:0 "Hidden Coastal Coves"
 IRE_X_ind_hidden_cove_desc:0 "In 1916 the Asgard ran aground at Banna Strand. The coves are still there. So are the signals."
 IRE_X_ind_smuggle_net:0 "Smuggling Supply Network"
 IRE_X_ind_smuggle_net_desc:0 "Checkpoints stop lorries, not men who know every boreen. Supply was never the problem - patience was."
 IRE_X_ind_border_route:0 "Northern Smuggling Route"
 IRE_X_ind_border_route_desc:0 "Donegal roads reach the border - officially for agriculture. The lorries run busier at night."
 IRE_X_ind_dundalk_depot:0 "Dundalk Depot"
 IRE_X_ind_dundalk_depot_desc:0 "The Belfast-Dublin line passes its midpoint here. One big warehouse, one assembly shed, porters who ask nothing."
 IRE_X_ind_german_tech:0 "German Technical Mission"
 IRE_X_ind_german_tech_desc:0 "Colonel Goertz's colleagues arrive with blueprints. The Germans cannot ship a factory, but they can ship the men who make one run."
 IRE_X_ind_s_plan_loot:0 "The S-Plan Dividend"
 IRE_X_ind_s_plan_loot_desc:0 "The fires of Coventry light up the ledger. Small production lines arrive piece by piece, reassembled in the countryside."
 IRE_X_ind_intel_net:0 "Black Intelligence Network"
 IRE_X_ind_intel_net_desc:0 "Every radio room, trading house and pub in Dublin is an ear. G2 watches everyone - and is used by everyone."
 IRE_X_ind_black_market:0 "Wartime Black Market"
 IRE_X_ind_black_market_desc:0 "What ration books cannot buy, the back of the shop can. The black market is a vulgar teacher - but it teaches well."

 IRE_connolly_column_idea:0 "Connolly Column"
 IRE_connolly_column_idea_desc:0 "Volunteers sail under the name of James Connolly. Recruiting is handled by the trades council, the rolls are sent to the Department of Defence, transport and equipment are listed separately, and the staff fixes the date of departure."
 IRE_belfast_momentum:0 "Strike Momentum"
 IRE_belfast_momentum_desc:0 "The strike ends on the workers' terms, and the yards and mills restart. Civilian factory construction proceeds on the new schedule, with materials allotted first by the local authorities. The unions and the management conclude a return-to-work agreement and refer disputes to arbitration."
 IRE_green_arms_speed:0 "Green Action Production Lines"
 IRE_green_arms_speed_desc:0 "German engineers have entered the Irish military works and are converting production lines to German drawings. The Department of Defence assigns inspectors, machinery is landed at the ports, and output returns go to the Ordnance Corps monthly."
 IRE_R_ind_expropriation_eff:0 "Expropriation and Self-Management"
 IRE_R_ind_expropriation_eff_desc:0 "Factory output +4.8%, consumer goods -4%, resources +5%."
 IRE_R_ind_peat_eff:0 "Energy Independence"
 IRE_R_ind_peat_eff_desc:0 "Resources +15%, fuel capacity +15%, fuel gain +10%, infrastructure speed +10%."
 IRE_R_ind_shannon_eff:0 "Belt Rhythm"
 IRE_R_ind_shannon_eff_desc:0 "Construction speed +12%."
 IRE_R_ind_rural_eff:0 "Village Current"
 IRE_R_ind_rural_eff_desc:0 "Factory output +3.2%, consumer goods -3%."
 IRE_R_ind_cooperative_eff:0 "Cooperative Network"
 IRE_R_ind_cooperative_eff_desc:0 "Consumer goods -6%, resources +5%."
 IRE_R_ind_arms_eff:0 "Arms Mobilization Order"
 IRE_R_ind_arms_eff_desc:0 "Factory output +6%, stability -3%, consumer goods +2%."
 IRE_R_ind_limerick_eff:0 "Estuary Yards"
 IRE_R_ind_limerick_eff_desc:0 "Dockyard output +6%."
 IRE_R_ind_workers_eff:0 "Workers' Self-Management"
 IRE_R_ind_workers_eff_desc:0 "Factory output +6%, consumer goods -5%, construction speed +15%, research speed +5%."
 IRE_X_ind_cottage_eff:0 "Dispersed Inefficiency"
 IRE_X_ind_cottage_eff_desc:0 "Dispersal means inefficiency. Factory output -5%."
 IRE_X_ind_hidden_cove_eff:0 "Hidden Yard"
 IRE_X_ind_hidden_cove_eff_desc:0 "Dockyard output +6%."
 IRE_X_ind_smuggle_eff:0 "Smugglers' Web"
 IRE_X_ind_smuggle_eff_desc:0 "Supply consumption -15%, out-of-supply penalty -25%, fuel capacity +20%, army speed +5%."
 IRE_X_ind_german_eff:0 "German Equipment"
 IRE_X_ind_german_eff_desc:0 "Factory output +6%."
 IRE_X_ind_s_loot_eff:0 "Captured Production Lines"
 IRE_X_ind_s_loot_eff_desc:0 "Factory output +4.8%."
 IRE_eng_s_plan_damage:0 "S-Plan Sabotage"
 IRE_eng_s_plan_damage_desc:0 "Sabotage parties from Ireland and Germany strike British factories and railways, and stoppages and repairs follow one another. The board of trade enters the losses in its quarterly report, and insurance claims are settled at new rates."
 IRE_X_ind_intel_eff:0 "Black Intelligence Network"
 IRE_X_ind_intel_eff_desc:0 "Decryption +15%, encryption +15%."
 IRE_X_ind_black_market_eff:0 "Black Market Economy"
 IRE_X_ind_black_market_eff_desc:0 "Consumer goods -6%, factory output +4.8%."

 IRE_R_ind_steel_coop:0 "Steel Cooperatives"
 IRE_R_ind_steel_coop_desc:0 "Worker-run steel combines feed girders and rails to every worksite."
 IRE_R_ind_red_arsenal:0 "Red Arsenal"
 IRE_R_ind_red_arsenal_desc:0 "The workers' republic has its own arms works, turning out rifles by the battalion."
 IRE_X_ind_uboat_dock:0 "U-boat Supply Dock"
 IRE_X_ind_uboat_dock_desc:0 "A concealed supply dock fuelling and arming ships crossing the Atlantic."
 IRE_X_ind_assembly:0 "German Assembly Works"
 IRE_X_ind_assembly_desc:0 "Repair and assembly shops running on German parts bring the border depots' weapons back to life."

 ire.108.c:0 "Keep it in Dublin's vaults a while longer. Watch Moscow."
 ire.110.t:0 "The Odessa Bill"
 ire.110.d:0 "Three months on, a Soviet freighter rides quietly in Dublin Bay. Her captain carries a message from Moscow: the gold should come home. Every left-wing paper in the world awaits our answer."
 ire.110.a:0 "Return it in full - honour outweighs gold."
 ire.110.b:0 "To hell with it. Ireland is nobody's counting-house."
 ire.110.c:0 "Split the difference: return half, convert the rest to arms."

 # ===== Part 5: Endgame storylines v2.6.0 =====
 IRE_R_end_trinity:0 "The Dublin Cell"
 IRE_R_end_trinity_desc:0 "In the back stairs of Trinity College, the left-wing reading circle decides to move their seminars to Liverpool and Glasgow. Names, tickets and printing press are ready."
 IRE_R_end_radio:0 "The Red Banner Radio"
 IRE_R_end_radio_desc:0 "Every night a medium-wave signal from Dublin crosses the Irish Sea. Manchester's night-shift workers turn the dial and find a reliable voice in the static."
 IRE_R_end_birmingham:0 "Shop-Floor Networks"
 IRE_R_end_birmingham_desc:0 "Birmingham's workshops and the Clyde shipyards - couriers with lists and leaflets visit every canteen."
 IRE_R_end_red_britain:0 "Red Britain"
 IRE_R_end_red_britain_desc:0 "From the Tyne to the Thames, red flags rise over boiler-house windows. London's police commissioner concedes in his report: this is no longer a policing matter."
 IRE_R_end_spark:0 "The Border Spark"
 IRE_R_end_spark_desc:0 "Belfast's civil-rights marchers are dispersed by water cannon; the crowd returns the next day. Northern workers stand together behind the barricades, regardless of creed."
 IRE_R_end_ulster:0 "Ulster Returns"
 IRE_R_end_ulster_desc:0 "When three hundred thousand from the yards and mills flood the streets, Westminster finally understands: keeping Ulster costs more than letting go."
 IRE_R_end_eve:0 "Eve of Revolution"
 IRE_R_end_eve_desc:0 "In a safe house, Dublin and the British comrades talk through the night. Lists are drawn, signals agreed - only the word remains."
 IRE_R_end_ignite:0 "Ignite the Revolution"
 IRE_R_end_ignite_desc:0 "The telephone exchange conveniently fails and the Royal Armoured Corps stays in barracks. When the sun rises the red flag flies over Downing Street - and many other streets besides. If London is already ruled by a socialist government, the civil war is skipped and an Anglo-Irish union is pressed instead."
 IRE_R_end_union:0 "The British Union"
 IRE_R_end_union_desc:0 "One flag, one revolution. The Dail reserves seats for Britain's delegates - from Iceland to the French border, the British-Irish Socialist Federation is proclaimed."
 IRE_R_lib_paris:0 "For Paris"
 IRE_R_lib_paris_desc:0 "The heirs of the Commune are waiting for the signal."
 IRE_R_lib_lowlands:0 "Low Countries & Rhine"
 IRE_R_lib_lowlands_desc:0 "The crane operators of the ports have already chosen their strike day."
 IRE_R_lib_iberia:0 "Iberian Spring"
 IRE_R_lib_iberia_desc:0 "The veterans of the International Brigades have come home - this time for their own."
 IRE_R_lib_italy:0 "Fire in the Apennines"
 IRE_R_lib_italy_desc:0 "Turin's factory councils have taken over the shops again."
 IRE_R_lib_danube:0 "Danube Federation"
 IRE_R_lib_danube_desc:0 "Vienna, Budapest, Prague - the empire's shards can be reassembled into something else."
 IRE_R_lib_balkans:0 "Balkan Dawn"
 IRE_R_lib_balkans_desc:0 "The men in the mountains have waited long enough."
 IRE_R_lib_elbe:0 "Elbe to Vistula"
 IRE_R_lib_elbe_desc:0 "From Hamburg to Warsaw, the factory councils raise the red flag as one."
 IRE_R_lib_north:0 "Sisters of the North"
 IRE_R_lib_north_desc:0 "Stockholm's docks and Helsinki's forests receive the same signal."
 IRE_R_lib_india:0 "India's Declaration"
 IRE_R_lib_india_desc:0 "The soviets of Bombay and Calcutta read out the declaration of independence."
 IRE_R_lib_africa:0 "The Year of Africa"
 IRE_R_lib_africa_desc:0 "From Cairo to the Cape, the colonisers' flags come down one by one."
 IRE_R_lib_asia:0 "Expedition to the Indies"
 IRE_R_lib_asia_desc:0 "In the rubber plantations, the coolies hear the word 'soviet' for the first time."
 IRE_R_lib_mideast:0 "Oil of the Middle East"
 IRE_R_lib_mideast_desc:0 "The wells of Mosul and the streets of Baghdad shout the same slogan."
 IRE_R_lib_canada:0 "Beneath the Maple Leaf"
 IRE_R_lib_canada_desc:0 "The workers of Toronto and Montreal ask to join the federation."
 IRE_R_lib_wallstreet:0 "Death Knell of Wall Street"
 IRE_R_lib_wallstreet_desc:0 "The last hard fight of the world revolution. The bankers are already packing the gold."
 IRE_R_lib_latam:0 "Latin Echoes"
 IRE_R_lib_latam_desc:0 "From Mexico to Argentina, the echo is spreading."

 IRE_X_end_planning:0 "Joint Planning"
 IRE_X_end_planning_desc:0 "In the General Staff's map room in Berlin hangs a new chart marking the landing beaches of Liverpool. The Irish staff officers bring tide tables and pilots."
 IRE_X_end_sealion:0 "The Sealion Flank"
 IRE_X_end_sealion_desc:0 "Sealion needs a springboard. Ireland provides airfields, harbours and thirty supply dumps that ask no questions."
 IRE_X_end_liverpool:0 "March on Liverpool"
 IRE_X_end_liverpool_desc:0 "The Green Jackets and German armour move together - one across the sea, one through Ireland. London will find itself facing two fires at once."
 IRE_X_end_westburg:0 "Western Bastion of the New Order"
 IRE_X_end_westburg_desc:0 "At the treaty table in Berlin, the Irish delegate smiles and opens his map first. Disposal of the British mainland belongs to Dublin - as Berlin long ago promised."
 IRE_X_ord_west:0 "Securing Western Europe"
 IRE_X_ord_west_desc:0 "The New Order begins its tidying at home."
 IRE_X_ord_lowlands:0 "Low Countries & Rhine"
 IRE_X_ord_lowlands_desc:0 "The port authorities of Rotterdam and Antwerp are about to change hands."
 IRE_X_ord_iberia:0 "Order in Iberia"
 IRE_X_ord_iberia_desc:0 "Lisbon's and Bilbao's merchants are recalculating the new tariffs."
 IRE_X_ord_italy:0 "Eagle of the Apennines"
 IRE_X_ord_italy_desc:0 "Rome's position requires recalibration."
 IRE_X_ord_danube:0 "The Danube Submits"
 IRE_X_ord_danube_desc:0 "Vienna, Budapest, Prague - the cities of Central Europe will learn the new rules."
 IRE_X_ord_balkans:0 "New Order in the Balkans"
 IRE_X_ord_balkans_desc:0 "The new mayors of Belgrade and Sofia have drawn up their lists."
 IRE_X_ord_elbe:0 "Elbe to Vistula"
 IRE_X_ord_elbe_desc:0 "From Hamburg to Warsaw the paperwork of the New Order is standardised."
 IRE_X_ord_north:0 "The North Submits"
 IRE_X_ord_north_desc:0 "Scandinavian iron ore will sail to new destinations."
 IRE_X_ord_india:0 "New Order in India"
 IRE_X_ord_india_desc:0 "The governor's residences of Delhi and Bombay are changing their plaques."
 IRE_X_ord_africa:0 "The Year of Africa"
 IRE_X_ord_africa_desc:0 "From Cairo to the Cape, the flags are due for replacement."
 IRE_X_ord_asia:0 "New Order in the Indies"
 IRE_X_ord_asia_desc:0 "Rubber, tin and harbours - the ledgers of the Indies are re-registered."
 IRE_X_ord_mideast:0 "Oil of the Middle East"
 IRE_X_ord_mideast_desc:0 "The pipelines of Mosul and Abadan now flow toward new allies."
 IRE_X_ord_canada:0 "Order in North America"
 IRE_X_ord_canada_desc:0 "Parliament Hill in Ottawa will come to a new understanding of the word 'sovereignty'."
 IRE_X_ord_wallstreet:0 "The Last Enemy"
 IRE_X_ord_wallstreet_desc:0 "The last enemy of the New Order allies with no one."
 IRE_X_ord_latam:0 "Latin Echoes"
 IRE_X_ord_latam_desc:0 "The German Club of Buenos Aires has ordered more champagne."

 IRE_ENG_red_radio:0 "Waves to the Workers"
 IRE_ENG_red_radio_desc:0 "Dublin's European service broadcasts on schedule each evening, and aerials go up on the roofs of the workers' districts. The propaganda branch arranges the programmes weekly, and scripts are cleared before transmission. Reception is reported monthly by the county police to the Home Office."
 IRE_ENG_red_strike:0 "The Strike Wave"
 IRE_ENG_red_strike_desc:0 "The machines of Birmingham and Clydeside stop, and crowds gather outside the factory gates. The strike committee sends its list to London, and the local police take up positions on Home Office orders. The management refuses to negotiate, and output is kept up by partial return to work."
 IRE_R_intel_network:0 "The Infiltration Network"
 IRE_R_intel_network_desc:0 "From the docks to the clubs, Dublin's ears are everywhere in Britain. Decryption and encryption improved."
 IRE_R_red_volunteers:0 "Volunteer Corps of the Revolution"
 IRE_R_red_volunteers_desc:0 "The queue outside Dublin's General Post Office stretches around the block. Volunteer cap +2."
 IRE_world_revolution_hq:0 "HQ of World Revolution"
 IRE_world_revolution_hq_desc:0 "Telegrams from Dublin fix the hour of risings abroad; couriers, cipher books and funds are allotted by district, the calendar of propaganda and action is set at headquarters, and each branch reports monthly."
 IRE_berlin_partner:0 "Partner of Berlin"
 IRE_berlin_partner_desc:0 "Berlin trusts us because each needs the other. German advisers are stationed in Dublin, defence orders and raw materials are covered by a separate agreement, and technical drawings are delivered under it. The correspondence is filed with External Affairs."
 IRE_atlantic_fortress:0 "The Atlantic Rampart"
 IRE_atlantic_fortress_desc:0 "From Belfast to Brest the Atlantic coast is brought into one defence system. Fortress commands are set by sector, with coast artillery, radar and patrols under a single schedule, and the arrangement takes effect on exchange of notes."

 ire.111.t:0 "The Lilies of Belfast"
 ire.111.d:0 "Not a shot fired. The administration of Northern Ireland changed hands on a damp Tuesday morning, and the flag over the city hall is the Tricolour now. London's papers print a corner column; Belfast fires salutes all day."
 ire.111.a:0 "Raise the Tricolour over the City Hall."
 ire.111.b:0 "Amnesty and reconciliation - let the past be the past."
 ire.111.c:0 "Build new posts along the border."
 ire.112.t:0 "The British Winter"
 ire.112.d:0 "Red flags over Manchester and Glasgow. London declares a state of emergency, but a third of the Royal Navy's sailors refuse to board. The revolution has crossed the Irish Sea - only one question remains: whose side are we on?"
 ire.112.a:0 "Order the volunteers across the sea at once."
 ire.112.b:0 "Send the comrades arms at the docks."
 ire.112.c:0 "Wait and see."
 ire.113.t:0 "Red Flag and Tricolour"
 ire.113.d:0 "Two islands, one revolution. The British delegation signs the joint declaration at Dublin Castle: from Cork to Aberdeen there is now one country. Europe's newspapers need only one word: FINISHED."
 ire.113.a:0 "One nation, one conviction."
 ire.113.b:0 "The Royal Navy's anchor is ours now."
 ire.113.c:0 "Make land and work for the new citizens."
 ire.114.t:0 "Dividing the Western Bastion"
 ire.114.d:0 "Britain has surrendered. At the treaty table in Berlin, Ribbentrop smiles and invites the Irish delegate to speak first - this is the share Berlin promised, and the touchstone of future cooperation."
 ire.114.a:0 "Ireland claims the whole mainland."
 ire.114.b:0 "Cede northern England for Berlin's trust."
 ire.114.c:0 "The mainland for us, the colonies for Germany."

 IRE_defend_cat:0 "Defend Ireland"
 IRE_defend_ireland_1:0 "Defend Ireland (National Alert)"
 IRE_defend_ireland_1_desc:0 "War is at the door. Lookout posts, the Local Defence Force and every man willing to take up a rifle are folded into the line, with recruiting stations in each county and sectors marked along the coast. Orders pass through Army Headquarters, and the rolls are filed with the Department of Defence."
 IRE_defend_ireland_2:0 "Defend Ireland (Scorched Earth)"
 IRE_defend_ireland_2_desc:0 "The enemy has set foot on Irish soil. The government burns files, requisitions vehicles and evacuates the cities, and each village is designated a strongpoint by sector. Instructions pass through the county councils, and returns are made daily to the cabinet."
 IRE_defend_ireland_3:0 "Defend Ireland (Total Resistance)"
 IRE_defend_ireland_3_desc:0 "Rumours of surrender circulate in Dublin, yet the recruiting stations still have queues. The island moves onto a war footing, with logistics, factories and farms placed at the disposal of the front. Requisition schedules and rationing are issued after cabinet approval."
 IRE_defend_ireland_4:0 "Defend Ireland (Last Redoubt)"
 IRE_defend_ireland_4_desc:0 "Guns can be heard from the capital. The regular army, the Local Defence Force and overseas volunteers man the line around Dublin; works are allotted by sector, and fire is controlled by the artillery. The defence order is issued over the Chief of Staff's signature."
 IRE_defend_ireland_5:0 "Defend Ireland (Indomitable Isle)"
 IRE_defend_ireland_5_desc:0 "The government refuses to surrender, and the radio carries the announcement without pause. From Belfast to Cork every town organises its own resistance, and local committees take over policing and supply. Returns are collected by the county councils for the cabinet."
 IRE_defend_levy_1:0 "Mobilise the Local Defence Force"
 IRE_defend_levy_1_desc:0 "Two Local Defence Force companies are called up and assembled at a designated camp in Dublin. Roll call, issue of arms and supply are handled by the district command, with quarters and messing arranged separately. The muster roll and the numbers present go to Army Headquarters."
 IRE_defend_levy_2:0 "Call Up the Reserves"
 IRE_defend_levy_2_desc:0 "Reservists are drafted into the regular army, and stockpiled rifles and ammunition are issued against the rolls. Medical inspection and posting are done at district level, and section leaders are seconded from active units. The attendance returns are written off by Defence and filed, deficiencies to be made good."
 IRE_defend_levy_3:0 "Arm Every Village"
 IRE_defend_levy_3_desc:0 "Weapons are distributed to the counties, and village self-defence units are organised. Firearms are registered with the county council, instructors are seconded from the army, and training and duty rosters are issued together. Ammunition is held in a separate locker and checked monthly."
 IRE_defend_levy_4:0 "The Dublin Line"
 IRE_defend_levy_4_desc:0 "A defensive line is built around Dublin, with the regular army and the Wild Geese volunteers committed together. Works are let by sector, fire plans are set by the artillery branch, and units report on taking up position to the general staff."
 IRE_defend_levy_5:0 "Total Mobilisation"
 IRE_defend_levy_5_desc:0 "The whole island is mobilised. Every man who can carry a rifle is posted to a county unit, factories and transport are requisitioned, and civil administration passes to the local committees. The order is issued by Army Headquarters after cabinet signature, and the rolls are consolidated."
 IRE_defend_last_levy:0 "The Last Levy"
 IRE_defend_last_levy_desc:0 "The last reserves continue to be called up and posted against the deficiencies at the front. Orders are issued district by district, with medical inspection and movement handled together. The supplementary rolls go to Army Headquarters, and the county councils pursue those who fail to report."

 IRE_B_bord_na_mona:0 "Bord na Mona"
 IRE_B_bord_na_mona_desc:0 "The Turf Development Board opened cuttings in the midland bogs, and the turf went to new generating stations and fuel plants. The Electricity Supply Board ran transmission lines, and the Department of Supplies fixed coal quotas for industry and households."
 IRE_B_aer_lingus:0 "Aer Lingus"
 IRE_B_aer_lingus_desc:0 "The aviation branch and the shipping company have formed a joint airline, opening the Dublin-Bristol route first and extending to the continent. The civil aviation office issues the operating licence, and the Department of Defence assists with airfields and radio navigation."
 IRE_B_ida:0 "Industrial Development Authority"
 IRE_B_ida_desc:0 "The Industrial Development Authority is established by statute to offer factory sites, loans and tax relief to foreign firms. The Department of Industry and Commerce screens applications, and each proposal, with its estimate of employment, goes to the cabinet's economic committee."
 IRE_B_irish_shipping:0 "Irish Shipping"
 IRE_B_irish_shipping_desc:0 "Irish Shipping buys second-hand tonnage against government-guaranteed loans and sails under the Irish flag. The Department of Supplies sets import quotas, and masters are instructed to keep food and fuel moving on the wartime routes."
 IRE_B_national_army:0 "Expand the National Army"
 IRE_B_national_army_desc:0 "The Department of Defence reorganises the forces on a regular establishment, with ordnance, signals and transport corps. The staff college runs courses, officers are recruited by county and trained together, and the establishment goes to the Dail."
 IRE_B_diaspora_bonds:0 "Diaspora War Bonds"
 IRE_B_diaspora_bonds_desc:0 "The Department of Finance opens bond offices in Boston, New York and Chicago, with local Irish societies collecting on its behalf. Remittances are converted on arrival in Dublin and entered in the war loan ledger."
 IRE_bord_na_mona:0 "Bord na Mona"
 IRE_bord_na_mona_desc:0 "The national peat board has made the bogs a source of power and reduced dependence on imported fuel. The cuttings are marked out by county, the peat is allotted to the stations and to domestic supply, and rail and canal share the carriage."
 IRE_aer_lingus:0 "Aer Lingus"
 IRE_aer_lingus_desc:0 "The state airline opens European and North Atlantic routes year by year; the aviation board arranges aerodromes, fuel and slots, and passengers, freight and mail are carried together. The board is appointed by the Department of Transport and the accounts are published."
 IRE_ida:0 "Industrial Development Authority"
 IRE_ida_desc:0 "An industrial investment agency underwritten by the credit of the state, attracting foreign capital and technical knowledge and providing share capital and loans to new works. Its board is drawn from the Treasury, the Ministry of Industry and the chambers of commerce."
 IRE_irish_shipping:0 "Irish Shipping"
 IRE_irish_shipping_desc:0 "The merchant fleet under the green flag keeps the island's supply line open in wartime. The Department of Supplies fixes routes and cargoes, the Naval Service provides convoy liaison, and arrivals and sailings are entered in the schedule."
 IRE_national_army:0 "National Army"
 IRE_national_army_desc:0 "The Department of Defence maintains a small army trained on a regular establishment, with equipment and pay carried in the annual estimate. Units rotate on overseas duty, the staff prepares the mobilisation plan, and the establishment goes to the Dail defence committee."
 IRE_B_diaspora_bonds_idea:0 "Diaspora War Bonds"
 IRE_B_diaspora_bonds_idea_desc:0 "Emigrant remittances and volunteers reach Ireland through the Department of External Affairs and the churches. A separate account is kept at the Department of Finance, recruiting offices sit in the society halls, the rolls go monthly to the Department of Defence, and the accounts are published quarterly."
 IRE_econ_industry_bonus:0 "Industrial Technology Boost"
 IRE_B_air_bonus:0 "Aviation Technology Boost"

 IRE_memoir_cat:0 "New World Anecdotes"
 IRE_nw_guinness_export:0 "Guinness Export Quota"
 IRE_nw_guinness_export_desc:0 "The war leaves London's public houses dependent on Irish stout; the quota is settled between the Department of Commerce and Whitehall, export documents are cleared at the customs, and the exchange is entered to the Treasury. The customs checks quantities exported against the exchange receipts each quarter."
 IRE_nw_irish_coffee:0 "Irish Coffee at Foynes"
 IRE_nw_irish_coffee_desc:0 "In 1943 a chef at Foynes mixed coffee, whiskey and cream for transatlantic passengers held over. The drink has since entered the airport's standing instructions for reception, and the recipe is filed with the aviation board."
 IRE_nw_shannon_stopover:0 "Shannon Transatlantic Stopover"
 IRE_nw_shannon_stopover_desc:0 "Postwar transatlantic routes require a refuelling stop; Shannon is extended with runway and tankage, the aviation board fixes the slots, and customs and immigration desks are opened beside the apron. The airport is administered directly by the aviation board, and its staff are on the establishment."
 IRE_nw_quiet_man:0 "Hollywood Comes to Mayo"
 IRE_nw_quiet_man_desc:0 "In 1952 John Ford brought his company to County Mayo to shoot The Quiet Man; the tourist board arranged the locations, the civic guard kept order, and the film was shipped back to Hollywood."
 IRE_nw_celtic_tiger:0 "Celtic Tiger"
 IRE_nw_celtic_tiger_desc:0 "The Shannon Free Zone, low taxation and a young workforce are employed together; the Industrial Development Authority hears each application for a foreign plant, and the export returns are revised upward year by year. Licences for the export zone are issued by the Treasury."
 IRE_celtic_tiger:0 "Celtic Tiger"
 IRE_celtic_tiger_desc:0 "Openness, investment and education have brought the island onto the European economic track. The Industrial Development Authority screens foreign applications, the Department of Education is expanding the technical schools, and export figures are published quarterly."
 ire_nw.70.t:0 "The Amber of Guinness"
 ire_nw.70.d:0 "The London papers complain of short stout, and Guinness accordingly asks for a larger export quota, attaching the loading records of recent years. The Treasury notes the foreign exchange; the trade department worries about the home ration. The two departments disagree, and the file goes to the cabinet's economic committee, which will hear both next week."
 ire_nw.70.a:0 "Sell the stout to London."
 ire_nw.70.b:0 "Supply the home market first."
 ire_nw.71.t:0 "The First Irish Coffee at Foynes"
 ire_nw.71.d:0 "An American pilot waited at Foynes until dawn, his service cancelled for weather. Chef Sheridan added whiskey and cream to his coffee and asked how it tasted. The Pan American representative entered the matter in the duty book, the airport management sent a copy to Industry and Commerce, and the note appeared in the station's monthly bulletin."
 ire_nw.71.a:0 "Treat the American pilot to a cup."
 ire_nw.71.b:0 "Strict neutrality: coffee only."
 ire_nw.72.t:0 "The Shannon Transit Rights"
 ire_nw.72.d:0 "Transatlantic flights require a refuelling stop. Washington wants Shannon opened as a free civil hub; London wants military aircraft to use it as well. Two notes reach External Affairs in turn, both politely worded. The aviation board has put up a scheme for runway and fuel installations, and the cabinet must first settle the extent of transit."
 ire_nw.72.a:0 "Grant Allied aircraft transit."
 ire_nw.72.b:0 "Civilian traffic only."
 ire_nw.73.t:0 "Hollywood Comes to Mayo"
 ire_nw.73.d:0 "John Ford proposes to shoot a film about Ireland in County Mayo, and the company brings money, cameras and technicians. The news office and the county council have arranged locations, road use and extras, and the permit is issued by the Department of Industry and Commerce."
 ire_nw.73.a:0 "Give the production full support"
 ire_nw.73.b:0 "Leave the Mayo countryside alone"
 ire_nw.74.t:0 "The Celtic Tiger Years"
 ire_nw.74.d:0 "The lights of the Shannon Free Zone burn all night, and foreign factories are completed on the outskirts of Dublin. A new term is in use among economists for Ireland. The Industrial Development Authority handles fresh applications, and export figures are published monthly."
 ire_nw.74.a:0 "Let the Celtic Tiger run"

