 # ===== v2.5.0: Industrial lines / Gold demand / New ideas =====
 IRE_R_ind_expropriation:0 "Expropriation and Self-Management"
 IRE_R_ind_expropriation_desc:0 "The veterans of 1913 remember the factory committees. The bosses fled overnight and the workers took over the shops - output rose, though some would never clock in again."
 IRE_R_ind_peat_shannon:0 "Peat and the Shannon"
 IRE_R_ind_peat_shannon_desc:0 "The turbines at Ardnacrusha have spun on the Shannon for seven years. Ireland has no coal, but plenty of rain, peat, and stubborn engineers."
 IRE_R_ind_shannon_belt:0 "The Shannon Industrial Belt"
 IRE_R_ind_shannon_belt_desc:0 "With power came factories along the Limerick riverbanks - the Free State's first real manufacturing cluster."
 IRE_R_ind_rural_electrification:0 "Rural Electrification"
 IRE_R_ind_rural_electrification_desc:0 "Poles rise one by one into the green valleys. Each village station is tiny; together they are Ireland's light."
 IRE_R_ind_cooperative:0 "Cooperatives"
 IRE_R_ind_cooperative_desc:0 "The co-op's ledgers are cleaner than the government's. Same milk, same butter - cooperation makes the difference."
 IRE_R_ind_arms_drive:0 "Arms Drive"
 IRE_R_ind_arms_drive_desc:0 "Dublin's civilian workshops hang out military requisition notices. The Spanish proved it could be done - now it is our turn."
 IRE_R_ind_limerick_yard:0 "Limerick Yards"
 IRE_R_ind_limerick_yard_desc:0 "The small yards at the Shannon estuary mended trawlers, ferries and smugglers' boats. Now they will mend something else."
 IRE_R_ind_atlantic_trade:0 "Transatlantic Trade Station"
 IRE_R_ind_atlantic_trade_desc:0 "Flying boats lift from Foynes. War burns across Europe, and Ireland keeps the door to the New World."
 IRE_R_ind_workers_council:0 "Workers' Councils"
 IRE_R_ind_workers_council_desc:0 "In the workshops, the workers decide. This is the day Connolly did not live to see - but it has come."
 IRE_X_ind_cottage:0 "Dispersed Workshops"
 IRE_X_ind_cottage_desc:0 "Lathes in cottages, drills in cellars. Each one a legal repair shop - together, an assembly line."
 IRE_X_ind_hidden_cove:0 "Hidden Coastal Coves"
 IRE_X_ind_hidden_cove_desc:0 "In 1916 the Asgard ran aground at Banna Strand. The coves are still there. So are the signals."
 IRE_X_ind_smuggle_net:0 "Smuggling Supply Network"
 IRE_X_ind_smuggle_net_desc:0 "Checkpoints stop lorries, not men who know every boreen. Supply was never the problem - patience was."
 IRE_X_ind_border_route:0 "Northern Smuggling Route"
 IRE_X_ind_border_route_desc:0 "Donegal roads reach the border - officially for agriculture. The lorries run busier at night."
 IRE_X_ind_dundalk_depot:0 "Dundalk Depot"
 IRE_X_ind_dundalk_depot_desc:0 "The Belfast-Dublin line passes its midpoint here. One big warehouse, one assembly shed, porters who ask nothing."
 IRE_X_ind_german_tech:0 "German Technical Mission"
 IRE_X_ind_german_tech_desc:0 "Colonel Goertz's colleagues arrive with blueprints. The Germans cannot ship a factory, but they can ship the men who make one run."
 IRE_X_ind_s_plan_loot:0 "The S-Plan Dividend"
 IRE_X_ind_s_plan_loot_desc:0 "The fires of Coventry light up the ledger. Small production lines arrive piece by piece, reassembled in the countryside."
 IRE_X_ind_intel_net:0 "Black Intelligence Network"
 IRE_X_ind_intel_net_desc:0 "Every radio room, trading house and pub in Dublin is an ear. G2 watches everyone - and is used by everyone."
 IRE_X_ind_black_market:0 "Wartime Black Market"
 IRE_X_ind_black_market_desc:0 "What ration books cannot buy, the back of the shop can. The black market is a vulgar teacher - but it teaches well."

 IRE_connolly_column_idea:0 "Connolly Column"
 IRE_connolly_column_idea_desc:0 "Volunteers sail under James Connolly's name. Volunteer cap +8, division threshold requirement removed."
 IRE_belfast_momentum:0 "Strike Momentum"
 IRE_belfast_momentum_desc:0 "The strike won, and the workers are willing. Civilian factory construction speed +10%."
 IRE_green_arms_speed:0 "Green Action Production Lines"
 IRE_green_arms_speed_desc:0 "German production lines deploy in Ireland. Military factory construction speed +15%."
